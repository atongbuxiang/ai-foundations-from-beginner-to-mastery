<text x="675" y="590" text-anchor="start" font-size="11" font-weight="400" fill="#667784">关键 hard-gate 链接失效时，比例再高也不可发布。</text>
<line x1="50" y1="650" x2="1150" y2="650" stroke="#D9D5CB"/>
<text x="52" y="675" font-size="13" fill="#667784">Drift 是线索，版本 hash 是身份，Card 是证据索引；三者都不能单独证明因果、安全或发布就绪。</text>
