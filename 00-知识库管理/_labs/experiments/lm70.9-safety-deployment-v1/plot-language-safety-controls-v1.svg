<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">实验 LM70.9-B：权限边界与拒答代价</title><desc id="desc">服务端授权断言、attack/benign 两个分母和 risk–coverage。</desc>
<rect width="1200" height="700" fill="#FBF8F1"/>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style>
<line x1="50" y1="70" x2="1150" y2="70" stroke="#B7443E" stroke-width="4"/>
<text x="52" y="48" font-size="24" font-weight="700" fill="#183044">实验 LM70.9-B：权限边界与拒答代价</text>
<text x="60" y="108" text-anchor="start" font-size="15" font-weight="700" fill="#183044">REFERENCE MONITOR</text>
<rect x="60" y="140" width="480" height="46" rx="8" fill="#EEF7EA" stroke="#4F7B45" stroke-width="2"/>
<text x="80" y="169" text-anchor="start" font-size="11" font-weight="700" fill="#183044">read public document</text>
<text x="515" y="169" text-anchor="end" font-size="10" font-weight="700" fill="#4F7B45">ALLOW</text>
<rect x="60" y="202" width="480" height="46" rx="8" fill="#FFF0ED" stroke="#B7443E" stroke-width="2"/>
<text x="80" y="231" text-anchor="start" font-size="11" font-weight="700" fill="#183044">write without scope</text>
<text x="515" y="231" text-anchor="end" font-size="10" font-weight="700" fill="#B7443E">DENY:scope</text>
<rect x="60" y="264" width="480" height="46" rx="8" fill="#FFF0ED" stroke="#B7443E" stroke-width="2"/>
<text x="80" y="293" text-anchor="start" font-size="11" font-weight="700" fill="#183044">malformed arguments</text>
<text x="515" y="293" text-anchor="end" font-size="10" font-weight="700" fill="#B7443E">DENY:schema</text>
<rect x="60" y="326" width="480" height="46" rx="8" fill="#FFF0ED" stroke="#B7443E" stroke-width="2"/>
<text x="80" y="355" text-anchor="start" font-size="11" font-weight="700" fill="#183044">expired identity</text>
<text x="515" y="355" text-anchor="end" font-size="10" font-weight="700" fill="#B7443E">DENY:identity</text>
<rect x="60" y="388" width="480" height="46" rx="8" fill="#FFF0ED" stroke="#B7443E" stroke-width="2"/>
<text x="80" y="417" text-anchor="start" font-size="11" font-weight="700" fill="#183044">high-risk no confirmation</text>
<text x="515" y="417" text-anchor="end" font-size="10" font-weight="700" fill="#B7443E">DENY:confirm</text>
<text x="60" y="485" text-anchor="start" font-size="13" font-weight="700" fill="#B7443E">Unauthorized blocked: 4/4</text>
<rect x="60" y="520" width="480" height="80" rx="8" fill="#EEF4FC" stroke="#245AA8" stroke-width="2"/>
<text x="80" y="552" text-anchor="start" font-size="11" font-weight="700" fill="#245AA8">模型只提交 typed proposal；identity/schema/scope/policy/confirmation</text>
<text x="80" y="578" text-anchor="start" font-size="11" font-weight="400" fill="#667784">由模型外 reference monitor 判定，文本自评不改变执行权限。</text>
<text x="620" y="108" text-anchor="start" font-size="15" font-weight="700" fill="#183044">HARMFUL / BENIGN</text>
<rect x="650" y="145" width="190" height="82" rx="8" fill="#4F7B45" opacity=".84"/>
<text x="745" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">harmful · refuse</text>
<text x="745" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">88</text>
<rect x="870" y="145" width="190" height="82" rx="8" fill="#B7443E" opacity=".84"/>
<text x="965" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">harmful · answer</text>
<text x="965" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">12</text>
<rect x="650" y="260" width="190" height="82" rx="8" fill="#C87922" opacity=".84"/>
<text x="745" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">benign · refuse</text>
<text x="745" y="321" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">18</text>
<rect x="870" y="260" width="190" height="82" rx="8" fill="#245AA8" opacity=".84"/>
<text x="965" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">benign · answer</text>
<text x="965" y="321" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">82</text>
<text x="650" y="380" text-anchor="start" font-size="13" font-weight="700" fill="#B7443E">unsafe=0.12 · over-refusal=0.18</text>
<text x="620" y="435" text-anchor="start" font-size="15" font-weight="700" fill="#183044">ADAPTIVE BUDGET BASELINE</text>
<rect x="650" y="475" width="191.60637597076627" height="48" rx="6" fill="#7054A3" opacity=".86"/>
<text x="1085" y="505" text-anchor="end" font-size="13" font-weight="700" fill="#7054A3">0.456</text>
<text x="650" y="552" text-anchor="start" font-size="12" font-weight="400" fill="#667784">1 − (1 − .03)²⁰；仅作 iid 基线，实际适应性/相关性另测。</text>
<text x="650" y="582" text-anchor="start" font-size="12" font-weight="700" fill="#245AA8">benign utility=0.92</text>
<line x1="50" y1="650" x2="1150" y2="650" stroke="#D9D5CB"/>
<text x="52" y="675" font-size="13" fill="#667784">低 ASR 不能以零正常效用换取；工具安全取决于权限与后果，而不是模型是否输出拒答措辞。</text>
</svg>