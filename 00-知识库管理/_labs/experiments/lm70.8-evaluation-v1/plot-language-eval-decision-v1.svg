<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">实验 LM70.8-C：Oracle gap、Slice 风险与决策门</title><desc id="desc">逐层 intervention、失败率和 superiority/non-inferiority。</desc>
<rect width="1200" height="700" fill="#FBF8F1"/>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style>
<line x1="50" y1="70" x2="1150" y2="70" stroke="#4F7B45" stroke-width="4"/>
<text x="52" y="48" font-size="24" font-weight="700" fill="#183044">实验 LM70.8-C：Oracle gap、Slice 风险与决策门</text>
<text x="65" y="108" text-anchor="start" font-size="15" font-weight="700" fill="#183044">ORACLE LADDER</text>
<text x="65" y="173" text-anchor="start" font-size="12" font-weight="700" fill="#B7443E">end-to-end</text>
<rect x="225" y="145" width="215.0" height="45" rx="5" fill="#B7443E" opacity=".86"/>
<text x="670" y="173" text-anchor="end" font-size="12" font-weight="700" fill="#B7443E">0.50</text>
<text x="65" y="268" text-anchor="start" font-size="12" font-weight="700" fill="#17766E">gold retriever</text>
<rect x="225" y="240" width="301.0" height="45" rx="5" fill="#17766E" opacity=".86"/>
<text x="670" y="268" text-anchor="end" font-size="12" font-weight="700" fill="#17766E">0.70</text>
<text x="610" y="225" text-anchor="end" font-size="11" font-weight="700" fill="#17766E">Δ=+0.20</text>
<text x="65" y="363" text-anchor="start" font-size="12" font-weight="700" fill="#4F7B45">gold tool output</text>
<rect x="225" y="335" width="352.59999999999997" height="45" rx="5" fill="#4F7B45" opacity=".86"/>
<text x="670" y="363" text-anchor="end" font-size="12" font-weight="700" fill="#4F7B45">0.82</text>
<text x="610" y="320" text-anchor="end" font-size="11" font-weight="700" fill="#4F7B45">Δ=+0.12</text>
<text x="65" y="470" text-anchor="start" font-size="15" font-weight="700" fill="#183044">SLICE FAILURE</text>
<rect x="80" y="597.5" width="120" height="12.5" rx="5" fill="#B7443E" opacity=".82"/>
<text x="140" y="630" text-anchor="middle" font-size="11" font-weight="400" fill="#667784">general</text>
<text x="140" y="577.5" text-anchor="middle" font-size="11" font-weight="700" fill="#B7443E">5%</text>
<rect x="270" y="560.0" width="120" height="50.0" rx="5" fill="#B7443E" opacity=".82"/>
<text x="330" y="630" text-anchor="middle" font-size="11" font-weight="400" fill="#667784">long</text>
<text x="330" y="540.0" text-anchor="middle" font-size="11" font-weight="700" fill="#B7443E">20%</text>
<rect x="460" y="510.0" width="120" height="100.0" rx="5" fill="#B7443E" opacity=".82"/>
<text x="520" y="630" text-anchor="middle" font-size="11" font-weight="400" fill="#667784">high-risk</text>
<text x="520" y="490.0" text-anchor="middle" font-size="11" font-weight="700" fill="#B7443E">40%</text>
<text x="760" y="108" text-anchor="start" font-size="15" font-weight="700" fill="#183044">PRE-REGISTERED GATES</text>
<rect x="760" y="145" width="375" height="95" rx="9" fill="#EEF7EA" stroke="#4F7B45" stroke-width="2"/>
<text x="785" y="178" text-anchor="start" font-size="14" font-weight="700" fill="#4F7B45">PASS</text>
<text x="865" y="178" text-anchor="start" font-size="13" font-weight="700" fill="#183044">quality superiority</text>
<text x="785" y="210" text-anchor="start" font-size="12" font-weight="400" fill="#667784">+1.8 CI [+.4,+3.2]</text>
<rect x="760" y="275" width="375" height="95" rx="9" fill="#FFF0ED" stroke="#B7443E" stroke-width="2"/>
<text x="785" y="308" text-anchor="start" font-size="14" font-weight="700" fill="#B7443E">FAIL</text>
<text x="865" y="308" text-anchor="start" font-size="13" font-weight="700" fill="#183044">latency non-inferiority</text>
<text x="785" y="340" text-anchor="start" font-size="12" font-weight="400" fill="#667784">+12 CI [−3,+27] ms</text>
<rect x="760" y="405" width="375" height="95" rx="9" fill="#FFF0ED" stroke="#B7443E" stroke-width="2"/>
<text x="785" y="438" text-anchor="start" font-size="14" font-weight="700" fill="#B7443E">FAIL</text>
<text x="865" y="438" text-anchor="start" font-size="13" font-weight="700" fill="#183044">all hard gates</text>
<text x="785" y="470" text-anchor="start" font-size="12" font-weight="400" fill="#667784">不可用平均总分补偿</text>
<text x="760" y="565" text-anchor="start" font-size="13" font-weight="700" fill="#B7443E">micro failure=0.088</text>
<text x="760" y="592" text-anchor="start" font-size="12" font-weight="400" fill="#667784">总体通过不覆盖小样本高风险 slice。</text>
<line x1="50" y1="650" x2="1150" y2="650" stroke="#D9D5CB"/>
<text x="52" y="675" font-size="13" fill="#667784">Oracle gap 定位当前管线的干预差；决策仍必须逐项满足预注册质量、风险、延迟、成本与 slice 门。</text>
</svg>