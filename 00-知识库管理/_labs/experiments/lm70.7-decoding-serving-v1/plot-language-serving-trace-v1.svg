<text x="70" y="590" text-anchor="start" font-size="13" font-weight="700" fill="#B7443E">总 blocks=7；最后块空位=16 tokens。分页降低 max-length 预留，但仍有末块与 metadata 成本。</text>
<line x1="50" y1="650" x2="1150" y2="650" stroke="#D9D5CB"/>
<text x="52" y="675" font-size="13" fill="#667784">这是时间戳与容量算例；真实 TTFT/TBT 必须在给定 arrival、长度、硬件和 scheduler 下测量。</text>
