<rect x="285" y="488" width="487.5" height="24" rx="4" fill="#C87922"/>
<text x="950" y="505" font-size="12" fill="#183044">0.750</text>
<line x1="48" y1="575" x2="1052" y2="575" stroke="#D9D5CB"/>
<text x="50" y="598" font-size="12" fill="#667784">A high early-stage score does not imply downstream success; keep stage-level IDs and denominators.</text>
