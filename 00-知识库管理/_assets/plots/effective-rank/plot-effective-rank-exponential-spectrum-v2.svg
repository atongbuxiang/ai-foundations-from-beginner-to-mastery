<text class="title" x="600.0" y="35" text-anchor="middle">有效秩不是唯一数字：定义决定你在测什么</text>
<text class="note" x="600.0" y="66" text-anchor="middle">σᵢ=exp(−α(i−1))，维数 64；横轴增大表示奇异谱更集中</text>
