<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">DYN-10 Itô、SDE 数值与离散梯度审计</title>
<desc id="desc">三面板展示左端点与梯形随机和的二次变差修正、Euler–Maruyama 对几何 Brownian 运动的强弱误差，以及离散灵敏度、有限差分和连续目标之间的误差。</desc>
<rect width="1200" height="430" fill="#ffffff"/>
<text x="20" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="20" font-weight="700" fill="#0f172a">DYN-10 可复现实验：积分解释 → 强/弱误差 → 离散梯度</text>

<rect x="20" y="55" width="370" height="355" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="42" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="18.5" font-weight="700" fill="#0f172a">A　左端点记住二次变差</text>
<line x1="75" y1="315" x2="350" y2="315" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="75" y1="130" x2="75" y2="315" stroke="#94a3b8" stroke-width="1.2"/>
<polyline points="350.00,168.57 304.17,186.90 258.33,205.57 212.50,225.00 166.67,244.03 120.83,263.03 75.00,283.43" fill="none" stroke="#2563eb" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="350.00" cy="168.57" r="3.5" fill="#2563eb"/>
<circle cx="304.17" cy="186.90" r="3.5" fill="#2563eb"/>
<circle cx="258.33" cy="205.57" r="3.5" fill="#2563eb"/>
<circle cx="212.50" cy="225.00" r="3.5" fill="#2563eb"/>
<circle cx="166.67" cy="244.03" r="3.5" fill="#2563eb"/>
<circle cx="120.83" cy="263.03" r="3.5" fill="#2563eb"/>
<circle cx="75.00" cy="283.43" r="3.5" fill="#2563eb"/>
<text x="92" y="119" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="600" fill="#2563eb">RMSE of Ito left sum</text>
<text x="92" y="342" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#475569">step h (coarser →)</text>
<text x="48" y="232" transform="rotate(-90 48 232)" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#475569">log error</text>
<text x="74" y="365" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="600" fill="#0f172a">observed order = 0.503</text>
<text x="74" y="387" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#059669">mean(trap − left) → 0.5; finest=0.4993</text>

<rect x="410" y="55" width="370" height="355" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="432" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="18.5" font-weight="700" fill="#0f172a">B　同一 Brownian path 下验收 EM</text>
<line x1="465" y1="315" x2="740" y2="315" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="465" y1="130" x2="465" y2="315" stroke="#94a3b8" stroke-width="1.2"/>
<polyline points="740.00,148.80 694.17,154.79 648.33,161.75 602.50,169.90 556.67,177.30 510.83,184.30 465.00,191.53" fill="none" stroke="#ea580c" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="740.00" cy="148.80" r="3.5" fill="#ea580c"/>
<circle cx="694.17" cy="154.79" r="3.5" fill="#ea580c"/>
<circle cx="648.33" cy="161.75" r="3.5" fill="#ea580c"/>
<circle cx="602.50" cy="169.90" r="3.5" fill="#ea580c"/>
<circle cx="556.67" cy="177.30" r="3.5" fill="#ea580c"/>
<circle cx="510.83" cy="184.30" r="3.5" fill="#ea580c"/>
<circle cx="465.00" cy="191.53" r="3.5" fill="#ea580c"/>
<polyline points="740.00,218.64 694.17,232.51 648.33,246.55 602.50,260.67 556.67,274.83 510.83,289.01 465.00,303.20" fill="none" stroke="#059669" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="740.00" cy="218.64" r="3.5" fill="#059669"/>
<circle cx="694.17" cy="232.51" r="3.5" fill="#059669"/>
<circle cx="648.33" cy="246.55" r="3.5" fill="#059669"/>
<circle cx="602.50" cy="260.67" r="3.5" fill="#059669"/>
<circle cx="556.67" cy="274.83" r="3.5" fill="#059669"/>
<circle cx="510.83" cy="289.01" r="3.5" fill="#059669"/>
<circle cx="465.00" cy="303.20" r="3.5" fill="#059669"/>
<text x="482" y="118" font-family="Georgia,'Times New Roman',serif" font-size="12.8" font-weight="600" fill="#ea580c">strong endpoint RMSE: p=0.510</text>
<text x="482" y="140" font-family="Georgia,'Times New Roman',serif" font-size="12.8" font-weight="600" fill="#059669">weak mean bias: p=0.993</text>
<text x="482" y="342" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#475569">step h (coarser →)</text>
<text x="438" y="232" transform="rotate(-90 438 232)" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#475569">log error</text>
<text x="464" y="375" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="12.5" fill="#0f172a">强误差追踪同一路径；弱误差只比较期望</text>

<rect x="800" y="55" width="380" height="355" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="822" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="18.5" font-weight="700" fill="#0f172a">C　先验收离散目标，再谈连续极限</text>
<line x1="855" y1="315" x2="1130" y2="315" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="855" y1="130" x2="855" y2="315" stroke="#94a3b8" stroke-width="1.2"/>
<polyline points="1130.00,142.35 1084.17,143.61 1038.33,145.69 992.50,148.77 946.67,153.74 900.83,156.30 855.00,157.14" fill="none" stroke="#7c3aed" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1130.00" cy="142.35" r="3.5" fill="#7c3aed"/>
<circle cx="1084.17" cy="143.61" r="3.5" fill="#7c3aed"/>
<circle cx="1038.33" cy="145.69" r="3.5" fill="#7c3aed"/>
<circle cx="992.50" cy="148.77" r="3.5" fill="#7c3aed"/>
<circle cx="946.67" cy="153.74" r="3.5" fill="#7c3aed"/>
<circle cx="900.83" cy="156.30" r="3.5" fill="#7c3aed"/>
<circle cx="855.00" cy="157.14" r="3.5" fill="#7c3aed"/>
<polyline points="1130.00,309.65 1084.17,304.14 1038.33,301.48 992.50,303.37 946.67,303.40 900.83,302.65 855.00,302.23" fill="none" stroke="#2563eb" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1130.00" cy="309.65" r="3.5" fill="#2563eb"/>
<circle cx="1084.17" cy="304.14" r="3.5" fill="#2563eb"/>
<circle cx="1038.33" cy="301.48" r="3.5" fill="#2563eb"/>
<circle cx="992.50" cy="303.37" r="3.5" fill="#2563eb"/>
<circle cx="946.67" cy="303.40" r="3.5" fill="#2563eb"/>
<circle cx="900.83" cy="302.65" r="3.5" fill="#2563eb"/>
<circle cx="855.00" cy="302.23" r="3.5" fill="#2563eb"/>
<text x="872" y="118" font-family="Georgia,'Times New Roman',serif" font-size="12.7" font-weight="600" fill="#7c3aed">pathwise gradient gap: p=0.604</text>
<text x="872" y="140" font-family="Georgia,'Times New Roman',serif" font-size="12.7" font-weight="600" fill="#2563eb">discrete tangent vs finite difference</text>
<text x="872" y="342" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#475569">step h (coarser →)</text>
<text x="828" y="232" transform="rotate(-90 828 232)" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#475569">log error</text>
<text x="855" y="375" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="12.4" fill="#0f172a">FD 只验证同一个 J_h；它不证明 J_h = J</text>
</svg>
