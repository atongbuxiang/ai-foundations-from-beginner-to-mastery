<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Itô 和、SDE 强弱误差与离散梯度审计</title>
<desc id="desc">固定 seed 与 nested Brownian increments 下，三面板分别报告 Itô 左端点和的收敛及二次变差修正、Euler–Maruyama 对 GBM 的强弱误差、离散梯度与有限差分和连续目标之间的误差。</desc>
