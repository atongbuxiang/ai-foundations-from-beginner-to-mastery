<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Fokker–Planck、概率流与 score/solver 误差审计</title>
<desc id="desc">三面板分别报告 OU Fokker–Planck 守恒有限体积的网格收敛、相同 one-time marginals 下 SDE 与 probability-flow ODE 的不同 quadratic variation，以及 score multiplicative error 对终端方差的偏差。</desc>
<rect width="1200" height="600" fill="#fbfaf7"/>
<line x1="400.0" y1="35.0" x2="400.0" y2="525.0" stroke="#d5dee8" stroke-width="2"/>
<line x1="800.0" y1="35.0" x2="800.0" y2="525.0" stroke="#d5dee8" stroke-width="2"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;font-variant-numeric:tabular-nums lining-nums}</style>
<text x="42.0" y="60.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="24" font-weight="750" fill="#2f6fec" text-anchor="start">A</text>
<text x="80.0" y="60.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="21" font-weight="700" fill="#25313d" text-anchor="start">守恒 FPE 的网格收敛</text>
<text x="430.0" y="60.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="24" font-weight="750" fill="#0f7f75" text-anchor="start">B</text>
<text x="468.0" y="60.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="21" font-weight="700" fill="#25313d" text-anchor="start">同 marginals、不同 QV</text>
<text x="830.0" y="60.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="24" font-weight="750" fill="#c94134" text-anchor="start">C</text>
<text x="868.0" y="60.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="21" font-weight="700" fill="#25313d" text-anchor="start">score 偏差与 solver 偏差</text>
<line x1="75.0" y1="375.0" x2="355.0" y2="375.0" stroke="#25313d" stroke-width="1.6"/>
<line x1="75.0" y1="115.0" x2="75.0" y2="375.0" stroke="#25313d" stroke-width="1.6"/>
<line x1="75.0" y1="245.0" x2="355.0" y2="245.0" stroke="#d5dee8" stroke-width="1" stroke-dasharray="4 5"/>
<text x="75.0" y="402.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="15" font-weight="500" fill="#66778c" text-anchor="start">fine dx</text>
<text x="355.0" y="402.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="15" font-weight="500" fill="#66778c" text-anchor="end">coarse dx</text>
<text x="42.0" y="258.0" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="500" fill="#66778c" text-anchor="middle">log10 L1 error</text>
<polyline points="355.00,153.40 215.00,243.62 75.00,336.60" fill="none" stroke="#2f6fec" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="355.00" cy="153.40" r="4.2" fill="#fbfaf7" stroke="#2f6fec" stroke-width="2.2"/><circle cx="215.00" cy="243.62" r="4.2" fill="#fbfaf7" stroke="#2f6fec" stroke-width="2.2"/><circle cx="75.00" cy="336.60" r="4.2" fill="#fbfaf7" stroke="#2f6fec" stroke-width="2.2"/>
<text x="82.0" y="101.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="15" font-weight="650" fill="#2f6fec" text-anchor="start">OU finite volume  p=0.951</text>
<text x="82.0" y="425.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="15" font-weight="600" fill="#0f7f75" text-anchor="start">max mass drift=2.22e-16</text>
<text x="82.0" y="454.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="15" font-weight="600" fill="#25313d" text-anchor="start">min density=1.28e-20</text>
<line x1="465.0" y1="375.0" x2="745.0" y2="375.0" stroke="#25313d" stroke-width="1.6"/>
<line x1="465.0" y1="115.0" x2="465.0" y2="375.0" stroke="#25313d" stroke-width="1.6"/>
<line x1="465.0" y1="245.0" x2="745.0" y2="245.0" stroke="#d5dee8" stroke-width="1" stroke-dasharray="4 5"/>
<text x="465.0" y="402.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="15" font-weight="500" fill="#66778c" text-anchor="start">coarse N</text>
<text x="745.0" y="402.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="15" font-weight="500" fill="#66778c" text-anchor="end">fine N</text>
<text x="432.0" y="258.0" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="500" fill="#66778c" text-anchor="middle">log10 realized QV</text>
<polyline points="465.00,140.38 521.00,140.26 577.00,140.29 633.00,140.16 689.00,140.23 745.00,140.21" fill="none" stroke="#c94134" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="465.00" cy="140.38" r="4.2" fill="#fbfaf7" stroke="#c94134" stroke-width="2.2"/><circle cx="521.00" cy="140.26" r="4.2" fill="#fbfaf7" stroke="#c94134" stroke-width="2.2"/><circle cx="577.00" cy="140.29" r="4.2" fill="#fbfaf7" stroke="#c94134" stroke-width="2.2"/><circle cx="633.00" cy="140.16" r="4.2" fill="#fbfaf7" stroke="#c94134" stroke-width="2.2"/><circle cx="689.00" cy="140.23" r="4.2" fill="#fbfaf7" stroke="#c94134" stroke-width="2.2"/><circle cx="745.00" cy="140.21" r="4.2" fill="#fbfaf7" stroke="#c94134" stroke-width="2.2"/>
<polyline points="465.00,252.99 521.00,272.36 577.00,291.73 633.00,311.10 689.00,330.47 745.00,349.84" fill="none" stroke="#0f7f75" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="465.00" cy="252.99" r="4.2" fill="#fbfaf7" stroke="#0f7f75" stroke-width="2.2"/><circle cx="521.00" cy="272.36" r="4.2" fill="#fbfaf7" stroke="#0f7f75" stroke-width="2.2"/><circle cx="577.00" cy="291.73" r="4.2" fill="#fbfaf7" stroke="#0f7f75" stroke-width="2.2"/><circle cx="633.00" cy="311.10" r="4.2" fill="#fbfaf7" stroke="#0f7f75" stroke-width="2.2"/><circle cx="689.00" cy="330.47" r="4.2" fill="#fbfaf7" stroke="#0f7f75" stroke-width="2.2"/><circle cx="745.00" cy="349.84" r="4.2" fill="#fbfaf7" stroke="#0f7f75" stroke-width="2.2"/>
<text x="472.0" y="101.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="15" font-weight="650" fill="#c94134" text-anchor="start">SDE QV order=-0.002</text>
<text x="472.0" y="425.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="15" font-weight="650" fill="#0f7f75" text-anchor="start">PF ODE QV order=1.000</text>
<text x="472.0" y="454.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="15" font-weight="600" fill="#25313d" text-anchor="start">both terminal variance ~= 1.210</text>
<line x1="855.0" y1="375.0" x2="1135.0" y2="375.0" stroke="#25313d" stroke-width="1.6"/>
<line x1="855.0" y1="115.0" x2="855.0" y2="375.0" stroke="#25313d" stroke-width="1.6"/>
<line x1="855.0" y1="257.4" x2="1135.0" y2="257.4" stroke="#d5dee8" stroke-width="1.4" stroke-dasharray="5 5"/>
<polyline points="855.00,357.07 925.00,309.97 960.00,284.39 995.00,257.35 1030.00,228.78 1065.00,198.58 1135.00,132.93" fill="none" stroke="#c94134" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="855.00" cy="357.07" r="4.2" fill="#fbfaf7" stroke="#c94134" stroke-width="2.2"/><circle cx="925.00" cy="309.97" r="4.2" fill="#fbfaf7" stroke="#c94134" stroke-width="2.2"/><circle cx="960.00" cy="284.39" r="4.2" fill="#fbfaf7" stroke="#c94134" stroke-width="2.2"/><circle cx="995.00" cy="257.35" r="4.2" fill="#fbfaf7" stroke="#c94134" stroke-width="2.2"/><circle cx="1030.00" cy="228.78" r="4.2" fill="#fbfaf7" stroke="#c94134" stroke-width="2.2"/><circle cx="1065.00" cy="198.58" r="4.2" fill="#fbfaf7" stroke="#c94134" stroke-width="2.2"/><circle cx="1135.00" cy="132.93" r="4.2" fill="#fbfaf7" stroke="#c94134" stroke-width="2.2"/>
<text x="862.0" y="101.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="15" font-weight="650" fill="#c94134" text-anchor="start">terminal variance error vs score scale</text>
<text x="855.0" y="402.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="15" font-weight="500" fill="#66778c" text-anchor="start">epsilon=-0.20</text>
<text x="1135.0" y="402.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="15" font-weight="500" fill="#66778c" text-anchor="end">epsilon=+0.20</text>
<text x="862.0" y="425.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="15" font-weight="650" fill="#2f6fec" text-anchor="start">exact-score Euler order=1.004</text>
<text x="862.0" y="454.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="15" font-weight="600" fill="#25313d" text-anchor="start">h-&gt;0 removes solver bias, not score bias</text>
<text x="75.0" y="495.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="15" font-weight="500" fill="#66778c" text-anchor="start">seed=20260819; paths=5000; OU grids=80/160/320</text>
<text x="855.0" y="495.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="15" font-weight="500" fill="#66778c" text-anchor="start">score epsilon range=-0.20..+0.20</text>
<line x1="60.0" y1="535.0" x2="1140.0" y2="535.0" stroke="#d5dee8" stroke-width="2"/>
<text x="600.0" y="572.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="18" font-weight="700" fill="#25313d" text-anchor="middle">守恒、路径 law 与 score/solver 误差是三道独立验收门；相同终端 histogram 不能合并它们。</text>
</svg>