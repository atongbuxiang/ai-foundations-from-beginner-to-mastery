<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">流映射、Liouville 与 Hutchinson 三轨审计</title>
<desc id="desc">非正规线性流的剪切与面积收缩、非线性连续正规化流的四阶数值收敛、随机迹估计的精确方差和标准误差。</desc>
<defs><style>
.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0f172a}.label{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#475569}.math{font:600 14px Georgia,"Times New Roman",serif;fill:#1e293b}.axis{stroke:#64748b;stroke-width:1.2}.grid{stroke:#e2e8f0;stroke-width:1}.blue{fill:none;stroke:#2563eb;stroke-width:2.6}.orange{fill:none;stroke:#ea580c;stroke-width:2.6}.green{fill:none;stroke:#059669;stroke-width:2.6}.violet{fill:none;stroke:#7c3aed;stroke-width:2.2;stroke-dasharray:6 4}.dotb{fill:#2563eb}.doto{fill:#ea580c}.dotg{fill:#059669}.square0{fill:#dbeafe;fill-opacity:.55;stroke:#2563eb;stroke-width:2}.square1{fill:#ffedd5;fill-opacity:.60;stroke:#ea580c;stroke-width:2}.badge{fill:#ecfdf5;stroke:#10b981;stroke-width:1.2}.small{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#475569}
</style></defs>
