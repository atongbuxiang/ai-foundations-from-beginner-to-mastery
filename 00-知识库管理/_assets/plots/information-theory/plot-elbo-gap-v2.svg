<title id="title">ELBO 恒等式、变分族限制与摊销缺口</title>
<desc id="desc">二元 latent model 的精确枚举：unrestricted Bernoulli q 在 posterior 处碰到 log evidence；q&gt;=0.8 留下 approximation gap；共享 q 无法同时匹配 x=0/1 posterior，留下 amortization gap。</desc>
