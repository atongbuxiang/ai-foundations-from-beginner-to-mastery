<title id="title">紧性、谱截断与有限截面陷阱四轨实验</title>
<desc id="desc">左上比较紧对角算子与恒等算子的低秩尾误差，右上比较Volterra离散奇异值与解析值，左下展示移位有限截面的零特征半径和单位算子范数，右下展示Gaussian核积分算子的特征值衰减。</desc>
