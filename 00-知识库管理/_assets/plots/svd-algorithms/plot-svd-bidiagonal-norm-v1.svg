<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc">
<title id="title">SVD bidiagonal reduction, norm iteration and randomized range approximation</title>
<desc id="desc">Panels show orthogonal bidiagonal reduction, convergence of spectral norm power estimates, and effects of oversampling and power iteration on randomized range approximation.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;fill:#172033}.title{font-size:23px;font-weight:600}.panel{font-size:16px;font-weight:600}.axis{font-size:14px}.frame{fill:#fbfcfe;stroke:#7b879a}.grid{stroke:#dbe1e8}.note{font-size:12px;fill:#445067}.legend{font-size:12px}</style>
<rect width="1440" height="610" fill="#ffffff"/>
<text x="720" y="34" text-anchor="middle" class="title">SVD 计算：先压缩结构，再按所需精度与规模选路线</text>
<text x="70" y="67" class="panel">A  左右正交变换把矩形矩阵压到双对角</text>
<text x="570" y="67" class="panel">B  谱间隙决定谱范数估计速度</text>
<text x="1030" y="67" class="panel">C  oversampling 与 power steps 改善随机范围</text>
