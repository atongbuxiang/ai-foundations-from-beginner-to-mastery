<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">Equivalent formulas can have unequal numerical stability</title>
<desc id="desc">Two panels compare naive and stable formulas for a quadratic small root using forward and backward errors. A third panel compares naive and shifted log-sum-exp, marking overflow as unit failure.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:25px;font-weight:760}.subtitle{font-size:14px;fill:#596579}.panel{font-size:16px;font-weight:700}.axis{font-size:13px}.tick{font-size:11.5px;fill:#64748b}.legend{font-size:12.5px}.callout{font-size:12.5px;font-weight:650}</style>
