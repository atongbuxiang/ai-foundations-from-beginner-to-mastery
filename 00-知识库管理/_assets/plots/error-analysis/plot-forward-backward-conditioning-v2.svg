<text class="tick" x="1078" y="247" text-anchor="middle">需补充分量型指标</text>
<text class="subtitle" x="640.0" y="736" text-anchor="middle">结论：残差必须尺度化；后向误差必须匹配扰动模型；前向解释必须乘上条件性。</text>
