<text x="42.00" y="425.00" class="paneltitle" text-anchor="start">C · Binary relations on four points</text>
<rect x="728.00" y="398.00" width="688.00" height="330.00" rx="0.00" fill="#fffefb" stroke="#d6dee8"/>
<text x="746.00" y="425.00" class="paneltitle" text-anchor="start">D · Parity quotient representatives</text>
<text x="44.00" y="141.00" class="label" text-anchor="start">all functions</text>
