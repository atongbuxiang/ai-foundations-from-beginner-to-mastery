<rect x="244.00" y="128.00" width="350.00" height="18.00" rx="6.00" fill="#2672dd" stroke="none"/>
<text x="604.00" y="141.00" class="small" text-anchor="end">27</text>
<text x="44.00" y="189.00" class="label" text-anchor="start">injective</text>
<rect x="244.00" y="176.00" width="350.00" height="18.00" rx="6.00" fill="#edf2f7" stroke="none"/>
<rect x="244.00" y="176.00" width="77.78" height="18.00" rx="6.00" fill="#07956d" stroke="none"/>
<text x="604.00" y="189.00" class="small" text-anchor="end">6</text>
<text x="44.00" y="237.00" class="label" text-anchor="start">surjective</text>
<rect x="244.00" y="224.00" width="350.00" height="18.00" rx="6.00" fill="#edf2f7" stroke="none"/>
<rect x="244.00" y="224.00" width="77.78" height="18.00" rx="6.00" fill="#6f56c5" stroke="none"/>
<text x="604.00" y="237.00" class="small" text-anchor="end">6</text>
<text x="44.00" y="285.00" class="label" text-anchor="start">bijective</text>
<rect x="244.00" y="272.00" width="350.00" height="18.00" rx="6.00" fill="#edf2f7" stroke="none"/>
<rect x="244.00" y="272.00" width="77.78" height="18.00" rx="6.00" fill="#e77817" stroke="none"/>
<text x="604.00" y="285.00" class="small" text-anchor="end">6</text>
<text x="44.00" y="337.00" class="sub" text-anchor="start">Finite equal-size certificate: injective ⇔ surjective ⇔ bijective.</text>
<text x="44.00" y="360.00" class="sub" text-anchor="start">Counts: 3³=27 total; 3!=6 permutations.</text>
<text x="748.00" y="141.00" class="label" text-anchor="start">preimage ∪ / ∩ / complement</text>
<rect x="948.00" y="128.00" width="335.00" height="18.00" rx="6.00" fill="#edf2f7" stroke="none"/>
<rect x="948.00" y="128.00" width="335.00" height="18.00" rx="6.00" fill="#07956d" stroke="none"/>
<text x="1293.00" y="141.00" class="small" text-anchor="end">1,728</text>
<text x="748.00" y="189.00" class="label" text-anchor="start">image union</text>
<rect x="948.00" y="176.00" width="335.00" height="18.00" rx="6.00" fill="#edf2f7" stroke="none"/>
<rect x="948.00" y="176.00" width="335.00" height="18.00" rx="6.00" fill="#2672dd" stroke="none"/>
<text x="1293.00" y="189.00" class="small" text-anchor="end">1,728</text>
<text x="748.00" y="237.00" class="label" text-anchor="start">image intersection subset</text>
<rect x="948.00" y="224.00" width="335.00" height="18.00" rx="6.00" fill="#edf2f7" stroke="none"/>
<rect x="948.00" y="224.00" width="335.00" height="18.00" rx="6.00" fill="#6f56c5" stroke="none"/>
<text x="1293.00" y="237.00" class="small" text-anchor="end">1,728</text>
<text x="748.00" y="285.00" class="label" text-anchor="start">image intersection equality</text>
<rect x="948.00" y="272.00" width="335.00" height="18.00" rx="6.00" fill="#edf2f7" stroke="none"/>
<rect x="948.00" y="272.00" width="300.10" height="18.00" rx="6.00" fill="#e77817" stroke="none"/>
<text x="1293.00" y="285.00" class="small" text-anchor="end">1,548</text>
<text x="748.00" y="337.00" class="sub" text-anchor="start">Strict failures of image(A∩C)=image(A)∩image(C): 180.</text>
<text x="748.00" y="360.00" class="sub" text-anchor="start">Preimage Boolean laws and image-union law pass every finite case.</text>
<text x="44.00" y="461.00" class="label" text-anchor="start">all relations</text>
<rect x="244.00" y="448.00" width="350.00" height="18.00" rx="6.00" fill="#edf2f7" stroke="none"/>
<rect x="244.00" y="448.00" width="350.00" height="18.00" rx="6.00" fill="#2672dd" stroke="none"/>
<text x="604.00" y="461.00" class="small" text-anchor="end">65,536</text>
<text x="44.00" y="504.00" class="label" text-anchor="start">reflexive</text>
<rect x="244.00" y="491.00" width="350.00" height="18.00" rx="6.00" fill="#edf2f7" stroke="none"/>
<rect x="244.00" y="491.00" width="21.88" height="18.00" rx="6.00" fill="#07956d" stroke="none"/>
<text x="604.00" y="504.00" class="small" text-anchor="end">4,096</text>
<text x="44.00" y="547.00" class="label" text-anchor="start">symmetric</text>
<rect x="244.00" y="534.00" width="350.00" height="18.00" rx="6.00" fill="#edf2f7" stroke="none"/>
<rect x="244.00" y="534.00" width="5.47" height="18.00" rx="6.00" fill="#6f56c5" stroke="none"/>
<text x="604.00" y="547.00" class="small" text-anchor="end">1,024</text>
<text x="44.00" y="590.00" class="label" text-anchor="start">transitive</text>
<rect x="244.00" y="577.00" width="350.00" height="18.00" rx="6.00" fill="#edf2f7" stroke="none"/>
<rect x="244.00" y="577.00" width="21.33" height="18.00" rx="6.00" fill="#e77817" stroke="none"/>
<text x="604.00" y="590.00" class="small" text-anchor="end">3,994</text>
<text x="44.00" y="633.00" class="label" text-anchor="start">equivalence</text>
<rect x="244.00" y="620.00" width="350.00" height="18.00" rx="6.00" fill="#edf2f7" stroke="none"/>
<rect x="244.00" y="620.00" width="2.00" height="18.00" rx="6.00" fill="#d1495b" stroke="none"/>
<text x="604.00" y="633.00" class="small" text-anchor="end">15</text>
<text x="44.00" y="681.00" class="sub" text-anchor="start">Exactly 15 equivalence relations = Bell number B₄ = 15 partitions.</text>
<text x="44.00" y="705.00" class="sub" text-anchor="start">Each property is audited independently before their conjunction.</text>
<text x="748.00" y="450.00" class="small" text-anchor="start">Parity classes</text>
<rect x="748.00" y="466.00" width="278.00" height="66.00" rx="10.00" fill="#edf8f5" stroke="#9ccfc1"/>
<text x="887.00" y="492.00" class="metric" text-anchor="middle">[0] = {0,2}        [1] = {1,3}</text>
<text x="887.00" y="518.00" class="small" text-anchor="middle">constant on each class ⇒ well-defined</text>
<text x="748.00" y="570.00" class="label" text-anchor="start">well-defined rules</text>
<rect x="948.00" y="557.00" width="335.00" height="18.00" rx="6.00" fill="#edf2f7" stroke="none"/>
<rect x="948.00" y="557.00" width="83.75" height="18.00" rx="6.00" fill="#07956d" stroke="none"/>
<text x="1293.00" y="570.00" class="small" text-anchor="end">4</text>
<text x="748.00" y="618.00" class="label" text-anchor="start">representative-dependent</text>
<rect x="948.00" y="605.00" width="335.00" height="18.00" rx="6.00" fill="#edf2f7" stroke="none"/>
<rect x="948.00" y="605.00" width="251.25" height="18.00" rx="6.00" fill="#e77817" stroke="none"/>
<text x="1293.00" y="618.00" class="small" text-anchor="end">12</text>
<text x="748.00" y="669.00" class="sub" text-anchor="start">Failure witness g=(0,0,1,1): 0~2 but g(0)≠g(2).</text>
<text x="748.00" y="695.00" class="sub" text-anchor="start">Only 2²=4 rules descend from four points to two classes.</text>
