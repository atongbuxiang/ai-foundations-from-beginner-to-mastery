<text class="tick" x="88" y="232.00" text-anchor="end">10^-4</text>
<line x1="100" y1="352.00" x2="1150" y2="352.00" stroke="#e2e8f0"/>
<text class="tick" x="88" y="356.00" text-anchor="end">10^-8</text>
<line x1="100" y1="476.00" x2="1150" y2="476.00" stroke="#e2e8f0"/>
<text class="tick" x="88" y="480.00" text-anchor="end">10^-12</text>
<line x1="100" y1="600.00" x2="1150" y2="600.00" stroke="#e2e8f0"/>
<text class="tick" x="88" y="604.00" text-anchor="end">10^-16</text>
<line x1="100.00" y1="104" x2="100.00" y2="600" stroke="#f1f5f9"/>
<text class="tick" x="100.00" y="625" text-anchor="middle">0</text>
