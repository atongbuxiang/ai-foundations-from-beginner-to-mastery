<text class="note" x="92" y="714">读图：局部阶段很快，但小奇异值先要经历近似 ×1.5 的“抬升期”；κ 越大，固定步数偏差越明显。</text>
<text class="note" x="92" y="737">边界：若初始奇异值为 0，多项式迭代永远把它映到 0，因此不能恢复缺失的秩。</text>
