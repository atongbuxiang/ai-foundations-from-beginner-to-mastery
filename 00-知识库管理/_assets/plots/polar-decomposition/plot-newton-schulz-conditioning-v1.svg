<text class="tick" x="80" y="257.00" text-anchor="end">10^-4</text>
<line x1="92" y1="374.00" x2="1068" y2="374.00" stroke="#e2e8f0"/>
<text class="tick" x="80" y="378.00" text-anchor="end">10^-8</text>
<line x1="92" y1="495.00" x2="1068" y2="495.00" stroke="#e2e8f0"/>
<text class="tick" x="80" y="499.00" text-anchor="end">10^-12</text>
<line x1="92" y1="616.00" x2="1068" y2="616.00" stroke="#e2e8f0"/>
<text class="tick" x="80" y="620.00" text-anchor="end">10^-16</text>
<line x1="92.00" y1="132" x2="92.00" y2="616" stroke="#f1f5f9"/>
<text class="tick" x="92.00" y="641" text-anchor="middle">0</text>
