<text class="tick" x="440.57" y="641" text-anchor="middle">10</text>
<line x1="614.86" y1="132" x2="614.86" y2="616" stroke="#f1f5f9"/>
<text class="tick" x="614.86" y="641" text-anchor="middle">15</text>
<line x1="789.14" y1="132" x2="789.14" y2="616" stroke="#f1f5f9"/>
<text class="tick" x="789.14" y="641" text-anchor="middle">20</text>
<line x1="963.43" y1="132" x2="963.43" y2="616" stroke="#f1f5f9"/>
<text class="tick" x="963.43" y="641" text-anchor="middle">25</text>
<line x1="1068.00" y1="132" x2="1068.00" y2="616" stroke="#f1f5f9"/>
