<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title description">
<title id="title">Newton--Schulz orthogonality defect for increasingly ill-conditioned matrices</title>
<desc id="description">The spectral orthogonality defect falls rapidly after the smallest singular value enters the local convergence region, but fixed-step accuracy deteriorates as the condition number grows. A rank-deficient matrix remains rank deficient.</desc>
<rect width="100%" height="100%" rx="22" fill="#f8fafc"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.title{font-size:23px;font-weight:700}.subtitle{font-size:14px;fill:#536176}.axis{font-size:14px;font-weight:600}.tick{font-size:12px;fill:#64748b}.legend{font-size:13px;font-weight:600}.note{font-size:13px;fill:#475569}</style>
<text class="title" x="560.0" y="38" text-anchor="middle">条件数决定有限步 Newton–Schulz 离极因子还有多远</text>
<text class="subtitle" x="560.0" y="64" text-anchor="middle">Aκ = diag(1, 1/κ) / ‖diag(1, 1/κ)‖F；误差 = ‖Xₖ*Xₖ − I‖₂</text>
<rect x="92" y="132" width="976" height="484" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="92" y1="132.00" x2="1068" y2="132.00" stroke="#e2e8f0"/>
<text class="tick" x="80" y="136.00" text-anchor="end">1</text>
