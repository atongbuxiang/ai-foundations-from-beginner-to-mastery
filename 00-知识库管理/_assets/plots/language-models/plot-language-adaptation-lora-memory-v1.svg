<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">LoRA gradient flow and QLoRA memory ledger</title><desc id="desc">Left: delta matrix and zero-factor gradients. Right: additive memory accounting.</desc>
<rect width="1200" height="700" fill="#FFFEFB"/>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.mono{font-family:"SFMono-Regular",Menlo,monospace}</style>
<text x="55" y="55" font-size="25" font-weight="700" fill="#17324D">Low-rank parameter count and end-to-end memory are different ledgers</text>
<line x1="600" y1="105" x2="600" y2="625" stroke="#D7DEE8"/>
<text x="65" y="120" font-size="18" font-weight="700" fill="#17324D">1 · LoRA finite oracle</text>
<text x="90" y="175" font-size="17" fill="#17324D">ΔW = [[1.0, 0.0], [0.0, 1.5]]</text>
<text x="90" y="220" font-size="17" fill="#17324D">x = [1.0, 2.0] → adapter output [1, 3]</text>
<text x="90" y="265" font-size="17" fill="#0F766E">merged output = [2.0, 5.0]</text>
<rect x="80" y="315" width="455" height="175" rx="12" fill="#F5F3FF" stroke="#7C3AED"/>
<text x="105" y="350" font-size="16" font-weight="700" fill="#7C3AED">A=I, B=0 at initialization</text>
<text x="105" y="395" font-size="14" fill="#17324D">grad B = [[0.5, 1.0], [1.5, 2.0]]</text>
<text x="105" y="440" font-size="14" fill="#17324D">grad A = [[0.0, 0.0], [0.0, 0.0]]</text>
<text x="105" y="475" font-size="14" fill="#C24135">both A=B=0 would make both gradients zero</text>
<text x="640" y="120" font-size="18" font-weight="700" fill="#17324D">2 · QLoRA accounted memory</text>
<text x="650" y="180" font-size="14" fill="#17324D">4bit_codes</text>
<rect x="820" y="160" width="89.28571428571429" height="32" rx="6" fill="#7C3AED"/>
<text x="924.2857142857143" y="182" font-size="14" fill="#7C3AED">0.50 GB</text>
<text x="650" y="258" font-size="14" fill="#17324D">quant_metadata</text>
<rect x="820" y="238" width="17.857142857142858" height="32" rx="6" fill="#A78BFA"/>
<text x="852.8571428571429" y="260" font-size="14" fill="#A78BFA">0.10 GB</text>
<text x="650" y="336" font-size="14" fill="#17324D">adapter_states</text>
<rect x="820" y="316" width="21.42857142857143" height="32" rx="6" fill="#0F766E"/>
<text x="856.4285714285714" y="338" font-size="14" fill="#0F766E">0.12 GB</text>
<text x="650" y="414" font-size="14" fill="#17324D">activations</text>
<rect x="820" y="394" width="250.00000000000003" height="32" rx="6" fill="#2563EB"/>
<text x="1085.0" y="416" font-size="14" fill="#2563EB">1.40 GB</text>
<text x="650" y="492" font-size="14" fill="#17324D">temporary</text>
<rect x="820" y="472" width="89.28571428571429" height="32" rx="6" fill="#D97706"/>
<text x="924.2857142857143" y="494" font-size="14" fill="#D97706">0.50 GB</text>
<rect x="640" y="555" width="500" height="72" rx="10" fill="#FFF7E8" stroke="#D97706"/>
<text x="665" y="585" font-size="17" font-weight="700" fill="#D97706">accounted sum = 2.62 GB</text>
<text x="665" y="612" font-size="13" fill="#64748B">Peak still depends on lifetimes, allocator, kernel, batch and sequence.</text>
</svg>