<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Training accounting contracts</title><desc id="desc">Mixture shares, block-causal packing, curriculum path dependence and data-count provenance are shown in four panels.</desc>
