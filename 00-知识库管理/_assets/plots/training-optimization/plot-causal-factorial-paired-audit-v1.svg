<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Confounding, factorial interaction and pairing audit</title><desc id="desc">A Simpson reversal, a two-factor contrast decomposition, and paired variance reduction appear in three scientific panels.</desc><style>text{font-family:Inter, PingFang SC, Noto Sans CJK SC, sans-serif;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1F2937"/></marker></defs><rect width="1200" height="700" fill="#FFFEFB"/><text x="60" y="54" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">A  Simpson reversal after a composition shift</text><text x="70" y="121" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">old crude</text><line x1="225" y1="115" x2="477.0" y2="115" stroke="#2563EB" stroke-width="12"/><text x="540" y="121" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" text-anchor="end" fill="#1F2937">0.840</text><text x="70" y="179" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">new crude</text><line x1="225" y1="173" x2="436.20000000000005" y2="173" stroke="#C24135" stroke-width="12"/><text x="540" y="179" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" text-anchor="end" fill="#1F2937">0.704</text><text x="70" y="237" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">new standardized</text><line x1="225" y1="231" x2="484.8" y2="231" stroke="#0F766E" stroke-width="12"/><text x="540" y="237" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" text-anchor="end" fill="#1F2937">0.866</text><text x="70" y="310" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">Within each length group, new &gt; old.</text><text x="70" y="338" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">The crude reversal comes only from mixture weights.</text><line x1="590" y1="75" x2="590" y2="640" stroke="#D7DEE8" stroke-dasharray="6 6"/><text x="630" y="54" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">B  2 x 2 contrast</text><rect x="650" y="100" width="120" height="105" fill="none" stroke="#D7DEE8" stroke-width="3"/><text x="710" y="142" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#64748B">A=-1, B=-1</text><text x="710" y="178" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1F2937">Y=10</text><rect x="800" y="100" width="120" height="105" fill="none" stroke="#D7DEE8" stroke-width="3"/><text x="860" y="142" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#64748B">A=+1, B=-1</text><text x="860" y="178" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1F2937">Y=14</text><rect x="650" y="250" width="120" height="105" fill="none" stroke="#D7DEE8" stroke-width="3"/><text x="710" y="292" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#64748B">A=-1, B=+1</text><text x="710" y="328" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1F2937">Y=12</text><rect x="800" y="250" width="120" height="105" fill="none" stroke="#0F766E" stroke-width="3"/><text x="860" y="292" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#64748B">A=+1, B=+1</text><text x="860" y="328" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0F766E">Y=22</text><text x="955" y="115" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB">A effect = 7.0</text><text x="955" y="155" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">B effect = 5.0</text><text x="955" y="195" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#C24135">interaction DiD = 6.0</text><text x="955" y="240" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">Main effects do not replace</text><text x="955" y="268" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">conditional effects.</text><line x1="620" y1="370" x2="1135" y2="370" stroke="#D7DEE8" stroke-dasharray="6 6"/><text x="630" y="420" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">C  Pair shared difficulty before estimating the effect</text><line x1="720" y1="494.0" x2="930" y2="477.20000000000005" stroke="#D7DEE8" stroke-width="2"/><circle cx="720" cy="494.0" r="6" fill="#2563EB"/><circle cx="930" cy="477.20000000000005" r="6" fill="#0F766E"/><line x1="720" y1="542.0" x2="930" y2="527.6" stroke="#D7DEE8" stroke-width="2"/><circle cx="720" cy="542.0" r="6" fill="#2563EB"/><circle cx="930" cy="527.6" r="6" fill="#0F766E"/><line x1="720" y1="470.0" x2="930" y2="458.0" stroke="#D7DEE8" stroke-width="2"/><circle cx="720" cy="470.0" r="6" fill="#2563EB"/><circle cx="930" cy="458.0" r="6" fill="#0F766E"/><line x1="720" y1="566.0" x2="930" y2="546.8" stroke="#D7DEE8" stroke-width="2"/><circle cx="720" cy="566.0" r="6" fill="#2563EB"/><circle cx="930" cy="546.8" r="6" fill="#0F766E"/><line x1="720" y1="518.0" x2="930" y2="508.4" stroke="#D7DEE8" stroke-width="2"/><circle cx="720" cy="518.0" r="6" fill="#2563EB"/><circle cx="930" cy="508.4" r="6" fill="#0F766E"/><line x1="720" y1="590.0" x2="930" y2="568.4" stroke="#D7DEE8" stroke-width="2"/><circle cx="720" cy="590.0" r="6" fill="#2563EB"/><circle cx="930" cy="568.4" r="6" fill="#0F766E"/><text x="720" y="455" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#2563EB">A</text><text x="930" y="455" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0F766E">B</text><text x="995" y="500" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">Var paired = 0.035</text><text x="995" y="535" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">Var unpaired = 6.535</text><text x="60" y="665" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">Finite examples identify estimators and counterexamples; they do not supply a universal effect size or seed count.</text></svg>
