<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Metric-induced emergence and held-out-scale evidence</title>
<desc id="desc">Left panel maps smooth per-step probability to steep exact match; right panel preserves calibration, validation, held-out splits and failures.</desc>
<rect width="1200" height="800" fill="#FFFEFB"/>
