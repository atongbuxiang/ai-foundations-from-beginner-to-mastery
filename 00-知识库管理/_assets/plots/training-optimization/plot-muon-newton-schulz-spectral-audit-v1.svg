<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Newton–Schulz singular-value residual trajectories</title>
<desc id="desc">比较 classic 与 Jordan 多项式从两个初值出发的绝对 target residual，并显示零奇异值固定边界。</desc>
<rect width="1200" height="720" fill="#FFFEFB"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#0F172A}.h{font-size:27px;font-weight:700}.sh{font-size:18px;font-weight:700}.b{font-size:14px}.s{font-size:12px;fill:#64748B}.axis{stroke:#94A3B8;stroke-width:1.5}.grid{stroke:#E2E8F0;stroke-width:1}.blue{stroke:#2563EB;fill:none;stroke-width:3}.green{stroke:#0F766E;fill:none;stroke-width:3}.amber{stroke:#B76E00;fill:none;stroke-width:3}.red{stroke:#C0392B;fill:none;stroke-width:3}.card{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.5}</style>
<text x="48" y="48" class="h" fill="#2563EB">有限步 NS：初始 singular value 决定五步之后还剩多少误差</text>
<rect x="48" y="88" width="1104" height="538" rx="14" class="card"/>
<line x1="112" y1="552" x2="1100" y2="552" class="axis"/>
<line x1="112" y1="146" x2="112" y2="552" class="axis"/>
<line x1="112" y1="552.00" x2="1100" y2="552.00" class="grid"/>
<text x="98" y="556.00" text-anchor="end" class="s">1e-6</text>
<line x1="112" y1="484.33" x2="1100" y2="484.33" class="grid"/>
<text x="98" y="488.33" text-anchor="end" class="s">1e-5</text>
<line x1="112" y1="416.67" x2="1100" y2="416.67" class="grid"/>
<text x="98" y="420.67" text-anchor="end" class="s">1e-4</text>
<line x1="112" y1="349.00" x2="1100" y2="349.00" class="grid"/>
<text x="98" y="353.00" text-anchor="end" class="s">1e-3</text>
<line x1="112" y1="281.33" x2="1100" y2="281.33" class="grid"/>
<text x="98" y="285.33" text-anchor="end" class="s">1e-2</text>
<line x1="112" y1="213.67" x2="1100" y2="213.67" class="grid"/>
<text x="98" y="217.67" text-anchor="end" class="s">1e-1</text>
<line x1="112" y1="146.00" x2="1100" y2="146.00" class="grid"/>
<text x="98" y="150.00" text-anchor="end" class="s">1e-0</text>
<polyline points="112.00,166.37 235.50,180.18 359.00,205.68 482.50,254.76 606.00,351.85 729.50,545.79 853.00,552.00 976.50,552.00 1100.00,552.00" class="blue"/>
<line x1="802" y1="166" x2="842" y2="166" stroke="#2563EB" stroke-width="3"/>
<text x="852" y="170" class="s">classic s₀=.5</text>
<polyline points="112.00,166.37 235.50,194.98 359.00,212.57 482.50,197.11 606.00,227.66 729.50,188.61 853.00,250.14 976.50,179.99 1100.00,205.82" class="green"/>
<line x1="802" y1="194" x2="842" y2="194" stroke="#0F766E" stroke-width="3"/>
<text x="852" y="198" class="s">Jordan s₀=.5</text>
<polyline points="112.00,146.30 235.50,146.44 359.00,146.67 482.50,147.01 606.00,147.53 729.50,148.32 853.00,149.54 976.50,151.46 1100.00,154.53" class="amber"/>
<line x1="802" y1="222" x2="842" y2="222" stroke="#B76E00" stroke-width="3"/>
<text x="852" y="226" class="s">classic s₀=.01</text>
<polyline points="112.00,146.30 235.50,147.03 359.00,149.70 482.50,161.01 606.00,215.77 729.50,181.28 853.00,209.31 976.50,183.82 1100.00,218.10" class="red"/>
<line x1="802" y1="250" x2="842" y2="250" stroke="#C0392B" stroke-width="3"/>
<text x="852" y="254" class="s">Jordan s₀=.01</text>
<text x="112.00" y="580" text-anchor="middle" class="s">0</text>
<text x="235.50" y="580" text-anchor="middle" class="s">1</text>
<text x="359.00" y="580" text-anchor="middle" class="s">2</text>
<text x="482.50" y="580" text-anchor="middle" class="s">3</text>
<text x="606.00" y="580" text-anchor="middle" class="s">4</text>
<text x="729.50" y="580" text-anchor="middle" class="s">5</text>
<text x="853.00" y="580" text-anchor="middle" class="s">6</text>
<text x="976.50" y="580" text-anchor="middle" class="s">7</text>
<text x="1100.00" y="580" text-anchor="middle" class="s">8</text>
<text x="600" y="610" text-anchor="middle" class="b">iteration</text>
<text x="48" y="132" class="s">|sₖ−target|（log scale）</text>
<rect x="48" y="654" width="1104" height="48" rx="9" fill="#FFF6E5" stroke="#B76E00"/>
<text x="72" y="684" class="b">边界：s₀=0 在两种奇多项式下永久为 0；tiny s₀ 的 fixed-step residual 不能由“5 steps”这个数字单独保证。</text>
<text x="48" y="722" class="s">确定性标准库实验｜exact-arithmetic scalar map；未模拟 BF16 rounding。</text>
</svg>
