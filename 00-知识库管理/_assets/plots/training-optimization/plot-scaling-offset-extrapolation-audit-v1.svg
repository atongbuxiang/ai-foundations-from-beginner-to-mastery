<text x="775.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52606D" text-anchor="middle" font-weight="400">1e3</text>
<text x="875.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52606D" text-anchor="middle" font-weight="400">1e4</text>
<text x="975.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52606D" text-anchor="middle" font-weight="400">1e6</text>
<text x="1075.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52606D" text-anchor="middle" font-weight="400">1e8</text>
<polyline points="675.0,273.3 775.0,332.6 875.0,351.3 975.0,359.1 1075.0,359.9" fill="none" stroke="#0F766E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="675.0,273.3 775.0,332.6 875.0,388.2 975.0,489.2 1075.0,578.0" fill="none" stroke="#C0392B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="700.0" y="220.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0F766E" text-anchor="start" font-weight="700">true / offset-aware</text>
<text x="875.0" y="515.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#C0392B" text-anchor="start" font-weight="700">zero-offset fit drifts</text>
<text x="875.0" y="684.0" font-family="Inter, Arial, sans-serif" font-size="17" fill="#52606D" text-anchor="middle" font-weight="400">scale (log-spaced)</text>
<text x="600.0" y="756.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52606D" text-anchor="middle" font-weight="400">Evidence boundary: exact synthetic counterexample; it tests analysis logic, not a universal neural scaling law.</text>
</svg>
