<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Offset-aware slopes and finite-window extrapolation</title>
<desc id="desc">Two textbook panels separate raw from excess-loss slopes and compare offset-aware with zero-offset extrapolation.</desc>
<rect width="1200" height="800" fill="#FFFEFB"/>
<text x="60.0" y="58.0" font-family="Inter, Arial, sans-serif" font-size="28" fill="#172033" text-anchor="start" font-weight="700">Scaling audit: the floor changes slopes and extrapolation</text>
<text x="60.0" y="91.0" font-family="Inter, Arial, sans-serif" font-size="17" fill="#52606D" text-anchor="start" font-weight="400">A straight calibration segment can hide a structurally wrong asymptote.</text>
<rect x="55" y="125" width="530" height="590" rx="18" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
<text x="79.0" y="163.0" font-family="Inter, Arial, sans-serif" font-size="20" fill="#172033" text-anchor="start" font-weight="700">A  Local slope: raw loss versus excess</text>
<rect x="615" y="125" width="530" height="590" rx="18" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
<text x="639.0" y="163.0" font-family="Inter, Arial, sans-serif" font-size="20" fill="#172033" text-anchor="start" font-weight="700">B  Same calibration, different far-scale prediction</text>
<line x1="105" y1="610.0" x2="515" y2="610.0" stroke="#D9E0E7" stroke-width="1"/>
<text x="92.0" y="615.0" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52606D" text-anchor="end" font-weight="400">0.0</text>
<line x1="105" y1="544.5" x2="515" y2="544.5" stroke="#D9E0E7" stroke-width="1"/>
<text x="92.0" y="549.5" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52606D" text-anchor="end" font-weight="400">0.1</text>
<line x1="105" y1="413.6" x2="515" y2="413.6" stroke="#D9E0E7" stroke-width="1"/>
<text x="92.0" y="418.6" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52606D" text-anchor="end" font-weight="400">0.3</text>
<line x1="105" y1="282.7" x2="515" y2="282.7" stroke="#D9E0E7" stroke-width="1"/>
<text x="92.0" y="287.7" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52606D" text-anchor="end" font-weight="400">0.5</text>
<text x="105.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52606D" text-anchor="middle" font-weight="400">1</text>
<text x="187.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52606D" text-anchor="middle" font-weight="400">4</text>
<text x="269.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52606D" text-anchor="middle" font-weight="400">16</text>
<text x="351.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52606D" text-anchor="middle" font-weight="400">64</text>
<text x="433.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52606D" text-anchor="middle" font-weight="400">256</text>
<text x="515.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52606D" text-anchor="middle" font-weight="400">1024</text>
<polyline points="105.0,348.2 187.0,391.8 269.0,446.4 351.0,500.9 433.0,544.5 515.0,573.6" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="105.0,282.7 187.0,282.7 269.0,282.7 351.0,282.7 433.0,282.7 515.0,282.7" fill="none" stroke="#0F766E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/>
<text x="130.0" y="230.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0F766E" text-anchor="start" font-weight="700">excess slope magnitude = 0.5</text>
<text x="285.0" y="465.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#2563EB" text-anchor="start" font-weight="700">raw slope flattens toward 0</text>
<text x="310.0" y="684.0" font-family="Inter, Arial, sans-serif" font-size="17" fill="#52606D" text-anchor="middle" font-weight="400">resource scale x</text>
<line x1="675" y1="576.7" x2="1075" y2="576.7" stroke="#D9E0E7" stroke-width="1"/>
<text x="662.0" y="581.7" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52606D" text-anchor="end" font-weight="400">0.75</text>
<line x1="675" y1="446.7" x2="1075" y2="446.7" stroke="#D9E0E7" stroke-width="1"/>
<text x="662.0" y="451.7" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52606D" text-anchor="end" font-weight="400">0.9</text>
<line x1="675" y1="360.0" x2="1075" y2="360.0" stroke="#D9E0E7" stroke-width="1"/>
<text x="662.0" y="365.0" font-family="Inter, Arial, sans-serif" font-size="15" fill="#52606D" text-anchor="end" font-weight="400">1.0</text>
<line x1="675" y1="273.3" x2="1075" y2="273.3" stroke="#D9E0E7" stroke-width="1"/>
