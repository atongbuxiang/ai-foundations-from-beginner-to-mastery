<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Spectral counterexample and depth accumulation</title>
<desc id="desc">Left panel shows equal entry RMS but different spectral norms. Right panel separates aligned and orthogonal residual accumulation.</desc>
<rect width="1200" height="800" fill="#FFFEFB"/>
<text x="60.0" y="58.0" font-family="Inter, Arial, sans-serif" font-size="28" fill="#172033" text-anchor="start" font-weight="700">Spectral and depth audit: small coordinates can still add coherently</text>
<text x="60.0" y="91.0" font-family="Inter, Arial, sans-serif" font-size="17" fill="#52606D" text-anchor="start" font-weight="400">The worst direction and the cross-layer correlation regime require separate telemetry.</text>
<rect x="55" y="125" width="530" height="590" rx="18" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
<text x="79.0" y="163.0" font-family="Inter, Arial, sans-serif" font-size="20" fill="#172033" text-anchor="start" font-weight="700">A  Same entry RMS, different spectrum</text>
<rect x="615" y="125" width="530" height="590" rx="18" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
<text x="639.0" y="163.0" font-family="Inter, Arial, sans-serif" font-size="20" fill="#172033" text-anchor="start" font-weight="700">B  Residual accumulation after scaling</text>
<text x="105.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52606D" text-anchor="middle" font-weight="400">16</text>
<line x1="105" y1="185" x2="105" y2="620" stroke="#D9E0E7" stroke-width="1"/>
<text x="240.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52606D" text-anchor="middle" font-weight="400">64</text>
<line x1="240" y1="185" x2="240" y2="620" stroke="#D9E0E7" stroke-width="1"/>
<text x="375.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52606D" text-anchor="middle" font-weight="400">256</text>
<line x1="375" y1="185" x2="375" y2="620" stroke="#D9E0E7" stroke-width="1"/>
<text x="510.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52606D" text-anchor="middle" font-weight="400">1024</text>
<line x1="510" y1="185" x2="510" y2="620" stroke="#D9E0E7" stroke-width="1"/>
<polyline points="105.0,220.0 240.0,220.0 375.0,220.0 510.0,220.0" fill="none" stroke="#C0392B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="105.0,364.0 240.0,436.0 375.0,508.0 510.0,580.0" fill="none" stroke="#0F766E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="120.0" y="220.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#C0392B" text-anchor="start" font-weight="700">rank-one ||W||2 = 1</text>
<text x="300.0" y="470.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0F766E" text-anchor="start" font-weight="700">Hadamard ||W||2 = n^-1/2</text>
<text x="350.0" y="684.0" font-family="Inter, Arial, sans-serif" font-size="17" fill="#52606D" text-anchor="middle" font-weight="400">width n; both entry RMS = 1/n</text>
<text x="675.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52606D" text-anchor="middle" font-weight="400">4</text>
<line x1="675" y1="185" x2="675" y2="620" stroke="#D9E0E7" stroke-width="1"/>
<text x="810.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52606D" text-anchor="middle" font-weight="400">16</text>
<line x1="810" y1="185" x2="810" y2="620" stroke="#D9E0E7" stroke-width="1"/>
<text x="945.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52606D" text-anchor="middle" font-weight="400">64</text>
<line x1="945" y1="185" x2="945" y2="620" stroke="#D9E0E7" stroke-width="1"/>
<text x="1080.0" y="650.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52606D" text-anchor="middle" font-weight="400">256</text>
<line x1="1080" y1="185" x2="1080" y2="620" stroke="#D9E0E7" stroke-width="1"/>
<polyline points="675.0,456.0 810.0,456.0 945.0,456.0 1080.0,456.0" fill="none" stroke="#0F766E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="675.0,456.0 810.0,456.0 945.0,456.0 1080.0,456.0" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"/>
<polyline points="675.0,394.0 810.0,332.0 945.0,270.0 1080.0,208.0" fill="none" stroke="#C0392B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="700.0" y="220.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0F766E" text-anchor="start" font-weight="700">aligned × 1/L = 1</text>
<text x="700.0" y="255.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#2563EB" text-anchor="start" font-weight="700">orthogonal × 1/sqrt(L) = 1</text>
<text x="850.0" y="400.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#C0392B" text-anchor="start" font-weight="700">aligned × 1/sqrt(L) grows</text>
<text x="920.0" y="684.0" font-family="Inter, Arial, sans-serif" font-size="17" fill="#52606D" text-anchor="middle" font-weight="400">depth L</text>
<text x="600.0" y="756.0" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52606D" text-anchor="middle" font-weight="400">Evidence boundary: exact structured matrices and correlation extremes; real layers may lie between them.</text>
</svg>
