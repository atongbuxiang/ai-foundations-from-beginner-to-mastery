sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">r7</text><line x1="730" y1="459" x2="732.8" y2="459" stroke="#D7DEE8" stroke-width="7"/><circle cx="731.4" cy="459" r="6" fill="#C24135"/><text x="1110" y="465" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" text-anchor="end" fill="#C24135">mid=12342  bad</text><text x="680" y="500" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">r8</text><line x1="730" y1="494" x2="731.4" y2="494" stroke="#D7DEE8" stroke-width="7"/><circle cx="730.7" cy="494" r="6" fill="#C24135"/><text x="1110" y="500" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" text-anchor="end" fill="#C24135">mid=12341  bad</text><text x="670" y="605" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#C24135">first bad = 12341 ; last normal = 12340</text><text x="60" y="660" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">These clocks and boundaries are exact teaching oracles; real replay may require tolerance and repeated localization.</text></svg>
