<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Telemetry clocks and first-bad-event audit</title><desc id="desc">Clock divergence after a skipped update and deterministic binary localization of the first bad training step.</desc><style>text{font-family:Inter, PingFang SC, Noto Sans CJK SC, sans-serif;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1F2937"/></marker></defs><rect width="1200" height="700" fill="#FFFEFB"/><text x="60" y="54" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#1F2937">A  Skipped update makes clocks diverge</text><line x1="90" y1="110" x2="550" y2="110" stroke="#D7DEE8" stroke-width="2"/><text x="65" y="116" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">attempt 1</text><circle cx="210" cy="110" r="8" fill="#0F766E"/><text x="235" y="116" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">success</text><text x="360" y="116" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1F2937">micro=2  update=1  token=1990</text><line x1="90" y1="192" x2="550" y2="192" stroke="#D7DEE8" stroke-width="2"/><text x="65" y="198" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">attempt 2</text><circle cx="210" cy="192" r="8" fill="#C24135"/><text x="235" y="198" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#C24135">overflow</text><text x="360" y="198" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1F2937">micro=4  update=1  token=3990</text><line x1="90" y1="274" x2="550" y2="274" stroke="#D7DEE8" stroke-width="2"/><text x="65" y="280" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">attempt 3</text><circle cx="210" cy="274" r="8" fill="#0F766E"/><text x="235" y="280" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">success</text><text x="360" y="280" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1F2937">micro=6  update=2  token=5990</text><line x1="90" y1="356" x2="550" y2="356" stroke="#D7DEE8" stroke-width="2"/><text x="65" y="362" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">attempt 4</text><circle cx="210" cy="356" r="8" fill="#0F766E"/><text x="235" y="362" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">success</text><text x="360" y="362" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1F2937">micro=8  update=3  token=7990</text><text x="80" y="475" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#B7791F">attempt clock</text><text x="250" y="475" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#C24135">!=</text><text x="300" y="475" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">optimizer clock after overflow</text><line x1="620" y1="80" x2="620" y2="620" stroke="#D7DEE8" stroke-dasharray="6 6"/><text x="670" y="54" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#1F2937">B  Checkpoint bisection</text><line x1="680" y1="130" x2="1120" y2="130" stroke="#1F2937" stroke-width="3"/><text x="680" y="166" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">12000 normal</text><text x="1120" y="166" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">12512 bad</text><text x="680" y="220" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">r0</text><line x1="730" y1="214" x2="1088.4" y2="214" stroke="#D7DEE8" stroke-width="7"/><circle cx="909.2" cy="214" r="6" fill="#0F766E"/><text x="1110" y="220" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" text-anchor="end" fill="#0F766E">mid=12256  normal</text><text x="680" y="255" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">r1</text><line x1="730" y1="249" x2="909.2" y2="249" stroke="#D7DEE8" stroke-width="7"/><circle cx="819.6" cy="249" r="6" fill="#C24135"/><text x="1110" y="255" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" text-anchor="end" fill="#C24135">mid=12384  bad</text><text x="680" y="290" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">r2</text><line x1="730" y1="284" x2="819.6" y2="284" stroke="#D7DEE8" stroke-width="7"/><circle cx="774.8" cy="284" r="6" fill="#0F766E"/><text x="1110" y="290" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weigh