<text x="48.0" y="48.0" class="h" fill="#2563EB">两个控制器、两种边界：估计器偏差与历史滞后</text>
<rect x="48" y="86" width="430" height="566" rx="14" fill="#FFF1F0" stroke="#C0392B" stroke-width="2"/>
<text x="72.0" y="124.0" class="sh">裁剪可反转随机梯度期望</text>
<line x1="92" y1="342.0" x2="430" y2="342.0" class="axis"/>
<rect x="132" y="324.0" width="82" height="17.999999999999996" rx="7" fill="#2563EB" opacity="0.82"/>
<text x="126.0" y="536.0" class="b">E[g]</text>
<text x="150.0" y="312.0" class="sh" fill="#2563EB">0.1</text>
