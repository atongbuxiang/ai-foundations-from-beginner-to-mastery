<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Adam Update RMS 与 AdamW Weight RMS 审计</title>
<desc id="desc">左侧比较不同 beta1 的 Monte Carlo direction RMS 与 mean-field 公式，右侧展示线性随机递推的 Weight RMS 平方根缩放。</desc>
<rect width="1200" height="680" fill="#FFFEFB"/>
<style>
.sans{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.mono{font-family:"SFMono-Regular",Menlo,monospace}
.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}.amber{fill:#B7791F}.red{fill:#C24135}
</style>
<text x="58" y="56" class="sans blue" font-size="23" font-weight="700">A | Update RMS：low-SNR stationary audit</text>
<text x="628" y="56" class="sans blue" font-size="23" font-weight="700">B | Weight RMS：linear recursion audit</text>
<line x1="150.0" y1="510.0" x2="150.0" y2="150.21" stroke="#2563EB" stroke-width="20"/>
<circle cx="184.0" cy="150.00" r="8" fill="#0F766E"/>
<text x="165.0" y="548" class="mono ink" font-size="16" text-anchor="middle">b1=0.0</text>
<line x1="330.0" y1="510.0" x2="330.0" y2="426.65" stroke="#2563EB" stroke-width="20"/>
<circle cx="364.0" cy="427.41" r="8" fill="#0F766E"/>
<text x="345.0" y="548" class="mono ink" font-size="16" text-anchor="middle">b1=0.9</text>
<line x1="510.0" y1="510.0" x2="510.0" y2="484.40" stroke="#2563EB" stroke-width="20"/>
<circle cx="544.0" cy="484.48" r="8" fill="#0F766E"/>
<text x="525.0" y="548" class="mono ink" font-size="16" text-anchor="middle">b1=0.99</text>
<line x1="90" y1="510" x2="565" y2="510" stroke="#1F2937" stroke-width="2"/>
<line x1="90" y1="150" x2="90" y2="510" stroke="#1F2937" stroke-width="2"/>
<rect x="110" y="92" width="20" height="20" fill="#2563EB"/><text x="140" y="108" class="sans ink" font-size="16">empirical</text>
<circle cx="260" cy="102" r="8" fill="#0F766E"/><text x="278" y="108" class="sans ink" font-size="16">mean-field</text>
<text x="655.00" y="548" class="mono ink" font-size="15" text-anchor="middle">0.0025</text>
<text x="806.67" y="548" class="mono ink" font-size="15" text-anchor="middle">0.005</text>
<text x="958.33" y="548" class="mono ink" font-size="15" text-anchor="middle">0.01</text>
<text x="1110.00" y="548" class="mono ink" font-size="15" text-anchor="middle">0.02</text>
<line x1="655.0" y1="510" x2="1110.0" y2="510" stroke="#1F2937" stroke-width="2"/>
<line x1="655.0" y1="150" x2="655.0" y2="510" stroke="#1F2937" stroke-width="2"/>
<polyline points="655.00,382.78 806.67,330.07 958.33,255.51 1110.00,150.00" fill="none" stroke="#2563EB" stroke-width="4"/>
<polyline points="655.00,382.78 806.67,330.09 958.33,255.57 1110.00,150.18" fill="none" stroke="#B7791F" stroke-width="4" stroke-dasharray="8 7"/>
<line x1="805" y1="102" x2="847" y2="102" stroke="#2563EB" stroke-width="4"/><text x="857" y="108" class="sans ink" font-size="16">exact stationary</text>
<line x1="1000" y1="102" x2="1042" y2="102" stroke="#B7791F" stroke-width="4" stroke-dasharray="8 7"/><text x="1052" y="108" class="sans ink" font-size="16">sqrt law</text>
<text x="882" y="584" class="sans ink" font-size="17" text-anchor="middle">eta（log axis）, lambda=0.1</text>
<text x="58" y="637" class="sans muted" font-size="16">左：随机比值在指定 regime 接近公式；右：平方根律来自零均值独立噪声的线性稳态，不是网络层定理。</text>
</svg>