<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Hyperparameter transfer curves</title>
<desc id="desc">Two panels compare aligned muP proxy curves with drifting standard-parameterization curves across widths.</desc>
