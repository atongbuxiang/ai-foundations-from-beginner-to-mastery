<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Compute-optimal allocation and repeated-token value</title>
<desc id="desc">Left panel shows normalized IsoFLOP regret around the analytic optimum; right panel separates seen from effective repeated tokens.</desc>
<rect width="1200" height="800" fill="#FFFEFB"/>
<text x="60.0" y="58.0" font-family="Inter, Arial, sans-serif" font-size="28" fill="#172033" text-anchor="start" font-weight="700">Allocation audit: a budget optimum and a data ledger are different objects</text>
<text x="60.0" y="91.0" font-family="Inter, Arial, sans-serif" font-size="17" fill="#52606D" text-anchor="start" font-weight="400">The optimum is a valley; repeated exposure grows the seen ledger faster than the effective proxy.</text>
<rect x="55" y="125" width="530" height="590" rx="18" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
<text x="79.0" y="163.0" font-family="Inter, Arial, sans-serif" font-size="20" fill="#172033" text-anchor="start" font-weight="700">A  IsoFLOP regret around N*</text>
