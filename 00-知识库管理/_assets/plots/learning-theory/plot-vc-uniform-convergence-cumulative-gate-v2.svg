<text x="40.0" y="78.0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#5B667A" text-anchor="start">从 labeling patterns 到概率事件，再到可数模型层级；有限见证只承担它能证明的方向。</text>
