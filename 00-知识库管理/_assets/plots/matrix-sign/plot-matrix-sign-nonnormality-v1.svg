<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title description">
<title id="title">Nonnormality slows scaled Newton and amplifies the matrix sign derivative</title>
<desc id="description">For A_q equal to the upper triangular matrix with diagonal one and minus one and off-diagonal q, the eigenvalues stay fixed. The left panel shows that Frobenius scaling makes Newton need more iterations as q grows. The right panel shows unbounded sign norm and quadratic derivative amplification.</desc>
<rect width="100%" height="100%" rx="22" fill="#f8fafc"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.title{font-size:23px;font-weight:700}.subtitle{font-size:14px;fill:#536176}.panel{font-size:16px;font-weight:700}.axis{font-size:13px;font-weight:650}.tick{font-size:12px;fill:#64748b}.legend{font-size:13px;font-weight:650}.note{font-size:13px;fill:#475569}.math{font-family:Georgia,"Times New Roman",serif;font-size:15px;font-weight:600}</style>
<text class="title" x="600.0" y="38" text-anchor="middle">固定特征值不代表 matrix sign 温和：非正规性同时影响算法与导数</text>
<text class="subtitle" x="600.0" y="66" text-anchor="middle">A_q = [[1,q],[0,−1]]，Λ(A_q)={−1,+1}，且 sign(A_q)=A_q；横轴 q=t/δ 采用对数刻度</text>
<text class="panel" x="322.0" y="105" text-anchor="middle">A　Frobenius 缩放后的 Newton 步数</text>
