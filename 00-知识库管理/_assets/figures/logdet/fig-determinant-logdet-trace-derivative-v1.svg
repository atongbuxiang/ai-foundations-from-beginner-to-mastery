<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">行列式、log-det 与迹的导数</title>
  <desc id="desc">三个面板展示体积的一阶相对变化、稳定的分解计算、以及 Gaussian 和正规化流中的使用。</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF7ED"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker>
    <style>.title{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F172A}.head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#7C2D12}.txt{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.math{font:15px Georgia,"Times New Roman",serif;fill:#0F172A}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#64748B}.card{fill:#fff;stroke:#CBD5E1;stroke-width:1.3}.orange{fill:#FFF7ED;stroke:#FDBA74}.violet{fill:#F5F3FF;stroke:#C4B5FD}.blue{fill:#EFF6FF;stroke:#93C5FD}.red{fill:#FEF2F2;stroke:#FCA5A5}.line{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a3)}</style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg3)"/>
  <text x="40" y="38" class="title">det 与 log-det：trace 描述相对体积的一阶变化</text>
  <rect x="28" y="58" width="368" height="342" rx="17" class="card"/><rect x="416" y="58" width="368" height="342" rx="17" class="card"/><rect x="804" y="58" width="368" height="342" rx="17" class="card"/>
  <text x="50" y="88" class="head">A　体积与 Jacobi 公式</text>
  <polygon points="78,153 190,119 314,158 202,193" fill="#FED7AA" stroke="#F97316" stroke-width="2"/><polygon points="78,153 78,246 202,288 202,193" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/><polygon points="202,193 314,158 314,251 202,288" fill="#FDBA74" fill-opacity=".65" stroke="#F97316" stroke-width="2"/>
  <text x="101" y="318" class="math">volume = |det A|</text>
  <rect x="55" y="338" width="316" height="43" rx="10" class="orange"/><text x="73" y="365" class="math">d log|det A| = tr(A⁻¹ dA)</text>
  <text x="438" y="88" class="head">B　稳定计算走分解</text>
  <rect x="447" y="111" width="307" height="64" rx="11" class="violet"/><text x="469" y="135" class="txt">SPD：A = L Lᵀ</text><text x="469" y="160" class="math">log det A = 2 Σᵢ log Lᵢᵢ</text>
  <path d="M600 178L600 204" class="line"/>
  <rect x="447" y="208" width="307" height="70" rx="11" class="blue"/><text x="469" y="232" class="txt">一般矩阵：P A = L U</text><text x="469" y="258" class="math">返回 sign 与 Σᵢ log|Uᵢᵢ|</text>
  <rect x="447" y="310" width="307" height="48" rx="11" class="red"/><text x="467" y="339" class="txt">不要：先形成 det，再调用 log</text>
  <text x="457" y="382" class="small">A⁻¹v 也通过三角/线性求解，不形成 inverse</text>
  <text x="826" y="88" class="head">C　概率模型中的两类调用</text>
  <rect x="837" y="111" width="308" height="98" rx="12" class="blue"/><text x="858" y="138" class="head">Gaussian</text><text x="858" y="166" class="math">½ log det Σ + ½ rᵀΣ⁻¹r</text><text x="858" y="191" class="small">总体体积 与 Mahalanobis 距离平衡</text>
  <rect x="837" y="230" width="308" height="88" rx="12" class="violet"/><text x="858" y="257" class="head">Normalizing flow</text><text x="858" y="285" class="math">log pX = log pZ + log|det Jf|</text><text x="858" y="307" class="small">用结构化三角 Jacobian 降低成本</text>
  <rect x="837" y="340" width="308" height="43" rx="10" class="red"/><text x="858" y="367" class="txt">σmin → 0：log-det → −∞，梯度放大</text>
</svg>
