<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">行列式、log-det 与迹的导数</title>
<desc id="desc">行列式描述局部体积；trace 给出 log-det 的一阶相对变化；数值上通过分解计算并在 Gaussian 与 flow 中调用。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">体积与 Jacobi 公式</text>
<path d="M75 165L225 125L325 175L175 220Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
<path d="M75 165V305L175 355V220M175 355L325 310V175" fill="none" stroke="#2563EB" stroke-width="3"/>
<text x="200" y="395" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">volume scale = |det A|</text>
<text x="45" y="448" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">d log|det A| = tr(A^-1 dA)</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">稳定计算来自分解</text>
<rect x="445" y="108" width="310" height="64" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="146.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">SPD: A=L L^T; logdet=2 sum log Lii</text>
<line x1="600" y1="176" x2="600" y2="213" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="225" width="310" height="64" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="263.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">general: P A=L U; sign + sum log|Uii|</text>
<line x1="600" y1="293" x2="600" y2="330" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="342" width="310" height="64" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="380.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">Do not form det and then take log</text>
<text x="445" y="451" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">inverse action也通过 solve 获得。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">概率模型中的两类调用</text>
<text x="835" y="125" font-size="19" font-weight="700" text-anchor="start" fill="#2563EB">Gaussian</text>
<text x="835" y="160" font-size="16" font-weight="400" text-anchor="start" fill="#1F2937" class="math">1/2 log det Sigma + 1/2 r^T Sigma^-1 r</text>
<text x="835" y="205" font-size="19" font-weight="700" text-anchor="start" fill="#0F766E">Normalizing flow</text>
<text x="835" y="240" font-size="16" font-weight="400" text-anchor="start" fill="#1F2937" class="math">log p_X = log p_Z + log|det J_f|</text>
<rect x="835" y="300" width="310" height="70" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="341.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">sigma_min -&gt; 0: logdet -&gt; -infinity; gradient grows</text>
<text x="835" y="410" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">结构化三角 Jacobian 降低计算成本。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先分清体积、符号与可逆性，再在对数域计算；接近奇异时必须报告条件性。</text>
</svg>