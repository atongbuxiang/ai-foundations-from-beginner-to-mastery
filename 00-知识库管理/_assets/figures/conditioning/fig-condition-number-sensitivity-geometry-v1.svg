<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">条件数的椭球几何、奇异边界和误差分层</title><desc id="d">三个面板展示压扁椭球造成逆问题放大，到奇异矩阵集合的距离，以及条件性与算法稳定性共同决定前向误差。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker><style>.T{font:700 22px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.P{font:700 17px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.B{font:14px -apple-system,"PingFang SC",sans-serif;fill:#334155}.S{font:12px -apple-system,"PingFang SC",sans-serif;fill:#475569}.M{font:italic 15px Georgia,serif;fill:#0f172a}</style></defs><rect width="1200" height="430" rx="18" fill="#f8fafc"/><text x="42" y="38" class="T">条件数：问题对扰动的放大率，不是算法的罪名</text>
<g transform="translate(30 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">A  小奇异值：逆问题必须强放大</text><circle cx="78" cy="156" r="56" fill="#dbeafe" fill-opacity=".5" stroke="#2563eb" stroke-width="3"/><path d="M143 156H189" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><ellipse cx="266" cy="156" rx="81" ry="14" transform="rotate(-15 266 156)" fill="#ffedd5" stroke="#f97316" stroke-width="4"/><line x1="266" y1="156" x2="344" y2="136" stroke="#ef4444" stroke-width="3"/><line x1="266" y1="156" x2="262" y2="143" stroke="#16a34a" stroke-width="4"/><text x="292" y="121" class="S">σ₁</text><text x="234" y="128" class="S">σₙ ≪ σ₁</text><text x="20" y="258" class="M">正向最多 ×σ₁；反演最多 ×1/σₙ</text><text x="20" y="287" class="M">κ₂(A) = σ₁ / σₙ</text><text x="20" y="318" class="S">短轴压掉的信息，只能连同噪声一起放大</text></g>
<g transform="translate(420 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">B  到奇异边界的距离</text><rect x="34" y="82" width="117" height="72" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="64" y="112" class="B">可逆 A</text><text x="51" y="137" class="S">σₙ(A) &gt; 0</text><path d="M153 118H269" stroke="#ef4444" stroke-width="4" marker-end="url(#a)"/><text x="171" y="101" class="M">E = −σₙuₙvₙ*</text><rect x="272" y="82" width="60" height="72" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="283" y="112" class="B">奇异</text><text x="283" y="137" class="S">σₙ=0</text><line x1="40" y1="210" x2="326" y2="210" stroke="#94a3b8"/><circle cx="91" cy="210" r="7" fill="#16a34a"/><line x1="98" y1="210" x2="295" y2="210" stroke="#ef4444" stroke-width="5"/><path d="M295 192V228" stroke="#dc2626" stroke-width="3"/><text x="63" y="242" class="S">A</text><text x="256" y="242" class="S">奇异集合</text><text x="20" y="282" class="M">dist₂(A, singular) = σₙ(A)</text><text x="20" y="310" class="M">相对距离 = σₙ/σ₁ = 1/κ₂(A)</text></g>
<g transform="translate(810 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">C  总误差：问题层与算法层分开</text><rect x="22" y="64" width="126" height="58" rx="10" fill="#dbeafe"/><text x="39" y="89" class="B">数据扰动</text><text x="36" y="108" class="S">真实 / 舍入 / 量化</text><rect x="212" y="64" width="126" height="58" rx="10" fill="#ffedd5"/><text x="231" y="89" class="B">问题条件数 κ</text><text x="225" y="108" class="S">真解的固有敏感性</text><path d="M149 93H209" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="22" y="161" width="126" height="58" rx="10" fill="#ede9fe"/><text x="37" y="186" class="B">算法后向误差 η</text><text x="36" y="205" class="S">解了多近的问题</text><rect x="212" y="161" width="126" height="58" rx="10" fill="#fee2e2"/><text x="236" y="186" class="B">前向误差</text><text x="229" y="205" class="S">输出离真解多远</text><path d="M149 190H209" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><path d="M275 124V158" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="20" y="266" class="M">forward error ≲ κ × backward error</text><text x="20" y="294" class="S">小残差只说明方程几乎满足；病态时解仍可很远</text><text x="20" y="318" class="S">稳定算法不能消除问题条件性</text></g></svg>
