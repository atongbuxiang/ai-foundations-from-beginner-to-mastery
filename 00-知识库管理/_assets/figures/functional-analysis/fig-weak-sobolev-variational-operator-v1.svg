<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">弱导数、Sobolev 空间、弱 PDE 与神经算子的三层接口</title>
  <desc id="desc">从经典导数失效，经测试函数和 Sobolev 空间，到变分 PDE、Galerkin 与神经算子，并标明各层误差合同。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#10243b"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#193550"/>
      <stop offset="1" stop-color="#10283e"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183b3b"/>
      <stop offset="1" stop-color="#102d32"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#332c54"/>
      <stop offset="1" stop-color="#242541"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#66c7ff"/>
    </marker>
    <marker id="arrowMint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#70e0bf"/>
    </marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#f4f8ff}
      .sub{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#a9bdd3}
      .head{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#f8fbff}
      .body{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#dce9f7}
      .small{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#b9cadc}
      .math{font:500 16px Georgia,"Times New Roman",serif;fill:#f6fbff}
      .tag{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.6px}
    </style>
  </defs>
  <rect width="1440" height="760" fill="url(#bg)"/>
  <circle cx="1280" cy="90" r="240" fill="#3976b8" opacity=".08"/>
  <circle cx="90" cy="720" r="260" fill="#24a98a" opacity=".07"/>

  <text x="70" y="59" class="title">从不可微函数到可学习的 PDE 解算子</text>
  <text x="70" y="88" class="sub">对象 → 空间 → 方程 → 离散/学习；每一步都必须声明假设、范数与误差</text>

  <g filter="url(#shadow)">
    <rect x="55" y="125" width="410" height="535" rx="24" fill="url(#c1)" stroke="#3e779f"/>
    <rect x="515" y="125" width="410" height="535" rx="24" fill="url(#c2)" stroke="#3f8a78"/>
    <rect x="975" y="125" width="410" height="535" rx="24" fill="url(#c3)" stroke="#7768aa"/>
  </g>

  <rect x="80" y="148" width="95" height="26" rx="13" fill="#14304a" stroke="#66c7ff"/>
  <text x="128" y="166" text-anchor="middle" class="tag" fill="#78d0ff">OBJECT</text>
  <text x="80" y="207" class="head">① 微分的弱化</text>
  <text x="80" y="240" class="body">经典导数可能在点、界面或跳跃处失效</text>

  <path d="M105 300 L185 300 L185 254 L268 346 L185 438 L185 392 L105 392 Z" fill="#0e2134" stroke="#66c7ff" stroke-width="2"/>
  <text x="142" y="337" text-anchor="middle" class="math">u</text>
  <text x="142" y="362" text-anchor="middle" class="small">低正则</text>
  <text x="210" y="321" text-anchor="middle" class="small">把导数</text>
  <text x="210" y="343" text-anchor="middle" class="small">移给测试函数</text>
  <text x="210" y="375" text-anchor="middle" class="math">φ ∈ C∞c</text>
  <text x="315" y="320" class="math">⟨Dᵅu,φ⟩</text>
  <text x="315" y="351" class="math">= (−1)|ᵅ|⟨u,Dᵅφ⟩</text>
  <text x="315" y="389" class="small">对所有 φ 成立</text>

  <line x1="94" y1="480" x2="427" y2="480" stroke="#34556f"/>
  <text x="95" y="515" class="body">|x|′ = sign(x) a.e.</text>
  <text x="95" y="545" class="body">H′ = δ₀　→ 不是 Lᵖ 弱导数</text>
  <text x="95" y="575" class="body">ReLU″ = δ₀　→ 二阶强残差需审计</text>
  <rect x="94" y="605" width="335" height="35" rx="9" fill="#0b2237"/>
  <text x="262" y="628" text-anchor="middle" class="small" fill="#78d0ff">分布导数总存在；Sobolev 弱导数须由函数表示</text>

  <rect x="540" y="148" width="95" height="26" rx="13" fill="#123330" stroke="#70e0bf"/>
  <text x="588" y="166" text-anchor="middle" class="tag" fill="#81e9ca">SPACE</text>
  <text x="540" y="207" class="head">② Sobolev 与弱 PDE</text>
  <text x="540" y="240" class="body">Wᵏ,ᵖ：函数与弱导数都在 Lᵖ</text>

  <g>
    <rect x="548" y="270" width="156" height="72" rx="12" fill="#0d2d2b" stroke="#55ae98"/>
    <text x="626" y="299" text-anchor="middle" class="body">Trace / H₀¹</text>
    <text x="626" y="324" text-anchor="middle" class="small">边界条件有意义</text>
    <rect x="736" y="270" width="156" height="72" rx="12" fill="#0d2d2b" stroke="#55ae98"/>
    <text x="814" y="299" text-anchor="middle" class="body">Poincaré</text>
    <text x="814" y="324" text-anchor="middle" class="small">梯度控制函数</text>
    <rect x="548" y="365" width="156" height="72" rx="12" fill="#0d2d2b" stroke="#55ae98"/>
    <text x="626" y="394" text-anchor="middle" class="body">Embedding</text>
    <text x="626" y="419" text-anchor="middle" class="small">积分正则 → 可积/连续</text>
    <rect x="736" y="365" width="156" height="72" rx="12" fill="#0d2d2b" stroke="#55ae98"/>
    <text x="814" y="394" text-anchor="middle" class="body">Compactness</text>
    <text x="814" y="419" text-anchor="middle" class="small">弱界 → 强子列</text>
  </g>
  <path d="M720 450 L720 478" stroke="#70e0bf" stroke-width="2" marker-end="url(#arrowMint)"/>
  <rect x="548" y="487" width="344" height="82" rx="14" fill="#0a2727" stroke="#70e0bf" stroke-width="2"/>
  <text x="720" y="519" text-anchor="middle" class="math">∫Ω ∇u·∇v = ⟨f,v⟩　∀v∈H₀¹</text>
  <text x="720" y="547" text-anchor="middle" class="small">Lax–Milgram：存在 + 唯一 + 稳定</text>
  <rect x="548" y="590" width="344" height="50" rx="11" fill="#102f31"/>
  <text x="720" y="612" text-anchor="middle" class="body">Galerkin + Céa</text>
  <text x="720" y="632" text-anchor="middle" class="small">误差 ≤ 稳定常数 × 最佳逼近误差</text>

  <rect x="1000" y="148" width="95" height="26" rx="13" fill="#292440" stroke="#b09aff"/>
  <text x="1048" y="166" text-anchor="middle" class="tag" fill="#c0adff">LEARN</text>
  <text x="1000" y="207" class="head">③ 科学机器学习接口</text>
  <text x="1000" y="240" class="body">先问：学一个解，还是学整个解算子？</text>

  <rect x="1002" y="273" width="163" height="106" rx="14" fill="#24213b" stroke="#8978c2"/>
  <text x="1084" y="302" text-anchor="middle" class="body">单个解 uθ(x)</text>
  <text x="1084" y="330" text-anchor="middle" class="small">PINN：强残差</text>
  <text x="1084" y="354" text-anchor="middle" class="small">Deep Ritz / VPINN</text>
  <rect x="1195" y="273" width="163" height="106" rx="14" fill="#24213b" stroke="#8978c2"/>
  <text x="1277" y="302" text-anchor="middle" class="body">算子 G: X → Y</text>
  <text x="1277" y="330" text-anchor="middle" class="small">DeepONet：sensors/query</text>
  <text x="1277" y="354" text-anchor="middle" class="small">FNO：modes/grid/FFT</text>

  <text x="1001" y="420" class="small">三件事必须分开：</text>
  <circle cx="1012" cy="452" r="5" fill="#b09aff"/>
  <text x="1027" y="458" class="body">参数可跨网格共享</text>
  <circle cx="1012" cy="484" r="5" fill="#b09aff"/>
  <text x="1027" y="490" class="body">函数空间上的逼近存在性</text>
  <circle cx="1012" cy="516" r="5" fill="#b09aff"/>
  <text x="1027" y="522" class="body">有限数据下的 OOD / 分辨率泛化</text>

  <rect x="1001" y="555" width="357" height="85" rx="13" fill="#211f37" stroke="#6f609c"/>
  <text x="1179" y="583" text-anchor="middle" class="body">误差总账</text>
  <text x="1179" y="609" text-anchor="middle" class="small">建模 · 离散 · 表示 · 采样 · 优化</text>
  <text x="1179" y="631" text-anchor="middle" class="small">分布/OOD · 浮点/条件数</text>

  <path d="M472 392 L504 392" stroke="#66c7ff" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M932 392 L964 392" stroke="#70e0bf" stroke-width="3" marker-end="url(#arrowMint)"/>

  <rect x="265" y="689" width="910" height="42" rx="21" fill="#0b1b2d" stroke="#34536f"/>
  <text x="720" y="716" text-anchor="middle" class="body">同一个词“误差很小”没有意义，除非同时说明：在哪个空间、哪个范数、对哪些输入、相对哪个连续参考解。</text>
</svg>
