<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Bounded、compact operators 与无限维 spectrum</title>
<desc id="desc">Bounded linear operator 等价于连续并由 operator norm 控制；compact operator 把 bounded sequences 送到具有收敛子列的 sequences；无限维 spectrum 由不可有界可逆性定义，不只含 eigenvalues，compact self-adjoint 情形才恢复离散正交谱展开。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">bounded = 线性作用的稳定合同</text>
<circle cx="115" cy="220" r="80" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="115" y="225" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">unit ball</text>
<line x1="205" y1="220" x2="250" y2="220" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<ellipse cx="315" cy="220" rx="55" ry="120" fill="none" stroke="#0F766E" stroke-width="2.5"/>
<text x="315" y="225" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">T(B_X)</text>
<text x="45" y="390" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937" class="math">||Tx|| &lt;= ||T|| ||x||</text>
<text x="45" y="425" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">linear + bounded  &lt;=&gt;  continuous</text>
<text x="45" y="463" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">invertible algebraically is not enough</text>
<text x="45" y="500" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">bounded inverse is a separate requirement。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">compact：有界序列恢复收敛子列</text>
<circle cx="455" cy="135" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="520" cy="190" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="475" cy="285" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="600" cy="120" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="690" cy="190" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="730" cy="315" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="570" cy="345" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="600" y1="235" x2="645" y2="235" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<circle cx="705" cy="253" r="4" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="712" cy="219" r="4" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="719" cy="249" r="4" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="726" cy="223" r="4" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="733" cy="245" r="4" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="740" cy="227" r="4" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="747" cy="241" r="4" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="760" cy="235" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="430" y="392" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">bounded sequence (x_n)</text>
<text x="430" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">-&gt; some (Tx_nk) converges</text>
<text x="430" y="452" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">compact does not require T(B_X) closed</text>
<text x="430" y="484" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">identity on infinite-dimensional H: not compact</text>
<text x="430" y="514" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">finite rank and norm limits are compact。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">spectrum 不只等于 eigenvalues</text>
<rect x="840" y="88" width="300" height="58" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="123.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">T - lambda I has no bounded inverse</text>
<line x1="990" y1="149" x2="990" y2="184" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="840" y="195" width="94" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="887.0" y="227.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">point</text>
<rect x="943" y="195" width="94" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="227.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">continuous</text>
<rect x="1046" y="195" width="94" height="52" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="1093.0" y="227.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">residual</text>
<line x1="990" y1="252" x2="990" y2="285" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="840" y="298" width="300" height="72" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990" y="326" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">compact self-adjoint: orthogonal modes</text>
<text x="990" y="353" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">nonzero spectrum accumulates only at 0</text>
<text x="830" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">0 can be spectral but not an eigenvalue</text>
<text x="830" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">finite sections may mislead</text>
<text x="830" y="495" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">matrix intuition needs extra structure。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Boundedness controls stability，compactness restores subsequences；只有附加结构才把无限维 spectrum 化成矩阵式特征展开。</text>
</svg>