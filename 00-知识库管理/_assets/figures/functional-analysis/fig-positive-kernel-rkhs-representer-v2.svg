<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Positive kernel、RKHS 与 representer theorem</title>
<desc id="desc">PSD kernel 的入口量词是任意有限 Gram matrix 半正定；canonical sections 完备化为 RKHS，点值由 inner product 再生；对经验损失加单调 Hilbert norm regularization 时，最优解落在 sample kernel sections 的有限 span。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">PSD Gram 是全称量词</text>
<circle cx="75" cy="125" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="75" y="111" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">x1</text>
<circle cx="150" cy="95" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="150" y="81" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">x2</text>
<circle cx="235" cy="145" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="235" y="131" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">x3</text>
<circle cx="320" cy="105" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="320" y="91" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">x4</text>
<rect x="90" y="210" width="36" height="36" rx="2" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<rect x="132" y="210" width="36" height="36" rx="2" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.8"/>
<rect x="174" y="210" width="36" height="36" rx="2" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.8"/>
<rect x="216" y="210" width="36" height="36" rx="2" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.8"/>
<rect x="90" y="252" width="36" height="36" rx="2" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.8"/>
<rect x="132" y="252" width="36" height="36" rx="2" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<rect x="174" y="252" width="36" height="36" rx="2" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.8"/>
<rect x="216" y="252" width="36" height="36" rx="2" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.8"/>
<rect x="90" y="294" width="36" height="36" rx="2" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.8"/>
<rect x="132" y="294" width="36" height="36" rx="2" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.8"/>
<rect x="174" y="294" width="36" height="36" rx="2" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<rect x="216" y="294" width="36" height="36" rx="2" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.8"/>
<rect x="90" y="336" width="36" height="36" rx="2" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.8"/>
<rect x="132" y="336" width="36" height="36" rx="2" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.8"/>
<rect x="174" y="336" width="36" height="36" rx="2" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.8"/>
<rect x="216" y="336" width="36" height="36" rx="2" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="280" y="260" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">K_ij=k(x_i,x_j)</text>
<text x="45" y="410" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">for every n, points and coefficients c</text>
<text x="45" y="442" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB" class="math">c^T K c &gt;= 0</text>
<text x="45" y="478" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">symmetric similarity alone is insufficient</text>
<text x="45" y="506" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">one sampled PSD matrix proves only a finite test。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Reproducing property：点值连续</text>
<path d="M455 300C500 90 565 370 625 165C675 30 730 280 770 120" fill="none" stroke="#2563EB" stroke-width="3"/>
<circle cx="625" cy="165" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<line x1="625" y1="165" x2="625" y2="350" stroke="#C24135" stroke-width="2" stroke-dasharray="6 5"/>
<text x="625" y="385" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">x</text>
<text x="430" y="420" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">k_x = k(x, .) in H_k</text>
<text x="430" y="455" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E" class="math">f(x) = &lt;f, k_x&gt;_H</text>
<text x="430" y="490" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">|f(x)| &lt;= ||f|| sqrt(k(x,x))</text>
<text x="430" y="516" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">bounded point evaluation is extra structure。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Representer：有限样本 span</text>
<rect x="840" y="105" width="120" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="900.0" y="135.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">(x_1, y_1)</text>
<line x1="963" y1="129" x2="1000" y2="260" stroke="#D7DEE8" stroke-width="1.8"/>
<rect x="840" y="175" width="120" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="900.0" y="205.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">(x_2, y_2)</text>
<line x1="963" y1="199" x2="1000" y2="260" stroke="#D7DEE8" stroke-width="1.8"/>
<rect x="840" y="245" width="120" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="900.0" y="275.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">(x_3, y_3)</text>
<line x1="963" y1="269" x2="1000" y2="260" stroke="#D7DEE8" stroke-width="1.8"/>
<rect x="985" y="225" width="155" height="70" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="1062.5" y="266.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">f* = Σ alpha_i k_xi</text>
<line x1="1072" y1="298" x2="1072" y2="332" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="840" y="345" width="300" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="380.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">finite Gram system + conditioning</text>
<text x="830" y="450" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">loss uses sample values + norm regularizer</text>
<text x="830" y="480" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">monotonicity removes the orthogonal part</text>
<text x="830" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">finite span requires explicit hypotheses。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Kernel 先通过所有有限 PSD 测试定义几何；RKHS 再生点值，representer theorem 在明确损失与正则条件下完成有限化。</text>
</svg>