<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">经验 Rademacher 复杂度：在真实样本上拟合随机符号</title>
<desc id="desc">固定样本后给每个观测独立正负号，函数类与纯噪声的最大相关即经验 Rademacher 复杂度；它同时受样本几何与类的 restrictions 影响，并通过额外集中项形成风险证书。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">固定 S，再随机贴 signs</text>
<circle cx="85" cy="170" r="18" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="85" y="176" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">+</text>
<circle cx="135" cy="170" r="18" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="135" y="176" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">-</text>
<circle cx="185" cy="170" r="18" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="185" y="176" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">+</text>
<circle cx="235" cy="170" r="18" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="235" y="176" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">+</text>
<circle cx="285" cy="170" r="18" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="285" y="176" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">-</text>
<circle cx="335" cy="170" r="18" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="335" y="176" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">-</text>
<path d="M65 300C110 260 150 335 195 280C235 230 285 330 350 245" fill="none" stroke="#0F766E" stroke-width="3"/>
<text x="45" y="375" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">choose f after seeing sigma</text>
<text x="45" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">score = m^-1 sum sigma_i f(z_i)</text>
<text x="45" y="465" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">then average the best score over sigma</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">labels are synthetic; sample locations are real。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">复杂度同时依赖类与样本</text>
<rect x="445" y="95" width="145" height="88" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="517" y="127" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">same class</text>
<text x="517" y="157" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">clustered S</text>
<rect x="610" y="95" width="145" height="88" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="682" y="127" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">same class</text>
<text x="682" y="157" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">spread S</text>
<circle cx="470" cy="245" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="495" cy="255" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="520" cy="240" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="545" cy="250" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="625" cy="210" r="6" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="665" cy="290" r="6" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="705" cy="230" r="6" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="740" cy="325" r="6" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="430" y="385" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">hat R_S(F) is observable up to sign Monte Carlo</text>
<text x="430" y="430" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">R_m(F)=E_S hat R_S(F) is distributional</text>
<text x="430" y="475" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">data-dependent does not mean assumption-free</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">sign-estimation error is a separate budget。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">从随机符号到风险证书</text>
<rect x="840" y="90" width="300" height="72" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990" y="120" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">empirical loss</text>
<text x="990" y="150" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">P_m f</text>
<text x="990" y="200" font-size="22" font-weight="700" text-anchor="middle" fill="#1F2937">+</text>
<rect x="840" y="220" width="300" height="72" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990" y="250" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">2 hat R_S(F)</text>
<text x="990" y="279" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">selection complexity</text>
<text x="990" y="330" font-size="22" font-weight="700" text-anchor="middle" fill="#1F2937">+</text>
<rect x="840" y="350" width="300" height="72" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990" y="380" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">confidence term</text>
<text x="990" y="409" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">order sqrt(log(1/delta)/m)</text>
<text x="830" y="470" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">certificate must use the loss class</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">a small estimate still needs a valid theorem。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">它度量真实样本上的随机符号拟合；风险证书还需要正确的损失类、有界性与集中项。</text>
</svg>