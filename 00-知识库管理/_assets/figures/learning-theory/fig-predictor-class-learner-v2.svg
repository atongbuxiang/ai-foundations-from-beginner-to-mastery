<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">参数表示、函数类与学习算法三层地图</title>
<desc id="desc">参数经表示映射产生预测函数且常多对一；假设空间是允许输出的函数集合；学习算法从随机样本和随机种子选择函数。同一函数类上的不同算法可以有不同输出分布和泛化。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">参数空间到函数空间常多对一</text>
<rect x="80" y="110" width="78" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="119.0" y="140.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">theta1</text>
<rect x="170" y="110" width="78" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="209.0" y="140.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">theta2</text>
<rect x="260" y="110" width="78" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="299.0" y="140.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">theta3</text>
<rect x="120" y="250" width="180" height="66" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="210.0" y="289.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">same predictor h</text>
<line x1="119" y1="161" x2="170" y2="245" stroke="#D7DEE8" stroke-width="2" marker-end="url(#a3)"/>
<line x1="209" y1="161" x2="210" y2="245" stroke="#D7DEE8" stroke-width="2" marker-end="url(#a3)"/>
<line x1="299" y1="161" x2="250" y2="245" stroke="#D7DEE8" stroke-width="2" marker-end="url(#a3)"/>
<text x="45" y="380" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">Phi: Theta -&gt; H need not be injective</text>
<text x="45" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">permutation / scaling symmetries</text>
<text x="45" y="468" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">parameter count != number of functions</text>
<text x="45" y="508" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">parameter distance != prediction distance。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">假设空间是函数集合</text>
<path d="M455 350C480 110 725 90 760 350Z" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5"/>
<path d="M480 192Q505 155 530 188" fill="none" stroke="#2563EB" stroke-width="2"/>
<path d="M575 162Q600 125 625 158" fill="none" stroke="#2563EB" stroke-width="2"/>
<path d="M665 217Q690 180 715 213" fill="none" stroke="#2563EB" stroke-width="2"/>
<path d="M525 297Q550 260 575 293" fill="none" stroke="#2563EB" stroke-width="2"/>
<path d="M635 312Q660 275 685 308" fill="none" stroke="#2563EB" stroke-width="2"/>
<text x="605" y="385" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">H subset of A^X</text>
<text x="430" y="430" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">architecture / constraints define candidates</text>
<text x="430" y="465" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">data-dependent H changes the proof object</text>
<text x="430" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">capacity belongs to functions, not filenames。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Learner 选择函数并带随机性</text>
<rect x="840" y="90" width="120" height="54" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="900.0" y="123.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">sample S</text>
<rect x="1020" y="90" width="120" height="54" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="1080.0" y="123.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">seed U</text>
<rect x="900" y="220" width="180" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="257.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">algorithm A</text>
<line x1="900" y1="147" x2="950" y2="215" stroke="#D7DEE8" stroke-width="2" marker-end="url(#a3)"/>
<line x1="1080" y1="147" x2="1030" y2="215" stroke="#D7DEE8" stroke-width="2" marker-end="url(#a3)"/>
<line x1="990" y1="285" x2="990" y2="325" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="870" y="338" width="240" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="375.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">random output h_{S,U}</text>
<text x="830" y="450" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">optimizer / early stop / regularizer are in A</text>
<text x="830" y="480" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">same H, different A -&gt; different stability</text>
<text x="830" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">learnability and computability remain separate。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">参数是表示，H 是候选函数集合，A 是数据依赖选择规则；三层必须分别声明与分析。</text>
</svg>