<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">决策树：递归分区、局部增益与全树剪枝</title>
<desc id="desc">树把输入空间递归切成叶区域并输出局部常数；每次 split 只最大化当前 node 的 impurity decrease。maximal tree 再沿 cost-complexity path 剪枝，选择必须放入独立 validation/CV protocol。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">递归轴对齐划分</text>
<rect x="60" y="100" width="290" height="300" rx="2" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2"/>
<line x1="185" y1="100" x2="185" y2="400" stroke="#2563EB" stroke-width="3"/>
<line x1="185" y1="245" x2="350" y2="245" stroke="#0F766E" stroke-width="3"/>
<line x1="60" y1="315" x2="185" y2="315" stroke="#C24135" stroke-width="3"/>
<text x="120" y="180" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">R1</text>
<text x="270" y="180" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">R2</text>
<text x="270" y="335" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135">R3</text>
<text x="120" y="365" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135">R4</text>
<text x="45" y="450" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937" class="math">f_T(x) = sum_m c_m 1{x in R_m}</text>
<text x="45" y="490" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">leaf means minimize within-leaf squared error</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">piecewise constants do not extrapolate trends。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">局部分裂与剪枝</text>
<rect x="445" y="92" width="310" height="68" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="132.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">gain = I(parent) - weighted child I</text>
<line x1="600" y1="165" x2="600" y2="195" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="205" width="310" height="68" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="245.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">grow a large tree greedily</text>
<line x1="600" y1="278" x2="600" y2="308" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="318" width="310" height="72" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="360.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">R_alpha(T) = R(T) + alpha |leaves|</text>
<line x1="600" y1="395" x2="600" y2="425" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="435" width="310" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="468.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">CV chooses subtree / alpha</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">greedy growth is not global partition search。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">不稳定性与选择偏差</text>
<line x1="865" y1="105" x2="865" y2="390" stroke="#D7DEE8" stroke-width="2"/>
<line x1="1095" y1="105" x2="1095" y2="390" stroke="#D7DEE8" stroke-width="2"/>
<path d="M875 160C930 120 980 180 1085 135" fill="none" stroke="#2563EB" stroke-width="3"/>
<path d="M875 175C930 215 995 145 1085 195" fill="none" stroke="#C24135" stroke-width="3"/>
<line x1="975" y1="105" x2="975" y2="390" stroke="#0F766E" stroke-width="3"/>
<line x1="995" y1="105" x2="995" y2="390" stroke="#C24135" stroke-width="3" stroke-dasharray="7 6"/>
<text x="835" y="420" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">small data change -&gt; different root split</text>
<text x="835" y="460" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">many candidate cuts inflate apparent gain</text>
<text x="835" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">leaf frequency is not automatically calibrated</text>
<text x="835" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">importance depends on correlation and protocol。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">树的可解释性来自明确 partition；其代价是局部贪心、离散不稳定与 data-dependent selection。</text>
</svg>