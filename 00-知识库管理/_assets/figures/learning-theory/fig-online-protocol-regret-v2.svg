<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Online Protocol：时序先于 Regret</title>
<desc id="desc">逐轮可见信息决定可实现算法；累计损失必须与预先声明的 comparator class 比较。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">一轮中的信息时序</text>
<rect x="65" y="90" width="270" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="200.0" y="120.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">history H(t-1)</text>
<line x1="200" y1="141" x2="200" y2="181" stroke="#1F2937" stroke-width="2.3" marker-end="url(#a3)"/>
<rect x="65" y="190" width="270" height="48" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="200.0" y="220.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">choose w(t)</text>
<line x1="200" y1="241" x2="200" y2="281" stroke="#1F2937" stroke-width="2.3" marker-end="url(#a3)"/>
<rect x="65" y="290" width="270" height="48" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="200.0" y="320.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">reveal loss(t)</text>
<line x1="200" y1="341" x2="200" y2="381" stroke="#1F2937" stroke-width="2.3" marker-end="url(#a3)"/>
<rect x="65" y="390" width="270" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="200.0" y="420.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">feedback</text>
<text x="55" y="500" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">关键：选择当前 action 时看不到当前 loss。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">两条累计损失轨道</text>
<text x="445" y="112" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB">learner</text>
<path d="M455 301.3L503 206.7L551 266.9L599 163.70000000000002L647 238.95L695 191.65" fill="none" stroke="#2563EB" stroke-width="3"/>
<path d="M455 271.2L503 258.3L551 249.7L599 236.8L647 226.05L695 213.15" fill="none" stroke="#0F766E" stroke-width="3" stroke-dasharray="7 5"/>
<circle cx="455" cy="301.3" r="4" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="503" cy="206.7" r="4" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="551" cy="266.9" r="4" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="599" cy="163.70000000000002" r="4" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="647" cy="238.95" r="4" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="695" cy="191.65" r="4" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="455" cy="271.2" r="4" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="503" cy="258.3" r="4" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="551" cy="249.7" r="4" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="599" cy="236.8" r="4" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="647" cy="226.05" r="4" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="695" cy="213.15" r="4" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<line x1="445" y1="355" x2="755" y2="355" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="445" y="390" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">R(T) = learner cumulative loss</text>
<text x="445" y="420" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">        - best fixed hindsight loss</text>
<text x="445" y="458" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">best fixed ≠ best action at every round</text>
<text x="445" y="492" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">regret may be negative</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">先声明 Feedback 与 Benchmark</text>
<rect x="840" y="95" width="135" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="907.5" y="125.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">full information</text>
<line x1="980" y1="119" x2="1010" y2="119" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1022" y="125" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">all losses</text>
<rect x="840" y="173" width="135" height="48" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="907.5" y="203.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">gradient</text>
<line x1="980" y1="197" x2="1010" y2="197" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1022" y="203" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">local first order</text>
<rect x="840" y="251" width="135" height="48" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="907.5" y="281.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">bandit</text>
<line x1="980" y1="275" x2="1010" y2="275" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1022" y="281" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">chosen loss only</text>
<rect x="840" y="329" width="135" height="48" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="907.5" y="359.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">delayed</text>
<line x1="980" y1="353" x2="1010" y2="353" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1022" y="359" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">arrives later</text>
<rect x="840" y="420" width="300" height="55" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="453.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">static / dynamic / policy regret</text>
<text x="840" y="508" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">协议改变，定理对象随之改变。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先画信息时序，再写 comparator 与概率量词，最后才选择算法和 regret bound。</text>
</svg>