<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">No-Free-Lunch：两个不可区分世界与归纳偏置</title>
<desc id="desc">训练样本只约束已见点；若允许任意 target labeling，就能构造在样本上完全相同、却在未见点给出相反标签的世界。任何外推规则都必须偏爱某些结构，这就是归纳偏置。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">样本只照亮输入域的一部分</text>
<circle cx="70" cy="120" r="18" fill="#2563EB" stroke="#2563EB" stroke-width="2.5"/>
<text x="70" y="126" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFEFB">seen</text>
<circle cx="145" cy="120" r="18" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2.5"/>
<text x="145" y="126" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">?</text>
<circle cx="220" cy="120" r="18" fill="#2563EB" stroke="#2563EB" stroke-width="2.5"/>
<text x="220" y="126" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFEFB">seen</text>
<circle cx="295" cy="120" r="18" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2.5"/>
<text x="295" y="126" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">?</text>
<circle cx="70" cy="210" r="18" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2.5"/>
<text x="70" y="216" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">?</text>
<circle cx="145" cy="210" r="18" fill="#2563EB" stroke="#2563EB" stroke-width="2.5"/>
<text x="145" y="216" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFEFB">seen</text>
<circle cx="220" cy="210" r="18" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2.5"/>
<text x="220" y="216" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">?</text>
<circle cx="295" cy="210" r="18" fill="#2563EB" stroke="#2563EB" stroke-width="2.5"/>
<text x="295" y="216" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFEFB">seen</text>
<circle cx="70" cy="300" r="18" fill="#2563EB" stroke="#2563EB" stroke-width="2.5"/>
<text x="70" y="306" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFEFB">seen</text>
<circle cx="145" cy="300" r="18" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2.5"/>
<text x="145" y="306" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">?</text>
<circle cx="220" cy="300" r="18" fill="#2563EB" stroke="#2563EB" stroke-width="2.5"/>
<text x="220" y="306" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFEFB">seen</text>
<circle cx="295" cy="300" r="18" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2.5"/>
<text x="295" y="306" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">?</text>
<text x="45" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">at most m distinct points are observed</text>
<text x="45" y="462" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">at least m of 2m points can remain unseen</text>
<text x="45" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">zero training error says nothing there。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">两个世界在训练集上完全一致</text>
<rect x="445" y="95" width="310" height="75" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600" y="127" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">world f0</text>
<text x="600" y="155" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">seen labels: 0 1 1 0 | unseen: 0 0 1</text>
<rect x="445" y="210" width="310" height="75" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600" y="242" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">world f1</text>
<text x="600" y="270" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">seen labels: 0 1 1 0 | unseen: 1 1 0</text>
<line x1="600" y1="289" x2="600" y2="330" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="485" y="342" width="230" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600" y="379" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">same learner output law</text>
<text x="430" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">one prediction must fail in one world</text>
<text x="430" y="490" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">averaging finds a fixed hard target</text>
<text x="430" y="520" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">the hard distribution remains realizable。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">学习靠什么打破对称性</text>
<text x="830" y="90" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">hypothesis class</text>
<text x="955" y="90" font-size="15" font-weight="600" text-anchor="start" fill="#1F2937">exclude arbitrary labels</text>
<text x="830" y="168" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">representation</text>
<text x="955" y="168" font-size="15" font-weight="600" text-anchor="start" fill="#1F2937">nearby inputs share features</text>
<text x="830" y="246" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">architecture</text>
<text x="955" y="246" font-size="15" font-weight="600" text-anchor="start" fill="#1F2937">equivariance / locality</text>
<text x="830" y="324" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">optimization</text>
<text x="955" y="324" font-size="15" font-weight="600" text-anchor="start" fill="#1F2937">prefer some interpolants</text>
<text x="830" y="402" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">data protocol</text>
<text x="955" y="402" font-size="15" font-weight="600" text-anchor="start" fill="#1F2937">encode invariance</text>
<text x="830" y="485" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">NFL does not say all algorithms tie on reality</text>
<text x="830" y="520" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">it says reality must be restricted or biased。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">没有无条件外推：模型成功意味着其归纳偏置与现实结构、任务损失和数据机制之间存在可利用的匹配。</text>
</svg>