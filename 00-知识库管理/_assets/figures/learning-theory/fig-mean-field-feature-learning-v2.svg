<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Mean-Field：从粒子云到 Feature Dynamics</title>
<desc id="desc">神经元参数的经验测度在极限中被 residual-dependent 速度场搬运；分布变化使特征而非只使线性系数发生演化。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">有限宽 = 参数粒子云</text>
<circle cx="95" cy="145" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="165" cy="118" r="8" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="235" cy="165" r="8" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="295" cy="125" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="125" cy="245" r="8" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="210" cy="255" r="8" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="310" cy="230" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="270" cy="320" r="8" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="155" cy="335" r="8" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="55" y="392" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937" class="math">rho_m = (1/m) sum_j delta_theta_j</text>
<text x="55" y="435" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">f_rho(x) = integral phi(x;theta) d rho</text>
<text x="55" y="482" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">width grows -&gt; measure, not longer notation</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Residual 生成速度场</text>
<circle cx="480" cy="150" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="480" y1="150" x2="502" y2="168" stroke="#0F766E" stroke-width="2" marker-end="url(#a1)"/>
<circle cx="545" cy="205" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="545" y1="205" x2="527" y2="223" stroke="#0F766E" stroke-width="2" marker-end="url(#a1)"/>
<circle cx="610" cy="140" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="610" y1="140" x2="632" y2="158" stroke="#0F766E" stroke-width="2" marker-end="url(#a1)"/>
<circle cx="680" cy="225" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="680" y1="225" x2="662" y2="243" stroke="#0F766E" stroke-width="2" marker-end="url(#a1)"/>
<circle cx="735" cy="150" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="735" y1="150" x2="757" y2="130" stroke="#0F766E" stroke-width="2" marker-end="url(#a1)"/>
<circle cx="520" cy="330" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="520" y1="330" x2="502" y2="310" stroke="#0F766E" stroke-width="2" marker-end="url(#a1)"/>
<circle cx="620" cy="345" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="620" y1="345" x2="642" y2="325" stroke="#0F766E" stroke-width="2" marker-end="url(#a1)"/>
<circle cx="710" cy="320" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="710" y1="320" x2="692" y2="300" stroke="#0F766E" stroke-width="2" marker-end="url(#a1)"/>
<path d="M470 410C535 375 665 455 755 390" fill="none" stroke="#C24135" stroke-width="2.5"/>
<text x="445" y="455" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937" class="math">partial_t rho = div(rho grad Psi[rho])</text>
<text x="445" y="493" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">Psi depends on the current predictor</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">训练 Regime 是连续谱</text>
<line x1="865" y1="210" x2="1115" y2="210" stroke="#D7DEE8" stroke-width="8"/>
<circle cx="885" cy="210" r="13" fill="#FFFEFB" stroke="#2563EB" stroke-width="3"/>
<circle cx="1000" cy="210" r="13" fill="#FFFEFB" stroke="#B7791F" stroke-width="3"/>
<circle cx="1100" cy="210" r="13" fill="#FFFEFB" stroke="#0F766E" stroke-width="3"/>
<text x="885" y="172" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">lazy</text>
<text x="1000" y="172" font-size="16" font-weight="700" text-anchor="middle" fill="#B7791F">mixed</text>
<text x="1100" y="172" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">rich</text>
<text x="840" y="285" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">kernel drift</text>
<text x="840" y="323" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">feature covariance / transfer</text>
<text x="840" y="361" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">scaling + step + time</text>
<rect x="840" y="410" width="300" height="55" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="443.5" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">finite-width bridge required</text>
<text x="840" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">feature movement != useful representation</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Mean-field 保留可演化特征，但泛化仍取决于数据结构、有限宽误差与风险桥。</text>
</svg>