<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">从固定预测器的浓缩到数据依赖选择</title>
<desc id="desc">Hoeffding 直接控制看数据前固定的 h；若 h 由同一训练集选出，必须改用同时控制、稳定性或独立测试集。置信半径只在有界、独立和目标分布不变的合同下成立。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">固定 h：经验均值围绕总体均值</text>
<line x1="60" y1="320" x2="350" y2="320" stroke="#D7DEE8" stroke-width="2"/>
<line x1="60" y1="120" x2="60" y2="320" stroke="#D7DEE8" stroke-width="2"/>
<line x1="75" y1="220" x2="335" y2="220" stroke="#0F766E" stroke-width="2.5"/>
<text x="342" y="226" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">R_P(h)</text>
<circle cx="85" cy="250" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="85" y1="320" x2="85" y2="250" stroke="#D7DEE8" stroke-width="1.5"/>
<circle cx="125" cy="185" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="125" y1="320" x2="125" y2="185" stroke="#D7DEE8" stroke-width="1.5"/>
<circle cx="165" cy="235" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="165" y1="320" x2="165" y2="235" stroke="#D7DEE8" stroke-width="1.5"/>
<circle cx="205" cy="205" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="205" y1="320" x2="205" y2="205" stroke="#D7DEE8" stroke-width="1.5"/>
<circle cx="245" cy="255" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="245" y1="320" x2="245" y2="255" stroke="#D7DEE8" stroke-width="1.5"/>
<circle cx="285" cy="195" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="285" y1="320" x2="285" y2="195" stroke="#D7DEE8" stroke-width="1.5"/>
<circle cx="325" cy="225" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="325" y1="320" x2="325" y2="225" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="45" y="385" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">R_S(h)=m^{-1} sum_i ell(h,Z_i)</text>
<text x="45" y="425" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB" class="math">Pr(|R_S-R_P| &gt; eps) &lt;= 2 exp(-2m eps^2)</text>
<text x="45" y="475" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">requires iid and loss in [0,1]</text>
<text x="45" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">pointwise statement: h was fixed before S。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">学习器看过 S：选择引入偏差</text>
<rect x="445" y="112" width="185" height="48" rx="7" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="537" y="142" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">candidate h1</text>
<text x="655" y="142" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">R_S=0.31</text>
<rect x="445" y="190" width="185" height="48" rx="7" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="537" y="220" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">candidate h2</text>
<text x="655" y="220" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">R_S=0.24</text>
<rect x="445" y="268" width="185" height="48" rx="7" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="537" y="298" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">candidate h3</text>
<text x="655" y="298" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">R_S=0.17</text>
<rect x="445" y="346" width="185" height="48" rx="7" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="537" y="376" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">candidate h4</text>
<text x="655" y="376" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">R_S=0.10</text>
<path d="M725 105C780 165 780 330 725 400" fill="none" stroke="#C24135" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="665" y="435" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">A selects the smallest</text>
<text x="430" y="480" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">E R_S(h_S) need not equal E R_P(h_S)</text>
<text x="430" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">the minimum is optimistically selected。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三条合法的修桥路线</text>
<rect x="840" y="100" width="300" height="78" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="860" y="129" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">uniform control</text>
<text x="860" y="158" font-size="15" font-weight="600" text-anchor="start" fill="#1F2937">one event covers every h</text>
<rect x="840" y="212" width="300" height="78" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="860" y="241" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">algorithmic stability</text>
<text x="860" y="270" font-size="15" font-weight="600" text-anchor="start" fill="#1F2937">bound sensitivity to one sample</text>
<rect x="840" y="324" width="300" height="78" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="860" y="353" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">fresh evaluation</text>
<text x="860" y="382" font-size="15" font-weight="600" text-anchor="start" fill="#1F2937">condition on frozen h_S</text>
<text x="830" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">dependence / heavy tails need new tools</text>
<text x="830" y="490" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">distribution shift is not sampling noise</text>
<text x="830" y="520" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">name the randomness before using a tail bound。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">浓缩不等式先回答固定查询；学习理论的核心工作，是把它升级为对数据依赖输出仍然有效的风险证书。</text>
</svg>