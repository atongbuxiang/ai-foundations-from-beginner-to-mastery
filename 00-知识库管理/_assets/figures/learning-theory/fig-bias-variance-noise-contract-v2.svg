<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">偏差、方差与噪声：先固定概率对象</title>
<desc id="desc">在固定测试输入处，重复训练产生预测分布；其中心与真实条件均值之差是偏差，散布是方差，fresh response 的条件随机性是噪声。积分到新输入后才得到 Random-X risk。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">固定 x0，重复训练</text>
<line x1="65" y1="330" x2="345" y2="330" stroke="#D7DEE8" stroke-width="2"/>
<line x1="210" y1="95" x2="210" y2="360" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="6 5"/>
<text x="210" y="82" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">f*(x0)</text>
<circle cx="115" cy="265" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="145" cy="210" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="165" cy="300" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="180" cy="245" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="195" cy="190" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="225" cy="280" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="245" cy="225" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="265" cy="255" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="290" cy="205" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="190" y1="170" x2="190" y2="315" stroke="#0F766E" stroke-width="3"/>
<text x="180" y="390" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">mean prediction</text>
<text x="45" y="435" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">bias = E_S fhat(x0) - f*(x0)</text>
<text x="45" y="475" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">variance = spread over repeated S and seeds</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">one fitted curve cannot reveal this distribution。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">平方误差的三个正交来源</text>
<rect x="445" y="105" width="310" height="72" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="147.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">irreducible noise  Var(Y|x0)</text>
<rect x="445" y="225" width="310" height="72" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="267.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">squared bias  [E fhat - f*]^2</text>
<rect x="445" y="345" width="310" height="72" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="387.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">estimator variance  Var(fhat)</text>
<text x="430" y="460" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937" class="math">expected test MSE = noise + bias^2 + variance</text>
<text x="430" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">cross terms vanish only under the declared centering</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">the identity is loss-specific。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Trade-off 不是单调定律</text>
<line x1="850" y1="390" x2="1125" y2="390" stroke="#D7DEE8" stroke-width="2"/>
<line x1="850" y1="105" x2="850" y2="390" stroke="#D7DEE8" stroke-width="2"/>
<path d="M860 130C930 180 1020 285 1115 360" fill="none" stroke="#2563EB" stroke-width="3"/>
<path d="M860 355C930 290 1020 180 1115 125" fill="none" stroke="#0F766E" stroke-width="3"/>
<path d="M860 300C930 220 1010 215 1115 305" fill="none" stroke="#C24135" stroke-width="3"/>
<text x="875" y="165" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">bias^2</text>
<text x="1050" y="165" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">variance</text>
<text x="1000" y="270" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">total</text>
<text x="985" y="425" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">flexibility</text>
<text x="830" y="465" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">double descent can change the risk shape</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">decomposition is an identity, not a universal curve。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先声明测试点、训练随机性和 loss，再谈 bias、variance 与可约误差。</text>
</svg>