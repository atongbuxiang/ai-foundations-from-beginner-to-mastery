<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">样本压缩：从少量见证到一致重构与泛化</title>
<desc id="desc">compression map 从完整标注样本选择至多 k 个见证和有限 side message；reconstruction map 仅凭这些信息恢复 hypothesis，并必须与完整样本一致。计数压缩选择即可控制坏假设漏过其余样本的概率。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">压缩器只保留少量见证</text>
<circle cx="57" cy="125" r="13" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2.5"/>
<text x="57" y="130" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">+</text>
<circle cx="111" cy="125" r="13" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2.5"/>
<text x="111" y="130" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">−</text>
<circle cx="165" cy="125" r="13" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="165" y="130" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">+</text>
<circle cx="219" cy="125" r="13" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2.5"/>
<text x="219" y="130" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">−</text>
<circle cx="273" cy="125" r="13" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2.5"/>
<text x="273" y="130" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">+</text>
<circle cx="327" cy="125" r="13" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2.5"/>
<text x="327" y="130" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">−</text>
<circle cx="57" cy="195" r="13" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2.5"/>
<text x="57" y="200" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">+</text>
<circle cx="111" cy="195" r="13" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="111" y="200" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">−</text>
<circle cx="165" cy="195" r="13" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2.5"/>
<text x="165" y="200" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">+</text>
<circle cx="219" cy="195" r="13" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2.5"/>
<text x="219" y="200" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">−</text>
<circle cx="273" cy="195" r="13" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="273" y="200" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">+</text>
<circle cx="327" cy="195" r="13" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2.5"/>
<text x="327" y="200" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">−</text>
<line x1="200" y1="285" x2="200" y2="325" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<rect x="90" y="340" width="220" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="200.0" y="377.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">k labeled points + message</text>
<text x="45" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">kappa(S) is selected after seeing S</text>
<text x="45" y="490" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">adaptive selection is paid by counting subsets</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">ordering and side bits must be declared。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">重构必须解释完整样本</text>
<rect x="450" y="115" width="125" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="512.5" y="152.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">compressed set</text>
<rect x="450" y="285" width="125" height="62" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="512.5" y="322.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">side message</text>
<line x1="580" y1="146" x2="650" y2="220" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<line x1="580" y1="316" x2="650" y2="240" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<rect x="665" y="190" width="90" height="82" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="710.0" y="237.0" font-size="18" font-weight="650" text-anchor="middle" fill="#0F766E">rho</text>
<line x1="710" y1="277" x2="710" y2="320" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<text x="710" y="355" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937" class="math">h = rho(kappa(S),q)</text>
<text x="430" y="405" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E" class="math">h(x_i)=y_i for every point in S</text>
<text x="430" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">consistency is a theorem condition</text>
<text x="430" y="490" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">fitting only retained points is insufficient</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">lossy compression needs another theorem。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">计数 × 漏检概率</text>
<rect x="845" y="95" width="285" height="64" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="133.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">number of descriptions</text>
<text x="987" y="195" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB" class="math">2^b binom(m,k)</text>
<text x="987" y="235" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">times</text>
<rect x="845" y="255" width="285" height="64" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="293.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">bad h misses m-k checks</text>
<text x="987" y="355" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">(1-epsilon)^(m-k)</text>
<line x1="850" y1="390" x2="1125" y2="390" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="430" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">R(h) &lt;= [log binom(m,k)+b log 2</text>
<text x="830" y="462" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">+ log(1/delta)]/(m-k)</text>
<text x="830" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">model-file compression is not automatically this</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">sample points may contain many bits。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">样本压缩证书依赖少量见证、合法重构、全样本一致与完整计数。</text>
</svg>