<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">PAC 学习的量词合同与样本复杂度</title>
<desc id="desc">PAC 把 accuracy eps、confidence delta、允许的分布族、比较器和样本量写成统一的高概率合同；realizable 与 agnostic 的差别在 comparator，不在口号。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">量词顺序决定承诺强度</text>
<rect x="55" y="85" width="290" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="200.0" y="117.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">exists learner A</text>
<line x1="200" y1="140" x2="200" y2="167" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="175" width="290" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="200.0" y="207.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">for every eps, delta</text>
<line x1="200" y1="230" x2="200" y2="257" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="265" width="290" height="52" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="200.0" y="297.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">for every allowed P</text>
<line x1="200" y1="320" x2="200" y2="347" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="355" width="290" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="200.0" y="387.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">m &gt;= m_H(eps,delta)</text>
<text x="45" y="478" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">A cannot depend on the unknown P</text>
<text x="45" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">eps and delta are requested before sampling。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">成功事件：风险好，而非训练损失低</text>
<rect x="445" y="95" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="130.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">S ~ P^m,  U ~ learner randomness</text>
<line x1="600" y1="156" x2="600" y2="193" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="445" y="205" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="240.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">h_{S,U} = A(S,U)</text>
<line x1="600" y1="266" x2="600" y2="303" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="445" y="315" width="310" height="82" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600" y="346" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">Pr[R_P(h_{S,U}) &lt;= comparator + eps]</text>
<text x="600" y="378" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135">&gt;= 1-delta</text>
<text x="430" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">eps: quality tolerance</text>
<text x="620" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">delta: failure budget</text>
<text x="430" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">probability is over S and U。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">两种 comparator 与三种复杂度</text>
<rect x="840" y="88" width="300" height="72" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="860" y="117" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">realizable</text>
<text x="860" y="145" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">comparator = 0</text>
<rect x="840" y="185" width="300" height="72" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="860" y="214" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">agnostic</text>
<text x="860" y="242" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">comparator = inf_{h in H} R_P(h)</text>
<text x="830" y="315" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">statistical: how large must m be?</text>
<text x="830" y="355" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">computational: can A run efficiently?</text>
<text x="830" y="395" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">representational: how large is approximation error?</text>
<text x="830" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">distribution-free != assumption-free</text>
<text x="830" y="490" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">expectation guarantee != PAC confidence</text>
<text x="830" y="520" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">sample complexity is a function, not a slogan。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">PAC 是可审计的有限样本合同：先写全对象和量词，再讨论具体算法给出的 m_H(eps,delta)。</text>
</svg>