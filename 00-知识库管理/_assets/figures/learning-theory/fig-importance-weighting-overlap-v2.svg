<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Importance Weighting：期望恒等式与有限样本稳定性</title>
<desc id="desc">covariate shift下target risk可重写；weight tail、ratio error和selection决定实际可靠性。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Target Risk Change of Measure</text>
<rect x="55" y="92" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="205.0" y="126.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">p_t(y|x)=p_s(y|x)</text>
<line x1="205" y1="151" x2="205" y2="173" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="176" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="205.0" y="210.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">w(x)=p_t(x)/p_s(x)</text>
<line x1="205" y1="235" x2="205" y2="257" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="260" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="205.0" y="294.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">R_t=E_s[w loss]</text>
<line x1="205" y1="319" x2="205" y2="341" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="344" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="205.0" y="378.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">target support inside source</text>
<line x1="205" y1="403" x2="205" y2="425" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">identity is population-level。</text>
<text x="442" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="480" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Ratio、Tail 与 ESS</text>
<rect x="455" y="92" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="605.0" y="126.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">domain odds / direct ratio</text>
<line x1="605" y1="151" x2="605" y2="173" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="176" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="605.0" y="210.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">large weights -&gt; high variance</text>
<line x1="605" y1="235" x2="605" y2="257" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="260" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="605.0" y="294.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">ESS=(sum w)^2/sum w^2</text>
<line x1="605" y1="319" x2="605" y2="341" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="344" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="605.0" y="378.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">clip / normalize adds bias</text>
<line x1="605" y1="403" x2="605" y2="425" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="445" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">mean weight=1 is insufficient。</text>
<text x="842" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="880" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">训练—选择—部署合同</text>
<rect x="855" y="92" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="1005.0" y="126.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">cross-fit ratio estimates</text>
<line x1="1005" y1="151" x2="1005" y2="173" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="855" y="176" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="1005.0" y="210.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">weighted validation</text>
<line x1="1005" y1="235" x2="1005" y2="257" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="855" y="260" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="1005.0" y="294.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">locked target test</text>
<line x1="1005" y1="319" x2="1005" y2="341" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="855" y="344" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="1005.0" y="378.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">concept shift: stop</text>
<line x1="1005" y1="403" x2="1005" y2="425" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="845" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">weights cannot create labels。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">covariate shift下target risk可重写；weight tail、ratio error和selection决定实际可靠性。</text>
</svg>