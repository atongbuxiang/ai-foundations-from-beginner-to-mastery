<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Hedge：指数权重与势能夹逼</title>
<desc id="desc">每轮指数惩罚累积损失；同一总权重的专家下界与 learner 上界夹出 regret。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">loss 进入指数权重</text>
<text x="55" y="100" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">expert 1</text>
<rect x="55" y="115" width="245" height="34" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
<text x="320" y="140" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">loss=0</text>
<text x="55" y="205" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">expert 2</text>
<rect x="55" y="220" width="120" height="34" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.8"/>
<text x="320" y="245" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">loss=1</text>
<text x="55" y="310" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">expert 3</text>
<rect x="55" y="325" width="174" height="34" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.8"/>
<text x="320" y="350" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">loss=1/2</text>
<text x="55" y="445" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">w(t+1,i) = w(t,i) exp(-eta loss(t,i))</text>
<text x="55" y="483" font-size="16" font-weight="400" text-anchor="start" fill="#0F766E">normalize weights → p(t)</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">log-potential 的上下夹逼</text>
<rect x="445" y="105" width="310" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="142.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">lower: log pi(i) - eta L(T,i)</text>
<line x1="600" y1="172" x2="600" y2="210" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="445" y="222" width="310" height="72" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="264.0" font-size="18" font-weight="650" text-anchor="middle" fill="#0F766E">log W(T+1)</text>
<line x1="600" y1="298" x2="600" y2="336" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="445" y="348" width="310" height="68" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="388.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">upper: -eta L_hat + eta^2 T / 8</text>
<text x="445" y="460" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">Hoeffding lemma requires loss in [0,1]</text>
<text x="445" y="492" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">same potential, two viewpoints</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">复杂度—学习率平衡</text>
<line x1="860" y1="410" x2="1135" y2="410" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="880" y1="435" x2="880" y2="105" stroke="#D7DEE8" stroke-width="1.5"/>
<path d="M900 125C930 180 955 270 1010 330C1050 375 1090 395 1130 402" fill="none" stroke="#2563EB" stroke-width="3"/>
<path d="M900 402C960 385 1020 330 1070 250C1100 205 1120 160 1130 125" fill="none" stroke="#C24135" stroke-width="3"/>
<path d="M900 170C960 250 1010 286 1050 292C1090 298 1110 280 1130 245" fill="none" stroke="#0F766E" stroke-width="3"/>
<text x="900" y="100" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">log N / eta</text>
<text x="1045" y="100" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">eta T / 8</text>
<text x="955" y="320" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">sum</text>
<text x="1015" y="455" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">eta* = sqrt(8 log N / T)</text>
<text x="1015" y="490" font-size="15" font-weight="400" text-anchor="middle" fill="#64748B">regret = O(sqrt(T log N))</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Multiplicative update 是算法表面；log-potential 夹逼才是可迁移的证明骨架。</text>
</svg>