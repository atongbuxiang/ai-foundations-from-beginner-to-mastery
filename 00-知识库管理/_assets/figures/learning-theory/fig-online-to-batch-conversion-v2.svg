<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Online-to-Batch：从 Fresh Example 到 Population Risk</title>
<desc id="desc">history-measurable predictor 与当前 iid 样本的条件独立，把 online loss 变成 risk observation。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Test-then-Train 时序</text>
<rect x="60" y="75" width="290" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="205.0" y="106.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">past Z(1:t-1)</text>
<line x1="205" y1="129" x2="205" y2="173" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="60" y="180" width="290" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="205.0" y="211.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">build h(t)</text>
<line x1="205" y1="234" x2="205" y2="278" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="60" y="285" width="290" height="50" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="205.0" y="316.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">fresh Z(t)</text>
<line x1="205" y1="339" x2="205" y2="383" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="60" y="390" width="290" height="50" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="205.0" y="421.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">score, then update</text>
<text x="55" y="478" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">E[loss(h(t),Z(t)) | F(t-1)] = L(h(t))</text>
<text x="55" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">train-then-test on Z(t) breaks freshness</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">平均保证对应什么输出？</text>
<rect x="445" y="105" width="145" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="517.5" y="137.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">random iterate</text>
<line x1="595" y1="131" x2="625" y2="131" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="637" y="137" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">always valid in expectation</text>
<rect x="445" y="210" width="145" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="517.5" y="242.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">prediction average</text>
<line x1="595" y1="236" x2="625" y2="236" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="637" y="242" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">needs convexity + Jensen</text>
<rect x="445" y="315" width="145" height="52" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="517.5" y="347.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">last iterate</text>
<line x1="595" y1="341" x2="625" y2="341" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="637" y="347" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">needs extra structure</text>
<text x="445" y="448" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">B(T)/T turns regret scale into risk scale</text>
<text x="445" y="484" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">existence of a good iterate is not selection</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">概率与 Comparator 双桥</text>
<rect x="840" y="105" width="300" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="138.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">online loss -&gt; average risk</text>
<line x1="990" y1="165" x2="990" y2="198" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="210" width="300" height="55" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="243.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">regret -&gt; fixed comparator loss</text>
<line x1="990" y1="270" x2="990" y2="303" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="315" width="300" height="55" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="990.0" y="348.5" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">comparator empirical -&gt; population</text>
<text x="840" y="412" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">martingale + fixed-function concentration</text>
<text x="840" y="450" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">data-selected comparator needs more</text>
<text x="840" y="486" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">dependence / drift changes the target</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Regret 除以 T 只是数值步骤；freshness、输出规则和 concentration 才完成统计对象的转换。</text>
</svg>