<text x="620" y="489" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#b91c1c" font-weight="600" text-anchor="middle">增强 2</text>
<text x="425" y="545" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#b45309" font-weight="650" text-anchor="start">共同来源 ⇒ 条件相关</text>
