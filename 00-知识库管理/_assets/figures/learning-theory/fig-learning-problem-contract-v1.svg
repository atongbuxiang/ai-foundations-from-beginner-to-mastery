<text x="166" y="211" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" fill="#172554" font-weight="700" text-anchor="start">世界与样本</text>
<text x="94" y="252" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" fill="#64748b" font-weight="450" text-anchor="start">P 产生未来对象，也产生训练样本</text>
