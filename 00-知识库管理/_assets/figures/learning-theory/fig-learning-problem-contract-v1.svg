<rect width="1400" height="720" fill="url(#bg)"/>
<text x="70" y="70" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="34" fill="#172554" font-weight="750" text-anchor="start">统计学习的四层对象合同</text>
<text x="70" y="108" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" fill="#53627a" font-weight="450" text-anchor="start">先固定世界、数据、算法与评价，再讨论‘学得好’。</text>
