<text x="1156" y="211" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" fill="#172554" font-weight="700" text-anchor="start">损失与风险</text>
<text x="1084" y="252" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" fill="#64748b" font-weight="450" text-anchor="start">训练量 R_S 不等于目标量 R_P</text>
