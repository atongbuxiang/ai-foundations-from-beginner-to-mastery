<text x="1144" y="349" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" fill="#9a3412" font-weight="750" text-anchor="middle">R_S(h)</text>
<rect x="1240" y="292" width="112" height="72" rx="16" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
<text x="1296" y="323" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" fill="#c2410c" font-weight="650" text-anchor="middle">目标量</text>
<text x="1296" y="349" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" fill="#9a3412" font-weight="750" text-anchor="middle">R_P(h)</text>
<path d="M1202 329 L1238 329" stroke="#6366f1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="1090" y="405" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#7c2d12" font-weight="650" text-anchor="start">gap = R_P(h_S) − R_S(h_S)</text>
<rect x="1090" y="446" width="258" height="78" rx="14" fill="#fffaf5" stroke="#fed7aa" stroke-width="2"/>
<text x="1219" y="476" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" fill="#475569" font-weight="550" text-anchor="middle">固定 h：经验均值可无偏</text>
<text x="1219" y="502" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" fill="#b45309" font-weight="650" text-anchor="middle">数据选出的 h_S：需泛化理论</text>
<text x="1090" y="560" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" fill="#475569" font-weight="550" text-anchor="start">metric、loss、reduction 都要写清</text>
<line x1="70" y1="650" x2="1330" y2="650" stroke="#dbe4f0" stroke-width="2"/>
<text x="70" y="687" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" fill="#334155" font-weight="650" text-anchor="start">对象未固定 → 概率、误差与‘泛化’的量词都无法解释</text>
<text x="1330" y="687" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#64748b" font-weight="500" text-anchor="end">LT-01—04 · v1</text>
