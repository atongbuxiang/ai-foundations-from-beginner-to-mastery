<text x="496" y="211" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" fill="#172554" font-weight="700" text-anchor="start">采样合同</text>
<text x="424" y="252" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" fill="#64748b" font-weight="450" text-anchor="start">i.i.d. 是 P^m，不是数据的天然属性</text>
