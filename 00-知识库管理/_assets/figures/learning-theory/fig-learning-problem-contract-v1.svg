<text x="826" y="211" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" fill="#172554" font-weight="700" text-anchor="start">学习器与函数</text>
<text x="754" y="252" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" fill="#64748b" font-weight="450" text-anchor="start">A 读入 S，输出 h_S ∈ H</text>
