<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">可辨识性、模型选择与错设：参数、分布和预测的分账</title>
<desc id="desc">可辨识性检查parameter-to-distribution map是否一一；错设时MLE趋向模型族内的KL projection而非真实机制；AIC、BIC与CV对应不同选择目标和条件，不能共享一个无条件最优解释。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">参数 Fiber 与 Quotient</text>
<rect x="55" y="95" width="105" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="107.5" y="128.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">theta_1</text>
<rect x="55" y="195" width="105" height="55" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="107.5" y="228.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">theta_2</text>
<line x1="165" y1="122" x2="245" y2="190" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a3)"/>
<line x1="165" y1="222" x2="245" y2="190" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="250" y="155" width="105" height="70" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="302.5" y="196.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">same P_theta</text>
<text x="45" y="305" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937" class="math">identifiable: P_theta=P_theta&#x27; =&gt; theta=theta&#x27;</text>
<text x="45" y="350" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">mixtures: equality only up to permutation</text>
<text x="45" y="390" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">neural nets: many parameter symmetries</text>
<text x="45" y="432" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">prediction may be identifiable when parameters are not</text>
<text x="45" y="475" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">Fisher singularity is an estimation warning</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">choose an invariant target or quotient。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">错设投影与 Sandwich</text>
<path d="M465 360C500 275 560 180 725 125" fill="none" stroke="#2563EB" stroke-width="3"/>
<circle cx="515" cy="165" r="9" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="530" y="160" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">true P0 outside model</text>
<circle cx="585" cy="235" r="9" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="600" y="230" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">P_(theta*) KL projection</text>
<line x1="520" y1="172" x2="580" y2="228" stroke="#C24135" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a2)"/>
<text x="430" y="410" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937" class="math">theta* = argmin KL(P0 || P_theta)</text>
<text x="430" y="452" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">asymptotic covariance = H^-1 J H^-1</text>
<text x="430" y="488" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">correct model often gives H=J</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">in-distribution projection is not shift robustness。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">选择准则优化不同目标</text>
<rect x="845" y="92" width="285" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="129.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">AIC: -2 log L + 2d  | prediction</text>
<rect x="845" y="180" width="285" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="217.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">BIC: -2 log L + d log n | evidence</text>
<rect x="845" y="268" width="285" height="62" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="987.5" y="305.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">CV: held-out loss | declared split</text>
<text x="830" y="382" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">regular dimension formulas fail in singular models</text>
<text x="830" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">candidate search creates additional optimism</text>
<text x="830" y="458" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">selection is not post-selection inference</text>
<text x="830" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">deployment utility may differ from likelihood</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">there is no target-free best criterion。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先声明要识别的对象与选择目标；再判断模型正确性、正则条件、数据复用和部署分布。</text>
</svg>