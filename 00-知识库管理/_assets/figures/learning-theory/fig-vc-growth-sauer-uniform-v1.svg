<rect x="1246" y="294" width="82" height="54" rx="11" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/><text x="1287" y="327" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#4338ca" font-weight="700" text-anchor="middle">S′</text>
<path d="M1176 321 L1238 321" stroke="#6366f1" stroke-width="3" marker-end="url(#arr)"/><text x="1207" y="303" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">swap signs</text>
<rect x="1090" y="386" width="238" height="72" rx="12" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
<text x="1209" y="413" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#166534" font-weight="700" text-anchor="middle">4 tau_H(2m) exp(−m eps^2 / 8)</text><text x="1209" y="442" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#475569" text-anchor="middle">symmetrize + count + Hoeffding</text>
<text x="1084" y="503" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#166534" font-weight="700">gap ≤ sqrt[(d log(m/d)+log(1/delta))/m]</text>
<text x="1084" y="548" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#9a3412" font-weight="650">经典显式界，不等于最优阶的终点</text>

<line x1="70" y1="650" x2="1330" y2="650" stroke="#dbe4f0" stroke-width="2"/>
<text x="70" y="687" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" fill="#334155" font-weight="650">关键不是无限类一共有多少函数，而是它能在有限样本上留下多少种可区分行为。</text>
<text x="1330" y="687" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#64748b" font-weight="500" text-anchor="end">LT-17—20 · v1</text>
