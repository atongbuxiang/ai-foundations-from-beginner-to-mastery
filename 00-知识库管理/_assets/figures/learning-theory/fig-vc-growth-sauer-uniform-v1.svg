<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#eef7f4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#26324d" flood-opacity="0.10"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6366f1"/></marker></defs>
<rect width="1400" height="720" fill="url(#bg)"/>
<text x="70" y="70" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="34" fill="#172554" font-weight="750">无限假设类如何变成有限样本保证</text>
<text x="70" y="108" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" fill="#53627a">打散能力 → 样本上的模式数 → Sauer–Shelah 多项式上界 → ghost sample 一致收敛。</text>

<g filter="url(#shadow)"><rect x="70" y="155" width="300" height="455" rx="18" fill="#fff" stroke="#dbe4f0" stroke-width="2"/></g>
<rect x="92" y="180" width="58" height="42" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="121" y="209" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" fill="#4f46e5" font-weight="750" text-anchor="middle">17</text>
<text x="166" y="211" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" fill="#172554" font-weight="700">打散与 VC 维</text>
<text x="94" y="252" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#64748b">同一固定点集上实现全部标签</text>
<circle cx="132" cy="322" r="14" fill="#4f46e5"/><circle cx="220" cy="292" r="14" fill="#fff" stroke="#4f46e5" stroke-width="3"/><circle cx="302" cy="345" r="14" fill="#4f46e5"/>
<path d="M108 383 C164 332 241 409 325 363" stroke="#a5b4fc" stroke-width="3" fill="none" stroke-dasharray="8 7"/>
<text x="94" y="432" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#4338ca" font-weight="700">C 被打散 ⇔ C 上恰有 2^|C| 种模式</text>
<text x="94" y="476" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#475569" font-weight="650">VCdim(H) = 最大可打散点数</text>
<text x="94" y="521" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#9a3412" font-weight="650">拟合一个 labeling ≠ 打散</text>
<text x="94" y="554" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#9a3412" font-weight="650">参数个数 ≠ 自动等于 VC 维</text>

<g filter="url(#shadow)"><rect x="400" y="155" width="300" height="455" rx="18" fill="#fff" stroke="#dbe4f0" stroke-width="2"/></g>
<rect x="422" y="180" width="58" height="42" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
<text x="451" y="209" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" fill="#0891b2" font-weight="750" text-anchor="middle">18</text>
<text x="496" y="211" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" fill="#172554" font-weight="700">增长函数</text>
<text x="424" y="252" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#64748b">只数样本上不同的函数限制</text>
<line x1="438" y1="333" x2="662" y2="333" stroke="#cbd5e1" stroke-width="3"/>
<circle cx="462" cy="333" r="10" fill="#0891b2"/><circle cx="510" cy="333" r="10" fill="#0891b2"/><circle cx="558" cy="333" r="10" fill="#fff" stroke="#0891b2" stroke-width="3"/><circle cx="606" cy="333" r="10" fill="#fff" stroke="#0891b2" stroke-width="3"/><circle cx="654" cy="333" r="10" fill="#fff" stroke="#0891b2" stroke-width="3"/>
<line x1="536" y1="294" x2="536" y2="370" stroke="#6366f1" stroke-width="3" stroke-dasharray="7 6"/>
<text x="424" y="414" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#0e7490" font-weight="700">tau_H(m) = m 点集上的最大模式数</text>
<text x="424" y="458" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#475569" font-weight="650">thresholds: τ(m)=m+1</text>
<text x="424" y="497" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#475569" font-weight="650">intervals: τ(m)=1+m(m+1)/2</text>
<text x="424" y="548" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#9a3412" font-weight="650">经验模式数 ≤ 最坏情形增长函数</text>

<g filter="url(#shadow)"><rect x="730" y="155" width="300" height="455" rx="18" fill="#fff" stroke="#dbe4f0" stroke-width="2"/></g>
<rect x="752" y="180" width="58" height="42" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="781" y="209" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" fill="#ea580c" font-weight="750" text-anchor="middle">19</text>
<text x="826" y="211" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" fill="#172554" font-weight="700">Sauer–Shelah</text>
<text x="754" y="252" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#64748b">有限 VC 把 2^m 压为 m^d</text>
<rect x="760" y="296" width="102" height="60" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="811" y="321" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#9a3412" font-weight="700" text-anchor="middle">T(d, m−1)</text><text x="811" y="344" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#9a3412" text-anchor="middle">至少一种标签</text>
<text x="886" y="334" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" fill="#64748b" font-weight="700" text-anchor="middle">+</text>
<rect x="910" y="296" width="102" height="60" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="961" y="321" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="13" fill="#9a3412" font-weight="700" text-anchor="middle">T(d−1, m−1)</text><text x="961" y="344" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#9a3412" text-anchor="middle">两种标签</text>
<text x="754" y="402" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#c2410c" font-weight="700">tau_H(m) ≤ C(m,0)+...+C(m,d)</text>
<text x="754" y="441" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#c2410c" font-weight="700">≤ (e m / d)^d　for m ≥ d ≥ 1</text>
<path d="M760 552 C828 547 884 530 930 505 C958 490 981 474 1004 454" stroke="#ea580c" stroke-width="3" fill="none"/>
<path d="M760 552 C838 548 918 537 1004 510" stroke="#0891b2" stroke-width="4" fill="none"/>
<text x="961" y="537" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#0e7490" font-weight="700">m^d</text><text x="986" y="467" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="12" fill="#c2410c" font-weight="700">2^m</text>

<g filter="url(#shadow)"><rect x="1060" y="155" width="300" height="455" rx="18" fill="#fff" stroke="#dbe4f0" stroke-width="2"/></g>
