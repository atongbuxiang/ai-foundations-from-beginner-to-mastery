<text x="1156" y="211" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" fill="#172554" font-weight="700">VC 一致收敛</text>
<text x="1084" y="252" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#64748b">未知期望换成两个样本之差</text>
