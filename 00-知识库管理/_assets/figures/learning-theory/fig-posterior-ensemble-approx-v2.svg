<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Posterior Predictive：成员生成、概率混合与三类误差</title>
<desc id="desc">精确目标是likelihood对posterior的积分；MC dropout、SWAG和deep ensemble产生成员的机制不同；增加成员主要减少既定近似分布下的Monte Carlo误差。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Bayesian 目标链</text>
<rect x="55" y="92" width="130" height="54" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="120.0" y="125.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">prior p(theta)</text>
<rect x="225" y="92" width="130" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="290.0" y="125.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">likelihood</text>
<line x1="120" y1="151" x2="205" y2="205" stroke="#1F2937" stroke-width="2"/>
<line x1="290" y1="151" x2="205" y2="205" stroke="#1F2937" stroke-width="2"/>
<rect x="55" y="215" width="300" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="205.0" y="250.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">posterior p(theta | D)</text>
<line x1="205" y1="278" x2="205" y2="309" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="55" y="319" width="300" height="72" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="205.0" y="361.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">posterior predictive integral</text>
<text x="45" y="440" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">parameter mean plug-in is a different object</text>
<text x="45" y="480" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">function symmetries can collapse parameter modes</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">average predictions before interpreting spread。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">成员来自不同机制</text>
<rect x="445" y="92" width="145" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="517.5" y="127.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">MC dropout masks</text>
<rect x="610" y="92" width="145" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="682.5" y="127.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">SWAG trajectory</text>
<rect x="445" y="184" width="145" height="58" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="517.5" y="219.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">deep ensemble</text>
<rect x="610" y="184" width="145" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="682.5" y="219.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">bootstrap / VI</text>
<line x1="600" y1="257" x2="600" y2="292" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="302" width="310" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="339.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">probability mixture: mean_m p_m(y|x)</text>
<text x="430" y="414" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">probability average != logit average</text>
<text x="430" y="454" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">members may be correlated or misspecified</text>
<text x="430" y="492" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">report strongest member and total compute</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">ensemble is not automatically posterior。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">误差不能用 Members 数混掉</text>
<rect x="845" y="92" width="285" height="56" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="126.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">1  MC integration error ~ 1/sqrt(M)</text>
<line x1="987" y1="153" x2="987" y2="177" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="845" y="184" width="285" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="218.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">2  posterior approximation q != p</text>
<line x1="987" y1="245" x2="987" y2="269" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="845" y="276" width="285" height="56" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="987.5" y="310.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">3  model misspecification / shift</text>
<text x="830" y="382" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">more samples directly reduce only account 1</text>
<text x="830" y="422" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">correlation lowers effective member count</text>
<text x="830" y="462" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">audit NLL, Brier, calibration and abstention</text>
<text x="830" y="500" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">evaluate along real shift-severity curves</text>
<text x="830" y="520" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">clean performance is not deployment trust。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">只有先说明成员从哪里来，predictive mixture才可解释；M、近似偏差、模型错设与shift必须进入四个独立账户。</text>
</svg>