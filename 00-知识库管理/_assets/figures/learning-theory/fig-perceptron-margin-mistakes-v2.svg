<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Perceptron：Margin 与 Mistake 双账本</title>
<desc id="desc">错误更新既沿 separator 取得线性进展，又只让权重范数平方根增长。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">错误样本触发几何更新</text>
<line x1="70" y1="380" x2="350" y2="125" stroke="#0F766E" stroke-width="3"/>
<line x1="70" y1="350" x2="350" y2="350" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="180" y1="440" x2="180" y2="95" stroke="#D7DEE8" stroke-width="1.5"/>
<circle cx="130" cy="295" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="245" cy="205" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<line x1="130" y1="295" x2="245" y2="205" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<text x="92" y="320" font-size="15" font-weight="400" text-anchor="start" fill="#2563EB">w(k)</text>
<text x="245" y="190" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">w(k)+y x</text>
<text x="255" y="135" font-size="15" font-weight="400" text-anchor="start" fill="#0F766E">separator u</text>
<text x="55" y="432" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">update only if y&lt;w,x&gt; &lt;= 0</text>
<text x="55" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">each mistake adds &gt;= gamma progress</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">线性下界撞上平方根上界</text>
<line x1="455" y1="410" x2="760" y2="410" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="475" y1="435" x2="475" y2="105" stroke="#D7DEE8" stroke-width="1.5"/>
<path d="M480 400L745 130" fill="none" stroke="#0F766E" stroke-width="3"/>
<path d="M480 400C525 300 610 235 745 190" fill="none" stroke="#2563EB" stroke-width="3"/>
<circle cx="650" cy="226" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="675" y="205" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">intersection</text>
<text x="625" y="135" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">M gamma</text>
<text x="630" y="280" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">R sqrt(M)</text>
<text x="445" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">M gamma &lt;= &lt;w,u&gt; &lt;= ||w|| &lt;= R sqrt(M)</text>
<text x="445" y="492" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">therefore M &lt;= (R/gamma)^2</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">结论与边界必须分账</text>
<rect x="840" y="100" width="160" height="48" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="920.0" y="130.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">separable + margin</text>
<line x1="1005" y1="124" x2="1030" y2="124" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1040" y="130" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">finite mistakes</text>
<rect x="840" y="184" width="160" height="48" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="920.0" y="214.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">noise / contradiction</text>
<line x1="1005" y1="208" x2="1030" y2="208" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1040" y="214" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">violation term</text>
<rect x="840" y="268" width="160" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="920.0" y="298.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">kernel feature space</text>
<line x1="1005" y1="292" x2="1030" y2="292" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1040" y="298" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">same proof</text>
<rect x="840" y="352" width="160" height="48" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="920.0" y="382.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">population risk</text>
<line x1="1005" y1="376" x2="1030" y2="376" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1040" y="382" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">needs conversion</text>
<text x="840" y="458" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">scale invariant: R/gamma</text>
<text x="840" y="492" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">finite mistakes ≠ max margin</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">证明只有三步：margin progress、norm growth、Cauchy；每一步都对应一个不可省略的假设。</text>
</svg>