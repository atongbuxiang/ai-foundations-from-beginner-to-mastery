<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">度量学习：几何监督、margin surrogate 与检索风险</title>
<desc id="desc">metric learning用pair、triplet或labels定义相似性，并学习distance或embedding。训练surrogate、mining distribution、query-gallery protocol与deployment threshold必须共同报告。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Mahalanobis 就是学习线性几何</text>
<circle cx="80" cy="160" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="110" cy="195" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="145" cy="170" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="255" cy="300" r="5" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="295" cy="330" r="5" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="330" cy="285" r="5" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="45" y="385" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937" class="math">d_M^2(x,x&#x27;) = (x-x&#x27;)^T M (x-x&#x27;)</text>
<text x="45" y="425" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">M = L^T L  =&gt;  Euclidean distance after L</text>
<text x="45" y="468" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">M positive semidefinite gives a pseudo-metric</text>
<text x="45" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">side-information and scale define geometry。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Pair / Triplet 都是 Surrogate</text>
<rect x="445" y="92" width="310" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="129.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">positive pair: pull distance down</text>
<line x1="600" y1="159" x2="600" y2="192" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="202" width="310" height="70" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="243.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">triplet: d(a,p)+margin &lt; d(a,n)</text>
<line x1="600" y1="277" x2="600" y2="310" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="320" width="310" height="62" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="357.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">mining chooses which violations matter</text>
<text x="430" y="430" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">easy tuples: little gradient</text>
<text x="430" y="468" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">hard tuples: information or label noise</text>
<text x="430" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">zero surrogate loss != zero retrieval risk。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Query–Gallery 才定义检索</text>
<rect x="845" y="92" width="110" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="900.0" y="129.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">query q</text>
<line x1="960" y1="123" x2="1015" y2="123" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="1020" y="92" width="110" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="1075.0" y="129.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">ranked gallery</text>
<text x="830" y="220" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">Recall@K: any / fraction relevant retrieved</text>
<text x="830" y="260" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">AP / mAP: precision across relevant ranks</text>
<text x="830" y="300" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">verification: threshold + FAR / FRR</text>
<text x="830" y="350" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">identification != verification != clustering</text>
<text x="830" y="392" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">split by identity, user, time and near-duplicate</text>
<text x="830" y="434" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">gallery size changes operating difficulty</text>
<text x="830" y="476" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">report group tails, calibration and latency</text>
<text x="830" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">a pretty embedding plot is not a retrieval certificate。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">度量由监督与采样定义；检索质量由独立query–gallery、排序指标、阈值和部署分布验收。</text>
</svg>