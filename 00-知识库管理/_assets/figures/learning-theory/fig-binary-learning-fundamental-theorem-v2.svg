<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">二分类统计学习基本定理：四种性质的等价地图</title>
<desc id="desc">对预先固定、满足常规可测性条件的二分类假设类，有限 VC 维、分布无关一致收敛、ERM 可学习与 PAC 可学习在定性上等价；具体样本率取决于 realizable 或 agnostic 设定以及采用的证明路线。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">四个命题不是同一句话</text>
<rect x="55" y="95" width="290" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="200.0" y="130.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">finite VC dimension</text>
<line x1="200" y1="156" x2="200" y2="194" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="205" width="290" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="200.0" y="240.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">uniform convergence</text>
<line x1="200" y1="266" x2="200" y2="304" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="315" width="290" height="58" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="200.0" y="350.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">ERM PAC learnable</text>
<line x1="200" y1="376" x2="200" y2="414" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="425" width="290" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="200.0" y="460.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">PAC learnable</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">每条箭头有自己的证明任务</text>
<rect x="445" y="92" width="310" height="72" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="462" y="121" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">VC -&gt; UC</text>
<text x="462" y="149" font-size="15" font-weight="600" text-anchor="start" fill="#1F2937">growth + symmetrization</text>
<rect x="445" y="194" width="310" height="72" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="462" y="223" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">UC -&gt; ERM</text>
<text x="462" y="251" font-size="15" font-weight="600" text-anchor="start" fill="#1F2937">two-gap comparison</text>
<rect x="445" y="296" width="310" height="72" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="462" y="325" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">ERM -&gt; PAC</text>
<text x="462" y="353" font-size="15" font-weight="600" text-anchor="start" fill="#1F2937">existence is immediate</text>
<rect x="445" y="398" width="310" height="72" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="462" y="427" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">PAC -&gt; finite VC</text>
<text x="462" y="455" font-size="15" font-weight="600" text-anchor="start" fill="#1F2937">shattered-set lower bound</text>
<text x="430" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">rates and constants are route-specific。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">率、量词与边界必须另记</text>
<text x="830" y="105" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">realizable optimal scale</text>
<text x="850" y="142" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">(d + log(1/delta)) / eps</text>
<text x="830" y="195" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">agnostic optimal scale</text>
<text x="850" y="232" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">(d + log(1/delta)) / eps^2</text>
<line x1="830" y1="265" x2="1140" y2="265" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="310" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">requires binary 0-1 prediction</text>
<text x="830" y="350" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">sample is iid from the target law</text>
<text x="830" y="390" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">class is fixed before seeing S</text>
<text x="830" y="430" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">measurability is not automatic</text>
<text x="830" y="475" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">computation may still be intractable</text>
<text x="830" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">deep nets need additional mechanisms。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">基本定理连接容量、估计与可学习性；它不把所有证明路线、数值常数或计算复杂度压成同一件事。</text>
</svg>