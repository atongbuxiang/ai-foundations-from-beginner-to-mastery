<text x="45" y="500" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">each row trains on 4 folds and validates on 1</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">fold errors share data and are correlated。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Nested CV 隔离选择与评估</text>
<rect x="445" y="92" width="310" height="60" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="128.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">outer training split</text>
<line x1="600" y1="157" x2="600" y2="187" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="197" width="310" height="70" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="238.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">inner CV chooses lambda and pipeline</text>
<line x1="600" y1="272" x2="600" y2="302" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="312" width="310" height="60" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
