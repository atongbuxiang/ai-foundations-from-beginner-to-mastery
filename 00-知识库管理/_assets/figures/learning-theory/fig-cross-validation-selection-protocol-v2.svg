<title id="title">交叉验证：估计 procedure、选择配置、独立验收</title>
<desc id="desc">K-fold 在每一折用其余数据训练并在 held-out fold 评价；nested CV 把内层选择与外层评估分开。复用验证结果生成新候选会把固定候选比较变成自适应 transcript。</desc>
