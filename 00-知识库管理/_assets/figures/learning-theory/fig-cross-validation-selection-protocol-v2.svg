<text x="987.5" y="138.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">M fixed candidates</text>
<line x1="987" y1="169" x2="987" y2="205" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="845" y="215" width="285" height="75" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="987.5" y="258.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">min validation error is optimistic</text>
<text x="830" y="340" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">legal: simultaneous radius includes log M</text>
<text x="830" y="390" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">leakage: fit scaler / features before splitting</text>
<text x="830" y="435" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">adaptive search: transcript exceeds final model id</text>
<text x="830" y="475" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">group and time data need structural folds</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">a final untouched test remains a separate role。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">CV 是一套数据使用协议：内层选择，外层评价，所有 preprocessing 都必须进入训练折。</text>
