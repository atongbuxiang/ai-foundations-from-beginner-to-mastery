<rect x="445" y="417" width="310" height="55" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="450.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">outer test: evaluate once</text>
<text x="430" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">outer scores estimate the whole selected procedure。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">选择与泄漏的两条风险</text>
