<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Benign Overfitting：Signal–Noise 与谱尾分工</title>
<desc id="desc">minimum-norm interpolator 在强方向恢复 signal，并可能把噪声分散到许多 population-weak directions。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Min-Norm Error 的两部分</text>
<rect x="55" y="100" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="205.0" y="134.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">beta_hat = X_dagger y</text>
<line x1="205" y1="161" x2="205" y2="195" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="55" y="207" width="300" height="68" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="205.0" y="247.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">error = -(I-P_X) beta* + X_dagger noise</text>
<line x1="205" y1="280" x2="205" y2="314" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="55" y="326" width="300" height="60" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="205.0" y="362.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">test metric = ||Sigma^(1/2) error||^2</text>
<text x="55" y="432" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">null-space signal -&gt; bias</text>
<text x="55" y="466" font-size="15" font-weight="400" text-anchor="start" fill="#2563EB">fitted labels -&gt; variance</text>
<text x="55" y="500" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">training fit alone sees neither cost</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">强 Signal + 分散弱 Tail</text>
<rect x="450" y="210" width="24" height="180" rx="2" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
<rect x="487" y="255" width="24" height="135" rx="2" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
<rect x="524" y="295" width="24" height="95" rx="2" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
<rect x="561" y="338" width="24" height="52" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="598" y="345" width="24" height="45" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="635" y="351" width="24" height="39" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="672" y="356" width="24" height="34" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="709" y="360" width="24" height="30" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<line x1="440" y1="390" x2="760" y2="390" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="500" y="185" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">signal subspace</text>
<text x="680" y="285" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">many weak directions</text>
<text x="445" y="435" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">tail effective rank: spread, not just trace</text>
<text x="445" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">signal must align with learnable directions</text>
<text x="445" y="502" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">p&gt;n alone is insufficient</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Benign Claim 的必要账户</text>
<rect x="840" y="95" width="130" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="905.0" y="125.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">interpolate</text>
<line x1="975" y1="119" x2="1005" y2="119" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1017" y="125" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">train risk = 0</text>
<rect x="840" y="177" width="130" height="48" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="905.0" y="207.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">algorithm</text>
<line x1="975" y1="201" x2="1005" y2="201" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1017" y="207" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">min norm / dynamics</text>
<rect x="840" y="259" width="130" height="48" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="905.0" y="289.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">spectrum</text>
<line x1="975" y1="283" x2="1005" y2="283" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1017" y="289" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">tail ranks + signal</text>
<rect x="840" y="341" width="130" height="48" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="905.0" y="371.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">limit</text>
<line x1="975" y1="365" x2="1005" y2="365" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1017" y="371" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">excess risk -&gt; 0</text>
<rect x="840" y="430" width="300" height="52" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="462.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">linear theorem -&gt; deep-net hypothesis</text>
<text x="840" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">not every interpolator is benign</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">良性过拟合是算法选解与数据谱的联合结论；零训练误差本身既不充分，也不接近充分。</text>
</svg>