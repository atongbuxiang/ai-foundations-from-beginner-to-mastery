<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">表示坍缩：层级诊断、非坍缩机制与证据边界</title>
<desc id="desc">complete collapse只是最弱失败。还要检查dimensional和spectral collapse、nuisance-only spread与coordinate non-identifiability；每种防坍缩机制只控制特定统计量或训练动力学。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Collapse 不止一个层级</text>
<rect x="55" y="92" width="300" height="58" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="205.0" y="127.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">complete: all z = constant</text>
<rect x="55" y="178" width="300" height="58" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="205.0" y="213.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">dimensional: rank r &lt;&lt; d</text>
<rect x="55" y="264" width="300" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="205.0" y="299.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">spectral: few eigenvalues dominate</text>
<rect x="55" y="350" width="300" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="205.0" y="385.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">semantic: variance stores nuisance</text>
<text x="45" y="452" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">diagnose std + spectrum + geometry + task</text>
<text x="45" y="492" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">sample covariance rank &lt;= B - 1</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">high rank is not a semantic certificate。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">四条机制控制不同对象</text>
<rect x="445" y="92" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="127.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">negatives: constant loses candidate game</text>
<rect x="445" y="176" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="211.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">variance floor: each dim must spread</text>
<rect x="445" y="260" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="295.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">correlation/covariance: reduce redundancy</text>
<rect x="445" y="344" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="379.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">stop-grad + EMA: change vector field</text>
<text x="430" y="452" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">normalization, predictor and batch law remain</text>
<text x="430" y="492" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">ablation evidence is not a universal theorem</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">forward loss and backward dynamics differ。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Non-Collapse 后仍有三道门</text>
<rect x="845" y="92" width="285" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="129.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">1  equivalence / identifiability</text>
<line x1="987" y1="159" x2="987" y2="190" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="845" y="200" width="285" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="237.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">2  task sufficiency</text>
<line x1="987" y1="267" x2="987" y2="298" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="845" y="308" width="285" height="62" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="987.5" y="345.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">3  finite-label transfer risk</text>
<text x="830" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">orthogonal coordinates may be equivalent</text>
<text x="830" y="458" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">nuisance can create full covariance rank</text>
<text x="830" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">evaluate layer, worker, dtype and shift</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">healthy geometry is necessary, not sufficient。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先排除常数与低秩失败，再检查任务信息和迁移；任何单一协方差或loss曲线都不能完成整条证据链。</text>
</svg>