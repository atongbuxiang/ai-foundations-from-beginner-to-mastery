<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">结构风险最小化：嵌套模型、置信预算与惩罚</title>
<desc id="desc">把可能具有无限 VC 维的总类写成有限 VC 子类的可数并，为第 k 层分配置信预算 delta pi_k；在共同好事件上比较经验风险加复杂度惩罚，得到 oracle-style 风险账本。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">总类由可控层级组成</text>
<rect x="80" y="120" width="250" height="330" rx="10" fill="none" stroke="#C24135" stroke-width="2.5"/>
<text x="92" y="145" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">H4</text>
<rect x="105" y="155" width="200" height="255" rx="10" fill="none" stroke="#0F766E" stroke-width="2.5"/>
<text x="117" y="180" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">H3</text>
<rect x="130" y="190" width="150" height="180" rx="10" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<text x="142" y="215" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">H2</text>
<rect x="155" y="225" width="100" height="105" rx="10" fill="none" stroke="#0F766E" stroke-width="2.5"/>
<text x="167" y="250" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">H1</text>
<text x="45" y="485" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">H = union_k H_k</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">each d_k is finite; union VC may be infinite。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">为每层预先切分失败预算</text>
<text x="440" y="125" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">H1</text>
<rect x="485" y="98" width="240" height="42" rx="5" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="740" y="125" font-size="15" font-weight="650" text-anchor="end" fill="#2563EB">delta*pi_1</text>
<text x="440" y="217" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">H2</text>
<rect x="485" y="190" width="170" height="42" rx="5" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="740" y="217" font-size="15" font-weight="650" text-anchor="end" fill="#0F766E">delta*pi_2</text>
<text x="440" y="309" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">H3</text>
<rect x="485" y="282" width="105" height="42" rx="5" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="740" y="309" font-size="15" font-weight="650" text-anchor="end" fill="#C24135">delta*pi_3</text>
<text x="440" y="401" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">...</text>
<rect x="485" y="374" width="55" height="42" rx="5" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="740" y="401" font-size="15" font-weight="650" text-anchor="end" fill="#2563EB">sum pi_k &lt;= 1</text>
<text x="430" y="485" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">pen_k uses d_k and log(1/(delta*pi_k))</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">weights precede validation。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">SRM 比较拟合与选择代价</text>
<rect x="840" y="92" width="300" height="78" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990" y="122" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">score(k,h)</text>
<text x="990" y="153" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">= R_S(h) + pen_k</text>
<line x1="990" y1="174" x2="990" y2="213" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="840" y="225" width="300" height="92" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990" y="257" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">choose layer and hypothesis</text>
<text x="990" y="287" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">on one simultaneous event</text>
<text x="830" y="370" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">small layer: larger approximation error</text>
<text x="830" y="410" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">large layer: larger estimation penalty</text>
<text x="830" y="450" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">optimization error must be added</text>
<text x="830" y="485" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">nonuniform learnability is h-dependent</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">weaker than one global PAC bound。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">SRM 的核心是同一高概率事件上的跨层比较；惩罚是选择账本，不是对复杂模型的道德偏好。</text>
</svg>