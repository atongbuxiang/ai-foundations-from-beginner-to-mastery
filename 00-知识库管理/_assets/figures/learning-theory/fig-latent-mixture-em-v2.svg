<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">潜变量、混合模型与 EM：后验责任度到单调似然</title>
<desc id="desc">潜变量模型通过对Z求和或积分定义observed likelihood。EM在当前参数下构造latent posterior，再最大化expected complete log-likelihood；ELBO/KL恒等式解释单调性，但不保证全局最优或可辨识。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Observed X 隐藏了 Z</text>
<rect x="55" y="125" width="135" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="122.5" y="158.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">component 1</text>
<line x1="195" y1="153" x2="250" y2="250" stroke="#2563EB" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="55" y="225" width="135" height="55" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="122.5" y="258.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">component 2</text>
<line x1="195" y1="253" x2="250" y2="250" stroke="#0F766E" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="55" y="325" width="135" height="55" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="122.5" y="358.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">component 3</text>
<line x1="195" y1="353" x2="250" y2="250" stroke="#C24135" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="255" y="215" width="105" height="70" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="307.5" y="256.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">observed x</text>
<text x="45" y="420" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937" class="math">r_ik = P(Z_i=k | x_i, theta)</text>
<text x="45" y="458" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">responsibility is a posterior soft assignment</text>
<text x="45" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">Z is model-declared, not directly observed</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">component labels are permutation symmetric。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">ELBO 恒等式与 E / M</text>
<rect x="445" y="92" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="127.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">log p = F(q,theta) + KL(q || posterior)</text>
<line x1="600" y1="155" x2="600" y2="188" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="198" width="310" height="64" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="236.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">E: q &lt;- p_(theta_old)(z|x)</text>
<line x1="600" y1="267" x2="600" y2="300" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="310" width="310" height="64" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="348.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">M: theta &lt;- argmax F(q,theta)</text>
<line x1="600" y1="379" x2="600" y2="412" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="422" width="310" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="456.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">observed log-likelihood does not decrease</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">generalized / approximate EM needs a new contract。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">单调不等于正确</text>
<rect x="845" y="92" width="285" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="127.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">local stationary point / initialization</text>
<rect x="845" y="178" width="285" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="213.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">label switching / quotient symmetry</text>
<rect x="845" y="264" width="285" height="58" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="987.5" y="299.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">variance collapse / no finite MLE</text>
<rect x="845" y="350" width="285" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="385.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">weak separation / slow EM</text>
<text x="830" y="448" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">likelihood convergence != parameter convergence</text>
<text x="830" y="482" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">posterior class != causal or semantic class</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">selection and held-out prediction remain separate。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">EM是一条对声明模型的坐标上升路线；必须把latent语义、可辨识、奇异性、优化与预测验收分开。</text>
</svg>