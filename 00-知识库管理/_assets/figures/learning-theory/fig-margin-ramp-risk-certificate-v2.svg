<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">分类间隔、ramp loss 与风险证书</title>
<desc id="desc">函数间隔先经过阈值化的 ramp loss 转成可收缩的有界损失；经验低间隔比例、按一除以 gamma 增长的复杂度项和置信项共同构成分类风险上界。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">分对不等于远离边界</text>
<line x1="70" y1="300" x2="350" y2="170" stroke="#1F2937" stroke-width="3"/>
<line x1="115" y1="390" x2="315" y2="105" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="105" cy="215" r="15" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="105" y="220" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">+</text>
<circle cx="155" cy="245" r="15" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="155" y="250" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">+</text>
<circle cx="220" cy="195" r="15" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="220" y="200" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">+</text>
<circle cx="135" cy="335" r="15" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="135" y="340" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">−</text>
<circle cx="230" cy="315" r="15" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="230" y="320" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">−</text>
<circle cx="320" cy="275" r="15" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="320" y="280" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">−</text>
<line x1="245" y1="240" x2="275" y2="220" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="285" y="223" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">margin</text>
<text x="45" y="440" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB" class="math">rho_i = y_i f(x_i)</text>
<text x="45" y="480" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">linear geometry divides by ||w||</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">functional margin alone is scale-sensitive。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Ramp 把 0–1 变成 Lipschitz</text>
<line x1="470" y1="395" x2="755" y2="395" stroke="#D7DEE8" stroke-width="2"/>
<line x1="470" y1="105" x2="470" y2="395" stroke="#D7DEE8" stroke-width="2"/>
<path d="M470 145L560 145L690 365L755 365" fill="none" stroke="#0F766E" stroke-width="3"/>
<line x1="560" y1="145" x2="560" y2="395" stroke="#D7DEE8" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="690" y1="365" x2="690" y2="395" stroke="#D7DEE8" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="560" y="420" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">0</text>
<text x="690" y="420" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">gamma</text>
<text x="490" y="130" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">phi_gamma</text>
<text x="430" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">1{rho&lt;=0} &lt;= phi_gamma(rho)</text>
<text x="430" y="490" font-size="15" font-weight="700" text-anchor="start" fill="#C24135" class="math">L = 1/gamma</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">smaller gamma means a larger penalty。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三个可审计的风险项</text>
<rect x="840" y="92" width="300" height="94" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990" y="128" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">empirical low-margin rate</text>
<text x="990" y="162" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937" class="math">P_m{y f(x) &lt;= gamma}</text>
<rect x="840" y="225" width="300" height="94" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990" y="261" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">capacity at scale gamma</text>
<text x="990" y="295" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937" class="math">4 hat R_S(F) / gamma</text>
<rect x="840" y="358" width="300" height="94" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990" y="394" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">confidence budget</text>
<text x="990" y="428" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937" class="math">order sqrt(log(1/delta)/m)</text>
<text x="830" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">choose gamma on a declared grid</text>
<text x="830" y="520" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">SVM geometry is one interface, not the theorem。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">分类证书同时读取经验 margin 分布、函数类复杂度与置信预算；最小训练间隔不是全部证据。</text>
</svg>