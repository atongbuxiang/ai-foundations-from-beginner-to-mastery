<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">随机、Oblivious 与 Adaptive Sequence</title>
<desc id="desc">filtration 精确标记谁在何时看到 learner 的历史、fresh coin 与当前 action。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">四种数据生成合同</text>
<rect x="55" y="100" width="145" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="127.5" y="130.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">iid</text>
<line x1="205" y1="124" x2="235" y2="124" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="247" y="130" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">fresh sample ⟂ history</text>
<rect x="55" y="188" width="145" height="48" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="127.5" y="218.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">random order</text>
<line x1="205" y1="212" x2="235" y2="212" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="247" y="218" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">without replacement</text>
<rect x="55" y="276" width="145" height="48" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="127.5" y="306.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">oblivious</text>
<line x1="205" y1="300" x2="235" y2="300" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="247" y="306" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">whole sequence pre-fixed</text>
<rect x="55" y="364" width="145" height="48" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="127.5" y="394.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">adaptive</text>
<line x1="205" y1="388" x2="235" y2="388" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="247" y="394" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">depends on past history</text>
<text x="55" y="478" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">random ≠ independent; adversarial ≠ deterministic</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Filtration 与 Fresh Coin</text>
<rect x="450" y="130" width="68" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="484.0" y="160.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">F(t-1)</text>
<line x1="519" y1="154" x2="530" y2="154" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="535" y="130" width="68" height="48" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="569.0" y="160.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">p(t)</text>
<line x1="604" y1="154" x2="615" y2="154" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="620" y="130" width="68" height="48" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="654.0" y="160.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">U(t)</text>
<line x1="689" y1="154" x2="700" y2="154" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="705" y="130" width="68" height="48" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="739.0" y="160.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">I(t)</text>
<text x="445" y="220" font-size="16" font-weight="650" text-anchor="start" fill="#0F766E">non-anticipating loss(t)</text>
<line x1="445" y1="238" x2="755" y2="238" stroke="#0F766E" stroke-width="3"/>
<text x="445" y="278" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">may use F(t-1)</text>
<text x="445" y="313" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">must not use current U(t) or I(t)</text>
<rect x="445" y="355" width="310" height="65" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="393.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">if loss sees I(t): standard proof can fail</text>
<text x="445" y="466" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">measurability is the theorem boundary</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Expectation 到 Realized Path</text>
<rect x="840" y="105" width="300" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="140.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">mixture loss &lt;p(t), loss(t)&gt;</text>
<line x1="990" y1="168" x2="990" y2="205" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="217" width="300" height="68" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="257.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">D(t)=sampled loss - mixture loss</text>
<line x1="990" y1="290" x2="990" y2="327" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="339" width="300" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="374.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">E[D(t)|F(t-1)] = 0</text>
<text x="840" y="438" font-size="15" font-weight="400" text-anchor="start" fill="#0F766E">Azuma: bounded increments</text>
<text x="840" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#0F766E">Freedman: conditional variance</text>
<text x="840" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">then obtain high-probability regret</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">概率结论不是装饰：fresh randomness、可见性和条件期望共同决定证明是否成立。</text>
</svg>