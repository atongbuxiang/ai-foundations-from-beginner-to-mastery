<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">范数约束线性类：Rademacher 复杂度化为对偶范数</title>
<desc id="desc">线性函数对随机符号和的最大相关由权重球的 support function 给出，即 B 乘样本符号和的对偶范数；L2 得到能量半径，L1 得到坐标最大值与 log d，RKHS 得到 kernel diagonal。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Supremum = 支撑函数</text>
<circle cx="195" cy="270" r="115" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<line x1="195" y1="270" x2="310" y2="170" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<line x1="195" y1="270" x2="260" y2="215" stroke="#0F766E" stroke-width="3"/>
<text x="315" y="165" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">v=sum sigma_i x_i</text>
<text x="210" y="220" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">w</text>
<text x="45" y="425" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937" class="math">sup_{||w||&lt;=B} &lt;w,v&gt; = B ||v||_*</text>
<text x="45" y="475" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">dual norm identifies the hardest direction</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">optimization geometry becomes capacity geometry。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">L2：样本能量而非参数个数</text>
<line x1="600" y1="300" x2="480" y2="300" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="480" cy="300" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<line x1="600" y1="300" x2="540" y2="210" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="540" cy="210" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<line x1="600" y1="300" x2="605" y2="335" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="605" cy="335" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<line x1="600" y1="300" x2="675" y2="170" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="675" cy="170" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<line x1="600" y1="300" x2="735" y2="265" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="735" cy="265" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="430" y="105" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">hat R_S(F_B)</text>
<text x="430" y="145" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">= (B/m) E_sigma ||sum sigma_i x_i||_2</text>
<text x="430" y="405" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB" class="math">&lt;= (B/m) sqrt(sum ||x_i||_2^2)</text>
<text x="430" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">&lt;= B R / sqrt(m) if ||x_i||_2&lt;=R</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">dimension may hide inside the data radius R。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">更换范数就更换复杂度坐标</text>
<rect x="840" y="95" width="300" height="82" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="855" y="126" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">||w||_1 &lt;= B</text>
<text x="855" y="158" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">B R_inf sqrt(log d / m)</text>
<rect x="840" y="207" width="300" height="82" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="855" y="238" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">||w||_2 &lt;= B</text>
<text x="855" y="270" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">B R_2 / sqrt(m)</text>
<rect x="840" y="319" width="300" height="82" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="855" y="350" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">RKHS ||f||_H &lt;= B</text>
<text x="855" y="382" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">B sqrt(tr K) / m</text>
<text x="830" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">affine bias adds its own radius</text>
<text x="830" y="485" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">regularization must imply an output norm bound</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">feature scaling changes B and R together。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">范数界的核心是权重球与数据几何的对偶配对；只报参数维数或正则化名称，无法得到数值风险证书。</text>
</svg>