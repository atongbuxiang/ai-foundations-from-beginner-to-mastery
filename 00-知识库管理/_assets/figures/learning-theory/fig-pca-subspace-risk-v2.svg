<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">PCA：经验主轴、总体主子空间与谱间隙</title>
<desc id="desc">PCA在样本上最大化投影方差并最小化正交重构误差；统计问题是经验协方差主子空间能否逼近总体主子空间。误差由协方差扰动与eigengap共同控制，重复特征值时只能识别子空间。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">样本主轴会旋转</text>
<circle cx="85" cy="335" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="115" cy="300" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="145" cy="305" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="175" cy="255" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="205" cy="245" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="235" cy="205" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="265" cy="185" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="300" cy="150" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="325" cy="165" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="150" cy="350" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<line x1="70" y1="390" x2="345" y2="105" stroke="#0F766E" stroke-width="3"/>
<line x1="75" y1="365" x2="350" y2="135" stroke="#C24135" stroke-width="3" stroke-dasharray="8 6"/>
<text x="65" y="430" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">population axis u1</text>
<text x="65" y="466" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">sample axis uhat1</text>
<text x="65" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">sign is arbitrary; angle is the object</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三个等价经验目标</text>
<rect x="445" y="92" width="310" height="65" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="130.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">maximize w^T Sigmahat w, ||w||=1</text>
<line x1="600" y1="162" x2="600" y2="195" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="205" width="310" height="70" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="246.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">minimize sum ||x_i - P_U x_i||^2</text>
<line x1="600" y1="280" x2="600" y2="313" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="323" width="310" height="70" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="364.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">top right singular vectors of centered X</text>
<text x="430" y="438" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">variance explained = reconstruction accounting</text>
<text x="430" y="475" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">centering and scaling define the estimator</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">high variance need not be task-relevant。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">误差合同：扰动 / Gap</text>
<rect x="845" y="92" width="285" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="127.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">||Sigmahat - Sigma||_op</text>
<line x1="987" y1="155" x2="987" y2="188" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="845" y="198" width="285" height="62" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="987.5" y="235.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">divide by population eigengap</text>
<line x1="987" y1="265" x2="987" y2="298" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="845" y="308" width="285" height="64" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="346.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">sin Theta(Uhat_r, U_r)</text>
<text x="830" y="420" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">gap = 0: basis directions are not identifiable</text>
<text x="830" y="458" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">tails / dependence control covariance error</text>
<text x="830" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">choose r inside the evaluation protocol</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">projection stability is not semantic validity。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">PCA先是一个经验谱优化；进入统计学习后，必须报告总体对象、谱间隙、子空间损失与选择协议。</text>
</svg>