<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">有限假设类：从逐点坏事件到一致收敛</title>
<desc id="desc">对 M 个预先固定假设的 Hoeffding 坏事件做 Union Bound，可构造覆盖所有 h 的共同好事件；代价是 log M，而事件之间不需要独立。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">每个固定 h 都有一个坏事件</text>
<circle cx="85" cy="108" r="15" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="85" y="114" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">h1</text>
<text x="125" y="114" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">B_h: |R_S(h)-R_P(h)| &gt; eps</text>
<circle cx="85" cy="183" r="15" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="85" y="189" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">h2</text>
<text x="125" y="189" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">B_h: |R_S(h)-R_P(h)| &gt; eps</text>
<circle cx="85" cy="258" r="15" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="85" y="264" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">h3</text>
<text x="125" y="264" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">B_h: |R_S(h)-R_P(h)| &gt; eps</text>
<circle cx="85" cy="333" r="15" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="85" y="339" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">h4</text>
<text x="125" y="339" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">B_h: |R_S(h)-R_P(h)| &gt; eps</text>
<circle cx="85" cy="408" r="15" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="85" y="414" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">h5</text>
<text x="125" y="414" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">B_h: |R_S(h)-R_P(h)| &gt; eps</text>
<text x="45" y="485" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">Pr(B_h) &lt;= 2 exp(-2m eps^2)</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">all B_h use the same sample S。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Supremum 事件就是并集</text>
<path d="M455 115C505 70 700 70 755 120C790 165 760 240 685 248C620 290 495 265 455 215C430 180 430 145 455 115Z" fill="#FFF7ED" stroke="#C24135" stroke-width="2.5"/>
<circle cx="500" cy="145" r="26" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="500" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">B1</text>
<circle cx="610" cy="120" r="26" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="610" y="126" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">B2</text>
<circle cx="700" cy="168" r="26" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="700" y="174" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">B3</text>
<circle cx="545" cy="215" r="26" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="545" y="221" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">B4</text>
<circle cx="660" cy="220" r="26" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="660" y="226" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">B5</text>
<text x="430" y="330" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E" class="math">{sup_h gap(h) &gt; eps} = union_h B_h</text>
<text x="430" y="385" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">Pr(union_h B_h) &lt;= sum_h Pr(B_h)</text>
<text x="430" y="440" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">independence is not required</text>
<text x="430" y="485" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">indicator inequality proves the union bound</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">dependence may only make the bound loose。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">反解后：类大小只付 log M</text>
<rect x="840" y="95" width="300" height="88" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990" y="128" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">with probability &gt;= 1-delta</text>
<text x="990" y="162" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">sup_h |R_S-R_P| &lt;= sqrt(log(2M/delta)/(2m))</text>
<text x="830" y="240" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">M = number of distinct prediction functions</text>
<text x="830" y="282" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">not parameter files or training runs</text>
<text x="830" y="332" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">simultaneous event covers data-chosen h_S</text>
<text x="830" y="382" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">candidate set must be fixed independently</text>
<text x="830" y="432" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">infinite classes need growth / covers / complexity</text>
<text x="830" y="482" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">log M is a selection price</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">it is not a claim that large classes are harmless。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Union Bound 的作用不是制造独立性，而是把 M 个逐点证书合成一个可用于数据依赖选择的共同事件。</text>
</svg>