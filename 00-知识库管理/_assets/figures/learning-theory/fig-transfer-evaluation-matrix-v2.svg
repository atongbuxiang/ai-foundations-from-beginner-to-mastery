<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">表示迁移评估：Probe、Fine-Tuning 与多轴证据矩阵</title>
<desc id="desc">linear probe测固定表示上的线性可访问性；fine-tuning测初始化与适配算法。task、head、label budget、compute、shift、seed和selection都必须进入评估矩阵。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三个不同 Estimand</text>
<rect x="55" y="92" width="300" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="205.0" y="129.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">oracle linear risk</text>
<line x1="205" y1="159" x2="205" y2="190" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="55" y="200" width="300" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="205.0" y="237.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">finite-label trained probe</text>
<line x1="205" y1="267" x2="205" y2="298" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="55" y="308" width="300" height="62" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="205.0" y="345.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">fine-tune initialization + algorithm</text>
<text x="45" y="420" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">scratch is the architecture/data baseline</text>
<text x="45" y="458" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">XOR: information can be nonlinear to read</text>
<text x="45" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">probe score depends on head training</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">one score cannot identify representation quality。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">沿资源轴画完整曲线</text>
<text x="430" y="105" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">label budget</text>
<circle cx="455" cy="145" r="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<circle cx="515" cy="145" r="7" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<circle cx="585" cy="145" r="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<circle cx="665" cy="145" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<circle cx="735" cy="145" r="10" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<line x1="455" y1="145" x2="735" y2="145" stroke="#2563EB" stroke-width="2"/>
<text x="430" y="220" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">head capacity</text>
<text x="440" y="260" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">kNN</text>
<text x="504" y="260" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">linear</text>
<text x="568" y="260" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">MLP</text>
<text x="632" y="260" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">partial</text>
<text x="696" y="260" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">full</text>
<text x="430" y="335" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">compute / steps</text>
<line x1="455" y1="375" x2="735" y2="375" stroke="#C24135" stroke-width="3" marker-end="url(#a3)"/>
<text x="430" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">early gain may be optimization speedup</text>
<text x="430" y="458" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">large-budget gap tests persistent transfer</text>
<text x="430" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">freeze layer and feature normalization</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">report curves, not one checkpoint。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">最终 Claim 来自 Transfer Matrix</text>
<rect x="845" y="92" width="130" height="54" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="910.0" y="125.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">tasks</text>
<rect x="995" y="92" width="135" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="1062.5" y="125.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">protocols</text>
<rect x="845" y="170" width="130" height="54" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="910.0" y="203.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">shifts</text>
<rect x="995" y="170" width="135" height="54" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="1062.5" y="203.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">seeds</text>
<rect x="845" y="248" width="130" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="910.0" y="281.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">compute</text>
<rect x="995" y="248" width="135" height="54" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="1062.5" y="281.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">selection</text>
<text x="830" y="350" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">nested validation protects the locked test</text>
<text x="830" y="390" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">paired uncertainty uses the same splits</text>
<text x="830" y="430" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">report average, worst task and negative transfer</text>
<text x="830" y="470" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">align FLOPs, search and early stopping</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">single-task top-1 is not universal transfer。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先声明probe或fine-tune测量什么，再锁定资源和selection；只有多任务、多预算和shift矩阵才能支持通用迁移声明。</text>
</svg>