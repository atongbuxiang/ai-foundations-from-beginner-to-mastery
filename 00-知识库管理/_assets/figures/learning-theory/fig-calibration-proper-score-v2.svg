<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">概率校准：总体对象、Proper Risk 与有限样本决策</title>
<desc id="desc">校准是条件频率等式；proper loss同时奖励诚实概率与分辨率；可靠性图、ECE和temperature scaling只是数据依赖的估计与后处理。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">先声明 Calibration 对象</text>
<rect x="55" y="92" width="300" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="205.0" y="127.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">full Q(x) in probability simplex</text>
<line x1="205" y1="155" x2="205" y2="188" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="55" y="198" width="140" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="125.0" y="233.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">top label</text>
<rect x="215" y="198" width="140" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="285.0" y="233.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">confidence</text>
<text x="45" y="310" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">strong: P(Y=k | Q) = Q_k</text>
<text x="45" y="350" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">classwise: P(Y=k | Q_k=p) = p</text>
<text x="45" y="390" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">top-label: P(correct | C=p) = p</text>
<text x="45" y="442" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">strong =&gt; classwise / top-label</text>
<text x="45" y="482" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">accuracy does not imply calibration</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">an ECE number is not the definition。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Proper Loss 约束诚实概率</text>
<rect x="445" y="92" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="127.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">log regret = KL(p || q)</text>
<rect x="445" y="176" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="211.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">Brier regret = ||p - q||^2</text>
<line x1="600" y1="239" x2="600" y2="270" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="280" width="310" height="76" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="324.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">Brier = reliability - resolution + uncertainty</text>
<text x="430" y="408" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">calibrated constant predictor can be unsharp</text>
<text x="430" y="448" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">different proper losses value errors differently</text>
<text x="430" y="488" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">population optimum != finite fitted model</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">report probability quality on several axes。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">估计、后处理、行动分开</text>
<line x1="865" y1="300" x2="865" y2="105" stroke="#D7DEE8" stroke-width="2"/>
<line x1="865" y1="300" x2="1115" y2="300" stroke="#D7DEE8" stroke-width="2"/>
<line x1="875" y1="290" x2="1100" y2="115" stroke="#0F766E" stroke-width="3"/>
<circle cx="900" cy="270" r="6" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="945" cy="232" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="995" cy="205" r="6" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="1045" cy="155" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="1090" cy="132" r="6" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="880" y="330" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">reliability bins need counts + intervals</text>
<text x="830" y="378" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">fit T on calibration: softmax(z / T)</text>
<text x="830" y="418" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">lock selection before final test</text>
<text x="830" y="458" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">decision threshold comes from costs</text>
<text x="830" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">monitor group, time and deployment shift</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">source calibration is not shift immunity。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">校准先定义条件频率，再用proper risk与独立数据估计；概率只有进入成本和shift合同后才成为可靠行动依据。</text>
</svg>