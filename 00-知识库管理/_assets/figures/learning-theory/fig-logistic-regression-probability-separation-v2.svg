<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">逻辑回归：概率目标、凸风险与 separation</title>
<desc id="desc">logit link 把线性 score 映到概率；conditional log loss 等于 binary entropy 加 KL，因此真实概率是唯一总体最优。有限样本 separation 会让无正则 MLE 沿参数射线逃向无穷。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Score 经 sigmoid 变成概率</text>
<line x1="60" y1="380" x2="345" y2="380" stroke="#D7DEE8" stroke-width="2"/>
<line x1="200" y1="95" x2="200" y2="405" stroke="#D7DEE8" stroke-width="2"/>
<path d="M65 365C125 360 160 320 190 230C220 140 270 115 340 110" fill="none" stroke="#2563EB" stroke-width="3"/>
<line x1="65" y1="230" x2="340" y2="230" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="6 5"/>
<text x="335" y="215" font-size="15" font-weight="650" text-anchor="end" fill="#1F2937">0.5</text>
<text x="245" y="145" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">q = sigmoid(s)</text>
<text x="45" y="440" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937" class="math">s = x^T beta = log[q/(1-q)]</text>
<text x="45" y="480" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">threshold belongs to the decision-cost layer</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">a large logit is not a causal effect。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Log loss 是严格 proper</text>
<rect x="445" y="100" width="310" height="68" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="140.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">conditional cross-entropy</text>
<line x1="600" y1="173" x2="600" y2="208" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="218" width="310" height="78" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="263.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">H_b(eta) + kl(eta || q)</text>
<line x1="600" y1="301" x2="600" y2="336" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="346" width="310" height="68" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="386.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">unique optimum q = eta(x)</text>
<text x="430" y="460" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">linear log-odds restricts representable eta</text>
<text x="430" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">misspecification yields a KL projection</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">accuracy discards probability quality。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Convex 不等于 finite MLE</text>
<line x1="850" y1="390" x2="1130" y2="390" stroke="#D7DEE8" stroke-width="2"/>
<line x1="850" y1="100" x2="850" y2="390" stroke="#D7DEE8" stroke-width="2"/>
<path d="M860 130C930 280 1010 360 1120 370" fill="none" stroke="#C24135" stroke-width="3"/>
<text x="880" y="155" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">separable data</text>
<text x="970" y="315" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">loss -&gt; 0 as ||beta|| -&gt; infinity</text>
<path d="M865 365C930 250 1000 175 1120 130" fill="none" stroke="#0F766E" stroke-width="3"/>
<text x="1010" y="165" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">L2 penalty</text>
<text x="830" y="430" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">gradient = X^T(p-y) ; Hessian = X^T W X</text>
<text x="830" y="470" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">stable softplus prevents overflow, not separation</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">regularization restores a target but changes it。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">逻辑回归连接概率估计、凸优化与决策；properness、可表示性和 MLE 存在性必须分别检查。</text>
</svg>