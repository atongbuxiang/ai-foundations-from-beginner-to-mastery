<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">样本复杂度下界：从难分辨世界到 Minimax 风险</title>
<desc id="desc">上界构造一个可行算法；下界必须让任意算法都失败。Le Cam 用两个统计上接近而最优决策不同的世界，Fano 扩展到多世界 packing，Assouad 把多个二元坐标的困难相加。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">先交换正确的量词</text>
<rect x="55" y="95" width="290" height="72" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="200" y="125" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">upper bound</text>
<text x="200" y="153" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">exists A, for every P: risk is small</text>
<rect x="55" y="215" width="290" height="88" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="200" y="247" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">lower bound</text>
<text x="200" y="275" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">for every A, exists hard P</text>
<text x="200" y="296" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">such that risk stays large</text>
<text x="45" y="370" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB" class="math">minimax: inf_A sup_{P in P} E_P loss(A,S)</text>
<text x="45" y="430" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">hard distribution may depend on A</text>
<text x="45" y="470" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">the whole family is fixed by the theorem</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">one bad algorithm proves no lower bound。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Le Cam：近分布、远决策</text>
<rect x="445" y="95" width="125" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="507.5" y="130.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">P0^m</text>
<rect x="650" y="95" width="105" height="58" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="702.5" y="130.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">P1^m</text>
<path d="M575 125C595 105 625 105 645 125" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="610" y="92" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">small TV / KL</text>
<line x1="507" y1="156" x2="535" y2="220" stroke="#D7DEE8" stroke-width="2" marker-end="url(#a3)"/>
<line x1="703" y1="156" x2="670" y2="220" stroke="#D7DEE8" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="232" width="135" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="522.5" y="267.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">action a0</text>
<rect x="625" y="232" width="135" height="58" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="692.5" y="267.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">action a1</text>
<text x="430" y="350" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">samples cannot reliably identify the world</text>
<text x="430" y="392" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">but optimal actions must be separated</text>
<text x="430" y="445" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">testing error -&gt; estimation / excess lower bound</text>
<text x="430" y="485" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">product closeness dictates useful perturbation</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">indistinguishability is the information bottleneck。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">从二点到多点与多坐标</text>
<rect x="840" y="90" width="300" height="82" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="860" y="120" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">Le Cam</text>
<text x="950" y="120" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">2 worlds</text>
<text x="860" y="152" font-size="15" font-weight="600" text-anchor="start" fill="#1F2937">binary testing</text>
<rect x="840" y="205" width="300" height="82" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="860" y="235" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">Fano</text>
<text x="950" y="235" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">M-world packing</text>
<text x="860" y="267" font-size="15" font-weight="600" text-anchor="start" fill="#1F2937">log M information</text>
<rect x="840" y="320" width="300" height="82" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="860" y="350" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">Assouad</text>
<text x="950" y="350" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">hypercube</text>
<text x="860" y="382" font-size="15" font-weight="600" text-anchor="start" fill="#1F2937">sum coordinate errors</text>
<text x="830" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">match lower and upper rates, not constants only</text>
<text x="830" y="490" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">state expectation / probability conversion</text>
<text x="830" y="520" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">a lower bound belongs to a specified problem class。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">下界证明的核心不是展示算法失败，而是构造统计上难分辨、决策上必须分开的世界族，使任何算法都支付不可避免的误差。</text>
</svg>