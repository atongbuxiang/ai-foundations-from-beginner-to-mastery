<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">替换一个样本、损失敏感性与泛化</title>
<desc id="desc">两个训练集只在一个坐标不同；同一测试点上的损失差由 beta 控制。ghost replacement 与交换对称性把总体减经验风险的期望改写成这种损失差。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">相邻数据集只差一个坐标</text>
<rect x="55" y="135" width="48" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="79.0" y="165.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">z1</text>
<rect x="55" y="260" width="48" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="79.0" y="290.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">z1</text>
<rect x="117" y="135" width="48" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="141.0" y="165.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">z2</text>
<rect x="117" y="260" width="48" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="141.0" y="290.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">z2</text>
<rect x="179" y="135" width="48" height="48" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="203.0" y="165.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">z_i</text>
<rect x="179" y="260" width="48" height="48" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="203.0" y="290.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">z_i&#x27;</text>
<rect x="241" y="135" width="48" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="265.0" y="165.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">z4</text>
<rect x="241" y="260" width="48" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="265.0" y="290.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">z4</text>
<rect x="303" y="135" width="48" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="327.0" y="165.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">z5</text>
<rect x="303" y="260" width="48" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="327.0" y="290.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">z5</text>
<line x1="79" y1="205" x2="327" y2="205" stroke="#D7DEE8" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="203" y1="188" x2="203" y2="248" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="45" y="365" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">S ~ S&#x27; : exactly one replacement</text>
<text x="45" y="410" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">sample unit and adjacency are theorem inputs</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">deletion and replacement use different constants。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">算法输出不同，测试点固定</text>
<rect x="450" y="115" width="125" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="512.5" y="149.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">A(S)</text>
<rect x="450" y="300" width="125" height="56" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="512.5" y="334.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">A(S&#x27;)</text>
<line x1="578" y1="143" x2="650" y2="230" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<line x1="578" y1="328" x2="650" y2="245" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<rect x="665" y="200" width="80" height="72" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="705.0" y="242.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">test z</text>
<text x="430" y="405" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">sup_z |ell(A(S),z)-ell(A(S&#x27;),z)|</text>
<text x="430" y="442" font-size="18" font-weight="700" text-anchor="start" fill="#C24135" class="math">&lt;= beta_m</text>
<text x="430" y="480" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">compare losses, not raw parameter distance</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">randomized A needs an explicit seed quantifier。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Ghost replacement 打通期望</text>
<rect x="840" y="100" width="300" height="82" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990" y="131" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">population risk</text>
<text x="990" y="162" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">replace evaluation by fresh Z_i&#x27;</text>
<rect x="840" y="235" width="300" height="82" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990" y="266" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">exchangeability</text>
<text x="990" y="297" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">swap Z_i and Z_i&#x27;</text>
<rect x="840" y="370" width="300" height="82" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990" y="401" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">stability</text>
<text x="990" y="432" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">each loss difference &lt;= beta_m</text>
<line x1="990" y1="185" x2="990" y2="228" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="990" y1="320" x2="990" y2="363" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="830" y="490" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937" class="math">|E[R(A(S))-R_S(A(S))]| &lt;= beta_m</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">small gap alone does not imply small risk。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">稳定性把一个算法的单样本敏感性，转成期望泛化间隙的证书。</text>
</svg>