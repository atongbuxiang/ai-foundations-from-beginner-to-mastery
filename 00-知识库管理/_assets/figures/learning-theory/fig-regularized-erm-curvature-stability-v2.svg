<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">正则化 ERM：曲率把数据扰动变成稳定性</title>
<desc id="desc">相邻数据集产生两个强凸目标。把两个最优性不等式相加后，共享样本项抵消；只剩被替换样本的两个 Lipschitz 差，与强凸二次下界平衡。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">相邻目标与两个极小点</text>
<line x1="62" y1="390" x2="345" y2="390" stroke="#D7DEE8" stroke-width="2"/>
<line x1="62" y1="100" x2="62" y2="390" stroke="#D7DEE8" stroke-width="2"/>
<path d="M70 150C130 330 180 370 220 365C270 355 305 265 340 125" fill="none" stroke="#2563EB" stroke-width="3"/>
<path d="M70 115C120 275 165 350 205 365C250 380 300 325 340 175" fill="none" stroke="#0F766E" stroke-width="3"/>
<circle cx="220" cy="365" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="205" cy="365" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="230" y="350" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">w_S</text>
<text x="158" y="350" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">w_S&#x27;</text>
<line x1="205" y1="420" x2="220" y2="420" stroke="#C24135" stroke-width="3"/>
<text x="212" y="450" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">Delta</text>
<text x="45" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">lambda-strong convexity supplies curvature</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">the minimizer is unique under this contract。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">相加后，共享样本抵消</text>
<rect x="445" y="100" width="310" height="60" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="136.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">F_S(w&#x27;) - F_S(w)</text>
<rect x="445" y="205" width="310" height="60" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="241.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">F_S&#x27;(w) - F_S&#x27;(w&#x27;)</text>
<line x1="600" y1="164" x2="600" y2="197" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<line x1="470" y1="300" x2="730" y2="300" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="340" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">shared m-1 terms cancel</text>
<text x="430" y="390" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">lambda ||Delta||^2 &lt;= (2L/m)||Delta||</text>
<text x="430" y="435" font-size="16" font-weight="700" text-anchor="start" fill="#C24135" class="math">||Delta|| &lt;= 2L/(lambda m)</text>
<text x="430" y="480" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">then loss stability &lt;= L ||Delta||</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">smoothness is not needed for the exact minimizer。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">正则强度不是免费午餐</text>
<line x1="860" y1="390" x2="1125" y2="390" stroke="#D7DEE8" stroke-width="2"/>
<line x1="860" y1="105" x2="860" y2="390" stroke="#D7DEE8" stroke-width="2"/>
<path d="M870 350C930 285 1015 195 1118 125" fill="none" stroke="#0F766E" stroke-width="3"/>
<path d="M870 130C940 190 1020 290 1118 350" fill="none" stroke="#C24135" stroke-width="3"/>
<text x="885" y="325" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">stability improves</text>
<text x="985" y="170" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">bias can grow</text>
<text x="1085" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">lambda</text>
<text x="830" y="455" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB" class="math">beta_m &lt;= 2L^2/(lambda m)</text>
<text x="830" y="490" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">choose lambda with a declared validation protocol</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">scale-invariant nets require function-level audit。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">强凸性控制参数位移，Lipschitz 损失再把位移变成稳定性。</text>
</svg>