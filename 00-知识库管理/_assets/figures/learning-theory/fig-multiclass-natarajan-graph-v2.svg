<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">多分类容量：Natarajan 见证与 Graph 见证</title>
<desc id="desc">Natarajan 打散要求每个点有两个不同候选标签并实现全部二选一模式；Graph 打散固定一个基准标签函数，只要求任意子集上的标签等于基准、补集上偏离基准。二者在二分类时退化为 VC 维。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Natarajan：逐点二选一</text>
<circle cx="90" cy="145" r="12" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="90" y="115" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">x1</text>
<rect x="48" y="185" width="84" height="42" rx="5" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="90" y="212" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">cat</text>
<rect x="48" y="250" width="84" height="42" rx="5" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="90" y="277" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">dog</text>
<circle cx="200" cy="145" r="12" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="200" y="115" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">x2</text>
<rect x="158" y="185" width="84" height="42" rx="5" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="200" y="212" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">red</text>
<rect x="158" y="250" width="84" height="42" rx="5" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="200" y="277" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">blue</text>
<circle cx="310" cy="145" r="12" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="310" y="115" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">x3</text>
<rect x="268" y="185" width="84" height="42" rx="5" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="310" y="212" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">A</text>
<rect x="268" y="250" width="84" height="42" rx="5" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="310" y="277" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">B</text>
<text x="45" y="350" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">for every T: first labels on T</text>
<text x="45" y="385" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">second labels outside T</text>
<text x="45" y="445" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">two witnesses may vary with the point</text>
<text x="45" y="485" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">all 2^m binary choices must occur</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">many labels do not prove shattering。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Graph：匹配或偏离一个基准</text>
<rect x="445" y="92" width="310" height="65" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600" y="120" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">reference labeling f(x)</text>
<text x="600" y="148" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">one fixed label at every x</text>
<circle cx="480" cy="240" r="16" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="480" y="246" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">=</text>
<circle cx="560" cy="240" r="16" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="560" y="246" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">!=</text>
<circle cx="640" cy="240" r="16" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="640" y="246" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">=</text>
<circle cx="720" cy="240" r="16" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="720" y="246" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">!=</text>
<text x="430" y="305" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">T: h(x)=f(x)</text>
<text x="430" y="342" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">outside T: h(x)!=f(x)</text>
<text x="430" y="405" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">the alternative label may depend on h and x</text>
<text x="430" y="455" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">Natarajan shattering implies Graph shattering</text>
<text x="430" y="490" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E" class="math">therefore d_N &lt;= d_G</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">the reverse needs a label-dependent argument。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">学习结论不能只换符号</text>
<text x="830" y="105" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">binary labels</text>
<text x="850" y="142" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">d_N = d_G = VCdim</text>
<text x="830" y="198" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">finite label set of size K</text>
<text x="850" y="235" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">d_N &lt;= d_G = O(d_N log K)</text>
<line x1="830" y1="268" x2="1140" y2="268" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="315" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">finite d_N characterizes PAC learnability</text>
<text x="830" y="355" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">generic ERM bounds may depend on d_G</text>
<text x="830" y="395" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">different ERM tie-breaking can matter</text>
<text x="830" y="435" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">structured or huge label spaces need care</text>
<text x="830" y="475" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">surrogate loss adds a calibration bridge</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">multiclass is not binary VC with K pasted on。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Natarajan 维刻画逐点的两标签自由度；Graph 维更贴近一致 ERM 的误差图，两者承担不同证明角色。</text>
</svg>