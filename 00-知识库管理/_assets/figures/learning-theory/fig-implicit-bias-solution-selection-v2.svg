<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Implicit Bias：Dynamics 在多解集合中选解</title>
<desc id="desc">least squares 的 row-space invariance 选择 min norm；separable logistic 的参数发散但方向趋向 max margin。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Least Squares：Affine 解集</text>
<line x1="70" y1="380" x2="350" y2="150" stroke="#0F766E" stroke-width="3"/>
<line x1="95" y1="105" x2="95" y2="415" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="60" y1="360" x2="360" y2="360" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="95" y1="360" x2="225" y2="250" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<circle cx="225" cy="250" r="8" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="235" y="238" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">X_dagger y</text>
<text x="245" y="155" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">Xw=y</text>
<text x="55" y="438" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">zero-init GD stays in row(X)</text>
<text x="55" y="474" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">null-space init is remembered</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Logistic：收敛的是方向</text>
<circle cx="600" cy="300" r="28" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<line x1="600" y1="300" x2="730" y2="155" stroke="#0F766E" stroke-width="4" marker-end="url(#a1)"/>
<line x1="600" y1="300" x2="690" y2="120" stroke="#C24135" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<text x="735" y="145" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">w(t)</text>
<text x="665" y="105" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">max-margin direction</text>
<text x="445" y="370" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">||w(t)|| -&gt; infinity</text>
<text x="445" y="407" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">loss -&gt; 0</text>
<text x="445" y="444" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">w(t)/||w(t)|| -&gt; w_SVM/||w_SVM||</text>
<text x="445" y="485" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">direction convergence may be logarithmically slow</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Selection 不是 Generalization</text>
<rect x="840" y="105" width="150" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="915.0" y="137.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">dynamics</text>
<line x1="995" y1="131" x2="1025" y2="131" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1037" y="137" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">optimizer + init</text>
<rect x="840" y="210" width="150" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="915.0" y="242.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">selected solution</text>
<line x1="995" y1="236" x2="1025" y2="236" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1037" y="242" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">norm / margin / rank</text>
<rect x="840" y="315" width="150" height="52" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="915.0" y="347.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">risk bridge</text>
<line x1="995" y1="341" x2="1025" y2="341" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1037" y="347" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">data assumptions</text>
<text x="840" y="438" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">preconditioner changes geometry</text>
<text x="840" y="474" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">parameterization changes bias</text>
<text x="840" y="508" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">finite time needs its own theorem</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先证明算法选了什么，再证明这个解为何对目标分布简单；两条证明不能合并成一句“SGD 正则化”。</text>
</svg>