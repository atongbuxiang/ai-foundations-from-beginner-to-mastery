<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Sharpness：同一函数，不同参数几何</title>
<desc id="desc">positive-homogeneous rescaling 保持 predictor，却可任意改变 raw norm 与 Hessian sharpness。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">ReLU 等价重缩放</text>
<rect x="60" y="115" width="125" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="122.5" y="148.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">incoming w</text>
<line x1="190" y1="142" x2="225" y2="142" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="235" y="115" width="110" height="55" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="290.0" y="148.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">outgoing a</text>
<text x="55" y="225" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB">w -&gt; c w</text>
<text x="55" y="270" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">a -&gt; a / c</text>
<text x="55" y="320" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">a ReLU(w^T x) stays identical</text>
<text x="55" y="380" font-size="16" font-weight="400" text-anchor="start" fill="#C24135">raw layer norms change</text>
<text x="55" y="425" font-size="16" font-weight="400" text-anchor="start" fill="#0F766E">path product stays invariant</text>
<text x="55" y="480" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">parameter != predictor</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">乘积模型反例</text>
<rect x="445" y="105" width="310" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="138.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">L(a,b)=(ab-1)^2; minima ab=1</text>
<line x1="600" y1="165" x2="600" y2="200" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="445" y="212" width="310" height="60" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="248.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">lambda_max(H)=2(a^2+b^2)</text>
<line x1="600" y1="277" x2="600" y2="312" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="445" y="324" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="359.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">a=c, b=1/c: same f, sharpness -&gt; infinity</text>
<text x="445" y="428" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">raw norm also changes</text>
<text x="445" y="466" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">generalization remains identical</text>
<text x="445" y="502" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">coordinate sharpness is not a function invariant</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">指标证据阶梯</text>
<rect x="840" y="95" width="125" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="902.5" y="125.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">invariant?</text>
<line x1="970" y1="119" x2="1000" y2="119" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1012" y="125" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">symmetry stress test</text>
<rect x="840" y="177" width="125" height="48" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="902.5" y="207.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">predictive?</text>
<line x1="970" y1="201" x2="1000" y2="201" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1012" y="207" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">held-out sweeps</text>
<rect x="840" y="259" width="125" height="48" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="902.5" y="289.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">bounded?</text>
<line x1="970" y1="283" x2="1000" y2="283" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1012" y="289" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">risk theorem</text>
<rect x="840" y="341" width="125" height="48" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="902.5" y="371.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">causal?</text>
<line x1="970" y1="365" x2="1000" y2="365" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="1012" y="371" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">controlled intervention</text>
<rect x="840" y="430" width="300" height="52" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="462.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">parameter / function / data geometry</text>
<text x="840" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">correlation is only one evidence level</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">复杂度指标先过等价类不变性，再谈预测、界和因果；顺序颠倒会把坐标伪影当成理论机制。</text>
</svg>