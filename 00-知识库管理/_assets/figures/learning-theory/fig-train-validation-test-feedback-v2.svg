<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Train、validation、test 与自适应反馈</title>
<desc id="desc">数据集角色由信息流决定：train 拟合候选，validation 选择 pipeline，独立 final test 只在冻结后评价。结果若反馈进开发，holdout 就进入 learner，必须支付选择复杂度或重置独立测试。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三份数据是三种信息角色</text>
<rect x="55" y="88" width="120" height="54" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="115.0" y="121.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">train</text>
<rect x="225" y="88" width="140" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="295.0" y="121.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">candidate models</text>
<rect x="55" y="220" width="120" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="115.0" y="253.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">validation</text>
<rect x="225" y="220" width="140" height="54" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="295.0" y="253.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">selected pipeline</text>
<line x1="178" y1="115" x2="220" y2="115" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="178" y1="247" x2="220" y2="247" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="295" y1="145" x2="295" y2="213" stroke="#D7DEE8" stroke-width="2" marker-end="url(#a3)"/>
<text x="45" y="350" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">validation belongs to the meta-learner</text>
<text x="45" y="390" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">preprocessing and checkpoint rules count</text>
<text x="45" y="435" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">retraining changes the final fitted object</text>
<text x="45" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">names of folders do not define independence。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">冻结后，final test 才评价</text>
<rect x="445" y="100" width="150" height="60" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="520.0" y="136.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">frozen pipeline</text>
<rect x="645" y="100" width="110" height="60" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="700.0" y="136.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">final test</text>
<line x1="598" y1="130" x2="640" y2="130" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="510" y="245" width="190" height="66" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="605.0" y="284.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">reported estimate</text>
<line x1="700" y1="163" x2="630" y2="240" stroke="#D7DEE8" stroke-width="2" marker-end="url(#a3)"/>
<text x="430" y="370" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">conditional on the frozen model</text>
<text x="430" y="405" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">fresh test average can be unbiased</text>
<text x="430" y="448" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">distribution shift remains a separate threat</text>
<text x="430" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">one test set answers one target protocol。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">反馈回路把 test 变成训练信号</text>
<rect x="840" y="90" width="140" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="910.0" y="124.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">developer</text>
<rect x="1020" y="90" width="120" height="56" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="1080.0" y="124.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">leaderboard</text>
<line x1="983" y1="118" x2="1015" y2="118" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<path d="M1080 150C1090 260 915 270 905 150" fill="none" stroke="#C24135" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<text x="830" y="300" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">adaptive queries make final h depend on test</text>
<text x="830" y="345" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">fixed K candidates -&gt; pay log K</text>
<text x="830" y="382" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">adaptive reuse -&gt; control information / privacy</text>
<text x="830" y="425" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">or collect a new untouched test set</text>
<text x="830" y="470" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">group/time leakage changes the sampling unit</text>
<text x="830" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">benchmark saturation is a statistical event。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">评估可信度来自信息隔离与目标分布合同；一旦结果反馈，holdout 就成为学习算法的输入。</text>
</svg>