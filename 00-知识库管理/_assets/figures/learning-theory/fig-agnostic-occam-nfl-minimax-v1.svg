<text x="496" y="211" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" fill="#172554" font-weight="700" text-anchor="start">Occam / 编码</text>
<text x="424" y="252" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#64748b" font-weight="450" text-anchor="start">给短假设更大的先验失败预算</text>
