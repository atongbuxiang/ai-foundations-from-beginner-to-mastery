<text x="166" y="211" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" fill="#172554" font-weight="700" text-anchor="start">不可知 ERM</text>
<text x="94" y="252" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#64748b" font-weight="450" text-anchor="start">双侧估计非零 risk，付出 1/ε²</text>
