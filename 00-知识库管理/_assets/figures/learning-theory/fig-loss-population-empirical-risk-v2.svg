<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Loss、population risk、empirical risk 与 data dependence</title>
<desc id="desc">Loss 编码单次行动代价；population risk 是目标分布期望，empirical risk 是有限样本平均。固定预测器时经验风险可无偏，但用同一数据选择 h_S 后，选择偏差需要统一控制或独立评价。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Loss 把动作与结果变成代价</text>
<rect x="55" y="95" width="130" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="120.0" y="129.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">action a</text>
<rect x="245" y="95" width="120" height="56" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="305.0" y="129.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">outcome y</text>
<rect x="105" y="220" width="210" height="68" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="210.0" y="260.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">ell(a,y)</text>
<line x1="120" y1="154" x2="170" y2="215" stroke="#D7DEE8" stroke-width="2" marker-end="url(#a3)"/>
<line x1="305" y1="154" x2="250" y2="215" stroke="#D7DEE8" stroke-width="2" marker-end="url(#a3)"/>
<text x="45" y="350" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">0-1 -&gt; posterior mode</text>
<text x="45" y="385" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">square -&gt; conditional mean</text>
<text x="45" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">absolute -&gt; conditional median</text>
<text x="45" y="460" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">log loss -&gt; full conditional law</text>
<text x="45" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">changing loss changes the optimal decision。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">总体风险与经验风险分账</text>
<rect x="445" y="92" width="310" height="66" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="131.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">R_P(h)=E_P ell(h(X),Y)</text>
<rect x="445" y="235" width="310" height="66" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="274.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">R_S(h)=m^{-1} sum_i ell(h(X_i),Y_i)</text>
<line x1="600" y1="162" x2="600" y2="228" stroke="#1F2937" stroke-width="2" stroke-dasharray="7 5"/>
<text x="620" y="202" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">generalization gap</text>
<text x="430" y="365" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">P: target population, usually unknown</text>
<text x="430" y="402" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">S: realized training sample</text>
<text x="430" y="448" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">test estimate is a third random object</text>
<text x="430" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">mean / sum / weights change the estimand。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">固定 h 与 h_S 的量词不同</text>
<rect x="840" y="88" width="300" height="60" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="124.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">fixed h before seeing S</text>
<line x1="990" y1="151" x2="990" y2="188" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="840" y="200" width="300" height="60" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="236.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">E_S R_S(h) = R_P(h)</text>
<line x1="990" y1="263" x2="990" y2="300" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="840" y="312" width="300" height="64" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="350.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">learner picks h_S using same S</text>
<text x="830" y="425" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">pointwise unbiasedness does not survive selection</text>
<text x="830" y="460" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">need uniform control / stability / fresh test</text>
<text x="830" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">zero train risk alone says nothing about R_P。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">风险理论的裂缝不在期望公式本身，而在预测器是否依赖用于估计它的同一份数据。</text>
</svg>