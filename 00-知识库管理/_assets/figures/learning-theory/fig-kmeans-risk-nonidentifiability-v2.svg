<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">K-Means：量化风险、Lloyd下降与聚类语义</title>
<desc id="desc">K-Means优化到最近中心的平方距离；assignment与center updates交替降低经验目标，但只保证到局部固定点。中心集合只定义到排列，低objective也不自动对应外部类别或下游任务。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">中心集定义 Voronoi 分区</text>
<circle cx="75" cy="170" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="105" cy="145" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="130" cy="200" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="95" cy="235" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="150" cy="240" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="250" cy="300" r="5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="285" cy="275" r="5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="320" cy="330" r="5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="300" cy="370" r="5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="345" cy="280" r="5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="115" cy="200" r="11" fill="#FFFEFB" stroke="#2563EB" stroke-width="3"/>
<circle cx="300" cy="310" r="11" fill="#FFFEFB" stroke="#C24135" stroke-width="3"/>
<line x1="55" y1="390" x2="360" y2="85" stroke="#0F766E" stroke-width="3" stroke-dasharray="8 6"/>
<text x="45" y="430" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937" class="math">R(C)=E min_j ||X-c_j||^2</text>
<text x="45" y="470" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">nearest-center cells are metric dependent</text>
<text x="45" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">cluster names 1 and 2 can be swapped。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Lloyd 是交替局部下降</text>
<rect x="445" y="92" width="310" height="60" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="128.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">assign each point to nearest center</text>
<line x1="600" y1="157" x2="600" y2="190" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="200" width="310" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="237.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">replace each center by cluster mean</text>
<line x1="600" y1="267" x2="600" y2="300" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="310" width="310" height="62" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="347.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">empirical distortion never increases</text>
<line x1="600" y1="377" x2="600" y2="410" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="420" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="455.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">stop at a local fixed point</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">seeding and empty-cluster rules change output。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三套评价不能混用</text>
<rect x="845" y="92" width="285" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="129.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">internal: distortion / silhouette</text>
<line x1="987" y1="159" x2="987" y2="192" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="845" y="202" width="285" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="239.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">external: ARI / NMI vs labels</text>
<line x1="987" y1="269" x2="987" y2="302" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="845" y="312" width="285" height="62" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="987.5" y="349.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">utility: retrieval / routing outcome</text>
<text x="830" y="420" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">K is part of the inductive bias</text>
<text x="830" y="458" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">consistency needs a unique population optimum</text>
<text x="830" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">representation shift changes the geometry</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">clustering is not label discovery by default。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">K-Means的定理对象是平方距离量化风险；算法收敛、总体相合与语义恢复必须逐层另证。</text>
</svg>