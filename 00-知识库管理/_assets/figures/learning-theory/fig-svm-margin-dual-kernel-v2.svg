<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">SVM：几何间隔、凸对偶与 kernel representation</title>
<desc id="desc">canonical scaling 下 hard margin 宽度由 ||w|| 控制；soft margin 用 hinge/slack 允许违约；Lagrange dual 把解压到 support-vector span，并只通过 Gram entries 访问 feature geometry。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Hard margin 的 canonical 几何</text>
<line x1="70" y1="395" x2="350" y2="130" stroke="#1F2937" stroke-width="3"/>
<line x1="50" y1="355" x2="330" y2="90" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="110" y1="455" x2="390" y2="190" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="85" cy="190" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="120" cy="235" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="150" cy="165" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="185" cy="270" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="245" cy="350" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="285" cy="390" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="310" cy="315" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="345" cy="410" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="60" y="105" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">y=+1</text>
<text x="325" y="455" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">y=-1</text>
<text x="45" y="475" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937" class="math">y_i(&lt;w,phi_i&gt;+b) &gt;= 1</text>
<text x="45" y="510" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">margin width = 2 / ||w||</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Primal、Dual 与 KKT</text>
<rect x="445" y="95" width="310" height="75" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="138.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">min 1/2 ||w||^2 + C sum xi_i</text>
<line x1="600" y1="175" x2="600" y2="205" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="215" width="310" height="75" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="258.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">0 &lt;= alpha_i &lt;= C ; y^T alpha = 0</text>
<line x1="600" y1="295" x2="600" y2="325" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="335" width="310" height="75" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="378.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">w = sum alpha_i y_i phi(x_i)</text>
<text x="430" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">0 &lt; alpha_i &lt; C: exactly on margin</text>
<text x="430" y="490" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">alpha_i = C: inside margin or misclassified</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">support-vector status is sample dependent。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Kernel trick 的合同</text>
<rect x="845" y="95" width="285" height="65" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="133.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">PSD Gram K_ij = k(x_i,x_j)</text>
<line x1="987" y1="165" x2="987" y2="195" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="845" y="205" width="285" height="80" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="251.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">f(x) = sum alpha_i y_i k(x_i,x) + b</text>
<line x1="987" y1="290" x2="987" y2="320" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="845" y="330" width="285" height="70" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="987.5" y="371.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">only support vectors remain</text>
<text x="830" y="445" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">small bandwidth: local / near-identity Gram</text>
<text x="830" y="480" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">large bandwidth: near-constant / low rank</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">PSD legality does not choose a useful kernel。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">SVM 同时是一种 margin geometry、regularized convex program 与 finite kernel expansion。</text>
</svg>