<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">PAC-Bayes 的先验、后验与数据依赖合同</title>
<desc id="desc">标准 theorem 允许 posterior 看训练样本，但 prior 必须相对证书样本保持独立。独立预训练、样本切分、预声明混合与专门 DP 定理提供不同的合法路线。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">时间线决定合法性</text>
<line x1="65" y1="230" x2="340" y2="230" stroke="#1F2937" stroke-width="3" marker-end="url(#a3)"/>
<circle cx="90" cy="230" r="9" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="90" y="190" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">choose P</text>
<circle cx="205" cy="230" r="9" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="205" y="190" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">observe S</text>
<circle cx="315" cy="230" r="9" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="315" y="190" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">choose Q_S</text>
<text x="45" y="310" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">legal: P before the certificate sample</text>
<text x="45" y="360" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">legal: Q after S, chosen by optimization</text>
<text x="45" y="420" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">illegal: center P at w_S without correction</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">ordering is a probability condition, not notation。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">四条可审计路线</text>
<rect x="445" y="100" width="310" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="137.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">independent pretraining prior</text>
<rect x="445" y="205" width="310" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="242.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">split S0 -&gt; P ; certify on S1</text>
<rect x="445" y="310" width="310" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="347.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">fixed mixture with code weights</text>
<rect x="445" y="415" width="310" height="62" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="452.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">special DP-prior theorem + cost</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">the same held-out point cannot serve twice。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Gaussian posterior 的真实权衡</text>
<line x1="850" y1="390" x2="1130" y2="390" stroke="#D7DEE8" stroke-width="2"/>
<line x1="850" y1="100" x2="850" y2="390" stroke="#D7DEE8" stroke-width="2"/>
<path d="M860 125C930 160 1020 270 1120 360" fill="none" stroke="#2563EB" stroke-width="3"/>
<path d="M860 350C930 300 1020 190 1120 125" fill="none" stroke="#C24135" stroke-width="3"/>
<text x="870" y="160" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">KL cost</text>
<text x="1010" y="160" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">perturbed risk</text>
<text x="985" y="425" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">posterior noise scale</text>
<text x="830" y="465" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">sigma -&gt; 0: point mass, often infinite KL</text>
<text x="830" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">sigma large: simple but inaccurate Gibbs predictor</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">report the distribution you actually certify。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">合法先验提供参照；后验在经验风险、随机化与相对熵之间寻找可验证平衡。</text>
</svg>