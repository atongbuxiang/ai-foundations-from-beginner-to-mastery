<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Bagging、Random Forest 与 Boosting：三种不同的集成机制</title>
<desc id="desc">Bagging 对 bootstrap perturbations 的 predictors 做平均；random forest 进一步随机化 candidate features 以降低 tree correlation；boosting 则顺序拟合当前 loss 的错误方向。它们不是同一个 bias–variance 口号的三个别名。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Bagging：Bootstrap 平均</text>
<rect x="55" y="90" width="285" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="197.5" y="123.5" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">training sample S</text>
<line x1="197" y1="150" x2="102" y2="195" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="60" y="205" width="84" height="55" rx="6" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="102" y="238" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">S*</text>
<line x1="102" y1="265" x2="102" y2="300" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="60" y="310" width="84" height="55" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="102" y="343" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">A(S*)</text>
<line x1="197" y1="150" x2="197" y2="195" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="155" y="205" width="84" height="55" rx="6" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="197" y="238" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">S*</text>
<line x1="197" y1="265" x2="197" y2="300" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="155" y="310" width="84" height="55" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="197" y="343" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">A(S*)</text>
<line x1="197" y1="150" x2="292" y2="195" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="250" y="205" width="84" height="55" rx="6" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="292" y="238" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">S*</text>
<line x1="292" y1="265" x2="292" y2="300" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="250" y="310" width="84" height="55" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="292" y="343" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">A(S*)</text>
<line x1="102" y1="370" x2="197" y2="410" stroke="#1F2937" stroke-width="2"/>
<line x1="197" y1="370" x2="197" y2="410" stroke="#1F2937" stroke-width="2"/>
<line x1="292" y1="370" x2="197" y2="410" stroke="#1F2937" stroke-width="2"/>
<rect x="85" y="420" width="225" height="58" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="197.5" y="455.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">average / vote</text>
<text x="45" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">best for unstable base procedures; not universal。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Random Forest：去相关</text>
<rect x="445" y="92" width="310" height="60" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="128.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">bootstrap observations</text>
<line x1="600" y1="157" x2="600" y2="190" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="200" width="310" height="68" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="240.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">random feature subset at every split</text>
<line x1="600" y1="273" x2="600" y2="306" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="316" width="310" height="65" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="354.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">strong trees + lower correlation</text>
<text x="430" y="425" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">B -&gt; infinity removes Monte Carlo error</text>
<text x="430" y="462" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">OOB: each point uses trees that excluded it</text>
<text x="430" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">OOB reuse can still overfit hyperparameters</text>
<text x="430" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">more trees do not erase dataset uncertainty。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Boosting：序列下降</text>
<rect x="845" y="92" width="285" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="125.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">current function F_(m-1)</text>
<line x1="987" y1="152" x2="987" y2="185" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="845" y="195" width="285" height="70" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="987.5" y="236.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">pseudo-residual = - d loss / dF</text>
<line x1="987" y1="270" x2="987" y2="303" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="845" y="313" width="285" height="65" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="351.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">fit h_m and add nu rho_m h_m</text>
<text x="830" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">AdaBoost: exponential loss and reweighting</text>
<text x="830" y="458" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">depth, shrinkage, subsampling, stopping</text>
<text x="830" y="495" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">training descent is not test-risk descent</text>
<text x="830" y="515" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">noise and outliers can dominate late rounds。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">并行平均降低随机扰动，特征随机化改变相关性，顺序加法模型逼近 loss descent。</text>
</svg>