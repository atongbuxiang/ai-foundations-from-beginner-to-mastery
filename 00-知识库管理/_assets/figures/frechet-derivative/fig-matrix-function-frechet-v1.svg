<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">矩阵函数 Fréchet 导数的四种接口</title>
  <desc id="desc">左侧展示扰动到一阶响应，中间展示块矩阵、除差和 Kronecker 三种表示，右侧展示伴随反向传播、条件数与数值边界。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; fill:#0f172a; }
      .head { font: 700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; fill:#172554; }
      .body { font: 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; fill:#334155; }
      .math { font: 15px Georgia,"Times New Roman",serif; fill:#0f172a; }
      .small { font: 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; fill:#475569; }
      .tag { font: 700 12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; fill:white; }
    </style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <text x="42" y="38" class="title">矩阵函数的 Fréchet 导数：前向、表示、反向与条件性</text>

  <g filter="url(#shadow)">
    <rect x="35" y="62" width="345" height="328" rx="18" fill="#ffffff" stroke="#c7d2fe"/>
    <rect x="400" y="62" width="390" height="328" rx="18" fill="#ffffff" stroke="#bae6fd"/>
    <rect x="810" y="62" width="355" height="328" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
  </g>

  <rect x="53" y="80" width="26" height="22" rx="6" fill="#4f46e5"/>
  <text x="62" y="96" class="tag">A</text>
  <text x="90" y="97" class="head">一阶线性化：输入方向 → 输出方向</text>
  <rect x="72" y="125" width="118" height="62" rx="12" fill="#eef2ff" stroke="#818cf8"/>
  <text x="103" y="149" class="math">A + hE</text>
  <text x="87" y="172" class="small">基点 + 小扰动</text>
  <path d="M195 156 H248" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="254" y="125" width="96" height="62" rx="12" fill="#ecfeff" stroke="#22d3ee"/>
  <text x="277" y="149" class="math">f(A+hE)</text>
  <text x="268" y="172" class="small">非线性函数值</text>
  <rect x="67" y="218" width="280" height="78" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="88" y="245" class="math">f(A+hE) = f(A) + h L<tspan baseline-shift="sub" font-size="11">f</tspan>(A,E) + O(h²)</text>
  <text x="86" y="273" class="body">L<tspan baseline-shift="sub" font-size="10">f</tspan>(A,·) 对方向 E 线性</text>
  <text x="77" y="326" class="body">关键：导数是 n² 维矩阵空间上的算子</text>
  <text x="77" y="351" class="body">标量捷径 f′(A)E 仅在可交换等特例成立</text>
  <text x="77" y="374" class="small">例：L<tspan baseline-shift="sub" font-size="10">z²</tspan>(A,E)=AE+EA</text>

  <rect x="418" y="80" width="26" height="22" rx="6" fill="#0284c7"/>
  <text x="427" y="96" class="tag">B</text>
  <text x="455" y="97" class="head">同一导数的三种坐标接口</text>
  <rect x="432" y="121" width="325" height="68" rx="12" fill="#f0f9ff" stroke="#38bdf8"/>
  <text x="450" y="145" class="body">块矩阵</text>
  <text x="515" y="146" class="math">f([A E; 0 A]) = [f(A) L; 0 f(A)]</text>
  <text x="450" y="173" class="small">统一定理与小规模验证；维数翻倍</text>
  <rect x="432" y="205" width="325" height="68" rx="12" fill="#f0fdfa" stroke="#2dd4bf"/>
  <text x="450" y="229" class="body">除差矩阵</text>
  <text x="537" y="230" class="math">L = Q(F ⊙ Q*EQ)Q*</text>
  <text x="450" y="257" class="small">Hermitian 谱函数；重复谱取 f′(λ)</text>
  <rect x="432" y="289" width="325" height="68" rx="12" fill="#faf5ff" stroke="#c084fc"/>
  <text x="450" y="313" class="body">Kronecker</text>
  <text x="537" y="314" class="math">vec(L) = K<tspan baseline-shift="sub" font-size="11">f</tspan>(A) vec(E)</text>
  <text x="450" y="341" class="small">完整 Jacobian 与条件数；生产中通常不物化</text>

  <rect x="828" y="80" width="26" height="22" rx="6" fill="#16a34a"/>
  <text x="837" y="96" class="tag">C</text>
  <text x="865" y="97" class="head">反向传播与可信计算</text>
  <rect x="846" y="126" width="86" height="55" rx="11" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="865" y="149" class="math">G = ∂ℓ/∂Y</text>
  <text x="862" y="169" class="small">上游 cotangent</text>
  <path d="M938 153 H997" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1003" y="126" width="132" height="55" rx="11" fill="#ecfdf5" stroke="#22c55e"/>
  <text x="1018" y="149" class="math">∇<tspan baseline-shift="sub" font-size="11">A</tspan>ℓ = L<tspan baseline-shift="sub" font-size="11">f</tspan>(A)*(G)</text>
  <text x="1023" y="169" class="small">伴随 Fréchet / VJP</text>
  <rect x="846" y="211" width="289" height="65" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="862" y="235" class="body">条件性</text>
  <text x="927" y="236" class="math">cond<tspan baseline-shift="sub" font-size="11">abs</tspan> = ‖L<tspan baseline-shift="sub" font-size="11">f</tspan>(A)‖</text>
  <text x="862" y="261" class="small">函数敏感 ≠ 算法不稳定；结构化方向要单列</text>
  <rect x="846" y="294" width="289" height="68" rx="12" fill="#fff7ed" stroke="#fb923c"/>
  <text x="862" y="318" class="body">三重验收</text>
  <text x="862" y="341" class="small">Taylor 斜率 ≈ 2　·　伴随点积　·　定义域/结构</text>
  <text x="846" y="382" class="small">AI：SSM · 白化/逆平方根 · 矩阵优化器 · Lie 参数化</text>
</svg>
