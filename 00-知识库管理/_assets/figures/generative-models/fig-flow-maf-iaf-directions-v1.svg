<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">MAF 与 IAF 的并行和串行方向</title><desc id="desc">上下两栏对比 MAF 给定数据时并行评价密度、IAF 给定噪声时并行生成，以及相反方向的阶梯依赖。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}</style>
<text x="54" y="52" font-size="23" font-weight="700" class="ink">先问“完整已知的是 x 还是 z”，再判断哪一个方向能并行</text>
<rect x="55" y="90" width="1090" height="210" rx="12" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="2"/><text x="78" y="126" font-size="20" font-weight="700" class="blue">MAF｜zᵢ=(xᵢ−μᵢ(x&lt;i))/σᵢ(x&lt;i)</text><text x="78" y="162" font-size="17" class="ink">density：完整 x 已知</text>
<rect x="80" y="185" width="540" height="62" rx="8" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="350" y="222" text-anchor="middle" font-size="17" class="blue">一次 masked forward → 全部 μᵢ,σᵢ,zᵢ（并行）</text>
<text x="675" y="162" font-size="17" class="ink">sampling：必须先得到 x&lt;i</text><circle cx="710" cy="218" r="21" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="710" y="224" text-anchor="middle" font-size="17" class="ink">x1</text><path d="M731 218H785" stroke="#B7791F" stroke-width="3"/><polygon points="785,218 771,210 771,226" fill="#B7791F"/><circle cx="810" cy="218" r="21" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="810" y="224" text-anchor="middle" font-size="17" class="ink">x2</text><path d="M831 218H885" stroke="#B7791F" stroke-width="3"/><polygon points="885,218 871,210 871,226" fill="#B7791F"/><circle cx="910" cy="218" r="21" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="910" y="224" text-anchor="middle" font-size="17" class="ink">x3</text><text x="970" y="224" font-size="17" fill="#B7791F">… 串行</text><text x="78" y="280" font-size="15" class="muted">log|det ∂z/∂x| = −Σ log σᵢ</text>
<rect x="55" y="330" width="1090" height="210" rx="12" fill="#F2FBF8" stroke="#D7DEE8" stroke-width="2"/><text x="78" y="366" font-size="20" font-weight="700" class="green">IAF｜xᵢ=μᵢ(z&lt;i)+σᵢ(z&lt;i)zᵢ</text><text x="78" y="402" font-size="17" class="ink">sampling / posterior transform：完整 z 已知</text>
<rect x="80" y="425" width="540" height="62" rx="8" fill="#E8F5F1" stroke="#0F766E" stroke-width="2"/><text x="350" y="462" text-anchor="middle" font-size="17" class="green">一次 masked forward → 全部 μᵢ,σᵢ,xᵢ（并行）</text>
<text x="675" y="402" font-size="17" class="ink">data density：必须先反求 z&lt;i</text><circle cx="710" cy="458" r="21" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="710" y="464" text-anchor="middle" font-size="17" class="ink">z1</text><path d="M731 458H785" stroke="#B7791F" stroke-width="3"/><polygon points="785,458 771,450 771,466" fill="#B7791F"/><circle cx="810" cy="458" r="21" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="810" y="464" text-anchor="middle" font-size="17" class="ink">z2</text><path d="M831 458H885" stroke="#B7791F" stroke-width="3"/><polygon points="885,458 871,450 871,466" fill="#B7791F"/><circle cx="910" cy="458" r="21" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="910" y="464" text-anchor="middle" font-size="17" class="ink">z3</text><text x="970" y="464" font-size="17" fill="#B7791F">… 串行</text><text x="78" y="520" font-size="15" class="muted">log|det ∂x/∂z| = +Σ log σᵢ</text>
<text x="54" y="580" font-size="16" class="muted">“互为逆”只说明代数关系；parallel depth、network calls、缓存和 wall time 仍需按具体任务测量。</text>
</svg>
