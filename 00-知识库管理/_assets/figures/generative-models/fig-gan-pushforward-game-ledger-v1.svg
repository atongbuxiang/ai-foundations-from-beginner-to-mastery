<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">GAN隐式pushforward与判别博弈</title><desc id="desc">噪声经生成器形成隐式分布，与真实样本进入判别器；下方列出population到当前迭代的四层差距。</desc>
<rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style>
<g font-family="Inter, PingFang SC, sans-serif"><text x="54" y="54" font-size="23" font-weight="700" fill="#1F2937">可采样的隐式分布，经 classifier 变成可训练的比较信号</text>
<rect x="55" y="105" width="175" height="105" rx="8" fill="#EEF3FF" stroke="#2563EB" stroke-width="3"/><text x="142" y="145" text-anchor="middle" font-size="18" fill="#64748B">latent</text><text x="142" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#2563EB">Z ~ PZ</text>
<path d="M230 157H335" stroke="#334155" stroke-width="3"/><polygon points="335,157 320,148 320,166" fill="#334155"/>
<rect x="337" y="105" width="190" height="105" rx="8" fill="#FFF7E6" stroke="#B7791F" stroke-width="3"/><text x="432" y="145" text-anchor="middle" font-size="18" fill="#64748B">generator</text><text x="432" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#B7791F">Gθ(z)</text>
<path d="M527 157H635" stroke="#334155" stroke-width="3"/><polygon points="635,157 620,148 620,166" fill="#334155"/>
<rect x="637" y="105" width="190" height="105" rx="8" fill="#FFF7E6" stroke="#B7791F" stroke-width="3"/><text x="732" y="145" text-anchor="middle" font-size="18" fill="#64748B">pushforward</text><text x="732" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#B7791F">Pθ = Gθ#PZ</text>
<rect x="637" y="264" width="190" height="92" rx="8" fill="#EEF3FF" stroke="#2563EB" stroke-width="3"/><text x="732" y="303" text-anchor="middle" font-size="18" fill="#64748B">真实分布</text><text x="732" y="334" text-anchor="middle" font-size="22" font-weight="700" fill="#2563EB">P*</text>
<path d="M827 157C890 157 899 229 945 243" fill="none" stroke="#C24135" stroke-width="3"/><path d="M827 310C888 310 901 267 945 254" fill="none" stroke="#2563EB" stroke-width="3"/>
<rect x="947" y="190" width="198" height="126" rx="8" fill="#E8F5F1" stroke="#0F766E" stroke-width="3"/><text x="1046" y="228" text-anchor="middle" font-size="18" fill="#64748B">同一 critic</text><text x="1046" y="261" text-anchor="middle" font-size="22" font-weight="700" fill="#0F766E">Dψ(x)</text><text x="1046" y="292" text-anchor="middle" font-size="16" fill="#334155">real / fake log score</text>
<line x1="54" y1="403" x2="1146" y2="403" stroke="#D7DEE8" stroke-width="2"/>
<g font-size="16"><rect x="55" y="439" width="235" height="83" rx="7" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="172" y="471" text-anchor="middle" font-weight="700" fill="#2563EB">Population supremum</text><text x="172" y="499" text-anchor="middle" fill="#64748B">无限函数类 / 真分布</text>
<rect x="325" y="439" width="235" height="83" rx="7" fill="#E8F5F1" stroke="#0F766E" stroke-width="2"/><text x="442" y="471" text-anchor="middle" font-weight="700" fill="#0F766E">Restricted critic</text><text x="442" y="499" text-anchor="middle" fill="#64748B">神经函数类 gap</text>
<rect x="595" y="439" width="235" height="83" rx="7" fill="#FFF7E6" stroke="#B7791F" stroke-width="2"/><text x="712" y="471" text-anchor="middle" font-weight="700" fill="#B7791F">Empirical game</text><text x="712" y="499" text-anchor="middle" fill="#64748B">有限 real/fake samples</text>
<rect x="865" y="439" width="280" height="83" rx="7" fill="#FFF0EE" stroke="#C24135" stroke-width="2"/><text x="1005" y="471" text-anchor="middle" font-weight="700" fill="#C24135">Current iterate ψt</text><text x="1005" y="499" text-anchor="middle" fill="#64748B">未优化 + game dynamics</text></g>
<text x="54" y="571" font-size="16" fill="#1F2937">只有 Bayes-optimal、校准的 classifier 才直接给 density ratio；一次 critic score 不是 divergence 真值。</text></g></svg>

