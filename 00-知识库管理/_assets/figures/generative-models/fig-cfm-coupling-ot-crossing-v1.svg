<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Coupling 如何改变 CFM 路径交叉与回归方差</title>
<desc id="desc">三栏保持左右端点边缘相同，分别画恒等配对、交叉配对和较短的 OT 风格配对；交叉栏在中点显示相反速度的条件方差，底部强调 minibatch OT 不等于 population OT。</desc>
<rect width="1200" height="620" fill="#FFFEFB"/>
<defs><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="redArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker></defs>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}.red{fill:#C24135}.amber{fill:#B7791F}</style>
<text x="58" y="47" font-size="20" font-weight="700" class="ink">端点边缘固定；只改变 joint pairing</text>
<g stroke="#D7DEE8" stroke-width="2"><line x1="400" y1="80" x2="400" y2="495"/><line x1="800" y1="80" x2="800" y2="495"/></g>
<g font-size="19" font-weight="700"><text x="80" y="95" class="green">A　identity coupling</text><text x="435" y="95" class="red">B　crossing coupling</text><text x="835" y="95" class="blue">C　OT-style shorter pairing</text></g>
<g fill="#FFFFFF" stroke="#1F2937" stroke-width="2.5"><circle cx="105" cy="185" r="12"/><circle cx="105" cy="390" r="12"/><circle cx="350" cy="185" r="12"/><circle cx="350" cy="390" r="12"/><circle cx="455" cy="185" r="12"/><circle cx="455" cy="390" r="12"/><circle cx="745" cy="185" r="12"/><circle cx="745" cy="390" r="12"/><circle cx="855" cy="185" r="12"/><circle cx="855" cy="390" r="12"/><circle cx="1110" cy="210" r="12"/><circle cx="1110" cy="365" r="12"/></g>
<path d="M120 185H335" stroke="#0F766E" stroke-width="4"/><path d="M120 390H335" stroke="#0F766E" stroke-width="4"/><text x="160" y="455" font-size="16" class="green">U = 0 in symmetric toy case</text>
<path d="M470 185L730 390" stroke="#C24135" stroke-width="4"/><path d="M470 390L730 185" stroke="#C24135" stroke-width="4"/><circle cx="600" cy="287" r="10" fill="#FFFFFF" stroke="#C24135" stroke-width="3"/><path d="M600 287L600 225" stroke="#2563EB" stroke-width="3" marker-end="url(#blueArrow)"/><path d="M600 287L600 350" stroke="#C24135" stroke-width="3" marker-end="url(#redArrow)"/><text x="500" y="455" font-size="16" class="red">same x,t: targets +2 and -2</text><text x="500" y="480" font-size="16" class="ink">E[U|x]=0, Var(U|x)=4</text>
<path d="M870 185C960 175 1015 205 1095 210" stroke="#2563EB" stroke-width="4" fill="none"/><path d="M870 390C960 395 1020 375 1095 365" stroke="#2563EB" stroke-width="4" fill="none"/><text x="850" y="455" font-size="16" class="blue">shorter / fewer crossings</text><text x="850" y="480" font-size="15" class="muted">still must measure learned field</text>
<line x1="58" y1="520" x2="1142" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="58" y="552" font-size="17" font-weight="700" class="amber">Minibatch OT</text><text x="190" y="552" font-size="16" class="ink">solves an empirical batch assignment</text><text x="555" y="552" font-size="21" class="red">≠</text><text x="600" y="552" font-size="17" font-weight="700" class="green">population OT</text><text x="730" y="552" font-size="16" class="ink">over the full distributions</text>
<text x="58" y="590" font-size="15" class="muted">较短端点线段可能降低 conditional variance，但不自动证明语义配对、ODE 曲率、finite-NFE error 或生成质量更优。</text>
</svg>
