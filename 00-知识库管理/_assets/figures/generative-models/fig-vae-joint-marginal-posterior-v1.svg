<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">隐变量模型的联合分布、边缘似然与后验</title>
  <desc id="desc">先验与似然相乘得到联合分布，联合分布边缘化得到证据，Bayes 条件化得到真后验，近似后验以虚线对齐。</desc>
  <defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs>
  <rect width="1200" height="620" fill="#FFFEFB"/>
  <style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style>
  <g font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="54" y="55" font-size="23" font-weight="700" fill="#1F2937">一个 joint，三种运算；qφ 只是计算近似</text>
    <rect x="60" y="102" width="220" height="100" rx="8" fill="#EEF3FF" stroke="#2563EB" stroke-width="2.5"/>
    <text x="170" y="144" text-anchor="middle" font-size="18" fill="#64748B">先验</text>
    <text x="170" y="178" text-anchor="middle" font-size="23" font-weight="700" fill="#2563EB">p(z)</text>
    <rect x="60" y="258" width="220" height="100" rx="8" fill="#E8F5F1" stroke="#0F766E" stroke-width="2.5"/>
    <text x="170" y="300" text-anchor="middle" font-size="18" fill="#64748B">观测似然 / decoder</text>
    <text x="170" y="334" text-anchor="middle" font-size="23" font-weight="700" fill="#0F766E">pθ(x | z)</text>
    <path d="M280 152 H410" stroke="#334155" stroke-width="3" marker-end="url(#arr2)"/>
    <path d="M280 308 C338 308 362 240 410 220" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arr2)"/>
    <text x="348" y="190" text-anchor="middle" font-size="17" fill="#334155">相乘</text>
    <rect x="412" y="145" width="250" height="150" rx="8" fill="#FFF7E6" stroke="#B7791F" stroke-width="3"/>
    <text x="537" y="192" text-anchor="middle" font-size="18" fill="#64748B">生成模型本体</text>
    <text x="537" y="235" text-anchor="middle" font-size="23" font-weight="700" fill="#B7791F">pθ(x,z)</text>
    <text x="537" y="268" text-anchor="middle" font-size="17" fill="#334155">= p(z)pθ(x|z)</text>
    <path d="M662 190 H800" stroke="#334155" stroke-width="3" marker-end="url(#arr2)"/>
    <text x="731" y="168" text-anchor="middle" font-size="16" fill="#64748B">对 z 积分</text>
    <rect x="802" y="114" width="330" height="116" rx="8" fill="#EEF3FF" stroke="#2563EB" stroke-width="2.5"/>
    <text x="967" y="155" text-anchor="middle" font-size="18" fill="#64748B">边缘似然 / evidence</text>
    <text x="967" y="194" text-anchor="middle" font-size="22" font-weight="700" fill="#2563EB">pθ(x)=∫pθ(x,z)dz</text>
    <path d="M662 250 C740 290 767 338 802 361" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arr2)"/>
    <text x="736" y="312" text-anchor="middle" font-size="16" fill="#64748B">除以 evidence</text>
    <rect x="802" y="310" width="330" height="116" rx="8" fill="#E8F5F1" stroke="#0F766E" stroke-width="2.5"/>
    <text x="967" y="351" text-anchor="middle" font-size="18" fill="#64748B">模型真后验</text>
    <text x="967" y="391" text-anchor="middle" font-size="21" font-weight="700" fill="#0F766E">pθ(z|x)=pθ(x,z)/pθ(x)</text>
    <rect x="412" y="365" width="250" height="100" rx="8" fill="#FFF0EE" stroke="#C24135" stroke-width="2.5" stroke-dasharray="9 7"/>
    <text x="537" y="405" text-anchor="middle" font-size="18" fill="#64748B">amortized 近似</text>
    <text x="537" y="441" text-anchor="middle" font-size="22" font-weight="700" fill="#C24135">qφ(z | x)</text>
    <path d="M662 415 H800" stroke="#C24135" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arr2)"/>
    <text x="731" y="399" text-anchor="middle" font-size="16" fill="#C24135">近似，不是恒等</text>
    <line x1="54" y1="500" x2="1146" y2="500" stroke="#D7DEE8" stroke-width="2"/>
    <text x="54" y="542" font-size="17" fill="#1F2937">生成：z ~ p(z) → x ~ pθ(x|z)</text>
    <text x="472" y="542" font-size="17" fill="#1F2937">训练：x → qφ(z|x) → ELBO</text>
    <text x="834" y="542" font-size="17" fill="#1F2937">难点：∫ dz，而非 joint 不存在</text>
  </g>
</svg>
