<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Reverse-time SDE 的两种时钟</title>
<desc id="desc">上轨保留 t 并以负步长从噪声走向数据，下轨改用 tau 等于一减 t 并以正步长走同一方向，右侧把 drift bracket、实际位移和新的反向 Brownian motion 分开。</desc>
<rect width="1200" height="620" fill="#FFFEFB"/>
<defs><marker id="arrowB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="arrowG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker></defs>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}.red{fill:#C24135}</style>
<text x="58" y="50" font-size="20" font-weight="700" class="ink">A　先看箭头与步长，再读 drift 方括号</text>
<text x="90" y="115" font-size="18" class="muted">data</text><text x="560" y="115" font-size="18" class="muted">intermediate law p(t)</text><text x="1040" y="115" font-size="18" class="muted">noise</text>
<g stroke="#D7DEE8" stroke-width="2"><circle cx="125" cy="152" r="17" fill="#FFFFFF"/><circle cx="600" cy="152" r="17" fill="#FFFFFF"/><circle cx="1075" cy="152" r="17" fill="#FFFFFF"/></g>
<path d="M145 152H1055" stroke="#64748B" stroke-width="3" marker-end="url(#arrowB)"/><text x="600" y="187" text-anchor="middle" font-size="16" class="muted">forward: t = 0 → 1,  dX = f dt + g dW</text>
<rect x="58" y="225" width="1084" height="116" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="2"/>
<text x="80" y="257" font-size="18" font-weight="700" class="blue">记法 1　保留 t</text><path d="M1030 286H190" stroke="#2563EB" stroke-width="4" marker-end="url(#arrowB)"/><text x="610" y="278" text-anchor="middle" font-size="18" class="ink">[ f - g^2 score ] dt + g dW_bar</text><text x="610" y="319" text-anchor="middle" font-size="16" class="red">t: 1 → 0，所以 dt &lt; 0</text>
<rect x="58" y="365" width="1084" height="116" fill="#F2FBF8" stroke="#D7DEE8" stroke-width="2"/>
<text x="80" y="397" font-size="18" font-weight="700" class="green">记法 2　tau = 1 - t</text><path d="M1030 426H190" stroke="#0F766E" stroke-width="4" marker-end="url(#arrowG)"/><text x="610" y="418" text-anchor="middle" font-size="18" class="ink">[ -f + g^2 score ] d tau + g dW_tilde</text><text x="610" y="459" text-anchor="middle" font-size="16" class="green">tau: 0 → 1，所以 d tau &gt; 0</text>
<text x="58" y="525" font-size="20" font-weight="700" class="ink">B　同一实际小位移</text><text x="295" y="525" font-size="18" class="ink">[f - g^2 score] dt</text><text x="535" y="525" font-size="22" class="muted">=</text><text x="585" y="525" font-size="18" class="ink">[-f + g^2 score] d tau</text>
<path d="M58 549H1142" stroke="#D7DEE8" stroke-width="2"/>
<text x="58" y="580" font-size="15" class="muted">W_bar / W_tilde 是适应反向信息流的新 Brownian motion；不是把保存下来的 forward noise 逐项取负。</text>
</svg>
