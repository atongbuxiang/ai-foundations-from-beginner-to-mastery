<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">离散扩散中的概率核一致性、信息耦合与学习门</title><desc id="desc">展示当前边缘通过条件核推送到前一边缘的积分约束，并比较忽略当前状态的独立核与相关核，最后区分合法性、信息性和可学习性。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}.amber{fill:#B7791F}.red{fill:#C24135}</style>
<text x="54" y="52" font-size="23" font-weight="700" class="ink">统一离散扩散的三道门：合法 coupling、有效信息、可学 reverse</text>
<rect x="55" y="95" width="1090" height="94" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="190" y="128" text-anchor="middle" font-size="17" font-weight="700" class="blue">当前边缘</text><text x="190" y="160" text-anchor="middle" font-size="17" class="ink">q_t(dx_t | x_0)</text><path d="M300 143H445" stroke="#2563EB" stroke-width="4"/><polygon points="445,143 426,133 426,153" fill="#2563EB"/><text x="372" y="126" text-anchor="middle" font-size="15" class="muted">r_t(dx_(t−1) | x_t,x_0)</text><text x="600" y="128" text-anchor="middle" font-size="17" font-weight="700" class="green">push-forward / marginalize</text><text x="600" y="160" text-anchor="middle" font-size="18" class="ink">∫ r_t q_t dx_t</text><path d="M755 143H895" stroke="#0F766E" stroke-width="4"/><polygon points="895,143 876,133 876,153" fill="#0F766E"/><text x="1020" y="128" text-anchor="middle" font-size="17" font-weight="700" class="green">目标边缘</text><text x="1020" y="160" text-anchor="middle" font-size="17" class="ink">q_(t−1)(dx_(t−1) | x_0)</text>
<text x="60" y="235" font-size="18" font-weight="700" class="blue">同一一致性等式容纳许多 coupling</text><line x1="600" y1="215" x2="600" y2="455" stroke="#D7DEE8" stroke-width="2"/>
<rect x="70" y="260" width="480" height="174" rx="10" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="310" y="294" text-anchor="middle" font-size="17" font-weight="700" class="amber">independent kernel：合法但忽略 x_t</text><text x="310" y="328" text-anchor="middle" font-size="17" class="ink">r_t(x_(t−1) | x_t,x_0) = q_(t−1)(x_(t−1) | x_0)</text><g fill="#B7791F"><circle cx="155" cy="372" r="10"/><circle cx="225" cy="372" r="10"/><circle cx="295" cy="372" r="10"/></g><path d="M165 372H420" stroke="#B7791F" stroke-width="2"/><polygon points="420,372 404,364 404,380" fill="#B7791F"/><circle cx="452" cy="372" r="17" fill="#FFF" stroke="#B7791F" stroke-width="3"/><text x="310" y="414" text-anchor="middle" font-size="15" class="muted">输入变化，输出 law 不变；积分仍正确</text>
<rect x="650" y="260" width="480" height="174" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="890" y="294" text-anchor="middle" font-size="17" font-weight="700" class="blue">correlated kernel：让状态携带路径信息</text><circle cx="725" cy="355" r="11" fill="#2563EB"/><circle cx="725" cy="397" r="11" fill="#2563EB"/><circle cx="1045" cy="345" r="17" fill="#FFF" stroke="#2563EB" stroke-width="3"/><circle cx="1045" cy="405" r="17" fill="#FFF" stroke="#2563EB" stroke-width="3"/><path d="M738 355C840 342 925 339 1028 345M738 397C840 410 925 412 1028 405" fill="none" stroke="#2563EB" stroke-width="3"/><text x="890" y="329" text-anchor="middle" font-size="15" class="muted">不同 x_t 对应不同 conditional law</text><text x="890" y="424" text-anchor="middle" font-size="15" class="muted">相关性不是越强越好；还要看可部署性</text>
<rect x="70" y="482" width="310" height="72" rx="9" fill="#F2FBF8" stroke="#0F766E" stroke-width="2"/><text x="225" y="511" text-anchor="middle" font-size="17" font-weight="700" class="green">门 1　概率合法</text><text x="225" y="538" text-anchor="middle" font-size="15" class="muted">积分恢复 q_(t−1)</text><path d="M380 518H435" stroke="#64748B" stroke-width="3"/><polygon points="435,518 419,510 419,526" fill="#64748B"/><rect x="435" y="482" width="310" height="72" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="590" y="511" text-anchor="middle" font-size="17" font-weight="700" class="blue">门 2　信息有效</text><text x="590" y="538" text-anchor="middle" font-size="15" class="muted">x_t 是否帮助恢复</text><path d="M745 518H800" stroke="#64748B" stroke-width="3"/><polygon points="800,518 784,510 784,526" fill="#64748B"/><rect x="800" y="482" width="330" height="72" rx="9" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="965" y="511" text-anchor="middle" font-size="17" font-weight="700" class="amber">门 3　部署可学</text><text x="965" y="538" text-anchor="middle" font-size="15" class="muted">移除 x_0 后近似 mixture reverse</text>
<line x1="54" y1="580" x2="1146" y2="580" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="607" font-size="15" class="red">通过门 1 不推出门 2 或门 3；逐步回归误差也不能脱离 metric 与 contraction 直接相加成最终分布界。</text></svg>
