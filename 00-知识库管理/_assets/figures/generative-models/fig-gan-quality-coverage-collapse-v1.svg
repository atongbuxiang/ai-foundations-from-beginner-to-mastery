<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">GAN质量覆盖平面与模式坍塌</title><desc id="desc">左侧以precision和recall形成四象限并标出高质量低覆盖的模式坍塌，右侧多个潜变量簇映射到同一输出模式。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style>
<g font-family="Inter, PingFang SC, sans-serif"><text x="54" y="54" font-size="23" font-weight="700" fill="#1F2937">“每张都很像真的”仍可能只会生成两种东西</text>
<text x="60" y="103" font-size="20" font-weight="700" fill="#2563EB">A　quality / coverage 二维账</text><rect x="80" y="140" width="455" height="340" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><line x1="307" y1="140" x2="307" y2="480" stroke="#D7DEE8" stroke-width="2"/><line x1="80" y1="310" x2="535" y2="310" stroke="#D7DEE8" stroke-width="2"/><text x="308" y="514" text-anchor="middle" font-size="16" fill="#334155">Recall / mode coverage →</text><text x="43" y="316" transform="rotate(-90 43 316)" font-size="16" fill="#334155">Precision / sample validity →</text>
<rect x="88" y="150" width="210" height="150" rx="7" fill="#FFF0EE" stroke="#C24135" stroke-width="2"/><text x="193" y="210" text-anchor="middle" font-size="20" font-weight="700" fill="#C24135">典型 mode collapse</text><text x="193" y="246" text-anchor="middle" font-size="16" fill="#334155">清晰 / 有效</text><text x="193" y="273" text-anchor="middle" font-size="16" fill="#334155">但只覆盖少数 mode</text>
<rect x="317" y="150" width="210" height="150" rx="7" fill="#E8F5F1" stroke="#0F766E" stroke-width="2"/><text x="422" y="226" text-anchor="middle" font-size="20" font-weight="700" fill="#0F766E">高质量 + 高覆盖</text>
<rect x="88" y="320" width="210" height="150" rx="7" fill="#F3F4F6"/><text x="193" y="399" text-anchor="middle" font-size="17" fill="#64748B">低质量 + 低覆盖</text><rect x="317" y="320" width="210" height="150" rx="7" fill="#FFF7E6"/><text x="422" y="399" text-anchor="middle" font-size="17" fill="#B7791F">覆盖广但无效/噪声</text>
<line x1="590" y1="90" x2="590" y2="525" stroke="#D7DEE8" stroke-width="2"/><text x="630" y="103" font-size="20" font-weight="700" fill="#B7791F">B　latent collision 机制证据</text>
<g fill="#2563EB"><circle cx="710" cy="196" r="12"/><circle cx="750" cy="178" r="12"/><circle cx="790" cy="205" r="12"/><circle cx="716" cy="327" r="12"/><circle cx="764" cy="347" r="12"/><circle cx="803" cy="315" r="12"/></g><text x="755" y="390" text-anchor="middle" font-size="16" fill="#64748B">多个 latent 区域</text>
<path d="M810 198C880 208 898 264 953 278M810 324C875 315 900 286 953 278" fill="none" stroke="#C24135" stroke-width="3"/><polygon points="953,278 938,269 938,287" fill="#C24135"/>
<ellipse cx="1042" cy="278" rx="83" ry="60" fill="#FFF0EE" stroke="#C24135" stroke-width="3"/><text x="1042" y="272" text-anchor="middle" font-size="19" font-weight="700" fill="#C24135">同一输出 mode</text><text x="1042" y="304" text-anchor="middle" font-size="16" fill="#334155">many-to-one G</text><text x="630" y="464" font-size="15" fill="#64748B">局部 Jacobian 小可提示 collision；不等于全局语义 coverage。</text><line x1="54" y1="548" x2="1146" y2="548" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="582" font-size="16" fill="#1F2937">八模态只覆盖两模态：precision 可为 1，recall 仅 0.25；单一画廊无法可靠发现。</text></g></svg>

