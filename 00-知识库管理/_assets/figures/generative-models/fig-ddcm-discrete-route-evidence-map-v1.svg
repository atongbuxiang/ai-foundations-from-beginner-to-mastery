<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs><marker id="h" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#26384d"/></marker><style>.t{font-family:Inter,'Noto Sans SC',sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.s{font-size:15px}.mut{font-size:13px;fill:#687487}.arr{stroke:#26384d;stroke-width:2;fill:none;marker-end:url(#h)}.lab{font-size:16px;font-weight:700}</style></defs>
  <rect width="1200" height="620" fill="#f5f1e8"/>
  <text x="48" y="47" class="t h">四条路线：到底离散了什么？能用什么证据说到哪一步？</text>
  <g transform="translate(48 82)">
    <rect width="1104" height="334" rx="12" fill="#fffdf8" stroke="#3f536b" stroke-width="2"/>
    <g class="t lab"><text x="24" y="38">路线</text><text x="160" y="38">被处理对象</text><text x="418" y="38">训练 / 采样路径</text><text x="790" y="38">离散输出</text><text x="944" y="38">主要误差 floor</text></g>
    <g stroke="#d0c7b7"><line x1="0" y1="55" x2="1104" y2="55"/><line x1="0" y1="124" x2="1104" y2="124"/><line x1="0" y1="193" x2="1104" y2="193"/><line x1="0" y1="262" x2="1104" y2="262"/><line x1="132" y1="0" x2="132" y2="334"/><line x1="390" y1="0" x2="390" y2="334"/><line x1="760" y1="0" x2="760" y2="334"/><line x1="920" y1="0" x2="920" y2="334"/></g>
    <g class="t s"><rect x="8" y="65" width="1080" height="48" rx="6" fill="#e9edf6"/><text x="24" y="95" font-weight="700">D3PM</text><text x="160" y="95">数据 / token state</text><text x="418" y="95">known Q_t → learned reverse transition</text><text x="790" y="95">state tokens</text><text x="944" y="95">model / schedule</text><rect x="8" y="134" width="1080" height="48" rx="6" fill="#fff1c9"/><text x="24" y="164" font-weight="700">VQ / FSQ</text><text x="160" y="164">encoder representation</text><text x="418" y="164">tokenizer → token prior → decoder</text><text x="790" y="164">spatial code grid</text><text x="944" y="164">quantization / prior</text><rect x="8" y="203" width="1080" height="48" rx="6" fill="#e2eedf"/><text x="24" y="233" font-weight="700">LDM</text><text x="160" y="233">连续压缩 latent</text><text x="418" y="233">AE → Gaussian latent diffusion → decoder</text><text x="790" y="233">continuous tensor</text><text x="944" y="233">AE floor / prior</text><rect x="8" y="272" width="1080" height="48" rx="6" fill="#f0dfdc"/><text x="24" y="302" font-weight="700">DDCM</text><text x="160" y="302">reverse noise choice</text><text x="418" y="302">pretrained DDPM + per-step finite codes</text><text x="790" y="302">temporal indices</text><text x="944" y="302">restriction / search</text></g>
  </g>
  <rect x="48" y="448" width="1104" height="116" rx="12" fill="#fffdf8" stroke="#806f56" stroke-width="2"/>
  <text x="72" y="482" class="t lab">证据梯子</text>
  <g class="t s" text-anchor="middle"><rect x="165" y="500" width="150" height="42" rx="21" fill="#dce8f3"/><text x="240" y="526">I  定义 / 恒等式</text><rect x="343" y="500" width="150" height="42" rx="21" fill="#e2eedf"/><text x="418" y="526">T  条件定理</text><rect x="521" y="500" width="150" height="42" rx="21" fill="#fff1c9"/><text x="596" y="526">E  协议实验</text><rect x="699" y="500" width="150" height="42" rx="21" fill="#f0dfdc"/><text x="774" y="526">H  机制假说</text><rect x="877" y="500" width="150" height="42" rx="21" fill="#ede8f5"/><text x="952" y="526">O  开放问题</text></g>
  <path d="M316 521H331" class="arr"/><path d="M494 521H509" class="arr"/><path d="M672 521H687" class="arr"/><path d="M850 521H865" class="arr"/>
  <text x="48" y="598" class="t s">DDCM 的 K^T 名义组合数属于 I；小 K 下 FID 保持属于 E；“天然更适合多模态 tokenizer”仍是 H/O。</text>
</svg>
