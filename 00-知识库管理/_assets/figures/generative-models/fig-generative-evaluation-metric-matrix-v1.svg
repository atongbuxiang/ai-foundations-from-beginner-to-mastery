<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs><style>.t{font-family:Inter,'Noto Sans SC',sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.s{font-size:17px}.mut{font-size:14px;fill:#647184}.grid{stroke:#c4bba8;stroke-width:1}.yes{fill:#dcebd8}.some{fill:#fff0c9}.no{fill:#f4dddd}</style></defs>
  <rect width="1200" height="620" fill="#f4f0e6"/><text x="54" y="52" class="t h">生成评价：指标看见的维度与盲区</text><line x1="54" y1="72" x2="1146" y2="72" stroke="#c7bda9"/>
  <rect x="54" y="105" width="1092" height="410" rx="12" fill="#fffdf7" stroke="#26364a" stroke-width="2"/>
