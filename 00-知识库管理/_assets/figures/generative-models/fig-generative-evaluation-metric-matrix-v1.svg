  <rect x="54" y="568" width="1092" height="38" rx="8" fill="#fff8de" stroke="#c7a84d"/><text x="77" y="593" class="t s">结论必须来自互补面板：固定 encoder/预处理/样本数，报告区间，并保留条件性、复制与成本审计。</text>
