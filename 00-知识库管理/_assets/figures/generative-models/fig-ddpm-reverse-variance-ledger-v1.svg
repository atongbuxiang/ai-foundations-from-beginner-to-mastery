<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">DDPM 反向方差的条件对象与误差总账</title><desc id="desc">从前向方差、知道原始数据的后验方差，到只知道当前状态的模型方差，展示最优高斯方差中的不可约条件方差、均值误差和估计误差。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}.amber{fill:#B7791F}.red{fill:#C24135}</style>
<text x="54" y="52" font-size="23" font-weight="700" class="ink">Reverse variance：先问“条件给了什么”，再问“补的是哪一笔误差”</text>
<text x="64" y="104" font-size="18" font-weight="700" class="blue">三个不同的条件对象</text><line x1="54" y1="122" x2="1146" y2="122" stroke="#D7DEE8" stroke-width="2"/>
<rect x="65" y="150" width="285" height="112" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="207" y="184" text-anchor="middle" font-size="17" font-weight="700" class="blue">forward noise</text><text x="207" y="217" text-anchor="middle" font-size="17" class="ink">q(x_t | x_(t−1))</text><text x="207" y="245" text-anchor="middle" font-size="16" class="muted">variance = beta_t</text>
<path d="M350 206H425" stroke="#64748B" stroke-width="3"/><polygon points="425,206 408,197 408,215" fill="#64748B"/><text x="388" y="189" text-anchor="middle" font-size="15" class="muted">加上 x_0</text>
<rect x="425" y="150" width="310" height="112" rx="10" fill="#F2FBF8" stroke="#0F766E" stroke-width="2"/><text x="580" y="184" text-anchor="middle" font-size="17" font-weight="700" class="green">closed posterior</text><text x="580" y="217" text-anchor="middle" font-size="17" class="ink">q(x_(t−1) | x_t, x_0)</text><text x="580" y="245" text-anchor="middle" font-size="16" class="muted">variance = beta_tilde_t</text>
<path d="M735 206H810" stroke="#64748B" stroke-width="3"/><polygon points="810,206 793,197 793,215" fill="#64748B"/><text x="772" y="189" text-anchor="middle" font-size="15" class="red">移除 x_0</text>
<rect x="810" y="150" width="325" height="112" rx="10" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="972" y="184" text-anchor="middle" font-size="17" font-weight="700" class="amber">learned reverse</text><text x="972" y="217" text-anchor="middle" font-size="17" class="ink">pθ(x_(t−1) | x_t)</text><text x="972" y="245" text-anchor="middle" font-size="16" class="muted">variance = sigma²_theta,t(x_t)</text>
<text x="64" y="319" font-size="18" font-weight="700" class="green">给定模型均值 μθ，Gaussian NLL 的最优 isotropic variance</text>
<rect x="65" y="345" width="1070" height="92" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="600" y="381" text-anchor="middle" font-size="20" class="ink">s²* = (1/d) E[‖X_(t−1) − μθ(x_t)‖² | x_t]</text><text x="600" y="416" text-anchor="middle" font-size="19" class="green">= tr Cov(X_(t−1) | x_t)/d　+　‖E[X_(t−1)|x_t] − μθ(x_t)‖²/d</text>
<path d="M315 437V472" stroke="#0F766E" stroke-width="3"/><polygon points="315,472 306,456 324,456" fill="#0F766E"/><path d="M785 437V472" stroke="#C24135" stroke-width="3"/><polygon points="785,472 776,456 794,456" fill="#C24135"/>
<text x="315" y="503" text-anchor="middle" font-size="17" font-weight="700" class="green">不可约 conditional variance</text><text x="785" y="503" text-anchor="middle" font-size="17" font-weight="700" class="red">model mean error</text><text x="315" y="531" text-anchor="middle" font-size="15" class="muted">条件减少后留下的 mixture uncertainty</text><text x="785" y="531" text-anchor="middle" font-size="15" class="muted">增大 variance 只减轻过度自信，不修正均值</text>
<line x1="54" y1="558" x2="1146" y2="558" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="591" font-size="15" class="muted">Analytic-DPM 还需分开：理想 score identity → finite-network approximation → Monte Carlo estimate → clipping/bound → empirical metric。</text></svg>
