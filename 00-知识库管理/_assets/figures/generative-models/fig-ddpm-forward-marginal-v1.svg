<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">DDPM 前向链与闭式边缘</title><desc id="desc">上方展示逐步 Gaussian Markov 加噪，下方展示累计系数把任意时刻样本一次生成，并区分 joint path 与 conditional marginal。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}</style>
<text x="54" y="52" font-size="23" font-weight="700" class="ink">逐步加噪定义 joint path；闭式公式让训练一次抽到任意 x(t)</text><text x="58" y="98" font-size="19" font-weight="700" class="blue">A　固定 Gaussian Markov chain</text><rect x="55" y="118" width="1090" height="180" rx="12" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="2"/>
<g fill="#FFFFFF" stroke="#2563EB" stroke-width="2"><circle cx="145" cy="205" r="40"/><circle cx="365" cy="205" r="40"/><circle cx="585" cy="205" r="40"/><circle cx="805" cy="205" r="40"/><circle cx="1045" cy="205" r="40"/></g><text x="145" y="212" text-anchor="middle" font-size="19" class="ink">x(0)</text><text x="365" y="212" text-anchor="middle" font-size="19" class="ink">x(1)</text><text x="585" y="212" text-anchor="middle" font-size="19" class="ink">x(2)</text><text x="805" y="212" text-anchor="middle" font-size="19" class="ink">…</text><text x="1045" y="212" text-anchor="middle" font-size="19" class="ink">x(T)</text>
<g stroke="#2563EB" stroke-width="3"><path d="M185 205H325"/><path d="M405 205H545"/><path d="M625 205H765"/><path d="M845 205H1005"/></g><g fill="#2563EB"><polygon points="325,205 309,196 309,214"/><polygon points="545,205 529,196 529,214"/><polygon points="765,205 749,196 749,214"/><polygon points="1005,205 989,196 989,214"/></g><text x="255" y="175" text-anchor="middle" font-size="15" class="muted">√α₁ x + √β₁ ε₁</text><text x="475" y="175" text-anchor="middle" font-size="15" class="muted">√α₂ x + √β₂ ε₂</text><text x="935" y="175" text-anchor="middle" font-size="15" class="muted">逐步忘记 data</text>
<text x="58" y="348" font-size="19" font-weight="700" class="green">B　给定 x(0) 的闭式 conditional marginal</text><rect x="55" y="368" width="1090" height="170" rx="12" fill="#F2FBF8" stroke="#D7DEE8" stroke-width="2"/><rect x="90" y="410" width="170" height="76" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="175" y="442" text-anchor="middle" font-size="18" class="ink">x(0), t, ε</text><text x="175" y="470" text-anchor="middle" font-size="15" class="muted">ε ~ N(0,I)</text><path d="M260 448H390" stroke="#0F766E" stroke-width="3"/><polygon points="390,448 374,439 374,457" fill="#0F766E"/><rect x="390" y="402" width="500" height="92" rx="8" fill="#E8F5F1" stroke="#0F766E" stroke-width="2"/><text x="640" y="438" text-anchor="middle" font-size="20" font-weight="700" class="green">x(t)=√ᾱ(t) x(0)+√(1−ᾱ(t)) ε</text><text x="640" y="472" text-anchor="middle" font-size="16" class="ink">ᾱ(t)=∏s≤t α(s)</text><path d="M890 448H960" stroke="#0F766E" stroke-width="3"/><polygon points="960,448 944,439 944,457" fill="#0F766E"/><text x="1040" y="437" text-anchor="middle" font-size="17" class="ink">一次 network</text><text x="1040" y="469" text-anchor="middle" font-size="15" class="muted">无需模拟 1…t−1</text>
<line x1="54" y1="565" x2="1146" y2="565" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="595" font-size="15" class="muted">同一 marginal 分布 ≠ 同一逐步噪声 realization；闭式捷径没有删除训练推导所依赖的 joint Markov 结构。</text></svg>
