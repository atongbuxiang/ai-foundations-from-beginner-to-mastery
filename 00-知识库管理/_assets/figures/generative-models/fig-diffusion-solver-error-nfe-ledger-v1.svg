<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#26364a"/></marker><style>.t{font-family:Inter,'Noto Sans SC',sans-serif;fill:#172033}.h{font-size:26px;font-weight:700}.s{font-size:18px}.m{font-family:'IBM Plex Mono',monospace;font-size:16px;fill:#233a59}.mut{font-size:15px;fill:#647184}.box{fill:#fffdf7;stroke:#26364a;stroke-width:2}.arr{stroke:#26364a;stroke-width:2.2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="620" fill="#f4f0e6"/><text x="54" y="52" class="t h">Diffusion Solver：误差链与 NFE 账本</text><line x1="54" y1="72" x2="1146" y2="72" stroke="#c7bda9"/>
  <g class="t"><rect x="55" y="110" width="210" height="110" rx="10" fill="#e4f0e2" stroke="#608459" stroke-width="2"/><text x="80" y="147" class="s">目标 dynamics</text><text x="80" y="180" class="m">dx/dt = v(x,t)</text><text x="80" y="205" class="mut">真实 transport</text>
  <rect x="335" y="110" width="210" height="110" rx="10" fill="#e7eef8" stroke="#56769a" stroke-width="2"/><text x="360" y="147" class="s">learned field</text><text x="360" y="180" class="m">v_theta = v + e</text><text x="360" y="205" class="mut">model error</text>
  <rect x="615" y="110" width="210" height="110" rx="10" fill="#f8e6df" stroke="#b7654c" stroke-width="2"/><text x="640" y="147" class="s">finite solver</text><text x="640" y="180" class="m">x_hat on grid</text><text x="640" y="205" class="mut">discretization / roundoff</text>
  <rect x="895" y="110" width="250" height="110" rx="10" fill="#fff3cf" stroke="#aa8830" stroke-width="2"/><text x="920" y="147" class="s">metric estimate</text><text x="920" y="180" class="m">FID / KID / human</text><text x="920" y="205" class="mut">finite sample / protocol</text></g>
  <path d="M266 165 H323" class="arr"/><path d="M546 165 H603" class="arr"/><path d="M826 165 H883" class="arr"/>
  <rect x="55" y="265" width="1090" height="230" rx="12" class="box"/><text x="80" y="304" class="t h" font-size="21">同一 NFE 预算下比较</text>
  <g class="t s"><text x="95" y="355">Euler</text><text x="95" y="405">Heun</text><text x="95" y="455">Multistep</text></g>
  <g fill="#426f9e"><circle cx="250" cy="350" r="10"/><circle cx="330" cy="350" r="10"/><circle cx="410" cy="350" r="10"/><circle cx="490" cy="350" r="10"/><circle cx="570" cy="350" r="10"/><circle cx="650" cy="350" r="10"/><circle cx="730" cy="350" r="10"/><circle cx="810" cy="350" r="10"/></g>
  <g fill="#4f8051"><circle cx="250" cy="400" r="10"/><circle cx="410" cy="400" r="10"/><circle cx="570" cy="400" r="10"/><circle cx="730" cy="400" r="10"/></g><text x="810" y="407" class="t mut">2 eval / step</text>
  <g fill="#d46b45"><circle cx="250" cy="450" r="10"/><circle cx="330" cy="450" r="10"/><circle cx="410" cy="450" r="10"/><circle cx="490" cy="450" r="10"/><circle cx="570" cy="450" r="10"/><circle cx="650" cy="450" r="10"/><circle cx="730" cy="450" r="10"/><circle cx="810" cy="450" r="10"/></g><text x="825" y="457" class="t mut">warm-up / history</text>
  <text x="1005" y="355" class="m">global O(h)</text><text x="1005" y="405" class="m">global O(h^2)</text><text x="1005" y="455" class="m">order + stability</text>
  <rect x="55" y="528" width="1090" height="56" rx="8" fill="#fff8de" stroke="#c7a84d"/><text x="78" y="562" class="t s">高阶只直接缩小离散误差；field error、guidance shift、terminal mismatch 与 evaluator uncertainty 另记。</text>
</svg>
