<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Rectified Flow 与 ReFlow 的配对更新和直化</title>
<desc id="desc">左侧显示初始直线监督之间的交叉，中间显示回归场产生弯曲的确定性 coupling，右侧用新端点配对重新画直线并比较一步和多步数值误差。</desc>
<rect width="1200" height="620" fill="#FFFEFB"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker></defs>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}.red{fill:#C24135}.amber{fill:#B7791F}.curve{fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
<text x="58" y="48" font-size="20" font-weight="700" class="ink">ReFlow 改变 pairing，再定义下一轮直线监督</text>
<g stroke="#D7DEE8" stroke-width="2"><line x1="390" y1="80" x2="390" y2="510"/><line x1="790" y1="80" x2="790" y2="510"/></g>
<g font-size="18" font-weight="700"><text x="70" y="95" class="red">1　initial straight targets</text><text x="425" y="95" class="blue">2　learned deterministic flow</text><text x="825" y="95" class="green">3　new pairs, retrain straight</text></g>
<g fill="#FFFFFF" stroke="#1F2937" stroke-width="2"><circle cx="95" cy="170" r="10"/><circle cx="95" cy="420" r="10"/><circle cx="350" cy="195" r="10"/><circle cx="350" cy="395" r="10"/></g>
<path d="M110 170L335 395" stroke="#C24135" stroke-width="3.5"/><path d="M110 420L335 195" stroke="#C24135" stroke-width="3.5"/><text x="105" y="465" font-size="15" class="red">teacher segments are straight</text><text x="105" y="490" font-size="15" class="muted">but local targets conflict</text>
<g fill="#FFFFFF" stroke="#1F2937" stroke-width="2"><circle cx="435" cy="170" r="10"/><circle cx="435" cy="420" r="10"/><circle cx="750" cy="195" r="10"/><circle cx="750" cy="395" r="10"/></g>
<path d="M435 170 C525 260 640 125 750 195" class="curve" stroke="#2563EB" stroke-width="4"/><path d="M435 420 C525 330 640 465 750 395" class="curve" stroke="#2563EB" stroke-width="4"/><text x="445" y="465" font-size="15" class="blue">ODE trajectories induce new pairs</text><text x="445" y="490" font-size="15" class="muted">unique flow paths do not cross at equal time</text>
<g fill="#FFFFFF" stroke="#1F2937" stroke-width="2"><circle cx="835" cy="170" r="10"/><circle cx="835" cy="420" r="10"/><circle cx="1100" cy="195" r="10"/><circle cx="1100" cy="395" r="10"/></g>
<path d="M850 170L1085 195" stroke="#0F766E" stroke-width="4"/><path d="M850 420L1085 395" stroke="#0F766E" stroke-width="4"/><text x="840" y="465" font-size="15" class="green">less crossing is a target</text><text x="840" y="490" font-size="15" class="muted">not an automatic finite-model theorem</text>
<path d="M370 300H410" stroke="#1F2937" stroke-width="3" marker-end="url(#arrow)"/><path d="M770 300H810" stroke="#1F2937" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="58" y1="530" x2="1142" y2="530" stroke="#D7DEE8" stroke-width="2"/>
<text x="58" y="563" font-size="16" class="ink">直化验收：</text><text x="152" y="563" font-size="16" class="green">path-length ratio</text><text x="320" y="563" font-size="16" class="ink">+</text><text x="350" y="563" font-size="16" class="green">material acceleration</text><text x="548" y="563" font-size="16" class="ink">+</text><text x="578" y="563" font-size="16" class="green">1 / 2 / 4 / 8-step endpoint error</text>
<text x="58" y="596" font-size="15" class="muted">“conditional line is straight”属于训练构造；“model path is straight”属于动力学；“one Euler step is accurate”属于数值实验。</text>
</svg>
