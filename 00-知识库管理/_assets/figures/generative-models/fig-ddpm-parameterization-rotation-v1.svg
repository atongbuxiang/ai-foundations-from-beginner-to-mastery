<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">扩散数据噪声速度与 score 参数化</title><desc id="desc">左侧展示数据和噪声到带噪状态和速度的正交旋转，右侧区分逐样本 conditional noise target 与条件期望后的 marginal score。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}</style>
<text x="54" y="52" font-size="23" font-weight="700" class="ink">代数换算是逐样本恒等；marginal score 还要经过条件期望</text><text x="58" y="98" font-size="19" font-weight="700" class="blue">A　VP 参数化的正交旋转</text><rect x="55" y="118" width="650" height="382" rx="12" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="2"/>
<rect x="85" y="170" width="150" height="70" rx="8" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="160" y="212" text-anchor="middle" font-size="19" class="ink">x(0)</text><rect x="85" y="330" width="150" height="70" rx="8" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="160" y="372" text-anchor="middle" font-size="19" class="ink">ε</text><path d="M235 205H360M235 365H360" stroke="#334155" stroke-width="3"/><polygon points="360,205 344,196 344,214" fill="#334155"/><polygon points="360,365 344,356 344,374" fill="#334155"/><rect x="360" y="180" width="285" height="210" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text x="502" y="220" text-anchor="middle" font-size="18" font-weight="700" class="ink">[ x(t) ]   [ a   σ ] [ x(0) ]</text><text x="502" y="260" text-anchor="middle" font-size="18" font-weight="700" class="ink">[  v   ] = [−σ   a ] [  ε   ]</text><text x="502" y="310" text-anchor="middle" font-size="16" class="green">a²+σ²=1 → orthogonal</text><text x="502" y="350" text-anchor="middle" font-size="16" class="ink">x(0)=a x(t)−σ v</text><text x="502" y="378" text-anchor="middle" font-size="16" class="ink">ε=σ x(t)+a v</text><text x="380" y="458" font-size="15" fill="#C24135">端点小分母：x(0)=(x(t)−σε̂)/a；ε=(x(t)−ax̂(0))/σ</text>
<text x="750" y="98" font-size="19" font-weight="700" class="green">B　从 DSM target 到 marginal score</text><rect x="740" y="118" width="405" height="382" rx="12" fill="#F2FBF8" stroke="#D7DEE8" stroke-width="2"/>
<rect x="775" y="165" width="335" height="74" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="942" y="195" text-anchor="middle" font-size="17" class="ink">单训练 pair 的 conditional target</text><text x="942" y="223" text-anchor="middle" font-size="18" class="green">∇ log q(x(t)|x(0)) = −ε/σ</text><path d="M942 239V295" stroke="#B7791F" stroke-width="3" stroke-dasharray="7 6"/><polygon points="942,295 933,279 951,279" fill="#B7791F"/><text x="975" y="270" font-size="15" fill="#B7791F">E[ · | x(t)]</text><rect x="775" y="295" width="335" height="74" rx="8" fill="#E8F5F1" stroke="#0F766E" stroke-width="2"/><text x="942" y="325" text-anchor="middle" font-size="17" class="ink">marginal score</text><text x="942" y="353" text-anchor="middle" font-size="18" class="green">s*(x(t),t)=−E[ε|x(t)]/σ</text><text x="942" y="420" text-anchor="middle" font-size="15" class="muted">逐样本 noise ≠ marginal score</text><text x="942" y="455" text-anchor="middle" font-size="15" fill="#C24135">loss weight 决定有限网络如何折中各 t</text>
<line x1="54" y1="540" x2="1146" y2="540" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="580" font-size="16" class="muted">相同 Bayes optimum 不保证相同 gradient、conditioning、clipping 后输出或有限容量训练轨迹。</text></svg>
