<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">从能量函数到归一化密度和有限步样本</title><desc id="desc">三栏图分别展示能量地形、配分函数归一化以及有限步马尔可夫链输出，强调三者不是同一对象。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style><g>
<text x="54" y="52" font-size="23" font-weight="700" fill="#1F2937">一个标量网络成为生成模型，要连续通过三道门</text>
<text x="58" y="96" font-size="19" font-weight="700" fill="#2563EB">A　局部能量地形</text><rect x="55" y="115" width="330" height="360" rx="10" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="2"/>
<path d="M82 205 C130 218 140 398 205 398 C270 398 276 218 350 205" fill="none" stroke="#2563EB" stroke-width="4"/><circle cx="205" cy="398" r="8" fill="#2563EB"/><text x="205" y="378" text-anchor="middle" font-size="15" fill="#2563EB">低能</text><line x1="104" y1="426" x2="335" y2="426" stroke="#64748B" stroke-width="2"/><text x="220" y="456" text-anchor="middle" font-size="15" fill="#64748B">E(x) 给相对排序；E+c 给同一密度</text>
<path d="M390 290H438" stroke="#334155" stroke-width="3"/><polygon points="438,290 424,282 424,298" fill="#334155"/><text x="414" y="270" text-anchor="middle" font-size="14" fill="#64748B">积分</text>
<text x="455" y="96" font-size="19" font-weight="700" fill="#0F766E">B　概率合法性与归一化</text><rect x="450" y="115" width="330" height="360" rx="10" fill="#F2FBF8" stroke="#0F766E" stroke-width="2"/><text x="615" y="180" text-anchor="middle" font-size="21" fill="#1F2937">Z = ∫ exp(−E(x)) dν(x)</text><rect x="490" y="220" width="250" height="72" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="615" y="250" text-anchor="middle" font-size="16" fill="#0F766E">0 &lt; Z &lt; ∞ ?</text><text x="615" y="278" text-anchor="middle" font-size="15" fill="#64748B">基准测度 ν 是否已声明？</text><text x="615" y="340" text-anchor="middle" font-size="21" font-weight="700" fill="#0F766E">p(x)=exp(−E(x))/Z</text><text x="615" y="390" text-anchor="middle" font-size="15" fill="#64748B">只有此处才得到 normalized density</text><text x="615" y="435" text-anchor="middle" font-size="15" fill="#C24135">Z 难算 ≠ Z 可以删掉</text>
<path d="M785 290H833" stroke="#334155" stroke-width="3"/><polygon points="833,290 819,282 819,298" fill="#334155"/><text x="809" y="270" text-anchor="middle" font-size="14" fill="#64748B">采样</text>
<text x="850" y="96" font-size="19" font-weight="700" fill="#B7791F">C　有限步部署分布</text><rect x="845" y="115" width="300" height="360" rx="10" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><circle cx="900" cy="198" r="11" fill="#64748B"/><circle cx="954" cy="248" r="11" fill="#64748B"/><circle cx="1002" cy="205" r="11" fill="#64748B"/><circle cx="1050" cy="300" r="11" fill="#64748B"/><circle cx="1092" cy="230" r="11" fill="#C24135"/><path d="M910 202L944 240M965 241L992 212M1010 215L1042 289M1060 291L1084 240" fill="none" stroke="#B7791F" stroke-width="3"/><text x="995" y="350" text-anchor="middle" font-size="18" fill="#1F2937">X<tspan baseline-shift="sub" font-size="13">K</tspan> ∼ μ<tspan baseline-shift="sub" font-size="13">0</tspan>K<tspan baseline-shift="super" font-size="13">K</tspan></text><text x="995" y="388" text-anchor="middle" font-size="15" fill="#64748B">通常不是 iid p(x)</text><text x="995" y="424" text-anchor="middle" font-size="15" fill="#C24135">还欠步长、混合、温度、NFE</text>
<line x1="54" y1="520" x2="1146" y2="520" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="556" font-size="16" fill="#1F2937">relative energy 易算；normalized likelihood、invariant law 与 finite-budget output 必须分别验收。</text><text x="54" y="584" font-size="15" fill="#64748B">反例：E(x)=−x² 时 Z=∞；即使连续 Langevin 正确，粗步长 ULA 仍可能有偏或失稳。</text>
</g></svg>
