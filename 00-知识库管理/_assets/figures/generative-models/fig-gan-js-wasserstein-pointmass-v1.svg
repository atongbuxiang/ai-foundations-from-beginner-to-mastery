<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">点质量下JS与Wasserstein一距离</title><desc id="desc">左侧显示固定在零和移动到theta的两个点质量，右侧曲线显示JS在非零theta为常数而Wasserstein一等于绝对值theta。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style>
<g font-family="Inter, PingFang SC, sans-serif"><text x="54" y="54" font-size="23" font-weight="700" fill="#1F2937">点质量靠得再近，只要未重合，JS 仍饱和；W₁ 读取空间距离</text>
<text x="60" y="103" font-size="20" font-weight="700" fill="#2563EB">A　P=δ0，Qθ=δθ</text><line x1="85" y1="300" x2="520" y2="300" stroke="#334155" stroke-width="3"/><circle cx="190" cy="300" r="17" fill="#2563EB"/><circle cx="430" cy="300" r="17" fill="#C24135"/><text x="190" y="348" text-anchor="middle" font-size="17" fill="#2563EB">0</text><text x="430" y="348" text-anchor="middle" font-size="17" fill="#C24135">θ</text><path d="M210 260H410" stroke="#B7791F" stroke-width="3"/><text x="310" y="244" text-anchor="middle" font-size="17" fill="#B7791F">运输成本 |θ|</text><text x="85" y="410" font-size="16" fill="#64748B">唯一 coupling 把单位质量从 0 搬到 θ。</text>
<line x1="590" y1="90" x2="590" y2="520" stroke="#D7DEE8" stroke-width="2"/><text x="630" y="103" font-size="20" font-weight="700" fill="#0F766E">B　θ → 0 的两条曲线</text><line x1="680" y1="445" x2="1125" y2="445" stroke="#334155" stroke-width="2"/><line x1="900" y1="445" x2="900" y2="145" stroke="#334155" stroke-width="2"/><text x="1118" y="472" font-size="16" fill="#334155">θ</text>
<path d="M690 180H891M909 180H1115" fill="none" stroke="#C24135" stroke-width="4"/><circle cx="900" cy="445" r="7" fill="#C24135"/><text x="1020" y="166" font-size="17" font-weight="700" fill="#C24135">JS=log 2（θ≠0）</text>
<path d="M690 180L900 445L1115 180" fill="none" stroke="#0F766E" stroke-width="4"/><text x="1018" y="335" font-size="17" font-weight="700" fill="#0F766E">W₁=|θ|</text><text x="650" y="505" font-size="15" fill="#64748B">JS 在 θ=0 跳变；W₁ 连续但仍可能不可微。</text><line x1="54" y1="548" x2="1146" y2="548" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="582" font-size="16" fill="#1F2937">这证明 topology 不同；不证明有限 neural critic、经验 OT 或交替 WGAN 自动稳定。</text></g></svg>

