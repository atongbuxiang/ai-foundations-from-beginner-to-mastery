<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">连续正规化流的轨迹密度与数值误差</title><desc id="desc">上方展示概率质量沿 ODE 轨迹变化，下方将理论散度、Hutchinson 随机迹和有限容差 ODE 求解分开。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}</style>
<text x="54" y="52" font-size="23" font-weight="700" class="ink">沿同一条 ODE 轨迹，同时积分状态与 log-density</text><rect x="55" y="88" width="1090" height="220" rx="12" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="2"/>
<ellipse cx="145" cy="196" rx="65" ry="82" fill="#EEF3FF" stroke="#2563EB" stroke-width="3"/><text x="145" y="190" text-anchor="middle" font-size="18" class="ink">z(t₀)</text><text x="145" y="220" text-anchor="middle" font-size="15" class="muted">base density</text>
<path d="M220 198 C365 110 500 270 650 190 C790 115 905 245 1020 190" fill="none" stroke="#2563EB" stroke-width="4"/><polygon points="1020,190 1002,181 1004,201" fill="#2563EB"/><text x="595" y="130" text-anchor="middle" font-size="18" font-weight="700" class="blue">dz/dt=fθ(z,t)</text><ellipse cx="1060" cy="196" rx="62" ry="42" fill="#E8F5F1" stroke="#0F766E" stroke-width="3"/><text x="1060" y="202" text-anchor="middle" font-size="18" class="ink">z(t₁)</text>
<text x="595" y="265" text-anchor="middle" font-size="19" font-weight="700" class="green">log p(t₁)=log p(t₀)−∫ div f(z(t),t) dt</text>
<text x="58" y="352" font-size="19" font-weight="700" class="green">理论恒等式</text><text x="430" y="352" font-size="19" font-weight="700" fill="#B7791F">随机迹近似</text><text x="805" y="352" font-size="19" font-weight="700" class="blue">数值轨迹近似</text>
<rect x="55" y="372" width="330" height="150" rx="12" fill="#F2FBF8" stroke="#0F766E" stroke-width="2"/><text x="220" y="414" text-anchor="middle" font-size="18" class="ink">d log p / dt = −tr(Jf)</text><text x="220" y="456" text-anchor="middle" font-size="16" class="muted">存在唯一性 → exact flow 双射</text><text x="220" y="492" text-anchor="middle" font-size="15" class="green">对象：连续方程的精确解</text>
<rect x="420" y="372" width="330" height="150" rx="12" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="585" y="414" text-anchor="middle" font-size="18" class="ink">tr(Jf)=Ev[vᵀJfv]</text><text x="585" y="456" text-anchor="middle" font-size="16" class="muted">有限 probes → sampling variance</text><text x="585" y="492" text-anchor="middle" font-size="15" fill="#B7791F">条件无偏只针对固定 Jacobian</text>
<rect x="785" y="372" width="360" height="150" rx="12" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="965" y="414" text-anchor="middle" font-size="18" class="ink">adaptive ODE solver</text><text x="965" y="456" text-anchor="middle" font-size="16" class="muted">rtol / atol / NFE / stiffness</text><text x="965" y="492" text-anchor="middle" font-size="15" fill="#C24135">有限容差 → state 与 integral error</text>
<line x1="54" y1="550" x2="1146" y2="550" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="586" font-size="16" class="muted">“一次 ODE forward”通常包含多次 vector-field evaluation；continuous adjoint 与离散程序梯度也需单独审计。</text>
</svg>
