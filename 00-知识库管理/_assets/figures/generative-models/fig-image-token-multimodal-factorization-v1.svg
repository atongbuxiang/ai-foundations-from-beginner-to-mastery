<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#26384d"/></marker><style>.t{font-family:Inter,'Noto Sans SC',sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.s{font-size:16px}.mut{font-size:14px;fill:#687487}.arr{stroke:#26384d;stroke-width:2.1;fill:none;marker-end:url(#g)}.token{stroke:#5d6b7c;stroke-width:1.5}</style></defs>
  <rect width="1200" height="620" fill="#f4f0e7"/>
  <text x="48" y="48" class="t h">同一图像 token grid，四种不同的概率与采样接口</text>
  <rect x="48" y="82" width="210" height="230" rx="12" fill="#fffdf8" stroke="#3f536b" stroke-width="2"/>
  <text x="70" y="116" class="t h" font-size="18">Tokenizer output</text>
  <g transform="translate(77 142)" class="token"><rect width="45" height="45" fill="#dce8f3"/><rect x="50" width="45" height="45" fill="#fff1c9"/><rect x="100" width="45" height="45" fill="#e2eedf"/><rect y="50" width="45" height="45" fill="#f0dfdc"/><rect x="50" y="50" width="45" height="45" fill="#e9edf6"/><rect x="100" y="50" width="45" height="45" fill="#dce8f3"/><rect y="100" width="45" height="45" fill="#fff1c9"/><rect x="50" y="100" width="45" height="45" fill="#e2eedf"/><rect x="100" y="100" width="45" height="45" fill="#f0dfdc"/></g>
  <text x="70" y="299" class="t mut">h × w indices；尚未定义 prior</text>
  <path d="M259 198H304" class="arr"/>
  <rect x="316" y="82" width="836" height="230" rx="12" fill="#fffdf8" stroke="#806f56" stroke-width="2"/>
  <g class="t"><text x="340" y="116" class="h" font-size="18">A  Raster AR</text><text x="555" y="116" class="h" font-size="18">B  Masked refinement</text><text x="815" y="116" class="h" font-size="18">C  Discrete diffusion</text><text x="1034" y="116" class="h" font-size="18">D  Conditional joint</text></g>
  <g font-family="monospace" font-size="18"><text x="340" y="160">1 → 2 → 3</text><text x="340" y="190">↓   ↓   ↓</text><text x="340" y="220">4 → 5 → 6</text><text x="340" y="255">p(k_r | k_&lt;r)</text><text x="555" y="160">A  M  B</text><text x="555" y="190">M  C  M</text><text x="555" y="220">D  M  E</text><text x="555" y="255">parallel + re-mask</text><text x="815" y="160">k0 → k1 → ... → kT</text><text x="815" y="195">known Q_t</text><text x="815" y="230">learn reverse</text><text x="815" y="265">time / schedule</text></g>
  <g class="t s"><rect x="1022" y="145" width="108" height="38" rx="6" fill="#e9edf6" stroke="#526f9b"/><text x="1076" y="170" text-anchor="middle">text y</text><rect x="1022" y="213" width="108" height="38" rx="6" fill="#fff1c9" stroke="#a98027"/><text x="1076" y="238" text-anchor="middle">image k</text><path d="M1076 184V201" class="arr"/><text x="952" y="290" class="mut">p(k|y), p(y|k), interleaved</text></g>
  <rect x="48" y="347" width="1104" height="204" rx="12" fill="#fffdf8" stroke="#3e536b" stroke-width="2"/>
  <text x="72" y="383" class="t h" font-size="18">统一 Transformer 前必须写清的合同</text>
  <g class="t s"><rect x="76" y="411" width="190" height="96" rx="8" fill="#dce8f3"/><text x="94" y="443" font-weight="700">Vocabulary / type</text><text x="94" y="472" class="mut">共享还是分区？</text><text x="94" y="494" class="mut">token ID 不等于语义对齐</text><rect x="286" y="411" width="190" height="96" rx="8" fill="#e2eedf"/><text x="304" y="443" font-weight="700">Position</text><text x="304" y="472" class="mut">text 1D / image 2D</text><text x="304" y="494" class="mut">ordering 改条件难度</text><rect x="496" y="411" width="190" height="96" rx="8" fill="#fff1c9"/><text x="514" y="443" font-weight="700">Attention mask</text><text x="514" y="472" class="mut">谁能看谁？</text><text x="514" y="494" class="mut">方向决定任务接口</text><rect x="706" y="411" width="190" height="96" rx="8" fill="#f0dfdc"/><text x="724" y="443" font-weight="700">Loss weighting</text><text x="724" y="472" class="mut">text / image 尺度</text><text x="724" y="494" class="mut">不能只按 token 数平均</text><rect x="916" y="411" width="206" height="96" rx="8" fill="#e9edf6"/><text x="934" y="443" font-weight="700">Evaluation</text><text x="934" y="472" class="mut">tokenizer / prior / alignment</text><text x="934" y="494" class="mut">/ system 四层分账</text></g>
  <text x="48" y="591" class="t s">Chain rule 是恒等式；ordering、并行因子化和跨模态对齐的优劣是模型与实验问题。</text>
</svg>
