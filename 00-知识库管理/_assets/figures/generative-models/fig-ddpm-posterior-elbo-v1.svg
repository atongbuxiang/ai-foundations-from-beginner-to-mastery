<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">DDPM posterior teacher 与 ELBO 分解</title><desc id="desc">图从数据和带噪状态得到闭式 posterior teacher，与 learned reverse Gaussian 比较，并列出 terminal KL、逐步 KL 与 reconstruction。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}</style>
<text x="54" y="52" font-size="23" font-weight="700" class="ink">训练时 x(0) 构造 posterior teacher；生成时模型只能看 x(t), t</text><line x1="400" y1="88" x2="400" y2="510" stroke="#D7DEE8" stroke-width="2"/><line x1="800" y1="88" x2="800" y2="510" stroke="#D7DEE8" stroke-width="2"/>
<text x="58" y="105" font-size="19" font-weight="700" class="blue">A　闭式 teacher</text><rect x="80" y="145" width="120" height="62" rx="8" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="140" y="183" text-anchor="middle" font-size="18" class="ink">x(0)</text><rect x="250" y="145" width="120" height="62" rx="8" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="310" y="183" text-anchor="middle" font-size="18" class="ink">x(t)</text><path d="M140 207V265H220M310 207V265H220" fill="none" stroke="#2563EB" stroke-width="3"/><polygon points="220,265 211,249 229,249" fill="#2563EB"/><rect x="70" y="265" width="300" height="92" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="220" y="298" text-anchor="middle" font-size="16" class="ink">q(x(t−1)|x(t),x(0))</text><text x="220" y="330" text-anchor="middle" font-size="15" class="muted">N( μ̃(t), β̃(t) I )</text><text x="220" y="405" text-anchor="middle" font-size="16" fill="#C24135">部署时 x(0) 未知</text>
<text x="430" y="105" font-size="19" font-weight="700" class="green">B　learned reverse</text><rect x="455" y="155" width="290" height="92" rx="8" fill="#E8F5F1" stroke="#0F766E" stroke-width="2"/><text x="600" y="190" text-anchor="middle" font-size="17" class="ink">pθ(x(t−1)|x(t))</text><text x="600" y="220" text-anchor="middle" font-size="15" class="muted">N( μθ(x(t),t), Σθ )</text><path d="M600 247V300" stroke="#0F766E" stroke-width="3"/><polygon points="600,300 591,284 609,284" fill="#0F766E"/><rect x="455" y="300" width="290" height="92" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="600" y="334" text-anchor="middle" font-size="17" font-weight="700" class="green">逐步 Gaussian KL</text><text x="600" y="365" text-anchor="middle" font-size="15" class="ink">固定 variance → weighted MSE</text><text x="600" y="430" text-anchor="middle" font-size="15" class="muted">teacher posterior ≠ true reverse mixture</text>
<text x="830" y="105" font-size="19" font-weight="700" fill="#B7791F">C　负 ELBO 三类项</text><rect x="840" y="145" width="280" height="76" rx="8" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="980" y="176" text-anchor="middle" font-size="17" class="ink">terminal prior KL</text><text x="980" y="204" text-anchor="middle" font-size="15" class="muted">q(x(T)|x(0)) || p(x(T))</text><rect x="840" y="248" width="280" height="76" rx="8" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="980" y="279" text-anchor="middle" font-size="17" class="ink">Σ denoising KL</text><text x="980" y="307" text-anchor="middle" font-size="15" class="muted">t=2…T</text><rect x="840" y="351" width="280" height="76" rx="8" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="980" y="382" text-anchor="middle" font-size="17" class="ink">reconstruction NLL</text><text x="980" y="410" text-anchor="middle" font-size="15" class="muted">−log pθ(x(0)|x(1))</text>
<line x1="54" y1="540" x2="1146" y2="540" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="580" font-size="16" class="muted">Simplified noise MSE 改写逐时刻权重；它是有效回归目标，但不再逐项等于这张 VLB 账。</text></svg>
