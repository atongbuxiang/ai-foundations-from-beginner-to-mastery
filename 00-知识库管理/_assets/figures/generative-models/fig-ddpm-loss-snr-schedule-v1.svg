<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">扩散 schedule SNR loss 与 timestep estimator</title><desc id="desc">三栏展示 schedule 决定累计 signal noise 和 log SNR，参数化与 VLB 简化权重改变目标，timestep proposal 和 importance correction 改变估计器。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}</style>
<text x="54" y="52" font-size="23" font-weight="700" class="ink">Schedule、目标权重与 timestep proposal：三处共同分配梯度预算</text><line x1="400" y1="88" x2="400" y2="515" stroke="#D7DEE8" stroke-width="2"/><line x1="800" y1="88" x2="800" y2="515" stroke="#D7DEE8" stroke-width="2"/>
<text x="58" y="105" font-size="19" font-weight="700" class="blue">A　schedule → log-SNR</text><rect x="65" y="140" width="310" height="235" rx="10" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="2"/><line x1="95" y1="335" x2="345" y2="335" stroke="#64748B" stroke-width="2"/><line x1="95" y1="335" x2="95" y2="170" stroke="#64748B" stroke-width="2"/><path d="M105 185 C160 205 210 250 335 320" fill="none" stroke="#2563EB" stroke-width="4"/><path d="M105 320 C190 305 250 250 335 185" fill="none" stroke="#B7791F" stroke-width="4"/><text x="245" y="195" font-size="15" class="blue">signal a²=ᾱ</text><text x="220" y="315" font-size="15" fill="#B7791F">noise σ²=1−ᾱ</text><text x="220" y="402" text-anchor="middle" font-size="17" class="ink">log-SNR = log(ᾱ/(1−ᾱ))</text><text x="220" y="442" text-anchor="middle" font-size="15" class="muted">linear β / cosine ᾱ / endpoint clip</text>
<text x="430" y="105" font-size="19" font-weight="700" class="green">B　parameterization → objective</text><rect x="430" y="140" width="340" height="105" rx="10" fill="#F2FBF8" stroke="#0F766E" stroke-width="2"/><text x="600" y="177" text-anchor="middle" font-size="17" class="ink">VLB：wt · ‖ε−εθ‖² + Ct</text><text x="600" y="213" text-anchor="middle" font-size="15" class="muted">wt 依赖 reverse variance convention</text><rect x="430" y="275" width="340" height="105" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="600" y="312" text-anchor="middle" font-size="17" class="ink">simple：‖ε−εθ‖²</text><text x="600" y="348" text-anchor="middle" font-size="15" class="muted">有效 regression，但非逐项 ELBO</text><text x="600" y="424" text-anchor="middle" font-size="16" fill="#C24135">‖δε‖² = SNR · ‖δx(0)‖²</text><text x="600" y="458" text-anchor="middle" font-size="15" class="muted">输出头不能脱离显式 weight 比较</text>
<text x="830" y="105" font-size="19" font-weight="700" fill="#B7791F">C　timestep estimator</text><rect x="840" y="145" width="280" height="80" rx="8" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="980" y="177" text-anchor="middle" font-size="17" class="ink">目标权重 π(t)</text><text x="980" y="205" text-anchor="middle" font-size="15" class="muted">你想优化什么</text><path d="M980 225V270" stroke="#B7791F" stroke-width="3"/><polygon points="980,270 971,254 989,254" fill="#B7791F"/><rect x="840" y="270" width="280" height="80" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="2"/><text x="980" y="302" text-anchor="middle" font-size="17" class="ink">proposal r(t)</text><text x="980" y="330" text-anchor="middle" font-size="15" class="muted">你怎样抽时刻</text><path d="M980 350V395" stroke="#B7791F" stroke-width="3"/><polygon points="980,395 971,379 989,379" fill="#B7791F"/><rect x="840" y="395" width="280" height="70" rx="8" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="980" y="424" text-anchor="middle" font-size="17" class="ink">π(t)/r(t) · loss</text><text x="980" y="450" text-anchor="middle" font-size="15" fill="#C24135">漏 correction → 换目标</text>
<line x1="54" y1="540" x2="1146" y2="540" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="580" font-size="16" class="muted">公平实验同时锁定 preprocessing、schedule、parameterization、显式 weight、timestep proposal、optimizer 与 sampling steps。</text></svg>
