<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">最小 DDPM 的端到端实现合同</title><desc id="desc">六个相互连接的模块展示数据、时间表、闭式加噪、网络目标、反向核和评价的形状索引合同，并突出训练链与采样链的共享接口。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}.amber{fill:#B7791F}.red{fill:#C24135}</style>
<text x="54" y="52" font-size="23" font-weight="700" class="ink">最小 DDPM 不是一个网络，而是六个接口共同定义的随机程序</text>
<path d="M165 174H270M360 174H465M555 174H660M750 174H855M945 174H1040" stroke="#64748B" stroke-width="3"/><g fill="#64748B"><polygon points="270,174 254,166 254,182"/><polygon points="465,174 449,166 449,182"/><polygon points="660,174 644,166 644,182"/><polygon points="855,174 839,166 839,182"/><polygon points="1040,174 1024,166 1024,182"/></g>
<g><rect x="55" y="115" width="110" height="118" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="110" y="145" text-anchor="middle" font-size="16" font-weight="700" class="blue">1 数据</text><text x="110" y="175" text-anchor="middle" font-size="15" class="ink">[B,C,H,W]</text><text x="110" y="202" text-anchor="middle" font-size="15" class="muted">尺度·离散化</text><text x="110" y="220" text-anchor="middle" font-size="15" class="muted">增强·颜色</text>
<rect x="270" y="115" width="90" height="118" rx="10" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="315" y="145" text-anchor="middle" font-size="16" font-weight="700" class="amber">2 表</text><text x="315" y="175" text-anchor="middle" font-size="15" class="ink">t=1…T</text><text x="315" y="202" text-anchor="middle" font-size="15" class="muted">β, α, αbar</text><text x="315" y="220" text-anchor="middle" font-size="15" class="red">index</text>
<rect x="465" y="115" width="90" height="118" rx="10" fill="#F2FBF8" stroke="#0F766E" stroke-width="2"/><text x="510" y="145" text-anchor="middle" font-size="16" font-weight="700" class="green">3 加噪</text><text x="510" y="169" text-anchor="middle" font-size="15" class="ink">x_t =</text><text x="510" y="188" text-anchor="middle" font-size="15" class="ink">a x_0 + σ ε</text><text x="510" y="207" text-anchor="middle" font-size="15" class="muted">gather→</text><text x="510" y="225" text-anchor="middle" font-size="15" class="muted">[B,1,1,1]</text>
<rect x="660" y="115" width="90" height="118" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="705" y="145" text-anchor="middle" font-size="16" font-weight="700" class="blue">4 网络</text><text x="705" y="175" text-anchor="middle" font-size="15" class="ink">ε / x_0 / v</text><text x="705" y="202" text-anchor="middle" font-size="15" class="muted">time label</text><text x="705" y="220" text-anchor="middle" font-size="15" class="muted">loss reduce</text>
<rect x="855" y="115" width="90" height="118" rx="10" fill="#F2FBF8" stroke="#0F766E" stroke-width="2"/><text x="900" y="145" text-anchor="middle" font-size="16" font-weight="700" class="green">5 反向</text><text x="900" y="175" text-anchor="middle" font-size="15" class="ink">μθ, σ²rev</text><text x="900" y="202" text-anchor="middle" font-size="15" class="muted">clip·EMA</text><text x="900" y="220" text-anchor="middle" font-size="15" class="red">t=1 无 z</text>
<rect x="1040" y="115" width="105" height="118" rx="10" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="1092" y="145" text-anchor="middle" font-size="16" font-weight="700" class="amber">6 评价</text><text x="1092" y="175" text-anchor="middle" font-size="15" class="ink">NLL/quality</text><text x="1092" y="202" text-anchor="middle" font-size="15" class="muted">coverage·NFE</text><text x="1092" y="220" text-anchor="middle" font-size="15" class="muted">wall time</text></g>
<text x="60" y="285" font-size="18" font-weight="700" class="blue">训练链</text><rect x="55" y="305" width="1090" height="74" rx="10" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/><text x="600" y="335" text-anchor="middle" font-size="17" class="ink">x_0 + t + ε → x_t → model(x_t,t) → target-matched error → feature/batch reduction</text><text x="600" y="362" text-anchor="middle" font-size="15" class="muted">proposal r(t) 与 objective weight π(t) 分开；改变 ε/x_0/v head 时 target、换算和 weighting 一起改变</text>
<text x="60" y="424" font-size="18" font-weight="700" class="green">采样链</text><rect x="55" y="444" width="1090" height="74" rx="10" fill="#F2FBF8" stroke="#0F766E" stroke-width="2"/><text x="600" y="474" text-anchor="middle" font-size="17" class="ink">xT ~ N(0,I) → t=T…1 → 预测并统一换算 → μθ + 1[t&gt;1] sigma_rev z → x_0</text><text x="600" y="501" text-anchor="middle" font-size="15" class="muted">训练与采样必须共享 preprocessing、schedule index、parameterization；DDIM 还须记录 timestep subsequence</text>
<path d="M315 233V305M705 233V305M900 233V305M315 379V444M705 379V444M900 379V444" stroke="#C24135" stroke-width="2" stroke-dasharray="7 5"/><text x="600" y="553" text-anchor="middle" font-size="16" font-weight="700" class="red">高频失效：off-by-one｜alpha_bar_(t−1) 取错｜mask 未 reshape｜最后一步仍加噪｜只改输出名未改 target</text>
<line x1="54" y1="578" x2="1146" y2="578" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="607" font-size="15" class="muted">验收顺序：代数单测 → Monte Carlo 统计 → 极小数据过拟合 → toy distribution coverage → 成本与证据复现。</text></svg>
