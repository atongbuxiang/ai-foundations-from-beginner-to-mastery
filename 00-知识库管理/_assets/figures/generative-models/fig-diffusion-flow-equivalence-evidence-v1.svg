<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Diffusion、Flow 与 Rectified Flow 的等价和证据地图</title>
<desc id="desc">中心是 density path 和 continuity equation，左侧通过 score 连接 SDE 与 probability-flow ODE，右侧通过 conditional paths 连接 CFM 与 Rectified Flow，底部经过模型误差和数值误差两道门到达有限采样器；实线、虚线和点线表示不同证据层。</desc>
<rect width="1200" height="620" fill="#FFFEFB"/>
<defs><marker id="aInk" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1F2937"/></marker><marker id="aGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0F766E"/></marker><marker id="aBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563EB"/></marker></defs>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}.amber{fill:#B7791F}.red{fill:#C24135}.box{fill:#FFFFFF;stroke:#D7DEE8;stroke-width:2}</style>
<text x="58" y="45" font-size="20" font-weight="700" class="ink">每跨一条边，先问：identity、theorem，还是 empirical interface？</text>
<rect x="430" y="98" width="340" height="92" class="box"/><text x="600" y="133" text-anchor="middle" font-size="19" font-weight="700" class="green">density path p(t)</text><text x="600" y="163" text-anchor="middle" font-size="16" class="ink">partial_t p + div(p v) = 0</text>
<rect x="78" y="92" width="245" height="72" class="box"/><text x="200" y="123" text-anchor="middle" font-size="18" font-weight="700" class="blue">score s = grad log p</text><text x="200" y="148" text-anchor="middle" font-size="15" class="muted">conditional score regression</text>
<rect x="68" y="240" width="260" height="72" class="box"/><text x="198" y="271" text-anchor="middle" font-size="18" class="blue">diffusion SDE family</text><text x="198" y="297" text-anchor="middle" font-size="15" class="muted">path law has Brownian noise</text>
<rect x="368" y="250" width="260" height="72" class="box"/><text x="498" y="281" text-anchor="middle" font-size="18" class="green">probability-flow ODE</text><text x="498" y="307" text-anchor="middle" font-size="15" class="muted">same p(t), different paths</text>
<rect x="870" y="92" width="250" height="72" class="box"/><text x="995" y="123" text-anchor="middle" font-size="18" font-weight="700" class="amber">conditional paths</text><text x="995" y="148" text-anchor="middle" font-size="15" class="muted">coupling + derivative U</text>
<rect x="850" y="240" width="280" height="72" class="box"/><text x="990" y="271" text-anchor="middle" font-size="18" class="amber">CFM / Flow Matching</text><text x="990" y="297" text-anchor="middle" font-size="15" class="muted">v = E[U | X=x]</text>
<rect x="705" y="355" width="270" height="72" class="box"/><text x="840" y="386" text-anchor="middle" font-size="18" class="amber">Rectified Flow / ReFlow</text><text x="840" y="412" text-anchor="middle" font-size="15" class="muted">straight targets, updated pairs</text>
<g fill="none" stroke-width="2.8"><path d="M323 128H420" stroke="#0F766E" marker-end="url(#aGreen)"/><path d="M200 164V230" stroke="#2563EB" marker-end="url(#aBlue)"/><path d="M430 166L318 242" stroke="#0F766E" marker-end="url(#aGreen)"/><path d="M600 190L520 240" stroke="#0F766E" marker-end="url(#aGreen)"/><path d="M780 128H860" stroke="#0F766E" marker-end="url(#aGreen)"/><path d="M995 164V230" stroke="#0F766E" marker-end="url(#aGreen)"/><path d="M850 276H640" stroke="#0F766E" marker-end="url(#aGreen)"/><path d="M940 312L875 345" stroke="#0F766E" marker-end="url(#aGreen)"/></g>
<text x="348" y="116" font-size="15" class="green">identity</text><text x="208" y="210" font-size="15" class="blue">theorem</text><text x="327" y="210" font-size="15" class="green">v=f-g^2s/2</text><text x="770" y="116" font-size="15" class="green">weak identity</text><text x="690" y="265" font-size="15" class="green">same marginal field</text>
<rect x="165" y="440" width="260" height="62" fill="#FFF8EB" stroke="#B7791F" stroke-width="2"/><text x="295" y="467" text-anchor="middle" font-size="17" class="amber">model / estimator error</text><text x="295" y="489" text-anchor="middle" font-size="15" class="muted">finite data + network + optimizer</text>
<rect x="470" y="440" width="260" height="62" fill="#FFF8EB" stroke="#B7791F" stroke-width="2"/><text x="600" y="467" text-anchor="middle" font-size="17" class="amber">numerical solver error</text><text x="600" y="489" text-anchor="middle" font-size="15" class="muted">step / NFE / tolerance / randomness</text>
<rect x="775" y="440" width="260" height="62" fill="#FFF4F1" stroke="#C24135" stroke-width="2"/><text x="905" y="467" text-anchor="middle" font-size="17" class="red">finite sampler + metrics</text><text x="905" y="489" text-anchor="middle" font-size="15" class="muted">likelihood / W2 / FID / coverage</text>
<path d="M425 471H460" stroke="#1F2937" stroke-width="2.5" marker-end="url(#aInk)"/><path d="M730 471H765" stroke="#1F2937" stroke-width="2.5" marker-end="url(#aInk)"/>
<path d="M498 322C470 370 370 390 315 430" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="8 7"/><path d="M840 427L820 438" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="8 7"/>
<line x1="58" y1="540" x2="1142" y2="540" stroke="#D7DEE8" stroke-width="2"/>
<g font-size="15"><line x1="72" y1="570" x2="125" y2="570" stroke="#0F766E" stroke-width="3"/><text x="140" y="575" class="ink">exact identity</text><line x1="290" y1="570" x2="343" y2="570" stroke="#2563EB" stroke-width="3"/><text x="358" y="575" class="ink">theorem with assumptions</text><line x1="590" y1="570" x2="643" y2="570" stroke="#64748B" stroke-width="3" stroke-dasharray="8 7"/><text x="658" y="575" class="ink">ideal-to-finite interface</text><text x="915" y="575" class="red">same p(t) does not imply same coupling</text></g>
</svg>
