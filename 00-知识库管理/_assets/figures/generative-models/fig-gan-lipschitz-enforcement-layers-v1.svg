<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Lipschitz约束的实现层级</title><desc id="desc">从全域一Lipschitz函数类向下分为层谱范数、参数裁剪、插值梯度惩罚和真实样本零中心惩罚，标明证书与经验正则差别。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style>
<g font-family="Inter, PingFang SC, sans-serif"><text x="54" y="54" font-size="23" font-weight="700" fill="#1F2937">同叫 Lipschitz regularization，作用域可能完全不同</text>
<rect x="410" y="90" width="380" height="78" rx="8" fill="#EEF3FF" stroke="#2563EB" stroke-width="3"/><text x="600" y="122" text-anchor="middle" font-size="17" fill="#64748B">KR dual 理论对象</text><text x="600" y="150" text-anchor="middle" font-size="21" font-weight="700" fill="#2563EB">∀x,y　|f(x)−f(y)|≤||x−y||</text>
<path d="M600 168V215M600 215H155V245M600 215H445V245M600 215H755V245M600 215H1045V245" fill="none" stroke="#64748B" stroke-width="2"/>
<rect x="45" y="245" width="220" height="140" rx="8" fill="#FFF7E6" stroke="#B7791F" stroke-width="2.5"/><text x="155" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#B7791F">Weight clipping</text><text x="155" y="315" text-anchor="middle" font-size="16" fill="#334155">参数 ∈ [−c,c]</text><text x="155" y="347" text-anchor="middle" font-size="15" fill="#64748B">间接、架构依赖</text>
<rect x="335" y="245" width="220" height="140" rx="8" fill="#E8F5F1" stroke="#0F766E" stroke-width="2.5"/><text x="445" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#0F766E">Spectral norm</text><text x="445" y="315" text-anchor="middle" font-size="16" fill="#334155">层 ||W||op 控制</text><text x="445" y="347" text-anchor="middle" font-size="15" fill="#64748B">network upper bound</text>
<rect x="645" y="245" width="220" height="140" rx="8" fill="#FFF0EE" stroke="#C24135" stroke-width="2.5"/><text x="755" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#C24135">WGAN-GP</text><text x="755" y="315" text-anchor="middle" font-size="16" fill="#334155">插值点 ||∇f||→1</text><text x="755" y="347" text-anchor="middle" font-size="15" fill="#64748B">sampled chords</text>
<rect x="935" y="245" width="220" height="140" rx="8" fill="#FFF0EE" stroke="#C24135" stroke-width="2.5"/><text x="1045" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#C24135">R1</text><text x="1045" y="315" text-anchor="middle" font-size="16" fill="#334155">real 点 ||∇f||→0</text><text x="1045" y="347" text-anchor="middle" font-size="15" fill="#64748B">local game damping</text>
<rect x="115" y="435" width="970" height="88" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="600" y="469" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">向上推理所缺的保证</text><text x="600" y="500" text-anchor="middle" font-size="16" fill="#64748B">参数/有限点 → 整个网络 → 全域任意点对；中间还含 activation、residual、normalization 与估计误差。</text><text x="54" y="577" font-size="16" fill="#1F2937">GP 与 R1 的 sampling distribution 和 target norm 不同；二者都不是全域证书。</text></g></svg>

