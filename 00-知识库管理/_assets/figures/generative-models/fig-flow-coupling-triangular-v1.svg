<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Affine coupling 的数据流与块三角 Jacobian</title><desc id="desc">图示保留块生成缩放平移参数并变换另一块，同时展示块三角 Jacobian、行列式和显式逆。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}</style>
<text x="54" y="52" font-size="23" font-weight="700" class="ink">Conditioner 可以复杂；整体仍因“保留一块”而显式可逆</text>
<text x="60" y="98" font-size="19" font-weight="700" class="blue">A　前向数据流</text><rect x="55" y="118" width="510" height="340" rx="12" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="2"/>
<rect x="82" y="166" width="116" height="60" rx="8" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="140" y="203" text-anchor="middle" font-size="19" class="ink">xA</text><rect x="82" y="336" width="116" height="60" rx="8" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="140" y="373" text-anchor="middle" font-size="19" class="ink">xB</text>
<path d="M198 196H450" stroke="#2563EB" stroke-width="3"/><polygon points="450,196 434,187 434,205" fill="#2563EB"/><rect x="450" y="166" width="85" height="60" rx="8" fill="#E8F5F1" stroke="#0F766E" stroke-width="2"/><text x="492" y="203" text-anchor="middle" font-size="19" class="ink">yA=xA</text>
<path d="M220 196V270H300" fill="none" stroke="#2563EB" stroke-width="3"/><polygon points="300,270 284,261 284,279" fill="#2563EB"/><rect x="300" y="240" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text x="365" y="277" text-anchor="middle" font-size="18" class="ink">s(xA), t(xA)</text><path d="M365 300V366H450" fill="none" stroke="#B7791F" stroke-width="3"/><path d="M198 366H450" stroke="#B7791F" stroke-width="3"/><polygon points="450,366 434,357 434,375" fill="#B7791F"/><rect x="450" y="326" width="85" height="80" rx="8" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="492" y="358" text-anchor="middle" font-size="18" class="ink">yB</text><text x="492" y="386" text-anchor="middle" font-size="15" class="muted">xB·eˢ+t</text>
<text x="615" y="98" font-size="19" font-weight="700" class="green">B　Jacobian 与 inverse</text><rect x="600" y="118" width="550" height="340" rx="12" fill="#F2FBF8" stroke="#D7DEE8" stroke-width="2"/>
<rect x="632" y="155" width="240" height="148" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="752" y="190" text-anchor="middle" font-size="18" font-weight="700" class="green">块三角 Jacobian</text><text x="752" y="235" text-anchor="middle" font-size="24" class="ink">J = [ I   0 ]</text><text x="752" y="272" text-anchor="middle" font-size="24" class="ink">    [ *  diag(eˢ) ]</text>
<rect x="900" y="155" width="220" height="148" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="1010" y="198" text-anchor="middle" font-size="18" font-weight="700" class="green">logdet</text><text x="1010" y="244" text-anchor="middle" font-size="22" class="ink">Σj sj(xA)</text><text x="1010" y="278" text-anchor="middle" font-size="15" class="muted">复杂 * 块不参与 determinant</text>
<text x="632" y="352" font-size="19" font-weight="700" class="ink">inverse：</text><text x="728" y="352" font-size="18" class="ink">xA=yA</text><text x="728" y="394" font-size="18" class="ink">xB=(yB−t(yA))·e⁻ˢ⁽ʸᴬ⁾</text><text x="632" y="430" font-size="16" fill="#C24135">风险：eˢ 非零保证代数可逆，却不保证浮点条件良好。</text>
<line x1="54" y1="500" x2="1146" y2="500" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="542" font-size="17" class="ink">一层只直接改变 B；交替 mask / permutation / 可逆通道混合，才能让所有坐标轮流被塑形。</text><text x="54" y="580" font-size="16" class="muted">Additive coupling 取 s=0，det=1：保持局部体积不等于保持所有几何形状。</text>
</svg>
