<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">最大似然模型相、对比散度与噪声对比估计</title><desc id="desc">上半部展示最大似然的正相负相，下半部将短链对比散度和固定噪声分类两条路线分开。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style><g>
<text x="54" y="52" font-size="23" font-weight="700" fill="#1F2937">同样出现“负样本”，CD 与 NCE 却在解决不同问题</text>
<rect x="70" y="91" width="1060" height="116" rx="10" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="2"/><text x="100" y="126" font-size="18" font-weight="700" fill="#1F2937">Maximum likelihood gradient</text><text x="100" y="171" font-size="22" fill="#1F2937">∇L =</text><rect x="183" y="139" width="300" height="47" rx="6" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="333" y="169" text-anchor="middle" font-size="18" fill="#2563EB">E<tspan baseline-shift="sub" font-size="13">data</tspan>[∇E]　正相</text><text x="508" y="171" font-size="25" fill="#1F2937">−</text><rect x="546" y="139" width="320" height="47" rx="6" fill="#FFF0EE" stroke="#C24135" stroke-width="2"/><text x="706" y="169" text-anchor="middle" font-size="18" fill="#C24135">E<tspan baseline-shift="sub" font-size="13">pθ</tspan>[∇E]　模型相</text><text x="902" y="169" font-size="15" fill="#64748B">难点：从当前模型采样</text>
<path d="M707 207V245H344V272" fill="none" stroke="#64748B" stroke-width="2"/><polygon points="344,272 336,258 352,258" fill="#64748B"/><path d="M707 245H881V272" fill="none" stroke="#64748B" stroke-width="2"/><polygon points="881,272 873,258 889,258" fill="#64748B"/>
<text x="72" y="300" font-size="19" font-weight="700" fill="#B7791F">A　CD-k：让短链靠近模型相</text><rect x="70" y="320" width="520" height="185" rx="10" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><circle cx="122" cy="387" r="14" fill="#2563EB"/><text x="122" y="421" text-anchor="middle" font-size="14" fill="#2563EB">x₀∼data</text><circle cx="235" cy="387" r="12" fill="#B7791F"/><circle cx="347" cy="387" r="12" fill="#B7791F"/><circle cx="460" cy="387" r="14" fill="#C24135"/><path d="M138 387H219M247 387H331M359 387H444" stroke="#B7791F" stroke-width="3"/><polygon points="219,387 207,380 207,394" fill="#B7791F"/><polygon points="331,387 319,380 319,394" fill="#B7791F"/><polygon points="444,387 432,380 432,394" fill="#B7791F"/><text x="291" y="362" text-anchor="middle" font-size="15" fill="#64748B">K<tspan baseline-shift="super" font-size="11">k</tspan><tspan>　Markov transitions</tspan></text><text x="460" y="421" text-anchor="middle" font-size="14" fill="#C24135">xₖ∼pₖ</text><text x="330" y="466" text-anchor="middle" font-size="15" fill="#1F2937">希望 pₖ ≈ pθ；偏差依赖 kernel、k 与初始化</text><text x="330" y="491" text-anchor="middle" font-size="14" fill="#64748B">stop-gradient 后通常不是某个 KL 差的完整梯度</text>
<text x="625" y="300" font-size="19" font-weight="700" fill="#0F766E">B　NCE：固定外部噪声做密度比分类</text><rect x="620" y="320" width="510" height="185" rx="10" fill="#F2FBF8" stroke="#0F766E" stroke-width="2"/><circle cx="690" cy="378" r="16" fill="#2563EB"/><text x="690" y="414" text-anchor="middle" font-size="14" fill="#2563EB">data p*</text><circle cx="690" cy="458" r="16" fill="#64748B"/><text x="690" y="491" text-anchor="middle" font-size="14" fill="#64748B">known q</text><path d="M708 378H805M708 458H805" stroke="#0F766E" stroke-width="3"/><polygon points="805,378 791,370 791,386" fill="#0F766E"/><polygon points="805,458 791,450 791,466" fill="#0F766E"/><rect x="808" y="355" width="275" height="120" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="945" y="389" text-anchor="middle" font-size="17" fill="#1F2937">logit = log p̃θ − c − log(kq)</text><text x="945" y="425" text-anchor="middle" font-size="15" fill="#0F766E">估 θ 与 c≈log Z</text><text x="945" y="454" text-anchor="middle" font-size="14" fill="#64748B">q 不需要变成 pθ</text>
<line x1="54" y1="545" x2="1146" y2="545" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="579" font-size="16" fill="#1F2937">CD 近似 model phase；NCE 估 density ratio。名称里的“对比”不能把 estimand 合并。</text>
</g></svg>
