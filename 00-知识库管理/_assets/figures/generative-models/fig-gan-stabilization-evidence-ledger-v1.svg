<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">GAN稳定化方法与证据责任账</title><desc id="desc">六类干预汇入结果，结果必须经过目标、计算预算、随机种子和评价协议四道隔离门才能归因。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style>
<g font-family="Inter, PingFang SC, sans-serif"><text x="54" y="54" font-size="23" font-weight="700" fill="#1F2937">一个更低 FID 的 recipe，通常同时改了六本账</text>
<g font-size="16"><rect x="55" y="105" width="210" height="65" rx="7" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="160" y="145" text-anchor="middle" fill="#2563EB">Objective：hinge / W₁</text><rect x="55" y="190" width="210" height="65" rx="7" fill="#E8F5F1" stroke="#0F766E" stroke-width="2"/><text x="160" y="230" text-anchor="middle" fill="#0F766E">Constraint：GP / SN / R1</text><rect x="55" y="275" width="210" height="65" rx="7" fill="#FFF7E6" stroke="#B7791F" stroke-width="2"/><text x="160" y="315" text-anchor="middle" fill="#B7791F">Optimizer：TTUR / Adam</text><rect x="55" y="360" width="210" height="65" rx="7" fill="#FFF7E6" stroke="#B7791F" stroke-width="2"/><text x="160" y="400" text-anchor="middle" fill="#B7791F">Schedule：steps / EMA</text><rect x="55" y="445" width="210" height="65" rx="7" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="160" y="485" text-anchor="middle" fill="#2563EB">Architecture：ResNet / norm</text></g>
<path d="M265 137C355 137 366 285 440 300M265 222C350 222 370 290 440 300M265 307H440M265 392C350 392 370 320 440 305M265 477C355 477 366 325 440 305" fill="none" stroke="#64748B" stroke-width="2"/>
<rect x="442" y="240" width="215" height="130" rx="9" fill="#FFF0EE" stroke="#C24135" stroke-width="3"/><text x="549" y="278" text-anchor="middle" font-size="17" fill="#64748B">observed result</text><text x="549" y="315" text-anchor="middle" font-size="23" font-weight="700" fill="#C24135">FID ↓ / failure ↓</text><text x="549" y="345" text-anchor="middle" font-size="15" fill="#334155">究竟由谁造成？</text>
<path d="M657 305H728" stroke="#334155" stroke-width="3"/><polygon points="728,305 713,296 713,314" fill="#334155"/>
<text x="746" y="103" font-size="20" font-weight="700" fill="#0F766E">四道隔离门</text><g font-size="16"><rect x="730" y="130" width="410" height="76" rx="7" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="755" y="161" font-weight="700" fill="#1F2937">1　因子匹配</text><text x="885" y="161" fill="#64748B">一次只改目标对象</text><text x="755" y="188" fill="#64748B">或做完整 factorial ablation</text>
<rect x="760" y="230" width="380" height="76" rx="7" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="785" y="261" font-weight="700" fill="#1F2937">2　Compute</text><text x="895" y="261" fill="#64748B">updates / NFE / wall-clock</text><text x="785" y="288" fill="#64748B">参数量与硬件预算</text>
<rect x="790" y="330" width="350" height="76" rx="7" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="815" y="361" font-weight="700" fill="#1F2937">3　Seeds</text><text x="910" y="361" fill="#64748B">失败率 + 置信区间</text><text x="815" y="388" fill="#64748B">不只汇报最佳 checkpoint</text>
<rect x="820" y="430" width="320" height="76" rx="7" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="845" y="461" font-weight="700" fill="#1F2937">4　Metric</text><text x="945" y="461" fill="#64748B">preprocess / encoder / N</text><text x="845" y="488" fill="#64748B">precision 与 recall 分账</text></g>
<line x1="54" y1="548" x2="1146" y2="548" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="582" font-size="16" fill="#1F2937">组合 recipe 只能证明组合有效；若要说“来自 Wasserstein geometry”，必须额外隔离 regularization 与 dynamics。</text></g></svg>

