<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">多噪声尺度连接分离模式并逐级恢复细节</title><desc id="desc">三行密度曲线显示大噪声单宽峰、中噪声过渡和小噪声双峰，下方采样轨迹从大噪声逐级下降。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style><g>
<text x="54" y="52" font-size="23" font-weight="700" fill="#1F2937">噪声梯子：先解决全局连通，再恢复局部细节</text>
<text x="61" y="96" font-size="19" font-weight="700" fill="#2563EB">A　同一双峰数据的三种平滑尺度</text><rect x="57" y="113" width="700" height="356" rx="10" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="2"/>
<text x="88" y="162" font-size="16" font-weight="700" fill="#0F766E">σ 大</text><line x1="160" y1="186" x2="700" y2="186" stroke="#CBD5E1" stroke-width="2"/><path d="M175 184C295 181 330 118 430 118C530 118 565 181 685 184" fill="#D8F0E9" stroke="#0F766E" stroke-width="4"/><text x="710" y="161" text-anchor="end" font-size="14" fill="#0F766E">一个宽桥：全局移动较容易</text>
<text x="88" y="269" font-size="16" font-weight="700" fill="#B7791F">σ 中</text><line x1="160" y1="292" x2="700" y2="292" stroke="#CBD5E1" stroke-width="2"/><path d="M175 290C238 288 260 235 330 232C382 230 390 260 430 260C470 260 478 230 530 232C600 235 622 288 685 290" fill="#FFF0C9" stroke="#B7791F" stroke-width="4"/><text x="710" y="268" text-anchor="end" font-size="14" fill="#B7791F">桥变窄：开始分化模式</text>
<text x="88" y="378" font-size="16" font-weight="700" fill="#C24135">σ 小</text><line x1="160" y1="404" x2="700" y2="404" stroke="#CBD5E1" stroke-width="2"/><path d="M175 402C245 402 268 326 330 326C392 326 399 402 430 402C461 402 468 326 530 326C592 326 615 402 685 402" fill="#FFE4DF" stroke="#C24135" stroke-width="4"/><circle cx="430" cy="402" r="6" fill="#C24135"/><text x="445" y="428" font-size="14" fill="#C24135">valley 也可 s(x)=0</text><text x="710" y="378" text-anchor="end" font-size="14" fill="#C24135">细节清楚：跨峰困难</text>
<text x="805" y="96" font-size="19" font-weight="700" fill="#0F766E">B　Annealed Langevin protocol</text><rect x="800" y="113" width="345" height="356" rx="10" fill="#F2FBF8" stroke="#0F766E" stroke-width="2"/><circle cx="860" cy="175" r="19" fill="#0F766E"/><text x="895" y="181" font-size="16" fill="#1F2937">x ∼ easy prior</text><path d="M860 197C910 230 845 260 900 292C955 324 884 354 952 391" fill="none" stroke="#0F766E" stroke-width="4" stroke-dasharray="8 6"/><circle cx="900" cy="292" r="10" fill="#B7791F"/><circle cx="952" cy="391" r="13" fill="#C24135"/><text x="985" y="245" font-size="15" fill="#64748B">每层 K<tspan baseline-shift="sub" font-size="11">i</tspan> 次局部 move</text><text x="985" y="276" font-size="15" fill="#64748B">再降低 σ<tspan baseline-shift="sub" font-size="11">i</tspan></text><text x="985" y="335" font-size="15" fill="#64748B">warm start ≠</text><text x="985" y="359" font-size="15" fill="#64748B">新层 equilibrium</text><text x="995" y="421" font-size="15" fill="#C24135">最后去噪另改分布</text>
<line x1="54" y1="516" x2="1146" y2="516" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="552" font-size="16" fill="#1F2937">大 σ 帮助连接模式，小 σ 恢复细节；noise ladder、loss weight 与 sampling steps 是三份不同配置。</text><text x="54" y="581" font-size="15" fill="#64748B">该图只给几何机制，不证明高维有限步链快速混合，也不指定普遍最优 schedule。</text>
</g></svg>
