<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">连续Langevin、ULA离散偏差与MALA校正</title><desc id="desc">左栏证明连续扩散的零概率流，中栏展示高斯目标下ULA平稳方差偏差，右栏展示MALA提议和接受拒绝门。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style><g>
<text x="54" y="52" font-size="23" font-weight="700" fill="#1F2937">连续过程正确，不会自动穿过 Euler 离散化这道门</text>
<text x="58" y="98" font-size="19" font-weight="700" fill="#0F766E">A　Continuous Langevin</text><rect x="55" y="116" width="330" height="360" rx="10" fill="#F2FBF8" stroke="#0F766E" stroke-width="2"/><text x="220" y="166" text-anchor="middle" font-size="18" fill="#1F2937">dX = −∇E dt + √2 dW</text><path d="M92 338C145 338 145 214 220 214C295 214 295 338 348 338" fill="#D8F0E9" stroke="#0F766E" stroke-width="4"/><text x="220" y="196" text-anchor="middle" font-size="14" fill="#0F766E">π ∝ exp(−E)</text><text x="220" y="385" text-anchor="middle" font-size="17" fill="#1F2937">J = −π∇E − ∇π = 0</text><text x="220" y="418" text-anchor="middle" font-size="15" fill="#0F766E">⇒ π invariant</text><text x="220" y="449" text-anchor="middle" font-size="14" fill="#64748B">尚未证明从任意初值快速混合</text>
<path d="M387 290H430" stroke="#334155" stroke-width="3"/><polygon points="430,290 416,282 416,298" fill="#334155"/><text x="408" y="269" text-anchor="middle" font-size="14" fill="#C24135">Euler</text>
<text x="447" y="98" font-size="19" font-weight="700" fill="#C24135">B　ULA：Gaussian 校准反例</text><rect x="442" y="116" width="350" height="360" rx="10" fill="#FFF0EE" stroke="#C24135" stroke-width="2"/><text x="617" y="164" text-anchor="middle" font-size="17" fill="#1F2937">X<tspan baseline-shift="sub" font-size="12">k+1</tspan>=(1−h)X<tspan baseline-shift="sub" font-size="12">k</tspan>+√(2h) ξ<tspan baseline-shift="sub" font-size="12">k</tspan></text><line x1="500" y1="378" x2="740" y2="378" stroke="#64748B" stroke-width="2"/><line x1="500" y1="378" x2="500" y2="215" stroke="#64748B" stroke-width="2"/><path d="M510 365C555 359 598 341 630 305C671 259 691 230 730 220" fill="none" stroke="#C24135" stroke-width="4"/><line x1="500" y1="320" x2="740" y2="320" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 5"/><text x="735" y="311" text-anchor="end" font-size="14" fill="#2563EB">target variance = 1</text><text x="617" y="410" text-anchor="middle" font-size="17" font-weight="700" fill="#C24135">v<tspan baseline-shift="sub" font-size="12">h</tspan>=1/(1−h/2)</text><text x="617" y="441" text-anchor="middle" font-size="14" fill="#64748B">0&lt;h&lt;2 才稳定；h&gt;0 时一般有偏</text>
<path d="M794 290H837" stroke="#334155" stroke-width="3"/><polygon points="837,290 823,282 823,298" fill="#334155"/><text x="815" y="269" text-anchor="middle" font-size="14" fill="#0F766E">MH 门</text>
<text x="854" y="98" font-size="19" font-weight="700" fill="#B7791F">C　MALA：校正 invariant law</text><rect x="847" y="116" width="298" height="360" rx="10" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><circle cx="907" cy="215" r="14" fill="#2563EB"/><text x="907" y="247" text-anchor="middle" font-size="14" fill="#2563EB">x</text><circle cx="1080" cy="215" r="14" fill="#B7791F"/><text x="1080" y="247" text-anchor="middle" font-size="14" fill="#B7791F">proposal y</text><path d="M923 215H1064" stroke="#B7791F" stroke-width="3"/><polygon points="1064,215 1050,207 1050,223" fill="#B7791F"/><rect x="875" y="280" width="240" height="91" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="2"/><text x="995" y="311" text-anchor="middle" font-size="15" fill="#1F2937">α=min{1, π(y)q(x|y)</text><text x="995" y="337" text-anchor="middle" font-size="15" fill="#1F2937">　　　　 / π(x)q(y|x)}</text><text x="995" y="398" text-anchor="middle" font-size="15" fill="#0F766E">接受：移动到 y</text><text x="995" y="427" text-anchor="middle" font-size="15" fill="#C24135">拒绝：留在 x</text><text x="995" y="454" text-anchor="middle" font-size="14" fill="#64748B">Z 消去，但 mixing 仍未免费</text>
<line x1="54" y1="521" x2="1146" y2="521" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="557" font-size="16" fill="#1F2937">Invariant law、ergodicity、mixing rate 与 finite-budget accuracy 是四个不同结论。</text><text x="54" y="585" font-size="15" fill="#64748B">MALA 恢复目标不变性；它不产生 iid 样本，也不保证多峰问题在给定 NFE 下跨峰。</text>
</g></svg>
