<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">去噪得分匹配的条件期望投影和Tweedie公式</title><desc id="desc">多个干净来源加噪到同一观测附近，条件得分向量的后验平均形成边缘得分，再乘噪声方差得到后验均值去噪位移。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0F766E"/></marker></defs><g>
<text x="54" y="52" font-size="23" font-weight="700" fill="#1F2937">网络看见 noisy y，只能输出所有可能 clean ancestors 的后验平均</text>
<text x="62" y="99" font-size="19" font-weight="700" fill="#2563EB">A　Gaussian corruption</text><rect x="58" y="117" width="390" height="350" rx="10" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="2"/><circle cx="130" cy="205" r="12" fill="#2563EB"/><circle cx="130" cy="360" r="12" fill="#2563EB"/><text x="112" y="185" font-size="14" fill="#2563EB">x₁</text><text x="112" y="390" font-size="14" fill="#2563EB">x₂</text><circle cx="345" cy="285" r="14" fill="#C24135"/><text x="365" y="290" font-size="15" fill="#C24135">observed y</text><path d="M144 210C215 220 255 263 330 282" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/><path d="M144 356C220 344 256 307 330 289" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/><path d="M345 285L238 233" stroke="#2563EB" stroke-width="3" marker-end="url(#a)"/><path d="M345 285L235 337" stroke="#B7791F" stroke-width="3" marker-end="url(#a)"/><text x="238" y="204" font-size="14" fill="#2563EB">−(y−x₁)/σ²</text><text x="226" y="372" font-size="14" fill="#B7791F">−(y−x₂)/σ²</text><text x="253" y="437" text-anchor="middle" font-size="15" fill="#64748B">细箭头：知道 clean x 时的 conditional score</text>
<path d="M448 287H500" stroke="#334155" stroke-width="3"/><polygon points="500,287 486,279 486,295" fill="#334155"/>
<text x="520" y="99" font-size="19" font-weight="700" fill="#0F766E">B　L² 条件期望投影</text><rect x="510" y="117" width="300" height="350" rx="10" fill="#F2FBF8" stroke="#0F766E" stroke-width="2"/><text x="660" y="168" text-anchor="middle" font-size="17" fill="#1F2937">U = ∇y log q(y|X)</text><rect x="548" y="198" width="224" height="65" rx="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="660" y="224" text-anchor="middle" font-size="15" fill="#0F766E">E[U | Y=y]</text><text x="660" y="249" text-anchor="middle" font-size="17" font-weight="700" fill="#0F766E">= ∇y log pσ(y)</text><path d="M660 264V308" stroke="#0F766E" stroke-width="3" marker-end="url(#b)"/><circle cx="660" cy="359" r="12" fill="#C24135"/><path d="M660 359L610 323" stroke="#0F766E" stroke-width="5" marker-end="url(#b)"/><text x="660" y="411" text-anchor="middle" font-size="15" fill="#64748B">粗箭头：posterior-weighted average</text><text x="660" y="440" text-anchor="middle" font-size="14" fill="#64748B">不是任选一条细箭头</text>
<path d="M810 287H862" stroke="#334155" stroke-width="3"/><polygon points="862,287 848,279 848,295" fill="#334155"/>
<text x="875" y="99" font-size="19" font-weight="700" fill="#B7791F">C　Tweedie denoise</text><rect x="865" y="117" width="280" height="350" rx="10" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><circle cx="930" cy="322" r="13" fill="#C24135"/><text x="930" y="351" text-anchor="middle" font-size="14" fill="#C24135">y</text><circle cx="1070" cy="245" r="13" fill="#0F766E"/><text x="1070" y="222" text-anchor="middle" font-size="14" fill="#0F766E">E[X|Y=y]</text><path d="M944 314L1056 252" stroke="#0F766E" stroke-width="5" marker-end="url(#b)"/><text x="1005" y="296" text-anchor="middle" font-size="15" fill="#0F766E">σ²sσ(y)</text><text x="1005" y="393" text-anchor="middle" font-size="17" fill="#1F2937">r*(y)=y+σ²sσ(y)</text><text x="1005" y="425" text-anchor="middle" font-size="14" fill="#64748B">终点是 posterior mean</text><text x="1005" y="450" text-anchor="middle" font-size="14" fill="#64748B">未必等于任一真实 x</text>
<line x1="54" y1="516" x2="1146" y2="516" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="552" font-size="16" fill="#1F2937">DSM 与 marginal-score MSE 共享 population minimizer；两个 loss 数值相差不可约条件方差。</text><text x="54" y="581" font-size="15" fill="#64748B">非 Gaussian corruption 时，位移系数一般不是 σ²I，必须从对应 likelihood 重新推导。</text>
</g></svg>
