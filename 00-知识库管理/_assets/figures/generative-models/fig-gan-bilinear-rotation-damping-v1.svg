<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">双线性博弈的旋转与阻尼</title><desc id="desc">三个相图分别显示连续双线性流绕圆、同步梯度下降上升离散外螺旋以及加入阻尼或前瞻后的内螺旋。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style>
<g font-family="Inter, PingFang SC, sans-serif"><text x="54" y="54" font-size="23" font-weight="700" fill="#1F2937">一个唯一 Nash 点，也不保证同步梯度下降—上升会靠近它</text>
<g transform="translate(55,105)"><text x="160" y="0" text-anchor="middle" font-size="19" font-weight="700" fill="#2563EB">连续 flow：守恒旋转</text><rect x="0" y="25" width="320" height="325" rx="8" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><line x1="35" y1="187" x2="285" y2="187" stroke="#64748B"/><line x1="160" y1="55" x2="160" y2="315" stroke="#64748B"/><circle cx="160" cy="187" r="75" fill="none" stroke="#2563EB" stroke-width="4"/><circle cx="160" cy="187" r="7" fill="#1F2937"/><text x="160" y="382" text-anchor="middle" font-size="15" fill="#64748B">d(x²+y²)/dt=0：不收敛</text></g>
<g transform="translate(440,105)"><text x="160" y="0" text-anchor="middle" font-size="19" font-weight="700" fill="#C24135">同步 Euler：向外螺旋</text><rect x="0" y="25" width="320" height="325" rx="8" fill="#FFF0EE" stroke="#C24135" stroke-width="2"/><line x1="35" y1="187" x2="285" y2="187" stroke="#64748B"/><line x1="160" y1="55" x2="160" y2="315" stroke="#64748B"/><path d="M160 187C190 165 210 198 182 221C143 253 101 204 123 151C153 80 251 112 270 202" fill="none" stroke="#C24135" stroke-width="4"/><circle cx="160" cy="187" r="7" fill="#1F2937"/><text x="160" y="382" text-anchor="middle" font-size="15" fill="#64748B">|1±iη|=√(1+η²)&gt;1</text></g>
<g transform="translate(825,105)"><text x="160" y="0" text-anchor="middle" font-size="19" font-weight="700" fill="#0F766E">阻尼 / look-ahead：向内</text><rect x="0" y="25" width="320" height="325" rx="8" fill="#E8F5F1" stroke="#0F766E" stroke-width="2"/><line x1="35" y1="187" x2="285" y2="187" stroke="#64748B"/><line x1="160" y1="55" x2="160" y2="315" stroke="#64748B"/><path d="M275 105C295 203 209 281 132 244C72 215 98 145 151 139C190 135 210 174 188 201C174 219 153 206 160 187" fill="none" stroke="#0F766E" stroke-width="4"/><circle cx="160" cy="187" r="7" fill="#1F2937"/><text x="160" y="382" text-anchor="middle" font-size="15" fill="#64748B">具体算法、步长与正则决定</text></g>
<line x1="54" y1="538" x2="1146" y2="538" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="575" font-size="16" fill="#1F2937">stationary、local Nash、连续稳定与离散算法收敛是四个不同命题。</text></g></svg>

