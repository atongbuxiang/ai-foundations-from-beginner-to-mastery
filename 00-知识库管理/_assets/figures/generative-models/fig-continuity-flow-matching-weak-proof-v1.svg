<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Flow Matching 的弱形式证明路线</title>
<desc id="desc">左侧画可采样的条件轨迹和速度，中间按当前位置取条件平均，右侧通过测试函数的期望导数、塔式法则和分部积分得到连续性方程。</desc>
<rect width="1200" height="620" fill="#FFFEFB"/>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker></defs>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}.amber{fill:#B7791F}.curve{fill:none;stroke-linecap:round}</style>
<text x="58" y="48" font-size="20" font-weight="700" class="ink">A　conditional paths</text><text x="442" y="48" font-size="20" font-weight="700" class="ink">B　posterior average at x</text><text x="795" y="48" font-size="20" font-weight="700" class="ink">C　test-function identity</text>
<line x1="390" y1="75" x2="390" y2="540" stroke="#D7DEE8" stroke-width="2"/><line x1="748" y1="75" x2="748" y2="540" stroke="#D7DEE8" stroke-width="2"/>
<line x1="85" y1="475" x2="350" y2="475" stroke="#64748B" stroke-width="2"/><line x1="85" y1="475" x2="85" y2="95" stroke="#64748B" stroke-width="2"/>
<text x="337" y="503" font-size="15" class="muted">t</text><text x="58" y="105" font-size="15" class="muted">state</text>
<path d="M95 420 C170 395 215 150 342 120" class="curve" stroke="#2563EB" stroke-width="3"/><path d="M95 330 C185 315 238 360 342 260" class="curve" stroke="#2563EB" stroke-width="3" opacity=".72"/><path d="M95 175 C180 240 255 435 342 410" class="curve" stroke="#2563EB" stroke-width="3" opacity=".5"/>
<circle cx="220" cy="244" r="7" fill="#2563EB"/><circle cx="220" cy="326" r="7" fill="#2563EB"/><circle cx="220" cy="365" r="7" fill="#2563EB"/><g stroke="#B7791F" stroke-width="3" marker-end="url(#arr)"><path d="M220 244L252 204"/><path d="M220 326L258 310"/><path d="M220 365L255 404"/></g><text x="112" y="535" font-size="16" class="muted">U(t) = path derivative; Z is observed in training</text>
<circle cx="565" cy="300" r="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/><text x="548" y="338" font-size="16" class="blue">x(t)</text>
<g stroke="#B7791F" stroke-width="3" opacity=".7" marker-end="url(#arr)"><path d="M565 300L505 215"/><path d="M565 300L640 260"/><path d="M565 300L615 390"/></g>
<path d="M565 300L615 275" stroke="#0F766E" stroke-width="5" marker-end="url(#arr)"/><text x="445" y="448" font-size="18" class="green">v(x,t) = E[ U | X=x ]</text><text x="445" y="483" font-size="15" class="muted">network sees only x,t during generation</text>
<g font-size="17" class="ink"><text x="790" y="123">1　d/dt E[ phi(X(t)) ]</text><text x="824" y="167">= E[ grad phi(X) · U ]</text><text x="790" y="230">2　tower property</text><text x="824" y="274">= E[ grad phi(X) · E(U|X) ]</text><text x="790" y="337">3　write as density integral</text><text x="824" y="381">= integral grad phi · v p dx</text><text x="790" y="444">4　integration by parts</text><text x="824" y="488" class="green">partial_t p + div(p v) = 0</text></g>
<path d="M790 516H1112" stroke="#0F766E" stroke-width="3"/><text x="790" y="542" font-size="15" class="muted">for all smooth test functions phi</text>
<text x="58" y="590" font-size="15" class="muted">弱证明只需比较所有 test functions 的期望变化；它不宣称 velocity 唯一，也不包含 neural approximation 与 finite-NFE 误差。</text>
</svg>
