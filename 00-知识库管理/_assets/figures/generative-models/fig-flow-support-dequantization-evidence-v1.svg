<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Flow 的支持集、反量化和 TARFlow 部署证据账</title><desc id="desc">三栏展示离散概率质量与连续反量化下界、经典双射的支持限制，以及 TARFlow 核心流到去噪和引导输出的分布变化。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}</style>
<text x="54" y="52" font-size="23" font-weight="700" class="ink">Exact continuous density 到最终部署样本，中间仍隔着三组边界</text><line x1="400" y1="88" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/><line x1="800" y1="88" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="58" y="105" font-size="19" font-weight="700" class="blue">A　离散质量与 dequantization</text><rect x="72" y="142" width="135" height="100" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="139" y="182" text-anchor="middle" font-size="18" class="ink">离散 x</text><text x="139" y="212" text-anchor="middle" font-size="15" class="muted">一个 bin</text><path d="M207 192H270" stroke="#2563EB" stroke-width="3"/><polygon points="270,192 254,183 254,201" fill="#2563EB"/><text x="238" y="170" text-anchor="middle" font-size="15" class="blue">+u</text><rect x="270" y="142" width="100" height="100" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><path d="M278 225 C300 210 320 155 362 165" fill="none" stroke="#2563EB" stroke-width="3"/><text x="320" y="265" text-anchor="middle" font-size="15" class="ink">y=x+u</text><text x="58" y="320" font-size="17" class="ink">P(x)=∫bin pc(x+u)du</text><text x="58" y="360" font-size="17" font-weight="700" class="green">log P(x) ≥ Eq[log pc−log q]</text><text x="58" y="410" font-size="16" fill="#C24135">density value ≠ discrete pmf</text><text x="58" y="450" font-size="15" class="muted">bpd 比较须统一位深、noise、logit Jacobian</text>
<text x="430" y="105" font-size="19" font-weight="700" class="green">B　经典双射的 support 门</text><rect x="438" y="142" width="320" height="250" rx="12" fill="#F2FBF8" stroke="#0F766E" stroke-width="2"/><ellipse cx="598" cy="250" rx="125" ry="72" fill="#E8F5F1" stroke="#0F766E" stroke-width="3"/><ellipse cx="598" cy="250" rx="52" ry="28" fill="#FFFEFB" stroke="#C24135" stroke-width="2" stroke-dasharray="7 6"/><text x="598" y="205" text-anchor="middle" font-size="16" class="ink">base 处处正 + diffeomorphism</text><text x="598" y="256" text-anchor="middle" font-size="16" fill="#C24135">不能产生真正零密度洞</text><text x="598" y="300" text-anchor="middle" font-size="15" class="muted">可以压到很低，但仍非零</text><text x="430" y="430" font-size="16" class="ink">同维、连通性、低维奇异 support</text><text x="430" y="468" font-size="15" class="muted">噪声/增广/随机映射会改变模型合同</text>
<text x="830" y="105" font-size="19" font-weight="700" fill="#B7791F">C　TARFlow 的部署分布</text><rect x="840" y="145" width="260" height="64" rx="8" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="970" y="174" text-anchor="middle" font-size="17" class="ink">Gaussian-augmented target</text><text x="970" y="198" text-anchor="middle" font-size="15" class="muted">训练分布</text><path d="M970 209V252" stroke="#2563EB" stroke-width="3"/><polygon points="970,252 961,236 979,236" fill="#2563EB"/><rect x="840" y="252" width="260" height="64" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="970" y="281" text-anchor="middle" font-size="17" class="ink">core autoregressive flow</text><text x="970" y="305" text-anchor="middle" font-size="15" class="muted">tractable density / serial inverse</text><path d="M970 316V359" stroke="#B7791F" stroke-width="3"/><polygon points="970,359 961,343 979,343" fill="#B7791F"/><rect x="840" y="359" width="260" height="64" rx="8" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="970" y="388" text-anchor="middle" font-size="17" class="ink">post-denoise + guidance</text><text x="970" y="412" text-anchor="middle" font-size="15" fill="#C24135">部署分布再次改变</text><text x="830" y="466" font-size="15" class="muted">质量、覆盖、likelihood、latency 分别报告</text>
<line x1="54" y1="540" x2="1146" y2="540" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="580" font-size="16" class="muted">前沿结论按指定数据、预算与 evaluator 成立；后续论文不能回写成原 TARFlow 已经证明的普遍家族胜负。</text>
</svg>
