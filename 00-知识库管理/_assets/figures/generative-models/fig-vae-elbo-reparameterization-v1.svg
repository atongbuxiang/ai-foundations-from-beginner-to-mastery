<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ELBO 恒等式与重参数化计算图</title>
  <desc id="desc">左侧显示ELBO加后验KL等于对数证据，右侧显示固定高斯噪声经过均值方差变换产生潜变量并传递路径梯度。</desc>
  <defs><marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs>
  <rect width="1200" height="620" fill="#FFFEFB"/>
  <style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style>
  <g font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="54" y="55" font-size="23" font-weight="700" fill="#1F2937">同一个 ELBO：左边是概率恒等式，右边是可微估计程序</text>
    <text x="66" y="103" font-size="20" font-weight="700" fill="#2563EB">A　下界与缺口</text>
    <line x1="120" y1="430" x2="504" y2="430" stroke="#334155" stroke-width="2"/>
    <line x1="120" y1="180" x2="504" y2="180" stroke="#2563EB" stroke-width="5"/>
    <line x1="120" y1="335" x2="504" y2="335" stroke="#0F766E" stroke-width="5"/>
    <text x="132" y="163" font-size="19" font-weight="700" fill="#2563EB">log pθ(x)</text>
    <text x="132" y="320" font-size="19" font-weight="700" fill="#0F766E">L(θ,φ;x)</text>
    <path d="M450 332 V185" stroke="#C24135" stroke-width="3" marker-end="url(#arr3)"/>
    <text x="438" y="262" text-anchor="end" font-size="17" fill="#C24135">KL(qφ || pθ posterior)</text>
    <rect x="110" y="466" width="405" height="66" rx="7" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="2"/>
    <text x="312" y="495" text-anchor="middle" font-size="16" fill="#334155">log evidence = ELBO + posterior KL</text>
    <text x="312" y="519" text-anchor="middle" font-size="15" fill="#64748B">等号条件：qφ(z|x)=pθ(z|x)</text>
    <line x1="588" y1="92" x2="588" y2="550" stroke="#D7DEE8" stroke-width="2"/>
    <text x="632" y="103" font-size="20" font-weight="700" fill="#0F766E">B　固定噪声的 pathwise gradient</text>
    <circle cx="698" cy="212" r="48" fill="#EEF3FF" stroke="#2563EB" stroke-width="3"/>
    <text x="698" y="204" text-anchor="middle" font-size="21" font-weight="700" fill="#2563EB">ε</text>
    <text x="698" y="231" text-anchor="middle" font-size="15" fill="#64748B">N(0,I)</text>
    <rect x="634" y="345" width="128" height="79" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
    <text x="698" y="376" text-anchor="middle" font-size="18" fill="#334155">μ φ(x)</text>
    <text x="698" y="404" text-anchor="middle" font-size="18" fill="#334155">σ φ(x)</text>
    <path d="M746 212 H857" stroke="#334155" stroke-width="3" marker-end="url(#arr3)"/>
    <path d="M762 384 C810 362 825 287 857 258" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arr3)"/>
    <circle cx="910" cy="239" r="55" fill="#FFF7E6" stroke="#B7791F" stroke-width="3"/>
    <text x="910" y="232" text-anchor="middle" font-size="22" font-weight="700" fill="#B7791F">z</text>
    <text x="910" y="259" text-anchor="middle" font-size="14" fill="#64748B">μ+σ⊙ε</text>
    <path d="M965 239 H1055" stroke="#334155" stroke-width="3" marker-end="url(#arr3)"/>
    <rect x="1057" y="179" width="112" height="120" rx="8" fill="#E8F5F1" stroke="#0F766E" stroke-width="3"/>
    <text x="1113" y="218" text-anchor="middle" font-size="16" fill="#64748B">decoder</text>
    <text x="1113" y="249" text-anchor="middle" font-size="20" font-weight="700" fill="#0F766E">log pθ</text>
    <text x="1113" y="276" text-anchor="middle" font-size="15" fill="#64748B">(x|z)</text>
    <path d="M1113 310 C1096 467 821 495 703 435" fill="none" stroke="#C24135" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arr3)"/>
    <text x="924" y="500" text-anchor="middle" font-size="17" fill="#C24135">梯度沿确定性路径回传到 φ；ε 的分布不依赖 φ</text>
    <text x="632" y="557" font-size="15" fill="#64748B">有限 Monte Carlo 仍有方差；重参数化不是“去掉随机性”。</text>
  </g>
</svg>
