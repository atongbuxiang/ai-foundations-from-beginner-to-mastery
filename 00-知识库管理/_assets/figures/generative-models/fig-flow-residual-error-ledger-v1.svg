<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Residual flow 的可逆证书和误差账</title><desc id="desc">三栏分别展示压缩映射可逆性、有限次不动点逆和 trace series 加 Hutchinson 的 logdet 估计。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}</style>
<text x="54" y="52" font-size="23" font-weight="700" class="ink">数学可逆、有限步 inverse 与近似 logdet：三张证书不能合并</text>
<line x1="400" y1="88" x2="400" y2="500" stroke="#D7DEE8" stroke-width="2"/><line x1="800" y1="88" x2="800" y2="500" stroke="#D7DEE8" stroke-width="2"/>
<text x="58" y="105" font-size="19" font-weight="700" class="green">A　可逆性定理链</text><text x="58" y="148" font-size="18" class="ink">F(x)=x+g(x)</text><rect x="78" y="180" width="270" height="64" rx="8" fill="#E8F5F1" stroke="#0F766E" stroke-width="2"/><text x="213" y="219" text-anchor="middle" font-size="18" class="green">Lip(g)=L&lt;1</text><path d="M213 244V290" stroke="#0F766E" stroke-width="3"/><polygon points="213,290 204,274 222,274" fill="#0F766E"/><rect x="78" y="290" width="270" height="64" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="213" y="329" text-anchor="middle" font-size="17" class="ink">Tᵧ(x)=y−g(x) 是压缩</text><path d="M213 354V400" stroke="#0F766E" stroke-width="3"/><polygon points="213,400 204,384 222,384" fill="#0F766E"/><text x="213" y="438" text-anchor="middle" font-size="18" font-weight="700" class="green">唯一 inverse + 几何收敛</text>
<text x="430" y="105" font-size="19" font-weight="700" class="blue">B　有限次 inverse</text><text x="430" y="148" font-size="18" class="ink">x(k+1)=y−g(x(k))</text><circle cx="470" cy="230" r="13" fill="#64748B"/><circle cx="550" cy="268" r="13" fill="#64748B"/><circle cx="630" cy="300" r="13" fill="#2563EB"/><circle cx="710" cy="322" r="13" fill="#0F766E"/><path d="M483 235L537 262M563 273L617 295M643 304L697 318" fill="none" stroke="#2563EB" stroke-width="3"/><text x="570" y="365" text-anchor="middle" font-size="17" class="ink">误差约按 L 的 k 次方缩小</text><text x="570" y="405" text-anchor="middle" font-size="16" fill="#C24135">L→1：定理仍成立，迭代却很慢</text><text x="570" y="450" text-anchor="middle" font-size="16" class="muted">报告 ‖F(xK)−y‖ 与 tolerance</text>
<text x="830" y="105" font-size="19" font-weight="700" fill="#B7791F">C　likelihood 估计</text><text x="830" y="148" font-size="17" class="ink">logdet(I+Jg)</text><rect x="835" y="180" width="280" height="86" rx="8" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="975" y="214" text-anchor="middle" font-size="17" class="ink">sum (−1)^(k+1) tr(Jg^k)/k</text><text x="975" y="244" text-anchor="middle" font-size="15" fill="#B7791F">有限 Ktr → truncation bias</text><path d="M975 266V310" stroke="#B7791F" stroke-width="3"/><polygon points="975,310 966,294 984,294" fill="#B7791F"/><rect x="835" y="310" width="280" height="86" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="2"/><text x="975" y="344" text-anchor="middle" font-size="17" class="ink">tr(A)=E[vᵀAv]</text><text x="975" y="374" text-anchor="middle" font-size="15" fill="#B7791F">有限 probes → variance</text><text x="975" y="440" text-anchor="middle" font-size="16" fill="#C24135">无偏 trace ≠ 无偏有限级数</text>
<line x1="54" y1="520" x2="1146" y2="520" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="560" font-size="16" class="muted">另查：谱范数估计是否可信、最小奇异值、round-trip、随机截断尾部与 wall time。</text>
</svg>
