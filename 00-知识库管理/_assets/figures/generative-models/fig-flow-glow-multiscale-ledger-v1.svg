<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Glow 的模块与多尺度形状账</title><desc id="desc">上栏展示 ActNorm、可逆一乘一卷积与 coupling 的顺序，下栏区分 squeeze 重排和 split 保留潜变量。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}</style>
<text x="54" y="52" font-size="23" font-weight="700" class="ink">Glow：每个模块同时交付状态、logdet 与 inverse</text><text x="58" y="98" font-size="19" font-weight="700" class="blue">A　一个 flow step（编码方向）</text>
<rect x="55" y="120" width="1090" height="172" rx="12" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="2"/>
<rect x="82" y="164" width="170" height="76" rx="8" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="167" y="194" text-anchor="middle" font-size="18" font-weight="700" class="blue">ActNorm</text><text x="167" y="222" text-anchor="middle" font-size="15" class="ink">HW Σ log|sc|</text>
<path d="M252 202H320" stroke="#334155" stroke-width="3"/><polygon points="320,202 304,193 304,211" fill="#334155"/><rect x="320" y="164" width="250" height="76" rx="8" fill="#E8F5F1" stroke="#0F766E" stroke-width="2"/><text x="445" y="194" text-anchor="middle" font-size="18" font-weight="700" class="green">invertible 1×1 conv</text><text x="445" y="222" text-anchor="middle" font-size="15" class="ink">HW log|det W|</text>
<path d="M570 202H638" stroke="#334155" stroke-width="3"/><polygon points="638,202 622,193 622,211" fill="#334155"/><rect x="638" y="164" width="210" height="76" rx="8" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="743" y="194" text-anchor="middle" font-size="18" font-weight="700" fill="#B7791F">affine coupling</text><text x="743" y="222" text-anchor="middle" font-size="15" class="ink">Σ spatial scale</text>
<path d="M848 202H918" stroke="#334155" stroke-width="3"/><polygon points="918,202 902,193 902,211" fill="#334155"/><text x="1022" y="190" text-anchor="middle" font-size="17" font-weight="700" class="ink">inverse 顺序</text><text x="1022" y="220" text-anchor="middle" font-size="16" fill="#C24135">coupling → W⁻¹ → ActNorm⁻¹</text>
<text x="58" y="338" font-size="19" font-weight="700" class="green">B　multiscale：形状改变不等于维数丢失</text><rect x="55" y="360" width="1090" height="180" rx="12" fill="#F2FBF8" stroke="#D7DEE8" stroke-width="2"/>
<rect x="80" y="405" width="210" height="80" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="185" y="435" text-anchor="middle" font-size="18" class="ink">B×C×H×W</text><text x="185" y="465" text-anchor="middle" font-size="15" class="muted">元素数 BCHW</text><path d="M290 445H390" stroke="#2563EB" stroke-width="3"/><polygon points="390,445 374,436 374,454" fill="#2563EB"/><text x="340" y="425" text-anchor="middle" font-size="16" class="blue">squeeze</text>
<rect x="390" y="405" width="230" height="80" rx="8" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="505" y="435" text-anchor="middle" font-size="18" class="ink">B×4C×H/2×W/2</text><text x="505" y="465" text-anchor="middle" font-size="15" class="muted">reshape / det = 1</text><path d="M620 445H710" stroke="#0F766E" stroke-width="3"/><polygon points="710,445 694,436 694,454" fill="#0F766E"/><text x="665" y="425" text-anchor="middle" font-size="16" class="green">split</text>
<rect x="710" y="390" width="180" height="62" rx="8" fill="#E8F5F1" stroke="#0F766E" stroke-width="2"/><text x="800" y="428" text-anchor="middle" font-size="18" class="ink">z⁽¹⁾ 保留</text><rect x="710" y="466" width="180" height="62" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="800" y="504" text-anchor="middle" font-size="18" class="ink">h′ 继续变换</text><text x="925" y="425" font-size="17" class="ink">最终 latent：</text><text x="925" y="463" font-size="19" font-weight="700" class="green">z=(z⁽¹⁾,z⁽²⁾,…)</text><text x="925" y="500" font-size="15" class="muted">所有 chunk 都参与生成</text>
<text x="54" y="580" font-size="16" class="muted">LU 让 log|det W| 读取对角更便宜；仍须检查最小奇异值、ActNorm 首批初始化与 round-trip。</text>
</svg>
