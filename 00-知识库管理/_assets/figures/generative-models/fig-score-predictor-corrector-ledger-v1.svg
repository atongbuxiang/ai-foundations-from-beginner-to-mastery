<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Predictor跨时间推进与Corrector固定层重平衡</title><desc id="desc">左侧时间轴显示预测器跨噪声层移动，中间放大一个层显示校正器朗之万环，右侧列出各自误差和计算预算。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker></defs><g>
<text x="54" y="52" font-size="23" font-weight="700" fill="#1F2937">Predictor 搬运时间；Corrector 在当前时间层做有限 MCMC</text>
<text x="58" y="99" font-size="19" font-weight="700" fill="#2563EB">A　跨时间 marginal evolution</text><rect x="55" y="117" width="490" height="360" rx="10" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><line x1="115" y1="300" x2="485" y2="300" stroke="#94A3B8" stroke-width="3"/><circle cx="135" cy="300" r="24" fill="#D8E5FF" stroke="#2563EB" stroke-width="3"/><circle cx="245" cy="300" r="21" fill="#D8E5FF" stroke="#2563EB" stroke-width="3"/><circle cx="355" cy="300" r="18" fill="#D8E5FF" stroke="#2563EB" stroke-width="3"/><circle cx="465" cy="300" r="15" fill="#2563EB"/><path d="M161 300H222M268 300H334M376 300H447" stroke="#2563EB" stroke-width="4" marker-end="url(#arr)"/><text x="135" y="348" text-anchor="middle" font-size="14" fill="#64748B">p<tspan baseline-shift="sub" font-size="11">T</tspan> / prior</text><text x="245" y="348" text-anchor="middle" font-size="14" fill="#64748B">p<tspan baseline-shift="sub" font-size="11">tᵢ</tspan></text><text x="355" y="348" text-anchor="middle" font-size="14" fill="#64748B">p<tspan baseline-shift="sub" font-size="11">tᵢ₋₁</tspan></text><text x="465" y="348" text-anchor="middle" font-size="14" fill="#2563EB">p<tspan baseline-shift="sub" font-size="11">0</tspan></text><text x="300" y="204" text-anchor="middle" font-size="17" fill="#1F2937">Predictor：reverse SDE/ODE 的有限步推进</text><text x="300" y="416" text-anchor="middle" font-size="15" fill="#C24135">负责 time discretization；不是 equilibrium sampler</text>
<path d="M545 296H590" stroke="#334155" stroke-width="3"/><polygon points="590,296 576,288 576,304" fill="#334155"/><text x="567" y="274" text-anchor="middle" font-size="14" fill="#64748B">放大一层</text>
<text x="605" y="99" font-size="19" font-weight="700" fill="#0F766E">B　固定 t 的局部 relaxation</text><rect x="600" y="117" width="300" height="360" rx="10" fill="#F2FBF8" stroke="#0F766E" stroke-width="2"/><ellipse cx="750" cy="295" rx="105" ry="76" fill="#D8F0E9" stroke="#0F766E" stroke-width="3"/><circle cx="675" cy="260" r="10" fill="#C24135"/><text x="650" y="240" font-size="14" fill="#C24135">predictor landing</text><path d="M688 263C725 244 783 246 814 277C843 307 807 351 760 354C716 357 677 331 690 298" fill="none" stroke="#0F766E" stroke-width="4" stroke-dasharray="8 5"/><circle cx="690" cy="298" r="8" fill="#0F766E"/><text x="750" y="397" text-anchor="middle" font-size="16" fill="#0F766E">M 次 Langevin corrector</text><text x="750" y="426" text-anchor="middle" font-size="14" fill="#64748B">目标：当前 learned p<tspan baseline-shift="sub" font-size="11">t</tspan></text><text x="750" y="452" text-anchor="middle" font-size="14" fill="#C24135">有限 M 不保证已混合</text>
<text x="930" y="99" font-size="19" font-weight="700" fill="#B7791F">C　误差—预算账</text><rect x="925" y="117" width="220" height="360" rx="10" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="950" y="158" font-size="16" font-weight="700" fill="#1F2937">Predictor</text><text x="950" y="189" font-size="14" fill="#64748B">• time grid</text><text x="950" y="216" font-size="14" fill="#64748B">• solver order</text><text x="950" y="243" font-size="14" fill="#64748B">• score error</text><line x1="948" y1="270" x2="1122" y2="270" stroke="#D7DEE8" stroke-width="2"/><text x="950" y="305" font-size="16" font-weight="700" fill="#1F2937">Corrector</text><text x="950" y="336" font-size="14" fill="#64748B">• step size</text><text x="950" y="363" font-size="14" fill="#64748B">• mixing</text><text x="950" y="390" font-size="14" fill="#64748B">• ULA bias</text><line x1="948" y1="414" x2="1122" y2="414" stroke="#D7DEE8" stroke-width="2"/><text x="950" y="446" font-size="15" font-weight="700" fill="#C24135">总 NFE = 两者之和</text>
<line x1="54" y1="521" x2="1146" y2="521" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="557" font-size="16" fill="#1F2937">Corrector 不观察真实误差向量；它只按当前 learned score 做局部 Markov moves。</text><text x="54" y="585" font-size="15" fill="#64748B">公平比较必须 compute-match score evaluations、wall time、最后去噪与随机性。</text>
</g></svg>
