<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">GAN生成器损失的梯度与f-GAN选择</title><desc id="desc">左侧画判别概率从零到一时饱和与非饱和生成器损失的logit梯度系数，右侧区分f散度、critic变分形式和生成器代理损失。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style>
<g font-family="Inter, PingFang SC, sans-serif"><text x="54" y="54" font-size="23" font-weight="700" fill="#1F2937">相同 equilibrium，不等于相同训练向量场</text><text x="60" y="102" font-size="20" font-weight="700" fill="#2563EB">A　对 discriminator logit 的梯度系数</text>
<line x1="105" y1="438" x2="555" y2="438" stroke="#334155" stroke-width="2"/><line x1="105" y1="438" x2="105" y2="145" stroke="#334155" stroke-width="2"/><text x="560" y="466" font-size="16" fill="#334155">D(fake)</text><text x="72" y="140" font-size="16" fill="#334155">|slope|</text>
<path d="M105 438L540 160" fill="none" stroke="#C24135" stroke-width="4"/><path d="M105 160L540 438" fill="none" stroke="#0F766E" stroke-width="4"/><text x="355" y="218" font-size="17" font-weight="700" fill="#C24135">non-sat: 1−D</text><text x="349" y="405" font-size="17" font-weight="700" fill="#0F766E">saturating: D</text><text x="105" y="482" font-size="15" fill="#64748B">D≈0 时：non-sat 信号强，saturating 系数接近 0</text>
<line x1="610" y1="90" x2="610" y2="530" stroke="#D7DEE8" stroke-width="2"/><text x="650" y="102" font-size="20" font-weight="700" fill="#B7791F">B　f-GAN 的三次独立选择</text>
<rect x="650" y="143" width="490" height="82" rx="8" fill="#FFF7E6" stroke="#B7791F" stroke-width="2"/><text x="680" y="175" font-size="17" font-weight="700" fill="#B7791F">1　population divergence</text><text x="680" y="204" font-size="16" fill="#334155">f、方向 Df(P||Q)、support 条件</text>
<rect x="680" y="252" width="460" height="82" rx="8" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="710" y="284" font-size="17" font-weight="700" fill="#2563EB">2　variational critic</text><text x="710" y="313" font-size="16" fill="#334155">T domain、f*、受限 neural class</text>
<rect x="710" y="361" width="430" height="82" rx="8" fill="#FFF0EE" stroke="#C24135" stroke-width="2"/><text x="740" y="393" font-size="17" font-weight="700" fill="#C24135">3　generator surrogate</text><text x="740" y="422" font-size="16" fill="#334155">saturating / non-saturating / heuristic</text>
<text x="650" y="489" font-size="15" fill="#64748B">每一层都可改变 gradient、bias 与 dynamics；不能只报“使用 f-GAN”。</text><line x1="54" y1="548" x2="1146" y2="548" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="582" font-size="16" fill="#1F2937">完整 generator gradient 还乘 ∇x fψ(x) 与 ∇θGθ(z)；图中只隔离 logistic 系数。</text></g></svg>

