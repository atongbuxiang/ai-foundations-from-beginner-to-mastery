<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">生成方向与编码方向的变量替换账</title><desc id="desc">基分布的小体积经可逆映射变为数据空间体积，并并列展示编码和生成两种等价密度公式。</desc>
<rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}</style>
<text x="54" y="52" font-size="23" font-weight="700" class="ink">同一份概率质量：生成映射放大体积，密度按反比例缩小</text>
<text x="70" y="98" font-size="18" font-weight="700" class="blue">BASE SPACE</text><rect x="55" y="118" width="300" height="300" rx="12" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="2"/>
<ellipse cx="205" cy="260" rx="65" ry="100" fill="#EEF3FF" stroke="#2563EB" stroke-width="3"/><circle cx="205" cy="260" r="7" fill="#2563EB"/><text x="205" y="292" text-anchor="middle" font-size="18" class="ink">z，体积 dz</text><text x="205" y="330" text-anchor="middle" font-size="16" class="muted">质量 ≈ pZ(z) dz</text>
<path d="M375 250 C455 180 505 180 585 250" fill="none" stroke="#2563EB" stroke-width="4"/><polygon points="585,250 567,238 568,258" fill="#2563EB"/><text x="480" y="180" text-anchor="middle" font-size="19" font-weight="700" class="blue">x = g(z)</text><text x="480" y="210" text-anchor="middle" font-size="16" class="muted">局部体积 × |det Jg|</text>
<path d="M585 330 C505 400 455 400 375 330" fill="none" stroke="#0F766E" stroke-width="4"/><polygon points="375,330 393,318 392,338" fill="#0F766E"/><text x="480" y="398" text-anchor="middle" font-size="19" font-weight="700" class="green">z = f(x)</text>
<text x="615" y="98" font-size="18" font-weight="700" class="green">DATA SPACE</text><rect x="600" y="118" width="300" height="300" rx="12" fill="#F2FBF8" stroke="#D7DEE8" stroke-width="2"/>
<ellipse cx="750" cy="260" rx="115" ry="62" fill="#E8F5F1" stroke="#0F766E" stroke-width="3"/><circle cx="750" cy="260" r="7" fill="#0F766E"/><text x="750" y="292" text-anchor="middle" font-size="18" class="ink">x，体积 dx</text><text x="750" y="330" text-anchor="middle" font-size="16" class="muted">同一质量 ≈ pX(x) dx</text>
<rect x="930" y="118" width="220" height="300" rx="12" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="1040" y="158" text-anchor="middle" font-size="18" font-weight="700" fill="#B7791F">局部体积账</text><text x="1040" y="210" text-anchor="middle" font-size="18" class="ink">dx = |det Jg| dz</text><text x="1040" y="258" text-anchor="middle" font-size="18" class="ink">pf = pz · |det Jf|</text><text x="1040" y="306" text-anchor="middle" font-size="18" class="ink">Jf = (Jg)⁻¹</text><text x="1040" y="360" text-anchor="middle" font-size="16" fill="#C24135">先定方向，再定符号</text>
<line x1="54" y1="458" x2="1146" y2="458" stroke="#D7DEE8" stroke-width="2"/><text x="65" y="500" font-size="18" font-weight="700" class="green">编码｜log pX(x) = log pZ(f(x)) + log |det Jf(x)|</text><text x="65" y="540" font-size="18" font-weight="700" class="blue">生成｜log pX(g(z)) = log pZ(z) − log |det Jg(z)|</text><text x="65" y="580" font-size="16" class="muted">两式在对应点相等；exact 指模型 density 可算，不代表离散 pmf、浮点 inverse 或语义质量自动正确。</text>
</svg>
