<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">能量模型得分模型去噪器生成对抗网络与扩散模型的接口证据等级</title><desc id="desc">中心关系图用实线虚线点线区分定义恒等式、算法接口和经验类比，并在底部列出各家族采样器。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style><g>
<text x="54" y="52" font-size="23" font-weight="700" fill="#1F2937">关系不是一张“万物等价图”：先看线型，再读概念</text>
<g font-size="14"><line x1="65" y1="86" x2="125" y2="86" stroke="#0F766E" stroke-width="4"/><text x="138" y="91" fill="#1F2937">定义/定理（带条件）</text><line x1="330" y1="86" x2="390" y2="86" stroke="#2563EB" stroke-width="3" stroke-dasharray="9 6"/><text x="403" y="91" fill="#1F2937">算法接口</text><line x1="530" y1="86" x2="590" y2="86" stroke="#C24135" stroke-width="3" stroke-dasharray="2 7"/><text x="603" y="91" fill="#1F2937">经验类比/待证机制</text></g>
<rect x="80" y="145" width="250" height="95" rx="11" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="205" y="181" text-anchor="middle" font-size="19" font-weight="700" fill="#B7791F">Energy Eθ(x)</text><text x="205" y="214" text-anchor="middle" font-size="15" fill="#64748B">pθ ∝ exp(−Eθ)</text>
<rect x="475" y="145" width="250" height="95" rx="11" fill="#F2FBF8" stroke="#0F766E" stroke-width="2"/><text x="600" y="181" text-anchor="middle" font-size="19" font-weight="700" fill="#0F766E">Score sθ(x,t)</text><text x="600" y="214" text-anchor="middle" font-size="15" fill="#64748B">≈ ∇x log p<tspan baseline-shift="sub" font-size="11">t</tspan>(x)</text>
<rect x="870" y="145" width="250" height="95" rx="11" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="995" y="181" text-anchor="middle" font-size="19" font-weight="700" fill="#2563EB">Denoiser rθ(x,t)</text><text x="995" y="214" text-anchor="middle" font-size="15" fill="#64748B">posterior mean target</text>
<path d="M330 192H475" stroke="#0F766E" stroke-width="4"/><polygon points="475,192 461,184 461,200" fill="#0F766E"/><text x="402" y="174" text-anchor="middle" font-size="14" fill="#0F766E">s=−∇E</text><path d="M725 192H870" stroke="#0F766E" stroke-width="4"/><polygon points="870,192 856,184 856,200" fill="#0F766E"/><text x="798" y="174" text-anchor="middle" font-size="14" fill="#0F766E">r*=x+σ²s</text>
<rect x="80" y="320" width="250" height="95" rx="11" fill="#FFF0EE" stroke="#C24135" stroke-width="2"/><text x="205" y="356" text-anchor="middle" font-size="19" font-weight="700" fill="#C24135">GAN critic / logit</text><text x="205" y="389" text-anchor="middle" font-size="15" fill="#64748B">best response: log p*−log p<tspan baseline-shift="sub" font-size="11">g</tspan></text>
<rect x="475" y="320" width="250" height="95" rx="11" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="600" y="356" text-anchor="middle" font-size="19" font-weight="700" fill="#2563EB">Diffusion path {p<tspan baseline-shift="sub" font-size="13">t</tspan>}</text><text x="600" y="389" text-anchor="middle" font-size="15" fill="#64748B">forward noise + reverse solver</text>
<rect x="870" y="320" width="250" height="95" rx="11" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="995" y="356" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">Implicit generator G(z)</text><text x="995" y="389" text-anchor="middle" font-size="15" fill="#64748B">one-pass pushforward samples</text>
<path d="M205 240V320" stroke="#C24135" stroke-width="3" stroke-dasharray="2 7"/><text x="220" y="285" font-size="14" fill="#C24135">energy intuition</text><path d="M600 240V320" stroke="#2563EB" stroke-width="3" stroke-dasharray="9 6"/><text x="615" y="285" font-size="14" fill="#2563EB">time-indexed field</text><path d="M330 367C510 490 780 490 870 367" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="9 6"/><text x="600" y="475" text-anchor="middle" font-size="14" fill="#2563EB">critic signal trains generator；不等于 exact EBM model phase</text>
<rect x="72" y="510" width="1056" height="65" rx="8" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="2"/><text x="95" y="537" font-size="15" font-weight="700" fill="#1F2937">Sampler：</text><text x="190" y="537" font-size="15" fill="#B7791F">EBM → MCMC</text><text x="390" y="537" font-size="15" fill="#0F766E">Score → Langevin / reverse solver</text><text x="725" y="537" font-size="15" fill="#2563EB">Diffusion → multi-step path</text><text x="970" y="537" font-size="15" fill="#C24135">GAN → G forward</text><text x="95" y="562" font-size="14" fill="#64748B">同样能“把样本往真实方向推”不等于 density、objective、equilibrium 或计算成本相同。</text>
</g></svg>
