<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">得分匹配通过数据梯度和分部积分消去未知量</title><desc id="desc">流程图显示配分函数因对数据求导消失，真实数据得分再由分部积分转化为模型散度，同时保留边界项。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style><g>
<text x="54" y="52" font-size="23" font-weight="700" fill="#1F2937">Score Matching 有两次“消去”，理由完全不同</text>
<text x="65" y="103" font-size="19" font-weight="700" fill="#2563EB">① 对数据坐标求导：Zθ 是常数</text><rect x="60" y="122" width="500" height="126" rx="10" fill="#EEF3FF" stroke="#2563EB" stroke-width="2"/><text x="310" y="162" text-anchor="middle" font-size="19" fill="#1F2937">log pθ(x) = −Eθ(x) − log Zθ</text><path d="M310 178V201" stroke="#2563EB" stroke-width="3"/><polygon points="310,211 302,197 318,197" fill="#2563EB"/><text x="310" y="229" text-anchor="middle" font-size="20" font-weight="700" fill="#2563EB">sθ(x)=∇x log pθ(x)=−∇xEθ(x)</text>
<text x="635" y="103" font-size="19" font-weight="700" fill="#0F766E">② 展开 Fisher divergence</text><rect x="625" y="122" width="515" height="126" rx="10" fill="#F2FBF8" stroke="#0F766E" stroke-width="2"/><text x="882" y="163" text-anchor="middle" font-size="19" fill="#1F2937">½ E<tspan baseline-shift="sub" font-size="13">p*</tspan> ‖sθ − s*‖²</text><text x="882" y="201" text-anchor="middle" font-size="17" fill="#0F766E">= E[½‖sθ‖² − sθᵀs*] + constant</text><text x="882" y="229" text-anchor="middle" font-size="14" fill="#64748B">未知项：−∫ sθ,i(x) ∂i p*(x) dx</text>
<path d="M882 248V292" stroke="#334155" stroke-width="3"/><polygon points="882,292 874,278 890,278" fill="#334155"/><text x="900" y="275" font-size="14" fill="#64748B">分部积分</text>
<rect x="170" y="300" width="860" height="132" rx="10" fill="#FFFFFF" stroke="#B7791F" stroke-width="2"/><text x="600" y="337" text-anchor="middle" font-size="18" fill="#1F2937">−∫ sθ,i ∂i p* dx　=　− [p*sθ,i]<tspan baseline-shift="sub" font-size="13">∂Ω</tspan>　+　∫ p* ∂i sθ,i dx</text><rect x="208" y="361" width="280" height="43" rx="6" fill="#FFF0EE" stroke="#C24135" stroke-width="2"/><text x="348" y="389" text-anchor="middle" font-size="16" fill="#C24135">boundary flux 必须为 0</text><rect x="570" y="361" width="420" height="43" rx="6" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="780" y="389" text-anchor="middle" font-size="16" fill="#B7791F">得到 E[div sθ]，只需数据样本与模型导数</text>
<path d="M600 432V467" stroke="#334155" stroke-width="3"/><polygon points="600,467 592,453 608,453" fill="#334155"/><rect x="270" y="472" width="660" height="62" rx="9" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="600" y="511" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2937">J<tspan baseline-shift="sub" font-size="14">SM</tspan> = E<tspan baseline-shift="sub" font-size="14">p*</tspan>[ ½‖sθ‖² + div sθ ]　(+ constant)</text>
<text x="54" y="574" font-size="16" fill="#1F2937">若 support 有边界、是离散空间或边界通量不消失，最后一框必须改写，不能只说“Z 已消去”。</text>
</g></svg>
