<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs><style>.t{font-family:Inter,'Noto Sans SC',sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.s{font-size:16px}.mut{font-size:14px;fill:#687487}.cell{fill:#fffdf8;stroke:#c6bdad}.yes{fill:#dfeee0}.mid{fill:#fff1c9}.risk{fill:#f2dedd}.blue{fill:#e5edf7}.lab{font-weight:700;font-size:16px}</style></defs>
  <rect width="1200" height="620" fill="#f4f0e7"/>
  <text x="48" y="48" class="t h">VQ 改进：先定位“改哪一层”，再读证据</text>
  <rect x="48" y="83" width="1104" height="168" rx="12" fill="#fffdf8" stroke="#3b5069" stroke-width="2"/>
  <text x="72" y="117" class="t lab">Encoder z</text><text x="248" y="117" class="t lab">量化几何</text><text x="447" y="117" class="t lab">代理 backward</text><text x="665" y="117" class="t lab">code 参数化</text><text x="890" y="117" class="t lab">loss / update</text>
  <g class="t s" text-anchor="middle"><rect x="60" y="145" width="160" height="70" rx="8" class="blue" stroke="#526f9b"/><text x="140" y="176">VQ / FSQ</text><text x="140" y="199">连续 latent</text><rect x="238" y="145" width="180" height="70" rx="8" class="mid" stroke="#a98027"/><text x="328" y="176">nearest center</text><text x="328" y="199">或 scalar round</text><rect x="436" y="145" width="200" height="70" rx="8" class="risk" stroke="#a34f45"/><text x="536" y="176">I / Rotation G</text><text x="536" y="199">/ DiVeQ path</text><rect x="654" y="145" width="200" height="70" rx="8" class="yes" stroke="#4f7d4c"/><text x="754" y="176">E 或 QW</text><text x="754" y="199">shared basis</text><rect x="872" y="145" width="250" height="70" rx="8" fill="#ede8f5" stroke="#735e99"/><text x="997" y="176">Aux / EMA / none</text><text x="997" y="199">optimizer contract</text></g>
  <text x="48" y="289" class="t h" font-size="20">方法—接口—证据矩阵</text>
  <g transform="translate(48 310)">
    <rect width="1104" height="250" rx="8" fill="#fffdf8" stroke="#82796b"/>
    <g class="t lab"><text x="22" y="32">方法</text><text x="172" y="32">直接改动</text><text x="418" y="32">可由代数直接说</text><text x="690" y="32">仍需实验</text><text x="936" y="32">主要风险</text></g>
    <g stroke="#d1c8b8"><line x1="0" y1="47" x2="1104" y2="47"/><line x1="0" y1="96" x2="1104" y2="96"/><line x1="0" y1="145" x2="1104" y2="145"/><line x1="0" y1="194" x2="1104" y2="194"/><line x1="150" y1="0" x2="150" y2="250"/><line x1="394" y1="0" x2="394" y2="250"/><line x1="665" y1="0" x2="665" y2="250"/><line x1="910" y1="0" x2="910" y2="250"/></g>
    <g class="t s"><text x="22" y="78">FSQ</text><text x="172" y="78">固定标量 levels</text><text x="418" y="78">无 learned codebook</text><text x="690" y="78">率失真、组合利用</text><text x="936" y="78">低维轴对齐瓶颈</text><text x="22" y="127">Rotation</text><text x="172" y="127">surrogate Jacobian</text><text x="418" y="127">forward 仍为 hard q</text><text x="690" y="127">重构、usage、seed</text><text x="936" y="127">norm ratio / 原点</text><text x="22" y="176">SimVQ</text><text x="172" y="176">E = QW</text><text x="418" y="176">推理可合并矩阵</text><text x="690" y="176">优化改善是否稳定</text><text x="936" y="176">factorization 依赖</text><text x="22" y="225">DiVeQ</text><text x="172" y="225">error-vector gradient</text><text x="418" y="225">可无显式 Aux loss</text><text x="690" y="225">质量、collapse、噪声</text><text x="936" y="225">surrogate / 一致性</text></g>
  </g>
  <text x="48" y="597" class="t s">绿色不表示“更好”，只表示可直接核验；经验胜负必须同时看 distortion、usage、prior 与系统成本。</text>
</svg>
