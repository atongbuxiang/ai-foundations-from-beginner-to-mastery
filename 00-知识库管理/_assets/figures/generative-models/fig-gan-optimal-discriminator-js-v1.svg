<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">GAN最优判别器与JS推导边界</title><desc id="desc">从逐点凹函数最优得到D星，代回得到JS；有限神经判别器以虚线连接，表示需要额外条件。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}</style>
<g font-family="Inter, PingFang SC, sans-serif"><text x="54" y="54" font-size="23" font-weight="700" fill="#1F2937">定理链只覆盖 best response；当前 critic 不能直接跳到 JS</text>
<text x="65" y="104" font-size="20" font-weight="700" fill="#2563EB">① 逐点 concave maximization</text><rect x="65" y="135" width="315" height="160" rx="8" fill="#EEF3FF" stroke="#2563EB" stroke-width="3"/><text x="222" y="180" text-anchor="middle" font-size="19" fill="#334155">p log d + q log(1−d)</text><path d="M115 268C150 167 286 167 335 268" fill="none" stroke="#2563EB" stroke-width="4"/><circle cx="224" cy="206" r="8" fill="#C24135"/><text x="224" y="326" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">D*(x)=p/(p+q)</text>
<path d="M380 216H455" stroke="#334155" stroke-width="3"/><polygon points="455,216 440,207 440,225" fill="#334155"/>
<text x="476" y="104" font-size="20" font-weight="700" fill="#0F766E">② 代回 value</text><rect x="476" y="135" width="315" height="160" rx="8" fill="#E8F5F1" stroke="#0F766E" stroke-width="3"/><text x="633" y="184" text-anchor="middle" font-size="18" fill="#334155">V(D*)</text><text x="633" y="225" text-anchor="middle" font-size="22" font-weight="700" fill="#0F766E">= −log 4 + 2 JS(P||Q)</text><text x="633" y="266" text-anchor="middle" font-size="16" fill="#64748B">P=Q 时最小，D*=1/2</text>
<path d="M791 216H870" stroke="#334155" stroke-width="3"/><polygon points="870,216 855,207 855,225" fill="#334155"/>
<text x="888" y="104" font-size="20" font-weight="700" fill="#C24135">③ 实际交替 SGD</text><rect x="873" y="135" width="272" height="160" rx="8" fill="#FFF0EE" stroke="#C24135" stroke-width="3" stroke-dasharray="9 7"/><text x="1009" y="181" text-anchor="middle" font-size="20" font-weight="700" fill="#C24135">Dψt ≠ D*</text><text x="1009" y="220" text-anchor="middle" font-size="16" fill="#334155">有限函数类 / 样本 / 步数</text><text x="1009" y="257" text-anchor="middle" font-size="16" fill="#64748B">generator 同时移动</text>
<line x1="54" y1="360" x2="1146" y2="360" stroke="#D7DEE8" stroke-width="2"/><text x="65" y="403" font-size="20" font-weight="700" fill="#B7791F">support 分离的边界</text>
<rect x="65" y="432" width="1080" height="103" rx="8" fill="#FFF7E6" stroke="#B7791F" stroke-width="2"/><circle cx="150" cy="483" r="18" fill="#2563EB"/><circle cx="272" cy="483" r="18" fill="#C24135"/><text x="338" y="477" font-size="18" fill="#334155">P ⟂ Q　⇒　JS(P,Q)=log 2，无论 supports 相距 0.001 还是 1000</text><text x="338" y="511" font-size="16" fill="#64748B">这是 population divergence 的饱和；实际梯度还取决于 critic 与 surrogate。</text>
<text x="54" y="579" font-size="16" fill="#1F2937">D≈1/2 也可能来自 underfitting 或过强正则；不能仅凭判别准确率宣布达到 equilibrium。</text></g></svg>

