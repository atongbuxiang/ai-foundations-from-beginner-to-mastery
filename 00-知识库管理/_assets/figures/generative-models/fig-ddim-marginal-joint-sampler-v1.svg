<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">DDIM 共享边缘、不同联合路径与采样器</title><desc id="desc">相同的三个时间切片由不同跨时刻连线形成不同联合分布，右侧展示确定性和随机 DDIM 跳步以及 NFE 与误差的区别。</desc><rect width="1200" height="620" fill="#FFFEFB"/><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}.amber{fill:#B7791F}.red{fill:#C24135}</style>
<text x="54" y="52" font-size="23" font-weight="700" class="ink">同一组 q(x_t|x_0) 边缘，不唯一决定跨时刻 joint path</text><line x1="760" y1="88" x2="760" y2="526" stroke="#D7DEE8" stroke-width="2"/>
<text x="60" y="102" font-size="18" font-weight="700" class="blue">训练看到的是竖向时间切片</text><text x="795" y="102" font-size="18" font-weight="700" class="green">采样器选择跨切片的连线</text>
<line x1="130" y1="150" x2="690" y2="150" stroke="#CBD5E1" stroke-width="2"/><line x1="130" y1="315" x2="690" y2="315" stroke="#CBD5E1" stroke-width="2"/><line x1="130" y1="480" x2="690" y2="480" stroke="#CBD5E1" stroke-width="2"/><text x="82" y="156" font-size="16" class="muted">t=T</text><text x="82" y="321" font-size="16" class="muted">t=s</text><text x="82" y="486" font-size="16" class="muted">t=0</text>
<g fill="#EFF6FF" stroke="#2563EB" stroke-width="2"><circle cx="220" cy="150" r="14"/><circle cx="405" cy="150" r="14"/><circle cx="590" cy="150" r="14"/><circle cx="220" cy="315" r="14"/><circle cx="405" cy="315" r="14"/><circle cx="590" cy="315" r="14"/><circle cx="220" cy="480" r="14"/><circle cx="405" cy="480" r="14"/><circle cx="590" cy="480" r="14"/></g>
<path d="M220 164C250 225 340 247 405 301C455 350 525 409 590 466" fill="none" stroke="#2563EB" stroke-width="4"/><path d="M405 164C378 221 282 250 220 301C275 360 342 410 405 466" fill="none" stroke="#2563EB" stroke-width="4"/><path d="M590 164C545 222 505 250 590 301C530 357 470 420 220 466" fill="none" stroke="#2563EB" stroke-width="4"/>
<path d="M220 164C228 227 228 252 220 301C228 363 228 414 220 466" fill="none" stroke="#B7791F" stroke-width="3" stroke-dasharray="10 7"/><path d="M405 164C413 226 413 252 405 301C413 363 413 414 405 466" fill="none" stroke="#B7791F" stroke-width="3" stroke-dasharray="10 7"/><path d="M590 164C598 226 598 252 590 301C598 363 598 414 590 466" fill="none" stroke="#B7791F" stroke-width="3" stroke-dasharray="10 7"/>
<rect x="125" y="520" width="250" height="45" rx="8" fill="#EFF6FF"/><line x1="146" y1="543" x2="190" y2="543" stroke="#2563EB" stroke-width="4"/><text x="205" y="549" font-size="15" class="ink">joint A：相关随机路径</text><rect x="425" y="520" width="270" height="45" rx="8" fill="#FFF8E8"/><line x1="445" y1="543" x2="489" y2="543" stroke="#B7791F" stroke-width="3" stroke-dasharray="8 6"/><text x="505" y="549" font-size="15" class="ink">joint B：另一种 coupling</text>
<rect x="795" y="135" width="340" height="112" rx="10" fill="#F2FBF8" stroke="#0F766E" stroke-width="2"/><text x="965" y="168" text-anchor="middle" font-size="17" font-weight="700" class="green">eta = 0：不注入新噪声</text><text x="965" y="202" text-anchor="middle" font-size="16" class="ink">x_s = a_s x0_hat + sqrt(1−a_s²) eps_hat</text><text x="965" y="229" text-anchor="middle" font-size="15" class="muted">给定 xT、网络、grid 后路径确定</text>
<rect x="795" y="277" width="340" height="112" rx="10" fill="#FFF8E8" stroke="#B7791F" stroke-width="2"/><text x="965" y="310" text-anchor="middle" font-size="17" font-weight="700" class="amber">eta &gt; 0：重新注入 z</text><text x="965" y="344" text-anchor="middle" font-size="16" class="ink">x_s = a_s x0hat + c epshat + sigma z</text><text x="965" y="371" text-anchor="middle" font-size="15" class="muted">根号非负与 variance convention 要核对</text>
<path d="M825 458H1105" stroke="#64748B" stroke-width="3"/><circle cx="835" cy="458" r="8" fill="#0F766E"/><circle cx="925" cy="458" r="8" fill="#0F766E"/><circle cx="1015" cy="458" r="8" fill="#0F766E"/><circle cx="1105" cy="458" r="8" fill="#0F766E"/><path d="M844 446L915 425M934 446L1005 414M1024 446L1095 399" stroke="#C24135" stroke-width="3" fill="none"/><text x="965" y="497" text-anchor="middle" font-size="16" class="ink">更少时间点 → 更少 NFE；每跳更大 → 误差需实测</text><text x="965" y="530" text-anchor="middle" font-size="15" class="red">deterministic ≠ exact inversion ≠ exact finite-step sampling</text>
<line x1="54" y1="580" x2="1146" y2="580" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="607" font-size="15" class="muted">读图顺序：先固定每个时刻的边缘，再区分跨时刻 joint，最后讨论有限网格上的具体 reverse update。</text></svg>
