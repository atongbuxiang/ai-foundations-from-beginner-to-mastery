<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">有效秩的谱形、定义输入与报告契约</title><desc id="d">三个面板展示平坦、尖峰和长尾奇异谱，不同有效秩读取的谱统计，以及人工智能对象有效秩的报告清单。</desc><defs><style>.T{font:700 22px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.P{font:700 17px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.B{font:14px -apple-system,"PingFang SC",sans-serif;fill:#334155}.S{font:12px -apple-system,"PingFang SC",sans-serif;fill:#475569}.M{font:italic 15px Georgia,serif;fill:#0f172a}</style></defs><rect width="1200" height="430" rx="18" fill="#f8fafc"/><text x="42" y="38" class="T">有效秩：不是一个数字，而是一组绑定问题的谱摘要</text>
<g transform="translate(30 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">A  三种谱形：严格秩可相同</text><text x="20" y="72" class="S">平坦谱</text><g fill="#2563eb"><rect x="20" y="84" width="22" height="68"/><rect x="48" y="84" width="22" height="68"/><rect x="76" y="84" width="22" height="68"/><rect x="104" y="84" width="22" height="68"/><rect x="132" y="84" width="22" height="68"/></g><text x="191" y="72" class="S">尖峰谱</text><g fill="#f97316"><rect x="191" y="84" width="22" height="68"/><rect x="219" y="136" width="22" height="16"/><rect x="247" y="140" width="22" height="12"/><rect x="275" y="143" width="22" height="9"/><rect x="303" y="145" width="22" height="7"/></g><line x1="16" y1="152" x2="330" y2="152" stroke="#94a3b8"/><text x="20" y="198" class="S">长尾谱</text><g fill="#7c3aed"><rect x="20" y="210" width="22" height="76"/><rect x="48" y="226" width="22" height="60"/><rect x="76" y="239" width="22" height="47"/><rect x="104" y="250" width="22" height="36"/><rect x="132" y="259" width="22" height="27"/><rect x="160" y="266" width="22" height="20"/><rect x="188" y="271" width="22" height="15"/><rect x="216" y="275" width="22" height="11"/></g><line x1="16" y1="286" x2="330" y2="286" stroke="#94a3b8"/><text x="20" y="318" class="S">有效维数：平坦高、尖峰低、长尾取决于定义</text></g>
<g transform="translate(420 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">B  不同定义读取不同谱统计</text><rect x="22" y="61" width="145" height="48" rx="9" fill="#dbeafe"/><text x="36" y="82" class="B">峰值 + 平方和</text><text x="36" y="100" class="S">stable rank</text><rect x="192" y="61" width="145" height="48" rx="9" fill="#dcfce7"/><text x="207" y="82" class="B">归一化 σ 概率</text><text x="207" y="100" class="S">熵秩 / 默认 PR</text><rect x="22" y="132" width="145" height="48" rx="9" fill="#ede9fe"/><text x="36" y="153" class="B">归一化 σ² 能量</text><text x="36" y="171" class="S">能量 PR / 熵秩</text><rect x="192" y="132" width="145" height="48" rx="9" fill="#ffedd5"/><text x="207" y="153" class="B">阈值 + 尾误差</text><text x="207" y="171" class="S">重构有效秩</text><rect x="22" y="203" width="315" height="48" rx="9" fill="#f1f5f9"/><text x="37" y="224" class="B">核范数 / 谱范数</text><text x="37" y="243" class="S">总谱质量相对最大方向</text><text x="20" y="286" class="M">同一 σ → 多个正确但不同的“维数”</text><text x="20" y="314" class="S">必须写公式、归一化、阈值与用途</text></g>
<g transform="translate(810 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">C  AI 报告契约：数字必须绑定对象</text><g class="B"><text x="28" y="78">✓ 对象与形状</text><text x="28" y="113">✓ 样本/特征轴</text><text x="28" y="148">✓ 中心化与归一化</text><text x="28" y="183">✓ σ 还是 σ²</text><text x="28" y="218">✓ 阈值、dtype、噪声尺度</text><text x="28" y="253">✓ SVD / 随机 / 幂迭代</text><text x="28" y="288">✓ 最大秩与归一化有效秩</text></g><rect x="19" y="52" width="322" height="254" rx="12" fill="none" stroke="#cbd5e1" stroke-width="2"/><text x="20" y="328" class="S">诊断相关性，不单独推出性能、压缩收益或因果机制</text></g></svg>
