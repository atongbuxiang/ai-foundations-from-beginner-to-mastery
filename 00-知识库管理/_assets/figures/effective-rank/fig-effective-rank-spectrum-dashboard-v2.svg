<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">同一奇异值谱对应多种有效秩诊断</title>
  <desc id="desc">顶部给出长尾奇异值谱，下面用重构秩、stable rank、熵有效秩和 participation ratio 四个仪表说明它们回答不同的维数问题，并给出最小报告契约。</desc>
  <defs>
    <style>
      .sans{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.math{font-family:"STIX Two Math","Times New Roman",serif}.ink{fill:#1f2937}.muted{fill:#64748b}.blue{fill:#2563eb}.green{fill:#0f766e}.amber{fill:#b7791f}.h{font-size:19px;font-weight:600}.body{font-size:16px}.small{font-size:15px}.formula{font-size:19px}.result{font-size:19px;font-weight:600}.axis{stroke:#cbd5e1;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="600" y="42" class="sans h ink" text-anchor="middle">“有效秩”不是一个数字的名字，而是对同一奇异谱提出不同维数问题</text>

  <rect x="42" y="72" width="1116" height="206" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="68" y="108" class="sans h blue">待诊断的长尾谱</text>
  <path d="M92 235H1110M92 235V124" class="axis"/>
  <rect x="125" y="135" width="55" height="100" rx="4" fill="#2563eb"/>
  <rect x="205" y="158" width="55" height="77" rx="4" fill="#2563eb" opacity="0.9"/>
  <rect x="285" y="176" width="55" height="59" rx="4" fill="#2563eb" opacity="0.82"/>
  <rect x="365" y="190" width="55" height="45" rx="4" fill="#0f766e"/>
  <rect x="445" y="201" width="55" height="34" rx="4" fill="#0f766e" opacity="0.9"/>
  <rect x="525" y="210" width="55" height="25" rx="4" fill="#0f766e" opacity="0.8"/>
  <rect x="605" y="217" width="55" height="18" rx="4" fill="#b7791f"/>
  <rect x="685" y="221" width="55" height="14" rx="4" fill="#b7791f" opacity="0.9"/>
  <rect x="765" y="225" width="55" height="10" rx="4" fill="#b7791f" opacity="0.82"/>
  <rect x="845" y="228" width="55" height="7" rx="4" fill="#b7791f" opacity="0.72"/>
  <rect x="925" y="230" width="55" height="5" rx="4" fill="#b7791f" opacity="0.62"/>
  <rect x="1005" y="232" width="55" height="3" rx="3" fill="#b7791f" opacity="0.55"/>
  <text x="1085" y="258" class="math small muted" text-anchor="end">i</text><text x="104" y="137" class="math small muted">σᵢ</text>
  <text x="600" y="263" class="sans small muted" text-anchor="middle">严格秩会把所有非零柱都计为一维；有效秩试图表达“哪些柱在当前任务中真正重要”。</text>

  <rect x="42" y="310" width="258" height="205" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="66" y="347" class="sans h blue">重构秩 rε</text>
  <text x="66" y="385" class="math formula ink">min k：尾误差≤ε</text>
  <path d="M72 430H270" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/><path d="M72 430H205" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/><circle cx="205" cy="430" r="10" fill="#2563eb"/>
  <text x="66" y="472" class="sans body ink">问：达到误差预算需几维？</text>
  <text x="66" y="497" class="sans small muted">依赖 ε 与所选误差范数</text>

  <rect x="328" y="310" width="258" height="205" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="352" y="347" class="sans h green">Stable rank</text>
  <text x="352" y="385" class="math formula ink">Σσᵢ² / σ₁²</text>
  <circle cx="457" cy="430" r="45" fill="none" stroke="#cbd5e1" stroke-width="11"/><path d="M457 385A45 45 0 0 1 496 453" fill="none" stroke="#0f766e" stroke-width="11" stroke-linecap="round"/>
  <text x="352" y="472" class="sans body ink">问：总能量相当于几个峰值？</text>
  <text x="352" y="497" class="sans small muted">连续、尺度不变，但受最大值控制</text>

  <rect x="614" y="310" width="258" height="205" rx="12" fill="#fffaf0" stroke="#f5c04a"/>
  <text x="638" y="347" class="sans h amber">熵有效秩</text>
  <text x="638" y="385" class="math formula ink">exp(−Σpᵢ log pᵢ)</text>
  <circle cx="715" cy="430" r="31" fill="#b7791f" opacity="0.9"/><circle cx="754" cy="430" r="23" fill="#b7791f" opacity="0.72"/><circle cx="783" cy="430" r="16" fill="#b7791f" opacity="0.52"/>
  <text x="638" y="472" class="sans body ink">问：谱质量分布有多均匀？</text>
  <text x="638" y="497" class="sans small muted">必须声明 pᵢ∝σᵢ 还是 σᵢ²</text>

  <rect x="900" y="310" width="258" height="205" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="924" y="347" class="sans h ink">Participation ratio</text>
  <text x="924" y="385" class="math formula ink">1 / Σpᵢ²</text>
  <rect x="930" y="413" width="37" height="49" rx="4" fill="#2563eb"/><rect x="975" y="423" width="37" height="39" rx="4" fill="#0f766e"/><rect x="1020" y="439" width="37" height="23" rx="4" fill="#b7791f"/><rect x="1065" y="447" width="37" height="15" rx="4" fill="#94a3b8"/>
  <text x="924" y="487" class="sans body ink">问：谱参与程度有多分散？</text>

  <rect x="70" y="548" width="1060" height="78" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="97" y="581" class="sans h blue">最小报告契约</text>
  <text x="1098" y="581" class="sans body ink" text-anchor="end">对象与形状　中心化方式　公式与归一化　阈值/对数底　谱估计器　不确定性</text>
  <text x="600" y="662" class="sans result ink" text-anchor="middle">有效秩是描述性诊断，不自动等于表示质量、泛化能力或因果机制。</text>
</svg>
