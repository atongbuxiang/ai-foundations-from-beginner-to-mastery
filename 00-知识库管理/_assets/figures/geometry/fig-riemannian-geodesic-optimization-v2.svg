<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Riemannian metric、测地线与流形优化更新</title>
<desc id="desc">Riemannian metric 在每个 tangent fiber 上给内积并随位置光滑变化；它诱导长度、距离、gradient 与 Levi–Civita connection；geodesic、exponential 与 retraction 的角色不同，优化需将 ambient differential 转成 tangent update 并检查约束。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">位置相关内积与 gradient</text>
<ellipse cx="100" cy="180" rx="55" ry="28" transform="rotate(-20 100 180)" fill="none" stroke="#0F766E" stroke-width="2.3"/>
<circle cx="100" cy="180" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<ellipse cx="220" cy="270" rx="35" ry="65" transform="rotate(25 220 270)" fill="none" stroke="#0F766E" stroke-width="2.3"/>
<circle cx="220" cy="270" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<ellipse cx="320" cy="165" rx="62" ry="24" transform="rotate(10 320 165)" fill="none" stroke="#0F766E" stroke-width="2.3"/>
<circle cx="320" cy="165" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="45" y="365" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937" class="math">g_p(v,w)=v^T G(p) w</text>
<text x="45" y="401" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">df_p is fixed； grad_g f=G(p)^{-1} df</text>
<text x="45" y="438" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">unit balls and steepest directions vary</text>
<text x="45" y="478" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">coordinates change； geometric scalar does not</text>
<text x="45" y="508" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">Riemannian metric != point distance。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">geodesic：connection 零加速度</text>
<circle cx="475" cy="300" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="735" cy="180" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<path d="M480 300 C555 205 650 200 730 180" fill="none" stroke="#0F766E" stroke-width="3"/>
<path d="M480 300 C520 85 700 390 730 180" fill="none" stroke="#C24135" stroke-width="2.5"/>
<path d="M480 300 C570 250 660 215 730 180" fill="7 5" stroke="#2563EB" stroke-width="2"/>
<text x="470" y="350" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">p</text>
<text x="735" y="160" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">q</text>
<text x="430" y="390" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937" class="math">nabla_{gamma dot} gamma dot=0</text>
<text x="430" y="425" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">affine parametrization matters</text>
<text x="430" y="457" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">locally minimizing != globally shortest</text>
<text x="430" y="490" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">Exp_p(v) follows the exact geodesic</text>
<text x="430" y="516" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">retraction only matches locally。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">优化更新回到 manifold</text>
<rect x="840" y="88" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="122.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">ambient / coordinate differential</text>
<line x1="990" y1="147" x2="990" y2="173" stroke="#1F2937" stroke-width="2.1" marker-end="url(#a3)"/>
<rect x="840" y="180" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="214.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">metric -&gt; grad f in T_pM</text>
<line x1="990" y1="239" x2="990" y2="265" stroke="#1F2937" stroke-width="2.1" marker-end="url(#a3)"/>
<rect x="840" y="272" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="306.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">step by Exp_p or retraction R_p</text>
<line x1="990" y1="331" x2="990" y2="357" stroke="#1F2937" stroke-width="2.1" marker-end="url(#a3)"/>
<rect x="840" y="364" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="398.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">verify feasibility + stationarity</text>
<text x="830" y="470" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">projection / normalization may be retractions</text>
<text x="830" y="500" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">but not generally the exponential map。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Riemannian metric 把 differential 变成 gradient；优化可用 retraction，但须声明近似阶与约束。</text>
</svg>