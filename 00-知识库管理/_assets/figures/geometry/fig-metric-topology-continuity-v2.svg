<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">度量生成拓扑、映射正则性与 AI 空间合同</title>
<desc id="desc">metric 的 balls 生成 open sets 和 topology；不同数值尺度的 metrics 可诱导同一 topology，却有不同 Lipschitz、Cauchy 或 completeness 性质；连续、uniform continuous 与 Lipschitz 是不同映射强度，AI 声明还需定义 domain 和 sampling。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">不同 ball 形状可生成同一拓扑</text>
<circle cx="120" cy="245" r="75" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<circle cx="120" cy="245" r="38" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<rect x="235" y="170" width="145" height="145" rx="0" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<rect x="270" y="205" width="75" height="75" rx="0" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="85" y="355" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">d_2 balls</text>
<text x="268" y="355" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">d_infty balls</text>
<text x="45" y="403" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">finite-dimensional norm metrics</text>
<text x="45" y="432" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">can induce the same open sets</text>
<text x="45" y="465" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">but constants, balls and geodesics differ</text>
<text x="45" y="503" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">same topology may differ in completeness。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">映射强度与紧致性分层</text>
<rect x="445" y="92" width="150" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="520.0" y="125.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">Lipschitz</text>
<line x1="598" y1="120" x2="620" y2="120" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="635" y="126" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">d_Y(Fx,Fy)&lt;=L d_X(x,y)</text>
<rect x="445" y="196" width="150" height="55" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="520.0" y="229.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">uniform continuity</text>
<line x1="598" y1="224" x2="620" y2="224" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="635" y="230" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">one delta works for all x</text>
<rect x="445" y="300" width="150" height="55" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="520.0" y="333.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">continuity</text>
<line x1="598" y1="328" x2="620" y2="328" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="635" y="334" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">delta may depend on x</text>
<line x1="430" y1="410" x2="765" y2="410" stroke="#D7DEE8" stroke-width="2"/>
<text x="430" y="442" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">continuous on compact -&gt; uniform</text>
<text x="430" y="472" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">closed + bounded -&gt; compact only in</text>
<text x="430" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">finite-dimensional Euclidean settings</text>
<text x="430" y="519" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">infinite dimension needs extra compactness。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">AI 声明必须交付四层对象</text>
<rect x="840" y="90" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="124.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">underlying set X</text>
<line x1="990" y1="149" x2="990" y2="175" stroke="#1F2937" stroke-width="2.1" marker-end="url(#a3)"/>
<rect x="840" y="182" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="216.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">ground metric / topology</text>
<line x1="990" y1="241" x2="990" y2="267" stroke="#1F2937" stroke-width="2.1" marker-end="url(#a3)"/>
<rect x="840" y="274" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="308.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">population + sampling model</text>
<line x1="990" y1="333" x2="990" y2="359" stroke="#1F2937" stroke-width="2.1" marker-end="url(#a3)"/>
<rect x="840" y="366" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="400.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">map regularity / invariance claim</text>
<text x="830" y="472" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">finite samples do not prove support topology</text>
<text x="830" y="502" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">metric choice changes neighbors and robustness。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">度量提供尺度，拓扑保留邻域结构；映射定理和 AI 几何声明只有在空间、采样与正则性合同完整时成立。</text>
</svg>