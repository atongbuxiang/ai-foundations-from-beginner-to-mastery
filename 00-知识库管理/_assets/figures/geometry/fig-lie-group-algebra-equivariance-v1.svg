<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Lie 群、Lie 代数、群作用与等变映射</title>
  <desc id="desc">左侧展示单位元切空间与指数映射，中间展示轨道、稳定子群和商空间，右侧展示等变交换方块以及不变量读出。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.ttl{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.sub{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.txt{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1e293b}.small{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.math{font:italic 14px Georgia,serif;fill:#0f172a}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.teal{fill:#ccfbf1;stroke:#0f766e;stroke-width:2}.amber{fill:#fef3c7;stroke:#d97706;stroke-width:2}.rose{fill:#ffe4e6;stroke:#e11d48;stroke-width:2}.violet{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:1.8}.dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:5 5}.orbit{fill:none;stroke:#0f766e;stroke-width:3}.muted{fill:#e2e8f0;stroke:#64748b;stroke-width:1.5}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker>
    <marker id="tealArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0f766e"/></marker>
  </defs>
  <rect class="bg" width="1200" height="430"/>

  <rect class="panel" x="20" y="20" width="365" height="390" rx="16"/>
  <text class="ttl" x="40" y="52">A  全局群 ↔ 无穷小生成元</text>
  <text class="sub" x="40" y="73">group law 在单位元附近被 Lie algebra 线性化</text>
  <ellipse class="blue" cx="205" cy="185" rx="125" ry="70"/>
  <path class="line" d="M102 199 C135 128 259 117 307 182" marker-end="url(#arrow)"/>
  <circle class="rose" cx="150" cy="197" r="8"/><text class="math" x="137" y="221">e</text>
  <circle class="amber" cx="274" cy="164" r="8"/><text class="math" x="284" y="160">exp(tξ)</text>
  <text class="txt" x="143" y="111">Lie group G</text>
  <path class="line" d="M150 197 L87 318"/>
  <path class="teal" d="M70 338 L176 338 L150 197 Z"/>
  <path class="line" d="M150 197 L120 301" marker-end="url(#arrow)"/>
  <text class="math" x="100" y="291">ξ</text>
  <text class="txt" x="72" y="365">𝔤 = TₑG</text>
  <path class="line" d="M176 325 C240 307 281 270 286 211" marker-end="url(#arrow)"/>
  <text class="small" x="218" y="302">exp</text>
  <path class="dash" d="M273 177 C233 205 191 222 151 208" marker-end="url(#arrow)"/>
  <text class="small" x="228" y="234">differentiate at e</text>
  <text class="small" x="205" y="386" text-anchor="middle">[ξ,η] records second-order noncommutativity</text>

  <rect class="panel" x="417" y="20" width="365" height="390" rx="16"/>
  <text class="ttl" x="437" y="52">B  Action、orbit 与 stabilizer</text>
  <text class="sub" x="437" y="73">变换真正落在状态空间 X 上以后才有语义</text>
  <ellipse class="muted" cx="600" cy="218" rx="132" ry="105"/>
  <path class="orbit" d="M493 232 C515 142 662 128 714 210 C746 261 686 310 607 310 C539 310 484 278 493 232 Z"/>
  <circle class="rose" cx="548" cy="233" r="9"/><text class="math" x="530" y="257">x</text>
  <circle class="amber" cx="658" cy="178" r="9"/><text class="math" x="669" y="175">g·x</text>
  <circle class="amber" cx="672" cy="270" r="9"/><text class="math" x="684" y="275">h·x</text>
  <path class="line" d="M559 227 C592 198 621 183 648 180" marker-end="url(#arrow)"/>
  <text class="small" x="585" y="189">group action</text>
  <path class="dash" d="M548 233 C536 190 540 157 570 132" marker-end="url(#arrow)"/>
  <text class="small" x="485" y="145">orbit tangent ξₓ(x)</text>
  <circle class="violet" cx="548" cy="233" r="28" opacity="0.35"/>
  <text class="small" x="445" y="338">Gₓ = transformations that keep x fixed</text>
  <rect class="teal" x="484" y="356" width="230" height="32" rx="10"/>
  <text class="txt" x="599" y="377" text-anchor="middle">orbit ≅ G / Gₓ</text>

  <rect class="panel" x="814" y="20" width="366" height="390" rx="16"/>
  <text class="ttl" x="834" y="52">C  Equivariance 是交换方块</text>
  <text class="sub" x="834" y="73">先变换再计算 = 先计算再变换</text>
  <rect class="blue" x="855" y="112" width="95" height="46" rx="10"/>
  <text class="math" x="902" y="141" text-anchor="middle">x ∈ X</text>
  <rect class="amber" x="1044" y="112" width="95" height="46" rx="10"/>
  <text class="math" x="1091" y="141" text-anchor="middle">F(x) ∈ Y</text>
  <rect class="blue" x="855" y="247" width="95" height="46" rx="10"/>
  <text class="math" x="902" y="276" text-anchor="middle">ρₓ(g)x</text>
  <rect class="amber" x="1044" y="247" width="95" height="46" rx="10"/>
  <text class="math" x="1091" y="276" text-anchor="middle">ρᵧ(g)F(x)</text>
  <path class="line" d="M951 135 L1034 135" marker-end="url(#arrow)"/><text class="txt" x="992" y="125" text-anchor="middle">F</text>
  <path class="line" d="M951 270 L1034 270" marker-end="url(#arrow)"/><text class="txt" x="992" y="260" text-anchor="middle">F</text>
  <path class="line" d="M902 159 L902 237" marker-end="url(#arrow)"/><text class="small" x="912" y="203">ρₓ(g)</text>
  <path class="line" d="M1091 159 L1091 237" marker-end="url(#arrow)"/><text class="small" x="1101" y="203">ρᵧ(g)</text>
  <rect class="teal" x="873" y="329" width="248" height="44" rx="12"/>
  <text class="txt" x="997" y="348" text-anchor="middle">equivariant: both paths agree</text>
  <text class="small" x="997" y="365" text-anchor="middle">invariant = trivial output action</text>
  <path class="dash" d="M997 294 L997 319" marker-end="url(#tealArrow)"/>
  <text class="small" x="997" y="397" text-anchor="middle">padding · sampling · wrong symmetry can break the square</text>
</svg>
