<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Provenance graph 与有效 Token 瀑布：规模必须可逆追溯</title><desc id="desc">左侧用实体/活动图追踪 WARC 到训练 shard；右侧把 raw tokens 逐步扣除为有效 loss targets。</desc>
<rect width="1200" height="700" fill="#FFFEFB"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.12"/></filter></defs>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.mono{font-family:"SFMono-Regular",Menlo,monospace}</style>
<text x="55" y="55" font-size="25" font-weight="700" fill="#2563EB">Provenance graph 与有效 Token 瀑布：规模必须可逆追溯</text>
<text x="55" y="105" font-size="18" font-weight="700" fill="#17324D">1 · content-addressed lineage（Entity — Activity — Entity）</text>
<rect x="55" y="140" width="220" height="78" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<text x="73" y="171" font-size="17" font-weight="700" fill="#2563EB">WARC E0</text>
<text x="73" y="198" font-size="14" fill="#64748B">sha256:…</text>
<rect x="340" y="140" width="220" height="78" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" filter="url(#shadow)"/>
<text x="358" y="171" font-size="17" font-weight="700" fill="#0F766E">text E1</text>
<text x="358" y="198" font-size="14" fill="#64748B">parser:v3</text>
<rect x="625" y="140" width="220" height="78" rx="12" fill="#FFFFFF" stroke="#B7791F" stroke-width="2" filter="url(#shadow)"/>
<text x="643" y="171" font-size="17" font-weight="700" fill="#B7791F">kept E2</text>
<text x="643" y="198" font-size="14" fill="#64748B">filter:f7</text>
<rect x="910" y="140" width="220" height="78" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<text x="928" y="171" font-size="17" font-weight="700" fill="#7C3AED">tokens E3</text>
<text x="928" y="198" font-size="14" fill="#64748B">tok:hash</text>
<rect x="625" y="300" width="220" height="78" rx="12" fill="#FFFFFF" stroke="#C24135" stroke-width="2" filter="url(#shadow)"/>
<text x="643" y="331" font-size="17" font-weight="700" fill="#C24135">pack E4</text>
<text x="643" y="358" font-size="14" fill="#64748B">packer:p2</text>
<rect x="910" y="300" width="220" height="78" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" filter="url(#shadow)"/>
<text x="928" y="331" font-size="17" font-weight="700" fill="#0F766E">shard E5</text>
<text x="928" y="358" font-size="14" fill="#64748B">manifest</text>
<line x1="275" y1="179" x2="335" y2="179" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="305.0" y="171.0" text-anchor="middle" font-size="12" fill="#64748B">parse</text>
<line x1="560" y1="179" x2="620" y2="179" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="590.0" y="171.0" text-anchor="middle" font-size="12" fill="#64748B">filter</text>
<line x1="845" y1="179" x2="905" y2="179" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="875.0" y="171.0" text-anchor="middle" font-size="12" fill="#64748B">tokenize</text>
<line x1="735" y1="220" x2="700" y2="295" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="717.5" y="249.5" text-anchor="middle" font-size="12" fill="#64748B">pack</text>
<line x1="845" y1="339" x2="905" y2="339" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="875.0" y="331.0" text-anchor="middle" font-size="12" fill="#64748B">write</text>
<path d="M165 220 C165 340,390 400,625 340" fill="none" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="325" y="365" font-size="13" fill="#64748B">rejection/cluster manifests preserve removed ancestors</text>
<text x="55" y="445" font-size="18" font-weight="700" fill="#17324D">2 · 规模瀑布：每一步的单位与 hash</text>
<rect x="55" y="490.0" width="120" height="135.0" rx="6" fill="#2563EB" opacity="0.85"/>
<text x="115" y="482.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">100M</text>
<text x="115" y="648" text-anchor="middle" font-size="12" fill="#64748B">raw bytes</text>
<line x1="177" y1="590" x2="200" y2="590" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="205" y="514.3" width="120" height="110.7" rx="6" fill="#0F766E" opacity="0.85"/>
<text x="265" y="506.29999999999995" text-anchor="middle" font-size="14" font-weight="700" fill="#0F766E">82M</text>
<text x="265" y="648" text-anchor="middle" font-size="12" fill="#64748B">parsed text</text>
<line x1="327" y1="590" x2="350" y2="590" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="355" y="542.65" width="120" height="82.35000000000001" rx="6" fill="#B7791F" opacity="0.85"/>
<text x="415" y="534.65" text-anchor="middle" font-size="14" font-weight="700" fill="#B7791F">61M</text>
<text x="415" y="648" text-anchor="middle" font-size="12" fill="#64748B">after filter</text>
<line x1="477" y1="590" x2="500" y2="590" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="505" y="560.2" width="120" height="64.80000000000001" rx="6" fill="#7C3AED" opacity="0.85"/>
<text x="565" y="552.2" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">48M</text>
<text x="565" y="648" text-anchor="middle" font-size="12" fill="#64748B">unique tokens</text>
<line x1="627" y1="590" x2="650" y2="590" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="655" y="562.9" width="120" height="62.1" rx="6" fill="#C24135" opacity="0.85"/>
<text x="715" y="554.9" text-anchor="middle" font-size="14" font-weight="700" fill="#C24135">46M</text>
<text x="715" y="648" text-anchor="middle" font-size="12" fill="#64748B">packed tokens</text>
<line x1="777" y1="590" x2="800" y2="590" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="805" y="568.3" width="120" height="56.7" rx="6" fill="#0F766E" opacity="0.85"/>
<text x="865" y="560.3" text-anchor="middle" font-size="14" font-weight="700" fill="#0F766E">42M</text>
<text x="865" y="648" text-anchor="middle" font-size="12" fill="#64748B">loss targets</text>
<rect x="970" y="435" width="175" height="190" rx="10" fill="#F2F5F8"/>
<text x="1057" y="468" text-anchor="middle" font-size="15" font-weight="700" fill="#17324D">manifest minimum</text>
<text x="990" y="505" font-size="13" fill="#64748B">• parent hashes</text>
<text x="990" y="529" font-size="13" fill="#64748B">• activity config</text>
<text x="990" y="553" font-size="13" fill="#64748B">• code/container</text>
<text x="990" y="577" font-size="13" fill="#64748B">• agent/approval</text>
<text x="990" y="601" font-size="13" fill="#64748B">• counts by slice</text>
<text x="990" y="625" font-size="13" fill="#64748B">• failure + deletion</text>
<text x="55" y="670" font-size="14" fill="#64748B">“训练了 42M tokens”只有在能回溯到原始实体、变换和被排除对象时才是可审计事实。</text>
</svg>