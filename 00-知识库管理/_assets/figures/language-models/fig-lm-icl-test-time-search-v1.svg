<text x="71" y="614" font-size="16" font-weight="700" fill="#C24135">公平比较</text>
<text x="71" y="641" font-size="13" fill="#64748B">同题集、同 policy、同最大输出、同总预算；报告 difficulty-stratified curve 与 anytime performance。</text>
<text x="55" y="670" font-size="14" fill="#64748B">Token budget、FLOPs、调用数和 wall-clock 不可互换；搜索质量由 proposal coverage 与 verifier calibration 共同限制。</text>
