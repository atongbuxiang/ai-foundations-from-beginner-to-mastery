<circle cx="310" cy="470" r="11" fill="#B7443E"/>
<text x="310" y="445" text-anchor="middle" font-size="11" font-weight="700" fill="#B7443E">first bad</text>
<text x="310" y="505" text-anchor="middle" font-size="10" font-weight="400" fill="#667784">首个受影响请求</text>
<circle cx="500" cy="470" r="11" fill="#C87922"/>
<text x="500" y="445" text-anchor="middle" font-size="11" font-weight="700" fill="#C87922">detect</text>
<text x="500" y="505" text-anchor="middle" font-size="10" font-weight="400" fill="#667784">SLI 上界越线</text>
<circle cx="690" cy="470" r="11" fill="#7054A3"/>
<text x="690" y="445" text-anchor="middle" font-size="11" font-weight="700" fill="#7054A3">mitigate</text>
<text x="690" y="505" text-anchor="middle" font-size="10" font-weight="400" fill="#667784">禁用高权工具</text>
<circle cx="865" cy="470" r="11" fill="#4F7B45"/>
<text x="865" y="445" text-anchor="middle" font-size="11" font-weight="700" fill="#4F7B45">recover</text>
<text x="865" y="505" text-anchor="middle" font-size="10" font-weight="400" fill="#667784">rollback + verify</text>
<circle cx="1050" cy="470" r="11" fill="#17766E"/>
<text x="1050" y="445" text-anchor="middle" font-size="11" font-weight="700" fill="#17766E">learn</text>
<text x="1050" y="505" text-anchor="middle" font-size="10" font-weight="400" fill="#667784">行动项验收</text>
<rect x="75" y="550" width="1045" height="65" rx="10" fill="#FFF0ED" stroke="#B7443E" stroke-width="1.8" filter="url(#shadow)"/>
<text x="90" y="578" text-anchor="start" font-size="15" font-weight="700" fill="#B7443E">Postmortem 必须连接证据与责任</text>
<text x="90" y="602" text-anchor="start" font-size="12.2" font-weight="400" fill="#667784">impact · detection gap · timeline · trigger/contributors · logs/replay · mitigation/rollback · owner/deadline · 验收测试；blameless 不等于无责任或无可证伪性。</text>
<line x1="48" y1="650" x2="1152" y2="650" stroke="#D9D5CB"/>
<text x="52" y="674" font-size="13" fill="#667784">Drift 指标是告警线索，不是根因；时间线相关也不自动识别因果。回滚优先止损，复盘再用日志、重放和干预更新证据。</text>
</svg>