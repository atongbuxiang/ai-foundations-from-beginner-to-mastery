<line x1="530" y1="310" x2="135" y2="235" stroke="#B7443E" stroke-width="2.1" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="510" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#B7443E">策略改变谁继续使用、谁被标注：observed labels ≠ target population</text>
