<text x="1025" y="206" text-anchor="start" font-size="12.2" font-weight="400" fill="#667784">分母 + CI</text>
<text x="1025" y="225" text-anchor="start" font-size="12.2" font-weight="400" fill="#667784">owner + runbook</text>
<text x="55" y="385" text-anchor="start" font-size="13" font-weight="700" fill="#B7443E">B · 一次事故的证据时间线</text>
<line x1="75" y1="470" x2="1120" y2="470" stroke="#183044" stroke-width="3"/>
<circle cx="120" cy="470" r="11" fill="#245AA8"/>
<text x="120" y="445" text-anchor="middle" font-size="11" font-weight="700" fill="#245AA8">deploy</text>
