<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">LLM 裁判审计：交换位置、控制长度、锚定人类</title><desc id="desc">A/B 与 B/A 交换矩阵、长度 mediator 及人类校验。</desc>
<rect width="1200" height="700" fill="#FBF8F1"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#667784"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#183044" flood-opacity="0.10"/></filter></defs>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.mono{font-family:"SFMono-Regular",Menlo,monospace}</style>
<line x1="48" y1="70" x2="1152" y2="70" stroke="#B7443E" stroke-width="4"/>
<text x="52" y="49" font-size="24" font-weight="700" fill="#183044">LLM 裁判审计：交换位置、控制长度、锚定人类</text>
<text x="65" y="108" text-anchor="start" font-size="13" font-weight="700" fill="#B7443E">A · POSITION-SWAP MATRIX</text>
<text x="110" y="165" text-anchor="middle" font-size="11" font-weight="400" fill="#667784">presented as</text>
<text x="205" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#4F7B45">judge: A wins</text>
<text x="325" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#7054A3">judge: B wins</text>
<rect x="150" y="185" width="110" height="70" rx="7" fill="#4F7B45" opacity=".86"/>
<text x="205.0" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">AB</text>
<text x="205.0" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">→ A</text>
<rect x="270" y="185" width="110" height="70" rx="7" fill="#B7443E" opacity=".86"/>
<text x="325.0" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">AB</text>
<text x="325.0" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">→ B</text>
<rect x="150" y="265" width="110" height="70" rx="7" fill="#B7443E" opacity=".86"/>
<text x="205.0" y="293" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">BA</text>
<text x="205.0" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">→ A</text>
<rect x="270" y="265" width="110" height="70" rx="7" fill="#7054A3" opacity=".86"/>
<text x="325.0" y="293" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">BA</text>
<text x="325.0" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">→ B</text>
<text x="65" y="385" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">一致对：AB 与 BA 都选同一内容</text>
<text x="65" y="406" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">翻转对：交换位置就换赢家</text>
<text x="65" y="427" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">位置偏差率要与 tie / parse failure 同报</text>
<text x="490" y="108" text-anchor="start" font-size="13" font-weight="700" fill="#C87922">B · LENGTH AS MEDIATOR</text>
<circle cx="525" cy="205" r="42" fill="#FFFDF8" stroke="#245AA8" stroke-width="3"/>
<text x="525" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#245AA8">system</text>
<circle cx="700" cy="155" r="42" fill="#FFFDF8" stroke="#C87922" stroke-width="3"/>
<text x="700" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#C87922">length</text>
<circle cx="700" cy="285" r="42" fill="#FFFDF8" stroke="#4F7B45" stroke-width="3"/>
<text x="700" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#4F7B45">quality</text>
<circle cx="920" cy="220" r="42" fill="#FFFDF8" stroke="#7054A3" stroke-width="3"/>
<text x="920" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#7054A3">judge</text>
<line x1="567" y1="195" x2="654" y2="165" stroke="#C87922" stroke-width="2.1" marker-end="url(#arrow)"/>
<line x1="567" y1="218" x2="657" y2="274" stroke="#4F7B45" stroke-width="2.1" marker-end="url(#arrow)"/>
<line x1="742" y1="168" x2="878" y2="211" stroke="#C87922" stroke-width="2.1" marker-end="url(#arrow)"/>
<line x1="742" y1="278" x2="878" y2="231" stroke="#4F7B45" stroke-width="2.1" marker-end="url(#arrow)"/>
<line x1="567" y1="205" x2="876" y2="220" stroke="#667784" stroke-width="2.1" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="490" y="365" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">长度可能既承载真实质量，也触发无关偏好。</text>
<text x="490" y="386" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">简单“扣除长度”可能删掉 treatment effect；</text>
<text x="490" y="407" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">应报告原始比较、长度匹配/控制比较与假设。</text>
<rect x="65" y="500" width="310" height="110" rx="10" fill="#EEF7EA" stroke="#4F7B45" stroke-width="1.8" filter="url(#shadow)"/>
<text x="80" y="528" text-anchor="start" font-size="15" font-weight="700" fill="#4F7B45">人类锚点</text>
<text x="80" y="553" text-anchor="start" font-size="12.3" font-weight="400" fill="#667784">盲评、随机位置、明确 rubric</text>
<text x="80" y="573" text-anchor="start" font-size="12.3" font-weight="400" fill="#667784">多标注者；保存 disagreement</text>
<text x="80" y="593" text-anchor="start" font-size="12.3" font-weight="400" fill="#667784">分 slice 验证 judge-human agreement</text>
<rect x="445" y="500" width="310" height="110" rx="10" fill="#EEF4FC" stroke="#245AA8" stroke-width="1.8" filter="url(#shadow)"/>
<text x="460" y="528" text-anchor="start" font-size="15" font-weight="700" fill="#245AA8">裁判复现合同</text>
<text x="460" y="553" text-anchor="start" font-size="12.3" font-weight="400" fill="#667784">judge model/date + prompt + order</text>
<text x="460" y="573" text-anchor="start" font-size="12.3" font-weight="400" fill="#667784">temperature/seed + parser</text>
<text x="460" y="593" text-anchor="start" font-size="12.3" font-weight="400" fill="#667784">tie/refusal/failure rule</text>
<rect x="825" y="500" width="310" height="110" rx="10" fill="#FFF0ED" stroke="#B7443E" stroke-width="1.8" filter="url(#shadow)"/>
<text x="840" y="528" text-anchor="start" font-size="15" font-weight="700" fill="#B7443E">不能泄漏给裁判</text>
<text x="840" y="553" text-anchor="start" font-size="12.3" font-weight="400" fill="#667784">系统名、风格水印、答案顺序</text>
<text x="840" y="573" text-anchor="start" font-size="12.3" font-weight="400" fill="#667784">不可见 reference 选择线索</text>
<text x="840" y="593" text-anchor="start" font-size="12.3" font-weight="400" fill="#667784">用于调 prompt 的 test labels</text>
<line x1="48" y1="650" x2="1152" y2="650" stroke="#D9D5CB"/>
<text x="52" y="674" font-size="13" fill="#667784">LLM-as-a-Judge 是带误差和偏差的测量仪器，不是 ground truth；位置、长度、自偏好和样式都需实验审计。</text>
</svg>