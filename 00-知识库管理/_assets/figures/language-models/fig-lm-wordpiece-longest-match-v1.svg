<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">WordPiece：词表学习与最长匹配是两个阶段</title>
<desc id="desc">编码通常从词首向右选择词表中最长片段；局部贪心可能进入死路，未知词语义取决于实现合同。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">词表含词首/续接标记</text>
<rect x="70" y="110" width="105" height="42" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="122.5" y="137.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">play</text>
<rect x="70" y="175" width="105" height="42" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="122.5" y="202.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">player</text>
<rect x="220" y="110" width="105" height="42" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="272.5" y="137.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">##er</text>
<rect x="220" y="175" width="105" height="42" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="272.5" y="202.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">##ing</text>
<rect x="145" y="260" width="105" height="42" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="197.5" y="287.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">[UNK]</text>
<text x="55" y="350" font-size="17" font-weight="800" text-anchor="start" fill="#2563EB">play + ##er</text>
<text x="55" y="392" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">## 不是自然语言符号，而是位置约束。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Longest-match-first</text>
<text x="445" y="112" font-size="19" font-weight="800" text-anchor="start" fill="#1F2937">player</text>
<line x1="445" y1="135" x2="735" y2="135" stroke="#D7DEE8" stroke-width="2"/>
<path d="M445 160L650 160" fill="none" stroke="#2563EB" stroke-width="5"/>
<text x="547" y="190" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">player ✓</text>
<text x="445" y="250" font-size="19" font-weight="800" text-anchor="start" fill="#1F2937">playing</text>
<path d="M445 290L585 290" fill="none" stroke="#0F766E" stroke-width="5"/>
<text x="515" y="322" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">play</text>
<path d="M590 290L735 290" fill="none" stroke="#B7791F" stroke-width="5"/>
<text x="662" y="322" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F">##ing</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">贪心可失败，即使存在全局分段</text>
<text x="845" y="110" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">词表: ab, a, ##bc</text>
<text x="845" y="165" font-size="18" font-weight="800" text-anchor="start" fill="#1F2937">输入: abc</text>
<rect x="845" y="205" width="95" height="42" rx="5" fill="#FEE2E2" stroke="#C24135" stroke-width="2"/>
<text x="892" y="232" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">ab</text>
<line x1="945" y1="226" x2="1020" y2="226" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="1030" y="232" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">c 无匹配</text>
<rect x="845" y="305" width="75" height="42" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="882" y="332" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">a</text>
<rect x="940" y="305" width="100" height="42" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="990" y="332" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">##bc</text>
<text x="845" y="410" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">因此编码器规则必须独立于词表集合声明。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">WordPiece 不能只写“像 BPE”；词表评分、位置标记、贪心顺序与 unknown 行为都要分账。</text>
</svg>