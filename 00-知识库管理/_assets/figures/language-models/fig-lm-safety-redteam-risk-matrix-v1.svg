<rect x="55" y="465" width="500" height="135" rx="10" fill="#FFF0ED" stroke="#B7443E" stroke-width="1.8" filter="url(#shadow)"/>
<text x="70" y="493" text-anchor="start" font-size="15" font-weight="700" fill="#B7443E">覆盖格 ≠ 风险归零</text>
<text x="70" y="517" text-anchor="start" font-size="12.2" font-weight="400" fill="#667784">每格还要写模型/模板/policy、攻击者知识、查询与人工预算、judge/人评、prompt-family cluster、正常效用。</text>
<text x="70" y="536" text-anchor="start" font-size="12.2" font-weight="400" fill="#667784">固定集合通过只支持该版本和该攻击分布。</text>
<text x="635" y="105" text-anchor="start" font-size="13" font-weight="700" fill="#7054A3">B · Harmful / Benign 两个分母</text>
<rect x="670" y="180" width="190" height="88" rx="9" fill="#4F7B45" opacity=".84"/>
<text x="765" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">harmful + refuse</text>
<text x="765" y="241" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">安全命中</text>
<rect x="885" y="180" width="190" height="88" rx="9" fill="#B7443E" opacity=".84"/>
<text x="980" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">harmful + answer</text>
<text x="980" y="241" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">漏放</text>
<rect x="670" y="300" width="190" height="88" rx="9" fill="#C87922" opacity=".84"/>
<text x="765" y="333" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">benign + refuse</text>
<text x="765" y="361" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">过度拒答</text>
<rect x="885" y="300" width="190" height="88" rx="9" fill="#245AA8" opacity=".84"/>
<text x="980" y="333" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">benign + answer</text>
<text x="980" y="361" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">正常完成</text>
<rect x="635" y="445" width="440" height="155" rx="10" fill="#F3EFFA" stroke="#7054A3" stroke-width="1.8" filter="url(#shadow)"/>
<text x="650" y="473" text-anchor="start" font-size="15" font-weight="700" fill="#7054A3">再接到系统后果</text>
<text x="650" y="497" text-anchor="start" font-size="12.2" font-weight="400" fill="#667784">content property → policy decision → tool/action → impact</text>
<text x="650" y="516" text-anchor="start" font-size="12.2" font-weight="400" fill="#667784"></text>
<text x="650" y="535" text-anchor="start" font-size="12.2" font-weight="400" fill="#667784">毒性低不等于无害；关键词出现不等于攻击成功；模型文字拒答也不保证工具尚未执行。</text>
<text x="650" y="554" text-anchor="start" font-size="12.2" font-weight="400" fill="#667784">同时报告 severity、群体切片和残余风险。</text>
<line x1="48" y1="650" x2="1152" y2="650" stroke="#D9D5CB"/>
<text x="52" y="674" font-size="13" fill="#667784">Jailbreak 是攻击过程，toxicity/bias 是行为属性，harm 是情境化后果；测量对象、分母和判定器必须分开。</text>
</svg>