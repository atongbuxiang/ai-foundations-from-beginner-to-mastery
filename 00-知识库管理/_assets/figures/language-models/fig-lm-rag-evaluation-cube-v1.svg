<text x="265.0" y="551" text-anchor="middle" font-size="13" font-weight="700" fill="#245AA8">Generation G</text>
<line x1="135" y1="515" x2="135" y2="260" stroke="#17766E" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="110" y="370.0" text-anchor="middle" font-size="13" font-weight="700" fill="#17766E">Retrieval R</text>
<line x1="410" y1="505" x2="485" y2="440" stroke="#7054A3" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="465" y="445" text-anchor="middle" font-size="13" font-weight="700" fill="#7054A3">Attribution A</text>
<text x="155" y="120" text-anchor="start" font-size="13" font-weight="700" fill="#183044">cell 111 = joint success; 011/101/110 reveal different compensations</text>
<rect x="610" y="105" width="505" height="300" rx="10" fill="#FFF0ED" stroke="#B7443E" stroke-width="1.8" filter="url(#shadow)"/>
<text x="625" y="133" font-size="15" font-weight="700" fill="#B7443E">最早失败层</text>
<text x="625" y="157" font-size="12.5" fill="#667784">1  corpus answerable?</text>
<text x="625" y="177" font-size="12.5" fill="#667784">2  chunk covers evidence?</text>
<text x="625" y="197" font-size="12.5" fill="#667784">3  exact retriever ranks it?</text>
<text x="625" y="217" font-size="12.5" fill="#667784">4  ANN preserves exact candidate?</text>
<text x="625" y="237" font-size="12.5" fill="#667784">5  fusion / reranker keeps it?</text>
<text x="625" y="257" font-size="12.5" fill="#667784">6  context retains + positions it?</text>
<text x="625" y="277" font-size="12.5" fill="#667784">7  generator uses / abstains?</text>
<text x="625" y="297" font-size="12.5" fill="#667784">8  citation links claim → span?</text>
<text x="610" y="450" text-anchor="start" font-size="14" font-weight="700" fill="#183044">成本向量：质量曲线必须在同预算比较</text>
<text x="610" y="495" text-anchor="start" font-size="11" font-weight="400" fill="#667784">index</text>
<rect x="735" y="480" width="340" height="20" rx="4" fill="#EAE6DD"/>
<rect x="735" y="480" width="221.0" height="20" rx="4" fill="#245AA8"/>
<text x="610" y="533" text-anchor="start" font-size="11" font-weight="400" fill="#667784">p95 latency</text>
<rect x="735" y="518" width="340" height="20" rx="4" fill="#EAE6DD"/>
<rect x="735" y="518" width="278.8" height="20" rx="4" fill="#17766E"/>
<text x="610" y="571" text-anchor="start" font-size="11" font-weight="400" fill="#667784">retrieved tokens</text>
<rect x="735" y="556" width="340" height="20" rx="4" fill="#EAE6DD"/>
<rect x="735" y="556" width="163.2" height="20" rx="4" fill="#C87922"/>
<text x="610" y="609" text-anchor="start" font-size="11" font-weight="400" fill="#667784">generator cost</text>
<rect x="735" y="594" width="340" height="20" rx="4" fill="#EAE6DD"/>
<rect x="735" y="594" width="244.79999999999998" height="20" rx="4" fill="#7054A3"/>
<line x1="48" y1="650" x2="1152" y2="650" stroke="#D9D5CB" stroke-width="1"/>
<text x="52" y="674" font-size="13" fill="#667784">三个边缘平均数不能决定联合成功率；oracle 干预与配对分析比单一端到端分数更可诊断。</text>
</svg>