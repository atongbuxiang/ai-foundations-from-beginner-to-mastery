<text x="264" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#183044">101</text>
<rect x="330" y="285" width="58" height="58" fill="#245AA8" fill-opacity="0.45999999999999996" stroke="#245AA8" stroke-width="1.2"/>
<text x="359" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#183044">110</text>
<rect x="405" y="220" width="58" height="58" fill="#4F7B45" fill-opacity="0.85" stroke="#4F7B45" stroke-width="1.2"/>
<text x="434" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">111</text>
