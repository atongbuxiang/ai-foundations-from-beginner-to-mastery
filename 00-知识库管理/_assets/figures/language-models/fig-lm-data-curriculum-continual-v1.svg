<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">数据顺序会改写训练路径：Curriculum、DAPT/TAPT 与遗忘账</title><desc id="desc">上方显示 checkpoint 路径与可变 mixture schedule；下方画新域改善和旧域退化的双风险轨迹。</desc>
<rect width="1200" height="700" fill="#FFFEFB"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.12"/></filter></defs>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.mono{font-family:"SFMono-Regular",Menlo,monospace}</style>
<text x="55" y="55" font-size="25" font-weight="700" fill="#2563EB">数据顺序会改写训练路径：Curriculum、DAPT/TAPT 与遗忘账</text>
<rect x="55" y="125" width="220" height="90" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<text x="73" y="156" font-size="17" font-weight="700" fill="#2563EB">base θ₀</text>
<text x="73" y="183" font-size="14" fill="#64748B">general mix</text>
<line x1="275" y1="170" x2="330" y2="170" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="340" y="125" width="220" height="90" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<text x="358" y="156" font-size="17" font-weight="700" fill="#7C3AED">DAPT θ₁</text>
<text x="358" y="183" font-size="14" fill="#64748B">domain corpus</text>
<line x1="560" y1="170" x2="615" y2="170" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="625" y="125" width="220" height="90" rx="12" fill="#FFFFFF" stroke="#B7791F" stroke-width="2" filter="url(#shadow)"/>
<text x="643" y="156" font-size="17" font-weight="700" fill="#B7791F">TAPT θ₂</text>
<text x="643" y="183" font-size="14" fill="#64748B">task text</text>
<line x1="845" y1="170" x2="900" y2="170" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="910" y="125" width="220" height="90" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" filter="url(#shadow)"/>
<text x="928" y="156" font-size="17" font-weight="700" fill="#0F766E">supervised θ₃</text>
<text x="928" y="183" font-size="14" fill="#64748B">labeled data</text>
<text x="55" y="100" font-size="18" font-weight="700" fill="#17324D">checkpoint lineage：每段 optimizer / data / token budget 单独版本化</text>
<text x="55" y="280" font-size="18" font-weight="700" fill="#17324D">mixture schedule π(t)</text>
<rect x="55" y="305" width="180" height="42" fill="#2563EB" opacity="0.85"/>
<text x="145.0" y="332" text-anchor="middle" font-size="13" fill="#FFFFFF">general 100%</text>
<rect x="235" y="305" width="170" height="42" fill="#7C3AED" opacity="0.85"/>
<text x="320.0" y="332" text-anchor="middle" font-size="13" fill="#FFFFFF">domain ↑</text>
<rect x="405" y="305" width="170" height="42" fill="#B7791F" opacity="0.85"/>
<text x="490.0" y="332" text-anchor="middle" font-size="13" fill="#FFFFFF">task ↑</text>
<rect x="575" y="305" width="180" height="42" fill="#0F766E" opacity="0.85"/>
<text x="665.0" y="332" text-anchor="middle" font-size="13" fill="#FFFFFF">replay mix</text>
<line x1="55" y1="365" x2="755" y2="365" stroke="#17324D"/><text x="730" y="388" font-size="13" fill="#64748B">training time</text>
<text x="55" y="445" font-size="18" font-weight="700" fill="#17324D">双验证集：只看新域会隐藏遗忘</text>
<line x1="90" y1="615" x2="735" y2="615" stroke="#17324D"/><line x1="90" y1="615" x2="90" y2="470" stroke="#17324D"/>
<path d="M95 520 C 220 545, 330 575, 450 590 C 560 600, 650 604, 730 605" fill="none" stroke="#7C3AED" stroke-width="4"/>
<path d="M95 560 C 240 555, 330 520, 450 495 C 570 480, 650 475, 730 472" fill="none" stroke="#C24135" stroke-width="4"/>
<text x="580" y="595" font-size="14" fill="#7C3AED">new-domain loss ↓</text>
<text x="580" y="465" font-size="14" fill="#C24135">old-domain loss ↑</text>
<rect x="810" y="285" width="335" height="335" rx="12" fill="#FFF7E8" stroke="#B7791F" stroke-width="2" filter="url(#shadow)"/>
<text x="828" y="316" font-size="17" font-weight="700" fill="#B7791F">路径审计</text>
<text x="828" y="343" font-size="14" fill="#64748B">顺序：what came first?</text>
<text x="828" y="366" font-size="14" fill="#64748B">预算：unique / repeated tokens?</text>
<text x="828" y="389" font-size="14" fill="#64748B">状态：optimizer 是否重置？</text>
<text x="828" y="412" font-size="14" fill="#64748B">回放：旧域比例与采样？</text>
<text x="828" y="435" font-size="14" fill="#64748B">评价：新/旧/安全切片？</text>
<text x="828" y="458" font-size="14" fill="#64748B">选择：报告所有 tried orders？</text>
<text x="55" y="670" font-size="14" fill="#64748B">相同最终数据 multiset、不同顺序仍可到不同参数；curriculum 结论必须包含 path 和 selection budget。</text>
</svg>