<text x="720" y="458" text-anchor="start" font-size="15" font-weight="700" fill="#B7443E">复现合同</text>
<text x="720" y="483" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">checkpoint + tokenizer/template</text>
<text x="720" y="503" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">processors 与顺序 + sampler</text>
<text x="720" y="523" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">RNG algorithm/state/counter + scheduler</text>
<text x="720" y="543" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">stop/parser + kernel/hardware</text>
<line x1="48" y1="650" x2="1152" y2="650" stroke="#D9D5CB"/>
<text x="52" y="674" font-size="13" fill="#667784">升温增加 token entropy，不等于增加事实性或语义创造力；seed 也不是完整复现合同。</text>
