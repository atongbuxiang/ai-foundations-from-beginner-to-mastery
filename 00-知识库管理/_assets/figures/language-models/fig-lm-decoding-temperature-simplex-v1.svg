<text x="52" y="265" text-anchor="middle" font-size="12" font-weight="400" fill="#667784">probability</text>
<rect x="705" y="115" width="410" height="105" rx="10" fill="#F3EFFA" stroke="#7054A3" stroke-width="1.8" filter="url(#shadow)"/>
<text x="720" y="143" text-anchor="start" font-size="15" font-weight="700" fill="#7054A3">Odds 的精确变化</text>
<text x="720" y="168" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">pτ(A)/pτ(B) = exp[(zA−zB)/τ]</text>
<text x="720" y="188" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">有限 τ &gt; 0：A &gt; B &gt; C 的排名不变</text>
<text x="705" y="268" text-anchor="start" font-size="15" font-weight="700" fill="#183044">τ = 1 的 categorical 区间</text>
