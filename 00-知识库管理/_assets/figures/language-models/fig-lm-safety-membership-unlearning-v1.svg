<line x1="444.4" y1="400" x2="444.4" y2="165" stroke="#C87922" stroke-width="3" stroke-dasharray="7 5"/>
<text x="452.4" y="183" text-anchor="start" font-size="11" font-weight="700" fill="#C87922">τ at FPR=α</text>
<text x="160" y="155" text-anchor="start" font-size="11" font-weight="700" fill="#245AA8">non-member score</text>
<text x="365" y="155" text-anchor="start" font-size="11" font-weight="700" fill="#B7443E">member score</text>
<text x="310" y="430" text-anchor="middle" font-size="11" font-weight="400" fill="#667784">attack score →</text>
<rect x="70" y="470" width="480" height="135" rx="10" fill="#FFF5E7" stroke="#C87922" stroke-width="1.8" filter="url(#shadow)"/>
<text x="85" y="498" text-anchor="start" font-size="15" font-weight="700" fill="#C87922">基率提醒</text>
<text x="85" y="522" text-anchor="start" font-size="12.2" font-weight="400" fill="#667784">PPV = π·TPR / [π·TPR + (1−π)·FPR]</text>
<text x="85" y="541" text-anchor="start" font-size="12.2" font-weight="400" fill="#667784">成员极罕见时，即使 ROC-AUC 尚可，阳性告警仍可能几乎全是假阳。</text>
<text x="85" y="560" text-anchor="start" font-size="12.2" font-weight="400" fill="#667784">低 FPR 区域需要很大的 non-member 分母。</text>
<text x="610" y="108" text-anchor="start" font-size="13" font-weight="700" fill="#4F7B45">B · 删除目标是接近“从未见过”</text>
<ellipse cx="715" cy="235" rx="100" ry="65" fill="#B7443E" opacity=".14" stroke="#B7443E" stroke-width="3"/>
<text x="715" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#B7443E">原模型</text>
<text x="715" y="249" text-anchor="middle" font-size="13" font-weight="700" fill="#B7443E">A(D)</text>
<ellipse cx="955" cy="235" rx="100" ry="65" fill="#4F7B45" opacity=".14" stroke="#4F7B45" stroke-width="3"/>
<text x="955" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#4F7B45">重训参照</text>
<text x="955" y="249" text-anchor="middle" font-size="13" font-weight="700" fill="#4F7B45">A(D∖R)</text>
<ellipse cx="835" cy="430" rx="100" ry="65" fill="#7054A3" opacity=".14" stroke="#7054A3" stroke-width="3"/>
<text x="835" y="425" text-anchor="middle" font-size="13" font-weight="700" fill="#7054A3">unlearned</text>
<text x="835" y="444" text-anchor="middle" font-size="13" font-weight="700" fill="#7054A3">U(A(D),R)</text>
<line x1="785" y1="280" x2="815" y2="382" stroke="#7054A3" stroke-width="2.1" marker-end="url(#arrow)"/>
<line x1="900" y1="386" x2="936" y2="292" stroke="#4F7B45" stroke-width="2.1" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="1048" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#183044">d(L(U), L(retrain)) ≤ ε</text>
<rect x="610" y="515" width="515" height="90" rx="10" fill="#EEF4FC" stroke="#245AA8" stroke-width="1.8" filter="url(#shadow)"/>
<text x="625" y="543" text-anchor="start" font-size="15" font-weight="700" fill="#245AA8">删除 lineage</text>
<text x="625" y="567" text-anchor="start" font-size="12.2" font-weight="400" fill="#667784">raw record → dedup cluster → token shard → checkpoint/adapter → embedding index/cache → served versions；旧副本可访问则删除闭环未完成。</text>
<line x1="48" y1="650" x2="1152" y2="650" stroke="#D9D5CB"/>
<text x="52" y="674" font-size="13" fill="#667784">一个攻击失效或 benchmark 效用不变都不是删除证明；声明参考重训分布、距离、观察族、失败概率和所有派生副本。</text>
</svg>