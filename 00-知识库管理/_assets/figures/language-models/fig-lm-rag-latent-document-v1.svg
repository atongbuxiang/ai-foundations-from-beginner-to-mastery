<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">RAG：把文档写成潜变量，再逐层审计近似</title><desc id="desc">语料、检索分布、top-K 截断与条件生成器的概率图。</desc>
<rect width="1200" height="700" fill="#FBF8F1"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#667784"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#183044" flood-opacity="0.10"/></filter></defs>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.mono{font-family:"SFMono-Regular",Menlo,monospace}</style>
<line x1="48" y1="70" x2="1152" y2="70" stroke="#7054A3" stroke-width="4"/>
<text x="52" y="49" font-size="24" font-weight="700" fill="#183044">RAG：把文档写成潜变量，再逐层审计近似</text>
<rect x="55" y="120" width="205" height="92" rx="10" fill="#EEF4FC" stroke="#245AA8" stroke-width="1.8" filter="url(#shadow)"/>
<text x="70" y="148" font-size="15" font-weight="700" fill="#245AA8">输入 x</text>
<text x="70" y="172" font-size="12.5" fill="#667784">question + time</text>
<text x="70" y="192" font-size="12.5" fill="#667784">+ permissions</text>
