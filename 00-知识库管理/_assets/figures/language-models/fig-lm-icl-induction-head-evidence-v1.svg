<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Induction Head：从重复 token 模式到机制证据梯子</title><desc id="desc">上方展示 AB…A→B 的两头回路，下方区分注意力图、logit effect、ablation 与精确权重构造。</desc>
<rect width="1200" height="700" fill="#FFFEFB"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.10"/></filter></defs>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.mono{font-family:"SFMono-Regular",Menlo,monospace}</style>
<text x="55" y="55" font-size="25" font-weight="700" fill="#2563EB">Induction Head：从重复 token 模式到机制证据梯子</text>
<rect x="70" y="115" width="70" height="52" rx="8" fill="#2563EB"/>
<text x="105" y="148" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">A</text>
<rect x="175" y="115" width="70" height="52" rx="8" fill="#2563EB"/>
<text x="210" y="148" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">B</text>
<rect x="280" y="115" width="70" height="52" rx="8" fill="#EEF2F7"/>
<text x="315" y="148" text-anchor="middle" font-size="19" font-weight="700" fill="#17324D">C</text>
<rect x="385" y="115" width="70" height="52" rx="8" fill="#EEF2F7"/>
<text x="420" y="148" text-anchor="middle" font-size="19" font-weight="700" fill="#17324D">·</text>
<rect x="490" y="115" width="70" height="52" rx="8" fill="#EEF2F7"/>
<text x="525" y="148" text-anchor="middle" font-size="19" font-weight="700" fill="#17324D">·</text>
<rect x="595" y="115" width="70" height="52" rx="8" fill="#2563EB"/>
<text x="630" y="148" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">A</text>
<rect x="700" y="115" width="70" height="52" rx="8" fill="#EEF2F7"/>
<text x="735" y="148" text-anchor="middle" font-size="19" font-weight="700" fill="#17324D">?</text>
<path d="M610 110 C500 50,210 50,105 110" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<text x="360" y="85" text-anchor="middle" font-size="14" fill="#7C3AED">prefix match: current A finds earlier A</text>
<path d="M210 175 C300 240,655 240,735 175" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="225" text-anchor="middle" font-size="14" fill="#0F766E">copy: token B after earlier A raises final B logit</text>
<rect x="55" y="330" width="245" height="110" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<text x="71" y="359" font-size="16" font-weight="700" fill="#D97706">attention pattern</text>
<text x="71" y="386" font-size="13" fill="#64748B">where a head looks</text>
<line x1="300" y1="385" x2="330" y2="385" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="335" y="330" width="245" height="110" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<text x="351" y="359" font-size="16" font-weight="700" fill="#2563EB">direct logit effect</text>
<text x="351" y="386" font-size="13" fill="#64748B">what token it promotes</text>
<line x1="580" y1="385" x2="610" y2="385" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="615" y="330" width="245" height="110" rx="12" fill="#FFFFFF" stroke="#C24135" stroke-width="2" filter="url(#shadow)"/>
<text x="631" y="359" font-size="16" font-weight="700" fill="#C24135">activation patch / ablation</text>
<text x="631" y="386" font-size="13" fill="#64748B">causal necessity in this run</text>
<line x1="860" y1="385" x2="890" y2="385" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="895" y="330" width="245" height="110" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" filter="url(#shadow)"/>
<text x="911" y="359" font-size="16" font-weight="700" fill="#0F766E">weight-level construction</text>
<text x="911" y="386" font-size="13" fill="#64748B">sufficiency in specified model</text>
<rect x="55" y="500" width="1085" height="105" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<text x="71" y="529" font-size="16" font-weight="700" fill="#7C3AED">外推边界</text>
<text x="71" y="556" font-size="13" fill="#64748B">两层 attention-only 的精确回路 ≠ 含 MLP 大模型的全部 ICL；单头消融也可能被冗余回路、分布外干预和 downstream nonlinearities 混淆。</text>
<text x="55" y="670" font-size="14" fill="#64748B">机制结论应同时报告行为任务、head criterion、干预对象、替代回路和模型族。</text>
</svg>