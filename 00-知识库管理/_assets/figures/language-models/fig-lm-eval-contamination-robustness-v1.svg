<rect x="135" y="411" width="62" height="38" rx="5" fill="#4F7B45" opacity="0.83"/>
<text x="166" y="436" text-anchor="middle" font-size="11" font-weight="700" fill="#183044">0.8</text>
<rect x="210" y="411" width="62" height="38" rx="5" fill="#4F7B45" opacity="0.83"/>
<text x="241" y="436" text-anchor="middle" font-size="11" font-weight="700" fill="#183044">0.8</text>
<rect x="285" y="411" width="62" height="38" rx="5" fill="#4F7B45" opacity="0.89"/>
<text x="316" y="436" text-anchor="middle" font-size="11" font-weight="700" fill="#183044">0.9</text>
<rect x="360" y="411" width="62" height="38" rx="5" fill="#C87922" opacity="0.71"/>
<text x="391" y="436" text-anchor="middle" font-size="11" font-weight="700" fill="#183044">0.6</text>
<text x="65" y="484" text-anchor="start" font-size="11" font-weight="400" fill="#667784">item 4</text>
<rect x="135" y="459" width="62" height="38" rx="5" fill="#B7443E" opacity="0.59"/>
<text x="166" y="484" text-anchor="middle" font-size="11" font-weight="700" fill="#183044">0.4</text>
<rect x="210" y="459" width="62" height="38" rx="5" fill="#C87922" opacity="0.77"/>
<text x="241" y="484" text-anchor="middle" font-size="11" font-weight="700" fill="#183044">0.7</text>
<rect x="285" y="459" width="62" height="38" rx="5" fill="#B7443E" opacity="0.47"/>
<text x="316" y="484" text-anchor="middle" font-size="11" font-weight="700" fill="#183044">0.2</text>
<rect x="360" y="459" width="62" height="38" rx="5" fill="#C87922" opacity="0.65"/>
<text x="391" y="484" text-anchor="middle" font-size="11" font-weight="700" fill="#183044">0.5</text>
