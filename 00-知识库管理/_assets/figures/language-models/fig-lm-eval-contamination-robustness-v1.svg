<text x="410" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#B7443E">exposure ≠ memorization ≠ exploitation</text>
<text x="60" y="290" text-anchor="start" font-size="13" font-weight="700" fill="#17766E">B · ITEM × PROMPT SCORE</text>
