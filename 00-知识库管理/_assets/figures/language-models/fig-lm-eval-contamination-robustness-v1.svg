<rect x="135" y="507" width="62" height="38" rx="5" fill="#4F7B45" opacity="0.89"/>
<text x="166" y="532" text-anchor="middle" font-size="11" font-weight="700" fill="#183044">0.9</text>
<rect x="210" y="507" width="62" height="38" rx="5" fill="#B7443E" opacity="0.53"/>
<text x="241" y="532" text-anchor="middle" font-size="11" font-weight="700" fill="#183044">0.3</text>
