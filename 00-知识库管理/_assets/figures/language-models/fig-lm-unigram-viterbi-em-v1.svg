<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Unigram LM：分段潜变量、Viterbi 与 EM</title>
<desc id="desc">为每个 token 赋概率，句子概率由分段路径概率构成；Viterbi 求 MAP，forward-backward 给后验计数，EM 更新码本。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">字符串 ab 的路径和</text>
<circle cx="65" cy="210" r="20" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<circle cx="200" cy="130" r="20" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<circle cx="335" cy="210" r="20" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<line x1="86" y1="202" x2="180" y2="142" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<line x1="220" y1="142" x2="315" y2="202" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<line x1="86" y1="220" x2="315" y2="220" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="130" y="150" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">a:.4</text>
<text x="265" y="150" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">b:.3</text>
<text x="200" y="244" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">ab:.2</text>
<text x="55" y="335" font-size="17" font-weight="800" text-anchor="start" fill="#1F2937">P(ab)=.4×.3 + .2 = .32</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Viterbi 与总似然不同</text>
<text x="445" y="115" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">MAP path</text>
<text x="445" y="155" font-size="18" font-weight="800" text-anchor="start" fill="#1F2937">max(.12, .20) = .20</text>
<text x="445" y="230" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">marginal likelihood</text>
<text x="445" y="270" font-size="18" font-weight="800" text-anchor="start" fill="#1F2937">sum(.12, .20) = .32</text>
<text x="445" y="350" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">Viterbi 选一条；forward 求所有路径和。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">EM / pruning 循环</text>
<rect x="845" y="95" width="285" height="52" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="127.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">E: path posterior</text>
<line x1="987" y1="150" x2="987" y2="182" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="845" y="187" width="285" height="52" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="987.5" y="219.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">expected token counts</text>
<line x1="987" y1="242" x2="987" y2="274" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="845" y="279" width="285" height="52" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="311.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">M: normalize p(v)</text>
<line x1="987" y1="334" x2="987" y2="366" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="845" y="371" width="285" height="52" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="987.5" y="403.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">prune low utility</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先区分 MAP 分段、边缘似然和采样分段；三者相同词表也会产生不同训练信号。</text>
</svg>