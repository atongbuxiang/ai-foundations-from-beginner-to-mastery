<rect x="445" y="350" width="310" height="48" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="600" y="380" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">A B [EOS] C D</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">样本窗口不是文档</text>
<rect x="845" y="100" width="285" height="52" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="132.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">document stream</text>
<line x1="987" y1="155" x2="987" y2="187" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="845" y="192" width="285" height="52" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="987.5" y="224.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">packing</text>
<line x1="987" y1="247" x2="987" y2="279" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="845" y="284" width="285" height="52" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="316.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">T-token windows</text>
<line x1="987" y1="339" x2="987" y2="371" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="845" y="376" width="285" height="52" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="987.5" y="408.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">loss mask</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">能复现一个语言模型，必须先复现文本、文档和窗口的生成函数。</text>
</svg>