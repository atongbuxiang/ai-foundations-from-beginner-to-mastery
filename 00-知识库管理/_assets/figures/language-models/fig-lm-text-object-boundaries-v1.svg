<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">文本怎样成为语言模型样本</title>
<desc id="desc">同一屏幕字符串依次经过字节解码、Unicode 处理、文档切分、tokenizer 和样本窗口；每个边界都属于版本合同。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">一条可逆主链</text>
<rect x="55" y="95" width="285" height="58" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="197.5" y="130.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">bytes</text>
<text x="198" y="178" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">UTF-8</text>
<line x1="198" y1="181" x2="198" y2="186" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="190" width="285" height="58" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="197.5" y="225.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">Unicode string</text>
<text x="198" y="273" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">normalize?</text>
<line x1="198" y1="276" x2="198" y2="281" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="285" width="285" height="58" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="197.5" y="320.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">document</text>
<text x="198" y="368" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">boundary</text>
<line x1="198" y1="371" x2="198" y2="376" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="380" width="285" height="58" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="197.5" y="415.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">token ids</text>
<text x="198" y="463" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">encode</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">边界改变样本空间</text>
<text x="445" y="112" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">doc 1</text>
<rect x="445" y="130" width="310" height="48" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="600" y="160" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">[BOS] A B [EOS]</text>
<text x="445" y="222" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">错误拼接</text>
<rect x="445" y="240" width="310" height="48" rx="5" fill="#FEE2E2" stroke="#C24135" stroke-width="2"/>
<text x="600" y="270" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">A B C D (跨文档条件)</text>
