<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">多样本推理要分覆盖率、聚合器与选择器</title><desc id="desc">左侧是同一问题的采样路径；右侧对比 self-consistency、oracle pass-at-k 与 verifier best-of-N。</desc>
<rect width="1200" height="700" fill="#FFFEFB"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.10"/></filter></defs>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.mono{font-family:"SFMono-Regular",Menlo,monospace}</style>
<text x="55" y="55" font-size="25" font-weight="700" fill="#2563EB">多样本推理要分覆盖率、聚合器与选择器</text>
<rect x="55" y="115" width="190" height="80" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<text x="71" y="144" font-size="16" font-weight="700" fill="#2563EB">Prompt x</text>
<text x="71" y="171" font-size="13" fill="#64748B">fixed sampler contract</text>
<line x1="245" y1="155" x2="345" y2="128" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="360" y="90" width="190" height="70" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" filter="url(#shadow)"/>
<text x="376" y="119" font-size="16" font-weight="700" fill="#0F766E">r₁ → A</text>
<text x="376" y="146" font-size="13" fill="#64748B">correct</text>
<line x1="245" y1="155" x2="345" y2="220" stroke="#C24135" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="360" y="182" width="190" height="70" rx="12" fill="#FFFFFF" stroke="#C24135" stroke-width="2" filter="url(#shadow)"/>
<text x="376" y="211" font-size="16" font-weight="700" fill="#C24135">r₂ → B</text>
<text x="376" y="238" font-size="13" fill="#64748B">wrong</text>
<line x1="245" y1="155" x2="345" y2="312" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="360" y="274" width="190" height="70" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" filter="url(#shadow)"/>
<text x="376" y="303" font-size="16" font-weight="700" fill="#0F766E">r₃ → A</text>
<text x="376" y="330" font-size="13" fill="#64748B">correct</text>
<line x1="245" y1="155" x2="345" y2="404" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="360" y="366" width="190" height="70" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<text x="376" y="395" font-size="16" font-weight="700" fill="#D97706">r₄ → C</text>
<text x="376" y="422" font-size="13" fill="#64748B">wrong</text>
<line x1="245" y1="155" x2="345" y2="496" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="360" y="458" width="190" height="70" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" filter="url(#shadow)"/>
<text x="376" y="487" font-size="16" font-weight="700" fill="#0F766E">r₅ → A</text>
<text x="376" y="514" font-size="13" fill="#64748B">correct</text>
<rect x="650" y="95" width="470" height="105" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<text x="666" y="124" font-size="16" font-weight="700" fill="#7C3AED">Self-consistency</text>
<text x="666" y="151" font-size="13" fill="#64748B">normalize final answers; A has 3/5 votes</text>
<text x="666" y="173" font-size="13" fill="#64748B">majority estimates modal answer, not truth</text>
<rect x="650" y="245" width="470" height="105" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<text x="666" y="274" font-size="16" font-weight="700" fill="#2563EB">Pass-at-k</text>
<text x="666" y="301" font-size="13" fill="#64748B">oracle event: at least one success among k</text>
<text x="666" y="323" font-size="13" fill="#64748B">1 − C(n−c,k) / C(n,k)</text>
<rect x="650" y="395" width="470" height="105" rx="12" fill="#ECFDF5" stroke="#0F766E" stroke-width="2" filter="url(#shadow)"/>
<text x="666" y="424" font-size="16" font-weight="700" fill="#0F766E">Best-of-N</text>
<text x="666" y="451" font-size="13" fill="#64748B">verifier ranks N candidates; report oracle coverage</text>
<text x="666" y="473" font-size="13" fill="#64748B">and selection regret separately</text>
<rect x="650" y="545" width="470" height="72" rx="12" fill="#FEE2E2" stroke="#C24135" stroke-width="2" filter="url(#shadow)"/>
<text x="666" y="574" font-size="16" font-weight="700" fill="#C24135">Shared budget</text>
<text x="666" y="601" font-size="13" fill="#64748B">samples × tokens + verifier calls + parser failures + latency</text>
<text x="55" y="670" font-size="14" fill="#64748B">更多样本只有在增加有效多样性且聚合/选择规则利用这些候选时才改善 top-1；相关性会降低有效 N。</text>
</svg>