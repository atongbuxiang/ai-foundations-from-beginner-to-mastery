<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Mixture-of-Denoisers：先抽 Mode，再抽 Corruption</title>
<desc id="desc">多目标训练是层级随机实验：mode weight、corruption severity、target count 和 sequence cost 共同决定实际梯度份额。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Hierarchical sampler</text>
<rect x="55" y="100" width="285" height="52" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="197.5" y="132.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">m ~ Categorical(pi)</text>
<line x1="197" y1="155" x2="197" y2="195" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="210" width="285" height="52" rx="8" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="197.5" y="242.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">c ~ q_m(c | x)</text>
<line x1="197" y1="265" x2="197" y2="305" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="320" width="285" height="52" rx="8" fill="#FEE2E2" stroke="#C24135" stroke-width="2"/>
<text x="197.5" y="352.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">loss L_m(theta;x,c)</text>
<text x="55" y="425" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">E[L] = sum_m pi_m E_c[L_m]</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">UL2-style denoiser families</text>
<rect x="445" y="80" width="55" height="42" rx="5" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="472" y="107" font-size="15" font-weight="800" text-anchor="middle" fill="#0F766E">R</text>
<text x="520" y="107" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">regular short-span denoising</text>
<rect x="445" y="195" width="55" height="42" rx="5" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="472" y="222" font-size="15" font-weight="800" text-anchor="middle" fill="#2563EB">S</text>
<text x="520" y="222" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">sequential / causal-like</text>
<rect x="445" y="310" width="55" height="42" rx="5" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="472" y="337" font-size="15" font-weight="800" text-anchor="middle" fill="#C24135">X</text>
<text x="520" y="337" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">extreme long-span denoising</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Nominal pi is not gradient share</text>
<text x="845" y="110" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">mode frequency</text>
<text x="845" y="150" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">× target tokens</text>
<text x="845" y="190" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">× loss reduction</text>
<text x="845" y="230" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">× gradient norm/covariance</text>
<line x1="845" y1="255" x2="1120" y2="255" stroke="#1F2937" stroke-width="2"/>
<text x="845" y="300" font-size="15" font-weight="800" text-anchor="start" fill="#1F2937">= realized optimization pressure</text>
<rect x="845" y="355" width="285" height="55" rx="6" fill="#FEE2E2" stroke="#C24135" stroke-width="2"/>
<text x="987" y="388" font-size="15" font-weight="750" text-anchor="middle" fill="#C24135">log numerator + denominator per mode</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">多目标的权重必须落实到样本、有效 targets、归约和梯度；配置中的 mixture probability 不是全部答案。</text>
</svg>