<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">近重复检测：从 shingles 与 Jaccard 到 MinHash 和 LSH 候选</title><desc id="desc">展示两个文档的 shingle 集、签名相等率、band collision 和最终 exact verification。</desc>
<rect width="1200" height="700" fill="#FFFEFB"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.12"/></filter></defs>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.mono{font-family:"SFMono-Regular",Menlo,monospace}</style>
<text x="55" y="55" font-size="25" font-weight="700" fill="#2563EB">近重复检测：从 shingles 与 Jaccard 到 MinHash 和 LSH 候选</text>
<rect x="55" y="120" width="245" height="190" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<text x="73" y="151" font-size="17" font-weight="700" fill="#2563EB">1 · shingle sets</text>
<text x="73" y="178" font-size="14" fill="#64748B">A={ab,bc,cd,de}</text>
<text x="73" y="201" font-size="14" fill="#64748B">B={ab,bc,cd,xy}</text>
<text x="73" y="224" font-size="14" fill="#64748B">|∩|=3, |∪|=5</text>
<text x="73" y="247" font-size="14" fill="#64748B">J(A,B)=3/5</text>
<line x1="305" y1="215" x2="360" y2="215" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="375" y="120" width="250" height="190" rx="12" fill="#ECFDF5" stroke="#0F766E" stroke-width="2" filter="url(#shadow)"/>
<text x="393" y="151" font-size="17" font-weight="700" fill="#0F766E">2 · MinHash signature</text>
<text x="393" y="178" font-size="14" fill="#64748B">k hashes / permutations</text>
<text x="393" y="201" font-size="14" fill="#64748B">match: [✓ ✓ ✗ ✓ ✗]</text>
<text x="393" y="224" font-size="14" fill="#64748B">estimator = 3/5</text>
<text x="393" y="247" font-size="14" fill="#64748B">variance remains</text>
<line x1="630" y1="215" x2="685" y2="215" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="700" y="120" width="225" height="190" rx="12" fill="#FFF7E8" stroke="#B7791F" stroke-width="2" filter="url(#shadow)"/>
<text x="718" y="151" font-size="17" font-weight="700" fill="#B7791F">3 · LSH bands</text>
<text x="718" y="178" font-size="14" fill="#64748B">b=2 bands, r=2 rows</text>
<text x="718" y="201" font-size="14" fill="#64748B">any band match → candidate</text>
<text x="718" y="224" font-size="14" fill="#64748B">P(candidate)=1-(1-sʳ)ᵇ</text>
<line x1="930" y1="215" x2="985" y2="215" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="995" y="120" width="150" height="190" rx="12" fill="#FEE2E2" stroke="#C24135" stroke-width="2" filter="url(#shadow)"/>
<text x="1013" y="151" font-size="17" font-weight="700" fill="#C24135">4 · verify</text>
<text x="1013" y="178" font-size="14" fill="#64748B">exact Jaccard</text>
<text x="1013" y="201" font-size="14" fill="#64748B">threshold τ</text>
<text x="1013" y="224" font-size="14" fill="#64748B">cluster + keep</text>
<text x="1013" y="247" font-size="14" fill="#64748B">representative</text>
<text x="55" y="365" font-size="18" font-weight="700" fill="#17324D">候选概率曲线（b=8, r=4）：阈值不是硬台阶</text>
<line x1="90" y1="595" x2="560" y2="595" stroke="#17324D" stroke-width="2"/><line x1="90" y1="595" x2="90" y2="400" stroke="#17324D" stroke-width="2"/>
<text x="530" y="625" font-size="14" fill="#64748B">similarity s</text><text x="30" y="410" font-size="14" fill="#64748B">P(candidate)</text>
<path d="M90 595 C 260 594, 330 575, 390 500 C 450 425, 500 405, 560 400" fill="none" stroke="#7C3AED" stroke-width="4"/>
<line x1="390" y1="595" x2="390" y2="500" stroke="#C24135" stroke-dasharray="7 5"/><text x="398" y="580" font-size="13" fill="#C24135">operating point</text>
<rect x="650" y="365" width="495" height="245" rx="12" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2" filter="url(#shadow)"/>
<text x="668" y="396" font-size="17" font-weight="700" fill="#17324D">审计四问</text>
<text x="668" y="423" font-size="14" fill="#64748B">① shingle/normalization 是否改变对象？</text>
<text x="668" y="446" font-size="14" fill="#64748B">② signature length 给多大 estimator variance？</text>
<text x="668" y="469" font-size="14" fill="#64748B">③ LSH 的 false negative / candidate load？</text>
<text x="668" y="492" font-size="14" fill="#64748B">④ cluster 留最早、最长还是最高质量？</text>
<text x="55" y="670" font-size="14" fill="#64748B">MinHash 估计 similarity；LSH 产生候选；最终删除仍需要阈值、验证与代表策略。</text>
</svg>