<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Grammar decoding：检查可完成前缀，而非只看首字符</title><desc id="desc">parser state、完整 token 字节转移与语义安全边界。</desc>
<rect width="1200" height="700" fill="#FBF8F1"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#667784"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#183044" flood-opacity="0.10"/></filter></defs>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.mono{font-family:"SFMono-Regular",Menlo,monospace}</style>
<line x1="48" y1="70" x2="1152" y2="70" stroke="#4F7B45" stroke-width="4"/>
<text x="52" y="49" font-size="24" font-weight="700" fill="#183044">Grammar decoding：检查可完成前缀，而非只看首字符</text>
<circle cx="110" cy="205" r="38" fill="#FFFDF8" stroke="#245AA8" stroke-width="3" filter="url(#shadow)"/>
<text x="110" y="211" text-anchor="middle" font-size="16" font-weight="700" fill="#245AA8">q₀</text>
<circle cx="315" cy="150" r="38" fill="#FFFDF8" stroke="#17766E" stroke-width="3" filter="url(#shadow)"/>
<text x="315" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#17766E">q₁</text>
<circle cx="525" cy="205" r="38" fill="#FFFDF8" stroke="#17766E" stroke-width="3" filter="url(#shadow)"/>
<text x="525" y="211" text-anchor="middle" font-size="16" font-weight="700" fill="#17766E">q₂</text>
<circle cx="315" cy="325" r="38" fill="#FFFDF8" stroke="#B7443E" stroke-width="3" filter="url(#shadow)"/>
<text x="315" y="331" text-anchor="middle" font-size="16" font-weight="700" fill="#B7443E">dead</text>
<line x1="148" y1="195" x2="275" y2="160" stroke="#4F7B45" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="215" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#4F7B45">token &#x27;{&quot;&#x27;</text>
<line x1="353" y1="160" x2="487" y2="195" stroke="#4F7B45" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="420" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#4F7B45">token &#x27;key&quot;&#x27;</text>
<line x1="132" y1="234" x2="280" y2="310" stroke="#B7443E" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="208" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="#B7443E">token &#x27;{]&#x27;</text>
<circle cx="525" cy="205" r="30" fill="none" stroke="#17766E" stroke-width="2"/>
<text x="70" y="100" text-anchor="start" font-size="15" font-weight="700" fill="#183044">L：目标语言    Pref(L)：仍可补全为 L 的全部前缀</text>
<rect x="635" y="105" width="490" height="150" rx="10" fill="#EEF4FC" stroke="#245AA8" stroke-width="1.8" filter="url(#shadow)"/>
<text x="650" y="133" text-anchor="start" font-size="15" font-weight="700" fill="#245AA8">Token-level valid set</text>
<text x="650" y="158" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">A(q)={v : δ*(q, bytes(v)) 仍可抵达接受态}</text>
<text x="650" y="178" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">q(v)=p(v)·1[v∈A(q)] / Z</text>
<text x="650" y="198" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">Z 很小：形式可行，但模型原始合法质量很低</text>
<text x="70" y="420" text-anchor="start" font-size="16" font-weight="700" fill="#183044">保证必须分层</text>
<rect x="70" y="455" width="235" height="115" rx="10" fill="#FFFDF8" stroke="#4F7B45" stroke-width="1.8" filter="url(#shadow)"/>
<text x="85" y="483" text-anchor="start" font-size="15" font-weight="700" fill="#4F7B45">语法</text>
<text x="85" y="508" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">括号、逗号、枚举</text>
<rect x="330" y="455" width="235" height="115" rx="10" fill="#FFFDF8" stroke="#245AA8" stroke-width="1.8" filter="url(#shadow)"/>
<text x="345" y="483" text-anchor="start" font-size="15" font-weight="700" fill="#245AA8">Schema 子集</text>
<text x="345" y="508" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">类型、required、范围支持</text>
<rect x="590" y="455" width="235" height="115" rx="10" fill="#FFFDF8" stroke="#C87922" stroke-width="1.8" filter="url(#shadow)"/>
<text x="605" y="483" text-anchor="start" font-size="15" font-weight="700" fill="#C87922">语义</text>
<text x="605" y="508" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">跨字段关系、事实</text>
<rect x="850" y="455" width="275" height="115" rx="10" fill="#FFFDF8" stroke="#B7443E" stroke-width="1.8" filter="url(#shadow)"/>
<text x="865" y="483" text-anchor="start" font-size="15" font-weight="700" fill="#B7443E">权限与副作用</text>
<text x="865" y="508" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">授权、金额、幂等、沙箱</text>
<text x="187" y="607" text-anchor="middle" font-size="12" font-weight="700" fill="#4F7B45">约束器可承诺</text>
<line x1="300" y1="604" x2="845" y2="604" stroke="#667784" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="990" y="607" text-anchor="middle" font-size="12" font-weight="700" fill="#B7443E">需独立验证与治理</text>
<line x1="48" y1="650" x2="1152" y2="650" stroke="#D9D5CB"/>
<text x="52" y="674" font-size="13" fill="#667784">语法接受态不证明字段真实、相互一致或工具安全；tokenizer 与 grammar 版本都属于约束合同。</text>
</svg>