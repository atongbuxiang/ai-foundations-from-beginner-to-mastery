<rect x="70" y="565" width="500" height="65" rx="10" fill="#FFF0ED" stroke="#B7443E" stroke-width="1.8" filter="url(#shadow)"/>
<text x="85" y="593" text-anchor="start" font-size="15" font-weight="700" fill="#B7443E">搜索账</text>
<text x="85" y="618" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">active beams ≠ completed hypotheses；剪掉的未来不可恢复</text>
<rect x="620" y="565" width="510" height="65" rx="10" fill="#EEF4FC" stroke="#245AA8" stroke-width="1.8" filter="url(#shadow)"/>
<text x="635" y="593" text-anchor="start" font-size="15" font-weight="700" fill="#245AA8">评分账</text>
<text x="635" y="618" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">raw Σ log p 偏短；length normalization 会重新定义排序目标</text>
<line x1="48" y1="650" x2="1152" y2="650" stroke="#D9D5CB"/>
<text x="52" y="674" font-size="13" fill="#667784">扩大 beam 改善搜索近似不保证任务质量单调；early-stop 必须有可证的完成上界或明确启发式。</text>
</svg>