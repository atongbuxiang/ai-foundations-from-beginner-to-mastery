<text x="130.0" y="497" text-anchor="middle" font-size="11" font-weight="400" fill="#667784">-0.87</text>
<circle cx="443.3333333333333" cy="480" r="36" fill="#FFFDF8" stroke="#C87922" stroke-width="3" filter="url(#shadow)"/>
