<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">T5 Span Corruption：Sentinel 建立可逆对齐</title>
<desc id="desc">连续被删 spans 在 encoder input 中各由唯一 sentinel 代替；decoder target 按 sentinel 顺序串联被删内容并以最终 sentinel/EOS 收尾。</desc>
