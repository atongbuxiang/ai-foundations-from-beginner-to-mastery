<text x="845" y="280" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">decoder teacher forcing:</text>
<text x="845" y="315" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">[BOS,&lt;X&gt;,B,C,&lt;Y&gt;,F] →</text>
<text x="845" y="345" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">[&lt;X&gt;,B,C,&lt;Y&gt;,F,&lt;Z&gt;]</text>
<rect x="845" y="395" width="285" height="48" rx="5" fill="#FEE2E2" stroke="#C24135" stroke-width="2"/>
<text x="987" y="425" font-size="15" font-weight="750" text-anchor="middle" fill="#C24135">sentinel order = alignment contract</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Span corruption 提高每个 sentinel 的信息负载；唯一 sentinel 与 target 顺序使多 span 重建保持可对齐。</text>
