<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">GPT、BERT、T5：目标—架构—证据拆分</title>
<desc id="desc">代表模型同时改变 objective、visibility、architecture、data 和 transfer protocol；观察到的能力差异不能只归因于模型家族名。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">GPT-like</text>
<text x="55" y="115" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">objective</text>
<text x="55" y="150" font-size="15" font-weight="750" text-anchor="start" fill="#1F2937">next-token CLM</text>
<text x="55" y="215" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">visibility</text>
<text x="55" y="250" font-size="15" font-weight="750" text-anchor="start" fill="#1F2937">causal</text>
<text x="55" y="315" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">outlet</text>
<text x="55" y="350" font-size="15" font-weight="750" text-anchor="start" fill="#1F2937">autoregressive text</text>
<text x="55" y="420" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">evidence: model/data/scale specific</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">BERT-like</text>
<text x="445" y="115" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">objective</text>
<text x="445" y="150" font-size="15" font-weight="750" text-anchor="start" fill="#1F2937">corrupted-token MLM</text>
<text x="445" y="215" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">visibility</text>
<text x="445" y="250" font-size="15" font-weight="750" text-anchor="start" fill="#1F2937">bidirectional corrupted input</text>
<text x="445" y="315" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">outlet</text>
<text x="445" y="350" font-size="15" font-weight="750" text-anchor="start" fill="#1F2937">representations / fill mask</text>
<text x="445" y="420" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">PLL is a derived score</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">T5-like</text>
<text x="845" y="115" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">objective</text>
<text x="845" y="150" font-size="15" font-weight="750" text-anchor="start" fill="#1F2937">span denoising seq2seq</text>
<text x="845" y="215" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">visibility</text>
<text x="845" y="250" font-size="15" font-weight="750" text-anchor="start" fill="#1F2937">encoder full + decoder causal</text>
<text x="845" y="315" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">outlet</text>
<text x="845" y="350" font-size="15" font-weight="750" text-anchor="start" fill="#1F2937">conditional target text</text>
<text x="845" y="420" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">sentinels bind removed spans</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">架构、可见性、corruption、loss 与数据必须逐轴比较；“GPT/BERT/T5 更强”不是无条件科学命题。</text>
</svg>