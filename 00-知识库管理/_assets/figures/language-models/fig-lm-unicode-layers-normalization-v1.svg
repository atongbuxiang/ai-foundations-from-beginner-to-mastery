<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Unicode 的四个层次与规范化边界</title>
<desc id="desc">字节、码点、字素簇和 glyph 不是同一对象；canonical normalization 与 compatibility normalization 保留的信息不同。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">同一个 é 的两种码点序列</text>
<text x="55" y="120" font-size="15" font-weight="800" text-anchor="start" fill="#B7791F">NFC</text>
<rect x="105" y="90" width="210" height="52" rx="5" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="210" y="123" font-size="17" font-weight="700" text-anchor="middle" fill="#B7791F">U+00E9</text>
<text x="55" y="220" font-size="15" font-weight="800" text-anchor="start" fill="#2563EB">NFD</text>
<rect x="105" y="190" width="95" height="52" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="152" y="223" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">U+0065</text>
<text x="220" y="223" font-size="18" font-weight="700" text-anchor="start" fill="#1F2937">+</text>
<rect x="245" y="190" width="95" height="52" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="292" y="223" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">U+0301</text>
<line x1="210" y1="150" x2="210" y2="180" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="55" y="310" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">视觉可同；len(code points) 不同</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">一个字素簇可含多个码点</text>
<circle cx="465" cy="145" r="27" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="465" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">👩</text>
<circle cx="535" cy="145" r="27" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="535" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">ZWJ</text>
<circle cx="605" cy="145" r="27" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="605" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">👩</text>
<circle cx="675" cy="145" r="27" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="675" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">ZWJ</text>
<circle cx="745" cy="145" r="27" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="745" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">👧</text>
<line x1="465" y1="190" x2="745" y2="190" stroke="#0F766E" stroke-width="4"/>
<text x="605" y="222" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">用户感知：一个家庭 emoji</text>
<text x="445" y="310" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">grapheme boundary 由 UAX #29 规则定义，</text>
<text x="445" y="342" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">不是 Python/JS 的 code-unit 长度。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">NFC 与 NFKC 不可静默互换</text>
<rect x="845" y="85" width="52" height="42" rx="5" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="871" y="112" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2937">①</text>
<line x1="905" y1="105" x2="1000" y2="105" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a1)"/>
<text x="952" y="95" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">NFC</text>
<rect x="1015" y="85" width="72" height="42" rx="5" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="1051" y="112" font-size="18" font-weight="700" text-anchor="middle" fill="#2563EB">①</text>
<rect x="845" y="188" width="52" height="42" rx="5" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="871" y="215" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2937">①</text>
<line x1="905" y1="208" x2="1000" y2="208" stroke="#C24135" stroke-width="2.5" marker-end="url(#a1)"/>
<text x="952" y="198" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">NFKC</text>
<rect x="1015" y="188" width="72" height="42" rx="5" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="1051" y="215" font-size="18" font-weight="700" text-anchor="middle" fill="#C24135">1</text>
<rect x="845" y="291" width="52" height="42" rx="5" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="871" y="318" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2937">ｶ</text>
<line x1="905" y1="311" x2="1000" y2="311" stroke="#C24135" stroke-width="2.5" marker-end="url(#a1)"/>
<text x="952" y="301" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">NFKC</text>
<rect x="1015" y="291" width="72" height="42" rx="5" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="1051" y="318" font-size="18" font-weight="700" text-anchor="middle" fill="#C24135">カ</text>
<text x="845" y="405" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">compatibility normalization 可能丢失格式/身份信息。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">“字符数”必须绑定层次；规范化必须绑定形式、Unicode 版本与任务风险。</text>
</svg>