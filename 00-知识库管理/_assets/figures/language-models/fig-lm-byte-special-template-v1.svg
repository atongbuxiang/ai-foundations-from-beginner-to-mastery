<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Byte fallback、特殊 Token 与 Chat Template</title>
<desc id="desc">普通文本、控制符号和原始字节是三类不同通道；若模板或特殊 token 注册不一致，训练与推理会条件错位。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">开放输入的兜底路径</text>
<rect x="55" y="100" width="285" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="197.5" y="131.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">Unicode text</text>
<line x1="197" y1="153" x2="197" y2="190" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="205" width="285" height="55" rx="8" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="197.5" y="238.5" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">known pieces?</text>
<line x1="125" y1="263" x2="90" y2="310" stroke="#0F766E" stroke-width="2" marker-end="url(#a1)"/>
<line x1="270" y1="263" x2="310" y2="310" stroke="#C24135" stroke-width="2" marker-end="url(#a2)"/>
<text x="75" y="300" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">yes</text>
<text x="305" y="300" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">no</text>
<rect x="45" y="330" width="125" height="48" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="107.5" y="360.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">subword id</text>
<rect x="225" y="330" width="145" height="48" rx="8" fill="#FEE2E2" stroke="#C24135" stroke-width="2"/>
<text x="297.5" y="360.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">byte fallback ids</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三类 token 不应混淆</text>
<rect x="445" y="100" width="145" height="50" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="517.5" y="131.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">text token</text>
<text x="605" y="131" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">由用户文本编码</text>
<rect x="445" y="220" width="145" height="50" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="517.5" y="251.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">special token</text>
<text x="605" y="251" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">BOS/EOS/role/tool 控制</text>
<rect x="445" y="340" width="145" height="50" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="517.5" y="371.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">byte token</text>
<text x="605" y="371" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">保证任意 byte 可表示</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Chat template 是编译器</text>
<text x="845" y="103" font-size="15" font-weight="800" text-anchor="start" fill="#0F766E">messages</text>
<text x="845" y="143" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">system / user / assistant</text>
<line x1="985" y1="160" x2="985" y2="195" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="845" y="210" width="285" height="58" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="987" y="245" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">role tokens + separators</text>
<line x1="985" y1="272" x2="985" y2="307" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="845" y="322" width="285" height="58" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="987" y="357" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">token ids + loss mask</text>
<text x="845" y="435" font-size="15" font-weight="800" text-anchor="start" fill="#C24135">模板版本不同 = 条件事件不同。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">可逆性要求覆盖未知输入；安全性要求文本通道不能静默伪装成控制通道。</text>
</svg>