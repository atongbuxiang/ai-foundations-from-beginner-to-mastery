<text x="600.0" y="417" text-anchor="middle" font-size="11" font-weight="400" fill="#667784">6</text>
<text x="80" y="112" text-anchor="start" font-size="16" font-weight="700" fill="#183044">S(t)=Πᵢ&lt;t[1−hᵢ]</text>
<text x="340" y="435" text-anchor="middle" font-size="12" font-weight="400" fill="#667784">step t</text>
<rect x="675" y="105" width="450" height="150" rx="10" fill="#FFF0ED" stroke="#B7443E" stroke-width="1.8" filter="url(#shadow)"/>
<text x="690" y="133" text-anchor="start" font-size="15" font-weight="700" fill="#B7443E">五个 finish events</text>
<text x="690" y="158" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">EOS token · stop string · max_new_tokens</text>
<text x="690" y="178" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">grammar accepting state · server cancel/timeout</text>
<text x="690" y="198" text-anchor="start" font-size="12.5" font-weight="400" fill="#667784">必须报告触发者、返回文本是否含标记、是否截在 token 内</text>
<text x="760" y="310" text-anchor="start" font-size="15" font-weight="700" fill="#183044">退化循环不是 EOS 的反义词</text>
