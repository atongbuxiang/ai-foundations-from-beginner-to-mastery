<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">停止是一组事件：EOS hazard、外部截断与退化循环</title><desc id="desc">生存概率、finish reason 与重复状态环。</desc>
<rect width="1200" height="700" fill="#FBF8F1"/>
