<line x1="988" y1="445" x2="936" y2="503" stroke="#7054A3" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="871" y1="504" x2="822" y2="445" stroke="#7054A3" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="905" y="594" text-anchor="middle" font-size="12" font-weight="700" fill="#C87922">repetition penalty 改 logits → 改变采样核</text>
<line x1="48" y1="650" x2="1152" y2="650" stroke="#D9D5CB"/>
<text x="52" y="674" font-size="13" fill="#667784">训练期 exposure bias、模型概率形状、解码惩罚和服务截断要分账；同一重复现象可有不同原因。</text>
