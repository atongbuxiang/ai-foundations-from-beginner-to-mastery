<text x="340.0" y="417" text-anchor="middle" font-size="11" font-weight="400" fill="#667784">3</text>
<circle cx="426.6666666666667" cy="262.2256" r="5" fill="#245AA8"/>
<text x="426.6666666666667" y="249.2256" text-anchor="middle" font-size="10.5" font-weight="400" fill="#245AA8">0.53</text>
<text x="426.6666666666667" y="417" text-anchor="middle" font-size="11" font-weight="400" fill="#667784">4</text>
<circle cx="513.3333333333333" cy="308.69664" r="5" fill="#245AA8"/>
