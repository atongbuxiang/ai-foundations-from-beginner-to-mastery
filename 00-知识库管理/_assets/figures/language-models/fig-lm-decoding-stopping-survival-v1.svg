<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.mono{font-family:"SFMono-Regular",Menlo,monospace}</style>
<line x1="48" y1="70" x2="1152" y2="70" stroke="#B7443E" stroke-width="4"/>
<text x="52" y="49" font-size="24" font-weight="700" fill="#183044">停止是一组事件：EOS hazard、外部截断与退化循环</text>
