<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Tokenizer 评估：压缩、公平、鲁棒与安全</title>
<desc id="desc">单一平均 token/字符不足以判定 tokenizer；需要语言切片、尾部风险、往返不变量、版本和下游预算匹配。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">四类可计算指标</text>
<text x="55" y="105" font-size="15" font-weight="800" text-anchor="start" fill="#2563EB">compression</text>
<text x="165" y="105" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">tokens / byte; bits / byte</text>
<text x="55" y="195" font-size="15" font-weight="800" text-anchor="start" fill="#0F766E">fertility</text>
<text x="165" y="195" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">tokens / word or grapheme</text>
<text x="55" y="285" font-size="15" font-weight="800" text-anchor="start" fill="#B7791F">coverage</text>
<text x="165" y="285" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">UNK / fallback / max length</text>
<text x="55" y="375" font-size="15" font-weight="800" text-anchor="start" fill="#C24135">round trip</text>
<text x="165" y="375" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">decode(encode(x)) = x?</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">平均值会隐藏群体尾部</text>
<text x="445" y="105" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">English</text>
<rect x="520" y="83" width="49.50000000000001" height="28" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="584.5" y="105" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">1.1</text>
<text x="445" y="187" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">中文</text>
<rect x="520" y="165" width="45.0" height="28" rx="2" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<text x="580.0" y="187" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">1.0</text>
<text x="445" y="269" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">தமிழ்</text>
<rect x="520" y="247" width="125.99999999999999" height="28" rx="2" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<text x="661.0" y="269" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">2.8</text>
<text x="445" y="351" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">emoji</text>
<rect x="520" y="329" width="189.0" height="28" rx="2" fill="#B7791F" stroke="#B7791F" stroke-width="1"/>
<text x="724.0" y="351" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">4.2</text>
<text x="445" y="445" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">示意 fertility；必须报告分布/切片，不只总体均值。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">审计顺序</text>
<rect x="845" y="100" width="290" height="52" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="132.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">1  固定语料/Unicode/normalization</text>
<line x1="990" y1="155" x2="990" y2="187" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="845" y="192" width="290" height="52" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="224.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">2  固定词表预算与模板</text>
<line x1="990" y1="247" x2="990" y2="279" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="845" y="284" width="290" height="52" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="990.0" y="316.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">3  分语言/域/攻击切片</text>
<line x1="990" y1="339" x2="990" y2="371" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="845" y="376" width="290" height="52" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="408.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">4  固定模型 FLOPs 或 wall time</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Tokenizer 优劣是多目标、任务相关的 Pareto 判断；总体均值不能替代公平与安全切片。</text>
</svg>