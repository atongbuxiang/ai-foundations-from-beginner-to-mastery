<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Chat Template 是编译器：结构化消息必须唯一落到 token 与生成边界</title><desc id="desc">消息对象经过模板和 tokenizer 形成 input ids，并由训练或生成模式决定后缀。</desc>
<rect width="1200" height="700" fill="#FFFEFB"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.10"/></filter></defs>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.mono{font-family:"SFMono-Regular",Menlo,monospace}</style>
<text x="55" y="55" font-size="25" font-weight="700" fill="#2563EB">Chat Template 是编译器：结构化消息必须唯一落到 token 与生成边界</text>
<rect x="55" y="115" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<rect x="68" y="127" width="78" height="36" rx="18" fill="#7C3AED"/><text x="107" y="150" text-anchor="middle" font-size="13" fill="#FFFFFF">system</text>
<text x="160" y="152" font-size="14" fill="#17324D">You are concise.</text>
<rect x="55" y="197" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<rect x="68" y="209" width="78" height="36" rx="18" fill="#2563EB"/><text x="107" y="232" text-anchor="middle" font-size="13" fill="#FFFFFF">user</text>
<text x="160" y="234" font-size="14" fill="#17324D">2+3=?</text>
<rect x="55" y="279" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
<rect x="68" y="291" width="78" height="36" rx="18" fill="#0F766E"/><text x="107" y="314" text-anchor="middle" font-size="13" fill="#FFFFFF">assistant</text>
<text x="160" y="316" font-size="14" fill="#17324D">5</text>
<rect x="55" y="361" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
<rect x="68" y="373" width="78" height="36" rx="18" fill="#D97706"/><text x="107" y="396" text-anchor="middle" font-size="13" fill="#FFFFFF">tool</text>
<text x="160" y="398" font-size="14" fill="#17324D">{&quot;name&quot;:&quot;calc&quot;}</text>
<line x1="350" y1="280" x2="405" y2="280" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="420" y="115" width="300" height="335" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<text x="436" y="144" font-size="16" font-weight="700" fill="#7C3AED">Template source + flags</text>
<text x="436" y="171" font-size="13" fill="#64748B">Jinja / repository revision</text>
<text x="436" y="193" font-size="13" fill="#64748B">role markers + separators</text>
<text x="436" y="215" font-size="13" fill="#64748B">BOS / EOS policy</text>
<text x="436" y="237" font-size="13" fill="#64748B">add_generation_prompt</text>
<text x="436" y="259" font-size="13" fill="#64748B">continue_final_message</text>
<text x="436" y="281" font-size="13" fill="#64748B">tool schema + escaping</text>
<line x1="735" y1="280" x2="790" y2="280" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="805" y="115" width="340" height="150" rx="12" fill="#FFF7E8" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<text x="821" y="144" font-size="16" font-weight="700" fill="#D97706">Rendered text</text>
<text x="821" y="171" font-size="13" fill="#64748B">&lt;|system|&gt; ... &lt;eos&gt;</text>
<text x="821" y="193" font-size="13" fill="#64748B">&lt;|user|&gt; ... &lt;eos&gt;</text>
<text x="821" y="215" font-size="13" fill="#64748B">&lt;|assistant|&gt;</text>
<rect x="805" y="300" width="340" height="150" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<text x="821" y="329" font-size="16" font-weight="700" fill="#2563EB">Tokenizer output</text>
<text x="821" y="356" font-size="13" fill="#64748B">input_ids + special token map</text>
<text x="821" y="378" font-size="13" fill="#64748B">attention relation</text>
<text x="821" y="400" font-size="13" fill="#64748B">prompt length / generation start</text>
<rect x="420" y="500" width="725" height="115" rx="12" fill="#FEE2E2" stroke="#C24135" stroke-width="2"/>
<text x="445" y="533" font-size="16" font-weight="700" fill="#C24135">同一消息，不同 template/flag 会成为不同条件事件</text>
<text x="445" y="566" font-size="14" fill="#17324D">训练：完整 assistant target + loss mask　　推理：只到 assistant generation prefix</text>
<text x="445" y="594" font-size="14" fill="#64748B">必须保存 template bytes、tokenizer hash、flags、最终 IDs 与 generation start。</text>
<text x="55" y="670" font-size="14" fill="#64748B">消息语义不等于序列语义；可复现对象是 compiler input、compiler version 与 compiler output 的三元组。</text>
</svg>