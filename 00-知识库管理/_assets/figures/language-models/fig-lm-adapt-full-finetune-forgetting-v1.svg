<text x="75" y="520" font-size="15" font-weight="700" fill="#17324D">不要用一个数替代三层变化</text>
<text x="75" y="550" font-size="14" fill="#64748B">参数：norm / cosine / layerwise drift</text>
<text x="75" y="578" font-size="14" fill="#64748B">函数：logit KL / representation / calibration</text>
<text x="75" y="606" font-size="14" fill="#64748B">能力：new / old / safety / temporal slices</text>
<text x="55" y="670" font-size="14" fill="#64748B">冻结参数限制可移动坐标，不自动限制功能变化；遗忘必须由旧能力切片和 matched checkpoint protocol 识别。</text>
