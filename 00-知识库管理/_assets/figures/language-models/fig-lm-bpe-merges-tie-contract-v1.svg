<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">BPE：频繁 pair 合并与确定性版本合同</title>
<desc id="desc">训练阶段重复计数并合并 pair；编码阶段按固定 merge rank 重放。并列频数、预切分和词尾标记都会改变模型文件。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">教学语料与 pair 计数</text>
<text x="55" y="112" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937">l o w &lt;/w&gt;   ×5</text>
<text x="55" y="152" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937">l o w e r &lt;/w&gt; ×2</text>
<text x="55" y="192" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937">n e w e s t &lt;/w&gt; ×6</text>
<text x="55" y="250" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">count(e,s)=6</text>
<text x="55" y="285" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">count(s,t)=6</text>
<text x="55" y="330" font-size="15" font-weight="800" text-anchor="start" fill="#C24135">并列！需要固定 tie-break</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">一次 merge 是全局重写</text>
<rect x="445" y="105" width="52" height="42" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="471" y="132" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">e</text>
<rect x="510" y="105" width="52" height="42" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="536" y="132" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">s</text>
<line x1="570" y1="125" x2="635" y2="125" stroke="#B7791F" stroke-width="3" marker-end="url(#a1)"/>
<rect x="655" y="105" width="82" height="42" rx="5" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="696" y="132" font-size="17" font-weight="700" text-anchor="middle" fill="#B7791F">es</text>
<text x="445" y="210" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">merge rank 0: (e,s) → es</text>
<text x="445" y="250" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">rank 1: (es,t) → est</text>
<text x="445" y="310" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">encoding 只按 rank，不重新看语料频率</text>
<text x="445" y="365" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">预切分/空格标记也属于算法输入。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">同频 tie 产生分叉版本</text>
<rect x="865" y="95" width="235" height="45" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="982" y="124" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">e s t</text>
<line x1="925" y1="145" x2="890" y2="210" stroke="#2563EB" stroke-width="2" marker-end="url(#a0)"/>
<line x1="1040" y1="145" x2="1075" y2="210" stroke="#C24135" stroke-width="2" marker-end="url(#a2)"/>
<rect x="835" y="225" width="145" height="48" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="907" y="255" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">es t</text>
<rect x="1020" y="225" width="145" height="48" rx="5" fill="#FEE2E2" stroke="#C24135" stroke-width="2"/>
<text x="1092" y="255" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">e st</text>
<text x="845" y="340" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">词表大小相同 ≠ tokenizer 相同</text>
<text x="845" y="380" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">保存 corpus hash、pretokenizer、tie rule、merges。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">BPE 的可复现对象不是“算法名”，而是预切分、初始符号、计数、并列规则与有序 merges。</text>
</svg>