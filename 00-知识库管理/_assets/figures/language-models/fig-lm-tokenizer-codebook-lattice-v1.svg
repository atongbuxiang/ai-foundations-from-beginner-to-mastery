<line x1="86" y1="220" x2="134" y2="284" stroke="#2563EB" stroke-width="2" marker-end="url(#a0)"/>
<text x="110.0" y="244.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">ab</text>
<line x1="176" y1="125" x2="234" y2="125" stroke="#2563EB" stroke-width="2" marker-end="url(#a0)"/>
<text x="205.0" y="117.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">b</text>
