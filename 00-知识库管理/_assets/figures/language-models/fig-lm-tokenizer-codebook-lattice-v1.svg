<text x="595.0" y="133.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">Vocabulary</text>
<text x="445" y="182" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">token ↔ id; versioned</text>
<rect x="445" y="220" width="300" height="55" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="595.0" y="253.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">Segmentation</text>
<text x="445" y="302" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">deterministic or sampled</text>
<rect x="445" y="340" width="300" height="55" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="595.0" y="373.5" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">Decoder</text>
<text x="445" y="422" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">ids → bytes/text; total?</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">码本粒度的三角权衡</text>
<path d="M985 100L850 410L1120 410Z" fill="#FFF7ED" stroke="#B7791F" stroke-width="3"/>
<text x="985" y="85" font-size="15" font-weight="800" text-anchor="middle" fill="#B7791F">短序列</text>
<text x="835" y="440" font-size="15" font-weight="800" text-anchor="start" fill="#0F766E">小词表 / 覆盖</text>
<text x="1130" y="440" font-size="15" font-weight="800" text-anchor="end" fill="#2563EB">参数 / 稀疏性</text>
<circle cx="980" cy="290" r="10" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="1000" y="295" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">任务相关 Pareto 点</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Tokenizer 不是无损预处理的同义词，而是模型概率空间和资源预算的一部分。</text>
</svg>