<text x="205.0" y="287.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">c</text>
<line x1="276" y1="125" x2="326" y2="198" stroke="#2563EB" stroke-width="2" marker-end="url(#a0)"/>
<text x="301.0" y="153.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">c</text>
