<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">指令数据不是一行 prompt-response：来源、模板、turn 与选择构成经验分布</title><desc id="desc">展示任务祖先、模板扩展、synthetic teacher、过滤和多轮切分如何共同决定训练份额。</desc>
