<text x="641" y="548" font-size="13" fill="#64748B">effective context: task accuracy remains above preregistered threshold</text>
<text x="641" y="570" font-size="13" fill="#64748B">必须绑定 task × position × distractor × output contract</text>
<text x="55" y="670" font-size="14" fill="#64748B">Lost-in-the-middle 是经验诊断而非结构定理；RULER 的 synthetic success 也不能替代真实文档理解。</text>
