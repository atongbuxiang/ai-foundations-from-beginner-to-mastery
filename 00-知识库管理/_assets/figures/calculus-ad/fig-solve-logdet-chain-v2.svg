<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">求解—log-det 计算图的三种一致导数</title>
<desc id="desc">同一个二维 SPD 算例中，primal 计算、JVP 前推与 VJP 回拉都给出 dL/dtheta=-1/27；求解与 log-det 两条分支在共享矩阵处累加。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">一张图，两条分支</text>
<rect x="58" y="95" width="72" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="94.0" y="125.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">theta</text>
<rect x="185" y="95" width="150" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="260.0" y="125.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">A(theta)</text>
<line x1="132" y1="119" x2="180" y2="119" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<rect x="48" y="215" width="145" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="120.5" y="250.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">solve A x=b</text>
<rect x="220" y="215" width="145" height="58" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="292.5" y="250.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">1/2 logdet A</text>
<path d="M235 145C205 165 165 180 125 210" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<path d="M285 145C305 165 315 180 300 210" fill="none" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<rect x="48" y="325" width="145" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="120.5" y="358.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">q=1/2 ||x||^2</text>
<rect x="220" y="325" width="145" height="54" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="292.5" y="358.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">r</text>
<line x1="120" y1="275" x2="120" y2="320" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<line x1="292" y1="275" x2="292" y2="320" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<path d="M120 382C145 410 168 420 198 438" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<path d="M292 382C270 410 245 420 215 438" fill="none" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<rect x="165" y="440" width="90" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="210.0" y="470.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">L=q+r</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">JVP：切向量前推</text>
<rect x="445" y="98" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="133.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">A0=[[2,1],[1,2]],  x0=(2/3,-1/3)</text>
<rect x="445" y="210" width="310" height="64" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="248.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">xdot=(-4/9, 2/9)</text>
<rect x="445" y="330" width="145" height="64" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="517.5" y="368.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">qdot=-10/27</text>
<rect x="610" y="330" width="145" height="64" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="682.5" y="368.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">rdot=+9/27</text>
<line x1="600" y1="160" x2="600" y2="204" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<path d="M600 278C560 298 535 310 520 324" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<path d="M600 278C640 298 665 310 680 324" fill="none" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="600" y="460" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2937">Ldot = -10/27 + 9/27 = -1/27</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">VJP：贡献回拉并相加</text>
<rect x="845" y="100" width="285" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="135.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">solve A0^T lambda = x0</text>
<rect x="845" y="210" width="285" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="247.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">Abar_solve = -lambda x0^T</text>
<rect x="845" y="320" width="285" height="62" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="987.5" y="357.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">Abar_logdet = 1/2 A0^-T</text>
<line x1="988" y1="162" x2="988" y2="204" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<path d="M900 386C900 420 930 432 970 448" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<path d="M1070 386C1070 420 1040 432 1000 448" fill="none" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="990" y="482" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2937">&lt;Abar,E11&gt; = -1/27</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">直接求导 = JVP = VJP 配对；三条证据一致后，局部公式才算闭合。</text>
</svg>