<text x="458.0" y="302.0" class="label" text-anchor="start">centered gradient difference → analytic HVP</text>
<text x="438.0" y="337.0" class="small" text-anchor="start">100 random adjoint tests: max residual=4.4e-16</text>
<text x="438.0" y="365.0" class="small" text-anchor="start">chain N=1024: full tape≈1024 states</text>
<text x="438.0" y="391.0" class="small" text-anchor="start">√N checkpoint schedule≈64 live states</text>
<text x="438.0" y="418.0" class="small" text-anchor="start">Checkpoint换time/memory，不改同一程序导数</text>
