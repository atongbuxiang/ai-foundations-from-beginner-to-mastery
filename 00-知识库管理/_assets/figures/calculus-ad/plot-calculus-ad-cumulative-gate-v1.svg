<text x="74.0" y="302.0" class="label" text-anchor="start">red: linear remainder ~h²　blue: quadratic ~h³</text>
<text x="50.0" y="337.0" class="label" text-anchor="start">有限差分不是 h 越小越好：</text>
<text x="50.0" y="363.0" class="small" text-anchor="start">centered exp′(0): best h≈1e-05, error≈1.2e-11</text>
<text x="50.0" y="391.0" class="small" text-anchor="start">h=1e−15 时 error=0.055</text>
<text x="50.0" y="418.0" class="small" text-anchor="start">Taylor slope验收理论阶数；FD仅是数值证据</text>
