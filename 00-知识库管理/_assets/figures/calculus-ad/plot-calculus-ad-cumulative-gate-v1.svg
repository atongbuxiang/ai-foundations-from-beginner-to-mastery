<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">微积分、矩阵微分与自动微分累计复现门</title>
<desc id="desc">三面板展示 Taylor 余项和有限差分，JVP/VJP 伴随与 HVP，及隐式导数和谱间隙敏感性。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EEF2FF"/><stop offset=".52" stop-color="#F8FAFC"/><stop offset="1" stop-color="#ECFDF5"/></linearGradient><style>.title{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F172A}.head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#4338CA}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#64748B}.label{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.card{fill:#fff;stroke:#CBD5E1;stroke-width:1.3}.axis{stroke:#64748B;stroke-width:1.1}</style></defs>
<rect width="1200" height="470" rx="22" fill="url(#bg)"/>
<text x="40" y="38" class="title">CALC-CUM-01 计算门：局部模型、AD 传播与隐式/谱导数</text>
