<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">谱坐标、可逆换元与自动微分的对象边界</title>
<desc id="desc">旋转伸缩族在谱碰撞时失去唯一特征基，但底层线性映射仍可逆，Gaussian 换元与直接程序的前反向导数保持良好。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">谱坐标：先声明对象</text>
<rect x="48" y="96" width="305" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="200.5" y="130.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">T_t = R_t diag(2 exp(t), 1)</text>
<rect x="48" y="205" width="305" height="60" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="200.5" y="241.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">A_t = T_t T_t^T</text>
<line x1="200" y1="156" x2="200" y2="199" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="48" y="322" width="145" height="72" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="120.5" y="364.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">gap=3; l1&#x27;=8</text>
<rect x="213" y="322" width="140" height="72" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="283.0" y="364.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">t*=-log2; A*=I</text>
<path d="M165 269C135 286 120 300 118 316" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<path d="M235 269C265 286 280 300 282 316" fill="none" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="48" y="455" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">重谱：basis 不唯一；T_t* 仍为正交矩阵。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">可逆换元：质量守恒</text>
<rect x="445" y="98" width="130" height="54" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="510.0" y="131.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">z ~ N(0,I)</text>
<rect x="625" y="98" width="130" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="690.0" y="131.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">x = T_t z</text>
<line x1="578" y1="125" x2="620" y2="125" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<rect x="445" y="210" width="310" height="64" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="248.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">det T_t = 2 exp(t) &gt; 0</text>
<rect x="445" y="328" width="310" height="68" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="368.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">p_X = p_Z(T_t^-1 x) / |det T_t|</text>
<line x1="600" y1="158" x2="600" y2="204" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<line x1="600" y1="278" x2="600" y2="322" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<text x="600" y="458" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">x*=(1,2):  NLL&#x27;(0) = -3/4</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">AD：对程序而非意图求导</text>
<rect x="842" y="96" width="292" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="988.0" y="131.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">sin, cos, exp, arithmetic</text>
<rect x="842" y="210" width="135" height="64" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="909.5" y="248.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">JVP = -3/4</text>
<rect x="999" y="210" width="135" height="64" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="1066.5" y="248.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">VJP = -3/4</text>
<path d="M988 158C930 178 915 190 910 204" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<path d="M988 158C1045 178 1060 190 1065 204" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<rect x="842" y="332" width="292" height="72" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="988" y="361" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">repeated-spectrum eigenbasis</text>
<text x="988" y="386" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">gradient rule may fail</text>
<text x="842" y="456" font-size="16" font-weight="650" text-anchor="start" fill="#64748B">函数可微，不保证任意中间表示可微。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先定位失效对象：谱基退化、Jacobian 奇异与程序规则错误是三类不同问题。</text>
</svg>