<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Eckart–Young–Mirsky 定理</title><desc id="d">展示截断奇异值、谱与 Frobenius 尾误差，以及从矩阵最优到任务最优的边界。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker><style>.T{font:700 22px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.P{font:700 17px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.B{font:14px -apple-system,"PingFang SC",sans-serif;fill:#334155}.S{font:12px -apple-system,"PingFang SC",sans-serif;fill:#475569}.M{font:italic 15px Georgia,serif;fill:#0f172a}</style></defs><rect width="1200" height="430" rx="18" fill="#f8fafc"/><text x="42" y="38" class="T">Eckart–Young–Mirsky：前 k 个奇异方向给出最佳秩-k 近似</text>
<g transform="translate(30 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">A  截断 SVD</text><g transform="translate(30 70)"><rect x="0" y="12" width="38" height="170" fill="#1d4ed8"/><rect x="52" y="48" width="38" height="134" fill="#2563eb"/><rect x="104" y="77" width="38" height="105" fill="#3b82f6"/><rect x="156" y="113" width="38" height="69" fill="#cbd5e1"/><rect x="208" y="139" width="38" height="43" fill="#cbd5e1"/><rect x="260" y="158" width="38" height="24" fill="#cbd5e1"/><line x1="-8" y1="182" x2="310" y2="182" stroke="#94a3b8"/><line x1="149" y1="0" x2="149" y2="195" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/><text x="105" y="211" class="S">Aₖ 保留</text><text x="207" y="211" class="S">尾部丢弃</text></g><text x="20" y="308" class="M">Aₖ = Σᵢ≤k σᵢuᵢvᵢ*</text><text x="20" y="329" class="S">rank(Aₖ)≤k；先给可达上界，再证明无人更优</text></g>
<g transform="translate(420 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">B  两种误差读取不同尾部</text><rect x="24" y="72" width="312" height="74" rx="11" fill="#dbeafe" stroke="#60a5fa"/><text x="40" y="101" class="B">谱范数：最坏输入方向</text><text x="40" y="128" class="M">min ‖A−B‖₂ = σₖ₊₁</text><rect x="24" y="173" width="312" height="74" rx="11" fill="#dcfce7" stroke="#22c55e"/><text x="40" y="202" class="B">Frobenius：全部尾能量</text><text x="40" y="229" class="M">min ‖A−B‖F = √Σᵢ&gt;k σᵢ²</text><text x="24" y="286" class="S">条件：rank(B)≤k，误差范数酉不变</text><text x="24" y="312" class="S">σₖ=σₖ₊₁ 时最优矩阵/子空间可能不唯一</text></g>
<g transform="translate(810 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">C  矩阵最优不等于任务最优</text><rect x="20" y="67" width="126" height="58" rx="10" fill="#dbeafe"/><text x="37" y="91" class="B">W → Wₖ</text><text x="37" y="112" class="S">最小矩阵误差</text><path d="M148 96H190" stroke="#334155" marker-end="url(#a)"/><rect x="194" y="67" width="144" height="58" rx="10" fill="#fef3c7"/><text x="209" y="91" class="B">单层输出界</text><text x="209" y="112" class="S">≤σₖ₊₁‖x‖</text><path d="M266 127V169" stroke="#334155" marker-end="url(#a)"/><rect x="78" y="174" width="260" height="62" rx="10" fill="#fee2e2"/><text x="94" y="198" class="B">端到端损失还依赖</text><text x="94" y="221" class="S">数据分布、后续 Jacobian、激活与残差路径</text><text x="20" y="276" class="S">不适用：元素加权、缺失观测、结构约束</text><text x="20" y="301" class="S">LoRA：随任务损失学习，并非训练后截断</text><text x="20" y="326" class="S">部署：参数更少不等于硬件更快</text></g></svg>
