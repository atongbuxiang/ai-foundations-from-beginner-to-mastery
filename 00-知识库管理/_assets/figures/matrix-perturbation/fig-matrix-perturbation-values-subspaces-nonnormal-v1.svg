<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">矩阵扰动中的谱值、子空间与非正规性</title><desc id="d">三个面板对比 Hermitian 谱值的 Lipschitz 稳定，小谱间隙导致方向旋转，以及非正规矩阵特征值的敏感性。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker><style>.T{font:700 22px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.P{font:700 17px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.B{font:14px -apple-system,"PingFang SC",sans-serif;fill:#334155}.S{font:12px -apple-system,"PingFang SC",sans-serif;fill:#475569}.M{font:italic 15px Georgia,serif;fill:#0f172a}</style></defs><rect width="1200" height="430" rx="18" fill="#f8fafc"/><text x="42" y="38" class="T">矩阵扰动：值、方向、子空间必须分层讨论</text>
<g transform="translate(30 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">A  Hermitian 谱值：移动至多 ‖E‖₂</text><line x1="40" y1="166" x2="322" y2="166" stroke="#94a3b8" stroke-width="2"/><circle cx="88" cy="166" r="8" fill="#2563eb"/><circle cx="180" cy="166" r="8" fill="#2563eb"/><circle cx="281" cy="166" r="8" fill="#2563eb"/><line x1="77" y1="122" x2="99" y2="122" stroke="#ef4444" stroke-width="7"/><line x1="169" y1="122" x2="191" y2="122" stroke="#ef4444" stroke-width="7"/><line x1="270" y1="122" x2="292" y2="122" stroke="#ef4444" stroke-width="7"/><path d="M88 156V130M180 156V130M281 156V130" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="48" y="199" class="S">λ₃</text><text x="168" y="199" class="S">λ₂</text><text x="270" y="199" class="S">λ₁</text><text x="20" y="261" class="M">|λᵢ(A+E) − λᵢ(A)| ≤ ‖E‖₂</text><text x="20" y="292" class="S">不需要谱值互异；重复值的数值仍稳定</text><text x="20" y="316" class="S">奇异值也满足同样的 1-Lipschitz 界</text></g>
<g transform="translate(420 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">B  方向：小 gap 会放大旋转</text><line x1="180" y1="190" x2="180" y2="65" stroke="#cbd5e1"/><line x1="75" y1="190" x2="300" y2="190" stroke="#cbd5e1"/><line x1="180" y1="190" x2="180" y2="82" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><line x1="180" y1="190" x2="270" y2="112" stroke="#ef4444" stroke-width="5" marker-end="url(#a)"/><path d="M180 145A45 45 0 0 1 214 160" fill="none" stroke="#7c3aed" stroke-width="3"/><text x="214" y="148" class="M">θ</text><text x="99" y="100" class="S">原主方向</text><text x="253" y="100" class="S">扰动后</text><text x="20" y="250" class="M">sin θ ≲ ‖E‖₂ / gap</text><text x="20" y="281" class="S">gap ≫ 噪声：方向稳；gap ≲ 噪声：可大转动</text><text x="20" y="308" class="S">重根时比较整个投影 UU*，不追单列</text></g>
<g transform="translate(810 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">C  非正规：特征值本身也可能敏感</text><circle cx="170" cy="153" r="10" fill="#0f172a"/><ellipse cx="170" cy="153" rx="46" ry="33" fill="#dbeafe" fill-opacity=".55" stroke="#2563eb" stroke-width="2"/><ellipse cx="170" cy="153" rx="94" ry="67" fill="#ffedd5" fill-opacity=".45" stroke="#f97316" stroke-width="3"/><path d="M268 153H327" stroke="#ef4444" stroke-width="3" marker-end="url(#a)"/><text x="250" y="140" class="S">小 E 可推远 λ</text><text x="25" y="88" class="S">正规：ε 邻域</text><text x="27" y="220" class="S">非正规：伪谱显著膨胀</text><text x="20" y="256" class="M">dist(μ, Λ(A)) ≤ κ(V) ‖E‖₂</text><text x="20" y="285" class="M">‖(zI−A)⁻¹‖₂ &gt; 1/ε</text><text x="20" y="315" class="S">缺陷/强非正规时用 Schur、预解式与伪谱</text></g></svg>
