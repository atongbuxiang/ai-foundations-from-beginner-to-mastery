<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Moore–Penrose 伪逆的输出投影、最小范数输入与奇异值滤波</title>
  <desc id="desc">目标先投影到矩阵值域，再沿非零奇异方向反缩放并选取与零空间正交的最小范数解；右侧比较精确伪逆、截断和岭滤波。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .sans{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.math{font-family:"STIX Two Math","Times New Roman",serif}.ink{fill:#1f2937}.muted{fill:#64748b}.blue{fill:#2563eb}.green{fill:#0f766e}.amber{fill:#b7791f}.h{font-size:19px;font-weight:600}.body{font-size:16px}.small{font-size:15px}.formula{font-size:20px}.result{font-size:19px;font-weight:600}.axis{stroke:#cbd5e1;stroke-width:1.4}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="42" class="sans h ink" text-anchor="middle">A†b：先把不可达目标投到值域，再从所有最小二乘解中选最短输入</text>

  <rect x="42" y="74" width="350" height="360" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="68" y="110" class="sans h blue">输出空间：先解决“能否到达”</text>
  <path d="M85 348L332 126" stroke="#94a3b8" stroke-width="2"/>
  <text x="255" y="150" class="math body muted">R(A)</text>
  <circle cx="150" cy="180" r="6" fill="#b7791f"/><text x="105" y="169" class="math body amber">目标 b</text>
  <path d="M150 180L214 283" class="arrow"/><path d="M207 276L219 264L231 276" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="214" cy="283" r="7" fill="#2563eb"/><text x="225" y="310" class="math body blue">b̂=AA†b</text>
  <text x="68" y="376" class="sans body ink">残差 b−b̂ 垂直于值域</text>
  <text x="68" y="406" class="math body green">AA†=P<tspan baseline-shift="sub" font-size="15">R(A)</tspan></text>

  <path d="M392 250H430" class="arrow"/><text x="411" y="231" class="math h green" text-anchor="middle">A†</text>
  <rect x="430" y="74" width="350" height="360" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="456" y="110" class="sans h green">输入空间：再解决“选哪个解”</text>
  <path d="M480 331H736" stroke="#94a3b8" stroke-width="2"/>
  <text x="608" y="360" class="math body muted" text-anchor="middle">x†+N(A)：全部最小二乘解</text>
  <circle cx="608" cy="331" r="7" fill="#0f766e"/><text x="620" y="318" class="math body green">x†=A†b</text>
  <circle cx="608" cy="222" r="6" fill="#1f2937"/><text x="620" y="215" class="sans small ink">原点</text>
  <path d="M608 222V322" class="arrow"/>
  <text x="474" y="178" class="sans body ink">x† 位于 R(A*)=N(A)⊥</text>
  <text x="474" y="201" class="sans small muted">因此它与解族的零空间方向正交</text>
  <text x="456" y="406" class="math body blue">A†A=P<tspan baseline-shift="sub" font-size="15">R(A*)</tspan></text>

  <rect x="818" y="74" width="340" height="360" rx="12" fill="#fffaf0" stroke="#f5c04a"/>
  <text x="844" y="110" class="sans h amber">谱滤波：小奇异值决定风险</text>
  <path d="M864 352H1126M884 374V142" class="axis"/>
  <text x="1129" y="371" class="math small muted">σ</text><text x="858" y="145" class="math small muted">滤波</text>
  <path d="M901 155C932 198 969 254 1110 326" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M901 327C934 247 969 209 1007 207C1047 211 1080 255 1110 292" fill="none" stroke="#0f766e" stroke-width="3"/>
  <path d="M901 352H956V226C1002 251 1058 294 1110 326" fill="none" stroke="#b7791f" stroke-width="3"/>
  <text x="1018" y="317" class="sans small blue">精确 1/σ</text>
  <text x="1000" y="197" class="sans small green">岭：σ/(σ²+λ)</text>
  <text x="894" y="216" class="sans small amber">截断</text>
  <text x="844" y="406" class="sans small muted">精确无偏但放大噪声；截断与岭用偏差换稳定。</text>

  <rect x="70" y="470" width="1060" height="112" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="97" y="505" class="sans h blue">四条 Penrose 条件把“广义逆”固定成唯一的正交几何选择</text>
  <text x="97" y="540" class="math body ink">AA†A=A　　A†AA†=A†　　(AA†)*=AA†　　(A†A)*=A†A</text>
  <text x="1098" y="540" class="sans body amber" text-anchor="end">固定秩层内连续；跨秩时 ‖A†‖ 可爆炸</text>
  <text x="600" y="628" class="sans result ink" text-anchor="middle">伪逆不是“把零除成无穷”：它只反演可辨识方向，并用正交投影处理其余方向。</text>
</svg>
