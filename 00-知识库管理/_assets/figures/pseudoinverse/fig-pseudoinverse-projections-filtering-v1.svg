<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">伪逆的双投影和谱滤波</title><desc id="d">展示输出投影、输入最小范数选择、奇异值滤波与秩变化边界。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker><style>.T{font:700 22px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.P{font:700 17px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.B{font:14px -apple-system,"PingFang SC",sans-serif;fill:#334155}.S{font:12px -apple-system,"PingFang SC",sans-serif;fill:#475569}.M{font:italic 15px Georgia,serif;fill:#0f172a}</style></defs><rect width="1200" height="430" rx="18" fill="#f8fafc"/><text x="42" y="38" class="T">Moore–Penrose 伪逆：先修正输出，再选择最小范数输入</text>
<g transform="translate(30 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">A  两个空间中的正交投影</text><rect x="24" y="67" width="112" height="58" rx="10" fill="#fee2e2"/><text x="42" y="91" class="M">b ∈ Fᵐ</text><text x="42" y="112" class="S">可能不可达</text><path d="M137 96H178" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="182" y="67" width="154" height="58" rx="10" fill="#dcfce7"/><text x="195" y="91" class="M">AA†b=P_R(A)b</text><text x="195" y="112" class="S">唯一最优预测</text><rect x="182" y="193" width="154" height="58" rx="10" fill="#dbeafe"/><text x="203" y="217" class="M">x†=A†b</text><text x="195" y="238" class="S">位于 R(A*)，范数最小</text><path d="M258 126V189" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="268" y="160" class="S">反缩放</text><text x="24" y="290" class="M">AA† = P_R(A)</text><text x="24" y="318" class="M">A†A = P_R(A*)</text></g>
<g transform="translate(420 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">B  三种奇异方向滤波</text><line x1="55" y1="272" x2="320" y2="272" stroke="#94a3b8"/><line x1="55" y1="296" x2="55" y2="65" stroke="#94a3b8"/><path d="M69 78C100 110 145 164 306 245" fill="none" stroke="#ef4444" stroke-width="3"/><path d="M69 245C100 175 135 130 170 125C220 128 265 170 306 210" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M69 272H145V145C195 185 250 220 306 245" fill="none" stroke="#22c55e" stroke-width="3"/><text x="230" y="232" class="S">精确 1/σ</text><text x="151" y="111" class="S">Ridge 平滑</text><text x="79" y="294" class="S">截断阈值</text><text x="20" y="322" class="S">小 σ：精确反演放大噪声；截断不连续；Ridge 有偏</text></g>
<g transform="translate(810 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">C  秩改变是连续性的边界</text><text x="20" y="74" class="M">Aε = diag(1, ε)</text><g transform="translate(30 98)"><line x1="0" y1="155" x2="290" y2="155" stroke="#94a3b8"/><line x1="25" y1="175" x2="25" y2="0" stroke="#94a3b8"/><path d="M45 145C95 135 140 110 185 70C225 38 255 22 285 12" fill="none" stroke="#ef4444" stroke-width="4"/><text x="195" y="57" class="M">‖Aε†‖₂ = 1/|ε|</text><circle cx="45" cy="145" r="5" fill="#2563eb"/><text x="34" y="175" class="S">大 ε</text><text x="244" y="175" class="S">ε→0</text></g><rect x="20" y="286" width="318" height="38" rx="9" fill="#fff7ed"/><text x="31" y="310" class="S">固定秩层内平滑；跨秩时伪逆范数可爆炸</text></g></svg>
