<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Cholesky 分解的平方能量、递推消元与正定系统求解</title>
  <desc id="desc">左侧展示正定矩阵等于下三角因子乘共轭转置并把二次型变为平方范数，中间展示递推主元必须为正，右侧展示两次三角求解、log determinant 和白化采样接口。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .sans{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.math{font-family:"STIX Two Math","Times New Roman",serif}.ink{fill:#1f2937}.muted{fill:#64748b}.blue{fill:#2563eb}.green{fill:#0f766e}.amber{fill:#b7791f}.h{font-size:19px;font-weight:600}.body{font-size:16px}.small{font-size:15px}.formula{font-size:20px}.result{font-size:19px;font-weight:600}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.cell{fill:#ffffff;stroke:#cbd5e1}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <rect x="42" y="43" width="360" height="411" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="68" y="81" class="sans h green">结构：A=LL* 把能量变成平方</text><text x="70" y="135" class="math formula ink">A =</text><g class="math body ink" text-anchor="middle"><rect x="126" y="102" width="50" height="48" class="cell"/><rect x="176" y="102" width="50" height="48" class="cell"/><rect x="126" y="150" width="50" height="48" class="cell"/><rect x="176" y="150" width="50" height="48" class="cell"/><text x="151" y="132">4</text><text x="201" y="132">2</text><text x="151" y="181">2</text><text x="201" y="181">3</text></g><text x="249" y="135" class="math formula ink">= L L*</text><g class="math body ink" text-anchor="middle"><rect x="278" y="102" width="50" height="48" class="cell"/><rect x="328" y="102" width="50" height="48" class="cell"/><rect x="278" y="150" width="50" height="48" class="cell"/><rect x="328" y="150" width="50" height="48" class="cell"/><text x="303" y="132" class="green">2</text><text x="353" y="132">0</text><text x="303" y="181">1</text><text x="353" y="181" class="green">√2</text></g>
  <text x="68" y="251" class="math formula green">x*Ax = ‖L*x‖₂²</text><text x="68" y="291" class="sans body ink">正定保证每个递推平方根为正；</text><text x="68" y="322" class="sans body ink">正对角约定保证因子唯一。</text><line x1="68" y1="352" x2="376" y2="352" stroke="#a7f3d0"/><text x="68" y="390" class="math body ink">log det A = 2Σᵢ log lᵢᵢ</text><text x="68" y="424" class="sans small muted">不先形成 det，避免上溢/下溢。</text>
  <rect x="440" y="43" width="330" height="411" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="466" y="81" class="sans h blue">递推：每一步检查剩余曲率</text><text x="466" y="132" class="math body ink">lⱼⱼ = sqrt(aⱼⱼ−Σₖ&lt;ⱼ|lⱼₖ|²)</text><text x="466" y="175" class="math body ink">lᵢⱼ = (aᵢⱼ−Σₖ&lt;ⱼlᵢₖconj(lⱼₖ))/lⱼⱼ</text><rect x="474" y="222" width="262" height="74" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="605" y="253" class="sans body green" text-anchor="middle">正主元：继续分解</text><text x="605" y="280" class="sans small muted" text-anchor="middle">对应 Schur 补仍正定</text><rect x="474" y="325" width="262" height="74" rx="10" fill="#fffbeb" stroke="#fcd34d"/><text x="605" y="356" class="sans body amber" text-anchor="middle">零/负主元：结构或数值警报</text><text x="605" y="383" class="sans small muted" text-anchor="middle">半正定、非正定或舍入接近边界</text><text x="605" y="430" class="sans small muted" text-anchor="middle">未主元 Cholesky 只承诺 Hermitian 正定输入。</text>
  <rect x="808" y="43" width="350" height="411" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="834" y="81" class="sans h blue">计算：一次分解，多种接口</text><rect x="842" y="113" width="282" height="58" rx="9" fill="#ffffff" stroke="#93c5fd"/><text x="983" y="149" class="math body blue" text-anchor="middle">Ly=b　前向代入</text><path d="M983 171V205" class="arrow"/><rect x="842" y="205" width="282" height="58" rx="9" fill="#ffffff" stroke="#6ee7b7"/><text x="983" y="241" class="math body green" text-anchor="middle">L*x=y　后向代入</text><text x="834" y="309" class="sans body ink">求解 SPD 系统：约为一般 LU 一半工作量</text><text x="834" y="345" class="sans body green">白化：</text><text x="902" y="345" class="math body ink">z=L⁻¹x</text><text x="834" y="381" class="sans body blue">采样：</text><text x="902" y="381" class="math body ink">x=Lz，z∼N(0,I)</text><text x="834" y="421" class="sans small muted">不要显式求 L⁻¹；使用三角 solve。</text>
  <rect x="92" y="493" width="1016" height="78" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="600" y="525" class="sans body amber" text-anchor="middle">接近正定边界时，小特征值、条件数增大和 Cholesky 小主元是同一退化的不同信号。</text><text x="600" y="555" class="sans small muted" text-anchor="middle">半正定矩阵可能需要带主元/秩揭示版本；任意对称不定矩阵应转向 LDL* 而非强行开方。</text>
  <text x="600" y="610" class="sans result ink" text-anchor="middle">Cholesky 同时是一条结构定理、消元算法和几何坐标变换；正定性把三者连接起来。</text>
</svg>
