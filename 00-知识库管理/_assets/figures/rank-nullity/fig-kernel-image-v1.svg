<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">核、商空间与像的映射示意图</title>
  <desc id="desc">左侧定义域包含平行于核的等价层，中间商空间把每一层压成一个点，右侧这些点一一映到像；陪域还包含像之外不可达的方向。</desc>
  <defs>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#2563eb"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#64748b; stroke-width:1.5; }
      .domain { fill:#eef2ff; stroke:#6366f1; stroke-width:2; }
      .image { fill:#dcfce7; stroke:#16a34a; stroke-width:2; }
      .layer { stroke:#7c3aed; stroke-width:3; }
      .ghost { stroke:#a78bfa; stroke-width:2; stroke-dasharray:7 5; }
      .arrow { stroke:#2563eb; stroke-width:3; fill:none; marker-end:url(#arr); }
      .title { font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a; }
      .label { font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#1e293b; }
      .small { font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; }
      .point { fill:#7c3aed; }
    </style>
  </defs>
  <rect width="1200" height="430" fill="#ffffff"/>

  <g transform="translate(20,20)">
    <rect class="box" x="0" y="0" width="360" height="380" rx="14"/>
    <text class="title" x="22" y="34">定义域 V：核方向形成等价层</text>
    <ellipse class="domain" cx="180" cy="214" rx="132" ry="112"/>
    <line class="layer" x1="94" y1="278" x2="218" y2="123"/>
    <line class="ghost" x1="124" y1="301" x2="248" y2="146"/>
    <line class="ghost" x1="62" y1="252" x2="186" y2="97"/>
    <line class="ghost" x1="159" y1="327" x2="283" y2="172"/>
    <text class="label" x="52" y="89">x + ker T</text>
    <text class="small" x="55" y="332">同一条紫线上的输入具有相同输出</text>
    <text class="small" x="66" y="359">nullity(T) = 被压掉的方向数</text>
  </g>

  <path class="arrow" d="M394,212 C425,212 438,212 470,212"/>
  <text class="small" x="398" y="194">取商</text>

  <g transform="translate(480,20)">
    <rect class="box" x="0" y="0" width="240" height="380" rx="14"/>
    <text class="title" x="22" y="34">V / ker T</text>
    <line x1="120" y1="82" x2="120" y2="318" stroke="#cbd5e1" stroke-width="5"/>
    <circle class="point" cx="120" cy="112" r="7"/>
    <circle class="point" cx="120" cy="168" r="7"/>
    <circle class="point" cx="120" cy="224" r="7"/>
    <circle class="point" cx="120" cy="280" r="7"/>
    <text class="small" x="29" y="344">每个点代表一个平行等价层</text>
    <text class="small" x="38" y="365">维数 = dim V − nullity</text>
  </g>

  <path class="arrow" d="M734,212 C767,212 782,212 814,212"/>
  <text class="small" x="749" y="194">一一对应</text>

  <g transform="translate(825,20)">
    <rect class="box" x="0" y="0" width="355" height="380" rx="14"/>
    <text class="title" x="22" y="34">陪域 W 与实际像 im T</text>
    <ellipse cx="179" cy="215" rx="137" ry="118" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <ellipse class="image" cx="143" cy="215" rx="55" ry="106"/>
    <circle cx="143" cy="141" r="6" fill="#16a34a"/>
    <circle cx="143" cy="190" r="6" fill="#16a34a"/>
    <circle cx="143" cy="239" r="6" fill="#16a34a"/>
    <circle cx="143" cy="288" r="6" fill="#16a34a"/>
    <text class="label" x="88" y="91">im T</text>
    <text class="label" x="254" y="128">W</text>
    <text class="small" x="216" y="219">像外方向</text>
    <text class="small" x="216" y="240">不可达</text>
    <text class="small" x="50" y="354">rank(T) = 像中独立方向数</text>
  </g>
</svg>
