<text x="555" y="225" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">h_kv=h</text>
<text x="455" y="300" font-size="15" font-weight="800" text-anchor="start" fill="#B7791F">GQA</text>
<text x="555" y="300" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">h_kv=g</text>
<text x="455" y="375" font-size="15" font-weight="800" text-anchor="start" fill="#0F766E">MQA</text>
