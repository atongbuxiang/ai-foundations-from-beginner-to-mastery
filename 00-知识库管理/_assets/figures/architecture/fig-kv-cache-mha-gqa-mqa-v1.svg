<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Cache 少不等于一定快</text>
<text x="845" y="110" font-size="15" font-weight="800" text-anchor="start" fill="#0F766E">memory bandwidth</text>
<text x="990" y="110" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">通常下降</text>
<text x="845" y="190" font-size="15" font-weight="800" text-anchor="start" fill="#2563EB">K/V projection params</text>
<text x="990" y="190" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">下降</text>
<text x="845" y="270" font-size="15" font-weight="800" text-anchor="start" fill="#C24135">quality / training</text>
<text x="990" y="270" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">需 uptraining/消融</text>
<text x="845" y="350" font-size="15" font-weight="800" text-anchor="start" fill="#B7791F">TP communication</text>
<text x="990" y="350" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">依 group mapping</text>
<text x="845" y="430" font-size="15" font-weight="800" text-anchor="start" fill="#C24135">latency/throughput</text>
<text x="990" y="430" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">依 batch、kernel、quant</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">MHA→GQA→MQA 是 KV-head 数的连续设计轴；缓存公式是恒等式，质量和速度是协议结论。</text>
