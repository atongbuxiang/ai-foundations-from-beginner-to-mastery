<text x="900" y="345" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">mechanistic interpretation</text>
<rect x="845" y="401" width="42" height="34" rx="5" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="866" y="425" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">O</text>
<text x="900" y="425" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">unmeasured generalization</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">表达上界、可构造反例和基准成绩是三种证据；任何一种都不能替代另外两种。</text>
