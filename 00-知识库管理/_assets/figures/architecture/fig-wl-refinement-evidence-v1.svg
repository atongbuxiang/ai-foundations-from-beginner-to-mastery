<text x="280" y="361" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">c0</text>
<text x="195" y="420" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">c_i&#x27; = HASH(c_i, multiset{c_j})</text>
<text x="45" y="468" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">injective hash 才保留可区分信息。</text>
