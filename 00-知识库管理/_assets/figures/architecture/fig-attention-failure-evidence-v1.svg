<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Attention 失效模式：从症状到干预，再到证据等级</title>
<desc id="desc">熵低、头可剪、长度外推失败或热力图漂亮都只是观测；机制结论需要对应反例与干预。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">五类常见症状</text>
<rect x="55" y="72" width="86" height="38" rx="6" fill="#FEE2E2" stroke="#C24135" stroke-width="2"/>
<text x="98" y="98" font-size="15" font-weight="800" text-anchor="middle" fill="#C24135">scale</text>
<text x="155" y="98" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">logits saturate / vanish</text>
<rect x="55" y="152" width="86" height="38" rx="6" fill="#FEE2E2" stroke="#C24135" stroke-width="2"/>
<text x="98" y="178" font-size="15" font-weight="800" text-anchor="middle" fill="#C24135">mask</text>
<text x="155" y="178" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">leakage / all-masked NaN</text>
<rect x="55" y="232" width="86" height="38" rx="6" fill="#FEE2E2" stroke="#C24135" stroke-width="2"/>
<text x="98" y="258" font-size="15" font-weight="800" text-anchor="middle" fill="#C24135">rank</text>
<text x="155" y="258" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">token uniformity / bottleneck</text>
<rect x="55" y="312" width="86" height="38" rx="6" fill="#FEE2E2" stroke="#C24135" stroke-width="2"/>
<text x="98" y="338" font-size="15" font-weight="800" text-anchor="middle" fill="#C24135">length</text>
<text x="155" y="338" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">entropy &amp; norm drift</text>
<rect x="55" y="392" width="86" height="38" rx="6" fill="#FEE2E2" stroke="#C24135" stroke-width="2"/>
<text x="98" y="418" font-size="15" font-weight="800" text-anchor="middle" fill="#C24135">explain</text>
<text x="155" y="418" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">weights ≠ faithful attribution</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">诊断—干预成对</text>
<text x="445" y="110" font-size="15" font-weight="750" text-anchor="start" fill="#2563EB">logit std / row entropy</text>
<line x1="610" y1="105" x2="642" y2="105" stroke="#B7791F" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="655" y="110" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">temp / norm ablation</text>
<text x="445" y="210" font-size="15" font-weight="750" text-anchor="start" fill="#2563EB">head pruning curve</text>
<line x1="610" y1="205" x2="642" y2="205" stroke="#B7791F" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="655" y="210" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">single + joint pruning</text>
<text x="445" y="310" font-size="15" font-weight="750" text-anchor="start" fill="#2563EB">singular spectrum by layer</text>
<line x1="610" y1="305" x2="642" y2="305" stroke="#B7791F" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="655" y="310" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">residual / MLP ablation</text>
<text x="445" y="410" font-size="15" font-weight="750" text-anchor="start" fill="#2563EB">counterfactual output</text>
<line x1="610" y1="405" x2="642" y2="405" stroke="#B7791F" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="655" y="410" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">replace / permute weights</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">I / T / E / H / O 证据阶梯</text>
<rect x="845" y="92" width="46" height="40" rx="5" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="868" y="118" font-size="15" font-weight="850" text-anchor="middle" fill="#0F766E">I</text>
<text x="910" y="118" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">shape / mask / determinant</text>
<rect x="845" y="172" width="46" height="40" rx="5" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="868" y="198" font-size="15" font-weight="850" text-anchor="middle" fill="#0F766E">T</text>
<text x="910" y="198" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">model + stated assumptions</text>
<rect x="845" y="252" width="46" height="40" rx="5" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="868" y="278" font-size="15" font-weight="850" text-anchor="middle" fill="#B7791F">E</text>
<text x="910" y="278" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">versioned experiment</text>
<rect x="845" y="332" width="46" height="40" rx="5" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="868" y="358" font-size="15" font-weight="850" text-anchor="middle" fill="#C24135">H</text>
<text x="910" y="358" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">mechanism explanation</text>
<rect x="845" y="412" width="46" height="40" rx="5" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="868" y="438" font-size="15" font-weight="850" text-anchor="middle" fill="#C24135">O</text>
<text x="910" y="438" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">scale / OOD extrapolation</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先把症状转成测量，再用最小干预检验机制；不能让实验、猜想或开放外推冒充定理。</text>
</svg>