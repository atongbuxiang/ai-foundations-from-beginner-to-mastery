<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">MPNN：message、aggregate、update 与 readout</title>
<desc id="desc">边上生成消息，节点处对多重集聚合，再更新状态；K 层只能使用 K 跳计算图。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">一条边怎样产生消息</text>
<circle cx="95" cy="190" r="28" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<text x="95" y="196" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">h_j</text>
<circle cx="300" cy="190" r="28" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5"/>
<text x="300" y="196" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">h_i</text>
<line x1="126" y1="190" x2="267" y2="190" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<text x="198" y="170" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">e_ji</text>
<rect x="70" y="280" width="255" height="70" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="197.5" y="321.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">m_ji = M(h_i, h_j, e_ji)</text>
<text x="45" y="425" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">有向图需区分 j-&gt;i 与 i-&gt;j；</text>
<text x="45" y="458" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">同步层先用旧状态生成全部消息。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">邻居处必须做多重集聚合</text>
<rect x="460" y="115" width="76" height="46" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="498.0" y="144.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">m_1i</text>
<line x1="498" y1="164" x2="602" y2="235" stroke="#2563EB" stroke-width="2" marker-end="url(#a0)"/>
<rect x="565" y="115" width="76" height="46" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="603.0" y="144.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">m_2i</text>
<line x1="603" y1="164" x2="602" y2="235" stroke="#2563EB" stroke-width="2" marker-end="url(#a0)"/>
<rect x="670" y="115" width="76" height="46" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="708.0" y="144.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">m_3i</text>
<line x1="708" y1="164" x2="602" y2="235" stroke="#2563EB" stroke-width="2" marker-end="url(#a0)"/>
<rect x="505" y="245" width="195" height="62" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="602.5" y="282.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">AGG{m_ji}</text>
<line x1="602" y1="310" x2="602" y2="350" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<rect x="505" y="365" width="195" height="62" rx="8" fill="#FFF7ED" stroke="#C24135" stroke-width="2"/>
<text x="602.5" y="402.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">U(h_i, m_i)</text>
<text x="440" y="475" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">sum / mean / max 的信息损失不同。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">深度、采样与成本账</text>
<text x="845" y="105" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">1 layer</text>
<text x="955" y="105" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">1-hop</text>
<text x="845" y="195" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">K layers</text>
<text x="955" y="195" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">at most K-hop</text>
<text x="845" y="285" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">fan-out s</text>
<text x="955" y="285" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">about s^K tree</text>
<text x="845" y="375" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">sparse full</text>
<text x="955" y="375" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">O(|E|d) / layer</text>
<text x="845" y="455" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">G□：h¹=(3,7,6)</text>
<text x="845" y="485" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">h²=(10,16,13)</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">MPNN 的最小合同是局部消息、无序聚合、同步更新与任务读出。</text>
</svg>