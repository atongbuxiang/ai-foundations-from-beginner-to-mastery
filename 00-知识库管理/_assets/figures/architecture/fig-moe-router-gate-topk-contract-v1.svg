<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Router、Gate 与 Top-k：四个接口必须分开写</title>
<desc id="desc">logit 产生、score activation、离散选择、选中权重归一化与反向估计不是同一个操作。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Forward Routing Contract</text>
<rect x="55" y="102" width="76" height="50" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="93.0" y="133.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x</text>
<rect x="155" y="102" width="100" height="50" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="205.0" y="133.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">z=xWᵣ</text>
<line x1="134" y1="127" x2="150" y2="127" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="278" y="102" width="82" height="50" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="319.0" y="133.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">a=g(z)</text>
<line x1="258" y1="127" x2="273" y2="127" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="80" y="220" width="120" height="52" rx="8" fill="#FEF2F2" stroke="#C24135" stroke-width="2"/>
<text x="140.0" y="252.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">I=TopK(a)</text>
<rect x="230" y="220" width="130" height="52" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="295.0" y="252.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">w=Norm(a_I)</text>
<line x1="320" y1="155" x2="140" y2="212" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="200" y1="246" x2="225" y2="246" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="55" y="330" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937">y = Σ_{i∈I} w_i f_i(x)</text>
<text x="55" y="386" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">ranking 可相同，mixing weights 可不同。</text>
<text x="55" y="440" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">必须声明 tie-break 与 backward。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">同一 Logit 的三种 Score</text>
<text x="455" y="105" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937">z = [2, 1, −1]</text>
<rect x="455" y="155" width="105" height="42" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="507.5" y="182.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">softmax</text>
<text x="580" y="182" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">[.71, .26, .04]</text>
<rect x="455" y="235" width="105" height="42" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="507.5" y="262.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">sigmoid</text>
<text x="580" y="262" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">[.88, .73, .27]</text>
<rect x="455" y="315" width="105" height="42" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="507.5" y="342.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">ReLU</text>
<text x="580" y="342" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">[2, 1, 0]</text>
<text x="455" y="402" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">Top-2 index 都是 {1,2}，</text>
<text x="455" y="438" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">重归一后的组合系数仍不同。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">梯度流向审计</text>
<rect x="845" y="102" width="275" height="48" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="982.5" y="132.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">expert loss L_task</text>
<line x1="982" y1="153" x2="982" y2="207" stroke="#0F766E" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a3)"/>
<rect x="845" y="215" width="275" height="46" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="982.5" y="244.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">selected weights</text>
<line x1="982" y1="153" x2="982" y2="297" stroke="#C24135" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a3)"/>
<rect x="845" y="305" width="275" height="46" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="982.5" y="334.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">Top-k boundary</text>
<line x1="982" y1="153" x2="982" y2="387" stroke="#B7791F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a3)"/>
<rect x="845" y="395" width="275" height="46" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="982.5" y="424.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">balance signal</text>
<text x="845" y="472" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">hard selection 几乎处处不传普通导数。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">路由公式完整的最低要求：logits、score、selection、mixing、capacity、tie-break 与 backward estimator 全部显式。</text>
</svg>