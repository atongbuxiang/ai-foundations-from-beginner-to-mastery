<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">多通道卷积：张量形状、超参数与资源总账</title>
<desc id="desc">二维卷积把 Cin 个输入通道的局部窗口与 Cout 组核缩并；stride、padding 与 dilation 决定输出空间尺寸，group 决定通道连接。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">四维输入与四维权重</text>
<rect x="55" y="125" width="115" height="230" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<rect x="78" y="105" width="115" height="230" rx="5" fill="none" stroke="#2563EB" stroke-width="1.5"/>
<text x="125" y="385" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">X [N,Cin,H,W]</text>
<text x="208" y="240" font-size="25" font-weight="700" text-anchor="middle" fill="#1F2937">×</text>
<rect x="240" y="155" width="115" height="160" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5"/>
<rect x="258" y="138" width="115" height="160" rx="5" fill="none" stroke="#0F766E" stroke-width="1.5"/>
<text x="305" y="345" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">K [Cout,Cin/G,Kh,Kw]</text>
<text x="45" y="438" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">每个 output channel 对输入组内通道求和。</text>
<text x="45" y="478" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">bias [Cout] 广播到 N,Hout,Wout。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">空间输出尺寸逐轴计算</text>
<text x="438" y="120" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">effective kernel</text>
<text x="620" y="120" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937" class="math">Ke = D(K−1)+1</text>
<text x="438" y="190" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">output height</text>
<text x="555" y="190" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937" class="math">Hout = floor((H+2P−Ke)/S)+1</text>
<text x="438" y="260" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">output width</text>
<text x="555" y="260" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937" class="math">Wout = floor((W+2P−Ke)/S)+1</text>
<rect x="438" y="315" width="310" height="120" rx="6" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="593" y="347" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">Example</text>
<text x="593" y="382" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937" class="math">H=7,K=3,P=1,S=2,D=1</text>
<text x="593" y="416" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135" class="math">Hout=floor(6/2)+1=4</text>
<text x="438" y="488" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">‘same’ 的具体左右补法仍需查框架约定。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">参数与 MACs 分账</text>
<text x="842" y="112" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">parameters</text>
<text x="842" y="145" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937" class="math">Cout(Cin/G · KhKw + 1)</text>
<text x="842" y="205" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">forward MACs</text>
<text x="842" y="238" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937" class="math">N Hout Wout Cout Cin/G KhKw</text>
<line x1="842" y1="270" x2="1140" y2="270" stroke="#D7DEE8" stroke-width="2"/>
<text x="845" y="310" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">standard</text>
<text x="990" y="310" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">G=1</text>
<text x="845" y="365" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">grouped</text>
<text x="990" y="365" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">1&lt;G&lt;Cin</text>
<text x="845" y="420" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">depthwise</text>
<text x="990" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">G=Cin</text>
<text x="845" y="475" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">pointwise</text>
<text x="990" y="475" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">Kh=Kw=1</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">任何卷积层先写 X、K、Y 的完整形状，再计算空间尺寸、参数和动态工作量。</text>
</svg>