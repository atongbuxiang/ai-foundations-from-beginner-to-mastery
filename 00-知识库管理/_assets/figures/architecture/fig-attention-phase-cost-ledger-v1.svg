<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Attention 成本不是一个 O(n²)：阶段、张量与瓶颈总账</title>
<desc id="desc">Projection、pairwise arithmetic、score storage、HBM traffic 与 decode cache 分属不同账本。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Prefill：一次处理 n 个 Token</text>
<text x="55" y="110" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">QKV/O projections</text>
<text x="250" y="110" font-size="15" font-weight="800" text-anchor="start" fill="#1F2937">≈ 4 n d²</text>
<rect x="55" y="128" width="72" height="11" rx="4" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="55" y="205" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">QKᵀ + AV</text>
<text x="250" y="205" font-size="15" font-weight="800" text-anchor="start" fill="#1F2937">≈ 2 n² d</text>
<rect x="55" y="223" width="120" height="11" rx="4" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<text x="55" y="300" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">naive scores</text>
<text x="250" y="300" font-size="15" font-weight="800" text-anchor="start" fill="#1F2937">≈ h n² elements</text>
<rect x="55" y="318" width="167" height="11" rx="4" fill="#B7791F" stroke="#B7791F" stroke-width="1"/>
<text x="55" y="395" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">FFN</text>
<text x="250" y="395" font-size="15" font-weight="800" text-anchor="start" fill="#1F2937">≈ 2 n d d_ff</text>
<rect x="55" y="413" width="215" height="11" rx="4" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<text x="55" y="468" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">crossover 取决于 n/d、kernel 与 hardware。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Decode：每步只有一个 Query</text>
<rect x="455" y="105" width="285" height="54" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="597.5" y="138.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">read historical K/V cache</text>
<line x1="598" y1="162" x2="598" y2="205" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="218" width="285" height="64" rx="8" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="597.5" y="256.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">per layer: O(t d_kv) bytes + MACs</text>
<line x1="598" y1="285" x2="598" y2="328" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="342" width="285" height="64" rx="8" fill="#FEF2F2" stroke="#C24135" stroke-width="2"/>
<text x="597.5" y="380.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">often bandwidth / latency bound</text>
<text x="455" y="454" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">batch 与 context 越大，cache bytes 越关键。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">四个不同优化靶点</text>
<rect x="845" y="110" width="125" height="42" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="907.5" y="137.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">Sparse / low-rank</text>
<text x="985" y="136" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">改变边或模型近似</text>
<rect x="845" y="200" width="125" height="42" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="907.5" y="227.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">Kernel feature</text>
<text x="985" y="226" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">改变相似度或作随机近似</text>
<rect x="845" y="290" width="125" height="42" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="907.5" y="317.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">FlashAttention</text>
<text x="985" y="316" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">不改模型，降低 HBM IO</text>
<rect x="845" y="380" width="125" height="42" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="907.5" y="407.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">MQA / GQA / MLA</text>
<text x="985" y="406" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">压缩 decode cache</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先写阶段与张量，再谈复杂度；同为‘高效’的方法可能根本不在优化同一瓶颈。</text>
</svg>