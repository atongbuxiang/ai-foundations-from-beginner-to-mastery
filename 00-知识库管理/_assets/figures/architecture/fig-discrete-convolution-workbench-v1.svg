<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">离散卷积工作台：翻转、滑动与边界</title>
<desc id="desc">一维离散互相关直接滑动核，数学卷积先翻转核；valid、same 与 circular 边界给出不同的输出对象。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">一个可完整手算的窗口</text>
<rect x="55" y="130" width="48" height="48" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="79" y="161" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">2</text>
<rect x="115" y="130" width="48" height="48" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="139" y="161" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">-1</text>
<rect x="175" y="130" width="48" height="48" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="199" y="161" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">3</text>
<rect x="235" y="130" width="48" height="48" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="259" y="161" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">0</text>
<rect x="295" y="130" width="48" height="48" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="319" y="161" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">1</text>
<text x="45" y="110" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">input x</text>
<rect x="115" y="235" width="48" height="48" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="139" y="266" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">1</text>
<rect x="175" y="235" width="48" height="48" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="199" y="266" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">0</text>
<rect x="235" y="235" width="48" height="48" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="259" y="266" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">-1</text>
<text x="45" y="215" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">kernel w</text>
<line x1="139" y1="290" x2="139" y2="332" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="45" y="365" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">cross-correlation: 2·1 + (−1)·0 + 3·(−1) = −1</text>
<text x="45" y="410" font-size="16" font-weight="650" text-anchor="start" fill="#C24135">convolution uses reversed kernel: [−1,0,1]</text>
<text x="45" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">深度学习 API 通常实现互相关，但把参数学习后仍称 conv。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三种边界不是同一问题</text>
<text x="440" y="120" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">valid</text>
<text x="535" y="120" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">只保留完整窗口</text>
<rect x="438" y="138" width="300" height="42" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.8"/>
<text x="588" y="166" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">L−K+1</text>
<text x="440" y="260" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">same</text>
<text x="535" y="260" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">zero pad 后近似同长</text>
<rect x="438" y="278" width="300" height="42" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.8"/>
<text x="588" y="306" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">ceil(L/S)</text>
<text x="440" y="400" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">circular</text>
<text x="535" y="400" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">首尾相接</text>
<rect x="438" y="418" width="300" height="42" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.8"/>
<text x="588" y="446" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">周期信号</text>
<text x="438" y="495" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">边界会进入数值值域，也会影响严格等变性。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">线性算子与成本账</text>
<text x="845" y="112" font-size="18" font-weight="700" text-anchor="start" fill="#2563EB" class="math">y[i] = Σ_j w[j] x[i+j]</text>
<text x="845" y="160" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">固定 w 时：x ↦ y 是线性的</text>
<text x="845" y="205" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">固定 x 时：w ↦ y 也是线性的</text>
<rect x="842" y="250" width="300" height="115" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="992" y="282" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">direct 1D valid</text>
<text x="992" y="318" font-size="18" font-weight="700" text-anchor="middle" fill="#2563EB" class="math">(L−K+1)K MACs</text>
<text x="992" y="348" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">K parameters</text>
<text x="842" y="411" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">FFT 可降低长核渐近成本，</text>
<text x="842" y="443" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">但小核 CNN 常由 direct kernel 更合适。</text>
<text x="842" y="487" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">算法最优取决于 L、K、batch 与硬件。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先固定翻转、索引和边界约定，才存在唯一可复算的“卷积输出”。</text>
</svg>