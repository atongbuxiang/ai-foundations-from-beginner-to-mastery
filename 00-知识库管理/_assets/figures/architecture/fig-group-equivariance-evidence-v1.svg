<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">群卷积：轨道共享、feature action 与证据边界</title>
<desc id="desc">群作用把输入变换组织成轨道；G-convolution 在群元素上共享滤波器并保持可预测变换；结构等变不自动等于任务不变或经验最优。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">从一个 pattern 到群轨道</text>
<rect x="297.0" y="227.0" width="56" height="56" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<line x1="325.0" y1="255.0" x2="343.0" y2="255.0" stroke="#C24135" stroke-width="4"/>
<text x="325.0" y="305.0" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">0°</text>
<rect x="177.0" y="347.0" width="56" height="56" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<line x1="205.0" y1="375.0" x2="205.0" y2="393.0" stroke="#C24135" stroke-width="4"/>
<text x="205.0" y="425.0" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">90°</text>
<rect x="57.0" y="227.00000000000003" width="56" height="56" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<line x1="85.0" y1="255.00000000000003" x2="67.0" y2="255.00000000000003" stroke="#C24135" stroke-width="4"/>
<text x="85.0" y="305.0" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">180°</text>
<rect x="176.99999999999997" y="107.0" width="56" height="56" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<line x1="204.99999999999997" y1="135.0" x2="204.99999999999997" y2="117.0" stroke="#C24135" stroke-width="4"/>
<text x="204.99999999999997" y="185.0" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">270°</text>
<circle cx="205" cy="255" r="25" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5"/>
<text x="205" y="261" font-size="18" font-weight="700" text-anchor="middle" fill="#0F766E">G</text>
<text x="45" y="455" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937" class="math">orbit(x) = {T_g x : g∈G}</text>
<text x="45" y="492" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">需要先说明任务真正拥有哪个 symmetry。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">feature map 也随群变换</text>
<rect x="445" y="120" width="115" height="55" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="502.5" y="153.5" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">x</text>
<rect x="645" y="120" width="115" height="55" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="702.5" y="153.5" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">Tg x</text>
<rect x="445" y="350" width="115" height="55" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="502.5" y="383.5" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">f(x)</text>
<rect x="645" y="350" width="115" height="55" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="702.5" y="383.5" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">Sg f(x)</text>
<line x1="561" y1="148" x2="638" y2="148" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<line x1="502" y1="178" x2="502" y2="342" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<line x1="702" y1="178" x2="702" y2="342" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<line x1="561" y1="378" x2="638" y2="378" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<text x="438" y="455" font-size="19" font-weight="700" text-anchor="start" fill="#C24135" class="math">f(Tg x)=Sg f(x)</text>
<text x="438" y="493" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">output action Sg is part of the definition</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">四层证据不要越级</text>
<circle cx="860" cy="100" r="18" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="860" y="106" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">I</text>
<text x="895" y="105" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">equivariance identity</text>
<line x1="842" y1="135" x2="1138" y2="135" stroke="#D7DEE8" stroke-width="1"/>
<circle cx="860" cy="190" r="18" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="860" y="196" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">T</text>
<text x="895" y="195" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">function / sample bounds</text>
<line x1="842" y1="225" x2="1138" y2="225" stroke="#D7DEE8" stroke-width="1"/>
<circle cx="860" cy="280" r="18" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="860" y="286" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">E</text>
<text x="895" y="285" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">dataset &amp; scale experiments</text>
<line x1="842" y1="315" x2="1138" y2="315" stroke="#D7DEE8" stroke-width="1"/>
<circle cx="860" cy="370" r="18" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="860" y="376" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">H/O</text>
<text x="895" y="375" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">why it helps / when it fails</text>
<line x1="842" y1="405" x2="1138" y2="405" stroke="#D7DEE8" stroke-width="1"/>
<text x="842" y="455" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">wrong symmetry can increase bias</text>
<text x="842" y="492" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">augmentation and equivariance are complementary</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">群等变网络把正确对称性写入参数共享；保证的强弱取决于群、边界、读出和证据层级。</text>
</svg>