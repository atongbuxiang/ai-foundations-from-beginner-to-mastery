<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Encoder–Decoder：Source memory 与 Target queries 的三子层接口</title>
<desc id="desc">Encoder 只处理 source；decoder 每层先做 target causal mixing，再用 cross-attention 读取固定 source memory。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Source encoder</text>
<rect x="55" y="105" width="280" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="195.0" y="141.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">source tokens + positions</text>
<line x1="195" y1="168" x2="195" y2="220" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="235" width="280" height="70" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="195.0" y="276.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">bidirectional encoder × L_e</text>
<line x1="195" y1="308" x2="195" y2="360" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="375" width="280" height="60" rx="8" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="195.0" y="411.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">memory H_e : T_s × d</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Target decoder layer</text>
<rect x="455" y="90" width="300" height="56" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="605.0" y="124.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">target causal self-attn</text>
<line x1="605" y1="149" x2="605" y2="186" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="190" width="300" height="56" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="605.0" y="224.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">cross-attn: Q from target</text>
<line x1="605" y1="249" x2="605" y2="286" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="290" width="300" height="56" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="605.0" y="324.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">K,V from encoder memory</text>
<line x1="605" y1="349" x2="605" y2="386" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="390" width="300" height="56" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="605.0" y="424.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">FFN + output states</text>
<line x1="338" y1="405" x2="452" y2="318" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">两条长度轴</text>
<text x="845" y="110" font-size="15" font-weight="800" text-anchor="start" fill="#C24135">source</text>
<text x="930" y="110" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">T_s</text>
<text x="930" y="137" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">encoder + K/V</text>
<text x="845" y="210" font-size="15" font-weight="800" text-anchor="start" fill="#C24135">target</text>
<text x="930" y="210" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">T_t</text>
<text x="930" y="237" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">decoder Q + outputs</text>
<text x="845" y="310" font-size="15" font-weight="800" text-anchor="start" fill="#C24135">cross score</text>
<text x="930" y="310" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">T_t × T_s</text>
<text x="930" y="337" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">每层每头</text>
<text x="845" y="410" font-size="15" font-weight="800" text-anchor="start" fill="#C24135">generation</text>
<text x="930" y="410" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">one row / step</text>
<text x="930" y="437" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">cache source once</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Source 与 target 不是一条拼接序列的别名；它们有不同可见性、长度和缓存生命周期。</text>
</svg>