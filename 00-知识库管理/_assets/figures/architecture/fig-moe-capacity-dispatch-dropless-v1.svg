<text x="845" y="425" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">每个 expert 选固定 bucket；</text>
<text x="845" y="459" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">每 token 的专家数可为 0、1 或多。</text>
