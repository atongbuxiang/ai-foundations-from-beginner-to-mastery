<text x="565" y="350" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">变长块全部执行</text>
<text x="565" y="376" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">layout/cost 改变</text>
<text x="455" y="450" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">capacity factor α 常令 C=ceil(αTk/E)。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Expert-choice 是另一合同</text>
