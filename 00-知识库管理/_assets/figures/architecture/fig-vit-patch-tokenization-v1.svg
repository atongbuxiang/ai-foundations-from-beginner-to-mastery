<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Vision Transformer：从像素网格到 Patch Tokens</title>
<desc id="desc">Patchification 把二维局部块展平/投影成序列；patch size 同时控制信息粒度、token 数和二次成本。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">H×W 图像切 P×P patches</text>
<rect x="75" y="115" width="55" height="55" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="137" y="115" width="55" height="55" rx="3" fill="#FFF7ED" stroke="#B7791F" stroke-width="1.5"/>
<rect x="199" y="115" width="55" height="55" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="261" y="115" width="55" height="55" rx="3" fill="#FFF7ED" stroke="#B7791F" stroke-width="1.5"/>
<rect x="75" y="177" width="55" height="55" rx="3" fill="#FFF7ED" stroke="#B7791F" stroke-width="1.5"/>
<rect x="137" y="177" width="55" height="55" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="199" y="177" width="55" height="55" rx="3" fill="#FFF7ED" stroke="#B7791F" stroke-width="1.5"/>
<rect x="261" y="177" width="55" height="55" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="75" y="239" width="55" height="55" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="137" y="239" width="55" height="55" rx="3" fill="#FFF7ED" stroke="#B7791F" stroke-width="1.5"/>
<rect x="199" y="239" width="55" height="55" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="261" y="239" width="55" height="55" rx="3" fill="#FFF7ED" stroke="#B7791F" stroke-width="1.5"/>
<rect x="75" y="301" width="55" height="55" rx="3" fill="#FFF7ED" stroke="#B7791F" stroke-width="1.5"/>
<rect x="137" y="301" width="55" height="55" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="199" y="301" width="55" height="55" rx="3" fill="#FFF7ED" stroke="#B7791F" stroke-width="1.5"/>
<rect x="261" y="301" width="55" height="55" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="55" y="405" font-size="18" font-weight="800" text-anchor="start" fill="#B7791F">N=(H/P)(W/P)</text>
<text x="55" y="445" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">每块维度 P²C</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">线性 patch embedding + position</text>
<rect x="455" y="105" width="300" height="55" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="605.0" y="138.5" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">patch matrix: N × P²C</text>
<line x1="605" y1="163" x2="605" y2="201" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="205" width="300" height="55" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="605.0" y="238.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">projection E: P²C × d</text>
<line x1="605" y1="263" x2="605" y2="301" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="305" width="300" height="55" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="605.0" y="338.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">tokens: N × d</text>
<line x1="605" y1="363" x2="605" y2="401" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="405" width="300" height="55" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="605.0" y="438.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">prepend [CLS] + position</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">分辨率与成本联动</text>
<text x="845" y="115" font-size="15" font-weight="750" text-anchor="start" fill="#C24135">H,W ×2; P fixed</text>
<text x="845" y="155" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">N ×4, attention pairs ×16</text>
<text x="845" y="235" font-size="15" font-weight="750" text-anchor="start" fill="#2563EB">P ×2; H,W fixed</text>
<text x="845" y="275" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">N ÷4, finer detail lost</text>
<text x="845" y="355" font-size="15" font-weight="750" text-anchor="start" fill="#0F766E">position table</text>
<text x="845" y="395" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">resize/interpolate is a new contract</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">ViT 的关键不是把图像叫作句子，而是明确二维切块、位置、读出与分辨率变化。</text>
</svg>