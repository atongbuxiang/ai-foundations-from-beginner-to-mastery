<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">BPTT：时间 Jacobian 乘积与方向性梯度</title>
<desc id="desc">长程梯度由一串随状态变化的 Jacobian 有序相乘；奇异方向可能衰减、放大或旋转。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">反向链条</text>
<rect x="60" y="180" width="64" height="48" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="92" y="210" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">h₀=0</text>
<line x1="126" y1="204" x2="141" y2="204" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<rect x="145" y="180" width="64" height="48" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="177" y="210" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">h₁=1</text>
<line x1="211" y1="204" x2="226" y2="204" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<rect x="230" y="180" width="64" height="48" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="262" y="210" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">h₂=5/2</text>
<line x1="296" y1="204" x2="311" y2="204" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<rect x="315" y="180" width="64" height="48" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="347" y="210" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">h₃=1/4</text>
<path d="M320 260 C250 330 135 330 65 260" fill="none" stroke="#C24135" stroke-width="3" marker-end="url(#a3)"/>
<text x="192" y="352" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135" class="math">g: 1/4 → 1/8 → 1/16 → 1/32</text>
<text x="45" y="420" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937" class="math">J_t = d h_t / d h_(t-1)</text>
<text x="45" y="474" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">共享 w 梯度：1/8 + 5/8 = 3/4。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">同一乘积的三种方向</text>
<line x1="455" y1="160" x2="745" y2="160" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="445" y="165" font-size="15" font-weight="700" text-anchor="end" fill="#2563EB">vanish</text>
<circle cx="475" cy="149.0" r="3.5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="517" cy="153.95" r="3.5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="559" cy="156" r="3.5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="601" cy="156" r="3.5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="643" cy="156" r="3.5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="685" cy="156" r="3.5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="727" cy="156" r="3.5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<path d="M475 149.0 L517 153.95 L559 156 L601 156 L643 156 L685 156 L727 156" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<line x1="455" y1="285" x2="745" y2="285" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="445" y="290" font-size="15" font-weight="700" text-anchor="end" fill="#0F766E">preserve</text>
<circle cx="475" cy="274.0" r="3.5" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<circle cx="517" cy="274.0" r="3.5" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<circle cx="559" cy="274.0" r="3.5" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<circle cx="601" cy="274.0" r="3.5" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<circle cx="643" cy="274.0" r="3.5" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<circle cx="685" cy="274.0" r="3.5" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<circle cx="727" cy="274.0" r="3.5" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<path d="M475 274.0 L517 274.0 L559 274.0 L601 274.0 L643 274.0 L685 274.0 L727 274.0" fill="none" stroke="#0F766E" stroke-width="2.5"/>
<line x1="455" y1="410" x2="745" y2="410" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="445" y="415" font-size="15" font-weight="700" text-anchor="end" fill="#C24135">explode</text>
<circle cx="475" cy="399.0" r="3.5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="517" cy="392.95" r="3.5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="559" cy="383.5725" r="3.5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="601" cy="369.037375" r="3.5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="643" cy="368" r="3.5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="685" cy="368" r="3.5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="727" cy="368" r="3.5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<path d="M475 399.0 L517 392.95 L559 383.5725 L601 369.037375 L643 368 L685 368 L727 368" fill="none" stroke="#C24135" stroke-width="2.5"/>
<text x="445" y="485" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">spectral radius 单独不足以描述非正规、时变乘积。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">诊断与缓解不能混写</text>
<text x="845" y="108" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">clip</text>
<text x="930" y="108" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">限制爆炸更新</text>
<text x="930" y="133" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">不恢复已消失信号</text>
<text x="845" y="225" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">gating</text>
<text x="930" y="225" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">提供加法路径</text>
<text x="930" y="250" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">仍会饱和/遗忘</text>
<text x="845" y="342" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">orthogonal</text>
<text x="930" y="342" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">改善局部尺度</text>
<text x="930" y="367" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">非万能长期保证</text>
<text x="845" y="459" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">truncation</text>
<text x="930" y="459" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">省显存与计算</text>
<text x="930" y="484" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">截断信用路径</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">梯度问题是矩阵乘积的方向性问题；措施要注明它解决哪一段。</text>
</svg>