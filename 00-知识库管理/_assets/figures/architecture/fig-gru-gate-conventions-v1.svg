<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">GRU：更新约定、候选状态与实现差异</title>
<desc id="desc">GRU 用单一 hidden state 做门控插值；不同资料常把 z 的保留/写入语义写成互补形式。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">显式声明本课程约定</text>
<text x="45" y="125" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">r_t = sigmoid(Wr x_t + Ur h_(t-1) + br)</text>
<text x="45" y="185" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">z_t = sigmoid(Wz x_t + Uz h_(t-1) + bz)</text>
<text x="45" y="245" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">h_new = tanh(Wh x_t + Uh(r_t * h_(t-1)) + bh)</text>
<rect x="45" y="295" width="315" height="70" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5"/>
<text x="203" y="326" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">h_t=(1-z_t)h_(t-1)+z_t h_new</text>
<text x="45" y="412" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">本页 z=1 表示更偏向写入候选。</text>
<text x="45" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">有些资料交换 z 与 1−z；方程相容即可。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">逐维插值，不是二选一开关</text>
<rect x="455" y="142" width="105" height="52" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="508" y="174" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">old (1,−2)</text>
<rect x="630" y="142" width="105" height="52" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="683" y="174" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">new (−1,2)</text>
<line x1="560" y1="168" x2="592" y2="260" stroke="#2563EB" stroke-width="3" marker-end="url(#a1)"/>
<line x1="630" y1="168" x2="608" y2="260" stroke="#C24135" stroke-width="3" marker-end="url(#a1)"/>
<circle cx="600" cy="280" r="44" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5"/>
<text x="600" y="286" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">h=(1/2,1)</text>
<text x="445" y="370" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">z=(1/4,3/4)：两维更新速率不同。</text>
<text x="445" y="420" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">reset-before  → (1,0)</text>
<text x="445" y="455" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">reset-after    → (2,0)</text>
<text x="445" y="485" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">矩阵混合与逐元素 gate 通常不可交换。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">RNN / GRU / LSTM 合同比较</text>
<text x="940" y="82" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">RNN</text>
<text x="1020" y="82" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">GRU</text>
<text x="1100" y="82" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">LSTM</text>
<text x="842" y="115" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">state</text>
<text x="940" y="115" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">h</text>
<text x="1020" y="115" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">h</text>
<text x="1100" y="115" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">(h,c)</text>
<line x1="840" y1="133" x2="1140" y2="133" stroke="#D7DEE8" stroke-width="1"/>
<text x="842" y="205" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">params*</text>
<text x="940" y="205" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">32</text>
<text x="1020" y="205" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">96</text>
<text x="1100" y="205" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">128</text>
<line x1="840" y1="223" x2="1140" y2="223" stroke="#D7DEE8" stroke-width="1"/>
<text x="842" y="295" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">gates</text>
<text x="940" y="295" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">0</text>
<text x="1020" y="295" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">2</text>
<text x="1100" y="295" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">3</text>
<line x1="840" y1="313" x2="1140" y2="313" stroke="#D7DEE8" stroke-width="1"/>
<text x="842" y="385" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">direct path</text>
<text x="940" y="385" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">no</text>
<text x="1020" y="385" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">1−z</text>
<text x="1100" y="385" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">f</text>
<line x1="840" y1="403" x2="1140" y2="403" stroke="#D7DEE8" stroke-width="1"/>
<text x="842" y="465" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">stream*</text>
<text x="940" y="465" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">4</text>
<text x="1020" y="465" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">4</text>
<text x="1100" y="465" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">8</text>
<line x1="840" y1="483" x2="1140" y2="483" stroke="#D7DEE8" stroke-width="1"/>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">* d_x=3,d_h=4；比较门控 RNN 时先对齐方程和状态接口，再谈性能。</text>
</svg>