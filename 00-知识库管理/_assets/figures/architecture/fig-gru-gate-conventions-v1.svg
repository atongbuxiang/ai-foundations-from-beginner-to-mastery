<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">GRU：更新约定、候选状态与实现差异</title>
<desc id="desc">GRU 用单一 hidden state 做门控插值；不同资料常把 z 的保留/写入语义写成互补形式。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">显式声明本课程约定</text>
<text x="45" y="125" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">r_t = sigmoid(Wr x_t + Ur h_(t-1) + br)</text>
<text x="45" y="185" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">z_t = sigmoid(Wz x_t + Uz h_(t-1) + bz)</text>
<text x="45" y="245" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">h_new = tanh(Wh x_t + Uh(r_t * h_(t-1)) + bh)</text>
<rect x="45" y="295" width="315" height="70" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5"/>
<text x="203" y="326" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">h_t=(1-z_t)h_(t-1)+z_t h_new</text>
<text x="45" y="412" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">本页 z=1 表示更偏向写入候选。</text>
<text x="45" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">有些资料交换 z 与 1−z；方程相容即可。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">逐维插值，不是二选一开关</text>
<rect x="455" y="142" width="85" height="52" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="498" y="174" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">h old</text>
<rect x="650" y="142" width="85" height="52" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="693" y="174" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">h new</text>
<line x1="540" y1="168" x2="592" y2="260" stroke="#2563EB" stroke-width="3" marker-end="url(#a1)"/>
<line x1="650" y1="168" x2="608" y2="260" stroke="#C24135" stroke-width="3" marker-end="url(#a1)"/>
<circle cx="600" cy="280" r="42" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5"/>
<text x="600" y="286" font-size="18" font-weight="700" text-anchor="middle" fill="#0F766E">h_t</text>
<text x="445" y="370" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">z=[0.1,0.9,…] 可让不同维度</text>
<text x="445" y="405" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">拥有不同更新速率。</text>
<text x="445" y="475" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">reset-before / reset-after 会改变数值图。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">RNN / GRU / LSTM 合同比较</text>
<text x="940" y="82" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">RNN</text>
<text x="1020" y="82" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">GRU</text>
<text x="1100" y="82" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">LSTM</text>
<text x="842" y="125" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">state</text>
<text x="940" y="125" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">h</text>
<text x="1020" y="125" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">h</text>
<text x="1100" y="125" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">(h,c)</text>
<line x1="840" y1="143" x2="1140" y2="143" stroke="#D7DEE8" stroke-width="1"/>
<text x="842" y="225" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">add path</text>
<text x="940" y="225" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">no</text>
<text x="1020" y="225" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">yes</text>
<text x="1100" y="225" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">cell</text>
<line x1="840" y1="243" x2="1140" y2="243" stroke="#D7DEE8" stroke-width="1"/>
<text x="842" y="325" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">gates</text>
<text x="940" y="325" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">0</text>
<text x="1020" y="325" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">2</text>
<text x="1100" y="325" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">3</text>
<line x1="840" y1="343" x2="1140" y2="343" stroke="#D7DEE8" stroke-width="1"/>
<text x="842" y="425" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">stream</text>
<text x="940" y="425" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">d</text>
<text x="1020" y="425" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">d</text>
<text x="1100" y="425" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">2d</text>
<line x1="840" y1="443" x2="1140" y2="443" stroke="#D7DEE8" stroke-width="1"/>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">比较门控 RNN 时先对齐方程和状态接口，再比较参数、速度与任务证据。</text>
</svg>