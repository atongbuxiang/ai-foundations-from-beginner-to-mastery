<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Self-Attention 与 Cross-Attention：来源不同，矩阵合同相同</title>
<desc id="desc">score 的行数来自 query，列数来自 key/value；cross-attention 允许 T_q 与 T_k 不同。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Self：Q/K/V 来自同一序列</text>
<rect x="55" y="105" width="285" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="197.5" y="140.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">X : T × d_model</text>
<line x1="102" y1="166" x2="102" y2="220" stroke="#2563EB" stroke-width="2" marker-end="url(#a1)"/>
<rect x="55" y="230" width="86" height="48" rx="6" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="98" y="260" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">XW_Q</text>
<line x1="197" y1="166" x2="197" y2="220" stroke="#0F766E" stroke-width="2" marker-end="url(#a1)"/>
<rect x="150" y="230" width="86" height="48" rx="6" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="193" y="260" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">XW_K</text>
<line x1="292" y1="166" x2="292" y2="220" stroke="#B7791F" stroke-width="2" marker-end="url(#a1)"/>
<rect x="245" y="230" width="86" height="48" rx="6" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="288" y="260" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F">XW_V</text>
<text x="55" y="335" font-size="16" font-weight="750" text-anchor="start" fill="#C24135">共享来源 ≠ 共享投影</text>
<text x="55" y="390" font-size="18" font-weight="750" text-anchor="start" fill="#1F2937" class="math">score: T × T</text>
<text x="55" y="435" font-size="18" font-weight="750" text-anchor="start" fill="#1F2937" class="math">output: T × d_v</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Cross：query 与 memory 分源</text>
<rect x="450" y="90" width="300" height="55" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="123.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">X_q : T_q × d_model</text>
<rect x="450" y="190" width="300" height="55" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="223.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">X_m : T_k × d_model</text>
<line x1="525" y1="148" x2="525" y2="305" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<line x1="600" y1="248" x2="600" y2="305" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<line x1="675" y1="248" x2="675" y2="305" stroke="#B7791F" stroke-width="2.5" marker-end="url(#a2)"/>
<rect x="480" y="315" width="62" height="45" rx="5" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="511" y="343" font-size="15" font-weight="800" text-anchor="middle" fill="#2563EB">Q</text>
<rect x="555" y="315" width="62" height="45" rx="5" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="586" y="343" font-size="15" font-weight="800" text-anchor="middle" fill="#0F766E">K</text>
<rect x="630" y="315" width="62" height="45" rx="5" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="661" y="343" font-size="15" font-weight="800" text-anchor="middle" fill="#B7791F">V</text>
<text x="455" y="405" font-size="18" font-weight="750" text-anchor="start" fill="#1F2937" class="math">score: T_q × T_k</text>
<text x="455" y="450" font-size="18" font-weight="750" text-anchor="start" fill="#1F2937" class="math">output: T_q × d_v</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">shape ledger</text>
<text x="845" y="105" font-size="17" font-weight="800" text-anchor="start" fill="#0F766E">QKᵀ</text>
<text x="905" y="105" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">(T_q×d_k)(d_k×T_k)</text>
<text x="845" y="205" font-size="17" font-weight="800" text-anchor="start" fill="#0F766E">A</text>
<text x="905" y="205" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">T_q × T_k</text>
<text x="845" y="305" font-size="17" font-weight="800" text-anchor="start" fill="#0F766E">AV</text>
<text x="905" y="305" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">(T_q×T_k)(T_k×d_v)</text>
<text x="845" y="405" font-size="17" font-weight="800" text-anchor="start" fill="#2563EB">O</text>
<text x="905" y="405" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">T_q × d_v</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">只要守住 inner dimensions，self/cross 的统一公式自然成立；长度来源由任务接口决定。</text>
</svg>