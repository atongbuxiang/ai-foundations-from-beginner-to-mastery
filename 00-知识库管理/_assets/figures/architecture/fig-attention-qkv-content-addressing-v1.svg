<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Q/K/V 不是三份副本：它们承担三种角色</title>
<desc id="desc">query 提出检索需求，key 提供可匹配地址，value 是真正被加权返回的内容。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">图书馆式内容寻址</text>
<rect x="55" y="105" width="270" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="190.0" y="146.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">query：我现在需要什么？</text>
<line x1="190" y1="178" x2="190" y2="220" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<rect x="55" y="235" width="270" height="70" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="190.0" y="276.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">与每个 key 计算匹配分数</text>
<line x1="190" y1="308" x2="190" y2="350" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<rect x="55" y="365" width="270" height="70" rx="8" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="190.0" y="406.0" font-size="16" font-weight="650" text-anchor="middle" fill="#B7791F">按权重汇总对应 value</text>
<text x="55" y="480" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">地址相似不等于内容相同。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">一个 query 的逐项读取</text>
<circle cx="490" cy="270" r="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<text x="490" y="277" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">q_i</text>
<rect x="610" y="90" width="92" height="52" rx="7" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="656" y="123" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">k1</text>
<line x1="522" y1="270" x2="607" y2="120" stroke="#0F766E" stroke-width="4.3" marker-end="url(#a1)"/>
<rect x="720" y="90" width="70" height="52" rx="7" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="755" y="123" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">v₁</text>
<text x="570" y="189.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">.70</text>
<rect x="610" y="230" width="92" height="52" rx="7" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="656" y="263" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F">k2</text>
<line x1="522" y1="270" x2="607" y2="260" stroke="#B7791F" stroke-width="2.3" marker-end="url(#a1)"/>
<rect x="720" y="230" width="70" height="52" rx="7" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="755" y="263" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F">v₂</text>
<text x="570" y="259.0" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F">.20</text>
<rect x="610" y="370" width="92" height="52" rx="7" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="656" y="403" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">k3</text>
<line x1="522" y1="270" x2="607" y2="400" stroke="#C24135" stroke-width="1.9" marker-end="url(#a1)"/>
<rect x="720" y="370" width="70" height="52" rx="7" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="755" y="403" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">v₃</text>
<text x="570" y="329.0" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">.10</text>
<text x="455" y="480" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937" class="math">o_i = .70 v₁ + .20 v₂ + .10 v₃</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">对象与 shape 合同</text>
<rect x="845" y="80" width="46" height="38" rx="6" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="868" y="106" font-size="16" font-weight="800" text-anchor="middle" fill="#2563EB">Q</text>
<text x="910" y="105" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937">T_q × d_k</text>
<text x="910" y="134" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">提出 T_q 次读取</text>
<rect x="845" y="180" width="46" height="38" rx="6" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="868" y="206" font-size="16" font-weight="800" text-anchor="middle" fill="#0F766E">K</text>
<text x="910" y="205" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937">T_k × d_k</text>
<text x="910" y="234" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">提供 T_k 个地址</text>
<rect x="845" y="280" width="46" height="38" rx="6" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="868" y="306" font-size="16" font-weight="800" text-anchor="middle" fill="#0F766E">V</text>
<text x="910" y="305" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937">T_k × d_v</text>
<text x="910" y="334" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">提供 T_k 份内容</text>
<rect x="845" y="380" width="46" height="38" rx="6" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="868" y="406" font-size="16" font-weight="800" text-anchor="middle" fill="#2563EB">O</text>
<text x="910" y="405" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937">T_q × d_v</text>
<text x="910" y="434" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">每个 query 得一份返回</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先分清检索请求、匹配地址和返回内容，再写分数、归一化与矩阵乘法。</text>
</svg>