<text x="45" y="430" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937" class="math">j_l = j_(l−1) s_l</text>
<text x="45" y="467" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937" class="math">r_l = r_(l−1) + (k_eff,l − 1) j_(l−1)</text>
