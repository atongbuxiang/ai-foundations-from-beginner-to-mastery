<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">感受野：理论支持集、路径计数与有效影响</title>
<desc id="desc">kernel、stride 与 dilation 精确决定理论感受野；到中心的路径更多产生集中贡献；训练后的 effective receptive field 依参数、输入和测量定义。</desc>
