<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">HiPPO 到 S4：投影目标、状态动力学与结构化计算</title>
<desc id="desc">HiPPO 先规定怎样压缩历史，S4 再把相应状态动力学变成可训练、可高效计算的长序列层。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">历史函数投影</text>
<path d="M50.0 235.0 L78.0 208.2 L106.0 192.5 L134.0 191.1 L162.0 202.4 L190.0 221.0 L218.0 240.2 L246.0 254.1 L274.0 259.4 L302.0 256.4 L330.0 247.9 L358.0 238.4" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<text x="45" y="330" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E" class="math">c0(t)=⟨u≤t,g0^(t)⟩</text>
<text x="45" y="370" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E" class="math">c1(t)=⟨u≤t,g1^(t)⟩</text>
<text x="45" y="410" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E" class="math">c2(t)=⟨u≤t,g2^(t)⟩</text>
<text x="45" y="475" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">measure mu_t 决定近史/全史的权重。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">系数 ODE → HiPPO matrix</text>
<rect x="460" y="120" width="95" height="80" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="508" y="153" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">basis</text>
<text x="508" y="179" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">+ measure</text>
<line x1="556" y1="160" x2="625" y2="160" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a1)"/>
<rect x="630" y="120" width="95" height="80" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="678" y="153" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">A,B</text>
<text x="678" y="179" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">coefficient ODE</text>
<text x="445" y="270" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937" class="math">ċ(t)=A(t)c(t)+B(t)u(t)</text>
<text x="445" y="348" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">optimality 属于指定 weighted L² projection</text>
<text x="445" y="392" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">≠ 任意 downstream loss 最优</text>
<text x="445" y="475" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">连续投影、离散误差、学习误差分账。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">S4 的结构化计算路线</text>
<rect x="865" y="78" width="230" height="48" rx="5" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="980" y="108" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">HiPPO A</text>
<line x1="980" y1="128" x2="980" y2="164" stroke="#C24135" stroke-width="2" marker-end="url(#a1)"/>
<rect x="865" y="168" width="230" height="48" rx="5" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="980" y="198" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">NPLR / DPLR</text>
<line x1="980" y1="218" x2="980" y2="254" stroke="#C24135" stroke-width="2" marker-end="url(#a1)"/>
<rect x="865" y="258" width="230" height="48" rx="5" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="980" y="288" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">resolvent</text>
<line x1="980" y1="308" x2="980" y2="344" stroke="#C24135" stroke-width="2" marker-end="url(#a1)"/>
<rect x="865" y="348" width="230" height="48" rx="5" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="980" y="378" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">Cauchy kernel</text>
<line x1="980" y1="398" x2="980" y2="434" stroke="#C24135" stroke-width="2" marker-end="url(#a1)"/>
<rect x="865" y="438" width="230" height="48" rx="5" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="980" y="468" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">FFT convolution</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">‘长记忆’先是投影几何命题，再是结构化代数和经验建模命题。</text>
</svg>