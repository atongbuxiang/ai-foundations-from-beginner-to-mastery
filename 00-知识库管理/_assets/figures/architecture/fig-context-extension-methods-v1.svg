<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">长度扩展方法：相位变换、训练覆盖与成本边界</title>
<desc id="desc">直接外推、位置插值、逐频率缩放与 ReRoPE 处理不同失配；没有一种公式自动解决远程依赖。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">四种位置变换</text>
<rect x="55" y="100" width="120" height="44" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="115.0" y="128.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">Direct</text>
<text x="195" y="128" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">ρ(Δ)=Δ</text>
<rect x="55" y="190" width="120" height="44" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="115.0" y="218.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">PI</text>
<text x="195" y="218" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">ρ(Δ)=Δ/k</text>
<rect x="55" y="280" width="120" height="44" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="115.0" y="308.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">NTK / mixed</text>
<text x="195" y="308" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">ωᵢ→ωᵢ/sᵢ</text>
<rect x="55" y="370" width="120" height="44" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="115.0" y="398.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">ReRoPE</text>
<text x="195" y="398" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">ρ(Δ)=min(Δ,w)</text>
<text x="55" y="455" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">所有映射都要注明 causal 符号、</text>
<text x="55" y="478" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">训练长度 L₀ 与目标长度 L₁。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">它们交换了什么风险</text>
<text x="450" y="105" font-size="15" font-weight="800" text-anchor="start" fill="#2563EB">Direct</text>
<text x="555" y="105" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">未见相位 / 相对距离</text>
<text x="450" y="185" font-size="15" font-weight="800" text-anchor="start" fill="#2563EB">PI</text>
<text x="555" y="185" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">邻位拥挤；通常需微调</text>
<text x="450" y="265" font-size="15" font-weight="800" text-anchor="start" fill="#2563EB">per-frequency</text>
<text x="555" y="265" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">不同通道分担外推</text>
<text x="450" y="345" font-size="15" font-weight="800" text-anchor="start" fill="#2563EB">rectified</text>
<text x="555" y="345" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">窗口外距离被截断</text>
<text x="450" y="425" font-size="15" font-weight="800" text-anchor="start" fill="#2563EB">local mask</text>
<text x="555" y="425" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">远程边直接删除</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三张账必须同时过关</text>
<rect x="845" y="80" width="280" height="70" rx="7" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="985" y="107" font-size="15" font-weight="800" text-anchor="middle" fill="#2563EB">position coverage</text>
<text x="985" y="133" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">训练见过哪些相位/距离</text>
<rect x="845" y="205" width="280" height="70" rx="7" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="985" y="232" font-size="15" font-weight="800" text-anchor="middle" fill="#0F766E">attention regime</text>
<text x="985" y="258" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">候选数、熵与远程路径</text>
<rect x="845" y="330" width="280" height="70" rx="7" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="985" y="357" font-size="15" font-weight="800" text-anchor="middle" fill="#B7791F">system contract</text>
<text x="985" y="383" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">cache、kernel、额外 score</text>
<text x="845" y="460" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">“无限外推”必须保留问号与测试范围。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">位置变换只解决外推问题的一部分；训练覆盖、attention 候选制度、远程任务与系统成本要一起验收。</text>
</svg>