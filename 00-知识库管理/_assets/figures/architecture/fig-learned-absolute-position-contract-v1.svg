<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">可学习绝对位置：相加、索引、尺度与分辨率合同</title>
<desc id="desc">Token 与 position 可相加的前提是 shape 对齐；padding、packing、offset 与 resize 都会改变坐标语义。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">相加前先核对 Shape</text>
<rect x="55" y="105" width="290" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="200.0" y="137.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">token E[x] : B × T × d</text>
<rect x="55" y="205" width="290" height="52" rx="8" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="200.0" y="237.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">position P[id] : B × T × d</text>
<line x1="200" y1="160" x2="200" y2="195" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="200" y1="260" x2="200" y2="295" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="305" width="290" height="58" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="200.0" y="340.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">X₀ = E[x] + α P[id]</text>
<text x="55" y="420" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">相同 d 不保证相同 norm；</text>
<text x="55" y="447" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">α、初始化与 input norm 要登记。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Position ID 生命周期</text>
<text x="450" y="105" font-size="15" font-weight="800" text-anchor="start" fill="#B7791F">padding</text>
<text x="610" y="105" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">是否占 ID？</text>
<text x="450" y="190" font-size="15" font-weight="800" text-anchor="start" fill="#B7791F">packing</text>
<text x="610" y="190" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">样本边界 reset / isolate</text>
<text x="450" y="275" font-size="15" font-weight="800" text-anchor="start" fill="#B7791F">decode cache</text>
<text x="610" y="275" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">offset = cached length</text>
<text x="450" y="360" font-size="15" font-weight="800" text-anchor="start" fill="#B7791F">crop / segment</text>
<text x="610" y="360" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">局部 ID 还是全局 ID</text>
<text x="450" y="445" font-size="15" font-weight="800" text-anchor="start" fill="#B7791F">max table</text>
<text x="610" y="445" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">越界报错 / 扩表 / 插值</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">训练表格 ≠ 连续函数</text>
<rect x="840" y="112" width="48" height="40" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="864.0" y="138.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">0</text>
<rect x="901" y="112" width="48" height="40" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="925.0" y="138.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">1</text>
<rect x="962" y="112" width="48" height="40" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="986.0" y="138.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">2</text>
<rect x="1023" y="112" width="48" height="40" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="1047.0" y="138.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">…</text>
<rect x="1084" y="112" width="48" height="40" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="1108.0" y="138.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">L₀−1</text>
<text x="845" y="205" font-size="15" font-weight="800" text-anchor="start" fill="#C24135">测试 L₁ &gt; L₀：</text>
<text x="845" y="242" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">• 新行随机/复制：未训练参数</text>
<text x="845" y="278" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">• 1D 插值：改变邻距与谱</text>
<text x="845" y="314" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">• 2D 插值：需先恢复网格</text>
<text x="845" y="380" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">输入可运行，不代表坐标语义</text>
<text x="845" y="410" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">或长程利用保持不变。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">绝对位置表的真正接口是 ID 生成、相加尺度、最大范围与分辨率变更，而不只是一个参数矩阵。</text>
</svg>