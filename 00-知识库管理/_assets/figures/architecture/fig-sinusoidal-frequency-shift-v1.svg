<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Sinusoidal 位置编码：频率阶梯、平移旋转与混叠</title>
<desc id="desc">每对通道是一只不同转速的相位钟；平移在二维通道内对应固定旋转，内积只依相对位移。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">多尺度相位钟</text>
<circle cx="105" cy="120" r="35" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<line x1="105" y1="120" x2="132" y2="108" stroke="#C24135" stroke-width="3"/>
<text x="165" y="115" font-size="15" font-weight="800" text-anchor="start" fill="#C24135">high ω</text>
<text x="165" y="145" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">快：局部分辨率高</text>
<circle cx="105" cy="230" r="35" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<line x1="105" y1="230" x2="132" y2="224" stroke="#B7791F" stroke-width="3"/>
<text x="165" y="225" font-size="15" font-weight="800" text-anchor="start" fill="#B7791F">mid ω</text>
<text x="165" y="255" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">中等尺度</text>
<circle cx="105" cy="340" r="35" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<line x1="105" y1="340" x2="132" y2="340" stroke="#2563EB" stroke-width="3"/>
<text x="165" y="335" font-size="15" font-weight="800" text-anchor="start" fill="#2563EB">low ω</text>
<text x="165" y="365" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">慢：覆盖范围长</text>
<text x="55" y="455" font-size="18" font-weight="750" text-anchor="start" fill="#0F766E">ωᵢ = base^(−2i/d)</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">平移 = 通道内旋转</text>
<rect x="455" y="105" width="290" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="139.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">pω(n) = [cos ωn, sin ωn]</text>
<line x1="600" y1="164" x2="600" y2="205" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="218" width="290" height="62" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="255.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">pω(n+Δ) = R(ωΔ) pω(n)</text>
<line x1="600" y1="283" x2="600" y2="324" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="338" width="290" height="62" rx="8" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="600.0" y="375.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">pω(m)ᵀpω(n)=cos ω(m−n)</text>
<text x="455" y="450" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">这是精确恒等式，不是性能定理。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">分辨率与混叠</text>
<text x="845" y="110" font-size="15" font-weight="800" text-anchor="start" fill="#C24135">短周期</text>
<text x="940" y="110" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">邻位易区分，远处重复</text>
<text x="845" y="190" font-size="15" font-weight="800" text-anchor="start" fill="#2563EB">长周期</text>
<text x="940" y="190" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">远程不重复，邻位变化小</text>
<text x="845" y="270" font-size="15" font-weight="800" text-anchor="start" fill="#0F766E">组合频率</text>
<text x="940" y="270" font-size="15" font-weight="400" text-anchor="start" fill="#1F2937">用多尺度缓解单频歧义</text>
<text x="845" y="355" font-size="15" font-weight="800" text-anchor="start" fill="#B7791F">base / dtype / length</text>
<text x="845" y="390" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">共同决定相位分辨率；</text>
<text x="845" y="418" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">有限精度下近似相同也会混淆。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Sinusoidal 的强项是可解析平移结构；频率表、有限精度与任务训练仍决定能否真正利用这种结构。</text>
</svg>