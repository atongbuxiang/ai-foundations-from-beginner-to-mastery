<text x="864.0" y="128.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">I</text>
<text x="900" y="127" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">shape/cache/reparameterization</text>
<rect x="845" y="185" width="38" height="34" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="864.0" y="208.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">E</text>
<text x="900" y="207" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">DeepSeek-V2 system comparison</text>
<rect x="845" y="265" width="38" height="34" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="864.0" y="288.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">E</text>
<text x="900" y="287" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">10907 controlled ablations</text>
<rect x="845" y="345" width="38" height="34" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="864.0" y="368.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">H</text>
<text x="900" y="367" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">11111 limited-family optimality</text>
<rect x="845" y="425" width="38" height="34" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="864.0" y="448.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">O</text>
<text x="900" y="447" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">MTP、quant、kernel Pareto frontier</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">MLA 的强点要拆成 cache bytes、可吸收代数、head/position 设计和系统实测；整模型胜负不能替代消融。</text>
</svg>