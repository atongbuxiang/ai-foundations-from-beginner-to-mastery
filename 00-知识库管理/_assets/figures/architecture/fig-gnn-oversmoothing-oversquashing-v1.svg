<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">深层 GNN 的两种不同失效：平滑与挤压</title>
<desc id="desc">重复扩散使节点表示趋同；远程信息则可能在狭窄 cut 中被压入固定维向量。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Over-smoothing：节点变相似</text>
<circle cx="70" cy="145" r="18" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="70" cy="300" r="18" fill="#BFE8DF" stroke="#0F766E" stroke-width="2"/>
<line x1="70" y1="170" x2="70" y2="275" stroke="#D7DEE8" stroke-width="2" marker-end="url(#a4)"/>
<circle cx="160" cy="145" r="18" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="160" cy="300" r="18" fill="#BFE8DF" stroke="#0F766E" stroke-width="2"/>
<line x1="160" y1="170" x2="160" y2="275" stroke="#D7DEE8" stroke-width="2" marker-end="url(#a4)"/>
<circle cx="250" cy="145" r="18" fill="#B7791F" stroke="#B7791F" stroke-width="1"/>
<circle cx="250" cy="300" r="18" fill="#BFE8DF" stroke="#0F766E" stroke-width="2"/>
<line x1="250" y1="170" x2="250" y2="275" stroke="#D7DEE8" stroke-width="2" marker-end="url(#a4)"/>
<circle cx="340" cy="145" r="18" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<circle cx="340" cy="300" r="18" fill="#BFE8DF" stroke="#0F766E" stroke-width="2"/>
<line x1="340" y1="170" x2="340" y2="275" stroke="#D7DEE8" stroke-width="2" marker-end="url(#a4)"/>
<text x="45" y="395" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">层数增加：高频差异被反复平均</text>
<text x="45" y="440" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">极限与速率依传播谱和权重条件。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Over-squashing：远端扇入瓶颈</text>
<circle cx="460" cy="95" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<line x1="470" y1="95" x2="590" y2="255" stroke="#D7DEE8" stroke-width="1.6"/>
<circle cx="460" cy="147" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<line x1="470" y1="147" x2="590" y2="255" stroke="#D7DEE8" stroke-width="1.6"/>
<circle cx="460" cy="199" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<line x1="470" y1="199" x2="590" y2="255" stroke="#D7DEE8" stroke-width="1.6"/>
<circle cx="460" cy="251" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<line x1="470" y1="251" x2="590" y2="255" stroke="#D7DEE8" stroke-width="1.6"/>
<circle cx="460" cy="303" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<line x1="470" y1="303" x2="590" y2="255" stroke="#D7DEE8" stroke-width="1.6"/>
<circle cx="460" cy="355" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<line x1="470" y1="355" x2="590" y2="255" stroke="#D7DEE8" stroke-width="1.6"/>
<circle cx="460" cy="407" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<line x1="470" y1="407" x2="590" y2="255" stroke="#D7DEE8" stroke-width="1.6"/>
<circle cx="460" cy="459" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<line x1="470" y1="459" x2="590" y2="255" stroke="#D7DEE8" stroke-width="1.6"/>
<rect x="590" y="218" width="40" height="75" rx="4" fill="#FEE2E2" stroke="#C24135" stroke-width="2.5"/>
<text x="610" y="260" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">cut</text>
<line x1="633" y1="255" x2="735" y2="255" stroke="#C24135" stroke-width="3" marker-end="url(#a1)"/>
<circle cx="755" cy="255" r="20" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="755" y="260" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">v</text>
<text x="445" y="430" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937">许多远程信号 -&gt; 固定宽度 h_v</text>
<text x="445" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">增加层数可能扩大来源，却不拓宽 cut。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">诊断与干预要配对</text>
<text x="845" y="105" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">smooth</text>
<text x="845" y="132" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">pairwise distance / Dirichlet energy</text>
<text x="845" y="159" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">residual, norm, decouple</text>
<text x="845" y="225" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">squash</text>
<text x="845" y="252" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">long-range sensitivity / cut</text>
<text x="845" y="279" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">rewire, global path, width</text>
<text x="845" y="345" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">both</text>
<text x="845" y="372" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">task curve vs depth</text>
<text x="845" y="399" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">joint ablation</text>
<text x="845" y="470" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">“深了变差”不是机制诊断。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">平滑是状态趋同，挤压是信息瓶颈；二者需要不同测量、反例和干预。</text>
</svg>