<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">FlashAttention：不物化 n×n，怎样仍计算 Exact Attention</title>
<desc id="desc">Q/K/V 分块进入 SRAM；online softmax 保存每行 max、normalizer 与输出 accumulator，并在新块到来时重标度。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Memory Hierarchy</text>
<rect x="55" y="105" width="285" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="197.5" y="147.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">HBM: Q, K, V, O</text>
<rect x="95" y="245" width="205" height="68" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="197.5" y="285.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">SRAM: Q_i × K_j tile</text>
<line x1="200" y1="180" x2="200" y2="235" stroke="#1F2937" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#a3)"/>
<text x="55" y="365" font-size="15" font-weight="800" text-anchor="start" fill="#C24135">never write full S or P to HBM</text>
<text x="55" y="420" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">arithmetic still visits all dense pairs。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Online Softmax Merge</text>
<rect x="455" y="95" width="285" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="597.5" y="129.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">old state: (m, ℓ, o)</text>
<rect x="455" y="195" width="285" height="56" rx="8" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="597.5" y="229.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">new tile max: m_b</text>
<rect x="455" y="295" width="285" height="84" rx="8" fill="#FEF2F2" stroke="#C24135" stroke-width="2"/>
<text x="597.5" y="343.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">m&#x27;=max(m,m_b); rescale ℓ and o</text>
<line x1="598" y1="154" x2="598" y2="185" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="598" y1="254" x2="598" y2="285" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="455" y="430" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">o accumulator 用同一 scale 合并。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Exact 的精确含义</text>
<text x="845" y="105" font-size="16" font-weight="800" text-anchor="start" fill="#0F766E">✓</text>
<text x="875" y="105" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">same mathematical attention</text>
<text x="845" y="185" font-size="16" font-weight="800" text-anchor="start" fill="#0F766E">✓</text>
<text x="875" y="185" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">no low-rank/sparse approximation</text>
<text x="845" y="265" font-size="16" font-weight="800" text-anchor="start" fill="#C24135">≠</text>
<text x="875" y="265" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">bitwise same reduction order</text>
<text x="845" y="345" font-size="16" font-weight="800" text-anchor="start" fill="#C24135">≠</text>
<text x="875" y="345" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">linear arithmetic complexity</text>
<text x="845" y="425" font-size="16" font-weight="800" text-anchor="start" fill="#C24135">≠</text>
<text x="875" y="425" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">every shape/hardware faster</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">FlashAttention 优化的是数据搬运与中间存储；‘exact’和‘quadratic arithmetic’可以同时成立。</text>
</svg>