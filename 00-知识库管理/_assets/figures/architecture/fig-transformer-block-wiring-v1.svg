<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Transformer Block：两次子层、两条残差与归一化位置</title>
<desc id="desc">Token mixing 由 Attention 承担，channel mixing 由逐位置 FFN 承担；Pre/Post-Norm 改变 Jacobian 接线。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Pre-Norm block</text>
<rect x="65" y="100" width="260" height="48" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="195.0" y="130.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x</text>
<line x1="195" y1="151" x2="195" y2="165" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="65" y="165" width="260" height="48" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="195.0" y="195.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">LN</text>
<line x1="195" y1="216" x2="195" y2="235" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="65" y="235" width="260" height="48" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="195.0" y="265.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">MHA</text>
<line x1="195" y1="286" x2="195" y2="330" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="65" y="330" width="260" height="48" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="195.0" y="360.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x + MHA(LN(x))</text>
<line x1="195" y1="381" x2="195" y2="400" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="65" y="400" width="260" height="48" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="195.0" y="430.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">LN → FFN → add</text>
<text x="55" y="485" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">identity path 不穿过 LN Jacobian</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Post-Norm block</text>
<rect x="455" y="100" width="290" height="48" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="130.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x</text>
<line x1="600" y1="151" x2="600" y2="175" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="180" width="290" height="48" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="210.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">MHA</text>
<line x1="600" y1="231" x2="600" y2="255" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="270" width="290" height="48" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="300.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x + MHA(x)</text>
<line x1="600" y1="321" x2="600" y2="345" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="350" width="290" height="48" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="600.0" y="380.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">LN</text>
<line x1="600" y1="401" x2="600" y2="425" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="425" width="290" height="48" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="455.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">FFN → add → LN</text>
<text x="445" y="485" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">identity branch 也被 LN Jacobian 左乘</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">FFN 是逐 token 的通道变换</text>
<rect x="845" y="105" width="280" height="55" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="985.0" y="138.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">h → d_ff</text>
<line x1="985" y1="163" x2="985" y2="198" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="845" y="210" width="280" height="55" rx="8" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="985.0" y="243.5" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">activation / gate</text>
<line x1="985" y1="268" x2="985" y2="303" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="845" y="315" width="280" height="55" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="985.0" y="348.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">d_ff → h</text>
<text x="845" y="415" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">同一权重独立作用于每个位置；</text>
<text x="845" y="450" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">位置信息混合发生在 Attention。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先重建两类 mixing 和 residual wiring，再讨论 normalization、初始化与深度。</text>
</svg>