<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">固定 LTI 与选择性更新</text>
<text x="45" y="112" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">LTI</text>
<rect x="60" y="150" width="55" height="42" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="87" y="176" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">same A</text>
<rect x="136" y="150" width="55" height="42" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="163" y="176" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">same A</text>
<rect x="212" y="150" width="55" height="42" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="239" y="176" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">same A</text>
<rect x="288" y="150" width="55" height="42" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="315" y="176" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">same A</text>
<text x="45" y="245" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">Selective</text>
<rect x="60" y="285" width="55" height="42" rx="5" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="87" y="311" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">A1</text>
<rect x="136" y="285" width="55" height="42" rx="5" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="163" y="311" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">A2</text>
<rect x="212" y="285" width="55" height="42" rx="5" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="239" y="311" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">A3</text>
<rect x="288" y="285" width="55" height="42" rx="5" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="315" y="311" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">A4</text>
<text x="45" y="390" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937" class="math">Delta_t, B_t, C_t = functions of x_t</text>
<text x="45" y="445" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">S□：plain path h₃=1/2；boundary h₃=1/4。</text>
<text x="45" y="480" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">同一 lag、不同系数 ⇒ 不存在单一固定 K₂。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">selective scan 的系统账</text>
<text x="445" y="115" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">arithmetic</text>
