<text x="652" y="114" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">O(LN)</text>
<text x="445" y="195" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">parallel span</text>
<rect x="570" y="171" width="165" height="34" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
<text x="652" y="194" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">tree scan</text>
<text x="445" y="275" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">IO</text>
<rect x="570" y="251" width="165" height="34" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
<text x="652" y="274" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">fused / recompute</text>
<text x="445" y="355" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">stream state</text>
<rect x="570" y="331" width="165" height="34" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
<text x="652" y="354" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">O(N) per layer</text>
<text x="445" y="435" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">precision</text>
<rect x="570" y="411" width="165" height="34" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
<text x="652" y="434" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">long product audit</text>
<text x="445" y="487" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">复杂度、吞吐、首 token 延迟应分别测。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">证据阶梯</text>
<circle cx="860" cy="103" r="16" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="860" y="108" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">I</text>
<text x="890" y="108" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">机制直觉</text>
<text x="890" y="133" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">选择性可按输入调节状态</text>
<circle cx="860" cy="183" r="16" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="860" y="188" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">T</text>
<text x="890" y="188" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">条件化推导</text>
<text x="890" y="213" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">scan 结合律与线性长度</text>
<circle cx="860" cy="263" r="16" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="860" y="268" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">E</text>
<text x="890" y="268" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">论文实验</text>
<text x="890" y="293" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">特定规模/数据/硬件</text>
<circle cx="860" cy="343" r="16" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="860" y="348" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">H</text>
<text x="890" y="348" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">实现证据</text>
<text x="890" y="373" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">kernel、IO、精度</text>
<circle cx="860" cy="423" r="16" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="860" y="428" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">O</text>
<text x="890" y="428" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">开放问题</text>
<text x="890" y="453" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">外推、检索与稳定记忆</text>
<text x="842" y="500" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">‘线性时间’不是‘无限上下文记忆’的同义词。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Mamba 的核心是内容条件化状态更新与硬件扫描的联合设计；结论必须带实验条件。</text>
</svg>