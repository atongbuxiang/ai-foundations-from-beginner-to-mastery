<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">CNN stage：分辨率金字塔、残差块与可分离成本</title>
<desc id="desc">CNN 以 stage 交替降低空间分辨率、提高通道宽度；残差连接管理深度；depthwise+pointwise 分离空间和通道混合，但理论 MACs 不等于设备 latency。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">stage pyramid 分配预算</text>
<rect x="60" y="110" width="300" height="80" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="210.0" y="158" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">56×56 × 64</text>
<line x1="210.0" y1="192" x2="212.5" y2="220" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="95" y="225" width="235" height="80" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="212.5" y="273" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">28×28 × 128</text>
<line x1="212.5" y1="307" x2="215.0" y2="335" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="130" y="340" width="170" height="80" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="215.0" y="388" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">14×14 × 256</text>
<text x="45" y="470" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">halve H,W; often double C</text>
<text x="45" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">standard 3×3 MACs remain roughly level</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">block 组合而非层名清单</text>
<rect x="445" y="125" width="85" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="487.5" y="156.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">x</text>
<rect x="575" y="125" width="120" height="50" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="635.0" y="156.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">spatial mix</text>
<rect x="575" y="245" width="120" height="50" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="635.0" y="276.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">channel mix</text>
<rect x="575" y="365" width="120" height="50" rx="8" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="635.0" y="396.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">+ shortcut</text>
<line x1="531" y1="150" x2="568" y2="150" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<line x1="635" y1="178" x2="635" y2="237" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<line x1="635" y1="298" x2="635" y2="357" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<path d="M487 177L487 390L568 390" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<text x="438" y="465" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">stride/channel mismatch needs projection</text>
<text x="438" y="500" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">norm placement is part of block contract</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">standard vs separable</text>
<rect x="845" y="105" width="290" height="72" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="990" y="135" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">standard K×K</text>
<text x="990" y="162" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937" class="math">Cin Cout K²</text>
<line x1="990" y1="180" x2="990" y2="220" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="845" y="232" width="130" height="72" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="910" y="262" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">depthwise</text>
<text x="910" y="289" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937" class="math">Cin K²</text>
<text x="991" y="274" font-size="21" font-weight="700" text-anchor="middle" fill="#1F2937">+</text>
<rect x="1008" y="232" width="130" height="72" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="1073" y="262" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">pointwise</text>
<text x="1073" y="289" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937" class="math">Cin Cout</text>
<text x="842" y="360" font-size="17" font-weight="700" text-anchor="start" fill="#C24135" class="math">ratio ≈ 1/Cout + 1/K²</text>
<text x="842" y="410" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">but depthwise may be memory-bound</text>
<text x="842" y="450" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">benchmark target device and batch</text>
<text x="842" y="495" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">FLOPs, latency, energy are distinct</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">现代 CNN 的核心是 stage、block 与资源协同设计，而不是按年代背诵架构名字。</text>
</svg>