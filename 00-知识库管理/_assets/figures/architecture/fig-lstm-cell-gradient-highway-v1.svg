<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">LSTM：加法记忆通道与三类门控</title>
<desc id="desc">cell state 通过逐元素加法更新；forget/input/output gate 分别控制保留、写入和暴露。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">cell highway</text>
<line x1="58" y1="160" x2="340" y2="160" stroke="#0F766E" stroke-width="5" marker-end="url(#a1)"/>
<text x="55" y="135" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">c_(t-1)</text>
<text x="320" y="135" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">c_t</text>
<circle cx="135" cy="160" r="17" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="135" y="166" font-size="18" font-weight="700" text-anchor="middle" fill="#2563EB">×</text>
<circle cx="245" cy="160" r="17" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="245" y="166" font-size="18" font-weight="700" text-anchor="middle" fill="#C24135">+</text>
<rect x="76" y="255" width="90" height="43" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="121" y="282" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">f_t</text>
<line x1="121" y1="254" x2="132" y2="180" stroke="#2563EB" stroke-width="2" marker-end="url(#a0)"/>
<rect x="185" y="255" width="70" height="43" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="220" y="282" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">i_t</text>
<rect x="270" y="255" width="86" height="43" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="313" y="282" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">c_new</text>
<line x1="220" y1="254" x2="237" y2="180" stroke="#C24135" stroke-width="2" marker-end="url(#a0)"/>
<line x1="313" y1="254" x2="253" y2="180" stroke="#C24135" stroke-width="2" marker-end="url(#a0)"/>
<text x="45" y="360" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E" class="math">c_t = f_t * c_(t-1) + i_t * c_new</text>
<text x="45" y="420" font-size="18" font-weight="700" text-anchor="start" fill="#2563EB" class="math">h_t = o_t * tanh(c_t)</text>
<text x="45" y="480" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">S□：c=(1,1/4,9/20)，h₃≈0.3375。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">直接梯度路径</text>
<text x="445" y="132" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">f=0.99</text>
<rect x="520" y="112" width="130.07630443457032" height="28" rx="3" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
<text x="740" y="132" font-size="15" font-weight="650" text-anchor="end" fill="#1F2937">f⁵⁰≈0.605</text>
<text x="445" y="247" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">f=0.95</text>
<rect x="520" y="227" width="16.54316968449333" height="28" rx="3" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
<text x="740" y="247" font-size="15" font-weight="650" text-anchor="end" fill="#1F2937">f⁵⁰≈0.077</text>
<text x="445" y="362" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">f=0.80</text>
<rect x="520" y="342" width="0.003068582539317822" height="28" rx="3" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
<text x="740" y="362" font-size="15" font-weight="650" text-anchor="end" fill="#1F2937">f⁵⁰≈0.000</text>
<text x="445" y="455" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">S□：f₁f₂f₃=(3/4)(1/2)(4/5)=3/10。</text>
<text x="445" y="485" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">这只是直接项；总导数还包含门的依赖。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">能够缓解，不等于保证</text>
<text x="848" y="118" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">✓ 加法状态路径</text>
<text x="848" y="180" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">✓ 可学习时间尺度</text>
<text x="848" y="260" font-size="16" font-weight="650" text-anchor="start" fill="#C24135">△ sigmoid 饱和</text>
<text x="848" y="322" font-size="16" font-weight="650" text-anchor="start" fill="#C24135">△ 截断 BPTT</text>
<text x="848" y="384" font-size="16" font-weight="650" text-anchor="start" fill="#C24135">△ cell 数值漂移</text>
<text x="848" y="446" font-size="16" font-weight="650" text-anchor="start" fill="#C24135">△ 任务未必可识别</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">LSTM 改写了梯度与状态的路径结构，但长期学习仍受门值、训练和任务共同约束。</text>
</svg>