<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Performer：正随机特征怎样近似 Softmax Kernel</title>
<desc id="desc">先估计 exp(qᵀk)，再把随机误差传播到归一化 attention；feature 数 m 控制成本与方差。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Gaussian Moment Identity</text>
<rect x="55" y="105" width="285" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="197.5" y="144.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">e^{qᵀk} = E_ω[ψ_ω(q) ψ_ω(k)]</text>
<text x="55" y="220" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">ψ_ω(x)=exp(ωᵀx-‖x‖²/2)</text>
<text x="55" y="275" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">m samples → positive feature vector</text>
<circle cx="75" cy="355" r="12" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<circle cx="133" cy="377" r="12" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<circle cx="191" cy="355" r="12" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<circle cx="249" cy="377" r="12" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<circle cx="307" cy="355" r="12" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="55" y="445" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">orthogonal features target lower variance。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">两层误差不能混写</text>
<rect x="455" y="105" width="285" height="52" rx="8" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="597.5" y="137.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">kernel:  K̂_ij − K_ij</text>
<rect x="455" y="215" width="285" height="60" rx="8" fill="#FEF2F2" stroke="#C24135" stroke-width="2"/>
<text x="597.5" y="251.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">ratio: N̂_i/D̂_i − N_i/D_i</text>
<rect x="455" y="335" width="285" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="597.5" y="370.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">output: ô_i − o_i</text>
<line x1="598" y1="160" x2="598" y2="205" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="598" y1="278" x2="598" y2="325" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="455" y="447" font-size="15" font-weight="800" text-anchor="start" fill="#C24135">小 denominator 会放大比值误差。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">m 的三方账本</text>
<rect x="845" y="115" width="80" height="38" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="885.0" y="140.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">↑ m</text>
<text x="945" y="139" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">↓ random error</text>
<rect x="845" y="215" width="80" height="38" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="885.0" y="240.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">↑ m</text>
<text x="945" y="239" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">↑ feature MAC/state</text>
<rect x="845" y="315" width="80" height="38" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="885.0" y="340.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">fixed seed</text>
<text x="945" y="339" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">可复现 ≠ 无偏消失</text>
<rect x="845" y="415" width="80" height="38" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="885.0" y="440.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">new draw</text>
<text x="945" y="439" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">增加 estimator variance</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Performer 的理论对象是随机 kernel 估计；真实速度与质量还取决于 m、数值稳定和实现 crossover。</text>
</svg>