<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">低秩/序列压缩 Attention：压哪条轴，误差在哪里进入</title>
<desc id="desc">Linformer 类方法先把 K/V 的长度轴 n 投影为 k；复杂度下降以 k≪n 和可迁移投影为前提。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">沿 Sequence Axis 压缩</text>
<rect x="55" y="105" width="115" height="230" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="112.5" y="226.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">K,V : n × d</text>
<rect x="230" y="165" width="105" height="110" rx="8" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="282.5" y="226.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">E,F : k × n</text>
<line x1="173" y1="220" x2="225" y2="220" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="55" y="390" width="280" height="62" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="195.0" y="427.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">K&#x27;=EK, V&#x27;=FV : k × d</text>
<line x1="282" y1="278" x2="195" y2="385" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<text x="55" y="486" font-size="15" font-weight="800" text-anchor="start" fill="#0F766E">score 从 n×n 变 n×k。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Spectral Tail 只是第一道误差</text>
<rect x="465" y="165" width="21" height="165" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<rect x="496" y="210" width="21" height="120" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<rect x="527" y="245" width="21" height="85" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<rect x="558" y="272" width="21" height="58" rx="2" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="1"/>
<rect x="589" y="292" width="21" height="38" rx="2" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="1"/>
<rect x="620" y="304" width="21" height="26" rx="2" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="1"/>
<rect x="651" y="312" width="21" height="18" rx="2" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="1"/>
<rect x="682" y="318" width="21" height="12" rx="2" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="1"/>
<line x1="455" y1="330" x2="735" y2="330" stroke="#1F2937" stroke-width="1.5"/>
<text x="455" y="370" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">keep k</text>
<text x="610" y="370" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">discarded tail</text>
<text x="455" y="420" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">K/V projection → logits → softmax → output</text>
<text x="455" y="452" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">每一步可放大或重塑误差。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">实现与外推合同</text>
<circle cx="855" cy="110" r="7" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="875" y="115" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">k fixed / grows?</text>
<circle cx="855" cy="185" r="7" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="875" y="190" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">E/F shared by heads/layers?</text>
<circle cx="855" cy="260" r="7" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="875" y="265" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">causal leakage avoided?</text>
<circle cx="855" cy="335" r="7" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="875" y="340" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">new n: resize or new parameters?</text>
<circle cx="855" cy="410" r="7" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="875" y="415" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">projection MAC + memory counted?</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">‘Attention 近似低秩’必须变成明确的轴、rank、norm、长度和输出误差合同，才能支持工程结论。</text>
</svg>