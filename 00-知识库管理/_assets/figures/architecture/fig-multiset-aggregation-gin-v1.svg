<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">多重集聚合：mean/max 碰撞与 GIN 的可辨识合同</title>
<desc id="desc">邻域不是普通集合而是带重复计数的多重集；不同聚合器会永久丢失不同信息。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">mean 丢失倍数</text>
<circle cx="75" cy="145" r="22" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="75" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">1</text>
<circle cx="140" cy="145" r="22" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="140" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">4</text>
<text x="350" y="200" font-size="16" font-weight="700" text-anchor="end" fill="#C24135">mean = 2.5</text>
<circle cx="75" cy="305" r="22" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="75" y="311" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">1</text>
<circle cx="140" cy="305" r="22" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="140" y="311" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">1</text>
<circle cx="205" cy="305" r="22" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="205" y="311" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">4</text>
<circle cx="270" cy="305" r="22" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="270" y="311" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">4</text>
<text x="350" y="360" font-size="16" font-weight="700" text-anchor="end" fill="#C24135">mean = 2.5</text>
<text x="45" y="430" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">不同 cardinality，同一输出。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">max 丢失计数与次大值</text>
<rect x="455" y="123" width="44" height="44" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="477" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">1</text>
<rect x="520" y="123" width="44" height="44" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="542" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">4</text>
<text x="755" y="200" font-size="17" font-weight="700" text-anchor="end" fill="#C24135">max = 4</text>
<rect x="455" y="283" width="44" height="44" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="477" y="311" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">1</text>
<rect x="520" y="283" width="44" height="44" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="542" y="311" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">1</text>
<rect x="585" y="283" width="44" height="44" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="607" y="311" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">4</text>
<rect x="650" y="283" width="44" height="44" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="672" y="311" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">4</text>
<text x="755" y="360" font-size="17" font-weight="700" text-anchor="end" fill="#C24135">max = 4</text>
<text x="445" y="430" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">未进入最大值的元素不可恢复。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">sum + injective maps 的条件</text>
<rect x="845" y="105" width="280" height="58" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="985.0" y="140.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">multiset -&gt; sum phi(x)</text>
<line x1="985" y1="166" x2="985" y2="200" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<rect x="845" y="215" width="280" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="985.0" y="250.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">combine self with (1+eps)</text>
<line x1="985" y1="276" x2="985" y2="310" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<rect x="845" y="325" width="280" height="58" rx="8" fill="#FFF7ED" stroke="#C24135" stroke-width="2"/>
<text x="985.0" y="360.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">MLP update + invariant readout</text>
<text x="845" y="425" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">sum: 5 vs 10；但 {1,4} 与 {2,3} 均为 5。</text>
<text x="845" y="458" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">phi=(1,x,x²): (2,5,17) vs (2,5,13)</text>
<text x="845" y="490" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">GIN 达到 1-WL，不超越 1-WL。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">聚合后的碰撞无法被后续 MLP 修复；先审计保留了哪些多重集统计。</text>
</svg>