<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">没有位置时：Self-Attention 保留 Token 置换对称</title>
<desc id="desc">共享投影与逐行运算使无位置 encoder 对 token permutation 等变；pooling 后进一步变为不变。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">同一集合，两种排列</text>
<rect x="55" y="112" width="70" height="48" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="90.0" y="142.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">A</text>
<rect x="150" y="112" width="70" height="48" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="185.0" y="142.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">B</text>
<rect x="245" y="112" width="70" height="48" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="280.0" y="142.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">C</text>
<text x="55" y="194" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">共享 Q/K/V；全可见 relation 同步置换</text>
<rect x="55" y="262" width="70" height="48" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="90.0" y="292.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">C</text>
<rect x="150" y="262" width="70" height="48" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="185.0" y="292.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">A</text>
<rect x="245" y="262" width="70" height="48" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="280.0" y="292.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">B</text>
<text x="55" y="344" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">共享 Q/K/V；全可见 relation 同步置换</text>
<line x1="90" y1="165" x2="90" y2="250" stroke="#1F2937" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a3)"/>
<text x="55" y="430" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">输出只会按同一 permutation 重排。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">等变证明链</text>
<rect x="455" y="100" width="290" height="54" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="133.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">Q(PX)=P Q(X)</text>
<line x1="600" y1="157" x2="600" y2="191" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="195" width="290" height="54" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="228.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">S(PX)=P S(X) Pᵀ</text>
<line x1="600" y1="252" x2="600" y2="286" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="290" width="290" height="54" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="600.0" y="323.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">A(PX)=P A(X) Pᵀ</text>
<line x1="600" y1="347" x2="600" y2="381" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="385" width="290" height="54" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="418.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">F(PX)=P F(X)</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">怎样打破或利用对称</text>
<circle cx="858" cy="105" r="9" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="880" y="110" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">absolute / relative position</text>
<circle cx="858" cy="193" r="9" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="880" y="198" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">causal / structural mask</text>
<circle cx="858" cy="281" r="9" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="880" y="286" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">special token / boundary</text>
<circle cx="858" cy="369" r="9" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="880" y="374" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">graph, grid, segment coordinates</text>
<text x="845" y="458" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">Causal mask 提供顺序非对称，</text>
<text x="845" y="484" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">但不保证高分辨率计数或外推。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">位置编码不是装饰：先问模型还保留什么对称，再决定需要注入哪种坐标。</text>
</svg>