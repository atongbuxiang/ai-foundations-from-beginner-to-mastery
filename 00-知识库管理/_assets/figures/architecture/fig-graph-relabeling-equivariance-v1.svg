<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">图重标号：表示改变，对象不变</title>
<desc id="desc">同一抽象图可由不同邻接矩阵表示；节点级函数应等变，图级函数应不变。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">同一图的两种编号</text>
<line x1="80" y1="180" x2="180" y2="110" stroke="#D7DEE8" stroke-width="3"/>
<line x1="180" y1="110" x2="300" y2="180" stroke="#D7DEE8" stroke-width="3"/>
<circle cx="80" cy="180" r="20" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="80" y="186" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">1</text>
<circle cx="180" cy="110" r="20" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="180" y="116" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">2</text>
<circle cx="300" cy="180" r="20" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="300" y="186" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">3</text>
<text x="170" y="265" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">A, X</text>
<line x1="65" y1="285" x2="335" y2="285" stroke="#D7DEE8" stroke-width="2"/>
<line x1="80" y1="405" x2="180" y2="335" stroke="#D7DEE8" stroke-width="3"/>
<line x1="180" y1="335" x2="300" y2="405" stroke="#D7DEE8" stroke-width="3"/>
<circle cx="80" cy="405" r="20" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="80" y="411" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">3</text>
<circle cx="180" cy="335" r="20" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="180" y="341" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">1</text>
<circle cx="300" cy="405" r="20" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="300" y="411" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">2</text>
<text x="170" y="475" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">P A P^T, P X</text>
<text x="45" y="505" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">X&#x27;=(4,1,2)</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">节点输出必须共同重排</text>
<rect x="455" y="115" width="295" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="602.5" y="156.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">F(P A P^T, P X)</text>
<line x1="602" y1="188" x2="602" y2="235" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<rect x="455" y="250" width="295" height="70" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="602.5" y="291.0" font-size="18" font-weight="650" text-anchor="middle" fill="#0F766E">= P F(A, X)</text>
<text x="455" y="385" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937">预测跟着节点走，</text>
<text x="455" y="420" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">而不是粘在行号上。</text>
<text x="455" y="470" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">G□：A&#x27;X&#x27;=PAX=(2,2,5)。</text>
<text x="455" y="498" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">输出跟节点走，不粘在行号上。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">图级读出必须不变</text>
<rect x="845" y="120" width="280" height="62" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="985.0" y="157.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">node states H</text>
<line x1="985" y1="185" x2="985" y2="222" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="845" y="230" width="280" height="62" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="985.0" y="267.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">sum / invariant readout</text>
<line x1="985" y1="295" x2="985" y2="332" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="845" y="340" width="280" height="62" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="985.0" y="377.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">graph prediction</text>
<text x="845" y="445" font-size="19" font-weight="700" text-anchor="start" fill="#1F2937" class="math">rho(PH) = rho(H)</text>
<text x="845" y="485" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">对称性是模型合同，不是数据增强技巧。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先把图看作重标号等价类，再定义等变层和不变任务出口。</text>
</svg>