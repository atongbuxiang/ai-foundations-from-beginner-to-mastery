<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">RoPE：绝对旋转怎样在 QK 内积中变成相对位移</title>
<desc id="desc">位置 m、n 分别旋转 Q、K；正交表示合同把两次绝对变换合并成只依 n−m 的相对旋转。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Q/K 各自按位置旋转</text>
<rect x="55" y="105" width="110" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="110.0" y="137.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">qₘ</text>
<rect x="235" y="105" width="110" height="52" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="290.0" y="137.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">Rₘ qₘ</text>
<line x1="168" y1="131" x2="230" y2="131" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<text x="199" y="113" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">Rₘ</text>
<rect x="55" y="265" width="110" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="110.0" y="297.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">kₙ</text>
<rect x="235" y="265" width="110" height="52" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="290.0" y="297.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">Rₙ kₙ</text>
<line x1="168" y1="291" x2="230" y2="291" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<text x="199" y="273" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">Rₙ</text>
<line x1="290" y1="160" x2="290" y2="250" stroke="#B7791F" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a2)"/>
<text x="55" y="405" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">Rotation 只作用成对通道；</text>
<text x="55" y="432" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">head_dim、pairing、offset 是实现合同。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">相对位移恒等式</text>
<rect x="455" y="105" width="290" height="58" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="140.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">RₘᵀRₙ = Rₙ₋ₘ</text>
<line x1="600" y1="166" x2="600" y2="210" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="435" y="225" width="330" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="267.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">(Rₘqₘ)ᵀ(Rₙkₙ) = qₘᵀRₙ₋ₘkₙ</text>
<line x1="600" y1="300" x2="600" y2="344" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="455" y="358" width="290" height="58" rx="8" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="600.0" y="393.0" font-size="16" font-weight="650" text-anchor="middle" fill="#B7791F">‖Rₙx‖ = ‖x‖</text>
<text x="455" y="460" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">离散位置：Rₙ = R₁ⁿ。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">恒等式没有承诺</text>
<text x="845" y="115" font-size="18" font-weight="800" text-anchor="start" fill="#C24135">×</text>
<text x="875" y="115" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">注意力随距离单调下降</text>
<text x="845" y="193" font-size="18" font-weight="800" text-anchor="start" fill="#C24135">×</text>
<text x="875" y="193" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">训练外相位仍可正确解释</text>
<text x="845" y="271" font-size="18" font-weight="800" text-anchor="start" fill="#C24135">×</text>
<text x="875" y="271" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">所有 head 都使用同一尺度</text>
<text x="845" y="349" font-size="18" font-weight="800" text-anchor="start" fill="#C24135">×</text>
<text x="875" y="349" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">长上下文检索与推理可靠</text>
<text x="845" y="445" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">代数结构 = I；性能与外推 = E/H。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">RoPE 的证明核心只有正交表示与相对内积；频率、训练覆盖和任务利用必须另建证据。</text>
</svg>