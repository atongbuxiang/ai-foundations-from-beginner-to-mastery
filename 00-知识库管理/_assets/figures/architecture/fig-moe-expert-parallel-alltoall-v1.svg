<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Expert Parallel 与 All-to-All：Payload 之外还有尾延迟</title>
<desc id="desc">token hidden states 先按 expert owner 重排发送，再本地执行专家并回传；网络量、拓扑、偏斜与同步尾部共同决定延迟。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Dispatch → Expert → Combine</text>
<rect x="55" y="95" width="100" height="48" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="105.0" y="125.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">device 0</text>
<rect x="270" y="95" width="90" height="48" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="315.0" y="125.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">expert 0</text>
<rect x="55" y="215" width="100" height="48" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="105.0" y="245.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">device 1</text>
<rect x="270" y="215" width="90" height="48" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="315.0" y="245.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">expert 1</text>
<rect x="55" y="335" width="100" height="48" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="105.0" y="365.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">device 2</text>
<rect x="270" y="335" width="90" height="48" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="315.0" y="365.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">expert 2</text>
<line x1="158" y1="119" x2="265" y2="239" stroke="#0F766E" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#a3)"/>
<line x1="158" y1="119" x2="265" y2="359" stroke="#B7791F" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#a3)"/>
<line x1="158" y1="239" x2="265" y2="119" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#a3)"/>
<line x1="158" y1="359" x2="265" y2="239" stroke="#0F766E" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#a3)"/>
<text x="55" y="470" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">再做逆置 All-to-All，将输出送回 token owner。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">通信量的最低账本</text>
<rect x="455" y="102" width="285" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="597.5" y="137.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">payload ≈ assignments × d × bytes</text>
<text x="455" y="215" font-size="15" font-weight="800" text-anchor="start" fill="#0F766E">assignments</text>
<text x="585" y="215" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">T·k (before drops)</text>
<text x="455" y="285" font-size="15" font-weight="800" text-anchor="start" fill="#0F766E">direction</text>
<text x="585" y="285" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">dispatch + combine</text>
<text x="455" y="355" font-size="15" font-weight="800" text-anchor="start" fill="#0F766E">metadata</text>
<text x="585" y="355" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">indices / scales / padding</text>
<text x="455" y="425" font-size="15" font-weight="800" text-anchor="start" fill="#0F766E">local share</text>
<text x="585" y="425" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">does not cross network</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Volume ≠ Latency</text>
<rect x="845" y="100" width="105" height="38" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="897.5" y="125.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">topology</text>
<text x="970" y="125" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">intra/inter-node</text>
<rect x="845" y="175" width="105" height="38" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="897.5" y="200.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">skew</text>
<text x="970" y="200" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">max load, not mean</text>
<rect x="845" y="250" width="105" height="38" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="897.5" y="275.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">buckets</text>
<text x="970" y="275" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">many small messages</text>
<rect x="845" y="325" width="105" height="38" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="897.5" y="350.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">overlap</text>
<text x="970" y="350" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">compute ↔ network</text>
<rect x="845" y="400" width="105" height="38" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="897.5" y="425.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">straggler</text>
<text x="970" y="425" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">global tail sync</text>
<rect x="845" y="475" width="105" height="38" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="897.5" y="500.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">kernel</text>
<text x="970" y="500" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">padding / block size</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">All-to-All 字节数是恒等账本；端到端延迟必须在指定并行布局、负载分布、网络与重叠策略下测量。</text>
</svg>