<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">平移等变性：交换图、共享核与失效边界</title>
<desc id="desc">单位步幅、恰当定义域上的共享卷积与平移算子可交换；位置依赖权重、边界裁切和下采样会破坏或限制该性质。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">等变 = 先移再算，先算再移</text>
<rect x="55" y="120" width="110" height="55" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="110.0" y="153.5" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">x</text>
<rect x="260" y="120" width="110" height="55" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="315.0" y="153.5" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">Tτ x</text>
<rect x="55" y="340" width="110" height="55" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="110.0" y="373.5" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">Cw x</text>
<rect x="260" y="340" width="110" height="55" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="315.0" y="373.5" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">Tτ Cw x</text>
<line x1="166" y1="148" x2="254" y2="148" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<text x="210" y="132" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">shift Tτ</text>
<line x1="110" y1="176" x2="110" y2="332" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="120" y="255" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">Cw</text>
<line x1="315" y1="176" x2="315" y2="332" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="325" y="255" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">Cw</text>
<line x1="166" y1="368" x2="254" y2="368" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<text x="210" y="352" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">shift Tτ</text>
<text x="45" y="455" font-size="20" font-weight="700" text-anchor="start" fill="#C24135" class="math">Cw Tτ = Tτ Cw</text>
<text x="45" y="493" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">输出移动，不是输出保持不变。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">为何共享核是关键</text>
<circle cx="465" cy="155" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="465" y="190" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">i+0</text>
<circle cx="545" cy="155" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="545" y="190" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">i+1</text>
<circle cx="625" cy="155" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="625" y="190" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">i+2</text>
<circle cx="705" cy="155" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="705" y="190" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">i+3</text>
<path d="M455 235 Q585 175 715 235" fill="none" stroke="#0F766E" stroke-width="3"/>
<text x="585" y="225" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">same w at every i</text>
<text x="438" y="300" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">(Cw Tτx)[i]</text>
<text x="620" y="300" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">= Σj w[j] x[i+j−τ]</text>
<text x="438" y="350" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">(Tτ Cwx)[i]</text>
<text x="620" y="350" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">= (Cwx)[i−τ]</text>
<text x="438" y="402" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">同一 w 与相对位移 j 让两式相等。</text>
<text x="438" y="465" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">若 w=w_i 随位置变，换元后不再匹配。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三个常见失效点</text>
<circle cx="855" cy="108" r="11" fill="#FFFEFB" stroke="#C24135" stroke-width="3"/>
<line x1="848" y1="101" x2="862" y2="115" stroke="#C24135" stroke-width="2.5"/>
<line x1="862" y1="101" x2="848" y2="115" stroke="#C24135" stroke-width="2.5"/>
<text x="885" y="115" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">finite boundary</text>
<text x="885" y="147" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">zero/crop 产生特殊边缘</text>
<circle cx="855" cy="238" r="11" fill="#FFFEFB" stroke="#C24135" stroke-width="3"/>
<line x1="848" y1="231" x2="862" y2="245" stroke="#C24135" stroke-width="2.5"/>
<line x1="862" y1="231" x2="848" y2="245" stroke="#C24135" stroke-width="2.5"/>
<text x="885" y="245" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">stride &gt; 1</text>
<text x="885" y="277" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">只对 stride 的整数倍平移对齐</text>
<circle cx="855" cy="368" r="11" fill="#FFFEFB" stroke="#C24135" stroke-width="3"/>
<line x1="848" y1="361" x2="862" y2="375" stroke="#C24135" stroke-width="2.5"/>
<line x1="862" y1="361" x2="848" y2="375" stroke="#C24135" stroke-width="2.5"/>
<text x="885" y="375" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">pool / nonlinear</text>
<text x="885" y="407" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">需逐个检查所需群作用</text>
<text x="842" y="475" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">等变性是算子恒等式；</text>
<text x="842" y="505" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">鲁棒性与泛化仍是任务和数据上的经验问题。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">共享局部核给出平移等变的结构理由，但边界、采样和任务读出决定实际保留程度。</text>
</svg>