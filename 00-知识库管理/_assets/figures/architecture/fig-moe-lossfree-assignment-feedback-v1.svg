<text x="197.5" y="243.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">observe load nᵢ − target</text>
<rect x="55" y="330" width="285" height="62" rx="8" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="197.5" y="367.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">bᵢ ← bᵢ − η·sign(error)</text>
