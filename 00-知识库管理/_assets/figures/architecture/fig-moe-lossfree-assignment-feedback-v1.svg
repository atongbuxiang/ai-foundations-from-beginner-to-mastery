<text x="900" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">漂移下稳定性</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">loss-free 的精确含义是移除显式辅助目标；bias 状态、更新率、延迟和分布式统计仍须进入审计。</text>
