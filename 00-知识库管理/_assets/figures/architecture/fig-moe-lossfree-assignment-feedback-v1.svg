<text x="55" y="445" font-size="15" font-weight="800" text-anchor="start" fill="#C24135">无显式 L_aux ≠ 无训练干预。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Capacity-constrained Assignment</text>
<text x="455" y="104" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937">max  Σᵢⱼ aᵢⱼ sᵢⱼ</text>
