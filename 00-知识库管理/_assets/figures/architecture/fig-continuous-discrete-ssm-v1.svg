<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">线性状态空间：连续流、零阶保持与离散极点</title>
<desc id="desc">矩阵指数给出精确零阶保持离散化；连续稳定与离散稳定通过极点映射连接。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">一段采样间隔内的变分常数公式</text>
<text x="45" y="120" font-size="18" font-weight="700" text-anchor="start" fill="#0F766E" class="math">ẋ(t)=Ax(t)+Bu(t)</text>
<line x1="65" y1="235" x2="340" y2="235" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="95" cy="235" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="305" cy="235" r="7" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<text x="95" y="265" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">kΔ</text>
<text x="305" y="265" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">(k+1)Δ</text>
<rect x="105" y="180" width="190" height="35" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="200" y="203" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">u(t) = u_k  (ZOH)</text>
<text x="45" y="330" font-size="18" font-weight="700" text-anchor="start" fill="#2563EB" class="math">Abar = exp(A Delta)</text>
<text x="45" y="380" font-size="15" font-weight="700" text-anchor="start" fill="#C24135" class="math">Bbar = integral exp(A tau) B d tau</text>
<text x="45" y="447" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">A 可逆时才可简写 A⁻¹(Ā−I)B。</text>
<text x="45" y="480" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">奇异 A 应保留积分或用增广矩阵指数。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">极点映射 z = exp(lambda Delta)</text>
<line x1="445" y1="285" x2="755" y2="285" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="600" y1="100" x2="600" y2="470" stroke="#D7DEE8" stroke-width="1.5"/>
<path d="M485 285 A115 115 0 1 0 715 285 A115 115 0 1 0 485 285" fill="none" stroke="#0F766E" stroke-width="2.5"/>
<circle cx="550" cy="220" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<text x="562" y="212" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">stable</text>
<circle cx="700" cy="190" r="7" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<text x="712" y="182" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">unstable</text>
<circle cx="600" cy="170" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="612" y="162" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">oscillatory</text>
<text x="445" y="485" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">Re(lambda)&lt;0 =&gt; |exp(lambda Delta)|&lt;1。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">方法与步长共同决定稳定</text>
<text x="845" y="110" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">exact ZOH</text>
<text x="970" y="110" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">exp(A Delta)</text>
<text x="845" y="138" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">保留连续极点映射</text>
<line x1="842" y1="157" x2="1140" y2="157" stroke="#D7DEE8" stroke-width="1"/>
<text x="845" y="215" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">forward Euler</text>
<text x="970" y="215" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">I + Delta A</text>
<text x="845" y="243" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">大步长可失稳</text>
<line x1="842" y1="262" x2="1140" y2="262" stroke="#D7DEE8" stroke-width="1"/>
<text x="845" y="320" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">bilinear</text>
<text x="970" y="320" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">Cayley map</text>
<text x="845" y="348" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">扭曲频率但稳健</text>
<line x1="842" y1="367" x2="1140" y2="367" stroke="#D7DEE8" stroke-width="1"/>
<text x="845" y="425" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">learned Delta</text>
<text x="970" y="425" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">positive map</text>
<text x="845" y="453" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">需审计范围/精度</text>
<line x1="842" y1="472" x2="1140" y2="472" stroke="#D7DEE8" stroke-width="1"/>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">离散化定义了真正运行的 recurrence；方法、步长、精度和稳定域缺一不可。</text>
</svg>