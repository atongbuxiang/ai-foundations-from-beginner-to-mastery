<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">图注意力：结构 mask 内的内容依赖加权</title>
<desc id="desc">每个目标节点只在其邻域上归一化权重；多头改变通道，但不自动成为全局检索或解释。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">以 i 为中心的 masked softmax</text>
<circle cx="95" cy="135" r="22" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="95" y="141" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">j1</text>
<line x1="95" y1="135" x2="200" y2="260" stroke="#0F766E" stroke-width="5.5" marker-end="url(#a1)"/>
<text x="147.5" y="189.5" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">0.70</text>
<circle cx="85" cy="360" r="22" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="85" y="366" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">j2</text>
<line x1="85" y1="360" x2="200" y2="260" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<text x="142.5" y="302.0" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">0.10</text>
<circle cx="315" cy="145" r="22" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="315" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">j3</text>
<line x1="315" y1="145" x2="200" y2="260" stroke="#0F766E" stroke-width="3.0" marker-end="url(#a1)"/>
<text x="257.5" y="194.5" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">0.20</text>
<circle cx="200" cy="260" r="26" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5"/>
<text x="200" y="266" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">i</text>
<text x="45" y="455" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937" class="math">sum_(j in N(i)) alpha_ij = 1</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">score、normalization、message 分开</text>
<rect x="445" y="105" width="310" height="62" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="142.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">e_ij = a(W h_i, W h_j)</text>
<line x1="600" y1="170" x2="600" y2="210" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="445" y="220" width="310" height="62" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="257.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">alpha_ij = softmax over N(i)</text>
<line x1="600" y1="285" x2="600" y2="325" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="445" y="335" width="310" height="62" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="372.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">h_i&#x27; = sigma sum alpha_ij W h_j</text>
<text x="445" y="455" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">edge features / direction 要显式进入 score。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">四个不能自动推出的结论</text>
<circle cx="855" cy="107" r="13" fill="#FEE2E2" stroke="#C24135" stroke-width="2"/>
<text x="855" y="112" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">x</text>
<text x="883" y="112" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">global attention</text>
<circle cx="855" cy="193" r="13" fill="#FEE2E2" stroke="#C24135" stroke-width="2"/>
<text x="855" y="198" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">x</text>
<text x="883" y="198" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">faithful explanation</text>
<circle cx="855" cy="279" r="13" fill="#FEE2E2" stroke="#C24135" stroke-width="2"/>
<text x="855" y="284" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">x</text>
<text x="883" y="284" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">beyond 1-WL</text>
<circle cx="855" cy="365" r="13" fill="#FEE2E2" stroke="#C24135" stroke-width="2"/>
<text x="855" y="370" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">x</text>
<text x="883" y="370" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">robust to graph noise</text>
<text x="845" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">这些需要额外结构或独立证据。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">GAT 学的是邻域内的相对权重；结构可见性与证据边界仍由图合同决定。</text>
</svg>