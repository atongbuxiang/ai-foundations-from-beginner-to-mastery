<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">二维、多轴与多模态位置：坐标域、轴组合与冲突</title>
<desc id="desc">图像、视频与图文混排同时具有多个坐标轴；编码前必须声明每轴含义、通道分配和跨模态共同坐标。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">不同对象，不同坐标</text>
<rect x="55" y="105" width="100" height="42" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="105.0" y="132.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">text</text>
<text x="175" y="133" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">(sequence)</text>
<rect x="55" y="195" width="100" height="42" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="105.0" y="222.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">image</text>
<text x="175" y="223" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">(row, column)</text>
<rect x="55" y="285" width="100" height="42" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="105.0" y="312.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">video</text>
<text x="175" y="313" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">(time, row, column)</text>
<rect x="55" y="375" width="100" height="42" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="105.0" y="402.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">document</text>
<text x="175" y="403" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">(page, block, line, x/y)</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">轴怎样进入表示</text>
<rect x="445" y="105" width="150" height="46" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="520.0" y="134.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">add</text>
<text x="610" y="134" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">p = pᵣ + p𝚌</text>
<rect x="445" y="205" width="150" height="46" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="520.0" y="234.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">concat/split</text>
<text x="610" y="234" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">channels 分给各轴</text>
<rect x="445" y="305" width="150" height="46" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="520.0" y="334.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">relative bias</text>
<text x="610" y="334" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">b(Δr, Δc, …)</text>
<rect x="445" y="405" width="150" height="46" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="520.0" y="434.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">commuting rotations</text>
<text x="610" y="434" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">R(x,y)=Rₓ(x)Rᵧ(y)</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">图文混排的三层坐标</text>
<rect x="845" y="105" width="280" height="58" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="985" y="140" font-size="15" font-weight="750" text-anchor="middle" fill="#2563EB">global reading order</text>
<rect x="845" y="205" width="280" height="58" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="985" y="240" font-size="15" font-weight="750" text-anchor="middle" fill="#0F766E">modality / segment identity</text>
<rect x="845" y="305" width="280" height="74" rx="6" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="985" y="340" font-size="15" font-weight="750" text-anchor="middle" fill="#B7791F">image row / column</text>
<text x="985" y="363" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">or text line / within-line</text>
<text x="845" y="430" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">轴共享会碰撞；轴完全分离会削弱</text>
<text x="845" y="454" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">跨模态距离。必须用任务验证。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">多轴位置编码首先是坐标建模问题；任何旋转或 bias 公式都必须服从明确的布局与模态语义。</text>
</svg>