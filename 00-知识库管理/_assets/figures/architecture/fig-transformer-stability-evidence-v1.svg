<text x="247" y="98" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">x + F(LN x)</text>
<text x="55" y="195" font-size="15" font-weight="800" text-anchor="start" fill="#0F766E">Post-LN</text>
<rect x="145" y="168" width="205" height="40" rx="5" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="247" y="193" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">LN(x + F(x))</text>
<text x="55" y="290" font-size="15" font-weight="800" text-anchor="start" fill="#B7791F">DeepNorm</text>
