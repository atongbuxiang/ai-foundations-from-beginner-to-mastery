<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">证据等级</text>
<rect x="845" y="85" width="42" height="34" rx="5" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="866" y="108" font-size="15" font-weight="800" text-anchor="middle" fill="#0F766E">I</text>
<text x="900" y="108" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">wiring / shape / exact expansion</text>
<rect x="845" y="165" width="42" height="34" rx="5" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="866" y="188" font-size="15" font-weight="800" text-anchor="middle" fill="#2563EB">T</text>
<text x="900" y="188" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">assumptions + quantified conclusion</text>
<rect x="845" y="245" width="42" height="34" rx="5" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="866" y="268" font-size="15" font-weight="800" text-anchor="middle" fill="#B7791F">E</text>
<text x="900" y="268" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">depth/model/data/kernel version</text>
<rect x="845" y="325" width="42" height="34" rx="5" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="866" y="348" font-size="15" font-weight="800" text-anchor="middle" fill="#C24135">H</text>
<text x="900" y="348" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">mechanism interpretation</text>
<rect x="845" y="405" width="42" height="34" rx="5" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="866" y="428" font-size="15" font-weight="800" text-anchor="middle" fill="#C24135">O</text>
<text x="900" y="428" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">untested scale / task</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">稳定性结论必须说明接线、初始化、深度、优化器和测量对象；前沿方案先作为版本化证据。</text>
