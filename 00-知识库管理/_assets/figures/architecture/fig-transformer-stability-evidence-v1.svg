<text x="485" y="175" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">input Jacobian</text>
<circle cx="465" cy="240" r="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="485" y="245" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">parameter update</text>
