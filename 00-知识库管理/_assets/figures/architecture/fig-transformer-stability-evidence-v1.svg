<text x="247" y="288" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F">LN(αx + Fβ(x))</text>
<text x="55" y="385" font-size="15" font-weight="800" text-anchor="start" fill="#C24135">AttnRes</text>
<rect x="145" y="358" width="205" height="40" rx="5" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="247" y="383" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">depth-attend previous states</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">问题不止梯度爆炸</text>
<circle cx="465" cy="100" r="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="485" y="105" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">forward scale</text>
