<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">下采样：池化、混叠与不变性边界</title>
<desc id="desc">高频信号直接抽取会折叠为错误低频；低通再采样减少混叠但丢失细节；pooling 的局部稳定不等于严格全局不变。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">直接 decimate：高频折叠</text>
<path d="M50.0 250.0L70.0 199.0L90.0 328.6L110.0 179.9L130.0 279.4L150.0 274.7L170.0 182.5L190.0 329.4L210.0 195.2L230.0 255.0L250.0 297.0L270.0 172.5L290.0 322.4L310.0 215.9L330.0 230.1L350.0 314.7L370.0 170.2" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<circle cx="50" cy="250.0" r="5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="90" cy="328.5829800582951" r="5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="130" cy="279.4499642147742" r="5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="170" cy="182.4537659598387" r="5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="210" cy="195.236231525705" r="5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="250" cy="297.0228201833977" r="5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="290" cy="322.38616419728146" r="5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="330" cy="230.10480902681135" r="5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="370" cy="170.1578617257383" r="5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<path d="M50.0 250.0L90.0 328.6L130.0 279.4L170.0 182.5L210.0 195.2L250.0 297.0L290.0 322.4L330.0 230.1L370.0 170.2" fill="none" stroke="#C24135" stroke-width="3" stroke-dasharray="7 5"/>
<text x="45" y="365" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">red samples suggest a false lower frequency</text>
<text x="45" y="420" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">stride S reduces the Nyquist limit by S</text>
<text x="45" y="475" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">抽样前仍含高频 → aliasing。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">low-pass → downsample</text>
<path d="M450.0 250.0L470.0 219.4L490.0 202.9L510.0 207.9L530.0 232.3L550.0 264.8L570.0 290.5L590.0 297.6L610.0 282.9L630.0 253.0L650.0 221.8L670.0 203.5L690.0 206.6L710.0 229.6L730.0 261.9L750.0 288.8L770.0 297.9" fill="none" stroke="#0F766E" stroke-width="3"/>
<circle cx="450" cy="250.0" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="490" cy="202.85021196502294" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="530" cy="232.33002147113544" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="570" cy="290.52774042409675" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="610" cy="282.85826108457707" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="650" cy="221.78630788996128" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="690" cy="206.56830148163107" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="730" cy="261.93711458391306" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="770" cy="297.90528296455705" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="438" y="350" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">blur suppresses frequencies above new Nyquist</text>
<text x="438" y="405" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">benefit: less shift-sensitive sampling</text>
<text x="438" y="448" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">cost: fine detail and sharpness may be lost</text>
<text x="438" y="488" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">filter, padding and task must be audited</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">pooling 不是免费不变</text>
<rect x="842" y="105" width="300" height="72" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="992" y="135" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">local max / average</text>
<text x="992" y="162" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">window summary</text>
<line x1="992" y1="180" x2="992" y2="220" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="842" y="232" width="300" height="72" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="992" y="262" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">stride / decimation</text>
<text x="992" y="289" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">changes sampling lattice</text>
<text x="842" y="360" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">small local perturbation</text>
<text x="1040" y="360" font-size="20" font-weight="700" text-anchor="start" fill="#C24135">≠</text>
<text x="1075" y="360" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">global invariance</text>
<text x="842" y="415" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">anti-aliasing is a signal-processing fix;</text>
<text x="842" y="448" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">accuracy gain is an empirical claim.</text>
<text x="842" y="493" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">report consistency and task metric separately</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">下采样先改变可表示频率，再改变等变关系；不变性必须由读出与任务共同定义。</text>
</svg>