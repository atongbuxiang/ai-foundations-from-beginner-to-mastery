<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">表示与模型架构跨卷复现门</title>
<desc id="desc">对称性、因果/位置与成本/路由三轨必须同时保持对象、恒等式和证据边界。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">结构与重标号</text>
<rect x="55" y="100" width="285" height="55" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="197.5" y="133.5" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">H&#x27;=(A+I)H</text>
<rect x="55" y="220" width="285" height="62" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="197.5" y="257.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">P H&#x27; = (PAPᵀ+I)PH</text>
<rect x="55" y="350" width="285" height="58" rx="8" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="197.5" y="385.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">sum(PH&#x27;) = sum(H&#x27;)</text>
<line x1="198" y1="160" x2="198" y2="212" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="198" y1="286" x2="198" y2="342" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="55" y="465" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">equivariance defect = 0.0e+00</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">因果、缓存与位置</text>
<rect x="455" y="100" width="285" height="55" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="597.5" y="133.5" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">causal full row</text>
<rect x="455" y="220" width="285" height="55" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="597.5" y="253.5" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">incremental KV cache</text>
<line x1="598" y1="160" x2="598" y2="212" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="455" y="325" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">output defect = 0.0e+00</text>
<rect x="455" y="370" width="285" height="52" rx="8" fill="#FFF7ED" stroke="#B7791F" stroke-width="2"/>
<text x="597.5" y="402.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">R(m)ᵀR(n)=R(n−m)</text>
<text x="455" y="465" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">rotation defect = 4.7e-16</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">成本与尾部</text>
<rect x="845" y="105" width="170" height="42" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="930.0" y="132.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">dense/local pairs</text>
<text x="1040" y="132" font-size="16" font-weight="800" text-anchor="start" fill="#2563EB">32×</text>
<rect x="845" y="185" width="170" height="42" rx="8" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="930.0" y="212.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">MHA/GQA cache</text>
<text x="1040" y="212" font-size="16" font-weight="800" text-anchor="start" fill="#0F766E">4×</text>
<rect x="845" y="265" width="170" height="42" rx="8" fill="#F8FAFC" stroke="#B7791F" stroke-width="2"/>
<text x="930.0" y="292.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">MoE network</text>
<text x="1040" y="292" font-size="16" font-weight="800" text-anchor="start" fill="#B7791F">48 MiB</text>
<rect x="845" y="345" width="170" height="42" rx="8" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="930.0" y="372.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">max/mean load</text>
<text x="1040" y="372" font-size="16" font-weight="800" text-anchor="start" fill="#C24135">2.5×</text>
<text x="845" y="435" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">bytes / pairs 是账本；</text>
<text x="845" y="470" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">quality / latency 仍需协议。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">跨架构比较先验证不变量与 shape，再分开模型函数、执行计划、近似误差和硬件结论。</text>
</svg>