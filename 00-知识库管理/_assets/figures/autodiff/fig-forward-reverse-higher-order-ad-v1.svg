<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">自动微分的前向、反向与高阶模式</title>
  <desc id="desc">三面板展示 tangent 前推、cotangent 回拉、HVP 混合模式与 checkpoint 内存权衡。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFF6FF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
    <marker id="right" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker>
    <marker id="left" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M9 0L0 4.5L9 9Z" fill="#7C3AED"/></marker>
    <style>.title{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F172A}.head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#1E3A8A}.txt{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.math{font:15px Georgia,"Times New Roman",serif;fill:#0F172A}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#64748B}.card{fill:#fff;stroke:#CBD5E1;stroke-width:1.3}.blue{fill:#EFF6FF;stroke:#93C5FD}.violet{fill:#F5F3FF;stroke:#C4B5FD}.amber{fill:#FFFBEB;stroke:#FCD34D}.green{fill:#ECFDF5;stroke:#6EE7B7}.fwd{stroke:#2563EB;stroke-width:2;fill:none;marker-end:url(#right)}.rev{stroke:#7C3AED;stroke-width:2;fill:none;marker-start:url(#left)}</style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <text x="40" y="38" class="title">自动微分：传播线性作用，而不是物化所有导数矩阵</text>
  <rect x="28" y="58" width="368" height="342" rx="17" class="card"/><rect x="416" y="58" width="368" height="342" rx="17" class="card"/><rect x="804" y="58" width="368" height="342" rx="17" class="card"/>
  <text x="50" y="88" class="head">A　Forward：primal + tangent 同行</text>
  <circle cx="91" cy="174" r="27" class="blue"/><circle cx="206" cy="174" r="27" class="blue"/><circle cx="321" cy="174" r="27" class="blue"/><text x="82" y="180" class="math">x</text><text x="198" y="180" class="math">v</text><text x="313" y="180" class="math">y</text>
  <path d="M119 166L178 166" class="fwd"/><path d="M234 166L293 166" class="fwd"/>
  <text x="65" y="230" class="math">ẋ</text><text x="181" y="230" class="math">v̇=Dφ[ẋ]</text><text x="297" y="230" class="math">ẏ=Jẋ</text>
  <path d="M96 212L177 212" class="fwd"/><path d="M237 212L293 212" class="fwd"/>
  <rect x="55" y="274" width="314" height="66" rx="11" class="blue"/><text x="75" y="300" class="txt">一次 seed → 一个 Jv</text><text x="75" y="324" class="small">少输入 / 少方向 / 大输出特别合适</text>
  <text x="66" y="379" class="small">通常可流式传播，不需要完整反向 tape</text>
  <text x="438" y="88" class="head">B　Reverse：先记录，再回拉</text>
  <circle cx="478" cy="174" r="27" class="violet"/><circle cx="594" cy="174" r="27" class="violet"/><circle cx="710" cy="174" r="27" class="violet"/><text x="469" y="180" class="math">x</text><text x="586" y="180" class="math">v</text><text x="702" y="180" class="math">L</text>
  <path d="M506 160L566 160" class="fwd"/><path d="M622 160L682 160" class="fwd"/><text x="526" y="143" class="small">primal / residual</text>
  <path d="M506 218L566 218" class="rev"/><path d="M622 218L682 218" class="rev"/><text x="482" y="248" class="math">x̄=JᵀL̄</text><text x="635" y="248" class="math">seed L̄=1</text>
  <rect x="445" y="274" width="310" height="66" rx="11" class="violet"/><text x="466" y="300" class="txt">一个输出 seed → 一个 Jᵀu</text><text x="466" y="324" class="small">标量 loss / 多参数梯度特别合适</text>
  <text x="455" y="379" class="small">fan-out 的 cotangent 在共享父节点相加</text>
  <text x="826" y="88" class="head">C　高阶组合与内存权衡</text>
  <rect x="838" y="111" width="302" height="65" rx="11" class="green"/><text x="860" y="137" class="txt">Forward-over-Reverse</text><text x="860" y="161" class="math">JVP(grad f, v) = Hf v</text>
  <rect x="838" y="202" width="302" height="83" rx="11" class="amber"/><text x="860" y="227" class="txt">Checkpoint / rematerialize</text><text x="860" y="252" class="small">少保存 activation，反向前重算 residual</text><text x="860" y="273" class="small">memory ↓　FLOPs ↑</text>
  <rect x="838" y="311" width="302" height="58" rx="11" class="violet"/><text x="860" y="336" class="txt">custom VJP / implicit solve</text><text x="860" y="358" class="small">必须审计高阶可组合性与求解残差</text>
  <text x="844" y="393" class="small">AD 求执行程序的导数；程序语义必须先明确</text>
</svg>
