<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">自动微分的前向、反向与高阶模式</title>
<desc id="desc">前向模式推送 tangent，反向模式回拉 cotangent；高阶组合和 checkpoint 在计算与内存之间权衡。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Forward：tangent 前推</text>
<rect x="70" y="120" width="72" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="106.0" y="151.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x</text>
<rect x="190" y="120" width="72" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="226.0" y="151.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">v=f(x)</text>
<rect x="310" y="120" width="72" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="346.0" y="151.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">y=g(v)</text>
<line x1="143" y1="145" x2="185" y2="145" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<line x1="263" y1="145" x2="305" y2="145" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<rect x="70" y="250" width="72" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="106.0" y="282.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">xdot</text>
<rect x="190" y="250" width="100" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="240.0" y="282.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">vdot=Jf xdot</text>
<rect x="310" y="250" width="100" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="360.0" y="282.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">ydot=Jg vdot</text>
<line x1="143" y1="276" x2="185" y2="276" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<line x1="291" y1="276" x2="305" y2="276" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="45" y="380" font-size="18" font-weight="700" text-anchor="start" fill="#1F2937">一次输入 seed -&gt; 一个 Jv</text>
<text x="45" y="420" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">适合输入方向少、输出方向多。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Reverse：cotangent 回拉</text>
<rect x="450" y="120" width="70" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="485.0" y="151.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">x</text>
<rect x="570" y="120" width="70" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="605.0" y="151.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">v</text>
<rect x="690" y="120" width="70" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="725.0" y="151.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">L</text>
<line x1="521" y1="145" x2="565" y2="145" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<line x1="641" y1="145" x2="685" y2="145" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<line x1="685" y1="275" x2="642" y2="275" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<line x1="565" y1="275" x2="522" y2="275" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="690" y="260" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">seed Lbar=1</text>
<text x="570" y="310" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">xbar = Jf^T Jg^T</text>
<text x="430" y="380" font-size="18" font-weight="700" text-anchor="start" fill="#1F2937">一个输出 seed -&gt; 一个 J^T u</text>
<text x="430" y="420" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">适合标量损失对海量参数求梯度。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">高阶组合与内存权衡</text>
<rect x="840" y="105" width="300" height="70" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="146.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">forward-over-reverse: H v</text>
<rect x="840" y="215" width="300" height="70" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="990.0" y="256.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">checkpoint: memory down; FLOPs up</text>
<rect x="840" y="325" width="300" height="70" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="366.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">custom VJP / implicit: audit high order</text>
<text x="840" y="445" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">AD 求程序导数；控制流、状态和随机性必须先定义。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">模式选择由输入/输出方向数、内存和所需导数作用决定，而不是由 API 名称决定。</text>
</svg>