<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">函数的类型合同与商映射的良定义性</title>
  <desc id="desc">左栏区分定义域、陪域、像、碰撞与遗漏；右栏展示等价类经商映射压缩后，诱导函数必须与代表元选择无关。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .ink{fill:#1f2937}.muted{fill:#64748b}.line{stroke:#cbd5e1;stroke-width:1.5}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.soft{fill:#f8fafc}.blue{fill:#2563eb}.blue-soft{fill:#eff6ff}.green{fill:#047857}.green-soft{fill:#ecfdf5}.amber{fill:#b45309}.amber-soft{fill:#fffbeb}
      .sans{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.math{font-family:"STIX Two Math","Times New Roman",serif}.h{font-size:18px;font-weight:600}.body{font-size:16px}.small{font-size:15px}.formula{font-size:21px}.result{font-size:19px;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="580" fill="#ffffff"/>
  <rect x="42" y="42" width="532" height="444" rx="12" class="blue-soft" stroke="#bfdbfe"/>
  <rect x="626" y="42" width="532" height="444" rx="12" class="green-soft" stroke="#a7f3d0"/>
  <text x="68" y="80" class="sans h blue">函数先声明从哪里到哪里</text><text x="652" y="80" class="sans h green">商上的函数必须摆脱代表元依赖</text>
  <text x="308" y="119" class="math formula ink" text-anchor="middle">f : X → Y</text>
  <rect x="78" y="145" width="166" height="226" rx="11" fill="#ffffff" stroke="#93c5fd"/>
  <rect x="372" y="145" width="166" height="226" rx="11" fill="#ffffff" stroke="#93c5fd"/>
  <text x="161" y="176" class="sans body ink" text-anchor="middle">定义域 X</text><text x="455" y="176" class="sans body ink" text-anchor="middle">陪域 Y</text>
  <g class="blue"><circle cx="132" cy="219" r="10"/><circle cx="132" cy="270" r="10"/><circle cx="132" cy="321" r="10"/></g>
  <g class="green"><circle cx="426" cy="219" r="10"/><circle cx="426" cy="270" r="10"/></g><circle cx="486" cy="321" r="10" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
  <path d="M144 219 C240 219 330 219 414 219" class="arrow"/><path d="M144 270 C240 270 330 270 414 270" class="arrow"/><path d="M144 321 C240 321 330 279 414 271" class="arrow"/>
  <text x="308" y="401" class="sans small muted" text-anchor="middle">两个输入到同一输出：碰撞 ⇒ 非单射</text>
  <text x="308" y="430" class="sans small amber" text-anchor="middle">陪域中存在未命中元素：遗漏 ⇒ 非满射</text>
  <text x="308" y="462" class="math body blue" text-anchor="middle">preimage f⁻¹(B) 总有定义；inverse function 需双射</text>

  <rect x="662" y="137" width="190" height="244" rx="11" fill="#ffffff" stroke="#6ee7b7"/>
  <rect x="932" y="137" width="190" height="244" rx="11" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="757" y="170" class="math body ink" text-anchor="middle">X 中的等价类</text><text x="1027" y="170" class="math body ink" text-anchor="middle">商集 X／∼</text>
  <ellipse cx="757" cy="225" rx="61" ry="30" class="blue-soft" stroke="#2563eb" stroke-width="2"/>
  <ellipse cx="724" cy="310" rx="42" ry="25" class="amber-soft" stroke="#b45309" stroke-width="2"/><ellipse cx="798" cy="310" rx="42" ry="25" class="amber-soft" stroke="#b45309" stroke-width="2"/>
  <g class="math body ink" text-anchor="middle"><text x="757" y="231">a ∼ a′</text><text x="724" y="316">b</text><text x="798" y="316">c</text></g>
  <g class="green"><circle cx="1000" cy="225" r="15"/><circle cx="983" cy="310" r="13"/><circle cx="1055" cy="310" r="13"/></g>
  <path d="M852 260 L920 260" class="arrow"/><text x="886" y="246" class="math body green" text-anchor="middle">π</text>
  <rect x="687" y="404" width="410" height="58" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="892" y="428" class="math body ink" text-anchor="middle">F(⟦x⟧) = Φ(x)</text>
  <text x="892" y="451" class="sans small green" text-anchor="middle">若 x∼x′，必须有 Φ(x)=Φ(x′)</text>
  <rect x="92" y="516" width="1016" height="44" rx="10" class="soft" stroke="#cbd5e1"/>
  <text x="600" y="544" class="sans result ink" text-anchor="middle">“可调用”“可逆”“可在商上定义”是三种不同承诺，不能混写。</text>
</svg>
