<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Big O 的尾部包络与复杂度资源账本</title>
  <desc id="desc">左栏用曲线显示常数倍比较函数只需在阈值以后控制目标函数，右栏展示复杂度声明必须同时登记输入表示、渐近变量、资源与计算口径。</desc>
  <defs>
    <style>
      .ink{fill:#1f2937}.muted{fill:#64748b}.line{stroke:#cbd5e1;stroke-width:1.5}.axis{stroke:#475569;stroke-width:2}.soft{fill:#f8fafc}.blue{fill:#2563eb}.blue-soft{fill:#eff6ff}.green{fill:#047857}.green-soft{fill:#ecfdf5}.amber{fill:#b45309}.amber-soft{fill:#fffbeb}
      .sans{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.math{font-family:"STIX Two Math","Times New Roman",serif}.h{font-size:18px;font-weight:600}.body{font-size:16px}.small{font-size:15px}.formula{font-size:20px}.result{font-size:19px;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="580" fill="#ffffff"/>
  <rect x="42" y="42" width="580" height="430" rx="12" class="soft" stroke="#cbd5e1"/>
  <rect x="666" y="42" width="492" height="430" rx="12" class="green-soft" stroke="#a7f3d0"/>
  <text x="68" y="80" class="sans h blue">Big O 是尾部上的统一常数包络</text><text x="692" y="80" class="sans h green">复杂度是资源向量，不是一个孤立次数</text>
  <line x1="92" y1="376" x2="584" y2="376" class="axis"/><line x1="92" y1="112" x2="92" y2="376" class="axis"/>
  <path d="M92 351 C160 337 205 308 250 273 C313 224 388 167 584 108" fill="none" stroke="#047857" stroke-width="3.5"/>
  <path d="M92 361 C159 353 215 329 266 300 C340 258 427 212 584 175" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  <line x1="238" y1="112" x2="238" y2="376" stroke="#b45309" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="248" y="134" class="math body amber">n₀</text>
  <text x="536" y="113" class="math body green">C·g(n)</text><text x="536" y="200" class="math body blue">|f(n)|</text>
  <text x="338" y="416" class="math formula ink" text-anchor="middle">∃C&gt;0　∃n₀　∀n≥n₀：|f(n)|≤C|g(n)|</text>
  <text x="338" y="448" class="sans small muted" text-anchor="middle">有限个早期交叉点不影响结论；C 不能随 n 改变</text>

  <g class="sans body ink"><text x="696" y="126">渐近变量</text><text x="696" y="184">输入表示</text><text x="696" y="242">资源</text><text x="696" y="300">口径</text><text x="696" y="358">实现条件</text></g>
  <g class="sans body blue"><text x="820" y="126">T、d、B、精度 ε 中谁趋于何处？</text><text x="820" y="184">shape、encoding、dense / sparse</text><text x="820" y="242">work、memory、I/O、communication、span</text><text x="820" y="300">worst、average、expected、amortized</text><text x="820" y="358">hardware、fusion、bandwidth、parallelism</text></g>
  <line x1="686" y1="148" x2="1138" y2="148" class="line"/><line x1="686" y1="206" x2="1138" y2="206" class="line"/><line x1="686" y1="264" x2="1138" y2="264" class="line"/><line x1="686" y1="322" x2="1138" y2="322" class="line"/>
  <rect x="696" y="388" width="432" height="55" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="912" y="412" class="math body green" text-anchor="middle">Attention work: Θ(BT²d + BTd²)</text>
  <text x="912" y="434" class="sans small muted" text-anchor="middle">无条件简称“Θ(T²)”会隐藏其他主导维度</text>
  <rect x="92" y="506" width="1016" height="42" rx="10" class="blue-soft"/>
  <text x="600" y="533" class="sans result ink" text-anchor="middle">先写量词合同，再从真实计算图分账；渐近阶、操作数与 wall-clock 不是同一对象。</text>
</svg>
