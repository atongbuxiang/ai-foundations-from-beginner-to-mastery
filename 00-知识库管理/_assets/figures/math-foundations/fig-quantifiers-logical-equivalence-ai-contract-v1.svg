<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">命题、量词、作用域与 AI 理论声明</title>
  <desc id="desc">三面板展示命题的真值条件、量词否定和换序，以及泛化、鲁棒性与随机种子声明中的量词合同。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071527"/><stop offset="1" stop-color="#10263e"/></linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173754"/><stop offset="1" stop-color="#102a43"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173d3b"/><stop offset="1" stop-color="#102f31"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#372d58"/><stop offset="1" stop-color="#282442"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#66c7ff"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#70e0bf"/></marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#f5f9ff}.sub{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#a9bfd4}.head{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#f8fbff}.body{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#dceaf7}.small{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#b8cada}.tiny{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#aebfd0}.math{font:500 17px Georgia,"Times New Roman",serif;fill:#f6fbff}.tag{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.7px}.mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dceaf7}
    </style>
  </defs>
  <rect width="1440" height="760" fill="url(#bg)"/>
  <circle cx="1290" cy="60" r="250" fill="#547ec7" opacity=".08"/><circle cx="120" cy="730" r="280" fill="#27a98b" opacity=".07"/>
  <text x="70" y="59" class="title">先确定作用域与量词顺序，再判断理论声明</text>
  <text x="70" y="88" class="sub">truth condition、witness dependency、randomness 与 adversary 必须写在同一个可审计合同中</text>

  <g filter="url(#shadow)"><rect x="55" y="125" width="410" height="535" rx="24" fill="url(#p1)" stroke="#427ca6"/><rect x="515" y="125" width="410" height="535" rx="24" fill="url(#p2)" stroke="#438b7c"/><rect x="975" y="125" width="410" height="535" rx="24" fill="url(#p3)" stroke="#7b6cad"/></g>

  <rect x="80" y="148" width="132" height="27" rx="13" fill="#13324d" stroke="#66c7ff"/><text x="146" y="166" text-anchor="middle" class="tag" fill="#7bd2ff">PROPOSITION</text>
  <text x="80" y="207" class="head">① 先把 claim 变成真值条件</text>
  <text x="80" y="240" class="body">Predicate 绑定变量后才成为 closed proposition</text>

  <rect x="91" y="269" width="345" height="66" rx="14" fill="#0d263d" stroke="#4e91ba"/>
  <text x="111" y="295" class="math">P(x):  x² ≥ 0</text><text x="111" y="320" class="small">x free → predicate；∀x∈ℝ P(x) → proposition</text>

  <text x="93" y="372" class="body">Material implication</text>
  <rect x="92" y="389" width="344" height="105" rx="13" fill="#0c2338" stroke="#4e91ba"/>
  <text x="118" y="417" class="mono">P   Q   P ⇒ Q</text>
  <text x="118" y="442" class="mono">T   T      T</text><text x="270" y="442" class="mono">T   F      F</text>
  <text x="118" y="467" class="mono">F   T      T</text><text x="270" y="467" class="mono">F   F      T</text>
  <text x="264" y="520" text-anchor="middle" class="math">P ⇒ Q  ≡  ¬P ∨ Q</text>
  <text x="264" y="548" text-anchor="middle" class="small">只禁止 P ∧ ¬Q；不自动表示因果或时间</text>
  <rect x="92" y="574" width="344" height="66" rx="11" fill="#0a2033"/>
  <text x="264" y="600" text-anchor="middle" class="body">Contrapositive：¬Q ⇒ ¬P</text>
  <text x="264" y="625" text-anchor="middle" class="small" fill="#7bd2ff">Converse Q ⇒ P 一般不等价</text>

  <rect x="540" y="148" width="112" height="27" rx="13" fill="#123630" stroke="#70e0bf"/><text x="596" y="166" text-anchor="middle" class="tag" fill="#82e9cb">SCOPE</text>
  <text x="540" y="207" class="head">② 顺序决定谁能依赖谁</text>
  <text x="540" y="240" class="body">每个 x 各有 witness，不等于一个 witness 服务全部 x</text>

  <rect x="546" y="270" width="352" height="78" rx="14" fill="#0b2929" stroke="#53ad98"/>
  <text x="722" y="301" text-anchor="middle" class="math">∀x ∃y  P(x,y)</text>
  <text x="722" y="329" text-anchor="middle" class="small">先见 x，再选 y=f(x)：允许 adaptive witness</text>
  <path d="M722 352 L722 383" stroke="#70e0bf" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="546" y="392" width="352" height="78" rx="14" fill="#0b2929" stroke="#53ad98"/>
  <text x="722" y="423" text-anchor="middle" class="math">∃y ∀x  P(x,y)</text>
  <text x="722" y="451" text-anchor="middle" class="small">先固定 y：必须是 global witness，通常更强</text>

  <rect x="547" y="495" width="350" height="103" rx="14" fill="#102f31"/>
  <text x="722" y="522" text-anchor="middle" class="body">Negation 逐层翻转量词</text>
  <text x="722" y="551" text-anchor="middle" class="math">¬∀x∃y P(x,y)</text>
  <text x="722" y="578" text-anchor="middle" class="math">≡ ∃x∀y ¬P(x,y)</text>
  <rect x="547" y="610" width="350" height="32" rx="9" fill="#0b2929"/><text x="722" y="631" text-anchor="middle" class="small" fill="#82e9cb">反例：找一个 x，使所有 y 都失败</text>

  <rect x="1000" y="148" width="112" height="27" rx="13" fill="#2c2645" stroke="#b29cff"/><text x="1056" y="166" text-anchor="middle" class="tag" fill="#c5b2ff">AI CLAIM</text>
  <text x="1000" y="207" class="head">③ 量词换序会改变保证强度</text>
  <text x="1000" y="240" class="body">Fixed、uniform、randomized 与 robust 不能混报</text>

  <rect x="1001" y="270" width="357" height="94" rx="14" fill="#24213c" stroke="#8a78c2"/>
  <text x="1021" y="298" class="small">Fixed hypothesis（每个 h 各有 bad samples）</text>
  <text x="1179" y="326" text-anchor="middle" class="mono">∀h:  P_S[E(S,h)] ≥ 1−δ</text>
  <text x="1179" y="351" text-anchor="middle" class="tiny">不能自动代入由 S 选择的 ĥ(S)</text>

  <rect x="1001" y="382" width="357" height="94" rx="14" fill="#24213c" stroke="#8a78c2"/>
  <text x="1021" y="410" class="small">Uniform class（同一个 good event 控制所有 h）</text>
  <text x="1179" y="438" text-anchor="middle" class="mono">P_S[∀h E(S,h)] ≥ 1−δ</text>
  <text x="1179" y="463" text-anchor="middle" class="tiny">Data-dependent selection 需要这一层或替代论证</text>

  <rect x="1001" y="494" width="357" height="116" rx="14" fill="#211e38" stroke="#8a78c2"/>
  <text x="1020" y="521" class="small">Robust failure：∃ perturbation 使 prediction 改变</text>
  <text x="1020" y="549" class="small">Seed audit：∀D∃s  ≠  ∃s∀D</text>
  <text x="1020" y="577" class="small">Convergence：∀ε∃N∀n≥N</text>
  <text x="1020" y="600" class="tiny">还要声明 N 是否依赖 x / path / model / δ</text>
  <rect x="1001" y="620" width="357" height="22" rx="8" fill="#2c2547"/><text x="1179" y="636" text-anchor="middle" class="small" fill="#c5b2ff">高概率不是“差不多为真”；要写随机源</text>

  <path d="M472 392 L504 392" stroke="#66c7ff" stroke-width="3" marker-end="url(#ab)"/><path d="M932 392 L964 392" stroke="#70e0bf" stroke-width="3" marker-end="url(#ag)"/>
  <rect x="205" y="689" width="1030" height="42" rx="21" fill="#0b1d30" stroke="#385b76"/><text x="720" y="716" text-anchor="middle" class="body">审计规则：写出完整 quantifier prefix，再把 negation 推到底；失败证书的对象结构会自动显现。</text>
</svg>
