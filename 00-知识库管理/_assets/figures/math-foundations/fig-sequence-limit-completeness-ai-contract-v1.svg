<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">数列、极限、Cauchy、完备性与 AI 迭代接口</title>
  <desc id="desc">三面板展示 epsilon-N 尾部合同、从 Cauchy 内部一致性到完备空间中极限存在，以及优化迭代、函数逼近和浮点停滞中的 AI 与数值边界。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071527"/><stop offset="1" stop-color="#10263e"/></linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173754"/><stop offset="1" stop-color="#102a43"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173d3b"/><stop offset="1" stop-color="#102f31"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#372d58"/><stop offset="1" stop-color="#282442"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#66c7ff"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#70e0bf"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b29cff"/></marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#f5f9ff}.sub{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#a9bfd4}.head{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#f8fbff}.body{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#dceaf7}.small{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#b8cada}.tiny{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#aebfd0}.math{font:500 17px Georgia,"Times New Roman",serif;fill:#f6fbff}.tag{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.7px}.mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dceaf7}
    </style>
  </defs>
  <rect width="1440" height="760" fill="url(#bg)"/>
  <circle cx="1290" cy="60" r="250" fill="#547ec7" opacity=".08"/><circle cx="120" cy="730" r="280" fill="#27a98b" opacity=".07"/>
  <text x="70" y="59" class="title">极限控制整个尾部；完备性保证候选不会掉出空间</text>
  <text x="70" y="88" class="sub">sequence as ℕ → X / ε–N witness → Cauchy tail → completeness → iteration, approximation, and finite precision</text>

  <g filter="url(#shadow)"><rect x="55" y="125" width="410" height="535" rx="24" fill="url(#p1)" stroke="#427ca6"/><rect x="515" y="125" width="410" height="535" rx="24" fill="url(#p2)" stroke="#438b7c"/><rect x="975" y="125" width="410" height="535" rx="24" fill="url(#p3)" stroke="#7b6cad"/></g>

  <rect x="80" y="148" width="124" height="27" rx="13" fill="#13324d" stroke="#66c7ff"/><text x="142" y="166" text-anchor="middle" class="tag" fill="#7bd2ff">TAIL CONTRACT</text>
  <text x="80" y="207" class="head">① 先把“越来越近”量词化</text>
  <text x="80" y="240" class="body">对手先给精度；证明者再给统一尾部起点</text>
  <rect x="85" y="271" width="345" height="104" rx="14" fill="#0d263d" stroke="#4e91ba"/>
  <text x="106" y="302" class="math">∀ ε &gt; 0　∃ N　∀ n ≥ N</text>
  <text x="106" y="334" class="math">d(x_n, x) &lt; ε</text>
  <text x="106" y="361" class="tiny">N 可依赖 ε；不能依赖未来的 n；有限前缀无关</text>
  <rect x="85" y="394" width="345" height="98" rx="14" fill="#0c2338" stroke="#4e91ba"/>
  <text x="106" y="424" class="small">Negation / divergence witness</text>
  <text x="106" y="455" class="math">∃ ε_0 &gt; 0　∀ N　∃ n ≥ N</text>
  <text x="106" y="481" class="tiny">每个尾部都能找到一次失败；不是“永远很远”</text>
  <rect x="85" y="511" width="345" height="110" rx="14" fill="#0c2338" stroke="#4e91ba"/>
  <text x="106" y="540" class="small">Proof design</text>
  <text x="106" y="568" class="small">先从 d(x_n,x)&lt;ε 倒推 N(ε)</text>
  <text x="106" y="596" class="tiny">再从“给定 ε”正向验证；极限 ≠ 有限项很小</text>

  <rect x="540" y="148" width="143" height="27" rx="13" fill="#123630" stroke="#70e0bf"/><text x="611" y="166" text-anchor="middle" class="tag" fill="#82e9cb">COMPLETENESS</text>
  <text x="540" y="207" class="head">② 不知道极限时比较尾部自身</text>
  <text x="540" y="240" class="body">Cauchy 是内部一致性；complete 是不丢极限</text>
  <rect x="545" y="270" width="350" height="95" rx="14" fill="#102f31" stroke="#53ad98"/>
  <text x="565" y="300" class="small">Cauchy sequence</text>
  <text x="565" y="331" class="math">∀ ε &gt; 0　∃ N　∀ m,n ≥ N</text>
  <text x="565" y="354" class="tiny">d(x_m,x_n)&lt;ε：不需要预先知道候选极限</text>
  <path d="M720 371 L720 399" stroke="#70e0bf" stroke-width="3" marker-end="url(#ag)"/>
  <rect x="545" y="407" width="350" height="91" rx="14" fill="#102f31" stroke="#53ad98"/>
  <text x="565" y="437" class="small">Complete metric space</text>
  <text x="565" y="468" class="math">Cauchy in X　⇒　limit exists in X</text>
  <text x="565" y="491" class="tiny">ℝ 完备；ℚ 中逼近 √2 的有理 Cauchy 列无有理极限</text>
  <path d="M720 504 L720 530" stroke="#70e0bf" stroke-width="3" marker-end="url(#ag)"/>
  <rect x="545" y="538" width="350" height="83" rx="14" fill="#102f31" stroke="#53ad98"/>
  <text x="565" y="568" class="small">Existence engines in ℝ</text>
  <text x="565" y="597" class="small">monotone + bounded / compact subsequence / Cauchy</text>
  <text x="565" y="616" class="tiny">三条路线共享实数完备性，但证明义务不同</text>

  <rect x="1000" y="148" width="126" height="27" rx="13" fill="#2c2645" stroke="#b29cff"/><text x="1063" y="166" text-anchor="middle" class="tag" fill="#c5b2ff">AI / NUMERICS</text>
  <text x="1000" y="207" class="head">③ 迁移时分清四张账</text>
  <text x="1000" y="240" class="body">对象、模式、速度与计算停止不能混写</text>
  <rect x="1001" y="269" width="357" height="91" rx="14" fill="#24213c" stroke="#8a78c2"/>
  <text x="1021" y="298" class="small">Optimization / fixed point</text>
  <text x="1021" y="327" class="math">|e_(k+1)| ≤ q |e_k|,　q&lt;1</text>
  <text x="1021" y="351" class="tiny">先证迭代留在完备空间，再证 Cauchy 与极限是 fixed point</text>
  <rect x="1001" y="376" width="357" height="109" rx="14" fill="#24213c" stroke="#8a78c2"/>
  <text x="1021" y="405" class="small">Function approximation</text>
  <text x="1021" y="434" class="math">pointwise: ∀x ∃Nₓ　≠　uniform: ∃N ∀x</text>
  <text x="1021" y="462" class="tiny">x^n 在 [0,1] 逐点收敛却不一致；换极限必须补条件</text>
  <rect x="1001" y="501" width="357" height="120" rx="14" fill="#211e38" stroke="#8a78c2"/>
  <text x="1021" y="530" class="small">Finite precision</text>
  <text x="1021" y="559" class="math">exact error &gt; 0　but　float(x_n)=float(x*)</text>
  <text x="1021" y="587" class="small">plateau / tolerance / iteration cap / NaN</text>
  <text x="1021" y="610" class="tiny">“程序不再变化”既不等于数学收敛，也不等于目标已优化</text>

  <path d="M472 392 L504 392" stroke="#66c7ff" stroke-width="3" marker-end="url(#ab)"/><path d="M932 392 L964 392" stroke="#70e0bf" stroke-width="3" marker-end="url(#ag)"/>
  <rect x="150" y="689" width="1140" height="42" rx="21" fill="#0b1d30" stroke="#385b76"/><text x="720" y="716" text-anchor="middle" class="body">闭环：写清收敛对象与量词 → 构造 ε–N 或 Cauchy 证书 → 调用完备性关闭存在性 → 单独报告速度、交换极限条件与浮点停止。</text>
</svg>
