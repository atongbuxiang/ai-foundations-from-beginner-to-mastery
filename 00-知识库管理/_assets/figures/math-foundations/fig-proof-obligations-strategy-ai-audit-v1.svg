<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">证明义务、策略选择与 AI 定理审计</title>
  <desc id="desc">三面板展示命题形状如何产生证明义务，直接证明、逆否、反证、分类、构造和反例如何选择，以及 AI 理论声明如何核对假设、随机性与经验边界。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071527"/><stop offset="1" stop-color="#10263e"/></linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173754"/><stop offset="1" stop-color="#102a43"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173d3b"/><stop offset="1" stop-color="#102f31"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#372d58"/><stop offset="1" stop-color="#282442"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#66c7ff"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#70e0bf"/></marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#f5f9ff}.sub{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#a9bfd4}.head{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#f8fbff}.body{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#dceaf7}.small{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#b8cada}.tiny{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#aebfd0}.math{font:500 17px Georgia,"Times New Roman",serif;fill:#f6fbff}.tag{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.7px}.mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dceaf7}
    </style>
  </defs>
  <rect width="1440" height="760" fill="url(#bg)"/>
  <circle cx="1290" cy="60" r="250" fill="#547ec7" opacity=".08"/><circle cx="120" cy="730" r="280" fill="#27a98b" opacity=".07"/>
  <text x="70" y="59" class="title">先拆证明义务，再选择证明方法</text>
  <text x="70" y="88" class="sub">statement shape、legal inference、assumption ledger 与 closure 组成一份可审计 proof contract</text>

  <g filter="url(#shadow)"><rect x="55" y="125" width="410" height="535" rx="24" fill="url(#p1)" stroke="#427ca6"/><rect x="515" y="125" width="410" height="535" rx="24" fill="url(#p2)" stroke="#438b7c"/><rect x="975" y="125" width="410" height="535" rx="24" fill="url(#p3)" stroke="#7b6cad"/></g>

  <rect x="80" y="148" width="126" height="27" rx="13" fill="#13324d" stroke="#66c7ff"/><text x="143" y="166" text-anchor="middle" class="tag" fill="#7bd2ff">OBLIGATION</text>
  <text x="80" y="207" class="head">① Claim 形状决定要交什么</text>
  <text x="80" y="240" class="body">不要先想技巧；先把目标拆成可逐项关闭的任务</text>

  <rect x="91" y="269" width="345" height="78" rx="14" fill="#0d263d" stroke="#4e91ba"/>
  <text x="111" y="297" class="math">H ⇒ C</text><text x="111" y="324" class="small">固定任意对象；假设 H；目标是 C</text>
  <rect x="91" y="362" width="345" height="88" rx="14" fill="#0c2338" stroke="#4e91ba"/>
  <text x="111" y="391" class="math">A ⇔ B</text><text x="111" y="417" class="small">A ⇒ B 与 B ⇒ A：两个方向分别关闭</text>
  <rect x="91" y="465" width="345" height="102" rx="14" fill="#0c2338" stroke="#4e91ba"/>
  <text x="111" y="494" class="math">∃! y  P(y)</text><text x="111" y="521" class="small">Existence：构造或证明至少一个</text><text x="111" y="546" class="small">Uniqueness：任取两个解，证明相等</text>
  <rect x="92" y="584" width="344" height="56" rx="11" fill="#0a2033"/>
  <text x="264" y="608" text-anchor="middle" class="body">Universal disproof：一个合法反例</text>
  <text x="264" y="631" text-anchor="middle" class="tiny">反例必须满足 domain 与其余 hypotheses</text>

  <rect x="540" y="148" width="112" height="27" rx="13" fill="#123630" stroke="#70e0bf"/><text x="596" y="166" text-anchor="middle" class="tag" fill="#82e9cb">STRATEGY</text>
  <text x="540" y="207" class="head">② 选择更可操作的入口</text>
  <text x="540" y="240" class="body">方法可组合；合法性来自等价变换与逐步推理</text>

  <rect x="546" y="270" width="352" height="68" rx="14" fill="#0b2929" stroke="#53ad98"/>
  <text x="722" y="298" text-anchor="middle" class="math">Direct：H  →  definitions/lemmas  →  C</text>
  <text x="722" y="323" text-anchor="middle" class="tiny">结论形状可被前向计算或结构分解时优先</text>
  <path d="M722 342 L722 367" stroke="#70e0bf" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="546" y="376" width="352" height="91" rx="14" fill="#0b2929" stroke="#53ad98"/>
  <text x="566" y="404" class="small">Contrapositive：¬C → ¬H</text>
  <text x="566" y="432" class="small">Contradiction：assume ¬claim → ⊥</text>
  <text x="566" y="455" class="tiny">逆否适合 implication；反证适合否定后结构更强</text>
  <rect x="547" y="484" width="350" height="104" rx="14" fill="#102f31"/>
  <text x="566" y="512" class="small">Cases：覆盖全部可能；不强求互斥</text>
  <text x="566" y="540" class="small">Construction：给 witness 并逐项验收</text>
  <text x="566" y="568" class="small">Counterexample：命中 H ∧ ¬C</text>
  <rect x="547" y="610" width="350" height="32" rx="9" fill="#0b2929"/><text x="722" y="631" text-anchor="middle" class="small" fill="#82e9cb">终点必须回到原 claim，不是邻近命题</text>

  <rect x="1000" y="148" width="112" height="27" rx="13" fill="#2c2645" stroke="#b29cff"/><text x="1056" y="166" text-anchor="middle" class="tag" fill="#c5b2ff">AI AUDIT</text>
  <text x="1000" y="207" class="head">③ 条件定理不能被实验偷换</text>
  <text x="1000" y="240" class="body">核对对象、假设、随机性、结论强度与失败证书</text>

  <rect x="1001" y="270" width="357" height="112" rx="14" fill="#24213c" stroke="#8a78c2"/>
  <text x="1021" y="298" class="small">Scalar quadratic gradient descent</text>
  <text x="1179" y="326" text-anchor="middle" class="mono">θ[k+1] = (1−ηa) θ[k]</text>
  <text x="1179" y="353" text-anchor="middle" class="mono">0 &lt; ηa &lt; 2  ⇒  θ[k] → 0</text>
  <text x="1179" y="375" text-anchor="middle" class="tiny">边界 ηa=0 停滞；ηa=2 振荡；ηa&gt;2 发散</text>

  <rect x="1001" y="398" width="357" height="90" rx="14" fill="#24213c" stroke="#8a78c2"/>
  <text x="1021" y="426" class="small">Assumption ledger</text>
  <text x="1021" y="452" class="tiny">哪一步用了 curvature / step / initialization？</text>
  <text x="1021" y="475" class="tiny">Proof中使用 ≠ 逻辑上已证明“必要”</text>

  <rect x="1001" y="504" width="357" height="106" rx="14" fill="#211e38" stroke="#8a78c2"/>
  <text x="1020" y="532" class="small">High probability：先定义 good event</text>
  <text x="1020" y="558" class="small">Experiment：只支持测试过的settings</text>
  <text x="1020" y="584" class="small">Heuristic：不能伪装成 implication</text>
  <rect x="1001" y="620" width="357" height="22" rx="8" fill="#2c2547"/><text x="1179" y="636" text-anchor="middle" class="small" fill="#c5b2ff">复用定理前逐项匹配 hypotheses</text>

  <path d="M472 392 L504 392" stroke="#66c7ff" stroke-width="3" marker-end="url(#ab)"/><path d="M932 392 L964 392" stroke="#70e0bf" stroke-width="3" marker-end="url(#ag)"/>
  <rect x="205" y="689" width="1030" height="42" rx="21" fill="#0b1d30" stroke="#385b76"/><text x="720" y="716" text-anchor="middle" class="body">审计规则：每个 proof step 标注依据；每个 assumption 标注调用点；最后一句精确关闭原始 obligation。</text>
</svg>
