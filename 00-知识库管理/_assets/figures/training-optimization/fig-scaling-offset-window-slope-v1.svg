<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Power-law offset, finite window and local slope</title>
  <desc id="desc">Three textbook panels contrast raw loss with an irreducible floor, excess-loss log scaling, and a held-out-scale audit.</desc>
  <rect width="1200" height="800" fill="#FFFEFB"/>
  <text x="60" y="60" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172033">Scaling fit: first subtract the right object, then estimate the slope</text>
  <text x="60" y="94" font-family="Arial,sans-serif" font-size="17" fill="#52606D">The same fixed exponent can look curved on a raw log-log plot when the irreducible term is visible.</text>
  <rect x="50" y="125" width="345" height="585" rx="18" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
  <rect x="427" y="125" width="345" height="585" rx="18" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
  <rect x="804" y="125" width="346" height="585" rx="18" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
  <text x="75" y="165" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172033">A  Raw loss L(x)</text>
  <line x1="95" y1="625" x2="355" y2="625" stroke="#52606D" stroke-width="2"/>
  <line x1="95" y1="625" x2="95" y2="205" stroke="#52606D" stroke-width="2"/>
  <rect x="190" y="205" width="95" height="420" fill="#2563EB" opacity="0.08"/>
  <text x="238" y="600" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#2563EB">calibration window</text>
  <line x1="95" y1="545" x2="355" y2="545" stroke="#C0392B" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="345" y="535" font-family="Arial,sans-serif" font-size="16" text-anchor="end" fill="#C0392B">floor E</text>
  <polyline points="110,245 145,330 185,405 230,465 280,505 335,528" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <text x="112" y="225" font-family="Arial,sans-serif" font-size="16" fill="#2563EB">L = E + A x^-alpha</text>
  <text x="225" y="670" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#52606D">log scale x</text>
  <text x="52" y="420" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" transform="rotate(-90 52 420)" fill="#52606D">log raw loss</text>
  <text x="452" y="165" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172033">B  Excess loss L-E</text>
  <line x1="472" y1="625" x2="732" y2="625" stroke="#52606D" stroke-width="2"/>
  <line x1="472" y1="625" x2="472" y2="205" stroke="#52606D" stroke-width="2"/>
  <polyline points="490,245 545,320 600,395 655,470 715,552" fill="none" stroke="#0F766E" stroke-width="5" stroke-linecap="round"/>
  <circle cx="490" cy="245" r="6" fill="#0F766E"/><circle cx="545" cy="320" r="6" fill="#0F766E"/>
  <circle cx="600" cy="395" r="6" fill="#0F766E"/><circle cx="655" cy="470" r="6" fill="#0F766E"/>
  <circle cx="715" cy="552" r="8" fill="#B76E00"/>
  <text x="498" y="225" font-family="Arial,sans-serif" font-size="16" fill="#0F766E">slope = -alpha</text>
  <text x="715" y="580" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#B76E00">held-out scale</text>
  <text x="602" y="670" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#52606D">log x</text>
  <text x="428" y="420" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" transform="rotate(-90 428 420)" fill="#52606D">log(L-E)</text>
  <text x="829" y="165" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172033">C  Audit before extrapolation</text>
  <rect x="842" y="205" width="270" height="70" rx="12" fill="#EAF1FF" stroke="#2563EB" stroke-width="2"/>
  <text x="977" y="235" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#2563EB">1  Declare x, L and units</text>
  <text x="977" y="258" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">parameter? token? FLOPs?</text>
  <line x1="977" y1="275" x2="977" y2="305" stroke="#52606D" stroke-width="2"/>
  <rect x="842" y="305" width="270" height="70" rx="12" fill="#E9F7F4" stroke="#0F766E" stroke-width="2"/>
  <text x="977" y="335" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#0F766E">2  Fit offset + alternatives</text>
  <text x="977" y="358" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">match the error model</text>
  <line x1="977" y1="375" x2="977" y2="405" stroke="#52606D" stroke-width="2"/>
  <rect x="842" y="405" width="270" height="70" rx="12" fill="#FFF4DE" stroke="#B76E00" stroke-width="2"/>
  <text x="977" y="435" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#B76E00">3  Inspect local slope</text>
  <text x="977" y="458" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">offset? correction? break?</text>
  <line x1="977" y1="475" x2="977" y2="505" stroke="#52606D" stroke-width="2"/>
  <rect x="842" y="505" width="270" height="80" rx="12" fill="#FBECEC" stroke="#C0392B" stroke-width="2"/>
  <text x="977" y="535" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#C0392B">4  Test one held-out scale</text>
  <text x="977" y="560" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">prediction interval + error</text>
  <text x="977" y="635" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#172033">No held-out scale?</text>
  <text x="977" y="660" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#C0392B">Say “within-window fit”.</text>
  <text x="600" y="758" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#52606D">Textbook schematic — offset and window choice can mimic exponent drift.</text>
</svg>
