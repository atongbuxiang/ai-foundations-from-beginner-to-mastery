<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Joint parameter-data surface and three bottlenecks</title>
  <desc id="desc">A textbook diagram separates model, data, and optimization bottlenecks and shows why a two-dimensional grid is needed to identify a joint scaling surface.</desc>
  <rect width="1200" height="800" fill="#FFFEFB"/>
  <text x="60" y="60" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172033">A scaling point is a mixture of capacity, data and optimization gaps</text>
  <text x="60" y="94" font-family="Arial,sans-serif" font-size="17" fill="#52606D">One diagonal path can predict along itself while leaving the joint N–D surface unidentified.</text>
  <rect x="50" y="125" width="470" height="585" rx="18" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
  <rect x="550" y="125" width="600" height="585" rx="18" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
  <text x="75" y="165" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172033">A  Three one-dimensional slices</text>
  <text x="82" y="210" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#2563EB">Parameter-limited</text>
  <line x1="82" y1="300" x2="480" y2="300" stroke="#D9E0E7" stroke-width="2"/>
  <polyline points="95,245 160,260 230,277 310,289 455,296" fill="none" stroke="#2563EB" stroke-width="5"/>
  <text x="95" y="326" font-family="Arial,sans-serif" font-size="15" fill="#52606D">increase N; D and optimization sufficient</text>
  <text x="82" y="370" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#0F766E">Data-limited</text>
  <line x1="82" y1="460" x2="480" y2="460" stroke="#D9E0E7" stroke-width="2"/>
  <polyline points="95,405 160,420 230,438 310,451 455,457" fill="none" stroke="#0F766E" stroke-width="5"/>
  <text x="95" y="486" font-family="Arial,sans-serif" font-size="15" fill="#52606D">increase D; N and optimization sufficient</text>
  <text x="82" y="530" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#B76E00">Optimization-limited</text>
  <line x1="82" y1="620" x2="480" y2="620" stroke="#D9E0E7" stroke-width="2"/>
  <polyline points="95,565 160,578 230,593 310,606 455,615" fill="none" stroke="#B76E00" stroke-width="5"/>
  <line x1="300" y1="550" x2="300" y2="625" stroke="#C0392B" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="310" y="570" font-family="Arial,sans-serif" font-size="15" fill="#C0392B">training stops early</text>
  <text x="575" y="165" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172033">B  Joint N × D identification grid</text>
  <line x1="635" y1="625" x2="1085" y2="625" stroke="#52606D" stroke-width="2"/>
  <line x1="635" y1="625" x2="635" y2="205" stroke="#52606D" stroke-width="2"/>
  <text x="860" y="675" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#52606D">log model scale N</text>
  <text x="585" y="420" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" transform="rotate(-90 585 420)" fill="#52606D">log data D</text>
  <ellipse cx="870" cy="410" rx="190" ry="145" fill="none" stroke="#D9E0E7" stroke-width="3"/>
  <ellipse cx="870" cy="410" rx="135" ry="98" fill="none" stroke="#B76E00" stroke-width="3"/>
  <ellipse cx="870" cy="410" rx="75" ry="48" fill="none" stroke="#0F766E" stroke-width="4"/>
  <text x="1065" y="280" font-family="Arial,sans-serif" font-size="15" text-anchor="end" fill="#52606D">higher loss</text>
  <text x="870" y="416" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#0F766E">low-loss valley</text>
  <g fill="#FFFFFF" stroke="#2563EB" stroke-width="3">
    <circle cx="690" cy="570" r="7"/><circle cx="755" cy="510" r="7"/><circle cx="820" cy="450" r="7"/>
    <circle cx="885" cy="390" r="7"/><circle cx="950" cy="330" r="7"/><circle cx="1015" cy="270" r="7"/>
  </g>
  <polyline points="690,570 755,510 820,450 885,390 950,330 1015,270" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="1020" y="250" font-family="Arial,sans-serif" font-size="15" fill="#2563EB">one diagonal scale path</text>
  <g fill="#FBECEC" stroke="#C0392B" stroke-width="2">
    <rect x="680" y="310" width="20" height="20"/><rect x="760" y="310" width="20" height="20"/><rect x="840" y="310" width="20" height="20"/>
    <rect x="680" y="390" width="20" height="20"/><rect x="760" y="390" width="20" height="20"/><rect x="840" y="390" width="20" height="20"/>
    <rect x="680" y="470" width="20" height="20"/><rect x="760" y="470" width="20" height="20"/><rect x="840" y="470" width="20" height="20"/>
  </g>
  <text x="690" y="290" font-family="Arial,sans-serif" font-size="15" fill="#C0392B">crossed slices identify separate N and D effects</text>
  <rect x="680" y="560" width="380" height="45" rx="10" fill="#FFF4DE" stroke="#B76E00" stroke-width="2"/>
  <text x="870" y="588" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#B76E00">Add T / optimizer telemetry before calling this the frontier</text>
  <text x="600" y="758" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#52606D">Textbook schematic — marginal laws require the other bottlenecks to be controlled.</text>
</svg>
