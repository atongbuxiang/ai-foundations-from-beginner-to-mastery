<title id="title">全因子消融、交互与别名</title><desc id="desc">二乘二四格和交互线展示协同，右侧说明半分数设计中主效应与交互的别名关系。</desc><style>text{font-family:Inter, PingFang SC, Noto Sans CJK SC, sans-serif;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2937"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker></defs><rect width="1200" height="620" fill="#FFFEFB"/><text x="66" y="52" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">全因子看见 OFAT 看不见的角</text><text x="70" y="95" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">A / B 四个组合</text><rect x="95" y="145" width="118" height="118" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2" stroke-dasharray=""/><text x="154" y="197" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">A=0, B=0</text><text x="154" y="229" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="750" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">70</text><rect x="240" y="145" width="118" height="118" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2" stroke-dasharray=""/><text x="299" y="197" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">A=1, B=0</text><text x="299" y="229" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="750" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">70</text><rect x="95" y="290" width="118" height="118" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2" stroke-dasharray=""/><text x="154" y="342" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">A=0, B=1</text><text x="154" y="374" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="750" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">70</text><rect x="240" y="290" width="118" height="118" rx="0" fill="#ECFDF5" stroke="#0F766E" stroke-width="3" stroke-dasharray=""/><text x="299" y="342" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">A=1, B=1</text><text x="299" y="374" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="750" fill="#0F766E" text-anchor="middle" dominant-baseline="alphabetic">82</text><path d="M 154 138 L 154 125 L 299 125 L 299 138" fill="none" stroke="#C24135" stroke-width="2.5" stroke-dasharray="6 5" marker-end="" stroke-linejoin="round" stroke-linecap="round"/><text x="226" y="118" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#C24135" text-anchor="middle" dominant-baseline="alphabetic">OFAT 两条边都为 0</text><text x="468" y="95" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">Interaction plot</text><line x1="470" y1="385" x2="765" y2="385" stroke="#1F2937" stroke-width="2" stroke-dasharray="" marker-end=""/><line x1="470" y1="385" x2="470" y2="125" stroke="#1F2937" stroke-width="2" stroke-dasharray="" marker-end=""/><text x="615" y="420" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">A: low → high</text><text x="448" y="260" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">Y</text><polyline points="510,325 720,325" fill="none" stroke="#2563EB" stroke-width="4" stroke-dasharray="" marker-end="" stroke-linejoin="round" stroke-linecap="round"/><polyline points="510,325 720,165" fill="none" stroke="#0F766E" stroke-width="4" stroke-dasharray="" marker-end="" stroke-linejoin="round" stroke-linecap="round"/><circle cx="510" cy="325" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><circle cx="720" cy="325" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><circle cx="510" cy="325" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/><circle cx="720" cy="165" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/><text x="730" y="330" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#2563EB" text-anchor="start" dominant-baseline="alphabetic">B=0</text><text x="730" y="170" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#0F766E" text-anchor="start" dominant-baseline="alphabetic">B=1</text><text x="615" y="460" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#0F766E" text-anchor="middle" dominant-baseline="alphabetic">斜率差 = interaction</text><text x="860" y="95" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">Fraction：节省 run，牺牲可分性</text><circle cx="985" cy="230" r="90" fill="#FFFEFB" stroke="#B7791F" stroke-width="3"/><text x="985" y="208" font-family="SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700" fill="#B7791F" text-anchor="middle" dominant-baseline="alphabetic">I = A B C</text><text x="985" y="244" font-family="SFMono-Regular, Consolas, monospace" font-size="20" font-weight="400" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">A  ≡  B C</text><text x="985" y="278" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#C24135" text-anchor="middle" dominant-baseline="alphabetic">effect alias</text><text x="860" y="350" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">筛选结论：</text><text x="860" y="378" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#B7791F" text-anchor="start" dominant-baseline="alphabetic">“A 或 BC 与响应相关”</text><text x="860" y="406" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#C24135" text-anchor="start" dominant-baseline="alphabetic">不是“A 已被单独证明”</text><line x1="66" y1="500" x2="1134" y2="500" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="6 6" marker-end=""/><text x="80" y="548" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="750" fill="#2563EB" text-anchor="start" dominant-baseline="alphabetic">1</text><text x="114" y="548" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="750" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">随机化</text><text x="114" y="579" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="alphabetic">打散时间漂移</text><text x="355" y="548" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="750" fill="#0F766E" text-anchor="start" dominant-baseline="alphabetic">2</text><text x="389" y="548" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="750" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">阻断</text><text x="389" y="579" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="alphabetic">吸收已知难度</text><text x="630" y="548" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="750" fill="#B7791F" text-anchor="start" dominant-baseline="alphabetic">3</text><text x="664" y="548" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="750" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">重复</text><text x="664" y="579" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="alphabetic">估计运行变异</text><text x="905" y="548" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="750" fill="#C24135" text-anchor="start" dominant-baseline="alphabetic">4</text><text x="939" y="548" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="750" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">确认</text><text x="939" y="579" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="alphabetic">新 runs 解 alias</text></svg>
