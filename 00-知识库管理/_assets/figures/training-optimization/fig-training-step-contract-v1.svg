<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">训练步的对象、持久状态与有序变换</title>
  <desc id="desc">图从数据采样、前向、归约、反向、梯度处理、优化器更新走到遥测，并展示随机数、模型缓冲区、优化器与数值控制状态如何进入下一步。</desc>
  <rect width="1200" height="700" fill="#FFFEFB"/>
  <style>
    .sans{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.mono{font-family:"SFMono-Regular",Menlo,monospace}
    .ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}.red{fill:#C24135}
    .box{fill:#F8FAFC;stroke:#94A3B8;stroke-width:2}.main{fill:#EEF3FF;stroke:#2563EB;stroke-width:2.5}.state{fill:#E8F5F1;stroke:#0F766E;stroke-width:2.5}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563EB"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0F766E"/></marker></defs>
  <text x="56" y="54" class="sans blue" font-size="23" font-weight="700">A｜一步主线：对象按顺序改变</text>
  <text x="56" y="86" class="sans muted" font-size="17">箭头表示数据或梯度流；顺序本身属于算法合同</text>
  <g class="sans ink" font-size="18" text-anchor="middle">
    <rect x="54" y="132" width="140" height="78" rx="6" class="main"/><text x="124" y="166">Sampler</text><text x="124" y="192" class="muted" font-size="16">indices / mask</text>
    <rect x="224" y="132" width="140" height="78" rx="6" class="main"/><text x="294" y="166">Forward</text><text x="294" y="192" class="muted" font-size="16">loss vector</text>
    <rect x="394" y="132" width="140" height="78" rx="6" class="main"/><text x="464" y="166">Reduction</text><text x="464" y="192" class="muted" font-size="16">mean / sum</text>
    <rect x="564" y="132" width="140" height="78" rx="6" class="main"/><text x="634" y="166">Backward</text><text x="634" y="192" class="muted" font-size="16">raw gradient</text>
    <rect x="734" y="132" width="140" height="78" rx="6" class="main"/><text x="804" y="166">Transform</text><text x="804" y="192" class="muted" font-size="16">unscale → clip</text>
    <rect x="904" y="132" width="140" height="78" rx="6" class="main"/><text x="974" y="166">Optimizer</text><text x="974" y="192" class="muted" font-size="16">θ, state update</text>
    <rect x="1074" y="132" width="96" height="78" rx="6" class="main"/><text x="1122" y="166">Log</text><text x="1122" y="192" class="muted" font-size="16">ledger</text>
  </g>
  <g stroke="#2563EB" stroke-width="3" marker-end="url(#a)"><line x1="194" y1="171" x2="220" y2="171"/><line x1="364" y1="171" x2="390" y2="171"/><line x1="534" y1="171" x2="560" y2="171"/><line x1="704" y1="171" x2="730" y2="171"/><line x1="874" y1="171" x2="900" y2="171"/><line x1="1044" y1="171" x2="1070" y2="171"/></g>
  <text x="56" y="282" class="sans green" font-size="23" font-weight="700">B｜跨 step 保存：只存参数远远不够</text>
  <g class="sans ink" font-size="18" text-anchor="middle">
    <rect x="64" y="328" width="190" height="86" rx="8" class="state"/><text x="159" y="360">数据与 RNG</text><text x="159" y="389" class="mono muted" font-size="15">d_t, r_t</text>
    <rect x="286" y="328" width="190" height="86" rx="8" class="state"/><text x="381" y="360">参数与 buffer</text><text x="381" y="389" class="mono muted" font-size="15">theta_t, b_t</text>
    <rect x="508" y="328" width="190" height="86" rx="8" class="state"/><text x="603" y="360">优化器状态</text><text x="603" y="389" class="mono muted" font-size="15">momentum / step</text>
    <rect x="730" y="328" width="190" height="86" rx="8" class="state"/><text x="825" y="360">精度与 overflow</text><text x="825" y="389" class="mono muted" font-size="15">scale / dtype</text>
    <rect x="952" y="328" width="190" height="86" rx="8" class="state"/><text x="1047" y="360">调度与计数</text><text x="1047" y="389" class="mono muted" font-size="15">LR / tokens / step</text>
  </g>
  <path d="M1128 426 C1128 522 72 522 72 426" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#g)"/>
  <rect x="404" y="480" width="392" height="32" fill="#FFFEFB"/>
  <text x="600" y="501" class="sans green" font-size="18" text-anchor="middle">保存 X_t 并进入下一 optimizer step</text>
  <line x1="56" y1="554" x2="1144" y2="554" stroke="#D7DEE8" stroke-width="2"/>
  <text x="56" y="598" class="sans red" font-size="20" font-weight="700">不可随意交换</text>
  <text x="242" y="598" class="sans ink" font-size="18">unscale → clip</text>
  <text x="445" y="598" class="sans ink" font-size="18">accumulate → optimizer.step</text>
  <text x="754" y="598" class="sans ink" font-size="18">optimizer.step → scheduler.step</text>
  <text x="56" y="645" class="sans muted" font-size="17">复现定位：从最早分叉的状态开始，而不是只比较最终 loss。</text>
</svg>
