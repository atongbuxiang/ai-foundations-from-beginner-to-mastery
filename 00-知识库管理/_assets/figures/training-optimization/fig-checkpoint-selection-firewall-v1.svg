<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Checkpoint 选择与验证防火墙</title><desc id="desc">训练轨迹产生多个候选，validation 选择后冻结完整过程，再由锁定测试集评估；底部区分四种计算预算分母。</desc><style>text{font-family:Inter, PingFang SC, Noto Sans CJK SC, sans-serif;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2937"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker></defs><rect width="1200" height="700" fill="#FFFEFB"/><text x="66" y="52" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">一条训练轨迹产生 K 个候选</text><line x1="78" y1="330" x2="560" y2="330" stroke="#1F2937" stroke-width="2" stroke-dasharray="" marker-end=""/><line x1="78" y1="330" x2="78" y2="92" stroke="#1F2937" stroke-width="2" stroke-dasharray="" marker-end=""/><text x="318" y="365" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">training step / token</text><text x="55" y="210" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">risk</text><path d="M 90 130 C 170 180, 245 260, 330 285 C 400 307, 455 302, 545 250" fill="none" stroke="#2563EB" stroke-width="4" stroke-dasharray="" marker-end="" stroke-linejoin="round" stroke-linecap="round"/><circle cx="130" cy="158" r="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/><text x="130" y="183" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">c1</text><circle cx="205" cy="215" r="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/><text x="205" y="240" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">c2</text><circle cx="280" cy="267" r="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/><text x="280" y="292" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">c3</text><circle cx="355" cy="294" r="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/><text x="355" y="319" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">c4</text><circle cx="430" cy="304" r="10" fill="#C24135" stroke="#C24135" stroke-width="2"/><text x="448" y="310" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#C24135" text-anchor="start" dominant-baseline="alphabetic">selected c5</text><circle cx="510" cy="270" r="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/><text x="510" y="295" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">c6</text><text x="430" y="120" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#C24135" text-anchor="middle" dominant-baseline="alphabetic">validation selects min observed risk</text><line x1="430" y1="133" x2="430" y2="286" stroke="#C24135" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><line x1="605" y1="82" x2="605" y2="410" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="6 6" marker-end=""/><text x="650" y="112" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="750" fill="#B7791F" text-anchor="start" dominant-baseline="alphabetic">Freeze</text><line x1="650" y1="145" x2="650" y2="350" stroke="#B7791F" stroke-width="5" stroke-dasharray="" marker-end=""/><text x="680" y="170" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">recipe</text><text x="680" y="205" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">checkpoint rule</text><text x="680" y="240" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">seeds / failures</text><text x="680" y="275" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">analysis / budget</text><text x="680" y="330" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#C24135" text-anchor="start" dominant-baseline="alphabetic">test 不参与选择</text><line x1="855" y1="82" x2="855" y2="410" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="6 6" marker-end=""/><text x="900" y="112" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="750" fill="#0F766E" text-anchor="start" dominant-baseline="alphabetic">Locked test</text><rect x="900" y="155" width="215" height="78" rx="0" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5" stroke-dasharray=""/><text x="1007" y="188" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#0F766E" text-anchor="middle" dominant-baseline="alphabetic">评估完整 procedure</text><text x="1007" y="216" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">不是 oracle best test</text><line x1="900" y1="280" x2="1115" y2="280" stroke="#C24135" stroke-width="3" stroke-dasharray="" marker-end=""/><text x="1007" y="315" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#C24135" text-anchor="middle" dominant-baseline="alphabetic">信息只向右流一次</text><text x="66" y="462" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">“Compute-matched”必须点名分母</text><text x="80" y="506" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#2563EB" text-anchor="start" dominant-baseline="alphabetic">tokens</text><line x1="230" y1="500" x2="970" y2="500" stroke="#D7DEE8" stroke-width="8" stroke-dasharray="" marker-end=""/><line x1="230" y1="500" x2="807.2" y2="500" stroke="#2563EB" stroke-width="8" stroke-dasharray="" marker-end=""/><text x="995" y="506" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="alphabetic">数据曝光</text><text x="80" y="544" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#0F766E" text-anchor="start" dominant-baseline="alphabetic">FLOPs</text><line x1="230" y1="538" x2="970" y2="538" stroke="#D7DEE8" stroke-width="8" stroke-dasharray="" marker-end=""/><line x1="230" y1="538" x2="688.8" y2="538" stroke="#0F766E" stroke-width="8" stroke-dasharray="" marker-end=""/><text x="995" y="544" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="alphabetic">算术预算</text><text x="80" y="582" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#B7791F" text-anchor="start" dominant-baseline="alphabetic">device-time</text><line x1="230" y1="576" x2="970" y2="576" stroke="#D7DEE8" stroke-width="8" stroke-dasharray="" marker-end=""/><line x1="230" y1="576" x2="881.2" y2="576" stroke="#B7791F" stroke-width="8" stroke-dasharray="" marker-end=""/><text x="995" y="582" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="alphabetic">平台成本</text><text x="80" y="620" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#C24135" text-anchor="start" dominant-baseline="alphabetic">tuning+fail</text><line x1="230" y1="614" x2="970" y2="614" stroke="#D7DEE8" stroke-width="8" stroke-dasharray="" marker-end=""/><line x1="230" y1="614" x2="585.2" y2="614" stroke="#C24135" stroke-width="8" stroke-dasharray="" marker-end=""/><text x="995" y="620" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="alphabetic">研发总账</text><text x="80" y="672" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="alphabetic">throughput 更高不保证 time-to-quality 更短；失败 run 仍在分母中。</text></svg>
