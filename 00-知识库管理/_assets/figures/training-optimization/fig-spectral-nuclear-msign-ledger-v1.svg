<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">谱核范数对偶与矩阵 sign 对象总账</title>
  <desc id="desc">从矩阵的奇异值分解出发，区分谱单位球最速方向、极分解、经典矩阵 sign 和有限步 Newton–Schulz 输出。</desc>
  <rect width="1200" height="760" fill="#FFFEFB"/>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#0F172A}.h{font-size:27px;font-weight:700}.sh{font-size:19px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#64748B}.boxb{fill:#EEF4FF;stroke:#2563EB;stroke-width:2}.boxg{fill:#ECF7F4;stroke:#0F766E;stroke-width:2}.boxa{fill:#FFF6E5;stroke:#B76E00;stroke-width:2}.boxr{fill:#FFF1F0;stroke:#C0392B;stroke-width:2}.arr{stroke:#2563EB;stroke-width:3;fill:none}.line{stroke:#CBD5E1;stroke-width:2}</style>
  <defs><marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2563EB"/></marker></defs>
  <text x="48" y="48" class="h" fill="#2563EB">A｜同一个 SVD，进入四条不同问题路径</text>
  <rect x="48" y="82" width="310" height="100" rx="13" class="boxb"/>
  <text x="76" y="120" class="sh">G = Uᵣ Σᵣ Vᵣᵀ</text>
  <text x="76" y="151" class="s">rank r；σ₁ ≥ … ≥ σᵣ &gt; 0</text>
  <line x1="358" y1="132" x2="442" y2="132" class="arr" marker-end="url(#ab)"/>
  <rect x="452" y="82" width="700" height="100" rx="13" class="boxg"/>
  <text x="480" y="118" class="sh">spectral-unit linear oracle</text>
  <text x="480" y="150" class="b">max ||Δ||₂≤1 〈G,Δ〉F = Σᵢ σᵢ = ||G||*　；canonical Δ = UᵣVᵣᵀ</text>

  <line x1="48" y1="218" x2="1152" y2="218" class="line"/>
  <text x="48" y="258" class="h" fill="#0F766E">B｜名字相近，但定义域、变换对象和精确性不同</text>

  <rect x="48" y="290" width="254" height="174" rx="13" class="boxg"/>
  <text x="72" y="325" class="sh">Polar / msign</text>
  <text x="72" y="357" class="b">UᵣVᵣᵀ</text>
  <text x="72" y="388" class="s">变换 singular values</text>
  <text x="72" y="415" class="s">矩形矩阵可定义</text>
  <text x="72" y="442" class="s">support 上 canonical</text>

  <rect x="330" y="290" width="254" height="174" rx="13" class="boxb"/>
  <text x="354" y="325" class="sh">Classical sign(A)</text>
  <text x="354" y="357" class="b">A(A²)⁻¹ᐟ²</text>
  <text x="354" y="388" class="s">变换 eigenvalues</text>
  <text x="354" y="415" class="s">方阵且需谱条件</text>
  <text x="354" y="442" class="s">非正规矩阵上不可混同</text>

  <rect x="612" y="290" width="254" height="174" rx="13" class="boxa"/>
  <text x="636" y="325" class="sh">Finite-step NS</text>
  <text x="636" y="357" class="b">pₖ(G)</text>
  <text x="636" y="388" class="s">多项式近似</text>
  <text x="636" y="415" class="s">依赖 scaling、steps、dtype</text>
  <text x="636" y="442" class="s">必须报告 residual</text>

  <rect x="894" y="290" width="258" height="174" rx="13" class="boxr"/>
  <text x="918" y="325" class="sh">Rank-deficient face</text>
  <text x="918" y="357" class="b">UᵣVᵣᵀ + U₀KV₀ᵀ</text>
  <text x="918" y="388" class="s">||K||₂ ≤ 1</text>
  <text x="918" y="415" class="s">线性极值相同</text>
  <text x="918" y="442" class="s" fill="#C0392B">最速解不唯一</text>

  <text x="48" y="514" class="h" fill="#2563EB">C｜二维手算：G = diag(4,1)</text>
  <rect x="48" y="548" width="530" height="108" rx="12" class="boxb"/>
  <text x="72" y="584" class="b">nuclear norm = 4 + 1 = 5</text>
  <text x="72" y="616" class="b">spectral-unit direction = −I；predicted decrease = −5</text>
  <text x="72" y="642" class="s">所有非零奇异方向都使用幅度 1。</text>
  <rect x="606" y="548" width="546" height="108" rx="12" class="boxa"/>
  <text x="630" y="584" class="b">Frobenius-unit direction = −G / √17</text>
  <text x="630" y="616" class="b">predicted decrease = −√17 ≈ −4.123</text>
  <text x="630" y="642" class="s">它回答的是另一个单位球问题，并非“算错”。</text>
  <rect x="48" y="690" width="1104" height="44" rx="9" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="72" y="718" class="s">检查顺序：pairing → step norm → dual norm → rank/uniqueness → exact function or approximation。</text>
</svg>

