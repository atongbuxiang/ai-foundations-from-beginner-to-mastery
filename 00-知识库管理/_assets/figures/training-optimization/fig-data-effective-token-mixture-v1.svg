<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Repeated token value and data mixture geometry</title>
  <desc id="desc">Three panels distinguish seen and effective tokens, show decreasing marginal value across epochs, and represent data mixtures on a simplex with domain-specific losses.</desc>
  <rect width="1200" height="800" fill="#FFFEFB"/>
  <text x="60" y="60" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172033">Seen tokens are a clock; effective tokens are a target-dependent model</text>
  <text x="60" y="94" font-family="Arial,sans-serif" font-size="17" fill="#52606D">Repetition changes marginal value, while mixtures preserve a vector of domain effects that one scalar cannot encode.</text>
  <rect x="50" y="125" width="345" height="585" rx="18" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
  <rect x="427" y="125" width="345" height="585" rx="18" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
  <rect x="804" y="125" width="346" height="585" rx="18" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
  <text x="75" y="165" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172033">A  Marginal value by repeat</text>
  <line x1="95" y1="625" x2="355" y2="625" stroke="#52606D" stroke-width="2"/>
  <line x1="95" y1="625" x2="95" y2="205" stroke="#52606D" stroke-width="2"/>
  <polyline points="110,245 155,330 200,398 245,450 290,490 335,520" fill="none" stroke="#0F766E" stroke-width="5"/>
  <g fill="#0F766E"><circle cx="110" cy="245" r="6"/><circle cx="155" cy="330" r="6"/><circle cx="200" cy="398" r="6"/><circle cx="245" cy="450" r="6"/><circle cx="290" cy="490" r="6"/><circle cx="335" cy="520" r="6"/></g>
  <text x="115" y="225" font-family="Arial,sans-serif" font-size="16" fill="#0F766E">w1 = 1</text>
  <text x="265" y="555" font-family="Arial,sans-serif" font-size="15" fill="#C0392B">later repeats: less value</text>
  <text x="225" y="670" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#52606D">epoch / repeat r</text>
  <text x="55" y="420" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" transform="rotate(-90 55 420)" fill="#52606D">marginal weight wr</text>
  <text x="452" y="165" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172033">B  Four token ledgers</text>
  <rect x="470" y="215" width="255" height="65" rx="12" fill="#EAF1FF" stroke="#2563EB" stroke-width="2"/>
  <text x="598" y="243" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#2563EB">Raw tokens</text>
  <text x="598" y="265" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">after tokenization</text>
  <rect x="470" y="315" width="210" height="65" rx="12" fill="#E9F7F4" stroke="#0F766E" stroke-width="2"/>
  <text x="575" y="343" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#0F766E">Unique tokens</text>
  <text x="575" y="365" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">depends on dedup rule</text>
  <rect x="470" y="415" width="255" height="65" rx="12" fill="#FFF4DE" stroke="#B76E00" stroke-width="2"/>
  <text x="598" y="443" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#B76E00">Seen tokens K = R Du</text>
  <text x="598" y="465" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">linear training clock</text>
  <rect x="470" y="515" width="180" height="75" rx="12" fill="#FBECEC" stroke="#C0392B" stroke-width="2"/>
  <text x="560" y="543" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#C0392B">Effective tokens</text>
  <text x="560" y="566" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">target + stage specific</text>
  <line x1="598" y1="280" x2="575" y2="305" stroke="#52606D" stroke-width="2"/>
  <line x1="575" y1="380" x2="598" y2="405" stroke="#52606D" stroke-width="2"/>
  <line x1="598" y1="480" x2="560" y2="505" stroke="#52606D" stroke-width="2"/>
  <text x="650" y="550" font-family="Arial,sans-serif" font-size="15" fill="#C0392B">latent / inferred</text>
  <text x="829" y="165" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172033">C  Mixture simplex</text>
  <polygon points="977,215 850,560 1105,560" fill="#EAF1FF" stroke="#2563EB" stroke-width="3"/>
  <text x="977" y="200" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#2563EB">code</text>
  <text x="832" y="585" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#0F766E">web</text>
  <text x="1120" y="585" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#B76E00">books</text>
  <circle cx="952" cy="405" r="11" fill="#C0392B"/>
  <line x1="952" y1="405" x2="1080" y2="335" stroke="#C0392B" stroke-width="2"/>
  <rect x="930" y="305" width="185" height="65" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="1022" y="332" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#C0392B">mixture p</text>
  <text x="1022" y="354" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">predict Lweb, Lcode, Lbooks</text>
  <text x="977" y="635" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#172033">target score = q · domain-loss vector</text>
  <text x="977" y="665" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#C0392B">one total loss can hide negative transfer</text>
  <text x="600" y="758" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#52606D">Textbook schematic — effective-token weights and optimal mixtures must be estimated in the target setting.</text>
</svg>
