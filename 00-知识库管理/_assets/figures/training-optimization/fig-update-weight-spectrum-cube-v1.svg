<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc">
<title id="title">Update-to-Weight Ratio 的三种分辨率</title><desc id="desc">同一次更新分别从全局标量、层与单元、谱方向观察，说明正常的全局 RMS 可以隐藏局部或低秩尖峰。</desc><style>text{font-family:Inter, PingFang SC, Noto Sans CJK SC, sans-serif;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2937"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker></defs><rect width="1200" height="655" fill="#FFFEFB"/><text x="66" y="54" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">同一次更新的三种分辨率</text><line x1="398" y1="82" x2="398" y2="590" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="6 7" marker-end=""/><line x1="802" y1="82" x2="802" y2="590" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="6 7" marker-end=""/><text x="210" y="100" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">全局 scalar</text><circle cx="210" cy="250" r="115" fill="#FFFEFB" stroke="#2563EB" stroke-width="4"/><text x="210" y="238" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750" fill="#2563EB" text-anchor="middle" dominant-baseline="alphabetic">UWR</text><text x="210" y="272" font-family="SFMono-Regular, Consolas, monospace" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">||delta|| / ||weight||</text><text x="210" y="318" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#0F766E" text-anchor="middle" dominant-baseline="alphabetic">正常范围</text><text x="210" y="425" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">大层支配平均</text><text x="210" y="453" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">局部异常可被抵消</text><text x="600" y="100" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">layer / unit</text><text x="455" y="173" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">L1</text><line x1="500" y1="167" x2="750" y2="167" stroke="#D7DEE8" stroke-width="7" stroke-dasharray="" marker-end=""/><line x1="500" y1="167" x2="548.6" y2="167" stroke="#2563EB" stroke-width="7" stroke-dasharray="" marker-end=""/><text x="765" y="173" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="end" dominant-baseline="alphabetic">0.18</text><text x="455" y="225" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">L2</text><line x1="500" y1="219" x2="750" y2="219" stroke="#D7DEE8" stroke-width="7" stroke-dasharray="" marker-end=""/><line x1="500" y1="219" x2="564.8" y2="219" stroke="#2563EB" stroke-width="7" stroke-dasharray="" marker-end=""/><text x="765" y="225" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="end" dominant-baseline="alphabetic">0.24</text><text x="455" y="277" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">L3</text><line x1="500" y1="271" x2="750" y2="271" stroke="#D7DEE8" stroke-width="7" stroke-dasharray="" marker-end=""/><line x1="500" y1="271" x2="583.7" y2="271" stroke="#2563EB" stroke-width="7" stroke-dasharray="" marker-end=""/><text x="765" y="277" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="end" dominant-baseline="alphabetic">0.31</text><text x="455" y="329" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">L4</text><line x1="500" y1="323" x2="750" y2="323" stroke="#D7DEE8" stroke-width="7" stroke-dasharray="" marker-end=""/><line x1="500" y1="323" x2="554" y2="323" stroke="#2563EB" stroke-width="7" stroke-dasharray="" marker-end=""/><text x="765" y="329" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="end" dominant-baseline="alphabetic">0.20</text><text x="455" y="381" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">L5</text><line x1="500" y1="375" x2="750" y2="375" stroke="#D7DEE8" stroke-width="7" stroke-dasharray="" marker-end=""/><line x1="500" y1="375" x2="732.2" y2="375" stroke="#C24135" stroke-width="7" stroke-dasharray="" marker-end=""/><text x="765" y="361" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#C24135" text-anchor="end" dominant-baseline="alphabetic">0.86 ↑</text><text x="455" y="433" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">L6</text><line x1="500" y1="427" x2="750" y2="427" stroke="#D7DEE8" stroke-width="7" stroke-dasharray="" marker-end=""/><line x1="500" y1="427" x2="572.9" y2="427" stroke="#2563EB" stroke-width="7" stroke-dasharray="" marker-end=""/><text x="765" y="433" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="end" dominant-baseline="alphabetic">0.27</text><text x="455" y="485" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">L7</text><line x1="500" y1="479" x2="750" y2="479" stroke="#D7DEE8" stroke-width="7" stroke-dasharray="" marker-end=""/><line x1="500" y1="479" x2="559.4" y2="479" stroke="#2563EB" stroke-width="7" stroke-dasharray="" marker-end=""/><text x="765" y="485" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="end" dominant-baseline="alphabetic">0.22</text><text x="600" y="552" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#C24135" text-anchor="middle" dominant-baseline="alphabetic">global mean 不会替 layer 说话</text><text x="1000" y="100" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">operator / spectrum</text><line x1="855" y1="470" x2="1135" y2="470" stroke="#1F2937" stroke-width="2" stroke-dasharray="" marker-end=""/><line x1="855" y1="470" x2="855" y2="155" stroke="#1F2937" stroke-width="2" stroke-dasharray="" marker-end=""/><text x="995" y="505" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">singular direction</text><polyline points="870,180 905,330 940,382 975,411 1010,430 1045,442 1080,450 1120,455" fill="none" stroke="#C24135" stroke-width="4" stroke-dasharray="" marker-end="" stroke-linejoin="round" stroke-linecap="round"/><circle cx="870" cy="180" r="8" fill="#C24135" stroke="#C24135" stroke-width="2"/><text x="890" y="172" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#C24135" text-anchor="start" dominant-baseline="alphabetic">rank-one spike</text><text x="997" y="540" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#C24135" text-anchor="middle" dominant-baseline="alphabetic">RMS 小，top singular value 仍可大</text><line x1="210" y1="585" x2="1000" y2="585" stroke="#1F2937" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><text x="600" y="621" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="650" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">再沿 gradient → preconditioned direction → realized update 比较时钟</text></svg>
