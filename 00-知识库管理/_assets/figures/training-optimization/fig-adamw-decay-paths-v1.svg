<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">L2、Coupled Adam 与 AdamW 的两条衰减路径</title>
  <desc id="desc">比较正则梯度进入 Adam moments 的 coupled 路径与 AdamW 独立乘法收缩，并区分累计衰减恒等式和 Weight RMS 平均场近似。</desc>
  <rect width="1200" height="720" fill="#FFFEFB"/>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#0F172A}
    .h{font-size:27px;font-weight:700}.sh{font-size:19px;font-weight:700}.b{font-size:16px}.s{font-size:15px;fill:#64748B}
    .boxb{fill:#EEF4FF;stroke:#2563EB;stroke-width:2}.boxg{fill:#ECF7F4;stroke:#0F766E;stroke-width:2}.boxa{fill:#FFF6E5;stroke:#B76E00;stroke-width:2}.boxr{fill:#FFF1F0;stroke:#C0392B;stroke-width:2}.line{stroke:#CBD5E1;stroke-width:2}.arrb{stroke:#2563EB;stroke-width:3;fill:none}.arrr{stroke:#C0392B;stroke-width:3;fill:none}.arrg{stroke:#0F766E;stroke-width:3;fill:none}
  </style>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2563EB"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#C0392B"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#0F766E"/></marker>
  </defs>
  <text x="48" y="50" class="h" fill="#C0392B">A｜Coupled L2：lambda theta 进入 optimizer state</text>
  <rect x="48" y="84" width="154" height="76" rx="12" class="boxb"/><text x="94" y="118" class="sh">task g</text>
  <rect x="48" y="190" width="154" height="76" rx="12" class="boxr"/><text x="75" y="224" class="sh" fill="#C0392B">lambda theta</text>
  <path d="M202 122 C250 122 244 164 286 164" class="arrb" marker-end="url(#ab)"/><path d="M202 228 C250 228 244 180 286 180" class="arrr" marker-end="url(#ar)"/>
  <rect x="296" y="124" width="178" height="90" rx="12" class="boxa"/><text x="329" y="159" class="sh">g + lambda theta</text><text x="324" y="190" class="s">regularized gradient</text>
  <line x1="474" y1="169" x2="526" y2="169" class="arrb" marker-end="url(#ab)"/>
  <rect x="536" y="96" width="182" height="66" rx="12" class="boxb"/><text x="570" y="135" class="sh">m state</text>
  <rect x="536" y="182" width="182" height="66" rx="12" class="boxg"/><text x="570" y="221" class="sh">v state</text>
  <path d="M474 169 C500 169 500 129 526 129" class="arrb" marker-end="url(#ab)"/><path d="M474 169 C500 169 500 215 526 215" class="arrb" marker-end="url(#ab)"/>
  <text x="754" y="119" class="b" fill="#C0392B">decay history is preconditioned</text><text x="754" y="154" class="b">and persists into future steps</text>
  <rect x="754" y="182" width="398" height="82" rx="12" class="boxr"/>
  <text x="782" y="214" class="b">P = diag(1, 0.1), theta=(1,1)</text><text x="782" y="244" class="s">coupled shrink ∝ (1, 0.1): anisotropic</text>

  <line x1="48" y1="300" x2="1152" y2="300" class="line"/>
  <text x="48" y="342" class="h" fill="#0F766E">B｜AdamW：task moments 与 isotropic shrink 分账</text>
  <rect x="48" y="374" width="170" height="74" rx="12" class="boxb"/><text x="95" y="408" class="sh">task g</text>
  <line x1="218" y1="411" x2="270" y2="411" class="arrb" marker-end="url(#ab)"/>
  <rect x="280" y="362" width="190" height="98" rx="12" class="boxb"/><text x="330" y="397" class="sh">m, v</text><text x="306" y="430" class="s">only task gradient</text>
  <line x1="470" y1="411" x2="522" y2="411" class="arrb" marker-end="url(#ab)"/>
  <rect x="532" y="362" width="202" height="98" rx="12" class="boxg"/><text x="566" y="397" class="sh">- eta u_t</text><text x="557" y="430" class="s">adaptive task update</text>
  <rect x="280" y="486" width="190" height="84" rx="12" class="boxg"/><text x="307" y="520" class="sh">(1-eta lambda)</text><text x="331" y="549" class="s">direct shrink</text>
  <path d="M470 528 C590 528 690 486 776 434" class="arrg" marker-end="url(#ag)"/>
  <path d="M734 411 L776 411" class="arrb" marker-end="url(#ab)"/>
  <rect x="786" y="374" width="366" height="88" rx="12" class="boxg"/>
  <text x="814" y="409" class="sh">theta_t = (1-eta lambda) theta - eta u</text>
  <text x="814" y="441" class="s">same relative shrink across coordinates in the group</text>

  <text x="48" y="620" class="h" fill="#2563EB">C｜Exact 与 Approximation 不混写</text>
  <rect x="48" y="646" width="344" height="56" rx="10" class="boxb"/><text x="70" y="681" class="b">exact: product_t (1-eta_t lambda_t)</text>
  <rect x="426" y="646" width="344" height="56" rx="10" class="boxa"/><text x="448" y="681" class="b">approx: exp(-sum_t eta_t lambda_t)</text>
  <rect x="804" y="646" width="348" height="56" rx="10" class="boxg"/><text x="826" y="681" class="b">mean-field: Weight RMS ~ sqrt(eta/(2 lambda))</text>
</svg>
