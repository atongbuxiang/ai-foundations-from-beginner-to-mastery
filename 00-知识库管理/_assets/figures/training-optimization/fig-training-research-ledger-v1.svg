<title id="title">训练研究账本闭环</title><desc id="desc">Claim、protocol、run、incident、evidence 和 decision 形成可追溯闭环，右侧证据阶梯限制因果语言。</desc><style>text{font-family:Inter, PingFang SC, Noto Sans CJK SC, sans-serif;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2937"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker></defs><rect width="1200" height="710" fill="#FFFEFB"/><text x="66" y="52" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">Research ledger：每条结论都能反向追溯</text><rect x="60" y="132" width="180" height="76" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5" stroke-dasharray=""/><text x="150" y="165" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="750" fill="#2563EB" text-anchor="middle" dominant-baseline="alphabetic">Claim</text><text x="150" y="192" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">estimand · DAG</text><rect x="320" y="82" width="180" height="76" rx="0" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5" stroke-dasharray=""/><text x="410" y="115" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="750" fill="#0F766E" text-anchor="middle" dominant-baseline="alphabetic">Protocol</text><text x="410" y="142" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">design · budget</text><rect x="590" y="132" width="180" height="76" rx="0" fill="#F8FAFC" stroke="#1F2937" stroke-width="2.5" stroke-dasharray=""/><text x="680" y="165" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="750" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">Run</text><text x="680" y="192" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">manifest · telemetry</text><rect x="590" y="312" width="180" height="76" rx="0" fill="#FEF2F2" stroke="#C24135" stroke-width="2.5" stroke-dasharray=""/><text x="680" y="345" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="750" fill="#C24135" text-anchor="middle" dominant-baseline="alphabetic">Incident</text><text x="680" y="372" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">first bad · replay</text><rect x="320" y="367" width="180" height="76" rx="0" fill="#FFFBEB" stroke="#B7791F" stroke-width="2.5" stroke-dasharray=""/><text x="410" y="400" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="750" fill="#B7791F" text-anchor="middle" dominant-baseline="alphabetic">Evidence</text><text x="410" y="427" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">support · null · conflict</text><rect x="60" y="312" width="180" height="76" rx="0" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5" stroke-dasharray=""/><text x="150" y="345" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="750" fill="#0F766E" text-anchor="middle" dominant-baseline="alphabetic">Decision</text><text x="150" y="372" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">scope · next test</text><line x1="242" y1="130" x2="318" y2="160" stroke="#1F2937" stroke-width="2.2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="502" y1="160" x2="588" y2="130" stroke="#1F2937" stroke-width="2.2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="680" y1="210" x2="680" y2="310" stroke="#1F2937" stroke-width="2.2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="588" y1="390" x2="502" y2="365" stroke="#1F2937" stroke-width="2.2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="318" y1="365" x2="242" y2="390" stroke="#1F2937" stroke-width="2.2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="150" y1="310" x2="150" y2="210" stroke="#1F2937" stroke-width="2.2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="410" y="275" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle" dominant-baseline="alphabetic">artifact hash + event ID</text><line x1="820" y1="82" x2="820" y2="475" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="6 6" marker-end=""/><text x="865" y="112" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="750" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">因果证据阶梯</text><rect x="865" y="400" width="235" height="34" rx="0" fill="#FFFEFB" stroke="#64748B" stroke-width="2" stroke-dasharray=""/><text x="880" y="423" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="750" fill="#64748B" text-anchor="start" dominant-baseline="alphabetic">E0</text><text x="925" y="423" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">合同/推导</text><rect x="900" y="352" width="215" height="34" rx="0" fill="#FFFEFB" stroke="#2563EB" stroke-width="2" stroke-dasharray=""/><text x="915" y="375" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="750" fill="#2563EB" text-anchor="start" dominant-baseline="alphabetic">E1</text><text x="960" y="375" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">toy oracle</text><rect x="935" y="304" width="195" height="34" rx="0" fill="#FFFEFB" stroke="#B7791F" stroke-width="2" stroke-dasharray=""/><text x="950" y="327" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="750" fill="#B7791F" text-anchor="start" dominant-baseline="alphabetic">E2</text><text x="995" y="327" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">观测时间线</text><rect x="970" y="256" width="175" height="34" rx="0" fill="#FFFEFB" stroke="#0F766E" stroke-width="2" stroke-dasharray=""/><text x="985" y="279" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="750" fill="#0F766E" text-anchor="start" dominant-baseline="alphabetic">E3</text><text x="1030" y="279" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">随机干预</text><rect x="1005" y="208" width="155" height="34" rx="0" fill="#FFFEFB" stroke="#0F766E" stroke-width="2" stroke-dasharray=""/><text x="1020" y="231" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="750" fill="#0F766E" text-anchor="start" dominant-baseline="alphabetic">E4</text><text x="1065" y="231" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">机制干预</text><rect x="1040" y="160" width="135" height="34" rx="0" fill="#FEF2F2" stroke="#C24135" stroke-width="2" stroke-dasharray=""/><text x="1055" y="183" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="750" fill="#C24135" text-anchor="start" dominant-baseline="alphabetic">E5</text><text x="1100" y="183" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">外部复验</text><text x="860" y="472" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#C24135" text-anchor="start" dominant-baseline="alphabetic">E2 不能写成 E3</text><line x1="66" y1="510" x2="1134" y2="510" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="" marker-end=""/><text x="70" y="552" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="750" fill="#C24135" text-anchor="start" dominant-baseline="alphabetic">完整不等于正确</text><text x="270" y="552" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">账本让错误可发现、可复算、可修正</text><text x="75" y="606" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#C24135" text-anchor="start" dominant-baseline="alphabetic">失败也入账</text><text x="75" y="636" font-family="SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="alphabetic">failure denominator</text><text x="355" y="606" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#B7791F" text-anchor="start" dominant-baseline="alphabetic">偏离有版本</text><text x="355" y="636" font-family="SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="alphabetic">protocol deviation</text><text x="635" y="606" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start" dominant-baseline="alphabetic">结论有边界</text><text x="635" y="636" font-family="SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="alphabetic">scope + unresolved</text><text x="915" y="606" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#0F766E" text-anchor="start" dominant-baseline="alphabetic">交接可独立</text><text x="915" y="636" font-family="SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="alphabetic">artifact + owner</text><text x="70" y="680" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="alphabetic">卷终门：至少包含一次真实失败、first-bad-event 复现包与修复反事实。</text></svg>
