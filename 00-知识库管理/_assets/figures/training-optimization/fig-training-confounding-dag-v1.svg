<title id="title">训练配置的因果图与混杂边界</title><desc id="desc">数据、优化器、调度和系统组成处理包；因果图区分混杂、中介与选择碰撞点，并映射到随机化、阻断、全因子和锁定测试。</desc><style>text{font-family:Inter, PingFang SC, Noto Sans CJK SC, sans-serif;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2937"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker></defs><rect width="1200" height="710" fill="#FFFEFB"/><text x="64" y="54" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">Recipe bundle 不是单一 treatment</text><rect x="80" y="95" width="170" height="58" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" stroke-dasharray=""/><text x="165" y="120" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle" dominant-baseline="alphabetic">Data mix</text><text x="165" y="142" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#2563EB" text-anchor="middle" dominant-baseline="alphabetic">D</text><rect x="300" y="95" width="170" height="58" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" stroke-dasharray=""/><text x="385" y="120" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle" dominant-baseline="alphabetic">Optimizer</text><text x="385" y="142" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="400" fill="#2563EB" text-anchor="middle" dominant-baseline="alphabetic">O</text><rect x="520" y="95" width="170" height="58" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" stroke-dasharray=""/><text x="605" y="120" font-family="Inter, PingFang SC, No