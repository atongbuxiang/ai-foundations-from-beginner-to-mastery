<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Range, precision and tensor dtype contract</title>
  <desc id="desc">A textbook diagram places FP32, TF32, FP16, BF16 and two FP8 formats on exponent-versus-significand axes, then traces six distinct dtype roles through training.</desc>
  <rect width="1200" height="800" fill="#FFFEFB"/>
  <text x="60" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172033">A dtype label is not a numerical contract</text>
  <text x="60" y="91" font-family="Arial,sans-serif" font-size="17" fill="#52606D">Exponent bits control range; significand bits control spacing; training assigns precision at six different boundaries.</text>
  <rect x="50" y="125" width="520" height="590" rx="18" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
  <rect x="600" y="125" width="550" height="590" rx="18" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
  <text x="78" y="166" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172033">A  Format plane: range versus precision</text>
  <line x1="115" y1="630" x2="525" y2="630" stroke="#52606D" stroke-width="2"/>
  <line x1="115" y1="630" x2="115" y2="210" stroke="#52606D" stroke-width="2"/>
  <text x="320" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52606D">significand precision p →</text>
  <text x="82" y="420" text-anchor="middle" transform="rotate(-90 82 420)" font-family="Arial,sans-serif" font-size="17" fill="#52606D">exponent bits → range</text>
  <g font-family="Arial,sans-serif" font-size="15" fill="#52606D">
    <text x="115" y="652" text-anchor="middle">3</text><text x="205" y="652" text-anchor="middle">8</text><text x="295" y="652" text-anchor="middle">13</text><text x="475" y="652" text-anchor="middle">23+</text>
    <text x="100" y="575" text-anchor="end">4</text><text x="100" y="475" text-anchor="end">5</text><text x="100" y="255" text-anchor="end">8</text>
  </g>
  <line x1="115" y1="575" x2="525" y2="575" stroke="#D9E0E7"/><line x1="115" y1="475" x2="525" y2="475" stroke="#D9E0E7"/><line x1="115" y1="255" x2="525" y2="255" stroke="#D9E0E7"/>
  <circle cx="133" cy="575" r="10" fill="#B76E00"/><text x="150" y="570" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#B76E00">E4M3</text>
  <circle cx="115" cy="475" r="10" fill="#C0392B"/><text x="132" y="470" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C0392B">E5M2</text>
  <circle cx="259" cy="475" r="10" fill="#2563EB"/><text x="277" y="470" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#2563EB">FP16</text>
  <circle cx="205" cy="255" r="10" fill="#0F766E"/><text x="222" y="250" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0F766E">BF16</text>
  <circle cx="259" cy="255" r="10" fill="#B76E00"/><text x="278" y="285" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#B76E00">TF32 multiply</text>
  <circle cx="475" cy="255" r="10" fill="#2563EB"/><text x="458" y="225" text-anchor="end" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#2563EB">FP32</text>
  <text x="130" y="705" font-family="Arial,sans-serif" font-size="15" fill="#52606D">Same bit-width ≠ same range, spacing, NaN/Inf encoding or kernel.</text>
  <text x="628" y="166" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172033">B  One tensor, six precision boundaries</text>
  <g font-family="Arial,sans-serif">
    <rect x="650" y="205" width="210" height="72" rx="14" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="755" y="235" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">Storage</text><text x="755" y="260" text-anchor="middle" font-size="15" fill="#52606D">BF16 activation</text>
    <rect x="890" y="205" width="210" height="72" rx="14" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="995" y="235" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">Multiply input</text><text x="995" y="260" text-anchor="middle" font-size="15" fill="#52606D">BF16 / TF32 / FP8</text>
    <rect x="650" y="330" width="210" height="72" rx="14" fill="#E8F6F3" stroke="#0F766E" stroke-width="2"/><text x="755" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#0F766E">Accumulate</text><text x="755" y="385" text-anchor="middle" font-size="15" fill="#52606D">often FP32</text>
    <rect x="890" y="330" width="210" height="72" rx="14" fill="#E8F6F3" stroke="#0F766E" stroke-width="2"/><text x="995" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#0F766E">Reduce</text><text x="995" y="385" text-anchor="middle" font-size="15" fill="#52606D">token / rank sum dtype</text>
    <rect x="650" y="455" width="210" height="72" rx="14" fill="#FFF3D6" stroke="#B76E00" stroke-width="2"/><text x="755" y="485" text-anchor="middle" font-size="18" font-weight="700" fill="#B76E00">Update + state</text><text x="755" y="510" text-anchor="middle" font-size="15" fill="#52606D">master / moments</text>
    <rect x="890" y="455" width="210" height="72" rx="14" fill="#FFF3D6" stroke="#B76E00" stroke-width="2"/><text x="995" y="485" text-anchor="middle" font-size="18" font-weight="700" fill="#B76E00">Checkpoint</text><text x="995" y="510" text-anchor="middle" font-size="15" fill="#52606D">model + optimizer shards</text>
  </g>
  <g stroke="#52606D" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M860 241 H890"/><path d="M995 277 V330"/><path d="M890 366 H860"/><path d="M755 402 V455"/><path d="M860 491 H890"/></g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52606D"/></marker></defs>
  <rect x="650" y="575" width="450" height="90" rx="14" fill="#FFF7F4" stroke="#C0392B" stroke-width="2"/>
  <text x="875" y="608" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C0392B">Audit question</text>
  <text x="875" y="633" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#52606D">Which boundary changed?</text>
  <text x="875" y="657" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#52606D">Where did range, ulp or reduction error enter?</text>
  <text x="600" y="758" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#52606D">Textbook schematic — formats define possibilities; the actual kernel and state policy define the training computation.</text>
</svg>
