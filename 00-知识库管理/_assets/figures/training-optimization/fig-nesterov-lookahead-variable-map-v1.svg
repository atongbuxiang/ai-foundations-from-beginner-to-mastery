<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Nesterov 外推点与 buffer 实现的变量映射</title>
  <desc id="desc">左侧展示基础迭代点沿速度外推到求梯度点，右侧把框架参数定义为外推点后得到当前梯度加动量缓冲区的更新，并标出等价所需的常参数条件。</desc>
  <rect width="1200" height="660" fill="#FFFEFB"/>
  <style>.sans{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.mono{font-family:"SFMono-Regular",Menlo,monospace}.ink{fill:#1F2937}.muted{fill:#64748B}.blue{fill:#2563EB}.green{fill:#0F766E}.amber{fill:#B7791F}.red{fill:#C24135}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563EB"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0F766E"/></marker></defs>
  <text x="52" y="58" class="sans blue" font-size="23" font-weight="700">A｜几何变量：先外推，再求梯度</text>
  <text x="52" y="90" class="sans muted" font-size="17">gradient evaluation point 不是 base iterate</text>
  <path d="M74 354 C180 178 382 155 530 326" fill="none" stroke="#D7DEE8" stroke-width="3"/><path d="M70 409 C212 237 407 244 535 412" fill="none" stroke="#D7DEE8" stroke-width="3"/>
  <circle cx="168" cy="318" r="13" fill="#1F2937"/><circle cx="340" cy="237" r="13" fill="#2563EB"/>
  <line x1="181" y1="312" x2="326" y2="244" stroke="#2563EB" stroke-width="4" marker-end="url(#a)"/>
  <text x="168" y="357" class="mono ink" font-size="19" text-anchor="middle">x_t</text><text x="340" y="213" class="mono blue" font-size="19" text-anchor="middle">y_t = x_t + μ v_t</text>
  <path d="M340 237 L428 342" stroke="#0F766E" stroke-width="4" marker-end="url(#g)"/>
  <text x="430" y="380" class="mono green" font-size="18" text-anchor="middle">−η ∇f(y_t)</text>
  <text x="52" y="470" class="sans ink" font-size="18">Heavy-ball 在 x_t 求梯度；NAG 在 y_t 求梯度。</text>

  <line x1="600" y1="48" x2="600" y2="506" stroke="#D7DEE8" stroke-width="2"/>
  <text x="650" y="58" class="sans green" font-size="23" font-weight="700">B｜实现变量：令 p_t ≡ y_t</text>
  <text x="650" y="90" class="sans muted" font-size="17">外推被吸收到 parameter 的定义</text>
  <rect x="652" y="140" width="466" height="78" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="885" y="187" class="mono ink" font-size="20" text-anchor="middle">b_(t+1) = μ b_t + g_t,　g_t = ∇f(p_t)</text>
  <rect x="652" y="262" width="466" height="78" fill="#E8F5F1" stroke="#0F766E" stroke-width="2.5"/>
  <text x="885" y="309" class="mono green" font-size="20" text-anchor="middle">p_(t+1) = p_t − η(g_t + μ b_(t+1))</text>
  <line x1="885" y1="218" x2="885" y2="258" stroke="#0F766E" stroke-width="3" marker-end="url(#g)"/>
  <text x="885" y="398" class="sans ink" font-size="18" text-anchor="middle">“当前点”是 p_t，也就是左侧的 look-ahead point y_t</text>
  <text x="885" y="444" class="mono amber" font-size="18" text-anchor="middle">b_t = −v_t/η</text>
  <line x1="52" y1="526" x2="1148" y2="526" stroke="#0F766E" stroke-width="3"/>
  <text x="52" y="568" class="sans green" font-size="18" font-weight="700">等价门</text><text x="150" y="568" class="sans ink" font-size="17">常 η　｜　常 μ　｜　无 dampening　｜　正确初始化与索引</text>
  <text x="52" y="616" class="sans red" font-size="17">变量名相同不代表对象相同；开启变化 LR 或修改 buffer 语义后必须重新推导。</text>
</svg>
