<title id="title">训练 Telemetry 的时钟与六本账</title><desc id="desc">五个训练时钟对齐六类数据、目标、梯度、更新、激活和系统记录，并以三级采集控制观测开销。</desc><style>text{font-family:Inter, PingFang SC, Noto Sans CJK SC, sans-serif;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2937"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker></defs><rect width="1200" height="690" fill="#FFFEFB"/><text x="66" y="55" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">同一事件，五个时钟</text><line x1="250" y1="72" x2="1130" y2="72" stroke="#D7DEE8" stroke-width="1.5" stroke-dasharray="" marker-end=""/><circle cx="290" cy="92" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="290" y="119" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="650" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">wall</text><text x="290" y="143" font-family="SFMono-Regular, Consolas, monospace" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">10:31:08</text><circle cx="468" cy="92" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="468" y="119" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="650" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">micro</text><text x="468" y="143" font-family="SFMono-Regular, Consolas, monospace" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">48012</text><circle cx="646" cy="92" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="646" y="119" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="650" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">update</text><text x="646" y="143" font-family="SFMono-Regular, Consolas, monospace" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">12003</text><circle cx="824" cy="92" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="824" y="119" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="650" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">token</text><text x="824" y="143" font-family="SFMono-Regular, Consolas, monospace" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">8.6B</text><circle cx="1002" cy="92" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><text x="1002" y="119" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="650" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">schedule</text><text x="1002" y="143" font-family="SFMono-Regular, Consolas, monospace" font-size="17" font-weight="400" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">warmup→stable</text><line x1="290" y1="92" x2="1002" y2="92" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="" marker-end=""/><text x="66" y="190" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">六本账沿同一 step 对齐</text><rect x="72" y="222" width="1040" height="46" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" stroke-dasharray=""/><text x="104" y="251" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#2563EB" text-anchor="start" dominant-baseline="alphabetic">数据</text><text x="250" y="251" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">token IDs · length · mask</text><line x1="720" y1="245" x2="1070" y2="245" stroke="#D7DEE8" stroke-width="1.8" stroke-dasharray="" marker-end=""/><circle cx="880" cy="245" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/><rect x="72" y="286" width="1040" height="46" rx="0" fill="#F8FAFC" stroke="#1F2937" stroke-width="1.8" stroke-dasharray=""/><text x="104" y="315" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">目标</text><text x="250" y="315" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">loss numerator / denominator</text><line x1="720" y1="309" x2="1070" y2="309" stroke="#D7DEE8" stroke-width="1.8" stroke-dasharray="" marker-end=""/><circle cx="935" cy="309" r="5" fill="#1F2937" stroke="#1F2937" stroke-width="2"/><rect x="72" y="350" width="1040" height="46" rx="0" fill="#FEF2F2" stroke="#C24135" stroke-width="1.8" stroke-dasharray=""/><text x="104" y="379" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#C24135" text-anchor="start" dominant-baseline="alphabetic">梯度</text><text x="250" y="379" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">RMS · amax · nonfinite · clip</text><line x1="720" y1="373" x2="1070" y2="373" stroke="#D7DEE8" stroke-width="1.8" stroke-dasharray="" marker-end=""/><circle cx="990" cy="373" r="5" fill="#C24135" stroke="#C24135" stroke-width="2"/><rect x="72" y="414" width="1040" height="46" rx="0" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.8" stroke-dasharray=""/><text x="104" y="443" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#B7791F