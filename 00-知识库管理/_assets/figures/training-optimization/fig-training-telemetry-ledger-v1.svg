PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#2563EB" text-anchor="start" dominant-baseline="alphabetic">L0 每步标量</text><line x1="205" y1="620" x2="350" y2="620" stroke="#2563EB" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="380" y="626" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#0F766E" text-anchor="start" dominant-baseline="alphabetic">L1 低频分层</text><line x1="525" y1="620" x2="670" y2="620" stroke="#0F766E" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="700" y="626" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#C24135" text-anchor="start" dominant-baseline="alphabetic">L2 告警后窄窗重诊断</text><text x="72" y="661" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="alphabetic">先对齐时钟，再比较 first-change time；先后顺序仍不是因果证明。</text></svg>
