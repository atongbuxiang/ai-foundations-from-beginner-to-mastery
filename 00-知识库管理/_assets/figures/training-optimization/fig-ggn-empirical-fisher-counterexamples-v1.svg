<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">GGN、Fisher 与 empirical Fisher 的三类反例</title>
  <desc id="desc">三个最小例子分别展示 GGN 遗漏模型负曲率、empirical Fisher 在样本最优点塌缩，以及 batch-mean outer product 与 per-sample second moment 不同。</desc>
  <rect width="1200" height="720" fill="#FFFEFB"/>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#0F172A}.h{font-size:27px;font-weight:700}.sh{font-size:19px;font-weight:700}.b{font-size:16px}.s{font-size:15px;fill:#64748B}.boxb{fill:#EEF4FF;stroke:#2563EB;stroke-width:2}.boxg{fill:#ECF7F4;stroke:#0F766E;stroke-width:2}.boxa{fill:#FFF6E5;stroke:#B76E00;stroke-width:2}.boxr{fill:#FFF1F0;stroke:#C0392B;stroke-width:2}.line{stroke:#CBD5E1;stroke-width:2}</style>
  <text x="48" y="50" class="h" fill="#C0392B">三张最小证书：逐个删除错误等号</text>
  <rect x="48" y="84" width="344" height="490" rx="14" class="boxr"/>
  <text x="72" y="124" class="sh" fill="#C0392B">A｜GGN 漏掉模型二阶曲率</text>
  <text x="72" y="166" class="b">f(theta)=theta²</text><text x="72" y="198" class="b">L=1/2 (theta²-1)²</text>
  <line x1="72" y1="222" x2="368" y2="222" class="line"/>
  <text x="72" y="260" class="b">GGN = 4 theta²</text><text x="72" y="296" class="b">H = 6 theta² - 2</text>
  <rect x="72" y="326" width="296" height="112" rx="10" fill="#FFFFFF" stroke="#C0392B"/>
  <text x="96" y="364" class="sh">at theta=0</text><text x="96" y="400" class="b">GGN = 0；H = -2</text><text x="96" y="427" class="s">negative curvature was deleted</text>
  <text x="72" y="488" class="s">结论：PSD 不代表保留</text><text x="72" y="516" class="s">objective 的全部二阶结构。</text>

  <rect x="428" y="84" width="344" height="490" rx="14" class="boxa"/>
  <text x="452" y="124" class="sh" fill="#B76E00">B｜Empirical Fisher 可塌缩</text>
  <text x="452" y="166" class="b">y ~ Normal(theta, 1)</text><text x="452" y="198" class="b">NLL = 1/2 (theta-y)²</text>
  <line x1="452" y1="222" x2="748" y2="222" class="line"/>
  <text x="452" y="260" class="b">H = GGN = true F = 1</text><text x="452" y="296" class="b">F_emp = (theta-y)²</text>
  <rect x="452" y="326" width="296" height="112" rx="10" fill="#FFFFFF" stroke="#B76E00"/>
  <text x="476" y="364" class="sh">at theta=y</text><text x="476" y="400" class="b">F_emp = 0；F = 1</text><text x="476" y="427" class="s">observed label ≠ model sample</text>
  <text x="452" y="488" class="s">结论：同为 score outer product，</text><text x="452" y="516" class="s">期望测度不同就不是同一矩阵。</text>

  <rect x="808" y="84" width="344" height="490" rx="14" class="boxb"/>
  <text x="832" y="124" class="sh" fill="#2563EB">C｜Reduction 改变对象与 rank</text>
  <text x="832" y="166" class="b">per-sample gradients: +1, -1</text>
  <line x1="832" y1="196" x2="1128" y2="196" class="line"/>
  <rect x="832" y="228" width="296" height="94" rx="10" class="boxg"/>
  <text x="856" y="266" class="b">mean(g_i²) = 1</text><text x="856" y="296" class="s">per-sample second moment</text>
  <rect x="832" y="346" width="296" height="94" rx="10" class="boxr"/>
  <text x="856" y="384" class="b">mean(g_i)² = 0</text><text x="856" y="414" class="s">batch-mean outer product</text>
  <text x="832" y="488" class="s">结论：先 mean 再 outer product</text><text x="832" y="516" class="s">会加入交叉项并压低 rank。</text>
  <rect x="48" y="620" width="1104" height="76" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="72" y="654" class="sh">使用规则</text><text x="230" y="654" class="b">先写 derivative object、label law、reduction，再谈 curvature quality；变量名不构成证据。</text><text x="72" y="683" class="s">这些反例证明“不无条件相等”，并不证明 GGN 或 gradient second moment 永远无用。</text>
</svg>
