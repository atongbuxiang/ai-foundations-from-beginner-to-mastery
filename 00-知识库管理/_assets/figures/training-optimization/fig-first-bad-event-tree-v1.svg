<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">训练失败的 first-bad-event 决策树</title><desc id="desc">先在 checkpoint 时间轴二分，再沿数据、前向、反向、更新与系统边界定位，最后用四格反事实验证修复。</desc><style>text{font-family:Inter, PingFang SC, Noto Sans CJK SC, sans-serif;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2937"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker></defs><rect width="1200" height="710" fill="#FFFEFB"/><text x="66" y="54" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">时间二分：正常边界 → 第一异常步</text><line x1="92" y1="103" x2="1110" y2="103" stroke="#1F2937" stroke-width="2.8" stroke-dasharray="" marker-end=""/><circle cx="130" cy="103" r="9" fill="#0F766E" stroke="#0F766E" stroke-width="2"/><text x="130" y="137" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="650" fill="#0F766E" text-anchor="middle" dominant-baseline="alphabetic">ckpt 12k</text><circle cx="390" cy="103" r="9" fill="#0F766E" stroke="#0F766E" stroke-width="2"/><text x="390" y="137" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="650" fill="#0F766E" text-anchor="middle" dominant-baseline="alphabetic">18k</text><circle cx="650" cy="103" r="9" fill="#B7791F" stroke="#B7791F" stroke-width="2"/><text x="650" y="137" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="650" fill="#B7791F" text-anchor="middle" dominant-baseline="alphabetic">21k ?</text><circle cx="910" cy="103" r="9" fill="#C24135" stroke="#C24135" stroke-width="2"/><text x="910" y="137" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="650" fill="#C24135" text-anchor="middle" dominant-baseline="alphabetic">22.5k</text><circle cx="1080" cy="103" r="9" fill="#C24135" stroke="#C24135" stroke-width="2"/><text x="1080" y="137" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="650" fill="#C24135" text-anchor="middle" dominant-baseline="alphabetic">loss NaN</text><path d="M 390 83 Q 650 20 910 83" fill="none" stroke="#B7791F" stroke-width="2.5" stroke-dasharray="7 6" marker-end="" stroke-linejoin="round" stroke-linecap="round"/><text x="650" y="38" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#B7791F" text-anchor="middle" dominant-baseline="alphabetic">checkpoint replay：O(log interval)</text><text x="66" y="190" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">在哪一道合同边界首次违约？</text><circle cx="125" cy="255" r="38" fill="#FFFEFB" stroke="#2563EB" stroke-width="3"/><text x="125" y="251" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="750" fill="#2563EB" text-anchor="middle" dominant-baseline="alphabetic">1</text><text x="125" y="283" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">数据</text><line x1="165" y1="255" x2="298" y2="255" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="125" y="326" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">ID · mask · target</text><circle cx="340" cy="255" r="38" fill="#FFFEFB" stroke="#2563EB" stroke-width="3"/><text x="340" y="251" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="750" fill="#2563EB" text-anchor="middle" dominant-baseline="alphabetic">2</text><text x="340" y="283" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">前向</text><line x1="380" y1="255" x2="513" y2="255" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="340" y="326" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">activation · loss</text><circle cx="555" cy="255" r="38" fill="#FFFEFB" stroke="#C24135" stroke-width="3"/><text x="555" y="251" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="750" fill="#C24135" text-anchor="middle" dominant-baseline="alphabetic">3</text><text x="555" y="283" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">反向</text><line x1="595" y1="255" x2="728" y2="255" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="555" y="326" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">gradient · scale</text><circle cx="770" cy="255" r="38" fill="#FFFEFB" stroke="#B7791F" stroke-width="3"/><text x="770" y="251" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="750" fill="#B7791F" text-anchor="middle" dominant-baseline="alphabetic">4</text><text x="770" y="283" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">更新</text><line x1="810" y1="255" x2="943" y2="255" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="770" y="326" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">state · actual delta</text><circle cx="985" cy="255" r="38" fill="#FFFEFB" stroke="#B7791F" stroke-width="3"/><text x="985" y="251" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="750" fill="#B7791F" text-anchor="middle" dominant-baseline="alphabetic">5</text><text x="985" y="283" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="middle" dominant-baseline="alphabetic">系统</text><text x="985" y="326" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="alphabetic">rank · collective</text><line x1="555" y1="340" x2="555" y2="388" stroke="#C24135" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><text x="555" y="379" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#C24135" text-anchor="middle" dominant-baseline="alphabetic">first bad event</text><text x="66" y="430" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">候选修复必须通过四格反事实</text><rect x="90" y="470" width="445" height="72" rx="0" fill="#FEF2F2" stroke="#C24135" stroke-width="2" stroke-dasharray=""/><text x="108" y="497" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="750" fill="#C24135" text-anchor="start" dominant-baseline="alphabetic">Replay A</text><text x="240" y="497" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">原配置 + 触发 batch</text><text x="240" y="524" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="650" fill="#C24135" text-anchor="start" dominant-baseline="alphabetic">→ 应复现</text><rect x="590" y="470" width="445" height="72" rx="0" fill="#ECFDF5" stroke="#0F766E" stroke-width="2" stroke-dasharray=""/><text x="608" y="497" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="750" fill="#0F766E" text-anchor="start" dominant-baseline="alphabetic">Replay B</text><text x="740" y="497" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">候选修复 + 触发 batch</text><text x="740" y="524" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="650" fill="#0F766E" text-anchor="start" dominant-baseline="alphabetic">→ 异常消失</text><rect x="90" y="570" width="445" height="72" rx="0" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" stroke-dasharray=""/><text x="108" y="597" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="750" fill="#2563EB" text-anchor="start" dominant-baseline="alphabetic">Control C</text><text x="240" y="597" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">原配置 + 对照 batch</text><text x="240" y="624" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="650" fill="#2563EB" text-anchor="start" dominant-baseline="alphabetic">→ 不故障</text><rect x="590" y="570" width="445" height="72" rx="0" fill="#FFFBEB" stroke="#B7791F" stroke-width="2" stroke-dasharray=""/><text x="608" y="597" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="750" fill="#B7791F" text-anchor="start" dominant-baseline="alphabetic">Quality D</text><text x="740" y="597" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start" dominant-baseline="alphabetic">修复 + 正常数据流</text><text x="740" y="624" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="650" fill="#B7791F" text-anchor="start" dominant-baseline="alphabetic">→ 质量/成本不过界</text><text x="90" y="680" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="alphabetic">“不再 NaN”只表示止血；复现 + 对照 + 质量门共同支持修复。</text></svg>
