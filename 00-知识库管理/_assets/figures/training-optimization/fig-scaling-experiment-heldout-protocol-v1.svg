<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Held-out-scale experimental protocol and uncertainty map</title>
  <desc id="desc">A left-to-right evidence pipeline separates calibration, function selection, held-out scales, and decision validation while four uncertainty sources feed a prediction interval.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#52606D"/></marker>
  </defs>
  <rect width="1200" height="800" fill="#FFFEFB"/>
  <text x="60" y="60" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172033">Scaling evidence flows one way: target information never returns to model choice</text>
  <text x="60" y="94" font-family="Arial,sans-serif" font-size="17" fill="#52606D">Split by scale blocks, propagate four uncertainty sources, and validate the final resource decision.</text>
  <rect x="50" y="130" width="1100" height="580" rx="20" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
  <text x="80" y="172" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172033">A  Scale ladder and allowed information flow</text>
  <rect x="80" y="210" width="230" height="120" rx="14" fill="#EAF1FF" stroke="#2563EB" stroke-width="3"/>
  <text x="195" y="245" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#2563EB">Calibration scales</text>
  <text x="195" y="272" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">fit parameters</text>
  <text x="195" y="297" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">N1 · N2 · N3 · N4</text>
  <rect x="355" y="210" width="230" height="120" rx="14" fill="#E9F7F4" stroke="#0F766E" stroke-width="3"/>
  <text x="470" y="245" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#0F766E">Validation scales</text>
  <text x="470" y="272" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">choose function / window</text>
  <text x="470" y="297" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">N5 · N6</text>
  <rect x="630" y="210" width="230" height="120" rx="14" fill="#FFF4DE" stroke="#B76E00" stroke-width="3"/>
  <text x="745" y="245" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#B76E00">Held-out scales</text>
  <text x="745" y="272" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">one locked prediction test</text>
  <text x="745" y="297" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">N7 · N8</text>
  <rect x="905" y="210" width="210" height="120" rx="14" fill="#FBECEC" stroke="#C0392B" stroke-width="3"/>
  <text x="1010" y="245" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#C0392B">Decision trial</text>
  <text x="1010" y="272" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">allocation + regret</text>
  <text x="1010" y="297" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">cost and failure gates</text>
  <line x1="310" y1="270" x2="345" y2="270" stroke="#52606D" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="585" y1="270" x2="620" y2="270" stroke="#52606D" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="860" y1="270" x2="895" y2="270" stroke="#52606D" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M745 205 C690 145, 510 145, 470 205" fill="none" stroke="#C0392B" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="610" y="150" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#C0392B">forbidden: target feedback into function selection</text>
  <text x="80" y="390" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172033">B  Four uncertainty sources feed the prediction interval</text>
  <rect x="80" y="430" width="205" height="85" rx="12" fill="#EAF1FF" stroke="#2563EB" stroke-width="2"/>
  <text x="183" y="462" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#2563EB">Evaluation</text>
  <text x="183" y="489" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">documents / finite tokens</text>
  <rect x="310" y="430" width="205" height="85" rx="12" fill="#E9F7F4" stroke="#0F766E" stroke-width="2"/>
  <text x="413" y="462" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#0F766E">Training seeds</text>
  <text x="413" y="489" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">init / order / systems</text>
  <rect x="540" y="430" width="205" height="85" rx="12" fill="#FFF4DE" stroke="#B76E00" stroke-width="2"/>
  <text x="643" y="462" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#B76E00">Fit parameters</text>
  <text x="643" y="489" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">E, A, alpha covariance</text>
  <rect x="770" y="430" width="205" height="85" rx="12" fill="#FBECEC" stroke="#C0392B" stroke-width="2"/>
  <text x="873" y="462" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#C0392B">Function family</text>
  <text x="873" y="489" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">offset / correction / broken</text>
  <rect x="810" y="570" width="285" height="90" rx="14" fill="#FFFFFF" stroke="#172033" stroke-width="3"/>
  <text x="953" y="603" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#172033">Target prediction interval</text>
  <text x="953" y="632" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">coverage + error + decision regret</text>
  <line x1="183" y1="515" x2="835" y2="585" stroke="#52606D" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="413" y1="515" x2="865" y2="575" stroke="#52606D" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="643" y1="515" x2="905" y2="568" stroke="#52606D" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="873" y1="515" x2="940" y2="560" stroke="#52606D" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="560" width="610" height="100" rx="14" fill="#FFFFFF" stroke="#52606D" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="385" y="592" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#172033">Block bootstrap hierarchy</text>
  <text x="385" y="620" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#52606D">scale cell → seed → evaluation document</text>
  <text x="385" y="644" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#C0392B">checkpoints from one run are not independent seeds</text>
  <text x="600" y="758" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#52606D">Textbook protocol — a green interpolation fit cannot substitute for a locked held-out-scale prediction.</text>
</svg>
