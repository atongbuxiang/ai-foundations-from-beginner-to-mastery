<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">梯度裁剪的对象、顺序与估计器偏差</title>
  <desc id="desc">比较全局、逐层与自适应梯度裁剪，说明平均与裁剪不可交换，并给出裁剪导致期望方向反转的一维例子。</desc>
  <rect width="1200" height="800" fill="#FFFEFB"/>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#0F172A}.h{font-size:27px;font-weight:700}.sh{font-size:18px;font-weight:700}.b{font-size:14px}.s{font-size:12.5px;fill:#64748B}.bb{fill:#EEF4FF;stroke:#2563EB;stroke-width:2}.bg{fill:#ECF7F4;stroke:#0F766E;stroke-width:2}.ba{fill:#FFF6E5;stroke:#B76E00;stroke-width:2}.br{fill:#FFF1F0;stroke:#C0392B;stroke-width:2}.line{stroke:#CBD5E1;stroke-width:2}.arr{stroke:#2563EB;stroke-width:3;fill:none}.dash{stroke:#94A3B8;stroke-width:2;stroke-dasharray:7 6}</style>
  <defs><marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2563EB"/></marker></defs>
  <text x="48" y="48" class="h" fill="#2563EB">梯度裁剪不是“一个开关”，而是一条带对象与顺序的估计器</text>

  <rect x="48" y="86" width="338" height="410" rx="14" class="bb"/>
  <text x="72" y="124" class="sh">① 先平均还是先裁剪？</text>
  <text x="72" y="156" class="s">非线性投影破坏交换律</text>
  <rect x="72" y="190" width="286" height="78" rx="10" fill="#FFFFFF" stroke="#2563EB"/>
  <text x="92" y="222" class="b">A：clip( meanᵢ gᵢ )</text>
  <text x="92" y="248" class="s">聚合后裁剪：约束全局更新</text>
  <rect x="72" y="292" width="286" height="78" rx="10" fill="#FFFFFF" stroke="#0F766E"/>
  <text x="92" y="324" class="b">B：meanᵢ clip(gᵢ)</text>
  <text x="92" y="350" class="s">样本/设备先裁剪：改变估计器</text>
  <text x="138" y="408" class="sh" fill="#C0392B">A ≠ B</text>
  <text x="72" y="442" class="s">分布式训练必须记录裁剪发生在哪一层聚合之前/之后</text>
  <text x="72" y="470" class="s">microbatch · accumulation · all-reduce · optimizer</text>

  <rect x="431" y="86" width="338" height="410" rx="14" class="bg"/>
  <text x="455" y="124" class="sh">② 约束什么几何对象？</text>
  <rect x="455" y="160" width="290" height="66" rx="10" class="bb"/>
  <text x="477" y="187" class="b">全局范数：g ← min(1, τ/||g||)g</text>
  <text x="477" y="211" class="s">所有参数共享一个缩放因子</text>
  <rect x="455" y="244" width="290" height="66" rx="10" class="ba"/>
  <text x="477" y="271" class="b">逐层范数：每层单独投影</text>
  <text x="477" y="295" class="s">改变层间相对方向与贡献</text>
  <rect x="455" y="328" width="290" height="78" rx="10" class="bg"/>
  <text x="477" y="355" class="b">AGC：||gᵢ|| ≤ λ max(||wᵢ||, ε)</text>
  <text x="477" y="381" class="s">阈值依赖权重尺度与 unit 轴</text>
  <line x1="477" y1="440" x2="551" y2="440" class="arr" marker-end="url(#ab)"/>
  <text x="455" y="470" class="s">grad → clip → momentum/Adam state → update</text>
  <text x="570" y="444" class="b" fill="#C0392B">顺序也是算法</text>

  <rect x="814" y="86" width="338" height="410" rx="14" class="br"/>
  <text x="838" y="124" class="sh">③ 裁剪可反转期望方向</text>
  <text x="838" y="157" class="s">一维随机梯度：阈值 τ = 1</text>
  <line x1="850" y1="235" x2="1118" y2="235" class="line"/>
  <line x1="984" y1="196" x2="984" y2="274" class="dash"/>
  <circle cx="1104" cy="235" r="11" fill="#2563EB"/>
  <text x="1042" y="208" class="b">+10，p=0.1</text>
  <circle cx="945" cy="235" r="11" fill="#C0392B"/>
  <text x="856" y="264" class="b">−1，p=0.9</text>
  <rect x="838" y="302" width="290" height="66" rx="10" fill="#FFFFFF" stroke="#2563EB"/>
  <text x="860" y="330" class="b">裁剪前：E[g] = 0.1 &gt; 0</text>
  <text x="860" y="354" class="s">稀有大正梯度略占优势</text>
  <rect x="838" y="386" width="290" height="66" rx="10" fill="#FFFFFF" stroke="#C0392B"/>
  <text x="860" y="414" class="b">裁剪后：E[clip(g)] = −0.8</text>
  <text x="860" y="438" class="s">期望符号反转：偏差不是小修正</text>

  <text x="48" y="552" class="h" fill="#0F766E">最小诊断账：强度、频率、方向与状态必须同时观测</text>
  <rect x="48" y="590" width="252" height="118" rx="12" class="bb"/>
  <text x="72" y="626" class="sh">触发率</text><text x="72" y="658" class="b">P(||g|| &gt; τ)</text><text x="72" y="685" class="s">按 step、层和 unit 统计</text>
  <rect x="332" y="590" width="252" height="118" rx="12" class="bg"/>
  <text x="356" y="626" class="sh">缩放率</text><text x="356" y="658" class="b">min(1, τ/||g||)</text><text x="356" y="685" class="s">报告分位数而非只报均值</text>
  <rect x="616" y="590" width="252" height="118" rx="12" class="ba"/>
  <text x="640" y="626" class="sh">方向偏移</text><text x="640" y="658" class="b">cos(g, gclip)</text><text x="640" y="685" class="s">逐层裁剪尤其需要</text>
  <rect x="900" y="590" width="252" height="118" rx="12" class="br"/>
  <text x="924" y="626" class="sh">状态污染</text><text x="924" y="658" class="b">mₜ、vₜ 在裁剪前后何时更新</text><text x="924" y="685" class="s">checkpoint 必须保存定义</text>
  <rect x="48" y="752" width="1104" height="30" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="72" y="772" class="s">边界：裁剪可抑制极端更新，但不自动证明稳定、无偏或泛化更好。</text>
</svg>
