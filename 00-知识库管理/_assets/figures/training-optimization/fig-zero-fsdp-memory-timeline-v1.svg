<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ZeRO and FSDP memory timeline</title>
  <desc id="desc">The diagram distinguishes steady sharded state from transient full-parameter materialization, activation peaks and offload transfer stalls along a training-step timeline.</desc>
  <rect width="1200" height="800" fill="#FFFEFB"/>
  <text x="60" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172033">Sharded steady state is not peak memory</text>
  <text x="60" y="91" font-family="Arial,sans-serif" font-size="17" fill="#52606D">Peak is the maximum over the execution timeline: persistent shards + transient gathers + live activations + allocator workspace.</text>
  <rect x="45" y="125" width="400" height="590" rx="18" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
  <rect x="470" y="125" width="685" height="590" rx="18" fill="#FFFFFF" stroke="#D9E0E7" stroke-width="2"/>
  <text x="70" y="166" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172033">A  Persistent model-state ledger</text>
  <g font-family="Arial,sans-serif">
    <text x="75" y="213" font-size="16" fill="#52606D">Illustrative mixed-precision Adam: 16N bytes</text>
    <rect x="85" y="245" width="300" height="80" fill="#EAF2FF" stroke="#FFFFFF" stroke-width="2"/><text x="235" y="278" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">parameters + gradients</text><text x="235" y="305" text-anchor="middle" font-size="15" fill="#52606D">2N + 2N bytes</text>
    <rect x="85" y="325" width="300" height="80" fill="#E8F6F3" stroke="#FFFFFF" stroke-width="2"/><text x="235" y="358" text-anchor="middle" font-size="18" font-weight="700" fill="#0F766E">FP32 master weights</text><text x="235" y="385" text-anchor="middle" font-size="15" fill="#52606D">4N bytes</text>
    <rect x="85" y="405" width="300" height="160" fill="#FFF3D6" stroke="#FFFFFF" stroke-width="2"/><text x="235" y="468" text-anchor="middle" font-size="18" font-weight="700" fill="#B76E00">Adam m and v</text><text x="235" y="498" text-anchor="middle" font-size="15" fill="#52606D">8N bytes</text>
    <rect x="85" y="595" width="300" height="65" rx="12" fill="#F1F3F5"/><text x="235" y="622" text-anchor="middle" font-size="16" font-weight="700" fill="#172033">ZeRO-3/FSDP steady ≈ 16N/P</text><text x="235" y="647" text-anchor="middle" font-size="15" fill="#52606D">before padding, metadata and buffers</text>
  </g>
  <text x="495" y="166" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172033">B  One rank across a wrapped-layer timeline</text>
  <line x1="530" y1="625" x2="1110" y2="625" stroke="#52606D" stroke-width="2"/>
  <line x1="530" y1="625" x2="530" y2="215" stroke="#52606D" stroke-width="2"/>
  <text x="820" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52606D">forward → backward → optimizer</text>
  <text x="497" y="420" text-anchor="middle" transform="rotate(-90 497 420)" font-family="Arial,sans-serif" font-size="17" fill="#52606D">live bytes</text>
  <path d="M540 580 H620 V385 H710 V540 H790 V315 H900 V500 H980 V580 H1095" fill="#EAF2FF" stroke="#2563EB" stroke-width="3"/>
  <path d="M540 580 H1095" stroke="#0F766E" stroke-width="9"/>
  <rect x="620" y="385" width="90" height="195" fill="#FFF3D6" opacity="0.75"/><text x="665" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#B76E00">gather L1</text>
  <rect x="790" y="315" width="110" height="265" fill="#FFF7F4" opacity="0.70"/><text x="845" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#C0392B">peak: gather + acts</text>
  <text x="547" y="565" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0F766E">persistent shards</text>
  <line x1="530" y1="315" x2="1110" y2="315" stroke="#C0392B" stroke-width="2" stroke-dasharray="8 7"/><text x="1095" y="300" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#C0392B">peak = max over time M(t)</text>
  <g font-family="Arial,sans-serif" font-size="15" fill="#52606D"><text x="575" y="650">idle</text><text x="665" y="650">FWD L1</text><text x="845" y="650">BWD L1</text><text x="1015" y="650">step</text></g>
  <rect x="535" y="205" width="545" height="58" rx="10" fill="#F1F3F5"/><text x="807" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172033">checkpointing lowers saved activations but adds recompute</text><text x="807" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#52606D">offload lowers device residency but adds transfer to the critical path</text>
  <text x="60" y="760" font-family="Arial,sans-serif" font-size="15" fill="#52606D">A memory claim needs a time trace: when each object appears, how long it stays live, which buffers overlap, and what the allocator reserves.</text>
</svg>
