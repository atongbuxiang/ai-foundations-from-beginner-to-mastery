<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Dropout 解释地图：方差、显式正则与 Bayesian 近似</title>
<desc id="desc">同一训练算子可从二阶矩、expected noisy risk 与变分近似三个层级研究；层级之间有条件桥梁，不能把启发性共适应叙述直接升级为 posterior 定理。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">随机输入的完整 variance 账</text>
<rect x="52" y="98" width="310" height="78" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="207" y="128" font-size="18" font-weight="700" text-anchor="middle" fill="#2563EB">E[y] = μ</text>
<text x="207" y="157" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">y = (m/q) x</text>
<line x1="207" y1="185" x2="207" y2="216" stroke="#1F2937" stroke-width="2.1" marker-end="url(#a3)"/>
<rect x="52" y="226" width="310" height="92" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="207" y="257" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">Var(y) = (σ² + p μ²) / q</text>
<text x="207" y="289" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">mask noise + data variation</text>
<rect x="52" y="364" width="310" height="106" rx="5" fill="#FFFBEB" stroke="#B7791F" stroke-width="2"/>
<text x="207" y="394" font-size="16" font-weight="700" text-anchor="middle" fill="#B7791F">linear score u = wᵀy</text>
<text x="207" y="424" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">Var(u | x) = (p/q) Σ wᵢ²xᵢ²</text>
<text x="207" y="453" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">shared masks also create covariance</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">平方损失中的精确 penalty</text>
<rect x="445" y="100" width="315" height="72" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="602" y="128" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">prediction = wᵀ[(m/q)⊙x]</text>
<text x="602" y="156" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">target = t</text>
<line x1="602" y1="181" x2="602" y2="216" stroke="#1F2937" stroke-width="2.1" marker-end="url(#a3)"/>
<rect x="445" y="226" width="315" height="120" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="602" y="256" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">E[(t - wᵀy)²]</text>
<text x="602" y="288" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">= (t - wᵀx)²</text>
<text x="602" y="319" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">+ (p/q) Σ wᵢ²xᵢ²</text>
<rect x="445" y="394" width="315" height="88" rx="5" fill="#FFFBEB" stroke="#B7791F" stroke-width="2"/>
<text x="602" y="424" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F">exact here; GLM often local</text>
<text x="602" y="454" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">deep-network equivalence is not free</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Bayesian claim 的证据阶梯</text>
<rect x="846" y="94" width="284" height="54" rx="4" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.8"/>
<text x="988" y="128" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">1  stochastic predictor</text>
<line x1="988" y1="152" x2="988" y2="172" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="846" y="176" width="284" height="54" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="988" y="210" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">2  MC mean / variance</text>
<line x1="988" y1="234" x2="988" y2="254" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="846" y="258" width="284" height="54" rx="4" fill="#FFFEFB" stroke="#B7791F" stroke-width="1.8"/>
<text x="988" y="292" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F">3  specified variational family</text>
<line x1="988" y1="316" x2="988" y2="336" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="846" y="340" width="284" height="54" rx="4" fill="#FFFEFB" stroke="#C24135" stroke-width="1.8"/>
<text x="988" y="374" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">4  calibrated posterior claim</text>
<rect x="846" y="435" width="284" height="50" rx="4" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="988" y="466" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">more MC samples ≠ less model bias</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先说明研究层级：moment 恒等式、expected-risk penalty、变分近似或经验机制；不同证据不能越级互相替代。</text>
</svg>