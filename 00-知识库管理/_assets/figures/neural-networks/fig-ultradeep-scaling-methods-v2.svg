<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Ultra-Deep Scaling：ReZero、Fixup 与 DeepNorm</title>
<desc id="desc">三种方法都控制极深训练，却作用在不同位置：可学习 residual gate、无归一化分支初始化、Post-LN shortcut 与指定权重缩放。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">ReZero：零 gate 起步</text>
<rect x="52" y="100" width="310" height="84" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="207" y="132" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">x+ = x + alpha F(x)</text>
<text x="207" y="162" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">alpha(0)=0  =&gt;  J_x=I</text>
<rect x="52" y="226" width="310" height="104" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="207" y="257" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">dL/dalpha = g^T F(x)</text>
<text x="207" y="289" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">usually nonzero</text>
<text x="207" y="316" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">dL/dtheta = 0 at first step</text>
<text x="207" y="401" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">if F(x)=0 too: gate deadlock</text>
<text x="207" y="448" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">identity is a state-Jacobian claim</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Fixup：深度缩放初始化</text>
<rect x="445" y="98" width="315" height="90" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="602" y="129" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">non-last weights</text>
<text x="602" y="161" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">scale by L^[-1/(2m-2)]</text>
<rect x="445" y="230" width="315" height="92" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="602" y="261" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">last branch layer = 0</text>
<text x="602" y="292" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">plus scalar biases / multiplier</text>
<text x="602" y="373" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">m=2, L=100  =&gt;  scale=0.1</text>
<text x="602" y="422" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">not whole-network zero initialization</text>
<text x="602" y="452" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">no normalization in original method</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">DeepNorm：双尺度</text>
<rect x="845" y="96" width="285" height="92" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="987" y="127" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">LN(alpha x + G(x))</text>
<text x="987" y="159" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">alpha stays at runtime</text>
<rect x="845" y="226" width="285" height="104" rx="5" fill="#FFFBEB" stroke="#B7791F" stroke-width="2"/>
<text x="987" y="257" font-size="16" font-weight="700" text-anchor="middle" fill="#B7791F">encoder-only N</text>
<text x="987" y="287" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">alpha=(2N)^1/4</text>
<text x="987" y="312" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">beta=(8N)^-1/4</text>
<text x="987" y="389" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">N=100: alpha=3.761</text>
<text x="987" y="417" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">beta=0.188</text>
<text x="987" y="463" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">update bound != universal stability</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">方法名相近不等于可混搭：先标注 scale 作用对象、是否运行时存在、零梯度层级与理论假设。</text>
</svg>