<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Forward/Reverse AD：两种线性信息流与一份执行记录</title>
<desc id="desc">forward mode 让每个 primal 携带 tangent；reverse mode 先记录 tape，再从输出 seed 逆序回拉 cotangent；模式选择取决于输入与输出方向数。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Forward：双轨前推</text>
<rect x="60" y="120" width="92" height="50" rx="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="106" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">x</text>
<rect x="60" y="245" width="92" height="55" rx="7" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="106" y="278" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E" class="math">xdot</text>
<line x1="154" y1="145" x2="165" y2="145" stroke="#2563EB" stroke-width="2.7" marker-end="url(#a0)"/>
<line x1="154" y1="272" x2="165" y2="272" stroke="#0F766E" stroke-width="2.7" marker-end="url(#a1)"/>
<rect x="170" y="120" width="100" height="50" rx="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="220" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">u=f(x)</text>
<rect x="170" y="245" width="100" height="55" rx="7" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="220" y="278" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E" class="math">J_f xdot</text>
<line x1="272" y1="145" x2="285" y2="145" stroke="#2563EB" stroke-width="2.7" marker-end="url(#a0)"/>
<line x1="272" y1="272" x2="285" y2="272" stroke="#0F766E" stroke-width="2.7" marker-end="url(#a1)"/>
<rect x="290" y="120" width="100" height="50" rx="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="340" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">y=g(u)</text>
<rect x="290" y="245" width="100" height="55" rx="7" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="340" y="278" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E" class="math">J_g J_f xdot</text>
<rect x="62" y="370" width="285" height="92" rx="7" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="204" y="401" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">one input seed -&gt; one Jv</text>
<text x="204" y="431" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">no reverse tape required</text>
<text x="204" y="454" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">best when input directions are few</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Reverse：tape 逆序回拉</text>
