<rect x="535" y="125" width="100" height="50" rx="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="585.0" y="156" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">u, cache</text>
<line x1="639" y1="150" x2="645" y2="150" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<rect x="650" y="125" width="78" height="50" rx="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="689.0" y="156" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">L</text>
<text x="445" y="235" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">reverse cotangents</text>
<rect x="650" y="255" width="78" height="52" rx="7" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="689.0" y="287" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135" class="math">Lbar=1</text>
<line x1="645" y1="281" x2="640" y2="281" stroke="#C24135" stroke-width="2.7" marker-end="url(#a2)"/>
<rect x="535" y="255" width="100" height="52" rx="7" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="585.0" y="287" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135" class="math">ubar</text>
<line x1="530" y1="281" x2="528" y2="281" stroke="#C24135" stroke-width="2.7" marker-end="url(#a2)"/>
<rect x="445" y="255" width="78" height="52" rx="7" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="484.0" y="287" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135" class="math">xbar</text>
<rect x="445" y="370" width="310" height="92" rx="7" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600" y="401" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">one output seed -&gt; one u^T J</text>
<text x="600" y="431" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">stores or recomputes residuals</text>
<text x="600" y="454" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">best when output directions are few</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">模式选择看方向数</text>
<text x="845" y="105" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937">full Jacobian  J:[m,n]</text>
<rect x="845" y="130" width="285" height="174" rx="4" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="987" y1="130" x2="987" y2="304" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="845" y1="190" x2="1130" y2="190" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="845" y1="248" x2="1130" y2="248" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="916" y="168" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">method</text>
<text x="1058" y="168" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">sweeps</text>
<text x="916" y="227" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">forward</text>
<text x="1058" y="227" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">n seeds</text>
<text x="916" y="285" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">reverse</text>
<text x="1058" y="285" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">m seeds</text>
<rect x="845" y="330" width="285" height="60" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="366.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">scalar loss: m=1 -&gt; reverse</text>
<rect x="845" y="415" width="285" height="60" rx="8" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="987.5" y="451.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">few directions: use JVP/VJP actions</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">AD 精确传播程序 primitive 的导数规则；它既不是符号展开，也不是有限差分。</text>
</svg>