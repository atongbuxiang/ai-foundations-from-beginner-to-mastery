<title id="title">Padding、Mask 与 Special Tokens：同一 ID 的四份合同</title>
<desc id="desc">PAD row、attention edge、loss target 与 decoding stop 属于不同算子；special token 只是离散角色登记，不会自动生成全部 masks。词表变更还必须同步参数、optimizer 与 checkpoint。</desc>
