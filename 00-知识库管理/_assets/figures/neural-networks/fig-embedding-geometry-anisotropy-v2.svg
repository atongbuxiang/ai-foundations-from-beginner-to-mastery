<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Embedding Geometry：norm、angle、centering 与各向异性</title>
<desc id="desc">内积同时混合长度与夹角，cosine 删除正尺度但不平移不变；共同均值可抬高 pairwise cosine，centering 后仍要看 covariance spectrum 与任务。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三种相似度不是同一问题</text>
<text x="60" y="105" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937">a=(3,4), b=(4,3)</text>
<rect x="52" y="142" width="310" height="74" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="207" y="172" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">dot = 24</text>
<text x="207" y="198" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">uses norm and angle</text>
<rect x="52" y="244" width="310" height="74" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="207" y="274" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">cos = 24 / 25 = .96</text>
<text x="207" y="300" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">positive-scale invariant</text>
<rect x="52" y="346" width="310" height="74" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="207" y="376" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135">distance = sqrt(2)</text>
<text x="207" y="402" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">translation invariant</text>
<text x="207" y="470" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F">metric choice changes nearest neighbors</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">共同均值形成窄锥</text>
<line x1="470" y1="390" x2="748" y2="390" stroke="#D7DEE8" stroke-width="1.8"/>
<line x1="470" y1="390" x2="470" y2="100" stroke="#D7DEE8" stroke-width="1.8"/>
<line x1="470" y1="390" x2="720" y2="180" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<line x1="470" y1="390" x2="730" y2="245" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a0)"/>
<line x1="470" y1="390" x2="710" y2="305" stroke="#B7791F" stroke-width="2.5" marker-end="url(#a0)"/>
<line x1="470" y1="390" x2="735" y2="350" stroke="#C24135" stroke-width="2.5" marker-end="url(#a0)"/>
<text x="610" y="125" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2937">uncentered vectors</text>
<text x="610" y="420" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">large common mean -&gt; high cosine</text>
<rect x="445" y="448" width="315" height="46" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.8"/>
<text x="602" y="477" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">center first; then inspect covariance spectrum</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">变换不变性与诊断</text>
<rect x="845" y="94" width="285" height="58" rx="4" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.8"/>
<text x="860" y="118" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">orthogonal Q</text>
<text x="1115" y="137" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">dot / cos / dist</text>
<rect x="845" y="174" width="285" height="58" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="860" y="198" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">positive scale</text>
<text x="1115" y="217" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">cos only</text>
<rect x="845" y="254" width="285" height="58" rx="4" fill="#FFFEFB" stroke="#B7791F" stroke-width="1.8"/>
<text x="860" y="278" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">common shift</text>
<text x="1115" y="297" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">distance only</text>
<rect x="845" y="334" width="285" height="58" rx="4" fill="#FFFEFB" stroke="#C24135" stroke-width="1.8"/>
<text x="860" y="358" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">general invertible</text>
<text x="1115" y="377" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">none guaranteed</text>
<text x="845" y="434" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">anisotropy is a family of tests:</text>
<text x="845" y="462" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">mean | pairwise cosine | spectrum</text>
<text x="845" y="488" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">effective rank | local clusters | task</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">几何结论必须声明对象、是否 centering、metric 与允许的重参数化；单个 cosine 不能代表全部表示质量。</text>
</svg>