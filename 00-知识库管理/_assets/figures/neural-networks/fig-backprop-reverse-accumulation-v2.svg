<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">反向传播：从标量 seed 到 fan-out 贡献之和</title>
<desc id="desc">逆拓扑序只处理已收齐子节点贡献的值；每条边调用局部 VJP，共享父节点使用加法累积。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">forward 账本</text>
<text x="55" y="91" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">operation</text>
<text x="305" y="91" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">value</text>
<line x1="48" y1="98" x2="355" y2="98" stroke="#2563EB" stroke-width="2"/>
<text x="55" y="130" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">a = xy</text>
<rect x="275" y="105" width="78" height="42" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="314" y="132" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">6</text>
<text x="55" y="202" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">b = x+y</text>
<rect x="275" y="177" width="78" height="42" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="314" y="204" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">5</text>
<text x="55" y="274" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">c = a+b</text>
<rect x="275" y="249" width="78" height="42" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="314" y="276" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">11</text>
<text x="55" y="346" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">L = c²/2</text>
<rect x="275" y="321" width="78" height="42" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="314" y="348" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">60.5</text>
<text x="50" y="420" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937">x=2, y=3</text>
<text x="50" y="462" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">forward 保存局部 VJP 所需的 primal。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">reverse ledger：每条边一份</text>
<rect x="445" y="103" width="205" height="48" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="547" y="133" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">L̄ = 1</text>
<text x="668" y="133" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">seed</text>
<line x1="547" y1="153" x2="547" y2="169" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="445" y="173" width="205" height="48" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="547" y="203" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">c̄ = 11</text>
<text x="668" y="203" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">square VJP</text>
<line x1="547" y1="223" x2="547" y2="239" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="445" y="243" width="205" height="48" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="547" y="273" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">ā=b̄=11</text>
<text x="668" y="273" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">add copies</text>
<line x1="547" y1="293" x2="547" y2="309" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="445" y="313" width="205" height="48" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="547" y="343" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">x̄ = 33 + 11</text>
<text x="668" y="343" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">two paths</text>
<line x1="547" y1="363" x2="547" y2="379" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="445" y="383" width="205" height="48" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="547" y="413" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">ȳ = 22 + 11</text>
<text x="668" y="413" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">two paths</text>
<text x="438" y="470" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">x̄=44， ȳ=33；覆盖任一分支都会缺项。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">不枚举路径，复用后缀</text>
<circle cx="865" cy="275" r="22" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="865" y="281" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">v</text>
<circle cx="955" cy="160" r="22" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="955" y="166" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">p₁</text>
<circle cx="955" cy="385" r="22" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="955" y="391" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">p₂</text>
<circle cx="1050" cy="275" r="22" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="1050" y="281" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">q</text>
<circle cx="1125" cy="275" r="22" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="1125" y="281" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">L</text>
<line x1="887" y1="275" x2="931" y2="160" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<line x1="887" y1="275" x2="931" y2="385" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<line x1="977" y1="160" x2="1026" y2="275" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<line x1="977" y1="385" x2="1026" y2="275" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<line x1="1072" y1="275" x2="1101" y2="275" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<path d="M1102 255C1050 205 955 210 887 258" fill="none" stroke="#C24135" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<path d="M1102 295C1050 345 955 340 887 292" fill="none" stroke="#C24135" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<text x="835" y="105" font-size="18" font-weight="700" text-anchor="start" fill="#C24135" class="math">v̄ = Σ children VJP</text>
<text x="835" y="447" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">每个 node adjoint 只汇总一次；</text>
<text x="835" y="477" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">path count 可指数增，图动态规划仍按边处理。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">reverse mode = seed 1 + 逆拓扑序 + 局部 VJP + fan-out 求和；它计算梯度，不负责更新参数。</text>
</svg>