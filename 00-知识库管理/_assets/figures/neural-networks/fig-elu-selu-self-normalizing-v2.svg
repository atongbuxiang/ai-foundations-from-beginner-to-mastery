<title id="title">ELU 与 SELU：负饱和、Moment Fixed Point 和条件边界</title>
<desc id="desc">ELU 负侧指数趋于负常数；SELU 选择 alpha 与 lambda 使理想化均值方差映射在零均值单位方差附近具有吸引结构，并依赖配套初始化与 alpha dropout。</desc>
