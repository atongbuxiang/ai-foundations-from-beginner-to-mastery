<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Dropout：均值匹配、方差代价与非线性边界</title>
<desc id="desc">Inverted Dropout 用 Bernoulli keep mask 除以 q；被 mask 张量条件均值保持，但二阶矩放大，经过非线性后的预测均值一般不由一次 evaluation pass 精确给出。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">mask、scale 与条件期望</text>
<rect x="54" y="104" width="72" height="44" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
<text x="90" y="132" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">2</text>
<rect x="148" y="104" width="72" height="44" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
<text x="184" y="132" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">-1</text>
<rect x="242" y="104" width="72" height="44" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
<text x="278" y="132" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">3</text>
<text x="50" y="180" font-size="17" font-weight="700" text-anchor="start" fill="#64748B">x</text>
<text x="200" y="180" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">q = .5</text>
<circle cx="90" cy="231" r="21" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="90" y="237" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">1</text>
<circle cx="184" cy="231" r="21" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="184" y="237" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">0</text>
<circle cx="278" cy="231" r="21" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="278" y="237" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">1</text>
<line x1="200" y1="258" x2="200" y2="292" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="54" y="305" width="72" height="44" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="90" y="333" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">4</text>
<rect x="148" y="305" width="72" height="44" rx="4" fill="#FFFEFB" stroke="#C24135" stroke-width="1.8"/>
<text x="184" y="333" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">0</text>
<rect x="242" y="305" width="72" height="44" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="278" y="333" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">6</text>
<rect x="50" y="389" width="310" height="84" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="205" y="419" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">y = (m / q) ⊙ x</text>
<text x="205" y="449" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2937">E[y | x] = x</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">均值不免费：variance amplifier</text>
<line x1="468" y1="386" x2="728" y2="386" stroke="#1F2937" stroke-width="2"/>
<line x1="468" y1="126" x2="468" y2="386" stroke="#1F2937" stroke-width="2"/>
<text x="728" y="114" font-size="15" font-weight="650" text-anchor="end" fill="#64748B">keep q →</text>
<text x="472" y="114" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">p / q</text>
<circle cx="468.0" cy="126.0" r="4.5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="505.14285714285717" cy="234.33333333333334" r="4.5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="542.2857142857143" cy="288.5" r="4.5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="579.4285714285714" cy="321.0" r="4.5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="616.5714285714287" cy="342.6666666666667" r="4.5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="653.7142857142858" cy="358.1428571428571" r="4.5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="690.8571428571429" cy="369.75" r="4.5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="728.0" cy="378.77777777777777" r="4.5" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<path d="M468.0 126.0L505.1 234.3L542.3 288.5L579.4 321.0L616.6 342.7L653.7 358.1L690.9 369.8L728.0 378.8" fill="none" stroke="#C24135" stroke-width="3"/>
<line x1="468" y1="256.0" x2="728" y2="256.0" stroke="#D7DEE8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="474" y="416" font-size="15" font-weight="600" text-anchor="start" fill="#64748B">.2</text>
<text x="723" y="416" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">.9</text>
<rect x="445" y="425" width="315" height="60" rx="5" fill="#FFFBEB" stroke="#B7791F" stroke-width="2"/>
<text x="602" y="451" font-size="16" font-weight="700" text-anchor="middle" fill="#B7791F">Var(y_i | x) = (p/q) x_i²</text>
<text x="602" y="476" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">small q creates rare large activations</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">非线性后不能交换 E 与 f</text>
<rect x="846" y="98" width="126" height="54" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="909" y="131" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">y = 0</text>
<rect x="1004" y="98" width="126" height="54" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="1067" y="131" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">y = 2</text>
<text x="988" y="184" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">each with probability .5</text>
<rect x="846" y="218" width="284" height="90" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="988" y="248" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">f(y) = ReLU(y - 1)</text>
<text x="988" y="280" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">E f(y) = .5  ≠  f(Ey) = 0</text>
<rect x="846" y="352" width="284" height="58" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="988" y="387" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">train: random mask / eval: identity</text>
<rect x="846" y="438" width="284" height="48" rx="4" fill="#FFFBEB" stroke="#B7791F" stroke-width="2"/>
<text x="988" y="468" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F">state + RNG belong to the contract</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Dropout 保持被 mask 张量的条件均值，却放大二阶矩；一次 deterministic evaluation 不是一般非线性随机网络的精确平均。</text>
</svg>