<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">ReLU 家族：区域边界、死亡单元与负侧斜率</title>
<desc id="desc">ReLU 网络在固定 mask 的区域内为仿射；死亡单元要求跨数据与时间定义；leaky 和 PReLU 打开负侧通道但按斜率改变深层尺度与稀疏性。</desc>
