<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">错误点触发一次几何修正</text>
<line x1="60" y1="430" x2="360" y2="430" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="190" y1="470" x2="190" y2="95" stroke="#D7DEE8" stroke-width="1.5"/>
<circle cx="260" cy="155" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="270" y="147" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">+</text>
<circle cx="310" cy="205" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="320" y="197" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">+</text>
<circle cx="275" cy="285" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="285" y="277" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">+</text>
<circle cx="90" cy="325" r="7" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="100" y="317" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">−</text>
<circle cx="125" cy="245" r="7" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="135" y="237" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">−</text>
<circle cx="110" cy="160" r="7" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="120" y="152" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">−</text>
<path d="M65 120L350 365" fill="none" stroke="#C24135" stroke-width="3" stroke-dasharray="8 5"/>
<text x="278" y="385" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">old boundary</text>
<path d="M65 365L350 130" fill="none" stroke="#0F766E" stroke-width="4"/>
<text x="260" y="120" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">new boundary</text>
<line x1="190" y1="255" x2="260" y2="170" stroke="#2563EB" stroke-width="3.5" marker-end="url(#a0)"/>
<text x="220" y="195" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB">y x</text>
<text x="45" y="482" font-size="19" font-weight="700" text-anchor="start" fill="#1F2937" class="math">w⁺ = w + η yx</text>
<text x="45" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">当前 margin 增加 η||x||²；其他点未必改善。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">逐轮轨迹账</text>
<text x="440" y="115" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">k</text>
<text x="492" y="115" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">score</text>
<text x="570" y="115" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">y·score</text>
<text x="670" y="115" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">w after</text>
<line x1="435" y1="130" x2="760" y2="130" stroke="#0F766E" stroke-width="2"/>
<text x="445" y="170" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">1</text>
<text x="500" y="170" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">0</text>
<text x="590" y="170" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">0</text>
<text x="680" y="170" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">(1,1)</text>
<line x1="435" y1="188" x2="760" y2="188" stroke="#D7DEE8" stroke-width="1"/>
<text x="445" y="225" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">2</text>
<text x="500" y="225" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">0</text>
<text x="590" y="225" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">0</text>
<text x="680" y="225" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">(2,0)</text>
<line x1="435" y1="243" x2="760" y2="243" stroke="#D7DEE8" stroke-width="1"/>
<text x="445" y="280" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">3</text>
<text x="500" y="280" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">−2</text>
<text x="590" y="280" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">+2</text>
<text x="680" y="280" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">(2,0)</text>
<line x1="435" y1="298" x2="760" y2="298" stroke="#D7DEE8" stroke-width="1"/>
<text x="445" y="335" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">4</text>
<text x="500" y="335" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">+2</text>
<text x="590" y="335" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">+2</text>
<text x="680" y="335" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">(2,0)</text>
<line x1="435" y1="353" x2="760" y2="353" stroke="#D7DEE8" stroke-width="1"/>
<text x="438" y="410" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">tie rule is part of the algorithm</text>
<text x="438" y="450" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">顺序可改最终参数，不改 theorem 的共同上界。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">两本账夹出 mistake bound</text>
<line x1="860" y1="430" x2="1135" y2="430" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="860" y1="430" x2="860" y2="110" stroke="#D7DEE8" stroke-width="1.5"/>
<path d="M865 414L1125 145" fill="none" stroke="#0F766E" stroke-width="4"/>
<text x="1015" y="185" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">progress  Mγ</text>
<path d="M865 414C930 320 1010 270 1125 235" fill="none" stroke="#2563EB" stroke-width="4"/>
<text x="1010" y="260" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">norm  R√M</text>
<circle cx="1085" cy="187" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="1095" y="175" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">intersection</text>
<text x="842" y="470" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">Mγ ≤ uᵀw ≤ ||w|| ≤ R√M</text>
<text x="842" y="505" font-size="16" font-weight="700" text-anchor="start" fill="#C24135" class="math">unit u, γ&gt;0, ||x||≤R  ⇒  M≤(R/γ)²</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">有限错误来自共同正间隔方向；它不等于唯一解、最大间隔或总体泛化。</text>
</svg>