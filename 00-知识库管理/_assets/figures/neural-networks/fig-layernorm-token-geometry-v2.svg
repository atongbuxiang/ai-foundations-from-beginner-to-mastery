<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">LayerNorm Geometry：逐 token 分组、球面与低维退化</title>
<desc id="desc">LayerNorm 对每个 token 的 feature vector 单独中心化与径向归一；统计不跨 batch 或 token，但 token 内 Jacobian 密集；D 等于 1 或 2 时自由度严重退化。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">每个 token 一组 features</text>
<rect x="60" y="99" width="270" height="44" rx="5" fill="none" stroke="#2563EB" stroke-width="2"/>
<circle cx="82" cy="121" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<circle cx="125" cy="121" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<circle cx="168" cy="121" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<circle cx="211" cy="121" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<circle cx="254" cy="121" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<circle cx="297" cy="121" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<text x="48" y="126" font-size="15" font-weight="650" text-anchor="end" fill="#64748B">t1</text>
<rect x="60" y="159" width="270" height="44" rx="5" fill="none" stroke="#0F766E" stroke-width="2"/>
<circle cx="82" cy="181" r="9" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.7"/>
<circle cx="125" cy="181" r="9" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.7"/>
<circle cx="168" cy="181" r="9" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.7"/>
<circle cx="211" cy="181" r="9" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.7"/>
<circle cx="254" cy="181" r="9" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.7"/>
<circle cx="297" cy="181" r="9" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.7"/>
<text x="48" y="186" font-size="15" font-weight="650" text-anchor="end" fill="#64748B">t2</text>
<rect x="60" y="219" width="270" height="44" rx="5" fill="none" stroke="#2563EB" stroke-width="2"/>
<circle cx="82" cy="241" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<circle cx="125" cy="241" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<circle cx="168" cy="241" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<circle cx="211" cy="241" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<circle cx="254" cy="241" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<circle cx="297" cy="241" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<text x="48" y="246" font-size="15" font-weight="650" text-anchor="end" fill="#64748B">t3</text>
<rect x="60" y="279" width="270" height="44" rx="5" fill="none" stroke="#0F766E" stroke-width="2"/>
<circle cx="82" cy="301" r="9" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.7"/>
<circle cx="125" cy="301" r="9" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.7"/>
<circle cx="168" cy="301" r="9" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.7"/>
<circle cx="211" cy="301" r="9" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.7"/>
<circle cx="254" cy="301" r="9" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.7"/>
<circle cx="297" cy="301" r="9" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.7"/>
<text x="48" y="306" font-size="15" font-weight="650" text-anchor="end" fill="#64748B">t4</text>
<rect x="60" y="339" width="270" height="44" rx="5" fill="none" stroke="#2563EB" stroke-width="2"/>
<circle cx="82" cy="361" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<circle cx="125" cy="361" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<circle cx="168" cy="361" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<circle cx="211" cy="361" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<circle cx="254" cy="361" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<circle cx="297" cy="361" r="9" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.7"/>
<text x="48" y="366" font-size="15" font-weight="650" text-anchor="end" fill="#64748B">t5</text>
<text x="195" y="425" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">reduce D within each row</text>
<text x="195" y="454" font-size="15" font-weight="600" text-anchor="middle" fill="#0F766E">gamma, beta [D] shared across rows</text>
<text x="195" y="482" font-size="15" font-weight="600" text-anchor="middle" fill="#C24135">no running statistics</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Project，再归一半径</text>
<line x1="450" y1="315" x2="750" y2="315" stroke="#D7DEE8" stroke-width="2"/>
<line x1="600" y1="90" x2="600" y2="465" stroke="#D7DEE8" stroke-width="2"/>
<path d="M460 390L742 128" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="730" y="112" font-size="15" font-weight="700" text-anchor="end" fill="#0F766E">1-perp</text>
<circle cx="600" cy="315" r="103" fill="none" stroke="#D7DEE8" stroke-width="1.8"/>
<text x="700" y="302" font-size="15" font-weight="600" text-anchor="start" fill="#64748B">radius sqrt(D)</text>
<circle cx="505" cy="145" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="489" y="130" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">x</text>
<circle cx="566" cy="218" r="7" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<line x1="508" y1="150" x2="562" y2="214" stroke="#2563EB" stroke-width="2.4" marker-end="url(#a0)"/>
<text x="545" y="208" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">c</text>
<circle cx="526" cy="249" r="8" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<line x1="562" y1="222" x2="531" y2="246" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<text x="506" y="274" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">xhat</text>
<rect x="445" y="425" width="310" height="58" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="600" y="451" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">kept local degrees = D - 2</text>
<text x="600" y="474" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">before per-feature affine</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">独立 groups，不是 diagonal J</text>
<rect x="845" y="105" width="285" height="70" rx="5" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987" y="133" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">other tokens do not enter stats</text>
<text x="987" y="158" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">same rule in train and eval</text>
<rect x="845" y="205" width="285" height="78" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="987" y="233" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">within-token J is dense</text>
<text x="987" y="258" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">mean + radial coupling</text>
<rect x="845" y="320" width="135" height="95" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="912" y="350" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135">D = 1</text>
<text x="912" y="378" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">output beta</text>
<text x="912" y="402" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">J = 0</text>
<rect x="995" y="320" width="135" height="95" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="1062" y="350" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135">D = 2</text>
<text x="1062" y="378" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">two points</text>
<text x="1062" y="402" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">J = 0 if eps=0</text>
<text x="987" y="470" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">eps restores a small radial derivative</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">LayerNorm 不跨 token，但会耦合 token 内 features；宽度与 epsilon 决定保留几何。</text>
</svg>