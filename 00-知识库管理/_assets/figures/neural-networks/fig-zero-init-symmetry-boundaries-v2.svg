<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Zero Initialization：对称不变子空间与结构化例外</title>
<desc id="desc">完整 hidden-unit bundles 若相同，会被等变的 deterministic update 保持；bias、single layer、zero head 与 residual zero-last 各有不同第一步梯度。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Identical units 沿对称对角线更新</text>
<circle cx="75" cy="145" r="24" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<circle cx="75" cy="225" r="24" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="75" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">u1</text>
<text x="75" y="231" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">u2</text>
<line x1="102" y1="145" x2="149" y2="145" stroke="#2563EB" stroke-width="2.3" marker-end="url(#a0)"/>
<line x1="102" y1="225" x2="149" y2="225" stroke="#0F766E" stroke-width="2.3" marker-end="url(#a1)"/>
<circle cx="180" cy="145" r="24" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<circle cx="180" cy="225" r="24" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="180" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">u1</text>
<text x="180" y="231" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">u2</text>
<line x1="207" y1="145" x2="254" y2="145" stroke="#2563EB" stroke-width="2.3" marker-end="url(#a0)"/>
<line x1="207" y1="225" x2="254" y2="225" stroke="#0F766E" stroke-width="2.3" marker-end="url(#a1)"/>
<circle cx="285" cy="145" r="24" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<circle cx="285" cy="225" r="24" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="285" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">u1</text>
<text x="285" y="231" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">u2</text>
<line x1="75" y1="185" x2="309" y2="185" stroke="#C24135" stroke-width="1.8" stroke-dasharray="6 5"/>
<text x="192" y="178" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135" class="math">theta1 = theta2</text>
<rect x="55" y="305" width="292" height="64" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="201" y="333" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB" class="math">Delta theta remains zero</text>
<text x="201" y="357" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">same gradient + same optimizer state</text>
<rect x="55" y="402" width="292" height="74" rx="6" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="201" y="430" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">bundle = incoming + bias + outgoing</text>
<text x="201" y="456" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">one matrix alone is not the orbit</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">第一步梯度路径决定能否离开零</text>
<rect x="445" y="105" width="310" height="86" rx="6" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="462" y="134" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">all-zero MLP</text>
<text x="462" y="161" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">W2 blocks W1; h may be zero</text>
<circle cx="715" cy="148" r="13" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<line x1="682" y1="148" x2="699" y2="148" stroke="#C24135" stroke-width="2" marker-end="url(#a2)"/>
<rect x="445" y="228" width="310" height="86" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="462" y="257" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">zero output head</text>
<text x="462" y="284" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">head learns; encoder waits</text>
<circle cx="715" cy="271" r="13" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<line x1="682" y1="271" x2="699" y2="271" stroke="#2563EB" stroke-width="2" marker-end="url(#a0)"/>
<rect x="445" y="351" width="310" height="86" rx="6" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="462" y="380" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">residual zero-last</text>
<text x="462" y="407" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">identity path stays open</text>
<circle cx="715" cy="394" r="13" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<line x1="682" y1="394" x2="699" y2="394" stroke="#0F766E" stroke-width="2" marker-end="url(#a1)"/>
<text x="600" y="476" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">trace the loss-to-parameter chain</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">逐对象判断，而不是一句口诀</text>
<rect x="845" y="105" width="285" height="48" rx="4" fill="#FFFEFB" stroke="#C24135" stroke-width="1.8"/>
<text x="862" y="135" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">hidden weights</text>
<text x="1115" y="135" font-size="15" font-weight="500" text-anchor="end" fill="#64748B">usually random</text>
<rect x="845" y="171" width="285" height="48" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="862" y="201" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">hidden bias</text>
<text x="1115" y="201" font-size="15" font-weight="500" text-anchor="end" fill="#64748B">zero often fine</text>
<rect x="845" y="237" width="285" height="48" rx="4" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.8"/>
<text x="862" y="267" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">linear / logistic</text>
<text x="1115" y="267" font-size="15" font-weight="500" text-anchor="end" fill="#64748B">zero can move</text>
<rect x="845" y="303" width="285" height="48" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="862" y="333" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">zero head</text>
<text x="1115" y="333" font-size="15" font-weight="500" text-anchor="end" fill="#64748B">encoder waits</text>
<rect x="845" y="369" width="285" height="48" rx="4" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.8"/>
<text x="862" y="399" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">residual last</text>
<text x="1115" y="399" font-size="15" font-weight="500" text-anchor="end" fill="#64748B">skip protected</text>
<rect x="845" y="435" width="285" height="48" rx="4" fill="#FFFEFB" stroke="#C24135" stroke-width="1.8"/>
<text x="862" y="465" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">padding row</text>
<text x="1115" y="465" font-size="15" font-weight="500" text-anchor="end" fill="#64748B">intentional fixed zero</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">零初始化的判据是完整 symmetry orbit 与第一步计算图；结构化例外必须逐参数说明。</text>
</svg>