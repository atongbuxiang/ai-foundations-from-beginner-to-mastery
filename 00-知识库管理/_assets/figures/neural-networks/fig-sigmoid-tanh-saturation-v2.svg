<title id="title">Sigmoid 与 Tanh：值域、导数窗口和深度乘积</title>
<desc id="desc">两条 S 形曲线都在两端饱和；sigmoid 最大斜率为四分之一且对称输入输出均值二分之一，tanh 中心斜率为一且对称输入输出均值为零。</desc>
