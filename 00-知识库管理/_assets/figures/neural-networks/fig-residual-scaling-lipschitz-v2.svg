<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Residual Scaling：乘积、耗散与 forcing</title>
<desc id="desc">残差链的最坏扰动由 exp(sum alpha L) 控制；一除以 N 与一除以根号 N 对应不同账本；收缩还需要方向耗散；每层误差按剩余增益累积。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">两种 scale，两本账</text>
<rect x="52" y="100" width="300" height="86" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="202" y="130" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">worst case</text>
<text x="202" y="160" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">product &lt;= exp(sum alpha L)</text>
<rect x="52" y="220" width="300" height="86" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="202" y="250" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">alpha = 1/N</text>
<text x="202" y="280" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">exponent O(1)</text>
<rect x="52" y="340" width="300" height="100" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="202" y="370" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">alpha = 1/sqrt(N)</text>
<text x="202" y="400" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">worst exponent O(sqrt(N))</text>
<text x="202" y="426" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">variance O(1), if uncorrelated</text>
<text x="202" y="480" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F">deterministic != stochastic ledger</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">小 branch 不自动收缩</text>
<rect x="445" y="105" width="140" height="60" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="515.0" y="141.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">F(x)=+beta x</text>
<line x1="590" y1="135" x2="742" y2="135" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<text x="600" y="185" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">gain = 1 + alpha beta</text>
<rect x="445" y="250" width="140" height="60" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="515.0" y="286.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">F(x)=-beta x</text>
<line x1="590" y1="280" x2="680" y2="280" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="600" y="330" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">gain = |1 - alpha beta|</text>
<rect x="442" y="385" width="326" height="82" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="605" y="415" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">one-sided mu &lt; 0</text>
<text x="605" y="444" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2937">1 + 2 alpha mu + alpha^2 L^2 &lt; 1</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">每层误差带着剩余尾巴</text>
<circle cx="850" cy="180" r="12" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="850" y="152" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">d0</text>
<line x1="865" y1="180" x2="915" y2="180" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<text x="890.0" y="168" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">q0</text>
<circle cx="930" cy="180" r="12" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="930" y="152" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">d1</text>
<line x1="945" y1="180" x2="995" y2="180" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<text x="970.0" y="168" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">q1</text>
<circle cx="1010" cy="180" r="12" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="1010" y="152" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">d2</text>
<line x1="1025" y1="180" x2="1075" y2="180" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<text x="1050.0" y="168" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">q2</text>
<circle cx="1090" cy="180" r="12" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="1090" y="152" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">d3</text>
<line x1="895" y1="275" x2="895" y2="205" stroke="#0F766E" stroke-width="2.4" marker-end="url(#a1)"/>
<text x="895" y="300" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">xi0</text>
<line x1="975" y1="345" x2="975" y2="205" stroke="#B7791F" stroke-width="2.4" marker-end="url(#a1)"/>
<text x="975" y="370" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F">xi1</text>
<rect x="845" y="405" width="285" height="76" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="987" y="432" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">d_N &lt;= product q * d_0</text>
<text x="987" y="458" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">+ sum tail-product * xi_k</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">稳定缩放要同时控制最坏乘积、方向耗散和逐层误差；三者不能共用一句直觉。</text>
</svg>