<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">激活函数证据协议：从稳定 Primitive 到有边界结论</title>
<desc id="desc">可靠选择依次审计数值实现、深层尺度、系统预算与统计选择；任何漂亮的单点指标都不能跨越尚未通过的证据门。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">数值门：稳定 Primitive</text>
<rect x="55" y="105" width="292" height="52" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="70" y="127" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">sigmoid</text>
<text x="70" y="148" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">sign branch</text>
<rect x="55" y="178" width="292" height="52" rx="6" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="70" y="200" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">Softplus</text>
<text x="70" y="221" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">max + log1p</text>
<rect x="55" y="251" width="292" height="52" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="70" y="273" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">log-sigmoid</text>
<text x="70" y="294" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">-Softplus(-x)</text>
<rect x="55" y="324" width="292" height="52" rx="6" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="70" y="346" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">ELU near zero</text>
<text x="70" y="367" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">expm1</text>
<rect x="55" y="397" width="292" height="52" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="70" y="419" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">GELU</text>
<text x="70" y="440" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">exact / approx flag</text>
<text x="200" y="490" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">forward + VJP + gradgrad</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">传播门：不要混淆统计量</text>
<rect x="445" y="105" width="310" height="48" rx="6" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.8"/>
<text x="460" y="125" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">mean</text>
<text x="740" y="139" font-size="15" font-weight="600" text-anchor="end" fill="#1F2937" class="math">E[H]</text>
<rect x="445" y="172" width="310" height="48" rx="6" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.8"/>
<text x="460" y="192" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">second moment</text>
<text x="740" y="206" font-size="15" font-weight="600" text-anchor="end" fill="#1F2937" class="math">E[H^2]</text>
<rect x="445" y="239" width="310" height="48" rx="6" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.8"/>
<text x="460" y="259" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">variance</text>
<text x="740" y="273" font-size="15" font-weight="600" text-anchor="end" fill="#1F2937" class="math">E[H^2] - E[H]^2</text>
<rect x="445" y="306" width="310" height="48" rx="6" fill="#F8FAFC" stroke="#0F766E" stroke-width="1.8"/>
<text x="460" y="326" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">derivative gain</text>
<text x="740" y="340" font-size="15" font-weight="600" text-anchor="end" fill="#1F2937" class="math">E[phi&#x27;(Z)^2]</text>
<rect x="445" y="373" width="310" height="48" rx="6" fill="#F8FAFC" stroke="#0F766E" stroke-width="1.8"/>
<text x="460" y="393" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">directional spectrum</text>
<text x="740" y="407" font-size="15" font-weight="600" text-anchor="end" fill="#1F2937" class="math">singular values of J</text>
<rect x="445" y="454" width="310" height="43" rx="6" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="600" y="481" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">stable moments != stable Jacobian</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">系统 + 统计门：结论逐级收窄</text>
<rect x="845" y="105" width="285" height="45" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987" y="133" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">1  parameters / MAC / bytes</text>
<line x1="987" y1="152" x2="987" y2="168" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="845" y="171" width="285" height="45" rx="6" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987" y="199" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">2  fused latency on target GPU</text>
<line x1="987" y1="218" x2="987" y2="234" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="845" y="237" width="285" height="45" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987" y="265" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">3  plug-in + retuned tracks</text>
<line x1="987" y1="284" x2="987" y2="300" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="845" y="303" width="285" height="45" rx="6" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987" y="331" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">4  matched budget + all seeds</text>
<line x1="987" y1="350" x2="987" y2="366" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="845" y="369" width="285" height="45" rx="6" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="987" y="397" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">5  selection correction + test</text>
<rect x="845" y="447" width="285" height="52" rx="7" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="987" y="470" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">bounded claim</text>
<text x="987" y="491" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">model + data + budget + hardware</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">可发布结论不是“某激活最好”，而是它在已声明模型、数据、预算、精度和硬件范围内通过了哪些证据门。</text>
</svg>