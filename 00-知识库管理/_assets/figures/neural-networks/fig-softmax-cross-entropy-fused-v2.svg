<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Softmax–Cross-Entropy：稳定前向与融合反向</title>
<desc id="desc">先以最大值平移 logits，再用 log-sum-exp 直接形成 log-probability；归一化 target 下，融合梯度为 p-y，同时必须记录温度与 reduction 尺度。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">max-shift 改写，不改概率</text>
<line x1="65" y1="335" x2="350" y2="335" stroke="#D7DEE8" stroke-width="2"/>
<rect x="78" y="155" width="54" height="180" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="105" y="360" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">1000</text>
<rect x="168" y="215" width="54" height="120" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="195" y="360" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">999</text>
<rect x="258" y="265" width="54" height="70" rx="4" fill="#ECFDF5" stroke="#B7791F" stroke-width="2"/>
<text x="285" y="360" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">998</text>
<text x="205" y="405" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">subtract m=max(z)=1000</text>
<line x1="205" y1="418" x2="205" y2="444" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<rect x="65" y="455" width="285" height="42" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="207" y="482" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">shifted logits = [0,-1,-2]</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">一条恒等式给出 p-y</text>
<rect x="445" y="108" width="310" height="58" rx="7" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.3"/>
<text x="600" y="144" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB" class="math">loss = LSE(z) - y^T z</text>
<line x1="600" y1="169" x2="600" y2="209" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="445" y="218" width="310" height="58" rx="7" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.3"/>
<text x="600" y="254" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">d LSE = p^T dz</text>
<line x1="600" y1="279" x2="600" y2="319" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="445" y="328" width="310" height="58" rx="7" fill="#FFFEFB" stroke="#C24135" stroke-width="2.3"/>
<text x="600" y="364" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135" class="math">d loss = (p-y)^T dz</text>
<line x1="600" y1="389" x2="600" y2="429" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="445" y="438" width="310" height="58" rx="7" fill="#FFF5F2" stroke="#C24135" stroke-width="2.3"/>
<text x="600" y="474" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135" class="math">z_bar = p-y</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">尺度合同与曲率检查</text>
<text x="845" y="108" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">per row gradient</text>
<rect x="845" y="126" width="285" height="54" rx="7" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="987" y="159" font-size="18" font-weight="700" text-anchor="middle" fill="#C24135" class="math">(p-y) / tau</text>
<text x="845" y="233" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">target sum</text>
<text x="965" y="233" font-size="15" font-weight="500" text-anchor="start" fill="#1F2937">1  (else alpha*p-y)</text>
<line x1="845" y1="244" x2="1130" y2="244" stroke="#D7DEE8" stroke-width="1.3"/>
<text x="845" y="293" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">temperature</text>
<text x="965" y="293" font-size="15" font-weight="500" text-anchor="start" fill="#1F2937">forward and backward</text>
<line x1="845" y1="304" x2="1130" y2="304" stroke="#D7DEE8" stroke-width="1.3"/>
<text x="845" y="353" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">reduction</text>
<text x="965" y="353" font-size="15" font-weight="500" text-anchor="start" fill="#1F2937">sum / valid-count mean</text>
<line x1="845" y1="364" x2="1130" y2="364" stroke="#D7DEE8" stroke-width="1.3"/>
<text x="845" y="413" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">mask</text>
<text x="965" y="413" font-size="15" font-weight="500" text-anchor="start" fill="#1F2937">padding contributes zero</text>
<line x1="845" y1="424" x2="1130" y2="424" stroke="#D7DEE8" stroke-width="1.3"/>
<rect x="845" y="462" width="285" height="42" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="987" y="488" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E" class="math">H = diag(p) - p p^T  is PSD</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">稳定融合不是删掉数学步骤，而是把同一恒等式变成更安全、更少中间量的程序。</text>
</svg>