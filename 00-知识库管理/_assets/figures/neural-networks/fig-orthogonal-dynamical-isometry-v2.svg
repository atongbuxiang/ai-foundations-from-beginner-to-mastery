<rect x="520" y="295.4" width="24" height="89.60000000000001" rx="1" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<text x="532" y="409" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">0.64</text>
<rect x="565" y="362.6" width="24" height="22.400000000000002" rx="1" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<text x="577" y="409" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">0.16</text>
<rect x="610" y="275.8" width="24" height="109.2" rx="1" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<text x="622" y="409" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">0.78</text>
<rect x="655" y="378.0" width="24" height="7.0" rx="1" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<text x="667" y="409" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">0.05</text>
<rect x="700" y="312.2" width="24" height="72.8" rx="1" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="712" y="409" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">0.52</text>
<text x="600" y="445" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">orthogonal W does not flatten D</text>
<text x="600" y="474" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">ReLU zeros can remove directions</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">谱主张不可混用</text>
<rect x="845" y="105" width="285" height="70" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="862" y="133" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">1  mean squared singular value</text>
<text x="862" y="158" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">average random direction</text>
<rect x="845" y="205" width="285" height="70" rx="6" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="862" y="233" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">2  condition number</text>
<text x="862" y="258" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">extreme directions</text>
<rect x="845" y="305" width="285" height="70" rx="6" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="862" y="333" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">3  dynamical isometry</text>
<text x="862" y="358" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">all relevant s_i near 1</text>
<line x1="987" y1="178" x2="987" y2="198" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<line x1="987" y1="278" x2="987" y2="298" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="845" y="410" width="285" height="78" rx="6" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="987" y="438" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">mean = 1 can hide</text>
<text x="987" y="463" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">one near-zero singular direction</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">单层正交是谱校准基线；全网 dynamical isometry 还需处理 derivative、shape、operator 与训练漂移。</text>
