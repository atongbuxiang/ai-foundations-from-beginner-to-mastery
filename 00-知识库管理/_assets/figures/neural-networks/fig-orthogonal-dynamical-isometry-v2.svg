<text x="101.0" y="215" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">square</text>
<text x="101.0" y="238" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">all dirs</text>
<line x1="80" y1="139.0" x2="122" y2="139.0" stroke="#2563EB" stroke-width="1.8"/>
<line x1="80" y1="160.0" x2="122" y2="160.0" stroke="#2563EB" stroke-width="1.8"/>
<line x1="80" y1="181.0" x2="122" y2="181.0" stroke="#2563EB" stroke-width="1.8"/>
<rect x="166" y="105" width="52" height="102" rx="3" fill="#F8FAFC" stroke="#0F766E" stroke-width="2"/>
<text x="192.0" y="235" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">tall</text>
<text x="192.0" y="258" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">input dirs</text>
<line x1="176" y1="119" x2="208" y2="119" stroke="#0F766E" stroke-width="1.8"/>
<line x1="176" y1="141" x2="208" y2="141" stroke="#0F766E" stroke-width="1.8"/>
<line x1="176" y1="163" x2="208" y2="163" stroke="#0F766E" stroke-width="1.8"/>
<rect x="252" y="137" width="94" height="44" rx="3" fill="#F8FAFC" stroke="#C24135" stroke-width="2"/>
<text x="299.0" y="209" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">wide</text>
<text x="299.0" y="232" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">row space</text>
<line x1="262" y1="151.0" x2="336" y2="151.0" stroke="#C24135" stroke-width="1.8"/>
<line x1="262" y1="163.0" x2="336" y2="163.0" stroke="#C24135" stroke-width="1.8"/>
<line x1="262" y1="175.0" x2="336" y2="175.0" stroke="#C24135" stroke-width="1.8"/>
<rect x="55" y="295" width="292" height="66" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="201" y="322" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB" class="math">Q^T Q = I: input norm preserved</text>
<text x="201" y="348" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">requires rows &gt;= columns</text>
<rect x="55" y="390" width="292" height="82" rx="6" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="201" y="418" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135" class="math">Q Q^T = I</text>
<text x="201" y="444" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">kernel remains when input wider</text>
<text x="201" y="466" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">state the protected subspace</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Nonlinearity reshapes Jacobian</text>
<rect x="445" y="112" width="55" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="472.5" y="142.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">W1</text>
<line x1="503" y1="136" x2="516" y2="136" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="520" y="112" width="55" height="48" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="547.5" y="142.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">D1</text>
<line x1="578" y1="136" x2="591" y2="136" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="595" y="112" width="55" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="622.5" y="142.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">W2</text>
<line x1="653" y1="136" x2="666" y2="136" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="670" y="112" width="55" height="48" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="697.5" y="142.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">D2</text>
<text x="600" y="205" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">J = D2 W2 D1 W1</text>
<line x1="455" y1="385" x2="748" y2="385" stroke="#D7DEE8" stroke-width="2"/>
<rect x="475" y="253.4" width="24" height="131.6" rx="1" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
