<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">XOR、非线性折叠与隐藏读出</title>
<desc id="desc">XOR 的两类凸包相交；ReLU hinges 把和坐标折成 hat；隐藏空间中线性输出即可读出。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">原空间：凸包相交</text>
<circle cx="90" cy="390" r="10" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="105" y="382" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">0</text>
<circle cx="310" cy="140" r="10" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="325" y="132" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">0</text>
<circle cx="90" cy="140" r="10" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="105" y="132" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">1</text>
<circle cx="310" cy="390" r="10" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="325" y="382" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">1</text>
<line x1="90" y1="390" x2="310" y2="140" stroke="#C24135" stroke-width="4"/>
<line x1="90" y1="140" x2="310" y2="390" stroke="#2563EB" stroke-width="4"/>
<circle cx="200" cy="265" r="8" fill="#FFFEFB" stroke="#1F2937" stroke-width="2"/>
<text x="45" y="465" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">conv(positive) ∩ conv(negative) ≠ ∅</text>
<text x="45" y="500" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">单个 affine threshold 不可能严格分离。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三个 hinge 拼成 hat</text>
<line x1="450" y1="430" x2="760" y2="430" stroke="#D7DEE8" stroke-width="2"/>
<line x1="475" y1="455" x2="475" y2="105" stroke="#D7DEE8" stroke-width="2"/>
<path d="M475 430L615 145L755 430" fill="none" stroke="#0F766E" stroke-width="4"/>
<text x="610" y="125" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">f(s)</text>
<circle cx="475" cy="430" r="5" fill="#1F2937" stroke="#1F2937" stroke-width="2"/>
<text x="475" y="458" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">0</text>
<circle cx="615" cy="430" r="5" fill="#1F2937" stroke="#1F2937" stroke-width="2"/>
<text x="615" y="458" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">1</text>
<circle cx="755" cy="430" r="5" fill="#1F2937" stroke="#1F2937" stroke-width="2"/>
<text x="755" y="458" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">2</text>
<text x="430" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">ReLU(s) − 2ReLU(s−1) + ReLU(s−2)</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">隐藏表示 → 线性读出</text>
<rect x="845" y="105" width="285" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="142.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">x → s=x1+x2</text>
<rect x="845" y="215" width="285" height="72" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="257.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">h=(R(s),R(s−1),R(s−2))</text>
<rect x="845" y="340" width="285" height="62" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="987.5" y="377.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">v=(1,−2,1) → y</text>
<line x1="987" y1="170" x2="987" y2="208" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="987" y1="290" x2="987" y2="333" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="842" y="465" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">表示可有意合并任务等价输入。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">非线性先改变几何，再由线性层读出；有限点拟合不等于全域函数唯一。</text>
</svg>