<text x="1055" y="140" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">row 1:[d]</text>
<line x1="917" y1="152" x2="985" y2="189" stroke="#2563EB" stroke-width="2.2" marker-end="url(#a0)"/>
<rect x="990" y="167" width="130" height="44" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="1055" y="195" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">row 2:[d]</text>
<line x1="917" y1="152" x2="985" y2="244" stroke="#2563EB" stroke-width="2.2" marker-end="url(#a0)"/>
<rect x="990" y="222" width="130" height="44" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="1055" y="250" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">row 3:[d]</text>
<path d="M1122 132C1160 168 1160 250 1122 286" fill="none" stroke="#C24135" stroke-width="2.5" stroke-dasharray="6 5"/>
<text x="1055" y="315" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">reverse: sum rows</text>
<line x1="845" y1="345" x2="1135" y2="345" stroke="#D7DEE8" stroke-width="2"/>
<text x="842" y="377" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">gather: indices [2,2,1]</text>
<rect x="844" y="400" width="290" height="72" rx="7" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="989" y="427" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E" class="math">y_bar = [a,b,c]</text>
<text x="989" y="454" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937" class="math">scatter-add -&gt; x_bar=[c,a+b,0]</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">统一原则：每个 primitive 提供局部 VJP；共享路径求和，复制操作用其转置聚合。</text>
