<line x1="488" y1="275" x2="550" y2="380" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<line x1="598" y1="155" x2="665" y2="275" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<line x1="598" y1="380" x2="665" y2="275" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<line x1="713" y1="275" x2="735" y2="275" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<path d="M737 251C675 205 565 205 488 258" fill="none" stroke="#C24135" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<path d="M737 299C675 345 565 345 488 292" fill="none" stroke="#C24135" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<rect x="445" y="430" width="310" height="58" rx="7" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="600" y="455" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135" class="math">x_bar = y_bar + J_F^T y_bar</text>
<text x="600" y="477" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">assignment would erase one path</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">复制的伴随是聚合</text>
<text x="842" y="105" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">broadcast</text>
