<line x1="58" y1="315" x2="352" y2="315" stroke="#D7DEE8" stroke-width="2"/>
<line x1="205" y1="105" x2="205" y2="425" stroke="#D7DEE8" stroke-width="2"/>
<path d="M70 315L205 315L335 145" fill="none" stroke="#2563EB" stroke-width="4"/>
<text x="328" y="132" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">ReLU</text>
<circle cx="105" cy="315" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="105" y="362" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">x&lt;0</text>
<text x="105" y="389" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">slope 0</text>
<circle cx="205" cy="315" r="7" fill="#B7791F" stroke="#B7791F" stroke-width="2"/>
<text x="205" y="362" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">x=0</text>
<text x="205" y="389" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">rule</text>
<circle cx="300" cy="190" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="300" y="362" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">x&gt;0</text>
<text x="300" y="389" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">slope 1</text>
<rect x="62" y="432" width="282" height="55" rx="7" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="203" y="456" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">z_bar = h_bar * phi&#x27;(z)</text>
<text x="203" y="477" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">mask controls one local path</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">分支：贡献必须相加</text>
<circle cx="465" cy="275" r="23" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="465" y="281" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">x</text>
<circle cx="575" cy="155" r="23" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="575" y="161" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">id</text>
<circle cx="575" cy="380" r="23" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
