<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">LSUV、Fixup 与现代初始化诊断闭环</title>
<desc id="desc">LSUV 用 calibration data 逐层校准输出 variance；Fixup 用 residual depth 缩放 branch update；可靠流程还要测相关、反向、谱与更新系统。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">LSUV：逐层测量与反馈重缩放</text>
<rect x="55" y="105" width="130" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="120.0" y="136.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">orthogonal W</text>
<rect x="215" y="105" width="132" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="281.0" y="136.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">forward batch</text>
<line x1="188" y1="130" x2="211" y2="130" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="215" y="208" width="132" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="281.0" y="239.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">measure Var</text>
<line x1="281" y1="159" x2="281" y2="204" stroke="#0F766E" stroke-width="2.4" marker-end="url(#a1)"/>
<rect x="55" y="208" width="130" height="50" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="120.0" y="239.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">W / sqrt(v)</text>
<line x1="211" y1="233" x2="189" y2="233" stroke="#C24135" stroke-width="2.4" marker-end="url(#a2)"/>
<path d="M120 205C120 170 220 176 242 201" fill="none" stroke="#2563EB" stroke-width="2.0" stroke-dasharray="6 5" marker-end="url(#a0)"/>
<rect x="55" y="305" width="292" height="70" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="201" y="333" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB" class="math">stop when |v - 1| &lt; tol</text>
<text x="201" y="358" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">or trials reach Tmax</text>
<rect x="55" y="402" width="292" height="74" rx="6" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="201" y="430" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">declare axes / mode / batch</text>
<text x="201" y="456" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">one-time calibration, not BatchNorm</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Fixup：Depth-aware Branch</text>
<rect x="445" y="108" width="70" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="480.0" y="138.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">x</text>
<rect x="690" y="108" width="70" height="48" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="725.0" y="138.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">x + F</text>
<line x1="518" y1="132" x2="686" y2="132" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<rect x="495" y="225" width="68" height="45" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="529.0" y="253.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">W1*a</text>
<rect x="585" y="225" width="68" height="45" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="619.0" y="253.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">...</text>
<rect x="675" y="225" width="68" height="45" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="709.0" y="253.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">Wm=0</text>
<line x1="480" y1="157" x2="515" y2="220" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="566" y1="247" x2="581" y2="247" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="656" y1="247" x2="671" y2="247" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="709" y1="220" x2="722" y2="160" stroke="#C24135" stroke-width="2" marker-end="url(#a2)"/>
<rect x="445" y="320" width="310" height="58" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="600" y="346" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">a = L^(-1/(2m-2))</text>
<text x="600" y="369" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B" class="math">a^(m-1) = L^(-1/2)</text>
<rect x="445" y="410" width="310" height="65" rx="6" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="600" y="437" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">zero last + scalar multiplier / bias</text>
<text x="600" y="461" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">the complete recipe matters</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">定位第一处失效</text>
<rect x="845" y="105" width="285" height="40" rx="4" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.8"/>
<text x="987" y="131" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">1 parameter / fan / dtype</text>
<line x1="987" y1="147" x2="987" y2="161" stroke="#1F2937" stroke-width="1.5" marker-end="url(#a3)"/>
<rect x="845" y="164" width="285" height="40" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="987" y="190" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">2 forward moments</text>
<line x1="987" y1="206" x2="987" y2="220" stroke="#1F2937" stroke-width="1.5" marker-end="url(#a3)"/>
<rect x="845" y="223" width="285" height="40" rx="4" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.8"/>
<text x="987" y="249" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">3 input correlation</text>
<line x1="987" y1="265" x2="987" y2="279" stroke="#1F2937" stroke-width="1.5" marker-end="url(#a3)"/>
<rect x="845" y="282" width="285" height="40" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="987" y="308" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">4 backward JVP / VJP</text>
<line x1="987" y1="324" x2="987" y2="338" stroke="#1F2937" stroke-width="1.5" marker-end="url(#a3)"/>
<rect x="845" y="341" width="285" height="40" rx="4" fill="#FFFEFB" stroke="#C24135" stroke-width="1.8"/>
<text x="987" y="367" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">5 spectrum / rank / extremes</text>
<line x1="987" y1="383" x2="987" y2="397" stroke="#1F2937" stroke-width="1.5" marker-end="url(#a3)"/>
<rect x="845" y="400" width="285" height="40" rx="4" fill="#FFFEFB" stroke="#C24135" stroke-width="1.8"/>
<text x="987" y="426" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">6 update / AMP / distributed</text>
<text x="987" y="478" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">modify the first failing mechanism</text>
<text x="987" y="505" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">then rerun every downstream check</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">初始化是可证伪流程：解析先验、仪表化 dry run、局部修正与多 seed 训练证据缺一不可。</text>
</svg>