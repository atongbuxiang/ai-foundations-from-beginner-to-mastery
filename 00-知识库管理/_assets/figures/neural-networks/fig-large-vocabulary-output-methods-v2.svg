<text x="470" y="352" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">w1</text>
<rect x="532" y="326" width="56" height="40" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
<text x="560" y="352" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">w2</text>
<rect x="622" y="326" width="56" height="40" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
<text x="650" y="352" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">w3</text>
<rect x="712" y="326" width="56" height="40" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.7"/>
<text x="740" y="352" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">w4</text>
<rect x="445" y="414" width="315" height="72" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="602" y="443" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">P(w3|h) = P(right|h)</text>
<text x="602" y="470" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">x P(left at child|h)</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">adaptive expected-cost ledger</text>
<rect x="845" y="94" width="285" height="78" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="987" y="122" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">head: 1000 words + 3 clusters</text>
<text x="987" y="151" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">always evaluated = 1003</text>
<rect x="845" y="214" width="285" height="54" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="862" y="247" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">tail A</text>
<text x="1112" y="247" font-size="15" font-weight="650" text-anchor="end" fill="#64748B">mass .08</text>
<rect x="845" y="292" width="285" height="54" rx="4" fill="#FFFEFB" stroke="#B7791F" stroke-width="1.8"/>
<text x="862" y="325" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">tail B</text>
<text x="1112" y="325" font-size="15" font-weight="650" text-anchor="end" fill="#64748B">mass .02</text>
<rect x="845" y="386" width="285" height="96" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="987" y="416" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">toy expected labels</text>
<text x="987" y="446" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">1003 + .10 x 3000 = 1303</text>
<text x="987" y="470" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">tail dimensions may also shrink</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">问清楚：近似的是原 flat model、训练 estimator，还是概率模型本身？训练速度、精确 NLL 与部署 top-k 必须分别验收。</text>
</svg>