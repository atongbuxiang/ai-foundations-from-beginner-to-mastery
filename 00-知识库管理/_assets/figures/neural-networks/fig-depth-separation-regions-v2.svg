<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">深度分离：复合折叠与浅层枚举</title>
<desc id="desc">tent map 的重复复合指数增加单调线性段；浅层一维 ReLU 每个 unit 至多添加一个 breakpoint。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">复合次数增加折叠</text>
<path d="M60.0 180L210.0 90L360.0 180" fill="none" stroke="#2563EB" stroke-width="3"/>
<text x="45" y="207" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">T composed 1: 2 pieces</text>
<path d="M60.0 305L135.0 215L210.0 305L285.0 215L360.0 305" fill="none" stroke="#0F766E" stroke-width="3"/>
<text x="45" y="332" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">T composed 2: 4 pieces</text>
<path d="M60.0 430L97.5 340L135.0 430L172.5 340L210.0 430L247.5 340L285.0 430L322.5 340L360.0 430" fill="none" stroke="#0F766E" stroke-width="3"/>
<text x="45" y="457" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">T composed 3: 8 pieces</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">deep reuse vs shallow list</text>
<rect x="455" y="110" width="125" height="55" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="517.5" y="143.5" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">tent module</text>
<rect x="640" y="110" width="110" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="695.0" y="143.5" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">repeat L</text>
<line x1="585" y1="138" x2="635" y2="138" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="430" y="230" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">constant-width composition</text>
<text x="430" y="275" font-size="18" font-weight="700" text-anchor="start" fill="#C24135">→ about 2^L pieces</text>
<text x="430" y="350" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">one hidden layer: m ReLUs</text>
<text x="430" y="395" font-size="18" font-weight="700" text-anchor="start" fill="#C24135">→ at most m+1 intervals</text>
<text x="430" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">lower bound 还需指定误差与目标分布。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">四种结论分账</text>
<rect x="845" y="100" width="285" height="56" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="134.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">expressivity / regions</text>
<rect x="845" y="192" width="285" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="226.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">approximation lower bound</text>
<rect x="845" y="284" width="285" height="56" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="987.5" y="318.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">optimization reachability</text>
<rect x="845" y="376" width="285" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="410.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">generalization + hardware</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">指数表达优势是目标族—资源—误差定理，不是越深越好的一般经验律。</text>
</svg>