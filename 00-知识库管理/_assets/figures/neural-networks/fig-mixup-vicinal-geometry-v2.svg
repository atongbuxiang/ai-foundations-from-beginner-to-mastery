<line x1="76" y1="374" x2="76" y2="105" stroke="#1F2937" stroke-width="2"/>
<text x="350" y="402" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">x[1]</text>
<text x="80" y="100" font-size="15" font-weight="600" text-anchor="start" fill="#64748B">x[2]</text>
<line x1="260" y1="342" x2="100" y2="138" stroke="#D7DEE8" stroke-width="3" stroke-dasharray="7 5"/>
<circle cx="260" cy="342" r="9" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<circle cx="100" cy="138" r="9" fill="#C24135" stroke="#C24135" stroke-width="1"/>
<circle cx="140" cy="189" r="10" fill="#FFFEFB" stroke="#0F766E" stroke-width="3"/>
<text x="272" y="348" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">x1=(2,0)</text>
<text x="112" y="128" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">x2=(0,4)</text>
<text x="155" y="194" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">x~=(.5,3)</text>
<rect x="52" y="421" width="310" height="62" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="207" y="447" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">lambda=.25 → y~=(.25,0,.75)</text>
<text x="207" y="473" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">same lambda, paired permutation</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Beta(alpha,alpha) 决定混合强度</text>
<line x1="470" y1="355" x2="715" y2="355" stroke="#1F2937" stroke-width="2"/>
<line x1="470" y1="355" x2="470" y2="140" stroke="#1F2937" stroke-width="2"/>
<text x="715" y="128" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">alpha →</text>
<text x="472" y="128" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">E[lam(1-lam)]</text>
<circle cx="470.0" cy="319.1666666666667" r="4.5" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
