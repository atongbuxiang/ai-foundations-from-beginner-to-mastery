<text x="470" y="384" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">.1</text>
<text x="592.5" y="384" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">1</text>
<text x="715" y="384" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">10</text>
<rect x="445" y="405" width="315" height="78" rx="5" fill="#FFFBEB" stroke="#B7791F" stroke-width="2"/>
<text x="602" y="435" font-size="16" font-weight="700" text-anchor="middle" fill="#B7791F">E[lambda]=.5</text>
<text x="602" y="464" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">Var(lambda)=1 / {4(2 alpha+1)}</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三份实现合同</text>
<rect x="845" y="90" width="286" height="70" rx="4" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.8"/>
<text x="988" y="118" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">input mixup</text>
<text x="988" y="145" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">pixel/token chord can leave semantics</text>
<rect x="845" y="184" width="286" height="70" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="988" y="212" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">manifold mixup</text>
<text x="988" y="239" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">choose layer, suffix and target</text>
<rect x="845" y="278" width="286" height="70" rx="4" fill="#FFFEFB" stroke="#B7791F" stroke-width="1.8"/>
<text x="988" y="306" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F">normalization</text>
<text x="988" y="333" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">mixed batch changes statistics</text>
<rect x="845" y="372" width="286" height="70" rx="4" fill="#FFFEFB" stroke="#C24135" stroke-width="1.8"/>
<text x="988" y="400" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">distributed pair</text>
<text x="988" y="427" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">pairing + RNG define the method</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Mixup 训练的是 vicinal distribution；chord 的统计、语义、目标与系统实现必须同时声明。</text>
</svg>