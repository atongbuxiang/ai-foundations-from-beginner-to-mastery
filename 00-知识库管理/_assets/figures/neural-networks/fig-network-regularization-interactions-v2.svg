<text x="67" y="107" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">target</text>
<text x="347" y="107" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">label smoothing</text>
<rect x="52" y="164" width="310" height="58" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="67" y="189" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">input / hidden</text>
<text x="347" y="189" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">mixup</text>
<rect x="52" y="246" width="310" height="58" rx="4" fill="#FFFEFB" stroke="#B7791F" stroke-width="1.8"/>
<text x="67" y="271" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">activation / path</text>
<text x="347" y="271" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">dropout / DropPath</text>
<rect x="52" y="328" width="310" height="58" rx="4" fill="#FFFEFB" stroke="#C24135" stroke-width="1.8"/>
<text x="67" y="353" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">parameter / update</text>
<text x="347" y="353" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">L2 / AdamW</text>
<rect x="52" y="410" width="310" height="58" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="67" y="435" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">function</text>
<text x="347" y="435" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">Jacobian / consistency</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">2×2 才看得见 interaction</text>
