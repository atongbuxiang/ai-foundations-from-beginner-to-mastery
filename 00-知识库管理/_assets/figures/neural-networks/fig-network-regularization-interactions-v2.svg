<text x="861" y="104" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">1 exact</text>
<text x="1115" y="129" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">operator / objective identity</text>
<rect x="845" y="164" width="286" height="58" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="861" y="186" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">2 local</text>
<text x="1115" y="211" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">Taylor / finite-sample estimate</text>
<rect x="845" y="246" width="286" height="58" rx="4" fill="#FFFEFB" stroke="#B7791F" stroke-width="1.8"/>
<text x="861" y="268" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">3 mechanism</text>
<text x="1115" y="293" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">controlled mediator + ablation</text>
<rect x="845" y="328" width="286" height="58" rx="4" fill="#FFFEFB" stroke="#C24135" stroke-width="1.8"/>
<text x="861" y="350" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">4 benchmark</text>
<text x="1115" y="375" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">multi-seed held-out comparison</text>
<rect x="845" y="410" width="286" height="58" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="861" y="432" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">5 deployment</text>
<text x="1115" y="457" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">shift, cost, monitoring</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">联合正则化不是把系数相加；要记录干预位置、交互、调参预算、计算成本与证据等级。</text>
</svg>