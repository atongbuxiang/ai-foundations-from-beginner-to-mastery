<text x="680" y="353" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">A=1, B=1</text>
<text x="534" y="112" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">B=0</text>
<text x="680" y="112" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">B=1</text>
<text x="455" y="190" font-size="15" font-weight="700" text-anchor="end" fill="#0F766E">A=0</text>
<text x="455" y="336" font-size="15" font-weight="700" text-anchor="end" fill="#0F766E">A=1</text>
<rect x="445" y="414" width="310" height="68" rx="5" fill="#FFFBEB" stroke="#B7791F" stroke-width="2"/>
<text x="600" y="440" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F">Delta_AB=(-.06)-(-.03)=-.03</text>
<text x="600" y="468" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">synergy on risk in this protocol only</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">claim 逐级升级</text>
