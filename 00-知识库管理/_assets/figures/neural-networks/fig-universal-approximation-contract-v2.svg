<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">万能逼近：对象合同、稠密性与三座桥</title>
<desc id="desc">UAT 绑定 domain、target、activation、network union 与 norm；其结论停在表示存在性。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">五个对象缺一不可</text>
<rect x="55" y="92" width="290" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="200.0" y="124.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">compact K</text>
<rect x="55" y="170" width="290" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="200.0" y="202.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">target C(K)</text>
<rect x="55" y="248" width="290" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="200.0" y="280.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">activation σ</text>
<rect x="55" y="326" width="290" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="200.0" y="358.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">all finite widths</text>
<rect x="55" y="404" width="290" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="200.0" y="436.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">sup norm</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">量词与反证骨架</text>
<text x="435" y="110" font-size="20" font-weight="700" text-anchor="start" fill="#0F766E" class="math">∀f  ∀ε&gt;0  ∃m,θ</text>
<text x="435" y="150" font-size="18" font-weight="650" text-anchor="start" fill="#1F2937" class="math">||f−gθ||∞ &lt; ε</text>
<rect x="445" y="205" width="305" height="48" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="597.5" y="235.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">not dense</text>
<rect x="445" y="275" width="305" height="48" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="597.5" y="305.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">Hahn–Banach functional</text>
<rect x="445" y="345" width="305" height="48" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="597.5" y="375.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">Riesz signed measure</text>
<rect x="445" y="415" width="305" height="48" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="597.5" y="445.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">halfspaces force μ=0</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">结论停在哪里</text>
<rect x="845" y="95" width="285" height="56" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="129.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">representation exists</text>
<rect x="845" y="187" width="285" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="221.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">optimizer reaches it?</text>
<rect x="845" y="279" width="285" height="56" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="987.5" y="313.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">finite data selects it?</text>
<rect x="845" y="371" width="285" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="405.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">resource rate efficient?</text>
<text x="840" y="487" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">UAT 只回答第一行。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先补全函数空间和误差，再区分存在、训练、统计与资源效率。</text>
</svg>