<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Residual Learning：恒等基线与证据层</title>
<desc id="desc">残差块把目标映射改写为输入加增量；只有完整块允许零分支且捷径为恒等时，加深才可保留原函数；可表示、可优化和可泛化属于不同证据层。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">学习整映射，还是学习偏离量</text>
<rect x="55" y="108" width="86" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="98.0" y="139.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">x</text>
<rect x="245" y="96" width="112" height="62" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="301.0" y="133.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">H(x)</text>
<line x1="145" y1="133" x2="240" y2="128" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<text x="198" y="112" font-size="15" font-weight="700" text-anchor="middle" fill="#64748B">plain</text>
<rect x="55" y="240" width="86" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="98.0" y="271.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">x</text>
<rect x="190" y="225" width="96" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="238.0" y="257.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">F(x)</text>
<line x1="145" y1="255" x2="185" y2="251" stroke="#0F766E" stroke-width="2.4" marker-end="url(#a1)"/>
<path d="M98 294V355H324" fill="none" stroke="#2563EB" stroke-width="2.8" marker-end="url(#a0)"/>
<line x1="238" y1="281" x2="238" y2="350" stroke="#0F766E" stroke-width="2.4" marker-end="url(#a1)"/>
<circle cx="324" cy="355" r="8" fill="#FFFEFB" stroke="#1F2937" stroke-width="2"/>
<text x="200" y="402" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">residual: H(x) = x + F(x)</text>
<text x="200" y="438" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">target branch: F*(x) = H(x) - x</text>
<text x="200" y="477" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">identity baseline: F = 0</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">shortcut 名字不能替代合同</text>
<rect x="445" y="100" width="132" height="55" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="511.0" y="133.5" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">x + 0 = x</text>
<text x="760" y="137" font-size="15" font-weight="700" text-anchor="end" fill="#0F766E">true identity</text>
<rect x="445" y="215" width="132" height="55" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="511.0" y="248.5" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">P x + 0</text>
<text x="760" y="250" font-size="15" font-weight="700" text-anchor="end" fill="#C24135">projection != I</text>
<rect x="445" y="330" width="132" height="55" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="511.0" y="363.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">ReLU(x+0)</text>
<text x="760" y="365" font-size="15" font-weight="700" text-anchor="end" fill="#C24135">negative x lost</text>
<rect x="442" y="425" width="328" height="64" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="606" y="451" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">x_L = x_0 + sum F_l(x_l)</text>
<text x="606" y="477" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">exact sum; branch inputs stay coupled</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">从存在到效果：四道证据门</text>
<rect x="845" y="98" width="285" height="70" rx="5" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="860" y="126" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">1  representation</text>
<text x="1115" y="152" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">zero branch preserves function</text>
<line x1="987" y1="171" x2="987" y2="192" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="845" y="198" width="285" height="70" rx="5" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="860" y="226" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">2  optimization</text>
<text x="1115" y="252" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">algorithm reaches a good point</text>
<line x1="987" y1="271" x2="987" y2="292" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="845" y="298" width="285" height="70" rx="5" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="860" y="326" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">3  training evidence</text>
<text x="1115" y="352" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">deeper train error improves</text>
<line x1="987" y1="371" x2="987" y2="392" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="845" y="398" width="285" height="70" rx="5" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="860" y="426" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">4  generalization</text>
<text x="1115" y="452" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">held-out task and protocol</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">残差首先提供恒等基线；它是否更易训练、更能泛化，必须逐级补证。</text>
</svg>