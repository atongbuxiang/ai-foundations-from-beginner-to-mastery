<title id="title">Softplus、GELU 与 SiLU：三个不同的平滑算子</title>
<desc id="desc">Softplus 平滑 maximum；GELU 与 SiLU 以不同 CDF 自门控；函数曲线相近不代表构造、导数、曲率与实现合同相同。</desc>
