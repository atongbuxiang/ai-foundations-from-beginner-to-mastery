<text x="307.5" y="137.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">z: n_out</text>
<rect x="160" y="198" width="82" height="55" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="201.0" y="231.5" font-size="20" font-weight="650" text-anchor="middle" fill="#C24135">W</text>
