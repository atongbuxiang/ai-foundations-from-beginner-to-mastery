<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">ResNet as Euler：step、稳定域与极限条件</title>
<desc id="desc">带尺度残差步与显式 Euler 同形；固定时间区间需要 h=T/N；连续衰减并不保证大步 Euler 稳定；ODE 极限还需一致向量场与误差控制。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">固定 horizon 才叫网格加密</text>
<circle cx="65" cy="145" r="11" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="65" y="181" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x0</text>
<line x1="79" y1="145" x2="120" y2="145" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<circle cx="135" cy="145" r="11" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="135" y="181" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x1</text>
<line x1="149" y1="145" x2="190" y2="145" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<circle cx="205" cy="145" r="11" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="205" y="181" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x2</text>
<line x1="219" y1="145" x2="260" y2="145" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<circle cx="275" cy="145" r="11" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="275" y="181" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x3</text>
<line x1="289" y1="145" x2="330" y2="145" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<circle cx="345" cy="145" r="11" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="345" y="181" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">xN</text>
<text x="200" y="105" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">h = T / N</text>
<rect x="55" y="225" width="300" height="72" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="205" y="254" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">x_(k+1) = x_k + h f_k(x_k)</text>
<text x="205" y="282" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">residual magnitude must be O(h)</text>
<text x="55" y="365" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">fixed h + more layers</text>
<text x="55" y="397" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">usually extends time, not resolution</text>
<text x="55" y="450" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">local defect O(h^2)</text>
<text x="55" y="480" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">global error O(h), under assumptions</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Euler 稳定圆盘</text>
<circle cx="645" cy="285" r="105" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5"/>
<line x1="445" y1="285" x2="775" y2="285" stroke="#D7DEE8" stroke-width="2"/>
<line x1="750" y1="145" x2="750" y2="425" stroke="#D7DEE8" stroke-width="2"/>
<text x="775" y="273" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">Re(z)</text>
<text x="760" y="158" font-size="15" font-weight="600" text-anchor="start" fill="#64748B">Im(z)</text>
<text x="645" y="315" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">-1</text>
<text x="750" y="315" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">0</text>
<circle cx="645" cy="285" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="645" y="455" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">stable: |1+z| &lt;= 1</text>
<circle cx="485" cy="285" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="485" y="267" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">z=-2.5</text>
<text x="600" y="490" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">Re(lambda)&lt;0 is not enough when h is large</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">从公式同形到 ODE limit</text>
<rect x="845" y="94" width="285" height="54" rx="5" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.8"/>
<text x="860" y="118" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">1  algebra</text>
<text x="1115" y="134" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">x + h f</text>
<line x1="987" y1="151" x2="987" y2="169" stroke="#1F2937" stroke-width="1.6" marker-end="url(#a3)"/>
<rect x="845" y="174" width="285" height="54" rx="5" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="860" y="198" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">2  scaling</text>
<text x="1115" y="214" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">h=T/N</text>
<line x1="987" y1="231" x2="987" y2="249" stroke="#1F2937" stroke-width="1.6" marker-end="url(#a3)"/>
<rect x="845" y="254" width="285" height="54" rx="5" fill="#FFFEFB" stroke="#B7791F" stroke-width="1.8"/>
<text x="860" y="278" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">3  family</text>
<text x="1115" y="294" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">consistent f_N</text>
<line x1="987" y1="311" x2="987" y2="329" stroke="#1F2937" stroke-width="1.6" marker-end="url(#a3)"/>
<rect x="845" y="334" width="285" height="54" rx="5" fill="#FFFEFB" stroke="#C24135" stroke-width="1.8"/>
<text x="860" y="358" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">4  analysis</text>
<text x="1115" y="374" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">regular + stable</text>
<line x1="987" y1="391" x2="987" y2="409" stroke="#1F2937" stroke-width="1.6" marker-end="url(#a3)"/>
<rect x="845" y="414" width="285" height="54" rx="5" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.8"/>
<text x="860" y="438" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">5  evidence</text>
<text x="1115" y="454" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">error rate + compute</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">ResNet–Euler 是精确模板对应；连续极限必须补齐 step、族、一致性与稳定性。</text>
</svg>