<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">RMSNorm Geometry：少一个中心化投影</title>
<desc id="desc">LayerNorm 先删除共同平移再归一半径；RMSNorm 直接按原点半径归一，因此保留均值方向，并在 VJP 中少一个 mean-removal 项。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">同一输入，两条几何路径</text>
<rect x="52" y="105" width="78" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="91.0" y="135.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">x</text>
<rect x="170" y="88" width="174" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="257.0" y="120.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">LN: subtract mean</text>
<rect x="170" y="185" width="174" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="257.0" y="217.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">RMS: keep mean</text>
<line x1="134" y1="125" x2="165" y2="113" stroke="#0F766E" stroke-width="2.3" marker-end="url(#a1)"/>
<line x1="134" y1="135" x2="165" y2="210" stroke="#2563EB" stroke-width="2.3" marker-end="url(#a0)"/>
<rect x="90" y="295" width="255" height="54" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="217.5" y="328.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">normalize radius</text>
<line x1="257" y1="144" x2="217" y2="290" stroke="#0F766E" stroke-width="2.2" marker-end="url(#a1)"/>
<line x1="257" y1="241" x2="242" y2="290" stroke="#2563EB" stroke-width="2.2" marker-end="url(#a0)"/>
<text x="50" y="405" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">LN removes: shift + radial</text>
<text x="50" y="438" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">RMS removes: radial only</text>
<text x="50" y="476" font-size="16" font-weight="650" text-anchor="start" fill="#C24135">kept degrees: D-2  vs  D-1</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">超平面交球面 vs 整个球面</text>
<circle cx="600" cy="286" r="132" fill="none" stroke="#D7DEE8" stroke-width="2"/>
<line x1="455" y1="430" x2="748" y2="150" stroke="#0F766E" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="735" y="138" font-size="15" font-weight="700" text-anchor="end" fill="#0F766E">1-perp</text>
<path d="M507 380C548 421 653 419 696 377" fill="none" stroke="#2563EB" stroke-width="4"/>
<text x="600" y="455" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">RMS: whole sphere</text>
<circle cx="521" cy="370" r="8" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="678" cy="187" r="8" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="600" y="112" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">LN: intersection with 1-perp</text>
<line x1="600" y1="286" x2="690" y2="380" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<text x="697" y="397" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">mean kept</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">VJP 的一个缺项</text>
<rect x="845" y="102" width="285" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="136.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">u = gamma * g</text>
<rect x="845" y="202" width="285" height="70" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="243.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">LN: u - mean(u) - h mean(uh)</text>
<rect x="845" y="318" width="285" height="70" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="359.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">RMS: u - h mean(uh)</text>
<line x1="987" y1="162" x2="987" y2="197" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="987" y1="277" x2="987" y2="313" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="987" y="432" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">LN: sum(dx)=0</text>
<text x="987" y="464" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">RMS: x dot dx=0 if eps=0</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">RMSNorm 保留共同均值方向；少一次 centering，就是少删除一个自由度。</text>
</svg>