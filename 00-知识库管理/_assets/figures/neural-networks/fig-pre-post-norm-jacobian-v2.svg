<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Pre-Norm vs Post-Norm：恒等铁路与归一化闸门</title>
<desc id="desc">Pre-Norm 把归一化放入残差分支，Jacobian 显式含 identity rail；Post-Norm 对残差和整体归一，使 identity 与 branch 一起经过 normalization Jacobian。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">前向：Norm 在分叉前还是合流后</text>
<rect x="50" y="105" width="72" height="46" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="86.0" y="134.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">x</text>
<rect x="165" y="90" width="74" height="46" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="202.0" y="119.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">N</text>
<rect x="280" y="90" width="74" height="46" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="317.0" y="119.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">F</text>
<line x1="126" y1="126" x2="160" y2="113" stroke="#0F766E" stroke-width="2.3" marker-end="url(#a1)"/>
<line x1="243" y1="113" x2="275" y2="113" stroke="#C24135" stroke-width="2.3" marker-end="url(#a2)"/>
<path d="M86 154V235H318" fill="none" stroke="#2563EB" stroke-width="2.8" marker-end="url(#a0)"/>
<line x1="318" y1="140" x2="318" y2="230" stroke="#C24135" stroke-width="2.3" marker-end="url(#a2)"/>
<circle cx="318" cy="235" r="7" fill="#FFFEFB" stroke="#1F2937" stroke-width="2"/>
<text x="200" y="278" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">Pre: x + F(N(x))</text>
<rect x="50" y="335" width="72" height="46" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="86.0" y="364.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">x</text>
<rect x="165" y="322" width="74" height="46" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="202.0" y="351.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">F</text>
<path d="M86 384V432H250" fill="none" stroke="#2563EB" stroke-width="2.8" marker-end="url(#a0)"/>
<line x1="126" y1="358" x2="160" y2="345" stroke="#C24135" stroke-width="2.3" marker-end="url(#a2)"/>
<line x1="202" y1="372" x2="202" y2="427" stroke="#C24135" stroke-width="2.3" marker-end="url(#a2)"/>
<circle cx="250" cy="432" r="7" fill="#FFFEFB" stroke="#1F2937" stroke-width="2"/>
<rect x="280" y="407" width="74" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="317.0" y="438.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">N</text>
<line x1="258" y1="432" x2="275" y2="432" stroke="#0F766E" stroke-width="2.3" marker-end="url(#a1)"/>
<text x="202" y="488" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">Post: N(x + F(x))</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">反向：rail 与 gate</text>
<line x1="445" y1="150" x2="755" y2="150" stroke="#2563EB" stroke-width="5" marker-end="url(#a0)"/>
<text x="600" y="126" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">identity rail I</text>
<rect x="485" y="225" width="96" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="533.0" y="256.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">J_N</text>
<rect x="625" y="225" width="96" height="50" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="673.0" y="256.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">J_F</text>
<path d="M455 150V250H480" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<line x1="585" y1="250" x2="620" y2="250" stroke="#C24135" stroke-width="2.3" marker-end="url(#a2)"/>
<path d="M725 250H755V155" fill="none" stroke="#C24135" stroke-width="2.3" marker-end="url(#a2)"/>
<text x="600" y="315" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">Pre: I + J_F J_N</text>
<rect x="455" y="380" width="112" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="511.0" y="412.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">I + J_F</text>
<rect x="630" y="380" width="112" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="686.0" y="412.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">J_N</text>
<line x1="571" y1="406" x2="625" y2="406" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<text x="600" y="476" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135">Post: J_N (I + J_F)</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">结论必须停在证据层</text>
<rect x="845" y="100" width="285" height="68" rx="5" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="862" y="128" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">1  exact</text>
<text x="1115" y="152" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">Jacobian identities</text>
<line x1="987" y1="172" x2="987" y2="192" stroke="#1F2937" stroke-width="1.7" marker-end="url(#a3)"/>
<rect x="845" y="198" width="285" height="68" rx="5" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="862" y="226" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">2  theorem</text>
<text x="1115" y="250" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">mean-field + assumptions</text>
<line x1="987" y1="270" x2="987" y2="290" stroke="#1F2937" stroke-width="1.7" marker-end="url(#a3)"/>
<rect x="845" y="296" width="285" height="68" rx="5" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="862" y="324" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">3  explanation</text>
<text x="1115" y="348" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">relative residual growth</text>
<line x1="987" y1="368" x2="987" y2="388" stroke="#1F2937" stroke-width="1.7" marker-end="url(#a3)"/>
<rect x="845" y="394" width="285" height="68" rx="5" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="862" y="422" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">4  experiment</text>
<text x="1115" y="446" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">task / tuning / seed</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">恒等 rail 是严格结构；训练稳定与最终效果还需要尺度、相关性、优化和实验。</text>
</svg>