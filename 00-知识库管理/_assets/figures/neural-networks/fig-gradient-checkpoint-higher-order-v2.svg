<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">梯度验证、Checkpointing 与高阶微分边界</title>
<desc id="desc">有限差分误差随步长呈 U 形；checkpoint 以重算换存储；Hessian-vector product 通过一阶算子组合获得，但状态、随机性和不可微点必须单独审计。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">gradient check：找 U 形窗口</text>
<line x1="70" y1="430" x2="350" y2="430" stroke="#D7DEE8" stroke-width="2"/>
<line x1="70" y1="430" x2="70" y2="105" stroke="#D7DEE8" stroke-width="2"/>
<text x="210" y="470" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">log step size</text>
<text x="48" y="260" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">error</text>
<path d="M82 125C135 150 155 260 208 340C250 402 295 320 340 145" fill="none" stroke="#C24135" stroke-width="4"/>
<line x1="208" y1="342" x2="208" y2="430" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="208" cy="342" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="125" y="175" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">truncation</text>
<text x="298" y="178" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">roundoff</text>
<rect x="75" y="442" width="270" height="58" rx="7" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="210" y="465" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">central FD: O(h^2) + O(u/h)</text>
<text x="210" y="488" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">scan h; do not trust one step</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">checkpoint：存锚点，重放区间</text>
<rect x="438" y="210" width="27" height="48" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="451.5" y="240" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">0</text>
<line x1="467" y1="234" x2="474" y2="234" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="476" y="210" width="27" height="48" rx="4" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2"/>
<text x="489.5" y="240" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">1</text>
<line x1="505" y1="234" x2="512" y2="234" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="514" y="210" width="27" height="48" rx="4" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2"/>
<text x="527.5" y="240" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">2</text>
<line x1="543" y1="234" x2="550" y2="234" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="552" y="210" width="27" height="48" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="565.5" y="240" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">3</text>
<line x1="581" y1="234" x2="588" y2="234" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="590" y="210" width="27" height="48" rx="4" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2"/>
<text x="603.5" y="240" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">4</text>
<line x1="619" y1="234" x2="626" y2="234" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="628" y="210" width="27" height="48" rx="4" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2"/>
<text x="641.5" y="240" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">5</text>
<line x1="657" y1="234" x2="664" y2="234" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="666" y="210" width="27" height="48" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="679.5" y="240" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">6</text>
<line x1="695" y1="234" x2="702" y2="234" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="704" y="210" width="27" height="48" rx="4" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="2"/>
<text x="717.5" y="240" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">7</text>
<line x1="733" y1="234" x2="740" y2="234" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="742" y="210" width="27" height="48" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="755.5" y="240" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">8</text>
<text x="438" y="125" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">forward: retain only selected states</text>
<path d="M555 285C575 340 690 340 751 285" fill="none" stroke="#C24135" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<text x="650" y="365" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">reverse: recompute 6 -&gt; 7 -&gt; 8</text>
<rect x="445" y="405" width="310" height="78" rx="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="600" y="432" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB" class="math">uniform segmentation: memory ~ n/k + k</text>
<text x="600" y="458" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">choose k near sqrt(n); schedule matters</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">HVP 与语义边界</text>
<rect x="845" y="110" width="120" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="905.0" y="144.0" font-size="18" font-weight="650" text-anchor="middle" fill="#2563EB">v</text>
<rect x="1005" y="110" width="125" height="56" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="1067.5" y="144.0" font-size="18" font-weight="650" text-anchor="middle" fill="#0F766E">H v</text>
<line x1="970" y1="138" x2="1000" y2="138" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="986" y="96" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">JVP(grad)</text>
<text x="845" y="210" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">No full Hessian needed</text>
<rect x="845" y="250" width="285" height="48" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="857" y="270" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">RNG/state replay</text>
<text x="857" y="290" font-size="15" font-weight="500" text-anchor="start" fill="#1F2937">same executed function</text>
<rect x="845" y="315" width="285" height="48" rx="6" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="857" y="335" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">kinks/branches</text>
<text x="857" y="355" font-size="15" font-weight="500" text-anchor="start" fill="#1F2937">program derivative convention</text>
<rect x="845" y="380" width="285" height="48" rx="6" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="857" y="400" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">create graph</text>
<text x="857" y="420" font-size="15" font-weight="500" text-anchor="start" fill="#1F2937">retain derivative operations</text>
<rect x="845" y="445" width="285" height="48" rx="6" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="857" y="465" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">memory claim</text>
<text x="857" y="485" font-size="15" font-weight="500" text-anchor="start" fill="#1F2937">include tape + workspace</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">可信梯度需要三类证据同时成立：数值一致、可回放的程序语义、明确的时间—内存预算。</text>
</svg>