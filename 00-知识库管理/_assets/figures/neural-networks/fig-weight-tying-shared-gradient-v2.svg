<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Weight Tying：同一矩阵，两种角色，一次梯度求和</title>
<desc id="desc">输入端用 E 的一行编码 token，输出端用 E 的全部行作为类别 prototypes；共享减少参数但加入约束，反向梯度是 lookup 与 classifier 两条 VJP 的和。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">共享矩阵的两条前向路径</text>
<rect x="52" y="104" width="86" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="95.0" y="134.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">token i</text>
<rect x="170" y="96" width="112" height="56" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="226.0" y="130.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">E^T e_i</text>
<line x1="143" y1="128" x2="165" y2="125" stroke="#2563EB" stroke-width="2.2" marker-end="url(#a0)"/>
<text x="220" y="184" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">input row</text>
<rect x="52" y="280" width="86" height="48" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="95.0" y="310.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">hidden h</text>
<rect x="170" y="272" width="112" height="56" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="226.0" y="306.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">E h + b</text>
<line x1="143" y1="304" x2="165" y2="301" stroke="#C24135" stroke-width="2.2" marker-end="url(#a2)"/>
<text x="220" y="360" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">all output rows</text>
<rect x="52" y="414" width="310" height="68" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="207" y="442" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">E [V x d]</text>
<text x="207" y="469" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">direct tie requires hidden dimension d</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">shared Parameter 的 VJP 相加</text>
<rect x="445" y="98" width="315" height="88" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="602" y="128" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">lookup contribution</text>
<text x="602" y="158" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">e_i g_x^T  (row sparse)</text>
<rect x="445" y="226" width="315" height="88" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="602" y="256" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">output contribution</text>
<text x="602" y="286" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">(p-y) h^T  (usually dense)</text>
<line x1="602" y1="321" x2="602" y2="365" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="445" y="374" width="315" height="82" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="602" y="405" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">dE = dE_input + dE_output</text>
<text x="602" y="435" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">plus every other shared use</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">参数节省与函数约束</text>
<rect x="845" y="96" width="285" height="84" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="987" y="126" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">untied: E [Vxd] + U [Vxd]</text>
<text x="987" y="156" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">two vocabulary matrices</text>
<rect x="845" y="218" width="285" height="84" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="987" y="248" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">tied: U = E</text>
<text x="987" y="278" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">save Vd parameters</text>
<rect x="845" y="340" width="285" height="104" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="987" y="370" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">if d_h != d</text>
<text x="987" y="400" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">z = E P h + b</text>
<text x="987" y="428" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">projection changes count and geometry</text>
<text x="987" y="482" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F">fewer parameters != free equivalence</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">共享参数既节省一个词表矩阵，也把输入表示和输出分类器耦合；必须同时审计两条梯度、维度与尺度。</text>
</svg>