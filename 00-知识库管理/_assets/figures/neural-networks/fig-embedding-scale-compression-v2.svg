<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Embedding Scale 与 Compression：容量、误差和系统成本三本账</title>
<desc id="desc">初始化决定 row norm 与 tied logit variance；低秩/自适应维度改变函数类；量化引入可界的重构误差。参数更少不自动等于更低 latency 或更小训练状态。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">初始化先校准两个二阶矩</text>
<rect x="52" y="98" width="310" height="86" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="207" y="129" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">E ||e_i||^2 = d sigma_E^2</text>
<text x="207" y="158" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">lookup row scale</text>
<rect x="52" y="224" width="310" height="96" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="207" y="254" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">Var(e_i^T h) = d sigma_E^2 q_h</text>
<text x="207" y="284" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">tied output logit scale</text>
<rect x="52" y="362" width="310" height="108" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="207" y="392" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">one init cannot be judged alone</text>
<text x="207" y="421" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">check norm | logit RMS | entropy</text>
<text x="207" y="451" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">and padding / positional scaling</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">low-rank factorization</text>
<rect x="445" y="104" width="90" height="250" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="490" y="135" font-size="20" font-weight="700" text-anchor="middle" fill="#2563EB">A</text>
<text x="490" y="165" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">V x r</text>
<rect x="590" y="174" width="150" height="86" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="665" y="207" font-size="20" font-weight="700" text-anchor="middle" fill="#0F766E">B</text>
<text x="665" y="237" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">r x d</text>
<line x1="540" y1="218" x2="583" y2="218" stroke="#1F2937" stroke-width="2.1" marker-end="url(#a3)"/>
<text x="602" y="389" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135">E = A B, rank(E) &lt;= r</text>
<rect x="445" y="414" width="315" height="72" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="602" y="442" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">V=50k, d=1024, r=128</text>
<text x="602" y="470" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">51.2m -&gt; 6.531m parameters</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">quantization error</text>
<rect x="845" y="96" width="285" height="80" rx="5" fill="#FFFBEB" stroke="#B7791F" stroke-width="2"/>
<text x="987" y="126" font-size="16" font-weight="700" text-anchor="middle" fill="#B7791F">e_hat = s (q - z0)</text>
<text x="987" y="154" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">scale and zero-point are metadata</text>
<rect x="845" y="216" width="285" height="88" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="987" y="246" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">||e_hat-e|| &lt;= sqrt(d) s/2</text>
<text x="987" y="276" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">|delta logit| &lt;= ||h|| ||error||</text>
<rect x="845" y="344" width="285" height="84" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="987" y="374" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">FP16 table = 102.4 MB</text>
<text x="987" y="404" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">INT4 raw codes = 25.6 MB</text>
<text x="987" y="476" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F">+ metadata, kernel, master state</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">压缩要同时报告秩、重构/logit 误差、训练状态、kernel 与端到端质量；raw code bytes 不是完整收益。</text>
</svg>