<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">参数对称性：轨道、纤维与函数商空间</title>
<desc id="desc">隐藏置换和 ReLU 正缩放改变坐标却保持函数；冗余单元形成连续纤维。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">置换需相邻层补偿</text>
<rect x="55" y="115" width="95" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="102.5" y="147.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">W1</text>
<rect x="185" y="115" width="95" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="232.5" y="147.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">hidden</text>
<rect x="315" y="115" width="55" height="52" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="342.5" y="147.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">W2</text>
<line x1="155" y1="141" x2="180" y2="141" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="285" y1="141" x2="310" y2="141" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="45" y="235" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">W1→W1P, b1→b1P</text>
<text x="45" y="280" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">W2→P⁻¹W2</text>
<text x="45" y="350" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">hidden units 只是内部坐标名字。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">ReLU 连续缩放纤维</text>
<text x="440" y="120" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E" class="math">ReLU(cz)=c ReLU(z), c&gt;0</text>
<path d="M455 330C520 170 650 170 755 330" fill="none" stroke="#0F766E" stroke-width="4"/>
<circle cx="485" cy="280" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="720" cy="280" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="605" y="365" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">同一 function 的参数轨道</text>
<text x="430" y="440" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937">incoming ×c；outgoing ÷c</text>
<text x="430" y="482" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">参数距离可变，函数距离为 0。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">投影到 quotient 后</text>
<circle cx="900" cy="145" r="34" fill="#FFFEFB" stroke="#2563EB" stroke-width="3"/>
<circle cx="1065" cy="145" r="34" fill="#FFFEFB" stroke="#0F766E" stroke-width="3"/>
<path d="M870 260C920 205 1030 205 1095 260" fill="none" stroke="#D7DEE8" stroke-width="3"/>
<line x1="980" y1="270" x2="980" y2="335" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="870" y="345" width="220" height="62" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="980.0" y="382.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">one equivalence class [θ]</text>
<text x="840" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">Hessian flatness / merging / posterior</text>
<text x="840" y="492" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">都应先处理 symmetry。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">比较模型时优先使用函数或对齐后的参数；可辨识性必须写成 modulo symmetry。</text>
</svg>