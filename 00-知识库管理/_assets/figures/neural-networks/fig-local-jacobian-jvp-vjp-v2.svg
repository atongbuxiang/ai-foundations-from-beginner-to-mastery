<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">局部微分：一个线性算子的两种方向作用</title>
<desc id="desc">Derivative 是从输入扰动到输出扰动的线性映射；JVP 前推 tangent，VJP 回拉 cotangent，二者由点积恒等式配对。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Df 是算子，J 是坐标表</text>
<circle cx="120" cy="245" r="76" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<circle cx="300" cy="245" r="64" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5"/>
<text x="120" y="230" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">input</text>
<text x="120" y="258" font-size="24" font-weight="700" text-anchor="middle" fill="#2563EB">Rⁿ</text>
<text x="300" y="230" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">output</text>
<text x="300" y="258" font-size="24" font-weight="700" text-anchor="middle" fill="#0F766E">Rᵐ</text>
<line x1="197" y1="225" x2="235" y2="225" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<text x="216" y="207" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">Df(x)</text>
<text x="47" y="380" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">f(x+h)=f(x)+Df(x)[h]+o(||h||)</text>
<rect x="58" y="420" width="284" height="58" rx="7" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="200" y="445" font-size="18" font-weight="700" text-anchor="middle" fill="#C24135">J : [m,n]</text>
<text x="200" y="467" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">坐标选择后的数组</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">tangent 前推；dual 反向拉回</text>
<rect x="445" y="110" width="90" height="54" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="490.0" y="143.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">v : [n]</text>
<rect x="655" y="110" width="90" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="700.0" y="143.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">Jv : [m]</text>
<line x1="540" y1="137" x2="650" y2="137" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<text x="595" y="121" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">JVP</text>
<rect x="655" y="280" width="90" height="54" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="700.0" y="313.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">u : [m]</text>
<rect x="445" y="280" width="100" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="495.0" y="313.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">Jᵀu : [n]</text>
<line x1="650" y1="307" x2="550" y2="307" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<text x="600" y="291" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">VJP</text>
<path d="M520 190C555 235 630 235 670 190" fill="none" stroke="#D7DEE8" stroke-width="2.5" stroke-dasharray="6 5"/>
<text x="600" y="230" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2937" class="math">uᵀ(Jv) = (Jᵀu)ᵀv</text>
<text x="435" y="405" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">broadcast ↔ sum； transpose 是伴随，不是 inverse。</text>
<text x="435" y="457" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">dot test 同时检查轴、转置与累加。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">不物化巨型 Jacobian</text>
<rect x="845" y="105" width="285" height="110" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<line x1="892.5" y1="105" x2="892.5" y2="215" stroke="#D7DEE8" stroke-width="1"/>
<line x1="940.0" y1="105" x2="940.0" y2="215" stroke="#D7DEE8" stroke-width="1"/>
<line x1="987.5" y1="105" x2="987.5" y2="215" stroke="#D7DEE8" stroke-width="1"/>
<line x1="1035.0" y1="105" x2="1035.0" y2="215" stroke="#D7DEE8" stroke-width="1"/>
<line x1="1082.5" y1="105" x2="1082.5" y2="215" stroke="#D7DEE8" stroke-width="1"/>
<line x1="845" y1="132.5" x2="1130" y2="132.5" stroke="#D7DEE8" stroke-width="1"/>
<line x1="845" y1="160.0" x2="1130" y2="160.0" stroke="#D7DEE8" stroke-width="1"/>
<line x1="845" y1="187.5" x2="1130" y2="187.5" stroke="#D7DEE8" stroke-width="1"/>
<text x="987" y="242" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">full J: m×n entries</text>
<text x="845" y="292" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">n input seeds</text>
<line x1="965" y1="287" x2="1120" y2="287" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<text x="845" y="322" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">forward builds columns</text>
<text x="845" y="375" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">m output seeds</text>
<line x1="1120" y1="370" x2="965" y2="370" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="845" y="405" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">reverse builds rows</text>
<rect x="845" y="438" width="285" height="56" rx="7" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="987" y="463" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">scalar loss: m=1</text>
<text x="987" y="484" font-size="15" font-weight="500" text-anchor="middle" fill="#0F766E">one reverse seed</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">在大模型中选择所需的线性作用，而不是先造出整张 Jacobian。</text>
</svg>