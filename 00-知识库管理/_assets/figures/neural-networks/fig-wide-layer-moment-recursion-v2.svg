<circle cx="165" cy="190" r="18" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="165" y="195" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">w2</text>
<line x1="96" y1="190" x2="143" y2="190" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<line x1="187" y1="190" x2="267" y2="260" stroke="#D7DEE8" stroke-width="1.5"/>
<circle cx="76" cy="260" r="18" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="76" y="265" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">h3</text>
<circle cx="165" cy="260" r="18" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="165" y="265" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">w3</text>
<line x1="96" y1="260" x2="143" y2="260" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<line x1="187" y1="260" x2="267" y2="260" stroke="#D7DEE8" stroke-width="1.5"/>
<circle cx="76" cy="330" r="18" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="76" y="335" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">h4</text>
<circle cx="165" cy="330" r="18" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="165" y="335" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">w4</text>
<line x1="96" y1="330" x2="143" y2="330" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<line x1="187" y1="330" x2="267" y2="260" stroke="#D7DEE8" stroke-width="1.5"/>
<circle cx="76" cy="400" r="18" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="76" y="405" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">h5</text>
<circle cx="165" cy="400" r="18" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="165" y="405" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">w5</text>
<line x1="96" y1="400" x2="143" y2="400" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<line x1="187" y1="400" x2="267" y2="260" stroke="#D7DEE8" stroke-width="1.5"/>
<rect x="270" y="228" width="72" height="64" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="306.0" y="266.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">sum + b</text>
<text x="55" y="455" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937" class="math">E[z^2] = n Var(w) E[h^2] + Var(b)</text>
<rect x="55" y="474" width="290" height="35" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="1.8"/>
<text x="200" y="497" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">cross terms need a reason to vanish</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Moment operator：q -&gt; r -&gt; q&#x27;</text>
<rect x="447" y="105" width="90" height="54" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="492.0" y="138.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">q_l</text>
<rect x="558" y="105" width="90" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="603.0" y="138.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">sqrt(q) Z</text>
<rect x="669" y="105" width="80" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="709.0" y="138.0" font-size="18" font-weight="650" text-anchor="middle" fill="#0F766E">phi</text>
<line x1="539" y1="132" x2="554" y2="132" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="650" y1="132" x2="665" y2="132" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="560" y="220" width="142" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="631.0" y="253.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">r = E[phi^2]</text>
<line x1="708" y1="161" x2="660" y2="216" stroke="#0F766E" stroke-width="2.3" marker-end="url(#a1)"/>
<rect x="485" y="335" width="230" height="62" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="372.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">q&#x27; = sw^2 r + sb^2</text>
<line x1="605" y1="278" x2="605" y2="331" stroke="#2563EB" stroke-width="2.3" marker-end="url(#a0)"/>
<path d="M485 366C430 366 430 132 443 132" fill="none" stroke="#C24135" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<text x="600" y="445" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">fixed point: q* = F(q*)</text>
<text x="600" y="478" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">attraction requires local/domain stability</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三个随机性层级不能混写</text>
<rect x="845" y="105" width="285" height="68" rx="7" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="862" y="132" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">population / ensemble</text>
<text x="862" y="156" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">theory expectation</text>
<line x1="987" y1="176" x2="987" y2="201" stroke="#D7DEE8" stroke-width="1.5"/>
<rect x="845" y="205" width="285" height="68" rx="7" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="862" y="232" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">one finite network</text>
<text x="862" y="256" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">empirical across neurons</text>
<line x1="987" y1="276" x2="987" y2="301" stroke="#D7DEE8" stroke-width="1.5"/>
<rect x="845" y="305" width="285" height="68" rx="7" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="862" y="332" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">one batch / sample</text>
<text x="862" y="356" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">conditional statistic</text>
<line x1="987" y1="376" x2="987" y2="401" stroke="#D7DEE8" stroke-width="1.5"/>
<rect x="845" y="405" width="285" height="68" rx="7" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="862" y="432" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">after training</text>
<text x="862" y="456" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">weights and signals correlate</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Moment recursion 是带随机对象与近似层级的算子；固定点、有限宽实现和训练后网络必须分别验证。</text>
</svg>