<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Affine sum 的二阶账本</text>
<circle cx="76" cy="120" r="18" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="76" y="125" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">h1</text>
<circle cx="165" cy="120" r="18" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="165" y="125" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">w1</text>
<line x1="96" y1="120" x2="143" y2="120" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<line x1="187" y1="120" x2="267" y2="260" stroke="#D7DEE8" stroke-width="1.5"/>
<circle cx="76" cy="190" r="18" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
