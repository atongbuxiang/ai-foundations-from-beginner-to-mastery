<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">BatchNorm Backward：两次投影、跨样本耦合与尺度方向</title>
<desc id="desc">训练反向先乘 gain，再删除组均值与 normalized radial 分量；Jacobian 因共享统计量而非对角；正尺度不变权重的梯度位于切向并随权重尺度反比变化。</desc>
