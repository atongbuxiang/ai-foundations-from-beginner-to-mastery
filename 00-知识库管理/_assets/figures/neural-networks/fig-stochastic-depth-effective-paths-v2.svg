<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Stochastic Depth / DropPath：随机残差分支与有效深度</title>
<desc id="desc">Residual rail 允许对整条 branch 采 Bernoulli gate。Inverted scaling 匹配单块条件均值；活跃块数是 Poisson-binomial 变量，而实际计算是否减少取决于是否真正短路 branch。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">rail 保留，branch 随机</text>
<line x1="50" y1="280" x2="355" y2="280" stroke="#0F766E" stroke-width="4" marker-end="url(#a0)"/>
<circle cx="78" cy="280" r="17" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<path d="M78 262V192H117V262" fill="none" stroke="#0F766E" stroke-width="2.4"/>
<rect x="88" y="159" width="58" height="38" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="117" y="184" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">F1</text>
<text x="117" y="143" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">b=1</text>
<circle cx="155" cy="280" r="17" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<path d="M155 262V192H194V262" fill="none" stroke="#C24135" stroke-width="2.4"/>
<rect x="165" y="159" width="58" height="38" rx="4" fill="#FFFEFB" stroke="#C24135" stroke-width="1.8"/>
<text x="194" y="184" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">F2</text>
<text x="194" y="143" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">b=0</text>
<circle cx="232" cy="280" r="17" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<path d="M232 262V192H271V262" fill="none" stroke="#0F766E" stroke-width="2.4"/>
<rect x="242" y="159" width="58" height="38" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="271" y="184" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">F3</text>
<text x="271" y="143" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">b=1</text>
<circle cx="309" cy="280" r="17" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<path d="M309 262V192H348V262" fill="none" stroke="#0F766E" stroke-width="2.4"/>
<rect x="319" y="159" width="58" height="38" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="348" y="184" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">F4</text>
<text x="348" y="143" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">b=1</text>
<rect x="52" y="360" width="310" height="112" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="207" y="391" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">x[l+1] = x[l] + (b_l/q_l) F_l(x[l])</text>
<text x="207" y="423" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">b=0: parameter gradient is zero</text>
<text x="207" y="452" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">input still has the identity rail</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">survival schedule → depth law</text>
<line x1="475" y1="320" x2="720" y2="320" stroke="#1F2937" stroke-width="2"/>
<line x1="475" y1="110" x2="475" y2="320" stroke="#1F2937" stroke-width="2"/>
<text x="473" y="98" font-size="16" font-weight="700" text-anchor="start" fill="#64748B">q_l</text>
<text x="720" y="98" font-size="15" font-weight="650" text-anchor="end" fill="#64748B">block l →</text>
<circle cx="475.0" cy="153.75" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="475.0" y="348" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">1</text>
<circle cx="556.6666666666666" cy="197.5" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="556.6666666666666" y="348" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">2</text>
<circle cx="638.3333333333334" cy="241.25" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="638.3333333333334" y="348" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">3</text>
<circle cx="720.0" cy="285.0" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="720.0" y="348" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">4</text>
<path d="M475.0 153.8L556.7 197.5L638.3 241.2L720.0 285.0" fill="none" stroke="#2563EB" stroke-width="3"/>
<rect x="445" y="365" width="315" height="118" rx="5" fill="#FFFBEB" stroke="#B7791F" stroke-width="2"/>
<text x="602" y="395" font-size="18" font-weight="700" text-anchor="middle" fill="#B7791F">D = sum_l b_l</text>
<text x="602" y="427" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2937">E[D] = 2.75</text>
<text x="602" y="458" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2937">Var(D) = .78125</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">实现语义决定收益</text>
<rect x="846" y="88" width="284" height="68" rx="4" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.8"/>
<text x="988" y="115" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">batch gate</text>
<text x="988" y="141" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">one decision for all samples</text>
<rect x="846" y="181" width="284" height="68" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="1.8"/>
<text x="988" y="208" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">row gate</text>
<text x="988" y="234" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">one gate per sample</text>
<rect x="846" y="274" width="284" height="68" rx="4" fill="#FFFEFB" stroke="#C24135" stroke-width="1.8"/>
<text x="988" y="301" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">mask after F</text>
<text x="988" y="327" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">usually no FLOP saving</text>
<rect x="846" y="367" width="284" height="68" rx="4" fill="#FFFEFB" stroke="#B7791F" stroke-width="1.8"/>
<text x="988" y="394" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F">true short-circuit</text>
<text x="988" y="420" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">expected compute ≈ sum_l q_l C_l</text>
<text x="988" y="485" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">train/eval scale and RNG must match</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">有效深度是随机路径统计，不是物理网络变浅的同义词；均值、梯度、branch compute 与 normalization state 必须分别验收。</text>
</svg>