<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Xavier / Glorot：Forward 与 Backward 的非方阵折中</title>
<desc id="desc">Forward 每坐标累加 fan-in 项，reverse 每坐标累加 fan-out 项；Xavier 采用两者算术平均的倒数，并不让非方层两边同时守恒。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">同一矩阵，两条求和方向</text>
<rect x="55" y="115" width="80" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="95.0" y="146.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">n_in</text>
<rect x="268" y="115" width="80" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="308.0" y="146.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">n_out</text>
<rect x="160" y="205" width="82" height="60" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="201.0" y="241.0" font-size="21" font-weight="650" text-anchor="middle" fill="#C24135">W</text>
<line x1="138" y1="140" x2="174" y2="201" stroke="#2563EB" stroke-width="2.7" marker-end="url(#a0)"/>
<line x1="228" y1="201" x2="265" y2="140" stroke="#0F766E" stroke-width="2.7" marker-end="url(#a1)"/>
<text x="60" y="305" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB">forward</text>
<text x="60" y="337" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">v = 1 / n_in</text>
<text x="218" y="305" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">backward</text>
<text x="218" y="337" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">v = 1 / n_out</text>
<rect x="55" y="382" width="292" height="72" rx="7" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="201" y="411" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135">Xavier compromise</text>
<text x="201" y="437" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937" class="math">v = 2 / (n_in + n_out)</text>
<text x="201" y="488" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">exact on both sides only when square</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Normal / Uniform：同方差合同</text>
