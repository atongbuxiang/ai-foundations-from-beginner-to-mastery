<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">GLU Family：双投影、乘性汇合与三矩阵预算</title>
<desc id="desc">Value 与 gate 两条 learned projections 在逐元乘法处汇合；反向必须分流再累加；公平比较需要按真实宽度核对参数、计算、存储和融合。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">两条投影在乘法处汇合</text>
<rect x="55" y="230" width="62" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="86.0" y="261.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">X</text>
<rect x="160" y="125" width="116" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="218.0" y="157.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">V = X Wv</text>
<rect x="160" y="335" width="116" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="218.0" y="367.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">G = X Wg</text>
<rect x="160" y="415" width="116" height="48" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="218.0" y="445.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">phi(G)</text>
<line x1="120" y1="245" x2="156" y2="151" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<line x1="120" y1="265" x2="156" y2="361" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<line x1="218" y1="389" x2="218" y2="411" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<rect x="315" y="245" width="52" height="52" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="341.0" y="277.0" font-size="22" font-weight="650" text-anchor="middle" fill="#C24135">*</text>
<line x1="278" y1="151" x2="311" y2="258" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<line x1="278" y1="439" x2="311" y2="284" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<text x="340" y="214" font-size="16" font-weight="700" text-anchor="end" fill="#C24135">H = V * phi(G)</text>
<text x="55" y="490" font-size="15" font-weight="600" text-anchor="start" fill="#64748B">GEGLU / SwiGLU gates may be negative or &gt; 1.</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Reverse：分流、乘法、再累加</text>
<rect x="540" y="100" width="110" height="50" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="595.0" y="131.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">Hbar = U</text>
<rect x="445" y="215" width="135" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="512.5" y="252.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">Vbar = U phi(G)</text>
<rect x="625" y="215" width="130" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="690.0" y="252.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">Gbar = U V phi&#x27;(G)</text>
<line x1="570" y1="153" x2="520" y2="211" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<line x1="620" y1="153" x2="690" y2="211" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<rect x="445" y="355" width="310" height="62" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="392.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">Xbar = Vbar Wv^T + Gbar Wg^T</text>
<line x1="515" y1="280" x2="540" y2="351" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<line x1="690" y1="280" x2="660" y2="351" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<rect x="445" y="448" width="310" height="44" rx="6" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="600" y="476" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">no uniform gradient lower bound</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">预算匹配不止一个比例</text>
<text x="845" y="117" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">standard FFN</text>
<text x="1115" y="117" font-size="17" font-weight="700" text-anchor="end" fill="#2563EB" class="math">2 d h</text>
<line x1="845" y1="133" x2="1130" y2="133" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="845" y="165" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">gated FFN</text>
<text x="1115" y="165" font-size="17" font-weight="700" text-anchor="end" fill="#0F766E" class="math">3 d h_g</text>
<line x1="845" y1="181" x2="1130" y2="181" stroke="#D7DEE8" stroke-width="1.5"/>
<rect x="845" y="204" width="285" height="52" rx="6" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="987" y="236" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">parameter match: h_g about 2h/3</text>
<circle cx="858" cy="285" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="876" y="291" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">tile-rounded width</text>
<circle cx="858" cy="333" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<text x="876" y="339" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">logical / saved bytes</text>
<circle cx="858" cy="381" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="876" y="387" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">TP communication</text>
<circle cx="858" cy="429" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<text x="876" y="435" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">fused wall-clock</text>
<line x1="845" y1="482" x2="1130" y2="482" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="987" y="508" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">measure on the target device</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">GLU 的结构事实是双投影乘法；性能事实必须在参数、FLOP、内存、通信和目标硬件上分别验收。</text>
</svg>