<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Affine backward：一条微分拆出三个伴随作用</title>
<desc id="desc">对 row-batch Z=XW+1b，dZ 的三项分别与 upstream G 做 Frobenius 配对，得到输入回拉、逐样本 outer-product 求和和 broadcast 轴归约。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">先写完整 differential</text>
<rect x="55" y="105" width="290" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="200.0" y="140.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">Z = XW + 1b</text>
<line x1="200" y1="167" x2="200" y2="205" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="45" y="218" width="310" height="72" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="200.0" y="260.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">dZ = dX W + X dW + 1 db</text>
<line x1="200" y1="294" x2="200" y2="332" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="45" y="345" width="310" height="72" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="200.0" y="387.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">dL = &lt;G,dZ&gt;_F</text>
<text x="48" y="458" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">X:[B,din]  W:[din,dout]</text>
<text x="48" y="490" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">G,Z:[B,dout]  b:[dout]</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">形状账本强制三路 VJP</text>
<rect x="445" y="105" width="200" height="68" rx="7" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="545" y="136" font-size="19" font-weight="700" text-anchor="middle" fill="#2563EB" class="math">X̄ = G Wᵀ</text>
<text x="545" y="160" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">[B,din]</text>
<rect x="445" y="220" width="200" height="68" rx="7" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="545" y="251" font-size="19" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">W̄ = Xᵀ G</text>
<text x="545" y="275" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">[din,dout]</text>
<rect x="445" y="335" width="200" height="68" rx="7" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="545" y="366" font-size="19" font-weight="700" text-anchor="middle" fill="#C24135" class="math">b̄ = sum rows of G</text>
<text x="545" y="390" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">[dout]</text>
<line x1="660" y1="139" x2="742" y2="139" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<text x="700" y="122" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">input pullback</text>
<line x1="660" y1="254" x2="742" y2="254" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="700" y="237" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">outer products</text>
<line x1="660" y1="369" x2="742" y2="369" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<text x="700" y="352" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">broadcast sum</text>
<text x="438" y="455" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937">transpose 与 reduction 都由伴随关系决定。</text>
<text x="438" y="489" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">方阵 shape 能通过，仍不代表乘法顺序正确。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">从单样本到分布式求和</text>
<text x="845" y="112" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">per example</text>
<text x="845" y="145" font-size="18" font-weight="700" text-anchor="start" fill="#1F2937" class="math">W̄⁽ⁱ⁾ = xᵢᵀ gᵢ</text>
<rect x="850" y="190" width="74" height="40" rx="5" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="887" y="216" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">batch 1</text>
<line x1="930" y1="210" x2="1000" y2="210" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<rect x="850" y="248" width="74" height="40" rx="5" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="887" y="274" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">batch 2</text>
<line x1="930" y1="268" x2="1000" y2="268" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<rect x="850" y="306" width="74" height="40" rx="5" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="887" y="332" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">batch 3</text>
<line x1="930" y1="326" x2="1000" y2="326" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<rect x="1010" y="205" width="120" height="112" rx="7" fill="#FFF5F2" stroke="#C24135" stroke-width="2.5"/>
<text x="1070" y="242" font-size="19" font-weight="700" text-anchor="middle" fill="#C24135">SUM</text>
<text x="1070" y="273" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">all-reduce</text>
<text x="1070" y="299" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">or local</text>
<text x="845" y="360" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">sum loss: contributions add</text>
<text x="845" y="397" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">global mean: weight by valid counts</text>
<rect x="845" y="438" width="290" height="56" rx="7" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990" y="462" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">low precision + reduction order</text>
<text x="990" y="483" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">数学等价 ≠ bitwise 相同</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">牢记公式不如重建伴随：固定 layout，写 dZ，用 Frobenius 配对隔离每个 differential。</text>
</svg>