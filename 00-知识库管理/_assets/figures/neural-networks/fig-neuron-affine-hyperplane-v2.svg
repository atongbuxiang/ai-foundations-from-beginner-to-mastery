<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">人工神经元：仿射分数、超平面与激活出口</title>
<desc id="desc">输入和权重先形成仿射分数；权重是等值超平面的法向量，偏置移动边界；激活函数再决定输出范围与语义。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">从输入坐标到一个 score</text>
<circle cx="80" cy="112" r="22" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="80" y="118" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">x1</text>
<text x="122" y="118" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">2</text>
<line x1="148" y1="112" x2="245" y2="220" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="80" cy="202" r="22" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="80" y="208" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">x2</text>
<text x="122" y="208" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">−1</text>
<line x1="148" y1="202" x2="245" y2="220" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="80" cy="292" r="22" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="80" y="298" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">x3</text>
<text x="122" y="298" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">3</text>
<line x1="148" y1="292" x2="245" y2="220" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="270" cy="220" r="42" fill="#ECFDF5" stroke="#0F766E" stroke-width="3"/>
<text x="270" y="212" font-size="28" font-weight="700" text-anchor="middle" fill="#0F766E">Σ</text>
<text x="270" y="239" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">+ b</text>
<line x1="313" y1="220" x2="365" y2="220" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<text x="340" y="204" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2937">z</text>
<text x="45" y="375" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">x,w ∈ R^d;  b,z ∈ R</text>
<text x="45" y="414" font-size="21" font-weight="700" text-anchor="start" fill="#2563EB" class="math">z = wᵀx + b</text>
<text x="45" y="461" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">先是 affine score；此时还没有概率语义。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">法向量、平移与距离</text>
<line x1="458" y1="430" x2="758" y2="430" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="475" y1="470" x2="475" y2="95" stroke="#D7DEE8" stroke-width="1.5"/>
<path d="M455 365L755 160" fill="none" stroke="#0F766E" stroke-width="4"/>
<text x="700" y="150" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">wᵀx+b=0</text>
<circle cx="650" cy="355" r="8" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="664" y="376" font-size="17" font-weight="700" text-anchor="start" fill="#C24135">x</text>
<line x1="650" y1="355" x2="573" y2="242" stroke="#C24135" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<text x="635" y="277" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">signed distance</text>
<line x1="573" y1="242" x2="635" y2="200" stroke="#2563EB" stroke-width="4" marker-end="url(#a0)"/>
<text x="641" y="203" font-size="18" font-weight="700" text-anchor="start" fill="#2563EB">w</text>
<text x="430" y="470" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">d±(x,H)= (wᵀx+b)/||w||₂</text>
<text x="430" y="507" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">b 移动等值面；w 决定方向与 score 尺度。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">同一 z，四种不同出口</text>
<line x1="855" y1="405" x2="1135" y2="405" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="980" y1="455" x2="980" y2="95" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="850" y1="405" x2="1135" y2="125" stroke="#2563EB" stroke-width="2.8"/>
<text x="1095" y="135" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">identity</text>
<path d="M850 405L980 405L980 145L1135 145" fill="none" stroke="#C24135" stroke-width="2.8"/>
<text x="1085" y="168" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">step</text>
<path d="M850 390C910 388 935 355 980 275C1025 195 1060 165 1135 163" fill="none" stroke="#0F766E" stroke-width="3"/>
<text x="1055" y="207" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">sigmoid</text>
<path d="M850 405L980 405L1135 250" fill="none" stroke="#1F2937" stroke-width="2.5"/>
<text x="1088" y="270" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937">ReLU</text>
<text x="842" y="468" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">activation 决定值域；loss 与校准决定统计语义。</text>
<text x="842" y="502" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">score ≠ probability ≠ hard decision</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">一个神经元先测量输入沿 w 的位置，再由 activation 与任务合同解释这个测量。</text>
</svg>