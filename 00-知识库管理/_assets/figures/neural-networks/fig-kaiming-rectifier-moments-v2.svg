<text x="130" y="352" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">negative half</text>
<text x="280" y="352" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">positive half</text>
<rect x="55" y="392" width="292" height="66" rx="7" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="201" y="419" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135" class="math">factor = (1 + a^2) / 2</text>
<text x="201" y="444" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">slope is squared in a second moment</text>
<text x="201" y="493" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB" class="math">ReLU: a = 0  -&gt;  factor = 1/2</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Gain 补偿 Rectifier Factor</text>
<rect x="455" y="108" width="292" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="601.0" y="143.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">gain^2 = 2 / (1 + a^2)</text>
<line x1="600" y1="170" x2="600" y2="205" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<rect x="455" y="218" width="292" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="601.0" y="255.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">Var(W) = gain^2 / fan</text>
<line x1="600" y1="284" x2="600" y2="319" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<rect x="455" y="325" width="295" height="48" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="602" y="355" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB" class="math">normal: std = gain / sqrt(fan)</text>
<rect x="455" y="389" width="295" height="48" rx="6" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="602" y="419" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E" class="math">uniform: bound = gain sqrt(3/fan)</text>
<rect x="455" y="453" width="295" height="41" rx="6" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="602" y="479" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">second moment != centered variance</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Fan、Mode 与训练后 Drift</text>
<rect x="845" y="105" width="285" height="70" rx="7" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="862" y="132" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">dense</text>
<text x="862" y="157" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">fan-in = input width</text>
<rect x="845" y="195" width="285" height="70" rx="7" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="862" y="222" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">convolution</text>
<text x="862" y="247" font-size="15" font-weight="500" text-anchor="start" fill="#64748B">channels x kernel area</text>
<line x1="845" y1="294" x2="1130" y2="294" stroke="#D7DEE8" stroke-width="2"/>
<text x="845" y="329" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">fan-in mode</text>
<text x="1115" y="329" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">forward target</text>
<text x="845" y="370" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">fan-out mode</text>
<text x="1115" y="370" font-size="15" font-weight="600" text-anchor="end" fill="#64748B">backward target</text>
<rect x="845" y="410" width="285" height="82" rx="7" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="987" y="438" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">PReLU drift</text>
<text x="987" y="463" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">gain_t / gain_0 depends on a_t</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Kaiming 的二倍来自 half-axis squared energy；fan mode、tensor layout、bias 和 learned slope 决定公式是否仍适用。</text>
</svg>