<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">He / Kaiming：半轴二阶矩、Rectifier Gain 与 Fan Mode</title>
<desc id="desc">对 symmetric input，positive 与 negative half-axis 各承载一半 squared energy；negative slope a 经过平方后贡献 a^2，给出 Kaiming gain。</desc>
