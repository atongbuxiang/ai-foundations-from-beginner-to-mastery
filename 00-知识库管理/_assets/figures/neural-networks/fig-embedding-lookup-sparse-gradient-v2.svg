<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Embedding Lookup：选择矩阵、重复索引与稀疏更新</title>
<desc id="desc">查表等于 one-hot 选择矩阵乘法；反向把每个位置的上游梯度散射并按重复 token 求和；稀疏梯度表示不等于整条优化链都稀疏。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">lookup = row selection</text>
<rect x="52" y="92" width="128" height="292" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="116" y="120" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">E [4 x 2]</text>
<text x="68" y="150" font-size="15" font-weight="700" text-anchor="start" fill="#64748B">e0</text>
<text x="164" y="150" font-size="15" font-weight="650" text-anchor="end" fill="#1F2937">[ 1, 0 ]</text>
<text x="68" y="204" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">e1</text>
<text x="164" y="204" font-size="15" font-weight="650" text-anchor="end" fill="#1F2937">[ 0, 1 ]</text>
<text x="68" y="258" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">e2</text>
<text x="164" y="258" font-size="15" font-weight="650" text-anchor="end" fill="#1F2937">[ 2,-1 ]</text>
<text x="68" y="312" font-size="15" font-weight="700" text-anchor="start" fill="#64748B">e3</text>
<text x="164" y="312" font-size="15" font-weight="650" text-anchor="end" fill="#1F2937">[-1, 3 ]</text>
<text x="265" y="120" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">ids</text>
<text x="265" y="160" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135">2</text>
<text x="265" y="216" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135">1</text>
<text x="265" y="272" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135">2</text>
<line x1="287" y1="156" x2="297" y2="156" stroke="#0F766E" stroke-width="2.2" marker-end="url(#a1)"/>
<line x1="287" y1="212" x2="297" y2="212" stroke="#0F766E" stroke-width="2.2" marker-end="url(#a1)"/>
<line x1="287" y1="268" x2="297" y2="268" stroke="#0F766E" stroke-width="2.2" marker-end="url(#a1)"/>
<text x="305" y="160" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">[ 2,-1 ]</text>
<text x="305" y="216" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">[ 0, 1 ]</text>
<text x="305" y="272" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">[ 2,-1 ]</text>
<rect x="52" y="420" width="310" height="62" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="207" y="447" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">X = S E = E[ids]</text>
<text x="207" y="471" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">gather avoids one-hot storage</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">backward = scatter-add</text>
<text x="445" y="104" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937">upstream rows</text>
<rect x="445" y="136" width="136" height="44" rx="4" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.8"/>
<text x="457" y="164" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">g0 [ 1, 2 ]</text>
<rect x="445" y="202" width="136" height="44" rx="4" fill="#FFFEFB" stroke="#B7791F" stroke-width="1.8"/>
<text x="457" y="230" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">g1 [-1,.5]</text>
<rect x="445" y="268" width="136" height="44" rx="4" fill="#FFFEFB" stroke="#2563EB" stroke-width="1.8"/>
<text x="457" y="296" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">g2 [ 3,-1]</text>
<line x1="587" y1="158" x2="700" y2="158" stroke="#2563EB" stroke-width="2.2" marker-end="url(#a0)"/>
<line x1="587" y1="224" x2="700" y2="224" stroke="#B7791F" stroke-width="2.2" marker-end="url(#a3)"/>
<line x1="587" y1="290" x2="700" y2="290" stroke="#2563EB" stroke-width="2.2" marker-end="url(#a0)"/>
<text x="748" y="162" font-size="15" font-weight="700" text-anchor="end" fill="#2563EB">row 2</text>
<text x="748" y="228" font-size="15" font-weight="700" text-anchor="end" fill="#B7791F">row 1</text>
<text x="748" y="294" font-size="15" font-weight="700" text-anchor="end" fill="#2563EB">row 2</text>
<rect x="445" y="356" width="315" height="106" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="602" y="386" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">dE[2] = g0 + g2 = [4,1]</text>
<text x="602" y="417" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">dE[1] = g1 = [-1,.5]</text>
<text x="602" y="446" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">untouched rows are zero in lookup VJP</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">V x d cost ledger</text>
<rect x="845" y="96" width="285" height="78" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="987" y="125" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">parameters = V d</text>
<text x="987" y="154" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">lookup compute touches selected rows</text>
<rect x="845" y="216" width="285" height="96" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="987" y="246" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">sparse gradient</text>
<text x="987" y="276" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2937">stores touched row updates</text>
<text x="987" y="298" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">optimizer support is restricted</text>
<rect x="845" y="354" width="285" height="96" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="987" y="384" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">dense output use</text>
<text x="987" y="414" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2937">usually gradients all V rows</text>
<text x="987" y="438" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">tying can destroy input-only sparsity</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">查表省去 one-hot 物化；重复 token 必须 scatter-add；稀疏收益要沿 optimizer、decay、通信整链验证。</text>
</svg>