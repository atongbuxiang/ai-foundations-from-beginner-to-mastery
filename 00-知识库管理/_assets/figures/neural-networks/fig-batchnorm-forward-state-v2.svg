<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">BatchNorm Forward：当前批统计、持久状态与推理折叠</title>
<desc id="desc">卷积 BatchNorm 对每个 channel 在 N、H、W 上归约；训练输出用当前批统计并更新 buffers；推理使用固定 buffers 时可折叠为普通 affine map。</desc>
