<line x1="660" y1="154" x2="660" y2="181" stroke="#0F766E" stroke-width="2.2" marker-end="url(#a1)"/>
<rect x="445" y="276" width="135" height="70" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="512" y="303" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">running state</text>
<text x="512" y="328" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">EMA update</text>
<line x1="608" y1="154" x2="548" y2="272" stroke="#C24135" stroke-width="2" marker-end="url(#a2)"/>
<text x="610" y="259" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">TRAIN: output uses current batch</text>
<rect x="445" y="390" width="135" height="54" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="512.5" y="423.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">fixed buffers</text>
<rect x="620" y="390" width="135" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="687.5" y="423.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">eval output</text>
<line x1="584" y1="417" x2="616" y2="417" stroke="#0F766E" stroke-width="2.2" marker-end="url(#a1)"/>
<text x="600" y="478" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">EVAL: no companion dependence</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">固定统计量才能折叠</text>
<rect x="845" y="105" width="285" height="68" rx="5" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987" y="133" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB" class="math">z = W x + b</text>
<text x="987" y="157" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B" class="math">a = gamma / sqrt(v + eps)</text>
<line x1="987" y1="178" x2="987" y2="202" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="845" y="208" width="285" height="83" rx="5" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
<text x="987" y="237" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E" class="math">W&#x27; = a W</text>
<text x="987" y="264" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E" class="math">b&#x27; = a (b - mean) + beta</text>
<text x="850" y="325" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">forward var</text>
<text x="1120" y="325" font-size="15" font-weight="500" text-anchor="end" fill="#64748B">biased</text>
