<text x="850" y="368" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">running var</text>
<text x="1120" y="368" font-size="15" font-weight="500" text-anchor="end" fill="#64748B">unbiased obs</text>
<line x1="845" y1="377" x2="1130" y2="377" stroke="#D7DEE8" stroke-width="1"/>
<text x="850" y="411" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">momentum</text>
<text x="1120" y="411" font-size="15" font-weight="500" text-anchor="end" fill="#64748B">new-value weight</text>
<line x1="845" y1="420" x2="1130" y2="420" stroke="#D7DEE8" stroke-width="1"/>
<text x="850" y="454" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">mode</text>
<text x="1120" y="454" font-size="15" font-weight="500" text-anchor="end" fill="#64748B">train or eval</text>
<line x1="845" y1="463" x2="1130" y2="463" stroke="#D7DEE8" stroke-width="1"/>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">训练 BN 是带 batch 与 state 的算子；固定 eval statistics 后才是可折叠的 affine map。</text>
