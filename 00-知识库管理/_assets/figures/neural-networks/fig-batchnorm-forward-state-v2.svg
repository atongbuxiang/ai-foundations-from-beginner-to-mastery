<text x="200" y="302" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">reduce (N,H,W)</text>
<text x="200" y="332" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">m = N H W</text>
<text x="200" y="374" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">gamma, beta shape [C]</text>
<rect x="55" y="410" width="292" height="68" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="201" y="436" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">nominal count is not IID count</text>
<text x="201" y="460" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">spatial samples may correlate</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
