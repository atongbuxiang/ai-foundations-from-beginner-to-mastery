<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Residual Jacobian：rail、干涉与有序路径</title>
<desc id="desc">残差块的 JVP 和 VJP 都是恒等项加分支项；两项可以相长或相消；深层 Jacobian 是 I 加局部算子的有序乘积。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">同一 accumulator 的两条贡献</text>
<rect x="52" y="105" width="82" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="93.0" y="135.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">v</text>
<line x1="138" y1="129" x2="345" y2="129" stroke="#2563EB" stroke-width="4" marker-end="url(#a0)"/>
<text x="240" y="111" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">identity: v</text>
<rect x="165" y="210" width="92" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="211.0" y="241.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">J_F</text>
<path d="M95 157V235H160" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<path d="M262 235H345V134" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<text x="257" y="286" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">branch: J_F v</text>
<circle cx="345" cy="129" r="8" fill="#FFFEFB" stroke="#1F2937" stroke-width="2"/>
<text x="200" y="342" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2937">JVP = v + J_F v</text>
<rect x="52" y="395" width="296" height="78" rx="5" fill="#FFF5F2" stroke="#C24135" stroke-width="2"/>
<text x="200" y="424" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135">VJP = g + J_F^T g</text>
<text x="200" y="453" font-size="15" font-weight="600" text-anchor="middle" fill="#64748B">rail exists; sum may cancel</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">I + J_F 仍可塌缩或放大</text>
<rect x="445" y="105" width="310" height="78" rx="6" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="465" y="136" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">J_F = -I</text>
<text x="735" y="163" font-size="15" font-weight="650" text-anchor="end" fill="#64748B">gain = 0</text>
<rect x="445" y="217" width="310" height="78" rx="6" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="465" y="248" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">J_F = +0.5 I</text>
<text x="735" y="275" font-size="15" font-weight="650" text-anchor="end" fill="#64748B">gain = 1.5</text>
<rect x="445" y="329" width="310" height="78" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="465" y="360" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">non-normal</text>
<text x="735" y="387" font-size="15" font-weight="650" text-anchor="end" fill="#64748B">sigma: 3.00 / .003</text>
<text x="600" y="455" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">eigenvalues do not replace singular values</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">product 展开为不同长度的路径</text>
<text x="845" y="112" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937">(I+A3)(I+A2)(I+A1)</text>
<rect x="845" y="160" width="285" height="56" rx="5" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.8"/>
<text x="862" y="184" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">length 0</text>
<text x="1115" y="204" font-size="15" font-weight="600" text-anchor="end" fill="#1F2937">I</text>
<rect x="845" y="238" width="285" height="56" rx="5" fill="#F8FAFC" stroke="#0F766E" stroke-width="1.8"/>
<text x="862" y="262" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">length 1</text>
<text x="1115" y="282" font-size="15" font-weight="600" text-anchor="end" fill="#1F2937">A1 + A2 + A3</text>
<rect x="845" y="316" width="285" height="56" rx="5" fill="#F8FAFC" stroke="#B7791F" stroke-width="1.8"/>
<text x="862" y="340" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F">length 2</text>
<text x="1115" y="360" font-size="15" font-weight="600" text-anchor="end" fill="#1F2937">A2A1 + A3A1 + A3A2</text>
<rect x="845" y="394" width="285" height="56" rx="5" fill="#F8FAFC" stroke="#C24135" stroke-width="1.8"/>
<text x="862" y="418" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">length 3</text>
<text x="1115" y="438" font-size="15" font-weight="600" text-anchor="end" fill="#1F2937">A3A2A1</text>
<text x="987" y="490" font-size="15" font-weight="650" text-anchor="middle" fill="#64748B">ordered terms; not independent subnetworks</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">I 是加法项，不是稳定证书；总增益取决于方向、奇异值与跨层有序乘积。</text>
</svg>