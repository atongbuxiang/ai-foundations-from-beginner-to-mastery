<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">特征方向、特征坐标分解与三类失败边界</title>
  <desc id="desc">左侧展示线性算子沿两个特征方向独立缩放，中间展示先换到特征坐标、用对角矩阵作用、再换回原坐标，右侧总结不分裂、缺陷与病态特征基。</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .sans{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.math{font-family:"STIX Two Math","Times New Roman",serif}.ink{fill:#1f2937}.muted{fill:#64748b}.blue{fill:#2563eb}.green{fill:#0f766e}.amber{fill:#b7791f}.h{font-size:19px;font-weight:600}.body{font-size:16px}.small{font-size:15px}.formula{font-size:20px}.result{font-size:19px;font-weight:600}.axis{stroke:#cbd5e1;stroke-width:1.5}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <rect x="42" y="43" width="440" height="402" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="68" y="81" class="sans h blue">几何：方向不变，只缩放</text><path d="M87 375H446M126 413V113" class="axis"/>
  <path d="M126 375L349 175" stroke="#2563eb" stroke-width="3"/><path d="M126 375L398 301" stroke="#0f766e" stroke-width="3"/>
  <path d="M126 375L238 275" stroke="#2563eb" stroke-width="5" marker-end="url(#blue-arrow)"/><path d="M126 375L330 320" stroke="#0f766e" stroke-width="5" marker-end="url(#green-arrow)"/>
  <text x="247" y="269" class="math body blue">v₁</text><text x="337" y="318" class="math body green">v₂</text><text x="258" y="139" class="math body blue">Av₁=λ₁v₁</text><text x="288" y="355" class="math body green">Av₂=λ₂v₂</text><text x="262" y="417" class="sans small muted" text-anchor="middle">一般向量分解后，各特征分量独立演化。</text>

  <rect x="520" y="43" width="638" height="221" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="546" y="81" class="sans h blue">代数：换到特征坐标后只剩对角缩放</text>
  <rect x="550" y="121" width="114" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="607" y="150" class="math body ink" text-anchor="middle">x</text><text x="607" y="174" class="sans small muted" text-anchor="middle">原坐标</text>
  <path d="M664 154H748" class="arrow"/><text x="706" y="137" class="math body blue" text-anchor="middle">V⁻¹</text>
  <rect x="748" y="121" width="114" height="66" rx="9" fill="#ffffff" stroke="#93c5fd"/><text x="805" y="150" class="math body blue" text-anchor="middle">c=V⁻¹x</text><text x="805" y="174" class="sans small muted" text-anchor="middle">特征坐标</text>
  <path d="M862 154H946" class="arrow"/><text x="904" y="137" class="math body green" text-anchor="middle">Λ</text>
  <rect x="946" y="121" width="174" height="66" rx="9" fill="#ffffff" stroke="#6ee7b7"/><text x="1033" y="150" class="math body green" text-anchor="middle">Λc</text><text x="1033" y="174" class="sans small muted" text-anchor="middle">逐坐标缩放</text>
  <text x="839" y="229" class="math formula ink" text-anchor="middle">A=VΛV⁻¹　⇒　Aᵏ=VΛᵏV⁻¹</text>

  <rect x="520" y="296" width="638" height="149" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="546" y="332" class="sans h amber">三类失败边界</text>
  <text x="546" y="371" class="sans body amber">不分裂</text><text x="638" y="371" class="sans small ink">当前标量域中缺少全部根，例如二维实旋转</text>
  <text x="546" y="403" class="sans body amber">缺陷</text><text x="638" y="403" class="sans small ink">独立特征向量不足，需要 Jordan 或 Schur 结构</text>
  <text x="546" y="435" class="sans body amber">病态</text><text x="638" y="435" class="sans small ink">V 虽可逆却接近奇异，V⁻¹ 会放大小扰动</text>
  <rect x="92" y="485" width="1016" height="83" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="600" y="516" class="math formula ink" text-anchor="middle">Av=λv　→　AV=VΛ　→　A=VΛV⁻¹</text><text x="600" y="547" class="sans small muted" text-anchor="middle">第一步只找到方向；最后一步还要求这些方向组成一组基。特征值存在不等于可对角化。</text>
  <text x="600" y="610" class="sans result ink" text-anchor="middle">特征分解把耦合动力学改写为独立标量模式；可用性同时取决于存在性、完备性与特征基条件性。</text>
</svg>
