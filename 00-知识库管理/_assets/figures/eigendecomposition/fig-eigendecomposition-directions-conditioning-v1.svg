<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">特征分解的方向、坐标和条件性</title><desc id="d">三个面板展示不变方向、特征坐标流水线以及不可对角化和病态特征基。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker><style>.T{font:700 22px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.P{font:700 17px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.B{font:14px -apple-system,"PingFang SC",sans-serif;fill:#334155}.S{font:12px -apple-system,"PingFang SC",sans-serif;fill:#475569}.M{font:italic 15px Georgia,serif;fill:#0f172a}</style></defs><rect width="1200" height="430" rx="18" fill="#f8fafc"/><text x="42" y="38" class="T">特征分解：寻找算子保持不变的方向</text>
<g transform="translate(30 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">A  特征向量：方向不变</text><line x1="45" y1="270" x2="315" y2="95" stroke="#94a3b8"/><line x1="75" y1="250" x2="190" y2="175" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><line x1="75" y1="250" x2="280" y2="117" stroke="#22c55e" stroke-width="4" marker-end="url(#a)"/><text x="150" y="190" class="M">v</text><text x="274" y="105" class="M">Av=λv</text><path d="M68 249 C90 215 114 199 145 188" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/><text x="20" y="305" class="B">同一直线上的缩放 / 翻转</text><text x="20" y="326" class="S">一般向量仍会混合多个特征方向</text></g>
<g transform="translate(420 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">B  A = VΛV⁻¹：先换坐标再缩放</text><g transform="translate(18 75)"><rect width="70" height="52" rx="9" fill="#dbeafe" stroke="#60a5fa"/><text x="29" y="32" class="M">x</text><rect x="88" width="76" height="52" rx="9" fill="#ede9fe" stroke="#8b5cf6"/><text x="106" y="24" class="M">V⁻¹</text><text x="100" y="42" class="S">特征坐标</text><rect x="176" width="70" height="52" rx="9" fill="#fef3c7" stroke="#f59e0b"/><text x="202" y="32" class="M">Λ</text><rect x="258" width="70" height="52" rx="9" fill="#dcfce7" stroke="#22c55e"/><text x="287" y="32" class="M">V</text><path d="M70 26H85M164 26H173M246 26H255" stroke="#334155" marker-end="url(#a)"/></g><text x="24" y="169" class="M">Aᵏ = VΛᵏV⁻¹</text><text x="24" y="198" class="M">‖Aᵏ‖₂ ≤ κ₂(V) ρ(A)ᵏ</text><rect x="24" y="226" width="312" height="68" rx="10" fill="#f1f5f9"/><text x="38" y="250" class="B">代数：Λ 把问题变成标量</text><text x="38" y="273" class="B">数值：V⁻¹ 可能放大误差</text><text x="24" y="320" class="S">只有 V 酉/正交时，V⁻¹=V* 且 κ₂(V)=1</text></g>
<g transform="translate(810 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">C  两种失败不能混为一谈</text><rect x="20" y="65" width="318" height="85" rx="10" fill="#fee2e2" stroke="#f87171"/><text x="34" y="91" class="B">缺陷矩阵：没有足够特征向量</text><text x="34" y="117" class="M">J = [1 1; 0 1],  Jᵏ = [1 k; 0 1]</text><text x="34" y="138" class="S">需要 Jordan / Schur，而不是强行对角化</text><rect x="20" y="174" width="318" height="86" rx="10" fill="#fff7ed" stroke="#f59e0b"/><text x="34" y="200" class="B">病态特征基：有分解但方向近乎平行</text><line x1="58" y1="242" x2="292" y2="206" stroke="#2563eb" stroke-width="3"/><line x1="58" y1="242" x2="292" y2="220" stroke="#ef4444" stroke-width="3"/><text x="34" y="282" class="S">小扰动经 V⁻¹ 放大；应检查残差 + 条件性</text><text x="20" y="319" class="B">结论：存在性 ≠ 稳定可计算性</text></g></svg>
