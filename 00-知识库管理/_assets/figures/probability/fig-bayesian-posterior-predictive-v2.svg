<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Bayesian 联合模型、条件更新与后验预测</title>
<desc id="desc">联合模型先生成参数与数据；观测后通过 evidence 归一化得到 posterior；未来预测对 posterior 参数不确定性积分，并需与模型检查和外部验证区分。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">先写联合模型，再条件化</text>
<rect x="60" y="105" width="125" height="54" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="122.5" y="138.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">Theta ~ prior</text>
<rect x="245" y="105" width="105" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="297.5" y="138.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">Y | Theta</text>
<line x1="188" y1="132" x2="240" y2="132" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<text x="215" y="112" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">likelihood</text>
<rect x="148" y="235" width="160" height="60" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="228.0" y="271.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">observe Y=y</text>
<line x1="297" y1="162" x2="245" y2="230" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<rect x="70" y="365" width="280" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="210.0" y="402.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">posterior p(Theta|y)</text>
<line x1="228" y1="298" x2="210" y2="358" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="45" y="326" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">p(theta,y)=p(theta)p(y|theta)</text>
<text x="45" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">evidence p(y) 必须有限；支持必须匹配。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">预测要积分参数不确定性</text>
<rect x="440" y="105" width="125" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="502.5" y="137.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">Theta^(s)|y</text>
<rect x="650" y="105" width="110" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="705.0" y="137.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">Y_new^(s)</text>
<line x1="568" y1="131" x2="645" y2="131" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<circle cx="480" cy="235" r="7" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<circle cx="535" cy="255" r="7" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<circle cx="590" cy="220" r="7" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<circle cx="645" cy="275" r="7" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<circle cx="700" cy="240" r="7" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<line x1="455" y1="310" x2="750" y2="310" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="345" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">posterior predictive samples</text>
<text x="430" y="385" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">p(y_new|y) = integral p(y_new|theta)</text>
<text x="430" y="415" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">                  p(theta|y) dtheta</text>
<text x="430" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">total variance = aleatoric + parameter uncertainty</text>
<text x="430" y="490" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">plug-in p(y_new|theta_hat) 会丢掉后一项。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">检查与验证回答不同问题</text>
<rect x="835" y="105" width="150" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="910.0" y="136.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">prior predictive</text>
<line x1="988" y1="130" x2="1020" y2="130" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<text x="1030" y="136" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">数据前：生成范围？</text>
<rect x="835" y="217" width="150" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="910.0" y="248.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">posterior predictive</text>
<line x1="988" y1="242" x2="1020" y2="242" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<text x="1030" y="248" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">给定数据：能复现？</text>
<rect x="835" y="329" width="150" height="50" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="910.0" y="360.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">held-out evaluation</text>
<line x1="988" y1="354" x2="1020" y2="354" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<text x="1030" y="360" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">新数据：能外推？</text>
<text x="830" y="450" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">Posterior 概率始终条件于模型与已观测数据。</text>
<text x="830" y="485" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">PPC 不是 held-out generalization 证书。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Bayesian 推断从联合模型出发；更新、预测、检查与决策必须保持对象分层。</text>
</svg>