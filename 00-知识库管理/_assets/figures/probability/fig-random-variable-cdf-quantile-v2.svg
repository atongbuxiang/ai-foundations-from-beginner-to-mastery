<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">随机变量、分布与分位数</title>
<desc id="desc">随机变量把样本结果映到数值；分布是概率的推前；CDF 统一离散、连续与混合情形，广义分位数反转累计概率。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">X: Omega -&gt; R</text>
<rect x="50" y="120" width="62" height="45" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="81.0" y="148.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">HH</text>
<rect x="135" y="120" width="62" height="45" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="166.0" y="148.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">HT</text>
<rect x="50" y="210" width="62" height="45" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="81.0" y="238.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">TH</text>
<rect x="135" y="210" width="62" height="45" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="166.0" y="238.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">TT</text>
<rect x="290" y="125" width="55" height="45" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="317.5" y="153.5" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">2</text>
<rect x="290" y="215" width="55" height="45" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="317.5" y="243.5" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">1</text>
<rect x="290" y="305" width="55" height="45" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="317.5" y="333.5" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">0</text>
<line x1="115" y1="142" x2="285" y2="147" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="200" y1="142" x2="285" y2="237" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="115" y1="232" x2="285" y2="237" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<line x1="200" y1="232" x2="285" y2="327" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<text x="45" y="405" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937">X = 正面个数；P_X = P o X^-1</text>
<text x="45" y="442" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">多个 outcomes 可以被同一数值分组。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">PMF、PDF 与 CDF</text>
<text x="440" y="140" font-size="19" font-weight="700" text-anchor="start" fill="#2563EB">PMF</text>
<line x1="515" y1="133" x2="755" y2="133" stroke="#D7DEE8" stroke-width="2"/>
<text x="530" y="140" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">point mass; sum=1</text>
<text x="440" y="245" font-size="19" font-weight="700" text-anchor="start" fill="#0F766E">PDF</text>
<line x1="515" y1="238" x2="755" y2="238" stroke="#D7DEE8" stroke-width="2"/>
<text x="530" y="245" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">interval probability = area</text>
<text x="440" y="350" font-size="19" font-weight="700" text-anchor="start" fill="#B7791F">CDF</text>
<line x1="515" y1="343" x2="755" y2="343" stroke="#D7DEE8" stroke-width="2"/>
<text x="530" y="350" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">F(x)=P(X&lt;=x); always exists</text>
<text x="430" y="450" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">混合分布可同时具有 CDF 跳跃与连续部分。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">广义分位数与逆变换</text>
<line x1="850" y1="390" x2="1140" y2="390" stroke="#D7DEE8" stroke-width="2"/>
<line x1="870" y1="420" x2="870" y2="105" stroke="#D7DEE8" stroke-width="2"/>
<path d="M870 370L930 350V300H990L1045 225V160H1125" fill="none" stroke="#2563EB" stroke-width="3"/>
<line x1="915" y1="320" x2="1040" y2="320" stroke="#B7791F" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="1040" y1="390" x2="1040" y2="320" stroke="#B7791F" stroke-width="2" stroke-dasharray="6 5"/>
<text x="910" y="310" font-size="17" font-weight="700" text-anchor="start" fill="#B7791F">u</text>
<text x="1040" y="415" font-size="17" font-weight="700" text-anchor="middle" fill="#B7791F">Q(u)</text>
<text x="830" y="470" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">Q(u)=inf{x:F(x)&gt;=u}; U~Unif =&gt; Q(U)~F</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先区分随机变量、分布、密度和累计函数；分位数是 CDF 的广义逆，不要求严格单调。</text>
</svg>