<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">浓缩不等式的假设层级、Chernoff 优化与有限类一致界</title>
  <desc id="desc">三面板分别比较 Chebyshev 多项式尾、Hoeffding 次高斯尾与 Bernstein 方差敏感尾；展示 Chernoff 方法对 lambda 优化；展示固定模型尾界通过 union bound 扩展到有限模型类。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0FDFA"/><stop offset="0.48" stop-color="#F8FAFC"/><stop offset="1" stop-color="#FFF7ED"/></linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0F766E"/></marker>
    <style>.title{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F172A}.head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F766E}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#64748B}.label{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.math{font:15px Georgia,"Times New Roman",serif;fill:#0F172A}.card{fill:#fff;stroke:#CBD5E1;stroke-width:1.3}.axis{stroke:#64748B;stroke-width:1.2}.arrow{stroke:#0F766E;stroke-width:2.2;fill:none;marker-end:url(#arr)}.dash{stroke-dasharray:6 5;fill:none}</style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <text x="40" y="38" class="title">有限样本的尾概率：假设控制 MGF，优化产生指数，复杂度支付同时保证</text>
  <rect x="28" y="58" width="368" height="342" rx="17" class="card"/><rect x="416" y="58" width="368" height="342" rx="17" class="card"/><rect x="804" y="58" width="368" height="342" rx="17" class="card"/>

  <text x="50" y="88" class="head">A　假设越强，可用尾界越锐利</text>
  <line x1="69" y1="272" x2="365" y2="272" class="axis"/><line x1="73" y1="278" x2="73" y2="117" class="axis"/>
  <text x="61" y="293" class="small">0</text><text x="339" y="293" class="small">偏差 t</text>
  <path d="M76 126C110 166 142 204 184 231C225 252 283 263 360 268" stroke="#94A3B8" stroke-width="2.6" fill="none"/>
  <path d="M76 126C117 150 149 182 185 222C221 254 276 268 360 271" stroke="#2563EB" stroke-width="2.8" fill="none"/>
  <path d="M76 126C110 151 140 183 171 217C204 250 251 267 360 271" stroke="#EA580C" stroke-width="2.8" fill="none" class="dash"/>
  <text x="214" y="142" class="label" fill="#64748B">Chebyshev：约 1/t²</text>
  <text x="214" y="168" class="label" fill="#2563EB">Hoeffding：exp(−c t²)</text>
  <text x="214" y="194" class="label" fill="#EA580C">Bernstein：方差 + 幅度</text>
  <text x="54" y="329" class="math">finite variance → polynomial tail</text>
  <text x="54" y="356" class="math">bounded / sub-Gaussian → exponential tail</text>
  <text x="54" y="382" class="small">曲线只表示尺度；上界不等于真实尾概率</text>

  <text x="438" y="88" class="head">B　Chernoff：对指数倾斜参数优化</text>
  <rect x="454" y="119" width="292" height="55" rx="11" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="477" y="143" class="math">P(S ≥ t) ≤ exp[−lambda t + psi(lambda)]</text>
  <text x="477" y="163" class="small">指数 Markov + log-MGF</text>
  <path d="M600 177L600 207" class="arrow"/>
  <line x1="470" y1="321" x2="749" y2="321" class="axis"/><line x1="477" y1="329" x2="477" y2="207" class="axis"/>
  <path d="M483 229C521 253 551 283 588 299C624 314 658 298 690 267C714 244 729 224 744 213" stroke="#0F766E" stroke-width="3" fill="none"/>
  <line x1="625" y1="309" x2="625" y2="321" stroke="#EA580C" stroke-width="2.4"/>
  <circle cx="625" cy="307" r="5" fill="#EA580C"/>
  <text x="609" y="343" class="math">lambda*</text>
  <text x="474" y="374" class="small">独立性把和的 MGF 化为乘积；最优 lambda 给最强指数</text>

  <text x="826" y="88" class="head">C　固定对象 → 有限类同时成立</text>
  <rect x="842" y="116" width="294" height="55" rx="11" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="858" y="141" class="math">P(|Rhat(h)−R(h)| &gt; eps) ≤ 2e^(−2n eps²)</text>
  <text x="858" y="160" class="small">对预先固定的一个 h</text>
  <path d="M989 176L989 202" class="arrow"/>
  <g fill="#E0F2FE" stroke="#0284C7"><circle cx="869" cy="237" r="20"/><circle cx="929" cy="237" r="20"/><circle cx="989" cy="237" r="20"/><circle cx="1049" cy="237" r="20"/><circle cx="1109" cy="237" r="20"/></g>
  <g class="math" text-anchor="middle"><text x="869" y="242">h1</text><text x="929" y="242">h2</text><text x="989" y="242">...</text><text x="1049" y="242">hM</text><text x="1109" y="242">select</text></g>
  <path d="M859 269C903 294 1081 294 1119 269" stroke="#7C3AED" stroke-width="2.3" fill="none"/>
  <text x="842" y="325" class="math">union bound pays log M in the radius</text>
  <text x="842" y="354" class="math">eps = sqrt(log(2M/delta) / (2n))</text>
  <text x="842" y="382" class="small">同一数据选模型时，不能继续冒充“预先固定”</text>
</svg>
