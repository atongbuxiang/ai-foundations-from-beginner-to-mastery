<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">期望、方差与矩</title>
<desc id="desc">期望是对分布的线性积分；方差是中心化平方矩；矩的存在与交叉协方差决定尺度传播是否有效。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">期望是加权汇总</text>
<line x1="65" y1="355" x2="345" y2="355" stroke="#D7DEE8" stroke-width="2"/>
<line x1="90" y1="355" x2="90" y2="316.0" stroke="#2563EB" stroke-width="10"/>
<text x="90" y="385" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937">0</text>
<text x="90" y="306.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">p=0.15</text>
<line x1="190" y1="355" x2="190" y2="277.0" stroke="#2563EB" stroke-width="10"/>
<text x="190" y="385" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937">1</text>
<text x="190" y="267.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">p=0.3</text>
<line x1="290" y1="355" x2="290" y2="212.0" stroke="#2563EB" stroke-width="10"/>
<text x="290" y="385" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937">2</text>
<text x="290" y="202.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">p=0.55</text>
<text x="200" y="445" font-size="19" font-weight="700" text-anchor="middle" fill="#1F2937">E[X]=sum x p(x)=1.4</text>
<text x="45" y="480" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">均值不必位于支持集，也不等于众数。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">方差围绕均值测量平方波动</text>
<line x1="450" y1="275" x2="750" y2="275" stroke="#D7DEE8" stroke-width="2"/>
<line x1="600" y1="180" x2="600" y2="350" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 5"/>
<text x="600" y="165" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">mu</text>
<circle cx="485" cy="275" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="535" cy="275" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="650" cy="275" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="720" cy="275" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="600" y="390" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2937" class="math">Var(X)=E[(X-mu)^2]</text>
<text x="600" y="430" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937" class="math">=E[X^2]-E[X]^2 &gt;= 0</text>
<text x="430" y="470" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">单位平方；重尾时可能不存在。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">线性与尺度传播</text>
<text x="835" y="135" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937">indicator I_A: E[I_A]=P(A)</text>
<text x="835" y="195" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937">E[sum I_i]=sum P(A_i)</text>
<text x="835" y="255" font-size="16" font-weight="400" text-anchor="start" fill="#0F766E">linearity does not require independence</text>
<rect x="835" y="315" width="310" height="68" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="990.0" y="355.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">Var(q dot k)=d  -&gt; scale by 1/sqrt(d)</text>
<text x="835" y="430" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">方差相加必须检查协方差交叉项。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">期望的线性最可靠；方差与高阶矩需要存在性、中心化和依赖结构审计。</text>
</svg>