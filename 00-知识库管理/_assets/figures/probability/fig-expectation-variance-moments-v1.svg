<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">期望、方差与矩</title>
  <desc id="desc">三面板展示期望作为概率加权积分、方差作为围绕均值的平方距离，以及指标变量和矩在计数与尺度传播中的作用。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFBEB"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7C3AED"/></marker>
    <style>.title{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F172A}.head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#713F12}.txt{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#64748B}.math{font:15px Georgia,"Times New Roman",serif;fill:#0F172A}.card{fill:#fff;stroke:#CBD5E1;stroke-width:1.3}.blue{fill:#DBEAFE;stroke:#60A5FA}.green{fill:#D1FAE5;stroke:#34D399}.amber{fill:#FEF3C7;stroke:#FBBF24}.violet{fill:#EDE9FE;stroke:#A78BFA}.line{stroke:#7C3AED;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <text x="40" y="38" class="title">期望是加权汇总；方差是围绕均值的平方波动</text>
  <rect x="28" y="58" width="368" height="342" rx="17" class="card"/><rect x="416" y="58" width="368" height="342" rx="17" class="card"/><rect x="804" y="58" width="368" height="342" rx="17" class="card"/>

  <text x="50" y="88" class="head">A　对分布积分，而非“取最可能值”</text>
  <line x1="68" y1="267" x2="357" y2="267" stroke="#64748B"/><line x1="95" y1="277" x2="95" y2="117" stroke="#64748B"/>
  <rect x="125" y="221" width="38" height="46" class="blue"/><rect x="190" y="176" width="38" height="91" class="green"/><rect x="255" y="130" width="38" height="137" class="amber"/>
  <text x="137" y="290" class="math">0</text><text x="202" y="290" class="math">1</text><text x="267" y="290" class="math">2</text>
  <path d="M145 311L145 340L274 340L274 311" class="line"/>
  <text x="104" y="370" class="math">E[X]=Σx x p(x)=1.4</text>
  <text x="65" y="394" class="small">均值可不在支持集，也不等于众数/中位数</text>

  <text x="438" y="88" class="head">B　方差测量离均值的平方距离</text>
  <line x1="455" y1="252" x2="748" y2="252" stroke="#64748B" stroke-width="2"/>
  <circle cx="493" cy="252" r="10" fill="#2563EB"/><circle cx="570" cy="252" r="10" fill="#10B981"/><circle cx="707" cy="252" r="10" fill="#F59E0B"/>
  <line x1="604" y1="124" x2="604" y2="278" stroke="#7C3AED" stroke-width="3" stroke-dasharray="7 5"/><text x="584" y="113" class="math">μ</text>
  <path d="M493 216Q548 176 604 216" fill="none" stroke="#2563EB" stroke-width="2"/><path d="M604 216Q656 166 707 216" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="468" y="306" class="math">Var(X)=E[(X−μ)²]</text>
  <text x="468" y="339" class="math">=E[X²]−E[X]² ≥ 0</text>
  <text x="456" y="379" class="small">平方让正负偏差不抵消；单位变成原单位的平方</text>

  <text x="826" y="88" class="head">C　指标、矩与 AI 尺度传播</text>
  <rect x="838" y="117" width="112" height="57" rx="11" class="blue"/><text x="856" y="151" class="math">Iᵢ=1{Aᵢ}</text>
  <path d="M958 145L1008 145" class="line"/>
  <rect x="1018" y="117" width="112" height="57" rx="11" class="green"/><text x="1040" y="151" class="math">E[Iᵢ]=P(Aᵢ)</text>
  <rect x="849" y="206" width="270" height="55" rx="11" class="amber"/><text x="875" y="239" class="math">E[Σ Iᵢ]=Σ P(Aᵢ)</text>
  <rect x="849" y="286" width="270" height="55" rx="11" class="violet"/><text x="872" y="319" class="math">Var(q·k)=d  ⇒  scale 1/√d</text>
  <text x="846" y="372" class="small">E 的线性无需独立；Var 相加要查交叉项</text>
  <text x="846" y="394" class="small">矩存在需额外条件；重尾可能无均值/方差</text>
</svg>
