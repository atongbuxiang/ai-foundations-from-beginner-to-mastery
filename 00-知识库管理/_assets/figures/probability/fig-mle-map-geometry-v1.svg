<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">最大似然、MAP 与稳定计算</title>
  <desc id="desc">三面板展示密度和似然的不同阅读方向、先验把最大似然推向最大后验、以及从概率模型到稳定负对数似然实现的审计链。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F3FF"/><stop offset="0.52" stop-color="#F8FAFC"/><stop offset="1" stop-color="#FFF7ED"/></linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4F46E5"/></marker>
    <style>.title{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F172A}.head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#4F46E5}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#64748B}.label{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.math{font:15px Georgia,"Times New Roman",serif;fill:#0F172A}.card{fill:#fff;stroke:#CBD5E1;stroke-width:1.3}.axis{stroke:#64748B;stroke-width:1.2}.arrow{stroke:#4F46E5;stroke-width:2.2;fill:none;marker-end:url(#arr)}</style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <text x="40" y="38" class="title">点估计的完整链：概率模型 → likelihood / prior → 约束、尺度与数值实现</text>
  <rect x="28" y="58" width="368" height="342" rx="17" class="card"/><rect x="416" y="58" width="368" height="342" rx="17" class="card"/><rect x="804" y="58" width="368" height="342" rx="17" class="card"/>

  <text x="50" y="88" class="head">A　同一公式，两种阅读方向</text>
  <rect x="57" y="112" width="132" height="54" rx="10" fill="#DBEAFE" stroke="#60A5FA"/><text x="73" y="136" class="math">p(x | theta)</text><text x="73" y="155" class="small">fix theta, vary x</text>
  <rect x="235" y="112" width="132" height="54" rx="10" fill="#EDE9FE" stroke="#A78BFA"/><text x="251" y="136" class="math">L(theta ; x)</text><text x="251" y="155" class="small">fix x, vary theta</text>
  <path d="M193 139L231 139" class="arrow"/>
  <line x1="63" y1="281" x2="363" y2="281" class="axis"/><line x1="67" y1="286" x2="67" y2="195" class="axis"/>
  <path d="M69 279C112 278 138 270 166 238C195 204 221 185 248 201C276 217 291 257 313 273C330 280 345 281 360 281" fill="#DDD6FE" stroke="#7C3AED" stroke-width="2.7"/>
  <line x1="237" y1="193" x2="237" y2="288" stroke="#DC2626" stroke-width="1.7" stroke-dasharray="5 4"/><text x="245" y="201" class="math">theta_MLE</text>
  <text x="72" y="318" class="math">integral_theta L(theta;x) dtheta != 1</text>
  <text x="72" y="349" class="small">likelihood 只给相对支持，不是参数概率</text>
  <text x="72" y="376" class="small">先检查 support、边界、存在性与唯一性</text>

  <text x="438" y="88" class="head">B　Prior 改变目标：MLE 不等于 MAP</text>
  <line x1="447" y1="280" x2="754" y2="280" class="axis"/>
  <path d="M451 278C484 278 509 266 535 229C560 195 584 162 610 171C635 179 651 224 670 257C690 278 719 279 751 280" fill="none" stroke="#2563EB" stroke-width="2.8"/>
  <path d="M451 278C489 278 520 273 549 253C578 234 601 207 629 211C658 215 676 248 699 267C716 279 733 280 751 280" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M451 278C474 276 490 253 510 216C530 180 550 150 572 164C596 179 610 228 635 257C659 279 698 280 751 280" fill="#DCFCE7" fill-opacity=".55" stroke="#16A34A" stroke-width="2.8"/>
  <line x1="610" y1="165" x2="610" y2="289" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="572" y1="157" x2="572" y2="289" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="615" y="151" class="small">MLE</text><text x="542" y="145" class="small">MAP</text>
  <text x="455" y="319" class="math">log posterior = log L + log prior + const</text>
  <text x="455" y="348" class="small" fill="#2563EB">blue: likelihood</text><text x="576" y="348" class="small" fill="#EA580C">orange: prior</text><text x="681" y="348" class="small" fill="#16A34A">green: posterior</text>
  <text x="455" y="377" class="small">MAP 是 density mode：依赖参数坐标与 prior 定义</text>

  <text x="826" y="88" class="head">C　实现审计：公式正确还不够</text>
  <rect x="833" y="110" width="132" height="53" rx="10" fill="#DBEAFE" stroke="#60A5FA"/><text x="849" y="133" class="label">联合/条件模型</text><text x="849" y="152" class="math">p_theta(data)</text>
  <path d="M969 136L1002 136" class="arrow"/>
  <rect x="1007" y="110" width="137" height="53" rx="10" fill="#EDE9FE" stroke="#A78BFA"/><text x="1022" y="133" class="label">log-domain</text><text x="1022" y="152" class="math">sum log p</text>
  <path d="M1077 168L1077 194" class="arrow"/>
  <rect x="942" y="199" width="202" height="55" rx="10" fill="#FEF3C7" stroke="#F59E0B"/><text x="959" y="222" class="label">stable primitive</text><text x="959" y="243" class="math">logsumexp / softplus</text>
  <path d="M938 226L905 226" class="arrow"/>
  <rect x="833" y="199" width="100" height="55" rx="10" fill="#DCFCE7" stroke="#4ADE80"/><text x="849" y="222" class="label">constraint</text><text x="849" y="243" class="math">transform</text>
  <rect x="833" y="287" width="311" height="68" rx="11" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="851" y="312" class="math">mean loss + lambda * penalty</text><text x="851" y="334" class="small">核对 n-scaling、weight decay、Jacobian 与 symmetry</text>
  <text x="835" y="382" class="small">训练 NLL、选择后的模型与部署风险是三个对象</text>
</svg>
