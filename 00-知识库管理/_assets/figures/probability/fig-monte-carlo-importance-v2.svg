<text x="855" y="126" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">f(X)</text>
<text x="1128" y="395" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">h(X)</text>
<text x="830" y="430" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">f_cv = f - beta(h-Eh)</text>
<text x="830" y="466" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">beta* = Cov(f,h)/Var(h)</text>
<text x="830" y="500" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">减掉可预测部分；代价是 Eh 必须已知。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Monte Carlo 可信度来自误差预算、支持与尾部诊断，而不是只报告样本数。</text>
</svg>