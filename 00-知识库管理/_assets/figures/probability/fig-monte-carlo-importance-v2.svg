<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">样本平均：误差按平方根缩小</text>
<rect x="48" y="115" width="48" height="44" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="72.0" y="143.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">f1</text>
<line x1="72" y1="161" x2="200" y2="220" stroke="#D7DEE8" stroke-width="2"/>
<rect x="114" y="115" width="48" height="44" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="138.0" y="143.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">f2</text>
<line x1="138" y1="161" x2="200" y2="220" stroke="#D7DEE8" stroke-width="2"/>
<rect x="180" y="115" width="48" height="44" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="204.0" y="143.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">f3</text>
<line x1="204" y1="161" x2="200" y2="220" stroke="#D7DEE8" stroke-width="2"/>
<rect x="246" y="115" width="48" height="44" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="270.0" y="143.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">...</text>
<line x1="270" y1="161" x2="200" y2="220" stroke="#D7DEE8" stroke-width="2"/>
<rect x="312" y="115" width="48" height="44" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="336.0" y="143.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">fn</text>
<line x1="336" y1="161" x2="200" y2="220" stroke="#D7DEE8" stroke-width="2"/>
<rect x="92" y="222" width="216" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="200.0" y="259.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">mu_hat = (1/n) sum fi</text>
<text x="45" y="340" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">E[mu_hat]=mu</text>
<text x="45" y="378" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">SE(mu_hat)=sigma_f/sqrt(n)</text>
<text x="45" y="422" font-size="17" font-weight="650" text-anchor="start" fill="#C24135">误差减半  -&gt;  样本预算约乘 4</text>
<text x="45" y="460" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">前提：iid 与有限二阶矩；一次运行仍会波动。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">重要性采样：覆盖比 ESS 更先</text>
<line x1="440" y1="345" x2="770" y2="345" stroke="#D7DEE8" stroke-width="2"/>
<line x1="455" y1="365" x2="455" y2="105" stroke="#D7DEE8" stroke-width="2"/>
