<text x="535" y="145" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">target p</text>
<text x="650" y="215" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">proposal q</text>
<circle cx="490" cy="318" r="6" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="500" y="312" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">q 很小 -&gt; w=p/q 很大</text>
<text x="430" y="405" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">mu = E_q[w f]</text>
<text x="430" y="440" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">ESS = (sum w)^2 / sum w^2</text>
<text x="430" y="475" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">ESS 只看权重集中，不是误差证书。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Control variate：削减残差方差</text>
