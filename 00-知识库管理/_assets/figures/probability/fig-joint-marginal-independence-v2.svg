<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">联合分布、边缘分布与独立性</title>
<desc id="desc">联合分布保留变量配对；边缘化沿轴求和会丢失 coupling；独立要求整个联合测度分解。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">联合表沿轴边缘化</text>
<rect x="65" y="125" width="88" height="70" rx="0" fill="#EFF6FF" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="109" y="168" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">.30</text>
<rect x="153" y="125" width="88" height="70" rx="0" fill="#EFF6FF" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="197" y="168" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">.20</text>
<rect x="241" y="125" width="88" height="70" rx="0" fill="#ECFDF5" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="285" y="168" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">.50</text>
<rect x="65" y="195" width="88" height="70" rx="0" fill="#EFF6FF" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="109" y="238" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">.10</text>
<rect x="153" y="195" width="88" height="70" rx="0" fill="#EFF6FF" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="197" y="238" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">.40</text>
<rect x="241" y="195" width="88" height="70" rx="0" fill="#ECFDF5" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="285" y="238" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">.50</text>
<rect x="65" y="265" width="88" height="70" rx="0" fill="#ECFDF5" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="109" y="308" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">.40</text>
<rect x="153" y="265" width="88" height="70" rx="0" fill="#ECFDF5" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="197" y="308" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">.60</text>
<rect x="241" y="265" width="88" height="70" rx="0" fill="#ECFDF5" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="285" y="308" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">1.00</text>
<text x="200" y="365" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937">p_X(x)=sum_y p(x,y)</text>
<text x="200" y="405" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937">p_Y(y)=sum_x p(x,y)</text>
<text x="45" y="450" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">边缘化丢掉 X、Y 如何配对。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">相同边缘，不同 coupling</text>
<rect x="450" y="145" width="55" height="55" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.5"/>
<rect x="505" y="145" width="55" height="55" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.5"/>
<rect x="450" y="200" width="55" height="55" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.5"/>
<rect x="505" y="200" width="55" height="55" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="505" y="285" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">same</text>
<rect x="615" y="145" width="55" height="55" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.5"/>
<rect x="670" y="145" width="55" height="55" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.5"/>
<rect x="615" y="200" width="55" height="55" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.5"/>
<rect x="670" y="200" width="55" height="55" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.5"/>
<text x="670" y="285" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">opposite</text>
<text x="600" y="345" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937">P_X=P_Y=Bernoulli(1/2)</text>
<text x="430" y="390" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937">但 P(X=Y) 可以是 1 或 0。</text>
<text x="430" y="430" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">边缘不能恢复依赖。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">独立是强分解合同</text>
<rect x="840" y="115" width="105" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="892.5" y="150.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">P_X</text>
<rect x="1035" y="115" width="105" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="1087.5" y="150.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">P_Y</text>
<text x="990" y="152" font-size="25" font-weight="700" text-anchor="middle" fill="#1F2937">×</text>
<line x1="990" y1="180" x2="990" y2="235" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="845" y="250" width="290" height="72" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="292.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">P_(X,Y) = P_X tensor P_Y</text>
<text x="830" y="375" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">p(x,y)=p_X(x)p_Y(y) for all measurable sets</text>
<text x="830" y="420" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">检查一个事件或零相关远远不够。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">边缘描述各变量，联合描述它们如何配对；独立必须对整个联合分布成立。</text>
</svg>