<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">概率空间的三个层次</title>
  <desc id="desc">展示样本空间、事件sigma代数和概率测度及其三条公理。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFF6FF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker>
    <style>.title{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F172A}.head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#1E3A8A}.txt{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#64748B}.math{font:15px Georgia,"Times New Roman",serif;fill:#0F172A}.card{fill:#fff;stroke:#CBD5E1;stroke-width:1.3}.blue{fill:#EFF6FF;stroke:#93C5FD}.violet{fill:#F5F3FF;stroke:#C4B5FD}.green{fill:#ECFDF5;stroke:#6EE7B7}.amber{fill:#FFFBEB;stroke:#FCD34D}.line{stroke:#2563EB;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <text x="40" y="38" class="title">概率空间：先确定结果与问题，再赋予一致的概率</text>
  <rect x="28" y="58" width="368" height="342" rx="17" class="card"/>
  <rect x="416" y="58" width="368" height="342" rx="17" class="card"/>
  <rect x="804" y="58" width="368" height="342" rx="17" class="card"/>

  <text x="50" y="88" class="head">A　样本空间 Ω：互斥且穷尽</text>
  <rect x="58" y="115" width="306" height="132" rx="14" class="blue"/>
  <circle cx="110" cy="164" r="25" fill="#fff" stroke="#60A5FA"/><circle cx="178" cy="164" r="25" fill="#fff" stroke="#60A5FA"/><circle cx="246" cy="164" r="25" fill="#fff" stroke="#60A5FA"/><circle cx="314" cy="164" r="25" fill="#fff" stroke="#60A5FA"/>
  <text x="98" y="170" class="math">HH</text><text x="166" y="170" class="math">HT</text><text x="234" y="170" class="math">TH</text><text x="302" y="170" class="math">TT</text>
  <text x="78" y="218" class="small">一次实验恰落在一个 outcome ω</text>
  <rect x="58" y="274" width="306" height="65" rx="11" class="amber"/>
  <text x="78" y="300" class="txt">先声明记录粒度与支持集</text>
  <text x="78" y="324" class="small">同一现实问题可有不同合法 Ω</text>
  <text x="66" y="379" class="small">outcome 是元素；event 才是结果的集合</text>

  <text x="438" y="88" class="head">B　事件族 𝓕：可判定的信息</text>
  <rect x="454" y="112" width="292" height="148" rx="14" class="violet"/>
  <rect x="470" y="131" width="120" height="94" rx="10" fill="#E0E7FF" stroke="#818CF8"/>
  <rect x="610" y="131" width="120" height="94" rx="10" fill="#F3E8FF" stroke="#A78BFA"/>
  <text x="490" y="158" class="txt">第一次为 H</text><text x="494" y="186" class="math">{HH, HT}</text>
  <text x="630" y="158" class="txt">第一次为 T</text><text x="634" y="186" class="math">{TH, TT}</text>
  <text x="468" y="244" class="small">观察者只看第一次：无法区分 HH 与 HT</text>
  <rect x="454" y="282" width="292" height="57" rx="11" class="violet"/>
  <text x="475" y="306" class="math">𝓕={∅, Ω, C_H, C_T}</text>
  <text x="475" y="327" class="small">对补集、可数并封闭</text>
  <text x="455" y="379" class="small">σ-代数也可理解为观察者拥有的信息</text>

  <text x="826" y="88" class="head">C　概率测度 P：一致赋值</text>
  <rect x="838" y="111" width="302" height="60" rx="11" class="green"/>
  <text x="858" y="137" class="txt">非负性　P(A) ≥ 0</text><text x="858" y="158" class="small">任何合法事件都不能有负概率</text>
  <rect x="838" y="185" width="302" height="60" rx="11" class="green"/>
  <text x="858" y="211" class="txt">归一化　P(Ω) = 1</text><text x="858" y="232" class="small">样本空间必须穷尽所有结果</text>
  <rect x="838" y="259" width="302" height="82" rx="11" class="green"/>
  <text x="858" y="285" class="txt">可列可加性</text>
  <text x="858" y="309" class="math">Aᵢ 两两不交 ⇒ P(∪Aᵢ)=ΣP(Aᵢ)</text>
  <text x="858" y="330" class="small">由此推出补集、容斥、连续性与 union bound</text>
  <text x="844" y="379" class="small">三元组 (Ω,𝓕,P) 才是一份完整概率模型</text>
</svg>
