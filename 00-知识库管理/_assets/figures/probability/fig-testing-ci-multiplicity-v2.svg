<text x="830" y="395" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">FWER: P(at least one false rejection)</text>
<text x="830" y="430" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">FDR: E[V/max(R,1)]</text>
<text x="830" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">optional stopping / seed 挑选也属于选择。</text>
