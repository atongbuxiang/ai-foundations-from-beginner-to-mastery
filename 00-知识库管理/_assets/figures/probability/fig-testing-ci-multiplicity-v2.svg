<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">检验尾概率、区间覆盖与多重比较</title>
<desc id="desc">p 值是 null 下统计量尾概率；置信水平属于重复抽样的区间程序；查看多个候选后选择赢家必须控制整个 family 的错误率。</desc>
