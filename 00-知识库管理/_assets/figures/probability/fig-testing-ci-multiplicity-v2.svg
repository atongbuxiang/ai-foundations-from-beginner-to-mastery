<text x="45" y="400" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">p = P_H0(T &gt;= t_obs)</text>
<text x="45" y="440" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">valid p: P_H0(p &lt;= alpha) &lt;= alpha</text>
<text x="45" y="480" font-size="16" font-weight="400" text-anchor="start" fill="#C24135">不是 P(H0 为真 | data)。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">95% 属于区间程序的覆盖率</text>
