<text x="430" y="470" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">P_theta(theta in C(X)) = 0.95</text>
<text x="430" y="500" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">固定数据后的一个区间不再随机。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">选择赢家前，要定义整个 family</text>
