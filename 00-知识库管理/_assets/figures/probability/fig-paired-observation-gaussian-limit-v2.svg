<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">从四原子观测到 Gaussian 极限</title>
<desc id="desc">同一 Beta–Bernoulli 观测对先定义矩匹配 Gaussian 与白化坐标，再由独立样本平均进入 LLN、CLT 和 Delta 传播。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">相同矩，不同分布</text>
<circle cx="80" cy="155" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="80" y="137" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">3/10</text>
<circle cx="80" cy="275" r="8" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="80" y="257" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">1/5</text>
<circle cx="180" cy="155" r="8" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="180" y="137" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">1/5</text>
<circle cx="180" cy="275" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="180" y="257" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">3/10</text>
<line x1="55" y1="310" x2="205" y2="310" stroke="#D7DEE8" stroke-width="2"/>
<line x1="55" y1="310" x2="55" y2="115" stroke="#D7DEE8" stroke-width="2"/>
<text x="130" y="345" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">W: four atoms</text>
<line x1="215" y1="215" x2="245" y2="215" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<path d="M361.1 192.7L361.8 195.2L362.4 197.8L362.7 200.5L362.7 203.2L362.5 206.0L362.1 208.8L361.4 211.6L360.4 214.5L359.3 217.3L357.9 220.2L356.2 223.0L354.4 225.8L352.3 228.5L350.0 231.2L347.5 233.8L344.9 236.4L342.0 238.8L339.0 241.2L335.9 243.5L332.6 245.6L329.1 247.7L325.6 249.6L321.9 251.3L318.2 253.0L314.4 254.5L310.5 255.8L306.6 256.9L302.7 257.9L298.8 258.8L294.8 259.4L290.9 259.9L287.0 260.2L283.2 260.3L279.4 260.3L275.8 260.0L272.2 259.6L268.7 259.0L265.3 258.3L262.1 257.3L259.1 256.2L256.2 255.0L253.4 253.5L250.9 252.0L248.5 250.2L246.4 248.4L244.4 246.4L242.7 244.3L241.2 242.1L240.0 239.7L238.9 237.3L238.2 234.8L237.6 232.2L237.3 229.5L237.3 226.8L237.5 224.0L237.9 221.2L238.6 218.4L239.6 215.5L240.7 212.7L242.1 209.8L243.8 207.0L245.6 204.2L247.7 201.5L250.0 198.8L252.5 196.2L255.1 193.6L258.0 191.2L261.0 188.8L264.1 186.5L267.4 184.4L270.9 182.3L274.4 180.4L278.1 178.7L281.8 177.0L285.6 175.5L289.5 174.2L293.4 173.1L297.3 172.1L301.2 171.2L305.2 170.6L309.1 170.1L313.0 169.8L316.8 169.7L320.6 169.7L324.2 170.0L327.8 170.4L331.3 171.0L334.7 171.7L337.9 172.7L340.9 173.8L343.8 175.0L346.6 176.5L349.1 178.0L351.5 179.8L353.6 181.6L355.6 183.6L357.3 185.7L358.8 187.9L360.0 190.3L361.1 192.7Z" fill="none" stroke="#0F766E" stroke-width="3"/>
<circle cx="300" cy="215" r="5" fill="#1F2937" stroke="#1F2937" stroke-width="2"/>
<text x="300" y="345" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">G ~ N(mu,Sigma)</text>
<text x="45" y="405" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">mu=(1/2,1/2)</text>
<text x="45" y="442" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">Sigma: diag 1/4; off-diag 1/20</text>
<text x="45" y="480" font-size="16" font-weight="700" text-anchor="start" fill="#B7791F" class="math">eigenvalues: 3/10 and 1/5</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">变换与 LLN 的依赖边界</text>
<rect x="440" y="100" width="88" height="54" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="484.0" y="133.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">G-mu</text>
<rect x="555" y="100" width="88" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="599.0" y="133.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">U</text>
<rect x="670" y="100" width="88" height="54" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="714.0" y="133.0" font-size="17" font-weight="650" text-anchor="middle" fill="#B7791F">Z</text>
<line x1="530" y1="127" x2="550" y2="127" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<line x1="645" y1="127" x2="665" y2="127" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<text x="540" y="98" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">Q^T</text>
<text x="655" y="98" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">D^-1/2</text>
<text x="430" y="200" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">Cov(U)=diag(3/10,1/5); Cov(Z)=I</text>
<rect x="440" y="250" width="315" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="597.5" y="287.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">fresh Theta_i:  Wbar_n -&gt; mu</text>
<rect x="440" y="365" width="315" height="68" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="597.5" y="405.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">shared Theta:  Wbar_n -&gt; (Theta,Theta)</text>
<text x="440" y="338" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">independent complete samples</text>
<text x="440" y="468" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">共享环境不会被增加样本数平均掉。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">CLT 与 Delta 局部传播</text>
<rect x="840" y="98" width="300" height="64" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="136.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">sqrt(n)(Wbar_n-mu) -&gt; N(0,Sigma)</text>
<line x1="990" y1="165" x2="990" y2="208" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="840" y="218" width="300" height="65" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="256.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">g(a,b)=a b;  grad g=(1/2,1/2)</text>
<line x1="990" y1="286" x2="990" y2="330" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="840" y="340" width="300" height="66" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="990.0" y="379.0" font-size="17" font-weight="650" text-anchor="middle" fill="#B7791F">asymptotic variance = 3/20</text>
<text x="840" y="440" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">gradient zero? use n-scale + quadratic limit</text>
<text x="840" y="478" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">1/4 是边缘均值乘积；joint success 是 3/10。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先区分有限分布与矩匹配参照，再检查跨样本独立，最后才把 Gaussian 极限通过局部导数传播。</text>
</svg>