<title id="title">中心极限定理与 Delta 方法</title>
<desc id="desc">CLT 描述 sqrt(n) 放大的平均误差之分布极限；Berry–Esseen量化 CDF 误差；Delta 方法用局部导数传播渐近分布。</desc>
