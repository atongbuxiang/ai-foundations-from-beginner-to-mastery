<text x="430" y="450" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">sup_x |F_n(x)-Phi(x)| &lt;= C rho/(sigma^3 sqrt n)</text>
<text x="430" y="485" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">CDF 绝对误差不等于极端尾部相对误差。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Delta：局部切线传播</text>
<line x1="845" y1="390" x2="1145" y2="390" stroke="#D7DEE8" stroke-width="2"/>
<line x1="870" y1="420" x2="870" y2="105" stroke="#D7DEE8" stroke-width="2"/>
<path d="M870 360C950 350 1000 300 1060 170C1090 120 1120 105 1140 100" fill="none" stroke="#2563EB" stroke-width="3"/>
<line x1="905" y1="350" x2="1120" y2="150" stroke="#B7791F" stroke-width="3" stroke-dasharray="7 5"/>
