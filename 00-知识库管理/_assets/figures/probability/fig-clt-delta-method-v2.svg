<text x="990" y="320" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">theta</text>
<text x="830" y="450" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">sqrt n[g(T_n)-g(theta)] -&gt;d g&#x27;(theta) Z</text>
<text x="830" y="485" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">若 g&#x27;(theta)=0，需要二阶展开与新尺度。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">CLT 是渐近分布结论，Delta 是局部传播规则；二者都不是有限样本尾界。</text>
