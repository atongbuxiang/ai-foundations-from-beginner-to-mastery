<text x="975" y="185" font-size="20" font-weight="700" text-anchor="middle" fill="#1F2937">L</text>
<text x="835" y="325" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">X = mu + L Z,   Sigma = L L^T</text>
<text x="835" y="370" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">solve L y = x-mu; quadratic = ||y||^2</text>
<text x="835" y="415" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">log det Sigma = 2 sum_i log L_ii</text>
<text x="835" y="455" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">不显式形成 Sigma^-1 或 determinant。</text>
