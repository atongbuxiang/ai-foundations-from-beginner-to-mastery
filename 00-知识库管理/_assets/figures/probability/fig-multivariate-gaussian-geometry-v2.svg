<text x="205" y="255" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2937">mu</text>
<text x="45" y="415" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">(x-mu)^T Sigma^-1 (x-mu)=c</text>
<text x="45" y="455" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">主轴是 eigenvectors；尺度是 sqrt(eigenvalues)。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">条件化移动均值并缩小协方差</text>
