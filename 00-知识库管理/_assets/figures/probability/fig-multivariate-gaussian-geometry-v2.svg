<text x="660" y="225" font-size="16" font-weight="700" text-anchor="start" fill="#B7791F">X_b=b</text>
<text x="430" y="380" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">mu_a|b = mu_a + Sigma_ab Sigma_bb^-1(b-mu_b)</text>
<text x="430" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">Sigma_a|b = Sigma_aa - Sigma_ab Sigma_bb^-1 Sigma_ba</text>
<text x="430" y="460" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">Schur complement &lt;= marginal covariance</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Cholesky：采样与稳定计算</text>
