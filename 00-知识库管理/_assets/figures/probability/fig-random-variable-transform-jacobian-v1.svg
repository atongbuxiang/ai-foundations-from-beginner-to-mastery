<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">随机变量变换、原像分支与Jacobian体积修正</title>
  <desc id="desc">三面板展示推前测度通过原像计算概率，一维平方变换需要汇总正负两个逆分支，以及二维Jacobian拉伸面积后密度按倒数缩小。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ECFEFF"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0F766E"/></marker>
    <style>.title{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F172A}.head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F766E}.txt{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#64748B}.math{font:15px Georgia,"Times New Roman",serif;fill:#0F172A}.card{fill:#fff;stroke:#CBD5E1;stroke-width:1.3}.line{stroke:#0F766E;stroke-width:2.2;fill:none;marker-end:url(#arr)}.dash{stroke:#94A3B8;stroke-width:1.4;stroke-dasharray:5 5}.blue{fill:#DBEAFE;stroke:#3B82F6}.green{fill:#D1FAE5;stroke:#10B981}.amber{fill:#FEF3C7;stroke:#F59E0B}.violet{fill:#EDE9FE;stroke:#8B5CF6}</style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <text x="40" y="38" class="title">同一条质量守恒：输出事件取原像；多分支相加；局部体积放大则密度缩小</text>
  <rect x="28" y="58" width="368" height="342" rx="17" class="card"/><rect x="416" y="58" width="368" height="342" rx="17" class="card"/><rect x="804" y="58" width="368" height="342" rx="17" class="card"/>

  <text x="50" y="88" class="head">A　推前：先问输出事件的原像</text>
  <ellipse cx="120" cy="190" rx="67" ry="105" class="blue" fill-opacity=".55"/>
  <ellipse cx="304" cy="190" rx="60" ry="105" class="green" fill-opacity=".55"/>
  <path d="M188 190L238 190" class="line"/><text x="205" y="171" class="math">T</text>
  <path d="M87 136C109 117 142 121 151 151C159 179 137 203 105 195C77 188 68 155 87 136Z" class="violet" fill-opacity=".78"/>
  <path d="M280 139C301 126 327 137 333 163C339 190 318 205 292 195C267 185 261 153 280 139Z" class="amber" fill-opacity=".82"/>
  <text x="78" y="229" class="math">T⁻¹(B)</text><text x="290" y="229" class="math">B</text>
  <text x="61" y="318" class="math">Pᵧ(B) = Pₓ(T⁻¹(B))</text>
  <text x="61" y="350" class="small">T 不必可逆；原像始终是合法集合</text>
  <text x="61" y="376" class="small">离散：把原像中所有概率质量相加</text>

  <text x="438" y="88" class="head">B　非单射：Y=X² 有两个逆分支</text>
  <line x1="462" y1="283" x2="755" y2="283" stroke="#64748B"/><line x1="608" y1="302" x2="608" y2="110" stroke="#64748B"/>
  <path d="M487 113C526 150 568 231 608 255C648 231 690 150 729 113" fill="none" stroke="#7C3AED" stroke-width="3"/>
  <line x1="512" y1="205" x2="704" y2="205" class="dash"/>
  <circle cx="543" cy="205" r="6" fill="#2563EB"/><circle cx="673" cy="205" r="6" fill="#2563EB"/>
  <path d="M543 205C555 180 574 164 600 154" class="line"/><path d="M673 205C660 180 644 164 616 154" class="line"/>
  <text x="516" y="226" class="math">−√y</text><text x="664" y="226" class="math">√y</text><text x="713" y="199" class="math">y</text>
  <text x="455" y="325" class="math">fᵧ(y)= fₓ(√y)/(2√y) + fₓ(−√y)/(2√y)</text>
  <text x="455" y="355" class="small">漏掉任一分支都会丢失概率质量</text>
  <text x="455" y="380" class="small">临界点 T′(0)=0 需单独审计</text>

  <text x="826" y="88" class="head">C　Jacobian：面积倍率与密度互为倒数</text>
  <rect x="842" y="130" width="92" height="92" class="blue" fill-opacity=".65"/><text x="865" y="181" class="math">dx</text>
  <path d="M947 176L1004 176" class="line"/><text x="961" y="157" class="math">J_T(x)</text>
  <polygon points="1020,137 1125,116 1142,214 1037,235" class="green" fill-opacity=".65"/>
  <text x="1054" y="181" class="math">dy</text>
  <text x="839" y="280" class="math">dy ≈ |det J_T(x)| dx</text>
  <text x="839" y="315" class="math">f_Y(y) = f_X(x) / |det J_T(x)|</text>
  <rect x="841" y="337" width="292" height="43" rx="10" class="amber" fill-opacity=".8"/>
  <text x="858" y="364" class="small">方向翻转可为负；概率体积必须取绝对值</text>
</svg>
