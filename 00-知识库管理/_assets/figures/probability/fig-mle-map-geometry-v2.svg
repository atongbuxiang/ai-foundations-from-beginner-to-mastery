<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">MLE、MAP、后验 mode 与参数坐标</title>
<desc id="desc">固定参数时密度在数据空间归一化；固定数据时 likelihood 只表达参数间相对支持；prior 改变 posterior，而 MAP 只保留一个且依赖坐标的 mode。</desc>
