<circle cx="1060" cy="120" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="1060" y="105" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">MAP</text>
<text x="830" y="365" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">theta -&gt; phi=g(theta): density gains Jacobian</text>
<text x="830" y="405" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">mode generally does not transform equivariantly</text>
<text x="830" y="445" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">点估计不保存宽度、相关性或另一峰。</text>
<text x="830" y="480" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">“penalty = prior”还需尺度与参数化对齐。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">MLE 与 MAP 都是优化得到的点；likelihood、posterior 与不确定性是更丰富的对象。</text>
</svg>