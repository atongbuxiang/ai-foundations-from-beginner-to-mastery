<text x="500" y="245" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">prior</text>
<text x="620" y="120" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">posterior</text>
<line x1="650" y1="365" x2="650" y2="170" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="610" y1="365" x2="610" y2="145" stroke="#C24135" stroke-width="2" stroke-dasharray="5 4"/>
<text x="650" y="405" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">MLE</text>
<text x="610" y="435" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">MAP</text>
<text x="430" y="480" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">posterior ∝ likelihood × prior</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Mode 丢掉宽度与多峰</text>
