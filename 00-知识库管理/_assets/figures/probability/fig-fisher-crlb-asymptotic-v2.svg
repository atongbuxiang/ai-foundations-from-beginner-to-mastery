<text x="690" y="260" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">larger variance</text>
<text x="625" y="105" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">efficient boundary</text>
<text x="430" y="405" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">Var(T) &gt;= [g&#x27;(theta)]^2 / (n I(theta))</text>
<text x="430" y="445" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">标量式：无偏、正则、有限信息。</text>
<text x="430" y="480" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">有偏估计可用偏差换更小 MSE。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">MLE 渐近正态性是一条证明链</text>
<rect x="845" y="96" width="280" height="54" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="985.0" y="129.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">score CLT</text>
<line x1="985" y1="152" x2="985" y2="178" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="845" y="184" width="280" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="985.0" y="217.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">Hessian / n -&gt; -I</text>
<line x1="985" y1="240" x2="985" y2="266" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="845" y="272" width="280" height="54" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="985.0" y="305.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">Taylor at theta0</text>
<line x1="985" y1="328" x2="985" y2="354" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="845" y="360" width="280" height="54" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="985.0" y="393.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">sqrt(n)(theta_hat-theta0)</text>
<text x="970" y="452" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135" class="math">-&gt; N(0, I^-1)</text>
<text x="830" y="490" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">还需一致性、内点真值、非奇异信息与余项控制。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Fisher 理论是正则局部模型的精密结论；边界、奇异与不可辨识会改变整条链。</text>
</svg>