<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Score、Fisher 信息、Cramér–Rao 与 MLE 渐近链</title>
<desc id="desc">正则模型中 score 均值为零，Fisher 信息是 score 二阶矩与期望曲率；它给无偏估计下界，并通过 score CLT 与 Hessian LLN 决定 MLE 一阶渐近协方差。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Score 随数据变，Fisher 再平均</text>
<line x1="55" y1="240" x2="355" y2="240" stroke="#D7DEE8" stroke-width="2"/>
<line x1="205" y1="205" x2="205" y2="275" stroke="#1F2937" stroke-width="2"/>
<circle cx="90" cy="240" r="5" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<circle cx="125" cy="240" r="5" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<circle cx="157" cy="240" r="5" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<circle cx="185" cy="240" r="5" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<circle cx="220" cy="240" r="5" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<circle cx="247" cy="240" r="5" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<circle cx="278" cy="240" r="5" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<circle cx="310" cy="240" r="5" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="205" y="195" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937" class="math">E[s_theta(X)]=0</text>
<text x="45" y="325" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">I(theta)=E[s s^T]</text>
<text x="45" y="365" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">= -E[ Hessian log p_theta(X) ]</text>
<text x="45" y="415" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">observed 随样本变；Fisher 是总体平均。</text>
<text x="45" y="458" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">等式需要固定支持与微分—积分可交换。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">CRLB：只在声明的类别内比较</text>
<line x1="445" y1="355" x2="770" y2="355" stroke="#D7DEE8" stroke-width="2"/>
<line x1="460" y1="380" x2="460" y2="95" stroke="#D7DEE8" stroke-width="2"/>
