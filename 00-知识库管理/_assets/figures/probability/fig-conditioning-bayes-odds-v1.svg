<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">条件概率、全概率和贝叶斯更新</title>
  <desc id="desc">三面板展示条件化的筛选与归一化、事件分割的全概率以及odds形式的贝叶斯更新。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0FDF4"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker>
    <style>.title{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F172A}.head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#14532D}.txt{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#64748B}.math{font:15px Georgia,"Times New Roman",serif;fill:#0F172A}.card{fill:#fff;stroke:#CBD5E1;stroke-width:1.3}.blue{fill:#EFF6FF;stroke:#93C5FD}.green{fill:#ECFDF5;stroke:#6EE7B7}.amber{fill:#FFFBEB;stroke:#FCD34D}.violet{fill:#F5F3FF;stroke:#C4B5FD}.line{stroke:#2563EB;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <text x="40" y="38" class="title">条件化：在新信息下重新归一；Bayes：反转生成方向</text>
  <rect x="28" y="58" width="368" height="342" rx="17" class="card"/><rect x="416" y="58" width="368" height="342" rx="17" class="card"/><rect x="804" y="58" width="368" height="342" rx="17" class="card"/>

  <text x="50" y="88" class="head">A　限制到 B，再归一化</text>
  <rect x="58" y="115" width="306" height="145" rx="14" class="blue"/>
  <ellipse cx="193" cy="187" rx="112" ry="54" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
  <ellipse cx="236" cy="187" rx="62" ry="38" fill="#C4B5FD" fill-opacity=".78" stroke="#7C3AED" stroke-width="2"/>
  <text x="108" y="173" class="txt">B</text><text x="218" y="192" class="txt">A∩B</text>
  <text x="76" y="244" class="small">B 外信息被排除；B 的总质量缩放为 1</text>
  <rect x="58" y="282" width="306" height="57" rx="11" class="violet"/>
  <text x="79" y="316" class="math">P(A|B)=P(A∩B)/P(B)</text>
  <text x="66" y="379" class="small">固定 B 后，P(·|B) 仍满足概率三公理</text>

  <text x="438" y="88" class="head">B　分割原因，汇总证据</text>
  <rect x="449" y="117" width="70" height="58" rx="10" class="blue"/><rect x="449" y="191" width="70" height="58" rx="10" class="green"/><rect x="449" y="265" width="70" height="58" rx="10" class="amber"/>
  <text x="475" y="151" class="math">H₁</text><text x="475" y="225" class="math">H₂</text><text x="475" y="299" class="math">H₃</text>
  <path d="M525 146L626 199" class="line"/><path d="M525 220L626 220" class="line"/><path d="M525 294L626 241" class="line"/>
  <rect x="638" y="181" width="104" height="78" rx="39" class="violet"/><text x="681" y="225" class="math">E</text>
  <text x="452" y="350" class="math">P(E)=Σᵢ P(E|Hᵢ)P(Hᵢ)</text>
  <text x="455" y="379" class="small">Hᵢ 两两互斥且穷尽；遗漏原因会漏掉 evidence</text>

  <text x="826" y="88" class="head">C　Bayes 的 odds 更新</text>
  <rect x="838" y="119" width="95" height="65" rx="11" class="blue"/><text x="856" y="145" class="txt">prior odds</text><text x="866" y="168" class="math">1 : 99</text>
  <path d="M941 151L985 151" class="line"/>
  <rect x="993" y="119" width="132" height="65" rx="11" class="amber"/><text x="1025" y="145" class="txt">likelihood ratio</text><text x="1040" y="168" class="math">0.99 / 0.05</text>
  <path d="M1059 192L1059 229" class="line"/>
  <rect x="883" y="240" width="242" height="71" rx="11" class="green"/><text x="906" y="267" class="txt">posterior odds = prior × LR</text><text x="939" y="293" class="math">1 : 5  ⇒  P=1/6</text>
  <rect x="838" y="332" width="302" height="40" rx="10" class="violet"/><text x="859" y="357" class="small">低 base rate 仍可主导后验结果</text>
  <text x="844" y="393" class="small">Bayes 是恒等式；模型与因果假设需另证</text>
</svg>
