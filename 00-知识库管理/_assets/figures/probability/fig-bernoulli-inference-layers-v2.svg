<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">同一 Bernoulli 数据的三层不确定性</title>
<desc id="desc">局部 Fisher 信息约束重复抽样精度；Bayesian posterior/predictive 与 frequentist p-value/coverage 使用不同条件；MCMC 再为 posterior 积分增加数值误差层。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">局部信息与 sampling 精度</text>
<rect x="52" y="96" width="300" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="202.0" y="131.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">score = (Y-q)/[q(1-q)]</text>
<line x1="202" y1="156" x2="202" y2="196" stroke="#1F2937" stroke-width="2.3" marker-end="url(#a3)"/>
<rect x="52" y="206" width="300" height="60" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="202.0" y="242.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">I_1(q)=1/[q(1-q)]</text>
<line x1="202" y1="268" x2="202" y2="308" stroke="#1F2937" stroke-width="2.3" marker-end="url(#a3)"/>
<rect x="52" y="318" width="300" height="64" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="202.0" y="356.0" font-size="17" font-weight="650" text-anchor="middle" fill="#B7791F">CRLB = q(1-q)/n</text>
<text x="45" y="430" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">q=3/10, n=10: I_n=1000/21</text>
<text x="45" y="469" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">Var(q_hat)=21/1000: sample mean attains bound</text>
<text x="45" y="502" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">正则无偏类别中的局部基准，不是万能最优性。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">后验概率不等于 p 值或 coverage</text>
<rect x="440" y="96" width="315" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="597.5" y="133.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">posterior Q|y ~ Beta(5,9)</text>
<text x="440" y="205" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">predictive M=0,1,2: (3/7, 3/7, 1/7)</text>
<text x="440" y="248" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E" class="math">P(Q&lt;1/2|y)=7099/8192</text>
<line x1="440" y1="280" x2="755" y2="280" stroke="#D7DEE8" stroke-width="2"/>
<text x="440" y="327" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB" class="math">exact two-sided p-value = 11/32</text>
<text x="440" y="370" font-size="16" font-weight="650" text-anchor="start" fill="#B7791F">Hoeffding 95% CI: [0, 0.7295]</text>
<text x="440" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">posterior: condition on data + model</text>
<text x="440" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">p / coverage: repeat data under fixed q</text>
<text x="440" y="493" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">数字可同时正确，因为条件事件不同。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">MCMC 再增加计算误差层</text>
<rect x="840" y="96" width="300" height="58" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="990.0" y="131.0" font-size="17" font-weight="650" text-anchor="middle" fill="#B7791F">target Beta(5,9)</text>
<line x1="990" y1="156" x2="990" y2="196" stroke="#1F2937" stroke-width="2.3" marker-end="url(#a3)"/>
<rect x="840" y="206" width="300" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="243.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">proposal Beta(2,2) + MH</text>
<line x1="990" y1="270" x2="990" y2="310" stroke="#1F2937" stroke-width="2.3" marker-end="url(#a3)"/>
<rect x="840" y="320" width="300" height="64" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="358.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">correlated posterior draws</text>
<text x="840" y="425" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">truth gates: mean=5/14; var=3/196</text>
<text x="840" y="462" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">tail P(Q&gt;1/2)=1093/8192</text>
<text x="840" y="497" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">multi-chain R-hat + bulk/tail ESS + MCSE</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">数据随机性、参数不确定性与有限链计算误差必须分层报告；一种诊断不能替另一层作保证。</text>
</svg>