<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">协方差、相关性与条件期望</title>
  <desc id="desc">三面板展示协方差的同向与反向变化、零协方差不代表独立，以及条件期望作为可观测信息下的L2正交投影。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F3FF"/><stop offset="1" stop-color="#ECFDF5"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7C3AED"/></marker>
    <style>.title{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F172A}.head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#5B21B6}.txt{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#64748B}.math{font:15px Georgia,"Times New Roman",serif;fill:#0F172A}.card{fill:#fff;stroke:#CBD5E1;stroke-width:1.3}.blue{fill:#DBEAFE;stroke:#60A5FA}.green{fill:#D1FAE5;stroke:#34D399}.amber{fill:#FEF3C7;stroke:#FBBF24}.violet{fill:#EDE9FE;stroke:#A78BFA}.line{stroke:#7C3AED;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <text x="40" y="38" class="title">协方差只看线性共变；条件期望保留给定信息下的最佳平方预测</text>
  <rect x="28" y="58" width="368" height="342" rx="17" class="card"/><rect x="416" y="58" width="368" height="342" rx="17" class="card"/><rect x="804" y="58" width="368" height="342" rx="17" class="card"/>

  <text x="50" y="88" class="head">A　中心化乘积的平均</text>
  <line x1="76" y1="290" x2="356" y2="290" stroke="#64748B"/><line x1="92" y1="307" x2="92" y2="113" stroke="#64748B"/>
  <line x1="105" y1="272" x2="331" y2="130" stroke="#2563EB" stroke-width="2"/>
  <circle cx="125" cy="260" r="8" fill="#2563EB"/><circle cx="168" cy="230" r="8" fill="#2563EB"/><circle cx="218" cy="204" r="8" fill="#2563EB"/><circle cx="272" cy="169" r="8" fill="#2563EB"/><circle cx="319" cy="140" r="8" fill="#2563EB"/>
  <text x="116" y="331" class="math">Cov(X,Y)=E[(X−μX)(Y−μY)]</text>
  <text x="84" y="365" class="small">同侧偏差贡献正；异侧偏差贡献负</text>
  <text x="84" y="388" class="small">相关系数再除以 σXσY，去除单位与正尺度</text>

  <text x="438" y="88" class="head">B　零协方差仍可强依赖</text>
  <line x1="468" y1="287" x2="744" y2="287" stroke="#64748B"/><line x1="606" y1="308" x2="606" y2="116" stroke="#64748B"/>
  <path d="M486 155Q606 336 726 155" fill="none" stroke="#E11D48" stroke-width="3"/>
  <circle cx="510" cy="190" r="7" fill="#E11D48"/><circle cx="555" cy="251" r="7" fill="#E11D48"/><circle cx="606" cy="287" r="7" fill="#E11D48"/><circle cx="657" cy="251" r="7" fill="#E11D48"/><circle cx="702" cy="190" r="7" fill="#E11D48"/>
  <text x="490" y="331" class="math">X symmetric, Y=X²</text>
  <text x="490" y="360" class="math">Cov(X,Y)=E[X³]=0</text>
  <text x="455" y="390" class="small">Y 完全由 X 决定；“不相关”绝不等于“一般独立”</text>

  <text x="826" y="88" class="head">C　条件期望是 L² 投影</text>
  <rect x="838" y="117" width="126" height="60" rx="11" class="blue"/><text x="862" y="153" class="math">X ∈ L²</text>
  <path d="M972 147L1020 147" class="line"/>
  <rect x="1030" y="117" width="114" height="60" rx="11" class="green"/><text x="1045" y="153" class="math">E[X|G]</text>
  <rect x="853" y="218" width="276" height="70" rx="12" class="violet"/><text x="875" y="247" class="txt">所有只使用信息 G 的预测器</text><text x="916" y="272" class="math">Z ∈ L²(G)</text>
  <path d="M1086 186L1086 210" class="line"/>
  <text x="842" y="327" class="math">E[(X−E[X|G])Z]=0</text>
  <text x="842" y="357" class="math">argminZ E[(X−Z)²]=E[X|G]</text>
  <text x="842" y="389" class="small">MSE 最优是条件均值；多峰目标会被平均</text>
</svg>
