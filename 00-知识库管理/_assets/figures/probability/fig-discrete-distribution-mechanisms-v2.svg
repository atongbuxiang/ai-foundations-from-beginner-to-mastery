<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">常用离散分布的生成机制</title>
<desc id="desc">同一随机试验序列因记录对象不同产生 Bernoulli、Binomial、Geometric 等分布；无放回与稀有事件极限有不同依赖结构。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">重复二元试验：记录什么</text>
<rect x="55" y="110" width="130" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="120.0" y="143.5" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">Bernoulli(p)</text>
<line x1="120" y1="168" x2="120" y2="220" stroke="#1F2937" stroke-width="2.5"/>
<line x1="120" y1="220" x2="290" y2="220" stroke="#1F2937" stroke-width="2.5"/>
<rect x="55" y="245" width="290" height="55" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="200.0" y="278.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">total successes -&gt; Bin(n,p)</text>
<rect x="55" y="330" width="290" height="55" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="200.0" y="363.5" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">first success -&gt; Geom(p)</text>
<rect x="55" y="415" width="290" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="200.0" y="448.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">rth success -&gt; NegBin(r,p)</text>
<text x="45" y="500" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">固定次数与等待时间是不同随机变量。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">多类别与有限总体</text>
<rect x="445" y="110" width="135" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="512.5" y="145.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">Categorical(pi)</text>
<rect x="620" y="110" width="135" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="687.5" y="145.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">Multinomial(n,pi)</text>
<line x1="583" y1="139" x2="615" y2="139" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<text x="600" y="105" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">n iid</text>
<rect x="445" y="260" width="135" height="58" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="512.5" y="295.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">population N,K</text>
<rect x="620" y="260" width="135" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="687.5" y="295.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">Hypergeom</text>
<line x1="583" y1="289" x2="615" y2="289" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<text x="600" y="255" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">without replacement</text>
<text x="430" y="405" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937">无放回制造负相关，不能假装每次独立。</text>
<text x="430" y="445" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">类别计数向量之和固定为 n。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Poisson 稀有事件极限</text>
<rect x="845" y="110" width="290" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="145.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">X_n ~ Bin(n,p_n)</text>
<line x1="990" y1="172" x2="990" y2="215" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<text x="990" y="250" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937">n-&gt;∞, p_n-&gt;0, n p_n-&gt;lambda</text>
<rect x="845" y="285" width="290" height="60" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="321.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">X ~ Poisson(lambda)</text>
<text x="990" y="385" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2937">E[X]=Var(X)=lambda</text>
<text x="830" y="440" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">“n 大”不够；总均值必须保持有限。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">分布名不是关键词匹配：先写随机机制、支持集、依赖与记录对象。</text>
</svg>