<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Invariant 不等于已从初值混合</text>
<rect x="55" y="105" width="100" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="105.0" y="136.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">nu_0</text>
<rect x="190" y="105" width="100" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="240.0" y="136.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">nu_t</text>
<rect x="55" y="235" width="100" height="50" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="105.0" y="266.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">pi</text>
<rect x="190" y="235" width="100" height="50" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="240.0" y="266.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">pi</text>
<line x1="158" y1="130" x2="185" y2="130" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<text x="172" y="112" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">K^t</text>
<line x1="158" y1="260" x2="185" y2="260" stroke="#C24135" stroke-width="2.4" marker-end="url(#a2)"/>
<text x="172" y="242" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">K</text>
<line x1="240" y1="160" x2="240" y2="225" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a1)"/>
<text x="250" y="195" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">mixing?</text>
<text x="45" y="340" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">pi K = pi  只说明保持目标</text>
<text x="45" y="382" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">还需 irreducibility、recurrence / drift 等条件。</text>
<text x="45" y="430" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">多峰间不跳转时，局部平稳也会误导。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">自相关把 N 次迭代压成较小 ESS</text>
