<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">样本空间、事件与概率公理</title>
<desc id="desc">概率模型由结果空间、可判定事件族和满足三公理的概率测度共同组成。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">样本空间：互斥且穷尽</text>
<rect x="62" y="120" width="92" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="108.0" y="155.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">HH</text>
<rect x="192" y="120" width="92" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="238.0" y="155.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">HT</text>
<rect x="62" y="225" width="92" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="108.0" y="260.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">TH</text>
<rect x="192" y="225" width="92" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="238.0" y="260.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">TT</text>
<text x="45" y="355" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937">一次实验恰落入一个 outcome omega。</text>
<text x="45" y="395" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">outcome 是元素；event 是元素集合。</text>
<text x="45" y="435" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">记录粒度不同，可以得到不同但合法的 Omega。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">事件族：观察者拥有的信息</text>
<rect x="445" y="115" width="135" height="66" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="512.5" y="154.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">C_H={HH,HT}</text>
<rect x="620" y="115" width="135" height="66" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="687.5" y="154.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">C_T={TH,TT}</text>
<line x1="512" y1="185" x2="512" y2="235" stroke="#1F2937" stroke-width="2.5"/>
<line x1="687" y1="185" x2="687" y2="235" stroke="#1F2937" stroke-width="2.5"/>
<text x="600" y="270" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937">F={empty, Omega, C_H, C_T}</text>
<text x="430" y="330" font-size="16" font-weight="400" text-anchor="start" fill="#1F2937">若只观察第一次抛掷，HH 与 HT 不可区分。</text>
<text x="430" y="375" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937">sigma-algebra 对补集和可数并封闭。</text>
<text x="430" y="415" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">它也可以理解为可提出并判定的问题集合。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">概率测度：三条一致性</text>
<rect x="840" y="112" width="300" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="149.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">nonnegative: P(A)&gt;=0</text>
<rect x="840" y="214" width="300" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="251.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">normalized: P(Omega)=1</text>
<rect x="840" y="316" width="300" height="62" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="990.0" y="353.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">countably additive on disjoint events</text>
<text x="840" y="440" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">推出补集、容斥、连续性与 union bound。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">完整概率模型是 (Omega, F, P)：先定义结果与可问事件，再进行一致赋值。</text>
</svg>