<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">协方差、相关性与条件期望</title>
<desc id="desc">协方差只测线性共变；零协方差不等于独立；条件期望是给定信息下的 L2 正交投影。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">中心化乘积的平均</text>
<line x1="75" y1="280" x2="350" y2="280" stroke="#D7DEE8" stroke-width="2"/>
<line x1="210" y1="410" x2="210" y2="105" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="110" cy="350" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="140" cy="320" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="275" cy="190" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="310" cy="150" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="120" cy="170" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="295" cy="340" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="45" y="445" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">Cov(X,Y)=E[(X-mu_X)(Y-mu_Y)]</text>
<text x="45" y="480" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">同侧偏差为正，异侧偏差为负。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">零协方差仍可强依赖</text>
<line x1="450" y1="390" x2="760" y2="390" stroke="#D7DEE8" stroke-width="2"/>
<line x1="605" y1="420" x2="605" y2="100" stroke="#D7DEE8" stroke-width="2"/>
<path d="M470 150Q605 390 740 150" fill="none" stroke="#C24135" stroke-width="3"/>
<circle cx="490" cy="218.07500000000002" r="6" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="540" cy="335.075" r="6" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="605" cy="390.0" r="6" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="670" cy="335.075" r="6" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="720" cy="218.07500000000002" r="6" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="600" y="440" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937" class="math">Y=X^2; X symmetric =&gt; Cov(X,Y)=0</text>
<text x="430" y="480" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">Y 完全由 X 决定；不相关不等于独立。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">条件期望是 L2 投影</text>
<line x1="865" y1="380" x2="1125" y2="380" stroke="#D7DEE8" stroke-width="3"/>
<circle cx="930" cy="190" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="930" y1="198" x2="995" y2="380" stroke="#2563EB" stroke-width="3"/>
<line x1="930" y1="190" x2="1060" y2="310" stroke="#C24135" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="995" cy="380" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="925" y="165" font-size="18" font-weight="700" text-anchor="middle" fill="#2563EB">X</text>
<text x="995" y="410" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">E[X|G]</text>
<text x="835" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">E[(X-E[X|G])Z]=0 for every Z in L2(G)</text>
<text x="835" y="490" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">因此它最小化给定信息下的 MSE。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">相关性只回答线性问题；条件期望回答在给定信息下的最佳平方预测问题。</text>
</svg>