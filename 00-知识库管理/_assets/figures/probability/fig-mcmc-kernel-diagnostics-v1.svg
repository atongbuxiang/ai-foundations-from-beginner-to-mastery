<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">MCMC 转移核、相关样本与诊断链</title>
  <desc id="desc">三面板展示目标不变核与 Metropolis-Hastings 接受拒绝、相关链造成有效样本量下降、以及多链 R-hat ESS MCSE 和 HMC divergence 诊断。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ECFDF5"/><stop offset=".52" stop-color="#F8FAFC"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4F46E5"/></marker>
    <style>.title{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F172A}.head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#4F46E5}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#64748B}.label{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.math{font:15px Georgia,"Times New Roman",serif;fill:#0F172A}.card{fill:#fff;stroke:#CBD5E1;stroke-width:1.3}.axis{stroke:#64748B;stroke-width:1.2}.arrow{stroke:#4F46E5;stroke-width:2.2;fill:none;marker-end:url(#arr)}</style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <text x="40" y="38" class="title">MCMC 可信链：正确 invariant kernel → ergodic average → 多链与算法诊断</text>
  <rect x="28" y="58" width="368" height="342" rx="17" class="card"/><rect x="416" y="58" width="368" height="342" rx="17" class="card"/><rect x="804" y="58" width="368" height="342" rx="17" class="card"/>

  <text x="50" y="88" class="head">A　MH：目标比值决定接受流</text>
  <path d="M63 272C92 270 113 251 137 215C160 180 180 159 200 172C222 187 234 238 258 261C278 275 305 274 328 252C344 236 352 220 360 207" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.7"/>
  <circle cx="147" cy="205" r="8" fill="#4F46E5"/><circle cx="284" cy="264" r="8" fill="#F59E0B"/>
  <path d="M158 205C198 180 240 196 276 256" class="arrow"/>
  <path d="M276 270C234 298 193 282 155 216" stroke="#DC2626" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="119" y="190" class="math">x</text><text x="291" y="253" class="math">y</text>
  <text x="69" y="309" class="math">alpha = min(1, target(y)q(x|y) / target(x)q(y|x))</text>
  <text x="69" y="340" class="small">normalizing constant cancels；rejection 留在原状态</text>
  <rect x="68" y="355" width="288" height="27" rx="7" fill="#FEF2F2" stroke="#FCA5A5"/><text x="83" y="373" class="small">invariant 正确，不代表从当前初值已经混合</text>

  <text x="438" y="88" class="head">B　相关 draws：N 不等于有效信息量</text>
  <line x1="447" y1="270" x2="753" y2="270" class="axis"/>
  <path d="M451 229L465 220L479 232L493 224L507 215L521 222L535 211L549 218L563 209L577 214L591 202L605 211L619 205L633 194L647 201L661 189L675 198L689 184L703 193L717 181L731 188L749 174" fill="none" stroke="#4F46E5" stroke-width="2.5"/>
  <text x="452" y="154" class="small">sticky / positively autocorrelated chain</text>
  <g fill="#2563EB"><circle cx="460" cy="300" r="5"/><circle cx="478" cy="300" r="5"/><circle cx="496" cy="300" r="5"/><circle cx="514" cy="300" r="5"/><circle cx="532" cy="300" r="5"/><circle cx="550" cy="300" r="5"/><circle cx="568" cy="300" r="5"/><circle cx="586" cy="300" r="5"/><circle cx="604" cy="300" r="5"/><circle cx="622" cy="300" r="5"/><circle cx="640" cy="300" r="5"/><circle cx="658" cy="300" r="5"/><circle cx="676" cy="300" r="5"/><circle cx="694" cy="300" r="5"/></g>
  <g fill="#16A34A"><circle cx="460" cy="331" r="5"/><circle cx="526" cy="331" r="5"/><circle cx="592" cy="331" r="5"/><circle cx="658" cy="331" r="5"/></g>
  <text x="709" y="305" class="small">N draws</text><text x="709" y="336" class="small">ESS</text>
  <text x="452" y="371" class="math">ESS_f = N / tau_f ; MCSE ~= SD / sqrt(ESS_f)</text>
  <text x="452" y="391" class="small">ESS 对 mean、tail、quantile 等 functional 各不相同</text>

  <text x="826" y="88" class="head">C　诊断：没有单个“收敛证书”</text>
  <path d="M837 145C863 126 885 159 910 139C934 121 955 156 980 137C1004 119 1027 154 1052 134C1077 116 1101 150 1138 127" fill="none" stroke="#2563EB" stroke-width="2"/>
  <path d="M837 177C862 158 886 190 910 170C935 151 958 185 982 166C1006 148 1030 181 1055 162C1080 143 1103 177 1138 154" fill="none" stroke="#16A34A" stroke-width="2"/>
  <path d="M837 210C861 191 884 224 909 202C934 184 957 218 981 199C1005 181 1029 215 1054 195C1079 176 1104 210 1138 188" fill="none" stroke="#A855F7" stroke-width="2"/>
  <text x="838" y="235" class="small">overdispersed multi-chain trace / rank plots</text>
  <rect x="835" y="257" width="97" height="61" rx="10" fill="#EEF2FF" stroke="#818CF8"/><text x="853" y="282" class="math">R-hat</text><text x="848" y="302" class="small">split/rank/fold</text>
  <rect x="949" y="257" width="88" height="61" rx="10" fill="#DCFCE7" stroke="#4ADE80"/><text x="971" y="282" class="math">ESS</text><text x="961" y="302" class="small">bulk / tail</text>
  <rect x="1054" y="257" width="89" height="61" rx="10" fill="#DBEAFE" stroke="#60A5FA"/><text x="1071" y="282" class="math">MCSE</text><text x="1066" y="302" class="small">mean / quantile</text>
  <rect x="835" y="337" width="308" height="40" rx="9" fill="#FEF2F2" stroke="#FCA5A5"/><text x="850" y="356" class="label">HMC: divergence / treedepth / energy</text><text x="850" y="371" class="small">multimodality 与错误 Jacobian 需结构修复</text>
  <text x="836" y="396" class="small">posterior SD 是不确定性；MCSE 是数值积分误差</text>
</svg>
