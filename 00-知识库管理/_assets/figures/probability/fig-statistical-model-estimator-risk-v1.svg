<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">统计模型、估计程序与风险的三层结构</title>
  <desc id="desc">三面板依次展示分布族与真参数、重复抽样产生估计量分布、以及均方误差的偏差方差分解和独立评估。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFF6FF"/><stop offset="0.5" stop-color="#F8FAFC"/><stop offset="1" stop-color="#F0FDF4"/></linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4F46E5"/></marker>
    <style>.title{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F172A}.head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#4F46E5}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#64748B}.label{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.math{font:15px Georgia,"Times New Roman",serif;fill:#0F172A}.card{fill:#fff;stroke:#CBD5E1;stroke-width:1.3}.axis{stroke:#64748B;stroke-width:1.2}.arrow{stroke:#4F46E5;stroke-width:2.2;fill:none;marker-end:url(#arr)}</style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <text x="40" y="38" class="title">统计学习的对象链：模型族 → 重复抽样的估计程序 → 风险与外部评估</text>
  <rect x="28" y="58" width="368" height="342" rx="17" class="card"/><rect x="416" y="58" width="368" height="342" rx="17" class="card"/><rect x="804" y="58" width="368" height="342" rx="17" class="card"/>

  <text x="50" y="88" class="head">A　模型：先声明允许哪些分布</text>
  <line x1="61" y1="260" x2="363" y2="260" class="axis"/>
  <path d="M64 258C104 257 127 238 151 191C176 141 198 123 220 142C242 160 253 215 279 244C300 260 327 260 360 260" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <path d="M64 258C111 258 141 252 166 222C191 192 214 137 242 119C269 102 293 151 310 204C324 243 340 258 360 260" fill="#DBEAFE" fill-opacity=".7" stroke="#2563EB" stroke-width="2.8"/>
  <path d="M64 258C121 258 156 255 191 238C226 220 260 177 290 162C321 147 344 212 360 258" fill="none" stroke="#A78BFA" stroke-width="2"/>
  <line x1="242" y1="112" x2="242" y2="268" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="250" y="118" class="math">theta_0</text><text x="72" y="294" class="math">P = { P_theta : theta in Theta }</text>
  <text x="72" y="326" class="small">参数不是数据；参数化还需可辨识</text>
  <rect x="68" y="345" width="282" height="30" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="83" y="365" class="small">模型错设时，目标可能变成 pseudo-true parameter</text>

  <text x="438" y="88" class="head">B　估计量：重复数据得到一个分布</text>
  <rect x="443" y="111" width="104" height="55" rx="10" fill="#DBEAFE" stroke="#60A5FA"/>
  <text x="458" y="135" class="math">D^(1)</text><text x="458" y="154" class="small">sample 1</text>
  <rect x="443" y="180" width="104" height="55" rx="10" fill="#EDE9FE" stroke="#A78BFA"/>
  <text x="458" y="204" class="math">D^(2)</text><text x="458" y="223" class="small">sample 2</text>
  <rect x="443" y="249" width="104" height="55" rx="10" fill="#DCFCE7" stroke="#4ADE80"/>
  <text x="458" y="273" class="math">D^(r)</text><text x="458" y="292" class="small">sample r</text>
  <path d="M552 138L615 187" class="arrow"/><path d="M552 207L615 207" class="arrow"/><path d="M552 276L615 227" class="arrow"/>
  <rect x="621" y="164" width="130" height="86" rx="12" fill="#EEF2FF" stroke="#818CF8"/>
  <text x="641" y="190" class="math">T(D)</text><text x="641" y="215" class="label">同一规则</text><text x="641" y="236" class="small">不同 estimate</text>
  <circle cx="638" cy="297" r="5" fill="#2563EB"/><circle cx="657" cy="287" r="5" fill="#2563EB"/><circle cx="672" cy="306" r="5" fill="#2563EB"/><circle cx="692" cy="294" r="5" fill="#2563EB"/><circle cx="715" cy="282" r="5" fill="#2563EB"/><circle cx="733" cy="302" r="5" fill="#2563EB"/>
  <line x1="686" y1="271" x2="686" y2="320" stroke="#DC2626" stroke-width="1.7" stroke-dasharray="4 3"/>
  <text x="625" y="344" class="math">sampling distribution of T</text><text x="447" y="375" class="small">还要分开数据随机性与优化器随机性</text>

  <text x="826" y="88" class="head">C　评价：bias、variance 与真正目标</text>
  <rect x="832" y="111" width="312" height="66" rx="12" fill="#EEF2FF" stroke="#818CF8"/>
  <text x="853" y="138" class="math">MSE(T) = Var(T) + Bias(T)^2</text>
  <text x="853" y="160" class="small">恒等式；不是必须选择无偏估计器</text>
  <rect x="834" y="201" width="91" height="65" rx="10" fill="#DBEAFE" stroke="#60A5FA"/><rect x="944" y="201" width="91" height="65" rx="10" fill="#FEF3C7" stroke="#F59E0B"/><rect x="1054" y="201" width="91" height="65" rx="10" fill="#DCFCE7" stroke="#4ADE80"/>
  <text x="854" y="228" class="label">train</text><text x="849" y="249" class="small">拟合参数</text><text x="963" y="228" class="label">valid</text><text x="954" y="249" class="small">选择程序</text><text x="1076" y="228" class="label">test</text><text x="1064" y="249" class="small">一次审计</text>
  <path d="M925 233L940 233" class="arrow"/><path d="M1035 233L1050 233" class="arrow"/>
  <text x="835" y="306" class="math">risk = E[ loss(T(D), target) ]</text>
  <text x="835" y="335" class="small">期望对哪些随机性取？部署分布是否相同？</text>
  <rect x="834" y="352" width="309" height="27" rx="7" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="849" y="370" class="small">重复使用 test 会把选择偏差写进“泛化性能”</text>
</svg>
