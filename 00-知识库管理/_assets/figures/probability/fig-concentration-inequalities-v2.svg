<title id="title">浓缩不等式的假设、Chernoff 优化与有限类代价</title>
<desc id="desc">尾部假设决定可控制的 MGF；Chernoff 对倾斜参数优化；同时控制有限类需用 union bound 支付 log M。</desc>
