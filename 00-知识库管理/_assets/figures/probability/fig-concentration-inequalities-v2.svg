<text x="110" y="185" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">Chebyshev ~1/t^2</text>
<text x="200" y="265" font-size="15" font-weight="400" text-anchor="start" fill="#2563EB">Hoeffding exp(-c t^2)</text>
<text x="165" y="320" font-size="15" font-weight="400" text-anchor="start" fill="#0F766E">Bernstein variance+range</text>
<text x="45" y="455" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">界的曲线不是任意真实分布的尾概率。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Chernoff：优化指数倾斜</text>
<text x="435" y="125" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">P(S&gt;=t) &lt;= exp[-lambda t + psi(lambda)]</text>
