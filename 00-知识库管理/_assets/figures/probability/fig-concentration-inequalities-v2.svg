<text x="599" y="350" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">lambda*</text>
<text x="430" y="455" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">独立性把和的 MGF 化为乘积；最优 lambda 给最强指数。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">固定对象到有限类同时成立</text>
<rect x="840" y="125" width="52" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="866.0" y="155.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">h1</text>
<rect x="912" y="125" width="52" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="938.0" y="155.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">h2</text>
<rect x="984" y="125" width="52" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="1010.0" y="155.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">...</text>
<rect x="1056" y="125" width="52" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="1082.0" y="155.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">hM</text>
<line x1="840" y1="210" x2="1130" y2="210" stroke="#1F2937" stroke-width="2"/>
<text x="985" y="245" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">select after seeing data</text>
<text x="830" y="310" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">fixed h: 2 exp(-2 n eps^2)</text>
<text x="830" y="355" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">all M: union bound -&gt; log M in radius</text>
<text x="830" y="400" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">eps = sqrt(log(2M/delta)/(2n))</text>
<text x="830" y="455" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">选择后不能继续冒充“预先固定”。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">高概率界必须同时声明随机对象、尾部假设、置信水平与是否经过数据依赖选择。</text>
</svg>