<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">多重积分与换元公式</title>
<desc id="desc">多重积分是局部体积加权和；Jacobian determinant 负责局部体积换算；概率密度按同一质量守恒重新计价。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">积分是小体积加权和</text>
<line x1="65" y1="115" x2="65" y2="365" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="103" y1="115" x2="103" y2="365" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="141" y1="115" x2="141" y2="365" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="179" y1="115" x2="179" y2="365" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="217" y1="115" x2="217" y2="365" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="255" y1="115" x2="255" y2="365" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="293" y1="115" x2="293" y2="365" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="331" y1="115" x2="331" y2="365" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="65" y1="115" x2="331" y2="115" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="65" y1="153" x2="331" y2="153" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="65" y1="191" x2="331" y2="191" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="65" y1="229" x2="331" y2="229" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="65" y1="267" x2="331" y2="267" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="65" y1="305" x2="331" y2="305" stroke="#D7DEE8" stroke-width="1.5"/>
<line x1="65" y1="343" x2="331" y2="343" stroke="#D7DEE8" stroke-width="1.5"/>
<path d="M66 315C105 250 160 275 205 205C245 145 290 170 331 220L331 365L66 365Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
<text x="198" y="425" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937" class="math">integral ≈ sum f(xi_k) Delta V_k</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Jacobian 负责局部体积</text>
<path d="M455 145H565V285H455Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
<line x1="585" y1="220" x2="645" y2="220" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<path d="M675 135L765 165L735 315L645 285Z" fill="#ECFDF5" stroke="#0F766E" stroke-width="3"/>
<text x="510" y="335" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">du</text>
<text x="705" y="335" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">dx</text>
<text x="600" y="392" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937" class="math">dx = |det DT(u)| du</text>
<text x="430" y="440" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">det=0 表示局部体积塌缩。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">概率密度与非单射</text>
<text x="835" y="130" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">生成方向 y=T(x):</text>
<text x="835" y="170" font-size="16" font-weight="400" text-anchor="start" fill="#1F2937" class="math">p_Y(y)=p_X(x)/|det DT(x)|</text>
<text x="835" y="230" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB">编码方向 z=f(x):</text>
<text x="835" y="270" font-size="16" font-weight="400" text-anchor="start" fill="#1F2937" class="math">log p_X=log p_Z+log|det J_f|</text>
<rect x="835" y="330" width="310" height="70" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="371.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">non-injective: sum over all preimages</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">换元公式是质量守恒的局部计价规则；双射、支持集、维数与可积性缺一不可。</text>
</svg>