<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">浮点有限网格、运算链与舍入误差累积</title>
<desc id="desc">浮点数在每个 binade 内等距但跨数量级间距增大；输入格式、算术格式、累加格式和输出格式可不同；局部 unit-roundoff 模型只有在正规范围内成立，多步误差还要处理消去、吸收、溢出与下溢。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">有限网格的间距随量级增大</text>
<line x1="50" y1="300" x2="370" y2="300" stroke="#1F2937" stroke-width="2"/>
<line x1="70" y1="270" x2="70" y2="330" stroke="#2563EB" stroke-width="2.5"/>
<line x1="86" y1="282" x2="86" y2="318" stroke="#2563EB" stroke-width="2.5"/>
<line x1="102" y1="282" x2="102" y2="318" stroke="#2563EB" stroke-width="2.5"/>
<line x1="118" y1="282" x2="118" y2="318" stroke="#2563EB" stroke-width="2.5"/>
<line x1="134" y1="270" x2="134" y2="330" stroke="#2563EB" stroke-width="2.5"/>
<line x1="166" y1="282" x2="166" y2="318" stroke="#2563EB" stroke-width="2.5"/>
<line x1="198" y1="282" x2="198" y2="318" stroke="#2563EB" stroke-width="2.5"/>
<line x1="230" y1="270" x2="230" y2="330" stroke="#C24135" stroke-width="2.5"/>
<line x1="294" y1="282" x2="294" y2="318" stroke="#C24135" stroke-width="2.5"/>
<line x1="358" y1="270" x2="358" y2="330" stroke="#C24135" stroke-width="2.5"/>
<text x="45" y="245" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">subnormals</text>
<text x="165" y="245" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">one binade</text>
<text x="280" y="245" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">2x spacing</text>
<text x="45" y="365" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937">ulp(x) scales with exponent</text>
<text x="45" y="405" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">finite bits cannot represent every real number</text>
<text x="45" y="448" font-size="16" font-weight="650" text-anchor="start" fill="#C24135">eps at 1 != unit roundoff u</text>
<text x="45" y="486" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">relative model weakens near zero and exceptions。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">dtype 名称不足以描述执行链</text>
<rect x="425" y="115" width="75" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="462.5" y="148.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">input</text>
<text x="463" y="205" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">FP16</text>
<line x1="502" y1="143" x2="514" y2="143" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="517" y="115" width="75" height="55" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="554.5" y="148.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">op</text>
<text x="555" y="205" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">TF32</text>
<line x1="594" y1="143" x2="606" y2="143" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="609" y="115" width="75" height="55" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="646.5" y="148.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">accum</text>
<text x="647" y="205" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">FP32</text>
<line x1="686" y1="143" x2="698" y2="143" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="701" y="115" width="75" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="738.5" y="148.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">output</text>
<text x="739" y="205" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">cast</text>
<text x="430" y="275" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">same storage dtype can hide different accumulators</text>
<text x="430" y="320" font-size="16" font-weight="650" text-anchor="start" fill="#0F766E">FMA: one final rounding for multiply-add</text>
<line x1="440" y1="360" x2="760" y2="360" stroke="#D7DEE8" stroke-width="2"/>
<text x="430" y="405" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">scale management</text>
<text x="430" y="438" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">loss scaling / stable softmax / overflow checks</text>
<text x="430" y="480" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">parallel reduction order affects bitwise result。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">从一次舍入到算法误差</text>
<rect x="840" y="105" width="300" height="60" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="141.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">fl(a op b)=(a op b)(1+delta)</text>
<line x1="990" y1="168" x2="990" y2="205" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="840" y="218" width="300" height="60" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="254.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">|theta_n| &lt;= gamma_n = n u/(1-n u)</text>
<line x1="990" y1="281" x2="990" y2="318" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="850" y="335" width="90" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="895.0" y="368.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">absorption</text>
<rect x="948" y="335" width="90" height="55" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="993.0" y="368.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">cancellation</text>
<rect x="1046" y="335" width="90" height="55" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="1091.0" y="368.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">over/underflow</text>
<text x="830" y="435" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">gamma_n is worst-case, not typical</text>
<text x="830" y="470" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">validate: reference + scale/order sweeps</text>
<text x="830" y="499" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">higher precision does not fix bad modeling。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">浮点分析必须同时声明表示、运算、累加、异常路径和验收；一个 dtype 标签不是数值合同。</text>
</svg>