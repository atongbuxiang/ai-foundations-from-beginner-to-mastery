<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">最小二乘投影、正规方程条件数平方与算法选择</title>
<desc id="desc">最小二乘将 b 投影到 A 的列空间并使残差正交；形成 A 转置 A 会把奇异值平方并将条件数平方；QR、QRCP 与 SVD 在稳定性、秩诊断、最小范数和成本上承担不同职责。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">解是列空间中的正交投影</text>
<path d="M60 400L345 210" fill="none" stroke="#2563EB" stroke-width="3"/>
<text x="285" y="230" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">range(A)</text>
<circle cx="230" cy="287" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="300" cy="125" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<line x1="230" y1="287" x2="300" y2="125" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<line x1="85" y1="383" x2="230" y2="287" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="310" y="118" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">b</text>
<text x="235" y="310" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">A x*</text>
<text x="265" y="220" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">r=b-Ax*</text>
<path d="M228 270L245 278L237 295" fill="none" stroke="#1F2937" stroke-width="2"/>
<text x="45" y="445" font-size="18" font-weight="700" text-anchor="start" fill="#1F2937" class="math">A^T r = 0</text>
<text x="45" y="478" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">small residual != accurate parameters</text>
<text x="45" y="501" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">when weak directions amplify noise。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三条计算路径保留不同信息</text>
<text x="430" y="98" font-size="17" font-weight="700" text-anchor="start" fill="#C24135">normal equations</text>
<text x="430" y="132" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">A^T A x=A^T b</text>
<text x="430" y="165" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">kappa becomes kappa(A)^2</text>
<line x1="430" y1="188" x2="765" y2="188" stroke="#D7DEE8" stroke-width="2"/>
<text x="430" y="228" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">Householder QR</text>
<text x="430" y="262" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">R x=Q^T b</text>
<text x="430" y="295" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">stable full-rank baseline</text>
<line x1="430" y1="318" x2="765" y2="318" stroke="#D7DEE8" stroke-width="2"/>
<text x="430" y="358" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB">QRCP / SVD</text>
<text x="430" y="392" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">rank-revealing filter</text>
<text x="430" y="425" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">rank + min-norm control</text>
<text x="430" y="488" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">tolerance belongs to the</text>
<text x="430" y="511" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">numerical problem definition。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">算法选择取决于秩与任务</text>
<circle cx="850" cy="100" r="6" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="872" y="104" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">full rank, dense</text>
<text x="872" y="129" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">Householder QR</text>
<circle cx="850" cy="183" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="872" y="187" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">rank uncertain</text>
<text x="872" y="212" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">QRCP / COD</text>
<circle cx="850" cy="266" r="6" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="872" y="270" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">min norm / weak modes</text>
<text x="872" y="295" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">SVD / TSVD / ridge</text>
<circle cx="850" cy="349" r="6" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="872" y="353" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">streaming / sparse</text>
<text x="872" y="378" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">iterative or updating QR</text>
<line x1="830" y1="430" x2="1145" y2="430" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="458" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">verify residual, A^T r, rank</text>
<text x="830" y="481" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">and parameter sensitivity</text>
<text x="830" y="510" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">regularization also changes the target。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">正规方程是正确公式但可能是错误执行路径；稳定求解要同时保护投影、秩和弱方向。</text>
</svg>