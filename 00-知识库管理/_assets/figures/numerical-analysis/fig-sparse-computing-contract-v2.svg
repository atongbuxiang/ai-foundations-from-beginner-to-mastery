<text x="235" y="118" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">COO</text>
<text x="235" y="148" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">(row,col,val) stream</text>
<text x="235" y="202" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">CSR</text>
<text x="235" y="232" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">rowptr + colind + val</text>
<text x="235" y="286" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">CSC</text>
<text x="235" y="316" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">colptr + rowind + val</text>
<line x1="45" y1="365" x2="365" y2="365" stroke="#D7DEE8" stroke-width="2"/>
<text x="45" y="399" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">canonicalize: sort + merge duplicates</text>
<text x="45" y="431" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">explicit zero still costs storage/work</text>
<text x="45" y="476" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">missing entry != numerical zero</text>
<text x="45" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">choose format from operations, not fashion。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">算术少，数据移动仍昂贵</text>
<text x="430" y="105" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">SpMV: y=A x</text>
<text x="430" y="142" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">~ 2 nnz flops</text>
<text x="430" y="176" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">values + indices + irregular x gathers</text>
<rect x="450" y="220" width="275" height="30" rx="0" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<rect x="450" y="220" width="58" height="30" rx="0" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="735" y="242" font-size="15" font-weight="650" text-anchor="end" fill="#1F2937">compute / memory traffic</text>
<text x="430" y="292" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">SpMM can reuse rows and amortize indices</text>
<text x="430" y="329" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">SpGEMM output pattern is data-dependent</text>
<text x="430" y="366" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">block formats help only with real block density</text>
<line x1="430" y1="404" x2="765" y2="404" stroke="#D7DEE8" stroke-width="2"/>
<text x="430" y="438" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">report bytes, bandwidth, padding,</text>
<text x="430" y="461" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">kernel launch and synchronization</text>
<text x="430" y="500" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">not only arithmetic complexity。</text>
