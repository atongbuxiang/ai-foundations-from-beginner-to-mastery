<text x="430" y="325" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937" class="math">U0^T A V0 = B bidiagonal</text>
<text x="430" y="361" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">two-sided orthogonal transforms</text>
<text x="430" y="397" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">then solve the small structured problem</text>
<text x="430" y="450" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">do not explicitly form A^T A</text>
<text x="430" y="486" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">small singular values are weak directions。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">任何路径都回到原矩阵验收</text>
<rect x="840" y="98" width="300" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="133.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">candidate (sigma, u, v)</text>
<line x1="990" y1="159" x2="990" y2="195" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="207" width="300" height="75" rx="10" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990" y="237" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">r_R=A v-sigma u</text>
<text x="990" y="263" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">r_L=A^T u-sigma v</text>
<line x1="990" y1="285" x2="990" y2="321" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="333" width="300" height="72" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="375.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">orthogonality + reconstruction</text>
<text x="830" y="444" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">also report rank tolerance / gap</text>
<text x="830" y="473" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">matvecs, data passes, memory and seeds</text>
<text x="830" y="506" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">independent validation for randomized Q。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">SVD 的数值问题先由交付物分流，再由正交结构计算，最后由双侧 residual 与成本证书验收。</text>
</svg>