<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">先按交付物选择算法</text>
<circle cx="58" cy="102" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="80" y="106" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">all / economy SVD</text>
<text x="80" y="131" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">bidiagonal + QR/DC/Jacobi</text>
<circle cx="58" cy="190" r="6" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="80" y="194" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">top-k triplets</text>
<text x="80" y="219" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">Golub-Kahan / block Krylov</text>
<circle cx="58" cy="278" r="6" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="80" y="282" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">sigma_1 only</text>
<text x="80" y="307" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">alternating power / Lanczos</text>
<circle cx="58" cy="366" r="6" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="80" y="370" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">range Q</text>
<text x="80" y="395" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">randomized finder (p,q)</text>
<line x1="45" y1="445" x2="365" y2="445" stroke="#D7DEE8" stroke-width="2"/>
<text x="45" y="477" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">target, rank, accuracy, passes</text>
<text x="45" y="506" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">belong to the problem contract。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">完整稠密路线保护奇异方向</text>
