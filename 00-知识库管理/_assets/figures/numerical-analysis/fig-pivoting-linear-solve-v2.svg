<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">稳定线性求解的 pivot、growth 与解质量证书</title>
<desc id="desc">可靠线性求解从结构与尺度选择开始，经 pivoted factorization 和 triangular solves 得到候选解，再用真实残差、分量后向误差和条件估计验收；部分选主元的风险受元素增长控制。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">求解器是一条验收流水线</text>
<rect x="55" y="92" width="285" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="197.5" y="123.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">structure</text>
<line x1="198" y1="144" x2="198" y2="168" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="55" y="174" width="285" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="197.5" y="205.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">scale</text>
<line x1="198" y1="226" x2="198" y2="250" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="55" y="256" width="285" height="50" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="197.5" y="287.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">factor</text>
<line x1="198" y1="308" x2="198" y2="332" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="55" y="338" width="285" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="197.5" y="369.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">triangular</text>
<line x1="198" y1="390" x2="198" y2="414" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="55" y="420" width="285" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="197.5" y="451.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">residual</text>
<text x="45" y="502" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">never form A^-1；solve and certify。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">small pivot 与 pivot growth</text>
<rect x="450" y="110" width="125" height="125" rx="0" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<line x1="512" y1="110" x2="512" y2="235" stroke="#D7DEE8" stroke-width="2"/>
<line x1="450" y1="172" x2="575" y2="172" stroke="#D7DEE8" stroke-width="2"/>
<text x="481" y="150" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135">eps</text>
<text x="544" y="150" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937">1</text>
<text x="481" y="212" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937">1</text>
<text x="544" y="212" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937">1</text>
<line x1="590" y1="172" x2="640" y2="172" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<text x="615" y="150" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">swap</text>
<rect x="655" y="110" width="125" height="125" rx="0" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<line x1="717" y1="110" x2="717" y2="235" stroke="#D7DEE8" stroke-width="2"/>
<line x1="655" y1="172" x2="780" y2="172" stroke="#D7DEE8" stroke-width="2"/>
<text x="686" y="150" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">1</text>
<text x="748" y="150" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937">1</text>
<text x="686" y="212" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937">eps</text>
<text x="748" y="212" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937">1</text>
<text x="430" y="290" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">partial pivoting keeps |l_ik| &lt;= 1</text>
<text x="430" y="330" font-size="16" font-weight="650" text-anchor="start" fill="#C24135">but U entries may grow: pivot growth rho</text>
<line x1="430" y1="365" x2="770" y2="365" stroke="#D7DEE8" stroke-width="2"/>
<text x="430" y="407" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">computed factors solve P(A+Delta A)=L U</text>
<text x="430" y="445" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">|Delta A| bounded by u |L||U|</text>
<text x="430" y="487" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">GEPP is usually reliable, not universally safe。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">BERR 与 FERR 回答不同问题</text>
<rect x="840" y="105" width="300" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="140.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">true residual r=b-A x_hat</text>
<line x1="990" y1="166" x2="990" y2="205" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="840" y="218" width="300" height="68" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="258.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">BERR: scaled componentwise residual</text>
<line x1="990" y1="289" x2="990" y2="328" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="840" y="340" width="300" height="68" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="380.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">FERR: condition-informed solution risk</text>
<text x="830" y="452" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">equilibration changes coordinates, not sensitivity</text>
<text x="830" y="485" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">fallback: pivoting / QR / SVD / higher precision</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">稳定求解不是得到一个 x：它必须同时交付分解风险、后向误差和条件解释。</text>
</svg>