<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">误差账本、Jacobian 传播与可信停止准则</title>
<desc id="desc">实际计算包含数据、模型、离散、舍入、迭代和统计误差；Jacobian 只传播局部扰动；停止判断要把真实残差、尺度、条件估计、任务误差和预算同时纳入。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">先建立误差账本</text>
<rect x="45" y="105" width="88" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="89.0" y="137.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">data</text>
<line x1="135" y1="131" x2="151" y2="131" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="155" y="105" width="88" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="199.0" y="137.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">model</text>
<line x1="245" y1="131" x2="261" y2="131" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="265" y="105" width="88" height="52" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="309.0" y="137.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">discretize</text>
<line x1="309" y1="161" x2="309" y2="233" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="45" y="240" width="88" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="89.0" y="272.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">round</text>
<line x1="135" y1="266" x2="151" y2="266" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="155" y="240" width="88" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="199.0" y="272.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">iterate</text>
<line x1="245" y1="266" x2="261" y2="266" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="265" y="240" width="88" height="52" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="309.0" y="272.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">task</text>
<text x="45" y="410" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937">different layers have different units</text>
<text x="45" y="448" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">connect them by models, not direct addition</text>
<text x="45" y="486" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">probability bounds also need confidence levels。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Jacobian 传播方向依赖的扰动</text>
<circle cx="485" cy="280" r="55" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<ellipse cx="690" cy="280" rx="78" ry="145" fill="none" stroke="#0F766E" stroke-width="2.5"/>
<line x1="545" y1="280" x2="605" y2="280" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<line x1="485" y1="280" x2="525" y2="240" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<line x1="690" y1="280" x2="690" y2="160" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<line x1="690" y1="280" x2="745" y2="280" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="430" y="115" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">Delta y approx J_f(x) Delta x</text>
<text x="430" y="440" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">operator norm gives worst local amplification</text>
<text x="430" y="475" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">JVP / VJP estimate actions；do not form inverse。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">停止是一组 gate，不是单阈值</text>
<circle cx="850" cy="98" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="860" y1="98" x2="895" y2="98" stroke="#2563EB" stroke-width="2.5"/>
<text x="905" y="91" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">true residual</text>
<text x="905" y="121" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">recompute, not only recurrence</text>
<line x1="850" y1="110" x2="850" y2="178" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="850" cy="190" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<line x1="860" y1="190" x2="895" y2="190" stroke="#0F766E" stroke-width="2.5"/>
<text x="905" y="183" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">scaled backward error</text>
<text x="905" y="213" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">match allowed perturbations</text>
<line x1="850" y1="202" x2="850" y2="270" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="850" cy="282" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<line x1="860" y1="282" x2="895" y2="282" stroke="#C24135" stroke-width="2.5"/>
<text x="905" y="275" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">condition estimate</text>
<text x="905" y="305" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">translate residual to solution risk</text>
<line x1="850" y1="294" x2="850" y2="362" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="850" cy="374" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="860" y1="374" x2="895" y2="374" stroke="#2563EB" stroke-width="2.5"/>
<text x="905" y="367" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">task + budget</text>
<text x="905" y="397" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">accuracy, time, confidence</text>
<text x="830" y="480" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">stop only when every required gate passes</text>
<text x="830" y="508" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">else continue, rescale, refactor or raise precision。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">可信停止把残差、后向误差、条件估计和任务预算闭合；孤立的 tolerance 没有证书含义。</text>
</svg>