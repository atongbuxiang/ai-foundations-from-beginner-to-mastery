<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">幂法、移位反幂法与 Rayleigh 商迭代的谱过滤</title>
<desc id="desc">幂法用多项式 lambda 的幂放大主模方向；反幂法用一除以 lambda 减 sigma 放大离移位最近的方向；对称单特征值附近的 Rayleigh 商迭代更新移位并具有局部三次角误差收敛，但每步线性求解和 residual 仍需验收。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">幂法按谱比过滤方向</text>
<line x1="55" y1="355" x2="365" y2="355" stroke="#D7DEE8" stroke-width="2"/>
<line x1="85" y1="395" x2="85" y2="100" stroke="#D7DEE8" stroke-width="2"/>
<line x1="125" y1="355" x2="125" y2="125" stroke="#2563EB" stroke-width="18"/>
<text x="125" y="110" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">lambda1</text>
<line x1="205" y1="355" x2="205" y2="205" stroke="#0F766E" stroke-width="18"/>
<text x="205" y="190" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">lambda2</text>
<line x1="285" y1="355" x2="285" y2="280" stroke="#C24135" stroke-width="18"/>
<text x="285" y="265" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">lambda3</text>
<text x="45" y="420" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">coefficient ratio after k steps</text>
<text x="45" y="453" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937" class="math">~ |lambda2/lambda1|^k</text>
<text x="45" y="486" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">fails if target component is zero</text>
<text x="45" y="509" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">or dominant moduli tie。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">shift-invert 把最近特征值变成最大</text>
<line x1="450" y1="270" x2="770" y2="270" stroke="#D7DEE8" stroke-width="2"/>
<text x="455" y="300" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">lambda</text>
<circle cx="500" cy="270" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="500" y1="255" x2="500" y2="285" stroke="#2563EB" stroke-width="2"/>
<circle cx="575" cy="270" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<line x1="575" y1="255" x2="575" y2="285" stroke="#0F766E" stroke-width="2"/>
<circle cx="685" cy="270" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<line x1="685" y1="255" x2="685" y2="285" stroke="#C24135" stroke-width="2"/>
<circle cx="735" cy="270" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="735" y1="255" x2="735" y2="285" stroke="#2563EB" stroke-width="2"/>
<line x1="650" y1="150" x2="650" y2="390" stroke="#C24135" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="650" y="135" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">shift sigma</text>
<line x1="650" y1="410" x2="690" y2="410" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<text x="430" y="110" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">eigenvalues become 1/(lambda_i-sigma)</text>
<text x="430" y="436" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">nearest lambda becomes dominant</text>
<text x="430" y="475" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">solve (A-sigma I)y=x；</text>
<text x="430" y="498" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">never form the inverse。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">RQI 更新 shift，但只局部超快</text>
<rect x="840" y="95" width="300" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="127.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x_k</text>
<line x1="990" y1="149" x2="990" y2="178" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="185" width="300" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="217.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">rho_k=x_k^T A x_k</text>
<line x1="990" y1="239" x2="990" y2="268" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="275" width="300" height="52" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="307.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">solve (A-rho_k I)y=x_k</text>
<line x1="990" y1="329" x2="990" y2="358" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="365" width="300" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="397.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">normalize -&gt; x_(k+1)</text>
<text x="830" y="451" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">symmetric + simple + local</text>
<text x="830" y="474" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">regime: cubic angle convergence</text>
<text x="830" y="503" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">stop by residual；interpret with gap。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">谱迭代的速度由过滤函数与谱间隙决定；可信结果仍由 residual 和求解质量认证。</text>
</svg>