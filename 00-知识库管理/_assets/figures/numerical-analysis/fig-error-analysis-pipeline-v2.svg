<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">前向误差、后向误差、残差与条件放大</title>
<desc id="desc">前向误差比较计算输出与原问题真解；后向误差寻找使计算输出成为精确解的最小邻近输入；线性系统残差经尺度归一化形成后向误差，再由条件数放大为前向误差界。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">在输出量误差，在输入找解释</text>
<line x1="60" y1="170" x2="350" y2="170" stroke="#D7DEE8" stroke-width="2"/>
<line x1="60" y1="365" x2="350" y2="365" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="105" cy="170" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="245" cy="170" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="135" cy="365" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="275" cy="365" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<line x1="105" y1="178" x2="135" y2="357" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<line x1="245" y1="178" x2="275" y2="357" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<line x1="115" y1="170" x2="235" y2="170" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<line x1="145" y1="365" x2="265" y2="365" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<text x="95" y="145" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">data d</text>
<text x="220" y="145" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">nearby d_tilde</text>
<text x="120" y="405" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">true y=f(d)</text>
<text x="245" y="405" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">computed y_hat</text>
<text x="105" y="205" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">backward error</text>
<text x="165" y="345" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">forward error</text>
<text x="45" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">y_hat=f(d_tilde)；distances require declared metrics。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">线性系统的三量关系</text>
<rect x="445" y="105" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="140.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">residual r = b - A x_hat</text>
<line x1="600" y1="166" x2="600" y2="203" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="215" width="310" height="72" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="257.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">backward eta = ||r|| / data scale</text>
<line x1="600" y1="290" x2="600" y2="327" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="340" width="310" height="72" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="382.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">forward error &lt;= kappa(A) * eta</text>
<text x="430" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">small residual + large kappa =&gt; large solution risk</text>
<text x="430" y="489" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">a posteriori bound needs condition estimation。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">perturbation model 定义证书</text>
<text x="830" y="105" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB">normwise</text>
<line x1="830" y1="123" x2="885" y2="123" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<text x="900" y="129" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">||Delta d|| / ||d||</text>
<text x="830" y="205" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">componentwise</text>
<line x1="830" y1="223" x2="885" y2="223" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<text x="900" y="229" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">|Delta d_i| / scale_i</text>
<text x="830" y="305" font-size="17" font-weight="700" text-anchor="start" fill="#C24135">structured</text>
<line x1="830" y1="323" x2="885" y2="323" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="900" y="329" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">d+Delta d stays in model class</text>
<line x1="830" y1="410" x2="1145" y2="410" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="450" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">report: task error + residual/backward error</text>
<text x="830" y="480" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">+ condition indicator + precision configuration</text>
<text x="830" y="507" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">one norm may hide a critical small component。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">残差要先按允许扰动归一化成后向误差，再经匹配的条件数解释为前向误差。</text>
</svg>