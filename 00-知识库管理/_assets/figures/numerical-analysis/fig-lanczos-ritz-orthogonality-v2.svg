<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Lanczos 三项递推、Ritz residual 与有限精度正交性</title>
<desc id="desc">对称矩阵的 Krylov 投影产生小型三对角 T_k；Ritz residual 可由最后一个递推系数廉价计算；浮点中已收敛方向会重新进入递推并产生 ghost Ritz values，因此需要重正交、锁定与重启。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">对称性把长 Arnoldi 化成三项递推</text>
<rect x="45" y="115" width="72" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="81.0" y="146.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">q_(k-1)</text>
<line x1="119" y1="140" x2="131" y2="140" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="135" y="115" width="72" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="171.0" y="146.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">q_k</text>
<line x1="209" y1="140" x2="221" y2="140" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="225" y="115" width="72" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="261.0" y="146.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">A q_k</text>
<line x1="299" y1="140" x2="311" y2="140" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="315" y="115" width="72" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="351.0" y="146.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">q_(k+1)</text>
<text x="45" y="220" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">beta_(k-1) q_(k-1) + alpha_k q_k + beta_k q_(k+1)</text>
<rect x="105" y="285" width="32" height="28" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="143" y="285" width="32" height="28" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="181" y="285" width="32" height="28" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="219" y="285" width="32" height="28" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="257" y="285" width="32" height="28" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="105" y="319" width="32" height="28" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="143" y="319" width="32" height="28" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="181" y="319" width="32" height="28" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="219" y="319" width="32" height="28" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="257" y="319" width="32" height="28" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="105" y="353" width="32" height="28" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="143" y="353" width="32" height="28" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="181" y="353" width="32" height="28" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="219" y="353" width="32" height="28" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="257" y="353" width="32" height="28" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="105" y="387" width="32" height="28" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="143" y="387" width="32" height="28" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="181" y="387" width="32" height="28" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="219" y="387" width="32" height="28" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="257" y="387" width="32" height="28" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="105" y="421" width="32" height="28" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="143" y="421" width="32" height="28" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="181" y="421" width="32" height="28" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="219" y="421" width="32" height="28" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.2"/>
<rect x="257" y="421" width="32" height="28" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.2"/>
<text x="45" y="479" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">T_k = Q_k^T A Q_k</text>
<text x="45" y="502" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">tridiagonal；maintain Q_k^T Q_k ~= I。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Ritz residual 几乎免费</text>
<rect x="445" y="105" width="310" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="139.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">T_k y = theta y</text>
<line x1="600" y1="164" x2="600" y2="205" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="218" width="310" height="65" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="256.5" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">u=Q_k y</text>
<line x1="600" y1="286" x2="600" y2="327" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="445" y="340" width="310" height="72" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="382.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">||A u-theta u|| = |beta_k e_k^T y|</text>
<text x="430" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">extreme Ritz values often converge first</text>
<text x="430" y="487" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">vector accuracy also needs a spectral gap。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">短递推仍需正交性管理</text>
<line x1="850" y1="250" x2="1140" y2="250" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="875" cy="250" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="875" y="220" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">theta</text>
<circle cx="930" cy="250" r="8" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="930" y="192" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">ghost</text>
<circle cx="990" cy="250" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="990" y="220" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">theta</text>
<circle cx="1050" cy="250" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="1050" y="192" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">theta</text>
<circle cx="1110" cy="250" r="8" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="1110" y="220" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">ghost</text>
<text x="830" y="315" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">roundoff breaks Q_k^T Q_k=I</text>
<text x="830" y="352" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">converged directions can re-enter</text>
<text x="830" y="375" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">and create ghost Ritz values</text>
<text x="830" y="410" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">remedies</text>
<text x="830" y="440" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">full/selective reorthogonalization</text>
<text x="830" y="469" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">locking + thick/implicit restart</text>
<text x="830" y="502" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">distinguish lucky/numerical breakdown。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Lanczos 的三项递推只降低每步结构成本；可靠 eigensolver 仍由 residual、gap 和正交性管理组成。</text>
</svg>