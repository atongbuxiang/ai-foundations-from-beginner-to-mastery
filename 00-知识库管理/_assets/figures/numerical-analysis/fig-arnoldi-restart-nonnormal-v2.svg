<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Arnoldi 长递推、Ritz 证书与重启信息保留</title>
<desc id="desc">一般矩阵的 Krylov 正交化产生上 Hessenberg 投影；Ritz residual 可由 Arnoldi 关系廉价计算，但非正规性使小 residual 不等于小特征值误差；可靠实现还需重正交、锁定与保留目标不变子空间信息的重启。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">一般矩阵需要长递推</text>
<text x="45" y="100" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937" class="math">w=A q_j</text>
<circle cx="85" cy="145" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="105" y="150" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">q_1</text>
<line x1="140" y1="145" x2="255" y2="315" stroke="#D7DEE8" stroke-width="1.6"/>
<circle cx="85" cy="195" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="105" y="200" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">q_2</text>
<line x1="140" y1="195" x2="255" y2="315" stroke="#D7DEE8" stroke-width="1.6"/>
<circle cx="85" cy="245" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="105" y="250" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">q_3</text>
<line x1="140" y1="245" x2="255" y2="315" stroke="#D7DEE8" stroke-width="1.6"/>
<circle cx="85" cy="295" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="105" y="300" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">q_4</text>
<line x1="140" y1="295" x2="255" y2="315" stroke="#D7DEE8" stroke-width="1.6"/>
<circle cx="255" cy="315" r="9" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="270" y="320" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">orthogonal remainder</text>
<text x="45" y="360" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">h_ij=q_i^* w； w &lt;- w-q_i h_ij</text>
<rect x="105" y="395" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="143" y="395" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="181" y="395" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="219" y="395" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="257" y="395" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="105" y="419" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="143" y="419" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="181" y="419" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="219" y="419" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="257" y="419" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="105" y="443" width="32" height="19" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="143" y="443" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="181" y="443" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="219" y="443" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="257" y="443" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="105" y="467" width="32" height="19" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="143" y="467" width="32" height="19" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="181" y="467" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="219" y="467" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="257" y="467" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="105" y="491" width="32" height="19" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="143" y="491" width="32" height="19" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="181" y="491" width="32" height="19" rx="0" fill="#FFFEFB" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="219" y="491" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<rect x="257" y="491" width="32" height="19" rx="0" fill="#0F766E" stroke="#D7DEE8" stroke-width="1.1"/>
<text x="45" y="515" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">A Q_k=Q_k H_k+h q_(k+1)e_k^T</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Ritz residual 廉价，解释不廉价</text>
<rect x="445" y="95" width="310" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="129.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">H_k y = theta y</text>
<line x1="600" y1="154" x2="600" y2="195" stroke="#1F2937" stroke-width="2.3" marker-end="url(#a3)"/>
<rect x="445" y="207" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="242.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">u=Q_k y</text>
<line x1="600" y1="268" x2="600" y2="309" stroke="#1F2937" stroke-width="2.3" marker-end="url(#a3)"/>
<rect x="445" y="321" width="310" height="68" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="361.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">||A u-theta u||=|h e_k^T y|</text>
<text x="430" y="425" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">normal A: residual + spectral gap</text>
<text x="430" y="456" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">nonnormal A: also condition / pseudospectrum</text>
<text x="430" y="495" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">small residual certifies an approximate pair,</text>
<text x="430" y="518" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">not automatically a small eigenvalue error。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">正交与重启决定可持续性</text>
<rect x="840" y="95" width="300" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="128.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">expand to dimension m</text>
<line x1="990" y1="153" x2="990" y2="180" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="187" width="300" height="55" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="220.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">check Q^*Q and reorth</text>
<line x1="990" y1="245" x2="990" y2="272" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="279" width="300" height="55" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="312.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">select wanted Schur/Ritz vectors</text>
<line x1="990" y1="337" x2="990" y2="364" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="371" width="300" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="404.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">lock / restart with retained subspace</text>
<text x="830" y="477" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">restart saves memory but can erase filters</text>
<text x="830" y="506" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">report true residual, orthogonality and matvecs。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Arnoldi 的核心产品不是一串 Ritz 值，而是带 residual、正交性与重启语义的投影证书。</text>
</svg>