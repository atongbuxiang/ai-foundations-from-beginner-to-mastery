<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Householder 反射、Givens 旋转与稳定 QR</title>
<desc id="desc">Householder 用一次反射消去整列尾部并通过安全符号避免消去；Givens 用安全缩放的二维旋转消去单个元素；正交变换保持二范数，但实现仍要验收重构残差、正交性和局部参数生成。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Householder 把 x 反射到坐标轴</text>
<line x1="55" y1="380" x2="365" y2="380" stroke="#D7DEE8" stroke-width="2"/>
<line x1="205" y1="420" x2="205" y2="95" stroke="#D7DEE8" stroke-width="2"/>
<line x1="205" y1="380" x2="315" y2="170" stroke="#2563EB" stroke-width="4" marker-end="url(#a0)"/>
<line x1="205" y1="380" x2="205" y2="300" stroke="#0F766E" stroke-width="4" marker-end="url(#a1)"/>
<line x1="90" y1="245" x2="340" y2="355" stroke="#C24135" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="320" y="160" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB">x</text>
<text x="215" y="292" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">+/-||x|| e1</text>
<text x="80" y="225" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">reflecting hyperplane</text>
<text x="45" y="445" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">v = x + sign(x1)||x|| e1</text>
<text x="45" y="480" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">safe sign avoids subtracting near-equal numbers。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Givens 只旋转两个坐标</text>
<circle cx="600" cy="275" r="120" fill="none" stroke="#D7DEE8" stroke-width="2"/>
<line x1="600" y1="275" x2="710" y2="190" stroke="#2563EB" stroke-width="4" marker-end="url(#a0)"/>
<line x1="600" y1="275" x2="740" y2="275" stroke="#0F766E" stroke-width="4" marker-end="url(#a1)"/>
<path d="M660 275A60 60 0 0 0 648 239" fill="none" stroke="#C24135" stroke-width="2.5"/>
<text x="710" y="180" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">(a,b)</text>
<text x="700" y="300" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">(r,0)</text>
<text x="650" y="245" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">theta</text>
<text x="430" y="420" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">[c s; -s c] [a;b] = [r;0]</text>
<text x="430" y="458" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">compute r=hypot(a,b), then c=a/r, s=b/r</text>
<text x="430" y="490" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">scaled hypot avoids overflow and underflow。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">结构选择与 QR 验收</text>
<text x="830" y="108" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB">Householder</text>
<text x="830" y="140" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">dense column tail · block/WY · BLAS-3</text>
<line x1="830" y1="170" x2="1145" y2="170" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="215" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">Givens</text>
<text x="830" y="247" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">sparse entry · updates · bulge chasing</text>
<line x1="830" y1="277" x2="1145" y2="277" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="322" font-size="17" font-weight="700" text-anchor="start" fill="#C24135">verify both</text>
<text x="830" y="354" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">reconstruction: ||A-Q R|| / ||A||</text>
<text x="830" y="388" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">orthogonality: ||I-Q^T Q||</text>
<text x="830" y="440" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">small reconstruction residual alone is insufficient</text>
<text x="830" y="478" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">compact storage: store vectors/rotations, not full Q</text>
<text x="830" y="506" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">communication cost can dominate flops。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">正交变换提供稳定几何，但安全参数生成、结构成本和双重残差验收仍不可省略。</text>
</svg>