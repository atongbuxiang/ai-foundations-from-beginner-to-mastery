<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">随机值域、过采样幂步与独立概率证书</title>
<desc id="desc">随机 SVD 先用独立随机探针捕获近似值域，再在小空间中执行确定性 SVD；过采样降低漏方向尾部风险，幂步用额外数据遍历放大谱隙；另一组独立探针可对投影 residual 建立带失败概率的后验证书。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">两阶段把大问题压到小空间</text>
<rect x="65" y="92" width="270" height="45" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="200.0" y="120.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">Omega</text>
<line x1="200" y1="140" x2="200" y2="159" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="65" y="165" width="270" height="45" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="200.0" y="193.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">Y=A Omega</text>
<line x1="200" y1="213" x2="200" y2="232" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="65" y="238" width="270" height="45" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="200.0" y="266.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">Q=orth(Y)</text>
<line x1="200" y1="286" x2="200" y2="305" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="65" y="311" width="270" height="45" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="200.0" y="339.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">B=Q^T A</text>
<line x1="200" y1="359" x2="200" y2="378" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="65" y="384" width="270" height="45" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="200.0" y="412.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">small SVD</text>
<text x="45" y="478" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">A_k ~= (Q U_tilde_k) Sigma_k V_k^T</text>
<text x="45" y="506" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">range error and truncation error are distinct。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">p 降尾险，q 放大谱隙</text>
<text x="430" y="105" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB">sketch width l=k+p</text>
<text x="430" y="140" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">oversampling p adds insurance directions</text>
<line x1="450" y1="245" x2="765" y2="245" stroke="#D7DEE8" stroke-width="2"/>
<line x1="485" y1="245" x2="485" y2="110" stroke="#2563EB" stroke-width="14"/>
<line x1="502" y1="245" x2="502" y2="170.75" stroke="#0F766E" stroke-width="14"/>
<line x1="543" y1="245" x2="543" y2="140" stroke="#2563EB" stroke-width="14"/>
<line x1="560" y1="245" x2="560" y2="187.25" stroke="#0F766E" stroke-width="14"/>
<line x1="601" y1="245" x2="601" y2="167" stroke="#2563EB" stroke-width="14"/>
<line x1="618" y1="245" x2="618" y2="202.1" stroke="#0F766E" stroke-width="14"/>
<line x1="659" y1="245" x2="659" y2="190" stroke="#2563EB" stroke-width="14"/>
<line x1="676" y1="245" x2="676" y2="214.75" stroke="#0F766E" stroke-width="14"/>
<line x1="717" y1="245" x2="717" y2="207" stroke="#2563EB" stroke-width="14"/>
<line x1="734" y1="245" x2="734" y2="224.1" stroke="#0F766E" stroke-width="14"/>
<text x="430" y="280" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">q=0</text>
<text x="510" y="280" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">q&gt;0: sigma_i^(2q+1)</text>
<text x="430" y="330" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">power steps sharpen slow spectral decay</text>
<text x="430" y="365" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">but add A/A^T passes + rounding risk</text>
<text x="430" y="414" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">reorthogonalize between applications</text>
<text x="430" y="451" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">record p, q, seed and pass budget</text>
<text x="430" y="493" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">expectation != a single-run guarantee。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">独立探针把经验变成证书</text>
<rect x="840" y="95" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="129.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">fresh Gaussian omega_j</text>
<line x1="990" y1="154" x2="990" y2="193" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="205" width="300" height="72" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="247.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">z_j=(I-Q Q^T) A omega_j</text>
<line x1="990" y1="280" x2="990" y2="319" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="331" width="300" height="66" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="370.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">max_j ||z_j|| -&gt; probabilistic bound</text>
<text x="830" y="438" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">validation probes must not train Q</text>
<text x="830" y="470" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">state norm, probe count and failure delta</text>
<text x="830" y="502" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">also evaluate downstream task loss。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">随机低秩算法用 p、q 与数据遍历换取近似质量，并用独立后验探针把单次运行升级为概率证书。</text>
</svg>