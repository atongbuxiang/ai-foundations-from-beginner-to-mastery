<text x="830" y="441" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">verify ||A Q-Q T|| and Q^T Q-I</text>
<text x="830" y="472" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">stable Schur form != accurate</text>
<text x="830" y="495" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">eigenvectors for nonnormal A</text>
<text x="830" y="518" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">report conditioning context。</text>
