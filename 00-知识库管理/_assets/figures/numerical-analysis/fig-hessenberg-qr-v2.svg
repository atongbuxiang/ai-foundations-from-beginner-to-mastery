<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Hessenberg 约化、隐式移位 QR 与 deflation</title>
<desc id="desc">一般稠密矩阵先经双侧 Householder 正交相似约化为上 Hessenberg，再用隐式移位和 bulge chasing 保持带宽，以尺度感知 deflation 收缩活跃块并得到 Schur 形式；后向稳定不消除非正规特征值敏感性。</desc>
