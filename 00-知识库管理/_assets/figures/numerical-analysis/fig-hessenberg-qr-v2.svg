<text x="45" y="335" font-size="18" font-weight="700" text-anchor="start" fill="#1F2937" class="math">Q0^T A Q0 = H</text>
<text x="45" y="375" font-size="16" font-weight="650" text-anchor="start" fill="#0F766E">H is upper Hessenberg</text>
<text x="45" y="414" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">trace, spectrum and 2-norm</text>
<text x="45" y="437" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">are preserved</text>
<text x="45" y="482" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">later QR steps cost O(n^2)。</text>
