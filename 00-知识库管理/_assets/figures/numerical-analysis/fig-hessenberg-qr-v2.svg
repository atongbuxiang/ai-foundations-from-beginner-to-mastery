<text x="430" y="365" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">Francis step: form first column</text>
<text x="430" y="388" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">without explicit QR factors</text>
<text x="430" y="423" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">chase the bulge back to band</text>
<text x="430" y="458" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">implicit Q theorem fixes the step</text>
<text x="430" y="493" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">shift: speed；orthogonality: stability。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
