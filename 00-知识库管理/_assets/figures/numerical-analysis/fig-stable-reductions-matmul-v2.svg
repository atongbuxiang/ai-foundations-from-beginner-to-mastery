<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">稳定求和、补偿点积与混合精度矩阵乘</title>
<desc id="desc">顺序归约的舍入深度随 n 增长，平衡树将深度降为对数；消去使求和与点积本身病态，补偿算法只减少额外舍入；矩阵乘的 storage、multiply、accumulate 与 output precision 必须分别声明。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">归约树决定舍入深度</text>
<rect x="50" y="110" width="38" height="38" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="69.0" y="135.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x1</text>
<line x1="90" y1="129" x2="102" y2="129" stroke="#C24135" stroke-width="2" marker-end="url(#a2)"/>
<rect x="105" y="110" width="38" height="38" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="124.0" y="135.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x2</text>
<line x1="145" y1="129" x2="157" y2="129" stroke="#C24135" stroke-width="2" marker-end="url(#a2)"/>
<rect x="160" y="110" width="38" height="38" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="179.0" y="135.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x3</text>
<line x1="200" y1="129" x2="212" y2="129" stroke="#C24135" stroke-width="2" marker-end="url(#a2)"/>
<rect x="215" y="110" width="38" height="38" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="234.0" y="135.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x4</text>
<line x1="255" y1="129" x2="267" y2="129" stroke="#C24135" stroke-width="2" marker-end="url(#a2)"/>
<rect x="270" y="110" width="38" height="38" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="289.0" y="135.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x5</text>
<text x="45" y="180" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">serial: depth n-1 -&gt; gamma_(n-1)</text>
<rect x="65" y="250" width="42" height="38" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="86.0" y="275.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x1</text>
<rect x="145" y="250" width="42" height="38" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="166.0" y="275.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x2</text>
<rect x="225" y="250" width="42" height="38" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="246.0" y="275.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x3</text>
<rect x="305" y="250" width="42" height="38" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="326.0" y="275.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">x4</text>
<rect x="105" y="330" width="50" height="38" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="130.0" y="355.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">+</text>
<rect x="265" y="330" width="50" height="38" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="290.0" y="355.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">+</text>
<rect x="185" y="410" width="50" height="38" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="210.0" y="435.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">+</text>
<line x1="86" y1="290" x2="125" y2="327" stroke="#1F2937" stroke-width="2"/>
<line x1="166" y1="290" x2="135" y2="327" stroke="#1F2937" stroke-width="2"/>
<line x1="246" y1="290" x2="285" y2="327" stroke="#1F2937" stroke-width="2"/>
<line x1="326" y1="290" x2="295" y2="327" stroke="#1F2937" stroke-width="2"/>
<line x1="130" y1="370" x2="205" y2="407" stroke="#1F2937" stroke-width="2"/>
<line x1="290" y1="370" x2="215" y2="407" stroke="#1F2937" stroke-width="2"/>
<text x="45" y="480" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">pairwise: depth ceil(log2 n)</text>
<text x="45" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">tree shape also affects reproducibility。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">补偿减少算法误差，不消除病态</text>
<line x1="450" y1="300" x2="760" y2="300" stroke="#D7DEE8" stroke-width="2"/>
<line x1="605" y1="105" x2="605" y2="440" stroke="#D7DEE8" stroke-width="2"/>
<line x1="605" y1="300" x2="735" y2="150" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<line x1="605" y1="300" x2="470" y2="420" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<line x1="605" y1="300" x2="630" y2="275" stroke="#0F766E" stroke-width="4" marker-end="url(#a1)"/>
<text x="690" y="140" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">positive terms</text>
<text x="445" y="446" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">negative terms</text>
<text x="635" y="265" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">tiny exact sum</text>
<text x="430" y="185" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">kappa_sum = sum |x_i| / |sum x_i|</text>
<text x="430" y="480" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">Kahan / Neumaier track a lost low-order tail</text>
<text x="430" y="507" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">input quantization already lost cannot be recovered。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">GEMM 是许多点积的精度合同</text>
<text x="830" y="98" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">storage</text>
<line x1="830" y1="115" x2="895" y2="115" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<text x="910" y="121" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">A,B</text>
<text x="830" y="184" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">multiply</text>
<line x1="830" y1="201" x2="895" y2="201" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="910" y="207" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">a_ik b_kj</text>
<text x="830" y="270" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">accumulate</text>
<line x1="830" y1="287" x2="895" y2="287" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<text x="910" y="293" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">sum over k</text>
<text x="830" y="356" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">output</text>
<line x1="830" y1="373" x2="895" y2="373" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<text x="910" y="379" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">cast C</text>
<line x1="830" y1="430" x2="1145" y2="430" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="462" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">|Delta C| &lt;= gamma_k |A| |B|</text>
<text x="830" y="492" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">precision != determinism != reproducibility</text>
<text x="830" y="516" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">report backend + reduction + accumulator。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">稳定内核要同时审计问题条件性、归约结构、补偿机制和实际累加精度。</text>
</svg>