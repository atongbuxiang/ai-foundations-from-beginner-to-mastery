<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">混合精度迭代改进的误差方程、三精度与回退边界</title>
<desc id="desc">高精度残差观测当前误差，低精度因子近似作用逆矩阵得到修正，工作精度更新解；收敛取决于近似逆质量、条件性、残差地板和校正求解器，GMRES-IR 只能扩展而不能消除失败区间。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">反复求解误差方程 A d=r</text>
<rect x="55" y="100" width="285" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="197.5" y="133.5" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">current x_k</text>
<line x1="198" y1="158" x2="198" y2="195" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="55" y="208" width="285" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="197.5" y="245.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">r_k=b-A x_k  (high precision)</text>
<line x1="198" y1="273" x2="198" y2="310" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="55" y="322" width="285" height="62" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="197.5" y="359.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">solve M d_k=r_k  (low factors)</text>
<line x1="198" y1="387" x2="198" y2="424" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="55" y="437" width="285" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="197.5" y="470.5" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">x_(k+1)=x_k+d_k</text>
<path d="M340 465C380 465 380 125 342 125" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a1)"/>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三种精度承担不同职责</text>
<circle cx="460" cy="112" r="22" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="460" y="118" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">u_f</text>
<line x1="485" y1="112" x2="525" y2="112" stroke="#C24135" stroke-width="2.5"/>
<text x="540" y="118" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">factor + correction solve</text>
<circle cx="460" cy="217" r="22" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="460" y="223" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">u</text>
<line x1="485" y1="217" x2="525" y2="217" stroke="#2563EB" stroke-width="2.5"/>
<text x="540" y="223" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">store and update x</text>
<circle cx="460" cy="322" r="22" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="460" y="328" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">u_r</text>
<line x1="485" y1="322" x2="525" y2="322" stroke="#0F766E" stroke-width="2.5"/>
<text x="540" y="328" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">recompute residual</text>
<text x="430" y="420" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937" class="math">typical hierarchy: u_r &lt;= u &lt;= u_f</text>
<text x="430" y="457" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">high-precision residual lowers the observable floor</text>
<text x="430" y="490" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">it cannot repair a useless approximate inverse。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">收敛、停滞与回退合同</text>
<text x="830" y="105" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB">error map</text>
<text x="830" y="138" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">e_(k+1)=(I-M^-1 A)e_k + rounding</text>
<line x1="830" y1="170" x2="1145" y2="170" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="220" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">converging</text>
<text x="945" y="220" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">BERR down + correction down</text>
<text x="830" y="298" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">stagnating</text>
<text x="945" y="298" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">true residual hits precision floor</text>
<text x="830" y="376" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">diverging</text>
<text x="945" y="376" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">poor factors / scaling / condition</text>
<line x1="830" y1="430" x2="1145" y2="430" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="462" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">fallback: GMRES-IR -&gt; refactor -&gt; raise precision</text>
<text x="830" y="493" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">kappa(A) u_f &lt; 1 is useful intuition, not full theorem。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">迭代改进的可信度来自高精度观测、可用近似逆和明确回退，而不是“多迭代几次”。</text>
</svg>