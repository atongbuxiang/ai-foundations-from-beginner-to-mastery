<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">数值线性代数累计门：误差链、求解链与规模链</title>
<desc id="desc">三条轨道把 NUM-01—20 收束为同一研究合同：先问有限精度误差能否解释，再按结构选择并认证求解器，最后同时核算稀疏成本和随机近似误差。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">可靠性链：残差不等于误差</text>
<rect x="55" y="91" width="292" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="201.0" y="121.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">F10,4: fl(1+1e-4)=1</text>
<line x1="201" y1="142" x2="201" y2="167" stroke="#1F2937" stroke-width="2.1" marker-end="url(#a3)"/>
<rect x="55" y="173" width="292" height="48" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="201.0" y="203.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">rho ~= 1e-4</text>
<line x1="201" y1="224" x2="201" y2="249" stroke="#1F2937" stroke-width="2.1" marker-end="url(#a3)"/>
<rect x="55" y="255" width="292" height="48" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="201.0" y="285.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">kappa=1e4</text>
<line x1="201" y1="306" x2="201" y2="331" stroke="#1F2937" stroke-width="2.1" marker-end="url(#a3)"/>
<rect x="55" y="337" width="292" height="48" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="201.0" y="367.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">kappa*rho ~= 1</text>
<text x="45" y="445" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">forward error = 0.7071</text>
<text x="45" y="476" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">1% task gate requires rho &lt;= 1e-06</text>
<text x="45" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">证书必须同时写 condition、stability 与 task budget。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">结构链：选法与真残差</text>
<rect x="440" y="99" width="105" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="492" y="133" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">SPD</text>
<text x="565" y="132" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">CG: ||r1||/||r0||=2/29</text>
<rect x="440" y="190" width="105" height="55" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="492" y="224" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">general</text>
<text x="565" y="223" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">GMRES: sqrt2 -&gt; sqrt(2/5) -&gt; 0</text>
<rect x="440" y="281" width="105" height="55" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="492" y="315" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">stationary</text>
<text x="565" y="314" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">rho=1/2, but transient peak &gt; 1</text>
<rect x="440" y="372" width="105" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="492" y="406" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">precondition</text>
<text x="565" y="405" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">kappa: 52.46 -&gt; 17.94</text>
<line x1="430" y1="461" x2="765" y2="461" stroke="#D7DEE8" stroke-width="2"/>
<text x="430" y="491" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">递推量只用于导航；原算子真 residual 才能验收。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">规模链：成本与随机证书</text>
<text x="830" y="129" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">A dense</text>
<rect x="930" y="112" width="162.0" height="24" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="1115" y="130" font-size="15" font-weight="700" text-anchor="end" fill="#2563EB">72 B</text>
<text x="830" y="194" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">A CSR</text>
<rect x="930" y="177" width="144.0" height="24" rx="2" fill="#0F766E" stroke="#0F766E" stroke-width="0"/>
<text x="1115" y="195" font-size="15" font-weight="700" text-anchor="end" fill="#0F766E">64 B</text>
<text x="830" y="259" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">A^T A CSR</text>
<rect x="930" y="242" width="171.0" height="24" rx="2" fill="#C24135" stroke="#C24135" stroke-width="0"/>
<text x="1115" y="260" font-size="15" font-weight="700" text-anchor="end" fill="#C24135">76 B</text>
<line x1="830" y1="325" x2="1145" y2="325" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="360" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">range error = 0.6255</text>
<text x="830" y="394" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">best rank-2 = 0.4142</text>
<text x="830" y="430" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">p=1: range error=0, truncation error remains</text>
<text x="830" y="467" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">另记 p/q、seed、passes、failure probability。</text>
<text x="830" y="501" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">nnz 与单次随机结果都不是完整证书。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">卷级判断顺序：对象与结构 -&gt; 误差传播 -&gt; 算法与成本 -&gt; 独立证书 -&gt; AI 任务容差。</text>
</svg>