<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Krylov 残差多项式、预条件谱重塑与总成本</title>
<desc id="desc">Krylov 方法从初始残差生成多项式搜索空间，并用不同投影条件选择近似解；预条件通过廉价近似求解重塑谱与几何，但左、右和对称形式有不同 residual 语义，最终应最小化达到原问题真残差的总时间而非单独最小化迭代数。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Krylov 方法选择残差多项式</text>
<rect x="45" y="115" width="60" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="75.0" y="145.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">r0</text>
<line x1="107" y1="139" x2="112" y2="139" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="114" y="115" width="60" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="144.0" y="145.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">A r0</text>
<line x1="176" y1="139" x2="181" y2="139" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="183" y="115" width="60" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="213.0" y="145.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">A^2 r0</text>
<line x1="245" y1="139" x2="250" y2="139" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="252" y="115" width="60" height="48" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="282.0" y="145.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">...</text>
<line x1="314" y1="139" x2="319" y2="139" stroke="#1F2937" stroke-width="1.8" marker-end="url(#a3)"/>
<rect x="321" y="115" width="60" height="48" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="351.0" y="145.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">A^(k-1)r0</text>
<text x="45" y="205" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937" class="math">x_k in x0+K_k(A,r0)</text>
<text x="45" y="245" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937" class="math">r_k=p_k(A)r0,  p_k(0)=1</text>
<text x="45" y="300" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">FOM</text>
<text x="130" y="300" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">r perpendicular K_k</text>
<text x="45" y="358" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">GMRES</text>
<text x="130" y="358" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">minimize ||r||_2</text>
<text x="45" y="416" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">CG / SPD</text>
<text x="130" y="416" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">energy-optimal geometry</text>
<text x="45" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">basis + projection define the method。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">预条件重塑谱，也重写坐标</text>
<text x="430" y="100" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">before</text>
<line x1="485" y1="96" x2="765" y2="96" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="500" cy="96" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="522" cy="96" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="575" cy="96" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="650" cy="96" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="735" cy="96" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="430" y="170" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">after</text>
<line x1="485" y1="166" x2="765" y2="166" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="590" cy="166" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="603" cy="166" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="612" cy="166" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="621" cy="166" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<circle cx="634" cy="166" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="430" y="225" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">left:   M^{-1} A x=M^{-1} b</text>
<text x="430" y="263" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">right:  A M^{-1} y=b； x=M^{-1}y</text>
<text x="430" y="301" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">SPD: use a symmetry-preserving form</text>
<line x1="430" y1="337" x2="765" y2="337" stroke="#D7DEE8" stroke-width="2"/>
<text x="430" y="371" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">cluster / condition may improve</text>
<text x="430" y="407" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">but nonnormality and variable M matter</text>
<text x="430" y="448" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">always recompute r=b-Ax</text>
<text x="430" y="486" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">preconditioned residual has another scale。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">最优目标是真残差总时间</text>
<text x="830" y="115" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">none</text>
<rect x="915" y="97" width="70.0" height="22" rx="0" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<rect x="985.0" y="97" width="21.599999999999998" height="22" rx="0" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="1140" y="115" font-size="15" font-weight="650" text-anchor="end" fill="#1F2937">iter + setup</text>
<text x="830" y="230" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">cheap M</text>
<rect x="915" y="212" width="40.0" height="22" rx="0" fill="#0F766E" stroke="#0F766E" stroke-width="0"/>
<rect x="955.0" y="212" width="45.6" height="22" rx="0" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="1140" y="230" font-size="15" font-weight="650" text-anchor="end" fill="#1F2937">iter + setup</text>
<text x="830" y="345" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">strong M</text>
<rect x="915" y="327" width="20.0" height="22" rx="0" fill="#C24135" stroke="#C24135" stroke-width="0"/>
<rect x="935.0" y="327" width="114.0" height="22" rx="0" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="1140" y="345" font-size="15" font-weight="650" text-anchor="end" fill="#1F2937">iter + setup</text>
<text x="830" y="432" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">total = setup + apply + matvec +</text>
<text x="830" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">orthogonalization + reductions</text>
<text x="830" y="490" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">include memory, communication and reuse。</text>
<text x="830" y="518" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">fewer iterations can still cost more。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">预条件不是抽象地让谱更好，而是在保持原方程验收语义下交换 setup、单步成本与迭代次数。</text>
</svg>