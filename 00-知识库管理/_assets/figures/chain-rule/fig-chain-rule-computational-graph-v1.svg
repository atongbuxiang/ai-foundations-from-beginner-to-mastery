<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">多元链式法则、计算图与深层 Jacobian 乘积</title><desc id="d">三个面板展示函数和导数算子的复合，带分支计算图中的 JVP 前推与 VJP 回拉累加，以及深层乘积与残差 Jacobian。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#dc2626"/></marker><style>.T{font:700 22px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.P{font:700 17px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.B{font:14px -apple-system,"PingFang SC",sans-serif;fill:#334155}.S{font:12px -apple-system,"PingFang SC",sans-serif;fill:#475569}.M{font:italic 15px Georgia,serif;fill:#0f172a}</style></defs><rect width="1200" height="430" rx="18" fill="#f8fafc"/><text x="42" y="38" class="T">链式法则：局部线性映射的复合，在计算图上变成动态规划</text>
<g transform="translate(30 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">A  函数组合与导数组合</text><rect x="24" y="73" width="68" height="49" rx="10" fill="#dbeafe"/><text x="49" y="103" class="B">X</text><rect x="145" y="73" width="68" height="49" rx="10" fill="#dcfce7"/><text x="170" y="103" class="B">Y</text><rect x="266" y="73" width="68" height="49" rx="10" fill="#ffedd5"/><text x="291" y="103" class="B">Z</text><path d="M93 98H142" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><path d="M214 98H263" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="110" y="84" class="M">f</text><text x="231" y="84" class="M">g</text><rect x="24" y="176" width="68" height="49" rx="10" fill="#ede9fe"/><text x="44" y="206" class="M">ẋ∈X</text><rect x="145" y="176" width="68" height="49" rx="10" fill="#ede9fe"/><text x="165" y="206" class="M">ẏ∈Y</text><rect x="266" y="176" width="68" height="49" rx="10" fill="#ede9fe"/><text x="286" y="206" class="M">ż∈Z</text><path d="M93 201H142" stroke="#7c3aed" stroke-width="3" marker-end="url(#a)"/><path d="M214 201H263" stroke="#7c3aed" stroke-width="3" marker-end="url(#a)"/><text x="101" y="188" class="S">Df(x)</text><text x="217" y="188" class="S">Dg(f(x))</text><text x="20" y="270" class="M">D(g∘f)(x) = Dg(f(x)) ∘ Df(x)</text><text x="20" y="299" class="M">Jg∘f = Jg Jf　(p×m)(m×n)</text><text x="20" y="324" class="S">先前推到 Y，再进入外层；形状决定乘法顺序</text></g>
<g transform="translate(420 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">B  分支图：前推 tangent，回拉 cotangent</text><circle cx="50" cy="156" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="44" y="162" class="B">x</text><circle cx="150" cy="99" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="144" y="105" class="B">a</text><circle cx="150" cy="213" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="144" y="219" class="B">b</text><circle cx="257" cy="156" r="24" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text x="251" y="162" class="B">c</text><circle cx="326" cy="156" r="22" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="320" y="162" class="B">L</text><path d="M72 145L128 111M72 167L128 201M174 109L234 145M174 203L234 167M282 156H301" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><path d="M127 124L76 153M127 188L76 160" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#r)"/><text x="27" y="261" class="S">蓝/黑：primal 与 JVP 按拓扑序前推</text><text x="27" y="285" class="S">红虚线：VJP 按逆拓扑序回拉</text><text x="27" y="311" class="M">x̄ = x̄(a) + x̄(b)</text><text x="202" y="311" class="S">fan-out 后必须 +=</text></g>
<g transform="translate(810 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">C  深层乘积、消失/爆炸与残差</text><g transform="translate(22 65)"><rect x="0" y="23" width="44" height="43" rx="8" fill="#dbeafe"/><rect x="65" y="23" width="44" height="43" rx="8" fill="#dbeafe"/><rect x="130" y="23" width="44" height="43" rx="8" fill="#dbeafe"/><rect x="195" y="23" width="44" height="43" rx="8" fill="#dbeafe"/><rect x="260" y="23" width="44" height="43" rx="8" fill="#dbeafe"/><path d="M45 44H62M110 44H127M175 44H192M240 44H257" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="9" y="50" class="S">J₁</text><text x="74" y="50" class="S">J₂</text><text x="139" y="50" class="S">J₃</text><text x="204" y="50" class="S">…</text><text x="269" y="50" class="S">Jᴸ</text></g><text x="20" y="164" class="M">‖JL⋯J₁‖₂ ≤ ∏ₗ ‖Jₗ‖₂</text><rect x="22" y="191" width="126" height="52" rx="9" fill="#ede9fe"/><text x="36" y="214" class="B">持续收缩</text><text x="36" y="233" class="S">可能梯度消失</text><rect x="212" y="191" width="126" height="52" rx="9" fill="#fee2e2"/><text x="226" y="214" class="B">持续放大</text><text x="226" y="233" class="S">可能梯度爆炸</text><path d="M151 217H208" stroke="#94a3b8" stroke-width="2"/><rect x="22" y="270" width="130" height="48" rx="9" fill="#dcfce7"/><text x="38" y="299" class="M">f(x)=x+F(x)</text><text x="177" y="289" class="M">Jf = I + JF</text><text x="177" y="310" class="S">恒等支路有帮助；仍需验收</text></g></svg>
