<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">链式法则、计算图与深层 Jacobian</title>
<desc id="desc">函数复合对应导数算子复合；JVP 前推、VJP 回拉并在分支处累加；深层乘积与残差支路有不同传播结构。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">复合 = 局部算子依次作用</text>
<rect x="55" y="105" width="72" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="91.0" y="136.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">X</text>
<rect x="165" y="105" width="72" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="201.0" y="136.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">Y</text>
<rect x="275" y="105" width="72" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="311.0" y="136.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">Z</text>
<line x1="128" y1="130" x2="160" y2="130" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<line x1="238" y1="130" x2="270" y2="130" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<text x="144" y="112" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937">f</text>
<text x="254" y="112" font-size="17" font-weight="650" text-anchor="middle" fill="#1F2937">g</text>
<rect x="55" y="220" width="72" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="91.0" y="253.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">v</text>
<rect x="165" y="220" width="72" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="201.0" y="253.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">Df(x)v</text>
<rect x="275" y="220" width="100" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="325.0" y="253.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">Dg(y)Df(x)v</text>
<line x1="128" y1="247" x2="160" y2="247" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<line x1="238" y1="247" x2="270" y2="247" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="45" y="335" font-size="18" font-weight="650" text-anchor="start" fill="#1F2937" class="math">D(g o f)(x) = Dg(f(x)) o Df(x)</text>
<text x="45" y="371" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">坐标：J_(gof) = J_g J_f；右侧先作用</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">分支：前推，回拉时相加</text>
<circle cx="470" cy="245" r="24" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="470" y="251" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">x</text>
<circle cx="575" cy="155" r="24" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="575" y="161" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">a</text>
<circle cx="575" cy="335" r="24" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="575" y="341" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">b</text>
<circle cx="690" cy="245" r="24" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="690" y="251" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">c</text>
<circle cx="755" cy="245" r="24" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<text x="755" y="251" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937">L</text>
<line x1="492" y1="245" x2="550" y2="155" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<line x1="492" y1="245" x2="550" y2="335" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<line x1="597" y1="155" x2="665" y2="245" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<line x1="597" y1="335" x2="665" y2="245" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<line x1="712" y1="245" x2="730" y2="245" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<path d="M550 177L493 230" fill="none" stroke="#C24135" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<path d="M550 313L493 260" fill="none" stroke="#C24135" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<text x="435" y="410" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937">fan-out 后：x_bar = x_bar^(a) + x_bar^(b)</text>
<text x="435" y="444" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">反向箭头表示对偶回拉，不表示求逆。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">深层乘积与残差通道</text>
<rect x="830" y="112" width="48" height="44" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="854.0" y="140.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">J1</text>
<line x1="879" y1="134" x2="893" y2="134" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="896" y="112" width="48" height="44" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="920.0" y="140.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">J2</text>
<line x1="945" y1="134" x2="959" y2="134" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="962" y="112" width="48" height="44" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="986.0" y="140.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">J3</text>
<line x1="1011" y1="134" x2="1025" y2="134" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="1028" y="112" width="48" height="44" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="1052.0" y="140.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">...</text>
<line x1="1077" y1="134" x2="1091" y2="134" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="1094" y="112" width="48" height="44" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="1118.0" y="140.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">JL</text>
<text x="830" y="205" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">||JL ... J1|| &lt;= product ||Jl||</text>
<text x="830" y="240" font-size="17" font-weight="400" text-anchor="start" fill="#0F766E">连续收缩 -&gt; 可能消失</text>
<text x="830" y="272" font-size="17" font-weight="400" text-anchor="start" fill="#C24135">连续放大 -&gt; 可能爆炸</text>
<rect x="830" y="330" width="132" height="55" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="896.0" y="363.5" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">x + F(x)</text>
<line x1="968" y1="357" x2="1020" y2="357" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="1035" y="363" font-size="18" font-weight="700" text-anchor="start" fill="#1F2937">J = I + JF</text>
<text x="830" y="430" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">恒等支路提供直接通道；仍不保证全局稳定。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">链式法则决定局部算子如何复合；计算图只是在复用这些作用与累加。</text>
</svg>