<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Itô 积分构造、二阶链式法则与 SDE 数值合同</title>
<desc id="desc">Itô integral 由适应左端点随机和与 L2 等距闭包定义；Brownian 二次变差使 Taylor 二阶项保留并形成 Itô formula；SDE 必须解释为积分方程，数值方法还要区分 strong、weak 与离散梯度目标。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">适应左端点和定义随机积分</text>
<line x1="55" y1="320" x2="365" y2="320" stroke="#D7DEE8" stroke-width="2"/>
<rect x="65" y="250" width="48" height="70" rx="0" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<line x1="113" y1="250" x2="123" y2="250" stroke="#D7DEE8" stroke-width="1"/>
<rect x="123" y="195" width="48" height="125" rx="0" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<line x1="171" y1="195" x2="181" y2="195" stroke="#D7DEE8" stroke-width="1"/>
<rect x="181" y="230" width="48" height="90" rx="0" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<line x1="229" y1="230" x2="239" y2="230" stroke="#D7DEE8" stroke-width="1"/>
<rect x="239" y="165" width="48" height="155" rx="0" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<line x1="287" y1="165" x2="297" y2="165" stroke="#D7DEE8" stroke-width="1"/>
<rect x="297" y="210" width="48" height="110" rx="0" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<line x1="345" y1="210" x2="355" y2="210" stroke="#D7DEE8" stroke-width="1"/>
<text x="45" y="105" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">H_{t_i} known before Delta W_i</text>
<text x="45" y="365" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">sum H_(t_i)(W_(t_i+1)-W_(t_i))</text>
<text x="45" y="405" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">E integral H dW =0</text>
<text x="45" y="438" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">E|integral H dW|^2=E integral |H|^2 dt</text>
<text x="45" y="478" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">isometry extends simple processes in L2</text>
<text x="45" y="508" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">anticipating integrands need other theories。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">二次变差保留 Taylor 二阶项</text>
<rect x="445" y="92" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="127.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">Delta X=a dt+b dW</text>
<line x1="600" y1="153" x2="600" y2="190" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="445" y="202" width="310" height="70" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="243.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">(Delta X)^2=b^2 dt + smaller terms</text>
<line x1="600" y1="275" x2="600" y2="312" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="445" y="324" width="310" height="75" rx="10" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600" y="354" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">df=(f_t+a f_x+1/2 b^2 f_xx)dt</text>
<text x="600" y="380" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">+ b f_x dW</text>
<text x="430" y="440" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">the 1/2 b^2 f_xx term is structural</text>
<text x="430" y="473" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">Ito vs Stratonovich changes the drift</text>
<text x="430" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">do not use an ordinary chain rule。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">SDE 结果要按对象分层验收</text>
<rect x="840" y="88" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="122.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">integral equation + filtration</text>
<line x1="990" y1="147" x2="990" y2="173" stroke="#1F2937" stroke-width="2.1" marker-end="url(#a3)"/>
<rect x="840" y="180" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="214.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">existence / pathwise uniqueness</text>
<line x1="990" y1="239" x2="990" y2="265" stroke="#1F2937" stroke-width="2.1" marker-end="url(#a3)"/>
<rect x="840" y="272" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="306.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">coupled-path EM / Milstein</text>
<line x1="990" y1="331" x2="990" y2="357" stroke="#1F2937" stroke-width="2.1" marker-end="url(#a3)"/>
<rect x="840" y="364" width="300" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="398.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">strong / weak / gradient diagnostics</text>
<text x="830" y="470" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">Delta W~N(0,h), not fixed-variance noise</text>
<text x="830" y="500" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">finite difference validates the same J_h。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">Itô calculus由 adapted random sums 与 quadratic variation 建立；SDE 求解器的路径、分布与梯度误差必须分账。</text>
</svg>