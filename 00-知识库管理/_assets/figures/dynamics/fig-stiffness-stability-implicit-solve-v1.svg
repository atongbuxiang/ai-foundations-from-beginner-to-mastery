<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#24313a}
      .title{font-size:18px;font-weight:700}.sub{font-size:12px;fill:#5d6d78}.label{font-size:13px}.small{font-size:11px;fill:#657681}.math{font-family:Georgia,"Times New Roman",serif;font-size:14px;font-style:italic}.panel{fill:#fff;stroke:#cfd8df;stroke-width:1.4}.inner{fill:#f6f8fa;stroke:#dde4e9}.blue{stroke:#2563eb;fill:none;stroke-width:3}.red{stroke:#e4584f;fill:none;stroke-width:2.5}.green{stroke:#159b78;fill:none;stroke-width:2.5}.axis{stroke:#aab6bf;stroke-width:1}.dash{stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1200" height="430" fill="#f8fafc"/>

  <rect x="20" y="20" width="370" height="390" rx="14" class="panel"/>
  <text x="40" y="52" class="title">A · 刚性：慢现象受快模态限制</text>
  <text x="40" y="73" class="sub">solution of interest is slow; perturbation decays on 1/κ</text>
  <rect x="42" y="92" width="326" height="190" rx="10" class="inner"/>
  <line x1="62" y1="254" x2="350" y2="254" class="axis"/>
  <line x1="62" y1="112" x2="62" y2="254" class="axis"/>
  <path d="M62 136 C125 144, 186 165, 248 185 C290 199, 322 211, 350 220" class="blue"/>
  <path d="M62 238 C73 148, 88 137, 116 143 C181 157, 243 187, 350 220" class="red"/>
  <text x="243" y="178" class="small">slow manifold / target</text>
  <text x="72" y="232" class="small">fast transient</text>
  <line x1="64" y1="266" x2="91" y2="266" stroke="#e4584f" stroke-width="5"/>
  <text x="100" y="270" class="small">explicit h must resolve stability</text>
  <rect x="44" y="302" width="142" height="58" rx="9" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="61" y="326" class="label">Forward Euler</text>
  <text x="61" y="348" class="math">hκ &lt; 2</text>
  <path d="M194 331 L224 331" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="232" y="302" width="134" height="58" rx="9" fill="#ecfdf5" stroke="#34d399"/>
  <text x="250" y="326" class="label">implicit</text>
  <text x="250" y="348" class="math">large stable h</text>
  <text x="48" y="389" class="sub">稳定大步 ≠ 大步已经准确</text>

  <rect x="415" y="20" width="370" height="390" rx="14" class="panel"/>
  <text x="435" y="52" class="title">B · 稳定域是 z=hλ 的几何</text>
  <text x="435" y="73" class="sub">order near z=0; stiff decay asks what happens as z→−∞</text>
  <rect x="437" y="92" width="326" height="190" rx="10" class="inner"/>
  <line x1="455" y1="187" x2="745" y2="187" class="axis"/>
  <line x1="648" y1="106" x2="648" y2="266" class="axis"/>
  <circle cx="600" cy="187" r="48" fill="#fee2e2" stroke="#e4584f" stroke-width="2"/>
  <path d="M648 105 L455 105 L455 269 L648 269 Z" fill="#dbeafe" opacity="0.6"/>
  <line x1="648" y1="105" x2="648" y2="269" stroke="#2563eb" stroke-width="2"/>
  <text x="556" y="139" class="small">Euler disk</text>
  <text x="466" y="119" class="small">A-stable covers Re z ≤ 0</text>
  <text x="650" y="202" class="small">0</text>
  <text x="594" y="202" class="small">−1</text>
  <text x="547" y="202" class="small">−2</text>
  <rect x="438" y="301" width="158" height="65" rx="9" fill="#ecfdf5" stroke="#34d399"/>
  <text x="454" y="325" class="label">Backward Euler</text>
  <text x="454" y="348" class="math">R(z)=1/(1−z) → 0</text>
  <rect x="608" y="301" width="155" height="65" rx="9" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="623" y="325" class="label">trapezoidal</text>
  <text x="623" y="348" class="math">R(z) → −1</text>
  <text x="443" y="389" class="sub">A-stable控制“不爆”；L-stable还压掉极快模态</text>

  <rect x="810" y="20" width="370" height="390" rx="14" class="panel"/>
  <text x="830" y="52" class="title">C · 隐式一步本身是一套求解程序</text>
  <text x="830" y="73" class="sub">time integration + nonlinear solve + linear algebra + gradient</text>
  <rect x="832" y="93" width="326" height="165" rx="10" class="inner"/>
  <rect x="848" y="113" width="86" height="48" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="863" y="134" class="label">residual</text><text x="860" y="151" class="math">G(y⁺)=0</text>
  <path d="M939 137 L965 137" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="973" y="113" width="76" height="48" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="988" y="142" class="label">Newton</text>
  <path d="M1054 137 L1076 137" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1084" y="113" width="58" height="48" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="1097" y="134" class="label">solve</text><text x="1092" y="151" class="small">(I−hJ)δ</text>
  <path d="M1113 170 L1113 195 L1012 195" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="910" y="181" width="102" height="55" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="929" y="203" class="label">reverse solve</text>
  <text x="920" y="222" class="small">(I−hJ)ᵀ μ = λ</text>
  <rect x="834" y="282" width="322" height="83" rx="10" fill="#fff" stroke="#d6dde2"/>
  <text x="850" y="306" class="label">误差与成本必须分账</text>
  <text x="850" y="327" class="small">truncation · nonlinear residual · linear residual</text>
  <text x="850" y="347" class="small">Jacobian/preconditioner refresh · rejection · gradient mismatch</text>
  <text x="838" y="389" class="sub">solver success ≠ algebraic residual充分小 ≠ gradient已验证</text>
</svg>
