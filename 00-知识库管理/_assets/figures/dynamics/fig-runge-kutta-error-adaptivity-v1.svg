<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Runge–Kutta error and adaptivity mechanism</title>
  <desc id="desc">Three panels show local defects accumulating into global error, Runge–Kutta stage sampling inside one step, and adaptive error control separated from continuous and discrete gradient claims.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f97316"/>
    </marker>
    <style>
      .title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .sub{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .body{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .small{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .math{font:italic 13px Georgia,serif;fill:#1e293b}
      .chip{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    </style>
  </defs>
  <rect width="1200" height="430" fill="#f8fafc"/>

  <g>
    <rect x="20" y="20" width="370" height="390" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="40" y="50" class="title">A · 局部缺陷如何成为全局误差</text>
    <text x="40" y="72" class="sub">exact-start defect ≠ accumulated trajectory error</text>
    <rect x="42" y="92" width="326" height="190" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <line x1="62" y1="255" x2="352" y2="255" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="62" y1="255" x2="62" y2="110" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M62 240 C105 228 126 205 158 178 C193 149 226 137 260 118 C291 101 324 105 351 126" fill="none" stroke="#2563eb" stroke-width="3"/>
    <polyline points="62,240 118,218 174,183 230,152 286,129 342,139" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#ef4444">
      <circle cx="62" cy="240" r="4"/><circle cx="118" cy="218" r="4"/><circle cx="174" cy="183" r="4"/>
      <circle cx="230" cy="152" r="4"/><circle cx="286" cy="129" r="4"/><circle cx="342" cy="139" r="4"/>
    </g>
    <line x1="174" y1="183" x2="174" y2="166" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="182" y="170" class="small">one-step defect O(hᵖ⁺¹)</text>
    <text x="68" y="112" class="small" fill="#2563eb">exact flow</text>
    <text x="260" y="151" class="small" fill="#ef4444">computed path</text>
    <rect x="44" y="300" width="92" height="42" rx="9" fill="#fff7ed" stroke="#fdba74"/>
    <text x="90" y="318" class="chip" text-anchor="middle" fill="#c2410c">每步</text>
    <text x="90" y="334" class="math" text-anchor="middle">O(hᵖ⁺¹)</text>
    <line x1="138" y1="321" x2="176" y2="321" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="180" y="300" width="72" height="42" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="216" y="318" class="chip" text-anchor="middle" fill="#1d4ed8">约 1/h 步</text>
    <text x="216" y="334" class="small" text-anchor="middle">fixed T</text>
    <line x1="254" y1="321" x2="290" y2="321" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="294" y="300" width="74" height="42" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="331" y="318" class="chip" text-anchor="middle" fill="#047857">全局</text>
    <text x="331" y="334" class="math" text-anchor="middle">O(hᵖ)</text>
    <text x="54" y="376" class="small">还需 perturbation stability / discrete Grönwall</text>
  </g>

  <g>
    <rect x="415" y="20" width="370" height="390" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="435" y="50" class="title">B · RK：一步内查询多个斜率</text>
    <text x="435" y="72" class="sub">stage states + weights satisfy order conditions</text>
    <rect x="437" y="92" width="326" height="190" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <path d="M460 244 C500 232 520 206 557 180 C590 157 630 141 671 125 C703 112 729 115 747 128" fill="none" stroke="#2563eb" stroke-width="3"/>
    <circle cx="460" cy="244" r="5" fill="#0f172a"/>
    <circle cx="554" cy="182" r="5" fill="#10b981"/>
    <circle cx="610" cy="149" r="5" fill="#f59e0b"/>
    <circle cx="747" cy="128" r="5" fill="#ef4444"/>
    <line x1="460" y1="244" x2="519" y2="206" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
    <line x1="554" y1="182" x2="623" y2="150" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
    <line x1="610" y1="149" x2="704" y2="123" stroke="#ef4444" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
    <text x="466" y="230" class="math">k₁</text>
    <text x="530" y="171" class="math">k₂</text>
    <text x="617" y="143" class="math">k₃</text>
    <text x="724" y="153" class="math">k₄</text>
    <text x="460" y="266" class="small">stages sample the unknown in-step curve</text>
    <rect x="438" y="300" width="145" height="76" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="451" y="321" class="body">general RK</text>
    <text x="451" y="342" class="math">ki = f(t+ci h,</text>
    <text x="451" y="360" class="math">y+h Σj aij kj)</text>
    <rect x="598" y="300" width="165" height="76" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="612" y="321" class="body">weighted update</text>
    <text x="612" y="343" class="math">ynew = y+h Σi bi ki</text>
    <text x="612" y="363" class="small">Σ bi=1, Σ bi ci=1/2, …</text>
  </g>

  <g>
    <rect x="810" y="20" width="370" height="390" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="830" y="50" class="title">C · 自适应只控制一层误差</text>
    <text x="830" y="72" class="sub">local estimator → accept/reject → next step</text>
    <rect x="832" y="92" width="326" height="168" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="850" y="112" width="90" height="44" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="895" y="131" class="chip" text-anchor="middle" fill="#1d4ed8">embedded pair</text>
    <text x="895" y="148" class="small" text-anchor="middle">δ = y[p] − y[q]</text>
    <line x1="942" y1="134" x2="972" y2="134" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="976" y="112" width="76" height="44" rx="9" fill="#fff7ed" stroke="#fdba74"/>
    <text x="1014" y="130" class="chip" text-anchor="middle" fill="#c2410c">scaled err</text>
    <text x="1014" y="148" class="small" text-anchor="middle">atol + rtol|y|</text>
    <line x1="1054" y1="134" x2="1084" y2="134" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="1088" y="112" width="52" height="44" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="1114" y="130" class="chip" text-anchor="middle" fill="#047857">≤ 1?</text>
    <text x="1114" y="148" class="small" text-anchor="middle">accept</text>
    <path d="M1114 158 L1114 190 L938 190" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="850" y="174" width="88" height="44" rx="9" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="894" y="193" class="chip" text-anchor="middle" fill="#6d28d9">new h</text>
    <text x="894" y="210" class="small" text-anchor="middle">η·err⁻¹⁄⁽q⁺¹⁾</text>
    <text x="850" y="244" class="small">rejected attempts still cost NFE</text>

    <rect x="832" y="280" width="326" height="98" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="846" y="296" width="92" height="62" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="892" y="316" class="chip" text-anchor="middle" fill="#047857">continuous</text>
    <text x="892" y="334" class="small" text-anchor="middle">ẏ=fθ(t,y)</text>
    <text x="892" y="350" class="small" text-anchor="middle">ideal objective J</text>
    <rect x="950" y="296" width="92" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="996" y="316" class="chip" text-anchor="middle" fill="#1d4ed8">discrete</text>
    <text x="996" y="334" class="small" text-anchor="middle">accepted map Fh</text>
    <text x="996" y="350" class="small" text-anchor="middle">computed Jₕ</text>
    <rect x="1054" y="296" width="90" height="62" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="1099" y="316" class="chip" text-anchor="middle" fill="#c2410c">gradient</text>
    <text x="1099" y="334" class="small" text-anchor="middle">∇J or ∇Jₕ?</text>
    <text x="1099" y="350" class="small" text-anchor="middle">state reuse?</text>
    <text x="845" y="396" class="small">tolerance ≠ global error ≠ task guarantee</text>
  </g>
</svg>
