<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">控制体守恒、三种运输语言与离散/生成边界</title>
<desc id="desc">固定控制体的质量变化等于负净外流加 source；散度定理给局部 continuity PDE，characteristics、pushforward 与 weak form 是同一守恒的不同语言；边界通量、finite-volume flux 与 Flow Matching 边缘速度各有独立合同。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">局部 PDE 来自任意控制体账本</text>
<rect x="105" y="150" width="190" height="190" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="200" y="245" font-size="28" font-weight="700" text-anchor="middle" fill="#2563EB">K</text>
<line x1="65" y1="190" x2="105" y2="190" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<line x1="295" y1="220" x2="345" y2="220" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<line x1="180" y1="105" x2="180" y2="150" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<line x1="235" y1="340" x2="235" y2="390" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<text x="45" y="420" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937" class="math">d/dt integral_K rho</text>
<text x="45" y="450" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">= - integral_boundaryK j dot n + integral_K s</text>
<text x="45" y="486" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">j=rho v -&gt; partial_t rho+div(rho v)=s</text>
<text x="45" y="514" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">outward flux carries a minus sign。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三种语言互相校验</text>
<rect x="445" y="90" width="310" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="123.5" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">particles: Xdot_t=v_t(X_t)</text>
<line x1="600" y1="148" x2="600" y2="181" stroke="#1F2937" stroke-width="2.1" marker-end="url(#a3)"/>
<rect x="445" y="193" width="310" height="62" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="230.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">measures: mu_t=(X_t)_# mu_0</text>
<line x1="600" y1="258" x2="600" y2="291" stroke="#1F2937" stroke-width="2.1" marker-end="url(#a3)"/>
<rect x="445" y="303" width="310" height="65" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="341.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">PDE: partial_t rho+div(rho v)=0</text>
<text x="430" y="405" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">weak: d/dt integral psi dmu</text>
<text x="430" y="434" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">= integral grad psi dot v dmu</text>
<text x="430" y="472" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">weak form includes Dirac measures</text>
<text x="430" y="501" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">density formula needs extra regularity。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">边界、离散与生成语义</text>
<text x="830" y="103" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">boundary</text>
<text x="830" y="134" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">periodic / no-flux / inflow-outflow</text>
<line x1="830" y1="159" x2="1145" y2="159" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="207" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">finite volume</text>
<text x="830" y="238" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">shared face flux =&gt; conservation</text>
<line x1="830" y1="263" x2="1145" y2="263" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="311" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">Flow Matching</text>
<text x="830" y="342" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">conditional fields -&gt; marginal velocity</text>
<text x="830" y="426" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">pointwise residual != global conservation</text>
<text x="830" y="457" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">same density path may admit many velocities</text>
<text x="830" y="488" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">OT adds a kinetic-energy selection</text>
<text x="830" y="516" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">shocks/entropy need conservation-law theory。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">连续性方程是控制体守恒的局部语言；粒子、测度、弱 PDE 与数值通量必须在各自假设下对齐。</text>
</svg>