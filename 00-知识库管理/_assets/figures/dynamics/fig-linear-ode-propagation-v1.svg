<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">线性 ODE 的传播、模态与精确采样</title>
  <desc id="desc">三面板机制图。第一面板用状态转移矩阵表示初值传播和各时刻输入的累积；第二面板区分特征值指数模态、Jordan 多项式因子和非正规瞬态；第三面板把连续状态空间模型在零阶保持下精确离散为递推和卷积，并指出采样混叠。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#059669"/></marker>
    <style>
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#475569}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#64748b}.tiny{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#64748b}.math{font:italic 14px Georgia,"Times New Roman",serif;fill:#334155}.axis{stroke:#94a3b8;stroke-width:1.3}.guide{stroke:#cbd5e1;stroke-width:1.1;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect width="1200" height="430" fill="#f8fafc"/>
  <rect class="panel" x="20" y="20" width="370" height="390" rx="14"/>
  <rect class="panel" x="415" y="20" width="370" height="390" rx="14"/>
  <rect class="panel" x="810" y="20" width="370" height="390" rx="14"/>

  <text class="title" x="40" y="53">A · fundamental matrix 组织传播</text>
  <text class="sub" x="40" y="78">初值和每个时刻的输入使用不同传播时长</text>
  <rect x="48" y="108" width="88" height="58" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="math" x="92" y="142" text-anchor="middle">x(s)</text>
  <line x1="136" y1="137" x2="210" y2="137" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text class="small" x="173" y="124" text-anchor="middle">Φ(t,s)</text>
  <rect x="219" y="108" width="143" height="58" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="math" x="290" y="142" text-anchor="middle">Φ(t,s)x(s)</text>

  <line class="axis" x1="61" y1="250" x2="345" y2="250"/>
  <circle cx="72" cy="250" r="4" fill="#2563eb"/>
  <circle cx="154" cy="250" r="4" fill="#7c3aed"/>
  <circle cx="239" cy="250" r="4" fill="#7c3aed"/>
  <circle cx="338" cy="250" r="5" fill="#059669"/>
  <text class="tiny" x="72" y="270" text-anchor="middle">s</text>
  <text class="tiny" x="154" y="270" text-anchor="middle">τ1</text>
  <text class="tiny" x="239" y="270" text-anchor="middle">τ2</text>
  <text class="tiny" x="338" y="270" text-anchor="middle">t</text>
  <path d="M154 241 Q245 180 332 240" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M239 241 Q286 205 332 240" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text class="small" x="245" y="190" text-anchor="middle">Φ(t,τ)g(τ)dτ</text>
  <rect x="48" y="303" width="314" height="70" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="body" x="205" y="329" text-anchor="middle">x(t) = Φ(t,s)x(s)</text>
  <text class="body" x="205" y="353" text-anchor="middle">+ ∫ Φ(t,τ)g(τ)dτ</text>
  <text class="tiny" x="205" y="394" text-anchor="middle">Φ(t,r)Φ(r,s)=Φ(t,s) · time ordering matters</text>

  <text class="title" x="435" y="53">B · rate、链与几何不可混写</text>
  <text class="sub" x="435" y="78">spectrum 管渐近；Jordan / nonnormality 管有限时间</text>
  <rect x="439" y="105" width="104" height="73" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="small" x="491" y="128" text-anchor="middle">eigenmode</text>
  <text class="math" x="491" y="151" text-anchor="middle">exp(λt)v</text>
  <text class="tiny" x="491" y="169" text-anchor="middle">Re λ = envelope</text>
  <rect x="549" y="105" width="104" height="73" rx="9" fill="#fff7ed" stroke="#fdba74"/>
  <text class="small" x="601" y="128" text-anchor="middle">Jordan chain</text>
  <text class="math" x="601" y="151" text-anchor="middle">t^k exp(λt)</text>
  <text class="tiny" x="601" y="169" text-anchor="middle">polynomial factor</text>
  <rect x="659" y="105" width="104" height="73" rx="9" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text class="small" x="711" y="128" text-anchor="middle">nonnormal</text>
  <text class="math" x="711" y="151" text-anchor="middle">large ||exp(tA)||</text>
  <text class="tiny" x="711" y="169" text-anchor="middle">same eigenvalues</text>

  <line class="axis" x1="451" y1="325" x2="757" y2="325"/>
  <line class="axis" x1="451" y1="205" x2="451" y2="325"/>
  <line class="guide" x1="451" y1="276" x2="757" y2="276"/>
  <path d="M451 220 C500 232 548 260 600 286 C653 310 705 320 757 323" fill="none" stroke="#2563eb" stroke-width="2.8"/>
  <path d="M451 220 C486 180 520 160 558 175 C610 199 650 270 700 305 C725 318 742 322 757 323" fill="none" stroke="#dc2626" stroke-width="2.8"/>
  <text class="small" x="532" y="212">normal decay</text>
  <text class="small" x="635" y="198" fill="#dc2626">transient peak</text>
  <text class="tiny" x="604" y="347" text-anchor="middle">α(A)&lt;0 does not imply monotone Euclidean norm</text>
  <rect x="448" y="365" width="304" height="29" rx="7" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text class="small" x="600" y="385" text-anchor="middle">α(A) · ω(A) · sup ||exp(tA)|| answer different questions</text>

  <text class="title" x="830" y="53">C · continuous SSM → sampled SSM</text>
  <text class="sub" x="830" y="78">ZOH exactness、recurrence–convolution 与 aliasing</text>
  <rect x="837" y="105" width="113" height="73" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="body" x="893" y="132" text-anchor="middle">x' = Ax + Bu</text>
  <text class="small" x="893" y="154" text-anchor="middle">y = Cx + Du</text>
  <line x1="950" y1="141" x2="984" y2="141" stroke="#2563eb" stroke-width="2.3" marker-end="url(#arrow-blue)"/>
  <text class="tiny" x="967" y="126" text-anchor="middle">ZOH</text>
  <rect x="991" y="105" width="165" height="73" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="body" x="1073" y="132" text-anchor="middle">x[k+1]=Abar x[k]</text>
  <text class="body" x="1073" y="154" text-anchor="middle">+ Bbar u[k]</text>

  <rect x="837" y="207" width="319" height="79" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="body" x="996" y="232" text-anchor="middle">Abar = exp(ΔA)</text>
  <text class="body" x="996" y="255" text-anchor="middle">Bbar = ∫ exp(sA)B ds</text>
  <text class="tiny" x="996" y="276" text-anchor="middle">recurrence unrolls to K[l] = C Abar^(l-1) Bbar</text>

  <rect x="837" y="310" width="319" height="80" rx="9" fill="#fff7ed" stroke="#fdba74"/>
  <text class="small" x="996" y="335" text-anchor="middle">sampling aliasing</text>
  <text class="math" x="996" y="358" text-anchor="middle">λ and λ + 2πik/Δ → same μ = exp(Δλ)</text>
  <text class="tiny" x="996" y="378" text-anchor="middle">the continuous generator is not unique without a log branch</text>
</svg>
