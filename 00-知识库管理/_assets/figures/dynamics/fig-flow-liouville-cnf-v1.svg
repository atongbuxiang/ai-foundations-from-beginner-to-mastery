<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">流映射、Liouville 公式与连续正规化流</title>
  <desc id="desc">三面板展示初值经过可微流发生形变，Jacobian 行列式控制体积与密度，以及连续正规化流用增广 ODE 和随机迹估计计算对数密度。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .panel{fill:url(#bg);stroke:#cbd5e1;stroke-width:1.5;rx:18}
      .title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0f172a}
      .label{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#475569}
      .math{font:600 15px Georgia,"Times New Roman",serif;fill:#1e293b}
      .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .thin{stroke:#64748b;stroke-width:1.4;fill:none}
      .blue{stroke:#2563eb;fill:#dbeafe}
      .violet{stroke:#7c3aed;fill:#ede9fe}
      .green{stroke:#059669;fill:#d1fae5}
      .orange{stroke:#ea580c;fill:#ffedd5}
      .code{fill:#111827;stroke:#0f172a;rx:10}
      .codet{font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e2e8f0}
    </style>
  </defs>
  <rect width="1200" height="430" fill="#ffffff"/>

  <rect class="panel" x="20" y="20" width="370" height="390"/>
  <text class="title" x="42" y="54">A　唯一轨迹组成可微流</text>
  <g transform="translate(55 105)">
    <rect x="0" y="0" width="82" height="82" class="blue" stroke-width="2"/>
    <circle cx="20" cy="20" r="3" fill="#2563eb"/><circle cx="62" cy="20" r="3" fill="#2563eb"/>
    <circle cx="20" cy="62" r="3" fill="#2563eb"/><circle cx="62" cy="62" r="3" fill="#2563eb"/>
    <path class="arrow" d="M105 41 C135 10 165 10 194 30"/>
    <path d="M214 2 C273 -10 294 32 285 91 C246 104 205 87 198 46 Z" class="violet" stroke-width="2"/>
    <circle cx="221" cy="25" r="3" fill="#7c3aed"/><circle cx="271" cy="23" r="3" fill="#7c3aed"/>
    <circle cx="218" cy="75" r="3" fill="#7c3aed"/><circle cx="267" cy="77" r="3" fill="#7c3aed"/>
    <text class="math" x="132" y="73">phi(s,t)</text>
  </g>
  <text class="math" x="48" y="231">dJ/dt = D_x f(t,x(t)) J,　J(s)=I</text>
  <text class="math" x="48" y="266">phi(u,t) o phi(s,u) = phi(s,t)</text>
  <rect x="48" y="292" width="312" height="83" class="green" stroke-width="1.5" rx="12"/>
  <text class="label" x="64" y="320">关键条件：存在、唯一、C¹ 初值依赖</text>
  <text class="small" x="64" y="345">单射不自动等于 onto Rᵈ；</text>
  <text class="small" x="64" y="366">全局逆还需要相应的反向延拓。</text>

  <rect class="panel" x="415" y="20" width="370" height="390"/>
  <text class="title" x="437" y="54">B　体积变化与密度补偿</text>
  <g transform="translate(455 91)">
    <rect x="0" y="0" width="78" height="78" class="blue" stroke-width="2"/>
    <path class="arrow" d="M96 39 L151 39"/>
    <path d="M175 4 L290 22 L266 91 L151 73 Z" class="orange" stroke-width="2"/>
    <text class="small" x="4" y="101">dV_s</text>
    <text class="small" x="212" y="112">dV_t = det(J) dV_s</text>
  </g>
  <text class="math" x="440" y="238">det J(s,t) = exp int_s^t div f(r,x(r)) dr</text>
  <text class="math" x="440" y="278">p_t(x_t) det J(s,t) = p_s(x_s)</text>
  <rect x="443" y="303" width="314" height="73" class="violet" stroke-width="1.5" rx="12"/>
  <text class="math" x="461" y="333">d/dt log p_t(x_t) = - div f(t,x_t)</text>
  <text class="small" x="461" y="358">扩大体积 → 降低密度；压缩体积 → 提高密度</text>

  <rect class="panel" x="810" y="20" width="370" height="390"/>
  <text class="title" x="832" y="54">C　CNF：增广状态与随机迹</text>
  <rect class="code" x="838" y="83" width="314" height="105"/>
  <text class="codet" x="857" y="112">x'   = fθ(t, x)</text>
  <text class="codet" x="857" y="141">logp'= - tr(D_x fθ)</text>
  <text class="codet" x="857" y="170">solve [x, logp] together</text>
  <path class="arrow" d="M995 200 L995 241"/>
  <rect x="838" y="253" width="314" height="75" class="green" stroke-width="1.5" rx="12"/>
  <text class="math" x="856" y="278">tr A = E[ eps^T A eps ]</text>
  <text class="math" x="856" y="300">when E[eps eps^T] = I</text>
  <text class="small" x="856" y="321">VJP/JVP 只算矩阵—向量积，不形成完整 Jacobian</text>
  <text class="small" x="839" y="357">总误差账：模型 + 状态离散 + divergence估计</text>
  <text class="small" x="839" y="380">+ log-density积分 + 浮点 + 梯度对象不一致</text>
</svg>
