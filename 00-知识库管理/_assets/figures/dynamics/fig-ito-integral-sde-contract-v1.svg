<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">从适应随机和到 Itô 引理与 SDE 合同</title>
  <desc id="desc">三面板依次表示左端点适应随机和与 Itô 等距、二次变差导致的二阶链式法则，以及随机微分方程从数学对象到数值和人工智能应用的分层合同。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <linearGradient id="bluewash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="greenwash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="430" fill="#ffffff"/>
  <text x="20" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="20" font-weight="700" fill="#0f172a">DYN-10　适应性 → 二次修正 → 可计算的随机动力学</text>

  <rect x="20" y="55" width="370" height="355" rx="18" fill="url(#bluewash)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="42" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="18.5" font-weight="700" fill="#0f172a">A　积分先规定“何时知道什么”</text>
  <line x1="62" y1="176" x2="348" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#0f172a">
    <text x="54" y="201">t₀</text><text x="142" y="201">t₁</text><text x="230" y="201">t₂</text><text x="327" y="201">t₃</text>
  </g>
  <g stroke="#64748b" stroke-width="1.4">
    <line x1="63" y1="168" x2="63" y2="184"/><line x1="151" y1="168" x2="151" y2="184"/>
    <line x1="239" y1="168" x2="239" y2="184"/><line x1="334" y1="168" x2="334" y2="184"/>
  </g>
  <rect x="66" y="126" width="82" height="32" rx="7" fill="#2563eb" opacity="0.9"/>
  <rect x="154" y="126" width="82" height="32" rx="7" fill="#2563eb" opacity="0.72"/>
  <rect x="242" y="126" width="89" height="32" rx="7" fill="#2563eb" opacity="0.54"/>
  <g font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#ffffff" text-anchor="middle">
    <text x="107" y="147">H₀ · ΔW₀</text><text x="195" y="147">H₁ · ΔW₁</text><text x="286" y="147">H₂ · ΔW₂</text>
  </g>
  <text x="54" y="235" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="13.5" fill="#334155">Hᵢ 在 tᵢ 已知；不能偷看 ΔWᵢ</text>
  <rect x="52" y="258" width="306" height="57" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="205" y="281" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="600" fill="#1d4ed8">E[(∫H dW)²] = E[∫H² dt]</text>
  <text x="205" y="302" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="12.7" fill="#475569">Itô 等距把随机积分变成 L² 连续算子</text>
  <text x="54" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="13.2" fill="#0f172a">左端点不是排版习惯，而是因果合同。</text>
  <text x="54" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="12.7" fill="#b91c1c">anticipating integrand 需要另一套积分理论</text>

  <rect x="410" y="55" width="370" height="355" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="432" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="18.5" font-weight="700" fill="#0f172a">B　ΔW² 的总和不会消失</text>
  <rect x="442" y="116" width="306" height="58" rx="11" fill="#ffffff" stroke="#fed7aa"/>
  <text x="595" y="140" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14.5" font-weight="600" fill="#9a3412">Δf ≈ f_t Δt + f_x ΔX + ½ f_xx (ΔX)²</text>
  <text x="595" y="161" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#475569">ΔX = aΔt + bΔW</text>
  <line x1="595" y1="184" x2="595" y2="219" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g font-family="Georgia,'Times New Roman',serif" font-size="13.5" text-anchor="middle">
    <rect x="443" y="229" width="91" height="47" rx="9" fill="#e2e8f0"/><text x="488" y="249" fill="#0f172a">Δt²</text><text x="488" y="267" fill="#64748b">→ 0</text>
    <rect x="550" y="229" width="91" height="47" rx="9" fill="#e2e8f0"/><text x="595" y="249" fill="#0f172a">ΔtΔW</text><text x="595" y="267" fill="#64748b">→ 0</text>
    <rect x="657" y="229" width="91" height="47" rx="9" fill="#fb923c"/><text x="702" y="249" fill="#ffffff">ΔW²</text><text x="702" y="267" fill="#ffffff">→ dt</text>
  </g>
  <rect x="442" y="300" width="306" height="66" rx="10" fill="#ffffff" stroke="#fed7aa"/>
  <text x="595" y="326" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="600" fill="#9a3412">df = (f_t + a f_x + ½ b² f_xx) dt</text>
  <text x="595" y="349" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="600" fill="#9a3412">+ b f_x dW</text>
  <text x="595" y="390" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="12.6" fill="#475569">二阶项是有限累积，不是无穷小代数魔术</text>

  <rect x="800" y="55" width="380" height="355" rx="18" fill="url(#greenwash)" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="822" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="18.5" font-weight="700" fill="#0f172a">C　一个 SDE 声明包含四层对象</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">
    <rect x="834" y="113" width="312" height="47" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="850" y="135" font-size="13.4" font-weight="700" fill="#065f46">1　数学方程</text><text x="958" y="135" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#0f172a">dX = a dt + B dW</text>
    <text x="850" y="151" font-size="11.8" fill="#475569">维数、filtration、初值、Itô/Stratonovich</text>
    <rect x="834" y="170" width="312" height="47" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="850" y="192" font-size="13.4" font-weight="700" fill="#065f46">2　解概念</text><text x="958" y="192" font-size="13" fill="#0f172a">strong / weak；pathwise / law</text>
    <text x="850" y="208" font-size="11.8" fill="#475569">existence、uniqueness、explosion boundary</text>
    <rect x="834" y="227" width="312" height="47" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="850" y="249" font-size="13.4" font-weight="700" fill="#065f46">3　数值对象</text><text x="958" y="249" font-size="13" fill="#0f172a">EM / Milstein / Brownian tree</text>
    <text x="850" y="265" font-size="11.8" fill="#475569">strong、weak、事件与离散梯度误差分别验收</text>
    <rect x="834" y="284" width="312" height="47" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="850" y="306" font-size="13.4" font-weight="700" fill="#065f46">4　AI 声明</text><text x="958" y="306" font-size="13" fill="#0f172a">learned drift/diffusion + solver</text>
    <text x="850" y="322" font-size="11.8" fill="#475569">model error、sampling error、gradient bias 分账</text>
  </g>
  <text x="834" y="362" font-family="Georgia,'Times New Roman',serif" font-size="13.2" font-weight="600" fill="#047857">strong ⇒ same noise path；weak ⇒ test functions</text>
  <text x="834" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="12.6" fill="#475569">边缘分布相近不自动保证路径统计或训练梯度正确</text>
</svg>
