<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">线性 ODE 的传播算子、时间模态与精确采样</title>
<desc id="desc">状态转移矩阵用恒等、复合与逆组织齐次传播，variation of constants 叠加输入响应；特征值、Jordan 与非正规几何分别控制渐近、 polynomial factor 与 transient；零阶保持把连续系统精确映为离散递推但不消除 aliasing。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">状态转移组织初值与输入</text>
<rect x="45" y="92" width="315" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="202.5" y="126.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">x(s)</text>
<line x1="202" y1="151" x2="202" y2="188" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="45" y="200" width="315" height="65" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="202.5" y="238.5" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">Phi(t,s) x(s)</text>
<text x="45" y="302" font-size="15" font-weight="700" text-anchor="start" fill="#1F2937" class="math">Phi(t,r) Phi(r,s)=Phi(t,s)</text>
<text x="45" y="338" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">Phi(s,t)=Phi(t,s)^{-1}</text>
<line x1="45" y1="370" x2="360" y2="370" stroke="#D7DEE8" stroke-width="2"/>
<text x="45" y="402" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">x(t)=Phi(t,s)x(s)+</text>
<text x="45" y="427" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">integral Phi(t,tau) B u(tau) d tau</text>
<text x="45" y="482" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">constant A: Phi=e^{(t-s)A}。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三个谱对象控制不同时间行为</text>
<circle cx="450" cy="100" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="474" y="105" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">Re lambda</text>
<text x="474" y="134" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">exponential tail</text>
<circle cx="450" cy="212" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="474" y="217" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">Jordan chain</text>
<text x="474" y="246" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">t^j e^{lambda t}</text>
<circle cx="450" cy="324" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="474" y="329" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">nonnormal basis</text>
<text x="474" y="358" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">finite-time amplification</text>
<line x1="430" y1="417" x2="765" y2="417" stroke="#D7DEE8" stroke-width="2"/>
<text x="430" y="450" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">spectral abscissa: asymptotic rate</text>
<text x="430" y="479" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">numerical abscissa / resolvent: transient</text>
<text x="430" y="508" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">stable eigenvalues need not mean monotone norm。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">ZOH 精确采样仍有语义边界</text>
<rect x="840" y="92" width="300" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="129.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">continuous: xdot=A x+B u</text>
<line x1="990" y1="157" x2="990" y2="194" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="206" width="300" height="82" rx="10" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990" y="239" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">Abar=e^(Delta A)</text>
<text x="990" y="265" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">Bbar=integral e^(tau A)B d tau</text>
<line x1="990" y1="291" x2="990" y2="328" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="340" width="300" height="62" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="377.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">x_(k+1)=Abar x_k+Bbar u_k</text>
<text x="830" y="444" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">recurrence &lt;-&gt; causal convolution</text>
<text x="830" y="473" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">exact only under the hold assumption</text>
<text x="830" y="502" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">sampling can alias continuous frequencies。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">线性动力学由传播算子统一；谱解释、输入卷积与采样递推各有独立假设和验收边界。</text>
</svg>