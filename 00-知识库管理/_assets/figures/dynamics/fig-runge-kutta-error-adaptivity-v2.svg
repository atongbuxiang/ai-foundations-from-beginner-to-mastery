<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">一步法的 local-to-global 误差、RK stages 与自适应控制</title>
<desc id="desc">一步 exact-start defect 经约一除以 h 个步和离散稳定性放大形成 global error；Runge–Kutta 在单步内组合多个 stage slopes 满足阶条件；embedded estimator 只控制缩放局部误差，接受轨迹、全局误差与训练梯度仍需分别验收。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">局部阶还要经过稳定累积</text>
<rect x="45" y="95" width="315" height="60" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="202.5" y="131.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">one-step defect O(h^(p+1))</text>
<line x1="202" y1="158" x2="202" y2="195" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="45" y="207" width="315" height="65" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="202.5" y="245.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">N ~= (T-t0)/h steps</text>
<line x1="202" y1="275" x2="202" y2="312" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="45" y="324" width="315" height="70" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="202.5" y="365.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">global error O(h^p)</text>
<text x="45" y="430" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">e_(n+1) &lt;= (1+Lh)e_n + C h^(p+1)</text>
<text x="45" y="466" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">discrete Gronwall supplies exp(LT)</text>
<text x="45" y="500" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">consistency without stability is insufficient。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">RK 在同一步内组合 stage slopes</text>
<text x="430" y="100" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">t_n</text>
<line x1="475" y1="96" x2="755" y2="96" stroke="#D7DEE8" stroke-width="2"/>
<text x="748" y="122" font-size="15" font-weight="700" text-anchor="end" fill="#2563EB">t_n+h</text>
<circle cx="505" cy="165" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="505" y="147" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">k1=f(t_n,y_n)</text>
<circle cx="585" cy="240" r="8" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="585" y="222" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">k2</text>
<circle cx="665" cy="300" r="8" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="665" y="282" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">k3</text>
<circle cx="735" cy="360" r="8" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="735" y="342" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">ks</text>
<path d="M470 400 C540 350 625 420 755 315" fill="none" stroke="#1F2937" stroke-width="2.5"/>
<text x="430" y="438" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937" class="math">y_(n+1)=y_n+h sum b_i k_i</text>
<text x="430" y="472" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">order conditions match the flow expansion</text>
<text x="430" y="502" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">more stages trade NFE for accuracy/stability。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">embedded pair 控制一张局部账</text>
<rect x="840" y="92" width="300" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="127.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">shared stages -&gt; high / low updates</text>
<line x1="990" y1="153" x2="990" y2="190" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="202" width="300" height="65" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="240.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">scaled error norm E</text>
<line x1="990" y1="270" x2="990" y2="307" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="319" width="300" height="70" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="360.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">accept/reject； h_new~h E^(-1/(p+1))</text>
<text x="830" y="429" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">atol/rtol define component scales</text>
<text x="830" y="460" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">rejected steps and dense output count</text>
<text x="830" y="490" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">global state / events / gradient are separate</text>
<text x="830" y="516" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">tolerance is not a theorem of task accuracy。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">ODE 求解可信度由 local defect、传播稳定性和自适应账本共同组成；高阶与小 tolerance 都不是全局任务保证。</text>
</svg>