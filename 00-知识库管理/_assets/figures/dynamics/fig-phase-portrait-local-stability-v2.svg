<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">相图对象、二维分类与非线性线性化边界</title>
<desc id="desc">相图必须区分 vector field、nullcline 和 orbit；二维线性平衡点可由 trace、determinant 与 discriminant 分类；非线性 Jacobian 在线性化双曲时给局部结论，零实部时同一 Jacobian 可对应吸引或排斥。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">箭头、零流线与轨道是三种对象</text>
<line x1="55" y1="320" x2="360" y2="320" stroke="#D7DEE8" stroke-width="2"/>
<line x1="200" y1="420" x2="200" y2="95" stroke="#D7DEE8" stroke-width="2"/>
<line x1="85" y1="150" x2="127" y2="175" stroke="#2563EB" stroke-width="2.3" marker-end="url(#a1)"/>
<line x1="100" y1="350" x2="138" y2="320" stroke="#2563EB" stroke-width="2.3" marker-end="url(#a1)"/>
<line x1="255" y1="140" x2="220" y2="172" stroke="#2563EB" stroke-width="2.3" marker-end="url(#a1)"/>
<line x1="300" y1="365" x2="255" y2="345" stroke="#2563EB" stroke-width="2.3" marker-end="url(#a1)"/>
<path d="M75 390 C120 250 160 180 225 205 C290 230 315 285 345 120" fill="none" stroke="#0F766E" stroke-width="3"/>
<path d="M65 245 C150 250 250 270 350 285" fill="7 5" stroke="#C24135" stroke-width="2"/>
<path d="M235 100 C225 200 220 300 215 410" fill="7 5" stroke="#C24135" stroke-width="2"/>
<text x="65" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">blue: vector field</text>
<text x="65" y="480" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">red dashed: nullclines</text>
<text x="65" y="505" font-size="15" font-weight="400" text-anchor="start" fill="#0F766E">green: one oriented orbit。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">trace–determinant 先定线性类型</text>
<line x1="455" y1="330" x2="765" y2="330" stroke="#D7DEE8" stroke-width="2"/>
<line x1="600" y1="440" x2="600" y2="90" stroke="#D7DEE8" stroke-width="2"/>
<text x="745" y="353" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">trace</text>
<text x="608" y="105" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">det</text>
<text x="455" y="380" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">det&lt;0: saddle</text>
<text x="465" y="165" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">trace&lt;0</text>
<text x="465" y="190" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">stable node/focus</text>
<text x="635" y="165" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">trace&gt;0</text>
<text x="635" y="190" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">unstable node/focus</text>
<text x="610" y="295" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">Delta=tr^2-4 det</text>
<text x="610" y="318" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">node vs focus</text>
<text x="430" y="470" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">center / repeated boundary needs care</text>
<text x="430" y="500" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">classification assumes an isolated equilibrium。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Jacobian 只在双曲情形作判决</text>
<rect x="840" y="92" width="300" height="55" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="125.5" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">J*=Df(x*)</text>
<line x1="990" y1="150" x2="990" y2="187" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="199" width="300" height="65" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="237.5" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">all Re lambda&lt;0 -&gt; local exponential</text>
<line x1="990" y1="267" x2="990" y2="304" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="316" width="300" height="65" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="354.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">some Re lambda&gt;0 -&gt; unstable</text>
<text x="830" y="420" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">zero real part: linearization inconclusive</text>
<text x="830" y="452" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">xdot=-x^3 attracts； xdot=+x^3 repels</text>
<text x="830" y="484" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">same J*=0, opposite nonlinear behavior</text>
<text x="830" y="512" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">local type != basin or global portrait。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">相图先分对象，再按线性谱分类；非线性结论只有在定理假设内成立，非双曲边界必须回到高阶项。</text>
</svg>