<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">流映射、Jacobian 体积演化与 CNF 增广状态</title>
<desc id="desc">唯一可微 ODE 流将整片初值搬运到新时间切片；初值 Jacobian 满足变分方程，Jacobi 公式将 log determinant 导数化为 divergence；CNF 同时积分状态和负 divergence 的 log density，并承担 trace 与 solver 误差。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">唯一流把整片状态一致搬运</text>
<circle cx="75" cy="140" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="330" cy="115" r="6" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<path d="M82 140 C155 105 245 165 323 115" fill="none" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="75" cy="220" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="330" cy="205" r="6" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<path d="M82 220 C155 185 245 245 323 205" fill="none" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="75" cy="300" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="330" cy="295" r="6" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<path d="M82 300 C155 265 245 325 323 295" fill="none" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="75" cy="380" r="6" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="330" cy="385" r="6" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<path d="M82 380 C155 345 245 405 323 385" fill="none" stroke="#D7DEE8" stroke-width="2"/>
<text x="45" y="100" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">time s</text>
<text x="315" y="100" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">time t</text>
<text x="45" y="430" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">phi_(s,s)=I</text>
<text x="45" y="458" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">phi_(r,t) o phi_(s,r)=phi_(s,t)</text>
<text x="45" y="491" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">uniqueness =&gt; no crossing / injectivity</text>
<text x="45" y="516" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">surjectivity needs backward completeness。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">变分方程把局部形变压成 divergence</text>
<rect x="445" y="92" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="127.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">Jdot=(D_x f) J； J(s)=I</text>
<line x1="600" y1="153" x2="600" y2="190" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="445" y="202" width="310" height="68" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="242.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">d/dt log det J = tr(D_x f)</text>
<line x1="600" y1="273" x2="600" y2="310" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="445" y="322" width="310" height="68" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="362.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">det J=exp integral div f &gt;0</text>
<text x="430" y="430" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">divergence controls infinitesimal volume</text>
<text x="430" y="462" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">not trajectory norm or asymptotic stability</text>
<text x="430" y="500" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">shape distortion also depends on full J。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">CNF 同时积分状态与 log density</text>
<rect x="840" y="92" width="300" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="129.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">xdot=f_theta(t,x)</text>
<line x1="990" y1="157" x2="990" y2="194" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="206" width="300" height="72" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="990.0" y="248.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">d log p_t(x_t)/dt = -div f_theta</text>
<line x1="990" y1="281" x2="990" y2="318" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<rect x="840" y="330" width="300" height="65" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="990.0" y="368.5" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">trace: exact or Hutchinson JVP/VJP</text>
<text x="830" y="435" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">audit solver + trace + likelihood</text>
<text x="830" y="466" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">fix probe reuse/stop-gradient semantics</text>
<text x="830" y="496" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">finite-step map need not preserve exact flow</text>
<text x="830" y="520" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">support/topology limits remain。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">CNF 密度公式来自可微流的 Jacobian 体积演化；trace 估计、数值积分和训练梯度是额外误差层。</text>
</svg>