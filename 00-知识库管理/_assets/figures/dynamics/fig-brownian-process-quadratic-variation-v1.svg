<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">随机过程、Brownian 路径与二次变差</title>
  <desc id="desc">三面板展示有限维分布和滤过构成过程对象，Brownian 平方增量累计为时间而总变差增长，以及相同逐时边缘可以对应不同时间耦合。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .panel{fill:url(#bg);stroke:#cbd5e1;stroke-width:1.5}.title{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0f172a}.label{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.small{font:500 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#475569}.math{font:600 14px Georgia,"Times New Roman",serif;fill:#1e293b}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:1.6}.green{fill:#d1fae5;stroke:#059669;stroke-width:1.6}.violet{fill:#ede9fe;stroke:#7c3aed;stroke-width:1.6}.orange{fill:#ffedd5;stroke:#ea580c;stroke-width:1.6}.axis{stroke:#94a3b8;stroke-width:1.4}.bm{stroke:#2563eb;stroke-width:2;fill:none}.shared{stroke:#059669;stroke-width:2;fill:none}.indep{stroke:#ea580c;stroke-width:2;fill:none;stroke-dasharray:4 4}.dot{fill:#2563eb}
    </style>
  </defs>
  <rect width="1200" height="430" fill="#fff"/>

  <rect class="panel" x="20" y="20" width="370" height="390" rx="18"/>
  <text class="title" x="42" y="54">A　过程 = 跨时间联合律 + 信息流</text>
  <line class="axis" x1="55" y1="150" x2="355" y2="150"/>
  <circle class="dot" cx="80" cy="150" r="5"/><circle class="dot" cx="165" cy="150" r="5"/><circle class="dot" cx="250" cy="150" r="5"/><circle class="dot" cx="335" cy="150" r="5"/>
  <text class="small" x="70" y="174">t₀</text><text class="small" x="155" y="174">t₁</text><text class="small" x="240" y="174">t₂</text><text class="small" x="325" y="174">t₃</text>
  <rect class="blue" x="48" y="78" width="128" height="48" rx="10"/>
  <text class="label" x="66" y="99">FDD / covariance</text><text class="small" x="62" y="117">joint law across times</text>
  <rect class="violet" x="210" y="78" width="145" height="48" rx="10"/>
  <text class="label" x="231" y="99">filtration  F_t</text><text class="small" x="222" y="117">no future information</text>
  <path class="arrow" d="M175 102 L202 102"/>
  <rect class="green" x="48" y="205" width="307" height="70" rx="12"/>
  <text class="math" x="69" y="232">Cov(W_s, W_t) = min(s,t)</text>
  <text class="math" x="69" y="255">W_t | F_s  ~  N(W_s, t-s)</text>
  <rect class="orange" x="48" y="300" width="307" height="70" rx="12"/>
  <text class="label" x="66" y="326">只给  W_t ~ N(0,t)  仍不够</text>
  <text class="small" x="66" y="350">marginals ≠ transition law ≠ path law</text>

  <rect class="panel" x="415" y="20" width="370" height="390" rx="18"/>
  <text class="title" x="437" y="54">B　增量粗糙，但平方增量可累计</text>
  <line class="axis" x1="454" y1="195" x2="747" y2="195"/>
  <polyline class="bm" points="457,190 475,175 492,205 510,166 527,213 545,185 562,224 580,160 597,204 615,150 632,207 650,171 667,218 685,143 702,188 720,158 742,181"/>
  <text class="small" x="454" y="219">ΔW ~ √Δt：网格越细，差商越不稳定</text>
  <rect class="blue" x="450" y="245" width="142" height="88" rx="12"/>
  <text class="label" x="466" y="270">平方增量</text>
  <text class="math" x="466" y="295">Σ(ΔW)² → T</text>
  <text class="small" x="466" y="316">finite, nonzero</text>
  <rect class="orange" x="610" y="245" width="142" height="88" rx="12"/>
  <text class="label" x="626" y="270">绝对增量</text>
  <text class="math" x="626" y="295">Σ|ΔW| → ∞</text>
  <text class="small" x="626" y="316">infinite variation</text>
  <text class="math" x="482" y="365">(dW)² = dt  是极限规则，不是逐步恒等式</text>

  <rect class="panel" x="810" y="20" width="370" height="390" rx="18"/>
  <text class="title" x="832" y="54">C　同一边缘分布，三种时间耦合</text>
  <line class="axis" x1="850" y1="185" x2="1145" y2="185"/>
  <path class="bm" d="M850 178 C875 157 890 202 915 176 S955 147 980 176 S1025 207 1050 171 S1100 145 1145 181"/>
  <path class="shared" d="M850 185 C930 175 1040 151 1145 123"/>
  <path class="indep" d="M850 126 L872 232 L894 113 L916 207 L938 139 L960 226 L982 118 L1004 201 L1026 131 L1048 218 L1070 109 L1092 206 L1114 127 L1145 222"/>
  <text class="small" x="850" y="244" fill="#2563eb">蓝：Brownian，Var(Δ)=h</text>
  <text class="small" x="850" y="268" fill="#059669">绿：shared ε，Var(Δ)=O(h²)</text>
  <text class="small" x="850" y="292" fill="#ea580c">橙：independent ε_t，Var(Δ)→2t</text>
  <rect class="green" x="840" y="320" width="310" height="60" rx="12"/>
  <text class="label" x="858" y="346">三者每个时刻都可有 N(0,t) 边缘</text>
  <text class="small" x="858" y="367">扩散模型声明必须写 transition / coupling</text>
</svg>
