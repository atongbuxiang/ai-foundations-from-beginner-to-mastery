<text x="1100.0" y="274.0" font-size="11" font-weight="700" text-anchor="middle" fill="#7c3aed">一行 = eᵢᵀ J</text>
<text x="1100.0" y="415.0" font-size="12" font-weight="700" text-anchor="middle" fill="#7c3aed">reverse：3 个输出种子 / 3 次行式回拉</text>
<rect x="938.0" y="447.0" width="324.0" height="58.0" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="1100.0" y="471.0" font-size="12" font-weight="700" text-anchor="middle" fill="#059669">若 F:Rⁿ→R，m=1</text>
<text x="1100.0" y="493.0" font-size="12" font-weight="700" text-anchor="middle" fill="#172033">一次 VJP（种子 1）得到梯度</text>
<text x="690.0" y="555.0" font-size="13" font-weight="700" text-anchor="middle" fill="#172033">Jacobian 是坐标表 · JVP 计算 DF(x)[v] · VJP 计算对偶回拉 · 需要作用时通常不要物化整张表</text>
<text x="690.0" y="578.0" font-size="11" font-weight="500" text-anchor="middle" fill="#5d6978">形成全 J：forward 约按输入维数计，reverse 约按输出维数计；真实成本仍受程序结构、批处理和内存影响</text>
