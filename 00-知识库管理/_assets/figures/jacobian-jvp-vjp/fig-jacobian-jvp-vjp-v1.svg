<text x="183.0" y="305.1" font-size="13" font-weight="650" text-anchor="middle" fill="#172033">1</text>
<rect x="210.0" y="277.0" width="54.0" height="42.0" rx="0" fill="#ffedd5" stroke="#d9e0e8" stroke-width="1.0"/>
<text x="237.0" y="305.1" font-size="13" font-weight="650" text-anchor="middle" fill="#172033">2</text>
<text x="60.0" y="265.0" font-size="16" font-weight="700" text-anchor="start" fill="#172033">J =</text>
<text x="183.0" y="342.0" font-size="12" font-weight="700" text-anchor="middle" fill="#172033">第 j 列 = DF(x)[eⱼ]</text>
<text x="183.0" y="368.0" font-size="11" font-weight="400" text-anchor="middle" fill="#5d6978">完整矩阵依赖输入/输出坐标与布局</text>
<rect x="47.0" y="408.0" width="318.0" height="88.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="63.0" y="435.0" font-size="12" font-weight="700" text-anchor="start" fill="#172033">算子：DF(x)</text>
<text x="63.0" y="460.0" font-size="12" font-weight="700" text-anchor="start" fill="#2563eb">作用：Jv（不必存 J）</text>
<text x="63.0" y="485.0" font-size="12" font-weight="700" text-anchor="start" fill="#7c3aed">表示：J（选基后的 m×n 数组）</text>
<text x="430.0" y="38.0" font-size="19" font-weight="700" text-anchor="start" fill="#172033">B  JVP 向前推切向量，VJP 向后拉协向量</text>
<text x="430.0" y="64.0" font-size="12" font-weight="400" text-anchor="start" fill="#5d6978">两条路径由配对恒等式锁在一起</text>
<rect x="585.0" y="187.0" width="140.0" height="96.0" rx="14" fill="#ffffff" stroke="#172033" stroke-width="2"/>
<text x="655.0" y="225.0" font-size="18" font-weight="700" text-anchor="middle" fill="#172033">A = DF(x)</text>
<text x="655.0" y="255.0" font-size="13" font-weight="600" text-anchor="middle" fill="#5d6978">Rⁿ → Rᵐ</text>
<circle cx="468.0" cy="153.0" r="25.0" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/>
<text x="468.0" y="159.0" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">v</text>
<line x1="497.0" y1="153.0" x2="580.0" y2="207.0" stroke="#2563eb" stroke-width="3" opacity="1.0" marker-end="url(#arrow-blue)"/>
<line x1="730.0" y1="207.0" x2="835.0" y2="153.0" stroke="#2563eb" stroke-width="3" opacity="1.0" marker-end="url(#arrow-blue)"/>
<circle cx="862.0" cy="153.0" r="29.0" fill="#059669" stroke="#ffffff" stroke-width="1.2"/>
<text x="862.0" y="159.0" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">Av</text>
<text x="655.0" y="141.0" font-size="13" font-weight="700" text-anchor="middle" fill="#2563eb">JVP / pushforward</text>
<text x="655.0" y="163.0" font-size="11" font-weight="400" text-anchor="middle" fill="#5d6978">输入切向量 → 输出切向量</text>
<circle cx="862.0" cy="331.0" r="25.0" fill="#7c3aed" stroke="#ffffff" stroke-width="1.2"/>
<text x="862.0" y="337.0" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">u*</text>
<line x1="832.0" y1="331.0" x2="730.0" y2="265.0" stroke="#7c3aed" stroke-width="3" opacity="1.0" marker-end="url(#arrow-purple)"/>
<line x1="580.0" y1="265.0" x2="498.0" y2="331.0" stroke="#7c3aed" stroke-width="3" opacity="1.0" marker-end="url(#arrow-purple)"/>
<circle cx="468.0" cy="331.0" r="30.0" fill="#ea580c" stroke="#ffffff" stroke-width="1.2"/>
<text x="468.0" y="337.0" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">A′u*</text>
<text x="655.0" y="328.0" font-size="13" font-weight="700" text-anchor="middle" fill="#7c3aed">VJP / pullback</text>
<text x="655.0" y="350.0" font-size="11" font-weight="400" text-anchor="middle" fill="#5d6978">输出协向量 → 输入协向量</text>
<rect x="448.0" y="398.0" width="424.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="655.0" y="429.0" font-size="18" font-weight="700" text-anchor="middle" fill="#172033">u*(Av) = (A′u*)(v)</text>
<text x="655.0" y="456.0" font-size="13" font-weight="700" text-anchor="middle" fill="#7c3aed">欧氏坐标：uᵀ(Jv) = (Jᵀu)ᵀv</text>
<text x="655.0" y="481.0" font-size="12" font-weight="650" text-anchor="middle" fill="#5d6978">这是最重要的伴随点积测试</text>
<text x="930.0" y="38.0" font-size="19" font-weight="700" text-anchor="start" fill="#172033">C  完整 Jacobian：按列推，按行拉</text>
