<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="590" viewBox="0 0 1380 590" role="img" aria-labelledby="title desc">
<title id="title">Jacobian、JVP 与 VJP 的对象、方向和成本</title>
<desc id="desc">三个面板展示导数算子在坐标中成为 Jacobian，JVP 推送切向量、VJP 回拉协向量，以及完整 Jacobian 的列式和行式构造成本。</desc>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ea580c"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#059669"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker></defs>
<rect width="1380" height="590" fill="#f8fafc"/>
<text x="35.0" y="38.0" font-size="19" font-weight="700" text-anchor="start" fill="#172033">A  一个导数算子，三种观察方式</text>
<text x="35.0" y="64.0" font-size="12" font-weight="400" text-anchor="start" fill="#5d6978">DF(x): R³ → R²；选基后才写成 J∈R²ˣ³</text>
<rect x="40.0" y="102.0" width="110.0" height="86.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="95.0" y="131.0" font-size="12" font-weight="700" text-anchor="middle" fill="#2563eb">输入扰动</text>
<text x="95.0" y="158.0" font-size="17" font-weight="700" text-anchor="middle" fill="#172033">h ∈ R³</text>
<line x1="155.0" y1="145.0" x2="240.0" y2="145.0" stroke="#2563eb" stroke-width="3" opacity="1.0" marker-end="url(#arrow-blue)"/>
<text x="198.0" y="129.0" font-size="12" font-weight="700" text-anchor="middle" fill="#2563eb">DF(x)</text>
<rect x="245.0" y="102.0" width="110.0" height="86.0" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="300.0" y="131.0" font-size="12" font-weight="700" text-anchor="middle" fill="#059669">输出扰动</text>
<text x="300.0" y="158.0" font-size="17" font-weight="700" text-anchor="middle" fill="#172033">k ∈ R²</text>
<rect x="102.0" y="235.0" width="54.0" height="42.0" rx="0" fill="#dbeafe" stroke="#d9e0e8" stroke-width="1.0"/>
<text x="129.0" y="263.1" font-size="13" font-weight="650" text-anchor="middle" fill="#172033">1</text>
<rect x="156.0" y="235.0" width="54.0" height="42.0" rx="0" fill="#f3e8ff" stroke="#d9e0e8" stroke-width="1.0"/>
<text x="183.0" y="263.1" font-size="13" font-weight="650" text-anchor="middle" fill="#172033">2</text>
<rect x="210.0" y="235.0" width="54.0" height="42.0" rx="0" fill="#ffedd5" stroke="#d9e0e8" stroke-width="1.0"/>
<text x="237.0" y="263.1" font-size="13" font-weight="650" text-anchor="middle" fill="#172033">−1</text>
<rect x="102.0" y="277.0" width="54.0" height="42.0" rx="0" fill="#dbeafe" stroke="#d9e0e8" stroke-width="1.0"/>
<text x="129.0" y="305.1" font-size="13" font-weight="650" text-anchor="middle" fill="#172033">0</text>
