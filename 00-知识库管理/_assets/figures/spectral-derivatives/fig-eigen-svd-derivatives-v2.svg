<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">特征值、特征向量与 SVD 的导数</title>
<desc id="desc">简单谱下标量导数稳定；向量导数含谱间隙分母；重谱时基不唯一，应改比较投影和子空间。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">简单特征值与 gap</text>
<rect x="52" y="105" width="300" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="202.0" y="140.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">A u_i = lambda_i u_i</text>
<text x="55" y="205" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">d lambda_i = u_i^T (dA) u_i</text>
<text x="55" y="250" font-size="17" font-weight="650" text-anchor="start" fill="#C24135" class="math">du_i contains 1/(lambda_i-lambda_j)</text>
<line x1="90" y1="335" x2="310" y2="335" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="135" cy="335" r="8" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="255" cy="335" r="8" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<line x1="135" y1="310" x2="135" y2="360" stroke="#2563EB" stroke-width="2"/>
<line x1="255" y1="310" x2="255" y2="360" stroke="#0F766E" stroke-width="2"/>
<text x="195" y="300" font-size="18" font-weight="700" text-anchor="middle" fill="#1F2937">gap</text>
<text x="52" y="418" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">gap 小：方向敏感；标量谱值仍可能较稳定。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">重复谱：改用子空间</text>
<circle cx="535" cy="245" r="95" fill="#ECFDF5" stroke="#0F766E" stroke-width="2.5"/>
<line x1="535" y1="245" x2="475" y2="170" stroke="#0F766E" stroke-width="3"/>
<line x1="535" y1="245" x2="610" y2="190" stroke="#0F766E" stroke-width="3"/>
<text x="535" y="372" font-size="16" font-weight="650" text-anchor="middle" fill="#1F2937">同一子空间内，基可任意旋转</text>
<line x1="645" y1="245" x2="695" y2="245" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>

<rect x="685" y="190" width="85" height="110" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="727.5" y="251.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">P = U U^T</text>
<text x="430" y="430" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">比较投影距离或主角，不逐列比较向量。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">SVD 的两类退化</text>
<rect x="845" y="105" width="285" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="987.5" y="139.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">A = U Sigma V^T</text>
<text x="845" y="205" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">d sigma_i = u_i^T (dA) v_i</text>
<text x="845" y="255" font-size="17" font-weight="650" text-anchor="start" fill="#C24135">方向分母: sigma_i^2 - sigma_j^2</text>
<text x="845" y="300" font-size="17" font-weight="650" text-anchor="start" fill="#C24135">补空间分母: sigma_i</text>
<text x="845" y="365" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937">碰撞、零值、秩变化必须分层处理。</text>
<text x="845" y="410" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">符号、排列与内部旋转也要纳入审计。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">谱值、单个方向与不变子空间是不同输出对象；先声明对象，再选择可微结论。</text>
</svg>