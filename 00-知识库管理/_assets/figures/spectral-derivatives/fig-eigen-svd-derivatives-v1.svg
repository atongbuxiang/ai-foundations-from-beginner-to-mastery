<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">特征值、特征向量与 SVD 的导数</title>
  <desc id="desc">三面板分别展示简单特征对、重复谱子空间和 SVD 导数及退化边界。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F3FF"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker>
    <style>.title{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F172A}.head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#4C1D95}.txt{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.math{font:15px Georgia,"Times New Roman",serif;fill:#0F172A}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#64748B}.card{fill:#fff;stroke:#CBD5E1;stroke-width:1.3}.violet{fill:#F5F3FF;stroke:#C4B5FD}.blue{fill:#EFF6FF;stroke:#93C5FD}.amber{fill:#FFFBEB;stroke:#FCD34D}.red{fill:#FEF2F2;stroke:#FCA5A5}.line{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#arr)}</style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/><text x="40" y="38" class="title">谱分解求导：简单值可微，方向看 gap，重值改用子空间</text>
  <rect x="28" y="58" width="368" height="342" rx="17" class="card"/><rect x="416" y="58" width="368" height="342" rx="17" class="card"/><rect x="804" y="58" width="368" height="342" rx="17" class="card"/>
  <text x="50" y="88" class="head">A　对称简单特征对</text>
  <rect x="55" y="111" width="314" height="54" rx="11" class="violet"/><text x="111" y="143" class="math">A uᵢ = λᵢ uᵢ,　uᵢᵀuᵢ=1</text>
  <path d="M212 167L212 194" class="line"/>
  <rect x="55" y="198" width="314" height="62" rx="11" class="blue"/><text x="76" y="224" class="math">dλᵢ = uᵢᵀ(dA)uᵢ</text><text x="76" y="247" class="math">duᵢ = Σⱼ≠ᵢ uⱼ · uⱼᵀ(dA)uᵢ/(λᵢ−λⱼ)</text>
  <rect x="55" y="293" width="314" height="52" rx="11" class="amber"/><text x="83" y="316" class="txt">方向灵敏度 ≈ 扰动 / 谱间隙</text><text x="83" y="337" class="small">规范：uᵢᵀduᵢ=0</text>
  <text x="64" y="380" class="small">一般非正规矩阵：dλ = w* (dA) v / (w*v)</text>
  <text x="438" y="88" class="head">B　重复谱：逐列基不再唯一</text>
  <circle cx="527" cy="186" r="68" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/><line x1="527" y1="186" x2="582" y2="146" stroke="#7C3AED" stroke-width="3"/><line x1="527" y1="186" x2="488" y2="131" stroke="#7C3AED" stroke-width="3"/><text x="469" y="278" class="small">同一子空间内基可旋转</text>
  <path d="M610 186L662 186" class="line"/>
  <rect x="674" y="128" width="83" height="116" rx="10" class="blue"/><text x="697" y="166" class="math">P</text><text x="687" y="191" class="math">= UUᵀ</text><text x="686" y="220" class="small">基不变</text>
  <rect x="447" y="305" width="308" height="55" rx="11" class="red"/><text x="466" y="329" class="txt">碰撞点：排序谱值可能只有方向导数</text><text x="466" y="350" class="small">改用谱簇投影、主角或次梯度</text>
  <text x="826" y="88" class="head">C　SVD：左右方向与秩边界</text>
  <rect x="838" y="111" width="300" height="53" rx="11" class="violet"/><text x="893" y="143" class="math">A = U Σ Vᵀ</text>
  <rect x="838" y="187" width="300" height="55" rx="11" class="blue"/><text x="884" y="220" class="math">dσᵢ = uᵢᵀ(dA)vᵢ</text>
  <rect x="838" y="268" width="300" height="74" rx="11" class="amber"/><text x="858" y="293" class="txt">方向分母：σⱼ²−σᵢ²</text><text x="858" y="317" class="txt">补空间分母：σᵢ</text><text x="858" y="336" class="small">碰撞 / 零值 / 秩变化需分层</text>
  <text x="843" y="379" class="small">符号、相位、排列和内部旋转都要审计</text>
</svg>
