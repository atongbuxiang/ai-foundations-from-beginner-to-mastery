<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">多线性映射、张量与缩并</title><desc id="desc">三面板展示外积创建轴、缩并消去求和轴，以及 Attention 和卷积的指标流。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker><style>.p{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.h{font:700 19px system-ui,sans-serif;fill:#0f172a}.t{font:15px system-ui,sans-serif;fill:#334155}.s{font:13px system-ui,sans-serif;fill:#475569}.m{font:italic 15px Georgia,serif;fill:#0f172a}.b{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.g{fill:#dcfce7;stroke:#059669;stroke-width:2}.r{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.ln{stroke:#334155;stroke-width:2;fill:none}</style></defs>
  <rect width="1200" height="430" fill="white"/><rect class="p" x="18" y="18" width="372" height="394" rx="14"/><rect class="p" x="414" y="18" width="372" height="394" rx="14"/><rect class="p" x="810" y="18" width="372" height="394" rx="14"/>
  <text class="h" x="38" y="52">A. 外积：创建独立指标</text>
  <rect class="b" x="55" y="102" width="29" height="158"/><rect class="g" x="116" y="130" width="142" height="28"/><rect class="r" x="293" y="103" width="28" height="158"/>
  <text class="s" x="55" y="286">aᵢ</text><text class="s" x="166" y="181">bⱼ</text><text class="s" x="292" y="286">cₖ</text>
  <path class="ln" d="M91 216C138 286 245 291 286 219" marker-end="url(#a)"/>
  <g transform="translate(128,226)"><polygon points="0,40 104,0 165,33 60,75" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><polygon points="60,75 165,33 165,106 60,148" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><polygon points="0,40 60,75 60,148 0,112" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/></g>
  <text class="m" x="49" y="389">Xᵢⱼₖ = aᵢ bⱼ cₖ：无求和，shape I×J×K</text>
  <text class="h" x="434" y="52">B. 缩并：配对指标并求和</text>
  <rect class="b" x="451" y="107" width="118" height="92"/><text class="t" x="477" y="143">Aᵢₖ</text><text class="s" x="466" y="181">自由 i，共享 k</text>
  <rect class="g" x="633" y="107" width="118" height="92"/><text class="t" x="660" y="143">Bₖⱼ</text><text class="s" x="648" y="181">共享 k，自由 j</text>
  <path d="M570 151H632" stroke="#dc2626" stroke-width="5" stroke-dasharray="7 5"/><text class="s" x="586" y="136">Σₖ</text>
  <path class="ln" d="M601 208V251" marker-end="url(#a)"/>
  <rect class="r" x="528" y="268" width="146" height="72" rx="8"/><text class="t" x="566" y="298">Cᵢⱼ</text><text class="s" x="542" y="322">k 消失，i/j 保留</text>
  <text class="m" x="449" y="382">einsum("ik,kj-&gt;ij", A, B)</text><text class="s" x="449" y="405">输出标签就是自由指标及其轴顺序</text>
  <text class="h" x="830" y="52">C. AI：轴语义决定公式</text>
  <rect class="b" x="838" y="90" width="91" height="54" rx="7"/><text class="t" x="855" y="122">Q bhir</text><rect class="g" x="953" y="90" width="91" height="54" rx="7"/><text class="t" x="970" y="122">K bhjr</text>
  <path class="ln" d="M931 117H951"/><path class="ln" d="M941 145V178" marker-end="url(#a)"/>
  <rect class="r" x="868" y="191" width="148" height="58" rx="8"/><text class="t" x="900" y="217">S bhij</text><text class="s" x="884" y="238">缩并 feature r</text>
  <path class="ln" d="M1019 220H1050" marker-end="url(#a)"/><rect class="g" x="1064" y="190" width="92" height="59" rx="8"/><text class="t" x="1086" y="217">V bhjr</text><text class="s" x="1074" y="238">再缩并 j</text>
  <path class="ln" d="M1110 253V285" marker-end="url(#a)"/><rect class="b" x="1037" y="296" width="119" height="54" rx="8"/><text class="t" x="1061" y="328">O bhir</text>
  <text class="s" x="837" y="373">Attention = 两次 contraction + softmax 非线性</text><text class="s" x="837" y="398">卷积还加入位移索引、共享、stride/padding</text>
</svg>
