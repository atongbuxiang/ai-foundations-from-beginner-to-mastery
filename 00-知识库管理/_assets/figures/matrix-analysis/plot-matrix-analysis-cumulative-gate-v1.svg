<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">矩阵分析累计复现门</title>
<desc id="desc">三面板展示正定边界与条件数，谱间隙闭合时的特征向量旋转和非正规伪谱，以及矩阵 sign、polar、Frechet 导数与结构化条件数的区别。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EEF2FF"/><stop offset=".52" stop-color="#F8FAFC"/><stop offset="1" stop-color="#FFF7ED"/></linearGradient><style>.title{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F172A}.head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#4338CA}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#64748B}.label{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.math{font:14px Georgia,"Times New Roman",serif;fill:#0F172A}.card{fill:#fff;stroke:#CBD5E1;stroke-width:1.3}.axis{stroke:#64748B;stroke-width:1.1}.grid{stroke:#CBD5E1;stroke-width:1;stroke-dasharray:4 4}</style></defs>
<rect width="1200" height="470" rx="22" fill="url(#bg)"/>
