<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">逆函数定理与隐函数定理</title>
  <desc id="desc">三面板展示局部可逆、隐式零水平集图像和定理失败边界。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ECFDF5"/><stop offset="1" stop-color="#F0FDFA"/></linearGradient>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker>
    <style>.title{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F172A}.head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#065F46}.txt{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.math{font:15px Georgia,"Times New Roman",serif;fill:#0F172A}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#64748B}.card{fill:#fff;stroke:#CBD5E1;stroke-width:1.3}.green{fill:#ECFDF5;stroke:#6EE7B7}.blue{fill:#EFF6FF;stroke:#93C5FD}.amber{fill:#FFFBEB;stroke:#FCD34D}.red{fill:#FEF2F2;stroke:#FCA5A5}.line{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#arr2)}</style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg2)"/><text x="40" y="38" class="title">逆 / 隐函数定理：可逆线性化在小邻域中生成唯一光滑分支</text>
  <rect x="28" y="58" width="368" height="342" rx="17" class="card"/><rect x="416" y="58" width="368" height="342" rx="17" class="card"/><rect x="804" y="58" width="368" height="342" rx="17" class="card"/>
  <text x="50" y="88" class="head">A　局部逆：Df(a) 可逆</text>
  <ellipse cx="126" cy="190" rx="70" ry="85" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/><path d="M78 214 C110 150,142 230,176 161" fill="none" stroke="#059669" stroke-width="3"/><text x="95" y="305" class="small">a 附近的小邻域</text>
  <path d="M200 190L248 190" class="line"/>
  <ellipse cx="314" cy="190" rx="56" ry="85" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" transform="rotate(-18 314 190)"/><text x="277" y="305" class="small">f(a) 附近</text>
  <rect x="56" y="329" width="312" height="47" rx="10" class="green"/><text x="72" y="358" class="math">D(f⁻¹)(f(a)) = Df(a)⁻¹</text>
  <text x="438" y="88" class="head">B　隐式图像：F(x,y)=0</text>
  <line x1="460" y1="293" x2="748" y2="293" stroke="#94A3B8"/><line x1="490" y1="330" x2="490" y2="116" stroke="#94A3B8"/><path d="M486 252 C540 229,584 150,646 170 C690 184,715 145,742 127" fill="none" stroke="#0D9488" stroke-width="4"/><circle cx="620" cy="170" r="6" fill="#0F766E"/><text x="631" y="159" class="small">(x,g(x))</text>
  <rect x="452" y="315" width="305" height="58" rx="10" class="blue"/><text x="469" y="339" class="math">DxF dx + DyF dy = 0</text><text x="469" y="361" class="math">Dg = −(DyF)⁻¹ DxF</text>
  <text x="826" y="88" class="head">C　四个层次必须分开</text>
  <rect x="838" y="108" width="301" height="50" rx="10" class="green"/><text x="862" y="139" class="txt">局部存在唯一：Jacobian 可逆</text>
  <rect x="838" y="178" width="301" height="50" rx="10" class="blue"/><text x="862" y="209" class="txt">定量稳定：σmin 不能太小</text>
  <rect x="838" y="248" width="301" height="50" rx="10" class="amber"/><text x="862" y="279" class="txt">全局可逆：还需额外结构</text>
  <rect x="838" y="318" width="301" height="50" rx="10" class="red"/><text x="862" y="349" class="txt">数值求解：分支、残差与吸引域</text>
  <text x="840" y="391" class="small">奇异 Jacobian：可能分叉、多解或逆不可微</text>
</svg>
