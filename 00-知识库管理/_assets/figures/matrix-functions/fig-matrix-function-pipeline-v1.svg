<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">矩阵函数从定义、计算到 AI 应用的统一路线</title>
  <desc id="desc">上半部分展示标量函数在矩阵谱上的值与导数，经 Jordan、Hermite 插值或 Cauchy 积分得到同一个主矩阵函数。下半部分按完整稠密矩阵、矩阵函数作用量和 Frechet 导数三种任务选择算法，并连接线性常微分方程、状态空间模型和旋转位置编码。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .body { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .math { font: 600 19px Georgia, "Times New Roman", serif; fill: #0f172a; }
      .mathLarge { font: 700 24px Georgia, "Times New Roman", serif; fill: #0f172a; }
      .chip { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1200" height="820" rx="24" fill="#f8fafc"/>
  <text x="52" y="50" class="title">矩阵函数：定义同一，计算任务不同</text>
  <text x="52" y="78" class="subtitle">先确定 f 在谱上的值、导数与分支，再按 full matrix / action / derivative 选择数值路线</text>

  <rect x="42" y="104" width="1116" height="342" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="66" y="140" class="section">1　三个等价入口定义同一个主矩阵函数</text>

  <rect x="70" y="178" width="210" height="104" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="211" text-anchor="middle" class="body">标量函数 f</text>
  <text x="175" y="239" text-anchor="middle" class="math">λᵢ 上的 f⁽ᵏ⁾(λᵢ)</text>
  <text x="175" y="265" text-anchor="middle" class="small">阶数由最大 Jordan 块决定</text>

  <line x1="288" y1="230" x2="354" y2="230" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="366" y="164" width="220" height="72" rx="15" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="476" y="194" text-anchor="middle" class="body">Jordan 函数演算</text>
  <text x="476" y="219" text-anchor="middle" class="small">逐块截断 Taylor 展开</text>

  <rect x="366" y="250" width="220" height="72" rx="15" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="476" y="280" text-anchor="middle" class="body">Hermite 插值</text>
  <text x="476" y="305" text-anchor="middle" class="small">f(A) = p(A) mod m_A</text>

  <rect x="366" y="336" width="220" height="72" rx="15" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="476" y="366" text-anchor="middle" class="body">Cauchy 积分</text>
  <text x="476" y="391" text-anchor="middle" class="small">解析函数与预解式</text>

  <line x1="594" y1="200" x2="704" y2="255" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="594" y1="286" x2="704" y2="275" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="594" y1="372" x2="704" y2="295" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="716" y="210" width="216" height="126" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="824" y="252" text-anchor="middle" class="mathLarge">f(A)</text>
  <text x="824" y="282" text-anchor="middle" class="body">同一个主矩阵函数</text>
  <text x="824" y="310" text-anchor="middle" class="small">与 A 交换、相似协变</text>

  <line x1="940" y1="273" x2="1002" y2="273" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1012" y="202" width="118" height="142" rx="17" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="1071" y="237" text-anchor="middle" class="mathLarge">eᴬ</text>
  <text x="1071" y="267" text-anchor="middle" class="small">对所有方阵</text>
  <text x="1071" y="289" text-anchor="middle" class="small">都存在且可逆</text>
  <text x="1071" y="320" text-anchor="middle" class="chip">核心特例</text>

  <text x="71" y="429" class="small">分支必须声明：log、sqrt 等可能有多个矩阵值；理论上 Jordan 最透明，数值上通常转入良态的 Schur 坐标。</text>

  <rect x="42" y="474" width="1116" height="286" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="66" y="510" class="section">2　先问输出对象，再选算法；数学定义不自动给出稳定实现</text>

  <rect x="72" y="548" width="290" height="140" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="92" y="566" width="110" height="31" rx="15" fill="#bfdbfe"/>
  <text x="147" y="587" text-anchor="middle" class="chip">完整矩阵</text>
  <text x="217" y="625" text-anchor="middle" class="math">f(A) 或 eᴬ</text>
  <text x="217" y="652" text-anchor="middle" class="body">Schur–Parlett</text>
  <text x="217" y="675" text-anchor="middle" class="small">指数：缩放平方 + Padé</text>

  <rect x="390" y="548" width="290" height="140" rx="17" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="410" y="566" width="110" height="31" rx="15" fill="#bbf7d0"/>
  <text x="465" y="587" text-anchor="middle" class="chip">作用量</text>
  <text x="535" y="625" text-anchor="middle" class="math">f(A)b 或 eᵗᴬB</text>
  <text x="535" y="652" text-anchor="middle" class="body">Krylov / Taylor action</text>
  <text x="535" y="675" text-anchor="middle" class="small">大型稀疏时不形成稠密 f(A)</text>

  <rect x="708" y="548" width="290" height="140" rx="17" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <rect x="728" y="566" width="110" height="31" rx="15" fill="#fed7aa"/>
  <text x="783" y="587" text-anchor="middle" class="chip">方向导数</text>
  <text x="853" y="625" text-anchor="middle" class="math">L_f(A,E)</text>
  <text x="853" y="652" text-anchor="middle" class="body">Fréchet / 分块公式</text>
  <text x="853" y="675" text-anchor="middle" class="small">条件数与反向传播接口</text>

  <line x1="1006" y1="618" x2="1050" y2="618" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1060" y="540" width="72" height="157" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1096" y="570" text-anchor="middle" class="chip">AI</text>
  <text x="1096" y="599" text-anchor="middle" class="small">ODE</text>
  <text x="1096" y="624" text-anchor="middle" class="small">SSM</text>
  <text x="1096" y="649" text-anchor="middle" class="small">RoPE</text>
  <text x="1096" y="674" text-anchor="middle" class="small">VJP</text>

  <text x="72" y="728" class="subtitle">验收至少包括：结构恒等式 + 缩放后的残差 + 条件性解释；小残差不自动保证小前向误差。</text>
  <text x="52" y="794" class="subtitle">核心判断：先确定函数、分支与谱条件，再确定“完整矩阵、作用量还是导数”；最后才是软件接口。</text>
</svg>
