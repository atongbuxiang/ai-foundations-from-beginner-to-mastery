<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">最小二乘的输出投影、参数非唯一性与算法选择</title>
  <desc id="desc">上方展示观测向量投影到列空间并产生正交残差，中部展示秩亏时全部参数解沿零空间展开，下方比较正规方程、QR 与 SVD 的适用边界。</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker>
    <style>
      .sans{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.math{font-family:"STIX Two Math","Times New Roman",serif}.ink{fill:#1f2937}.muted{fill:#64748b}.blue{fill:#2563eb}.green{fill:#0f766e}.amber{fill:#b7791f}.h{font-size:19px;font-weight:600}.body{font-size:16px}.small{font-size:15px}.formula{font-size:20px}.result{font-size:19px;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#ffffff"/>
  <rect x="42" y="42" width="706" height="332" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="68" y="80" class="sans h blue">输出空间：唯一的最佳预测</text>
  <path d="M89 324L688 173" stroke="#2563eb" stroke-width="4"/><text x="615" y="158" class="math body blue">列空间 R(A)</text>
  <circle cx="546" cy="91" r="7" fill="#1f2937"/><text x="558" y="88" class="math body ink">b</text>
  <circle cx="494" cy="222" r="7" fill="#0f766e"/><text x="432" y="249" class="math body green">b̂=A x̂</text>
  <path d="M546 91L494 222" stroke="#0f766e" stroke-width="3" marker-end="url(#green-arrow)"/><text x="535" y="169" class="math body green">r=b−A x̂</text>
  <path d="M494 222L507 227L512 214" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <text x="92" y="349" class="math body ink">A*r=0　⇔　A*Ax̂=A*b</text><text x="709" y="349" class="sans small muted" text-anchor="end">残差属于 N(A*)</text>

  <rect x="788" y="42" width="370" height="332" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="814" y="80" class="sans h blue">参数空间：最优参数可能不唯一</text>
  <path d="M832 275L1118 132" stroke="#b7791f" stroke-width="3"/><text x="1024" y="122" class="math body amber">x̂ + N(A)</text>
  <circle cx="958" cy="212" r="8" fill="#2563eb"/><text x="971" y="207" class="math body blue">A⁺b</text>
  <path d="M958 212L908 237" stroke="#64748b" stroke-width="2"/><text x="837" y="255" class="sans small muted">最小范数代表</text>
  <text x="973" y="306" class="math body ink" text-anchor="middle">所有 x̂+z，z∈N(A)</text><text x="973" y="337" class="sans small muted" text-anchor="middle">产生同一个最佳预测 A x̂</text>

  <rect x="42" y="404" width="1116" height="154" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="68" y="441" class="sans h green">同一数学目标，三条计算路径</text>
  <rect x="68" y="465" width="314" height="70" rx="9" fill="#fffbeb" stroke="#fcd34d"/><text x="225" y="493" class="sans body amber" text-anchor="middle">正规方程 / Cholesky</text><text x="225" y="520" class="sans small muted" text-anchor="middle">快，但会平方条件数；勿显式求逆</text>
  <rect x="443" y="465" width="314" height="70" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="600" y="493" class="sans body blue" text-anchor="middle">QR / QRCP</text><text x="600" y="520" class="sans small muted" text-anchor="middle">满秩稠密问题的常用稳定主线</text>
  <rect x="818" y="465" width="314" height="70" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/><text x="975" y="493" class="sans body green" text-anchor="middle">SVD / LSQR / LSMR</text><text x="975" y="520" class="sans small muted" text-anchor="middle">秩亏、病态或大规模稀疏问题</text>
  <rect x="92" y="584" width="1016" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="600" y="611" class="sans result ink" text-anchor="middle">预测由输出投影唯一确定；参数是否唯一取决于 N(A)，算法选择取决于秩、条件性与规模。</text>
</svg>
