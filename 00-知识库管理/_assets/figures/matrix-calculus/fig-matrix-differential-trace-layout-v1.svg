<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">矩阵微分、迹技巧与布局约定</title>
  <desc id="desc">三个面板依次展示从微分到梯度、用迹隔离微分、以及矩阵导数的 JVP 与 VJP。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/></marker>
    <style>
      .title{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0F172A}.head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#1E3A8A}.txt{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.math{font:15px Georgia,"Times New Roman",serif;fill:#0F172A}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.3}.box{fill:#EFF6FF;stroke:#93C5FD}.accent{fill:#EEF2FF;stroke:#818CF8}.warn{fill:#FFF7ED;stroke:#FDBA74}.line{stroke:#475569;stroke-width:1.7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <text x="40" y="38" class="title">矩阵微分：先固定类型，再移动迹，最后选择作用模式</text>
  <rect x="28" y="58" width="368" height="342" rx="17" class="card"/>
  <rect x="416" y="58" width="368" height="342" rx="17" class="card"/>
  <rect x="804" y="58" width="368" height="342" rx="17" class="card"/>
  <text x="50" y="88" class="head">A　微分 → Frobenius 表示 → 梯度</text>
  <rect x="61" y="114" width="300" height="54" rx="12" class="box"/>
  <text x="80" y="137" class="math">Df(X)[E] : R^(m×n) → R</text><text x="80" y="157" class="small">导数先是一个线性泛函</text>
  <path d="M211 170 L211 196" class="line"/>
  <rect x="61" y="199" width="300" height="67" rx="12" class="accent"/>
  <text x="76" y="225" class="math">df = ⟨G, dX⟩F</text><text x="76" y="249" class="math">= tr(Gᵀ dX)</text>
  <path d="M211 268 L211 294" class="line"/>
  <rect x="61" y="297" width="300" height="57" rx="12" class="box"/>
  <text x="85" y="322" class="math">G = ∇X f,　shape(G)=shape(X)</text>
  <text x="85" y="343" class="small">梯度依赖所选内积</text>
  <text x="66" y="375" class="small">dX：方向　　df：标量</text>
  <text x="66" y="392" class="small">Df：线性算子　　∇f：矩阵表示</text>
  <text x="438" y="88" class="head">B　迹技巧是“隔离 dX”</text>
  <rect x="445" y="115" width="310" height="50" rx="11" class="warn"/>
  <text x="466" y="145" class="math">df = tr(A · dX · B)</text>
  <path d="M600 167 L600 204" class="line"/>
  <text x="614" y="191" class="small">只做循环移动</text>
  <rect x="445" y="207" width="310" height="50" rx="11" class="box"/>
  <text x="472" y="237" class="math">= tr(B A · dX)</text>
  <path d="M600 259 L600 296" class="line"/>
  <text x="614" y="283" class="small">匹配 tr(GᵀdX)</text>
  <rect x="445" y="299" width="310" height="50" rx="11" class="accent"/>
  <text x="497" y="330" class="math">∇X f = (BA)ᵀ</text>
  <text x="456" y="375" class="small">允许：tr(ABC)=tr(BCA)=tr(CAB)</text>
  <text x="456" y="392" class="small">禁止：把 B、C 任意交换</text>
  <text x="826" y="88" class="head">C　矩阵输出保留为算子</text>
  <rect x="838" y="112" width="300" height="50" rx="11" class="box"/>
  <text x="893" y="143" class="math">F(X)=A X B</text>
  <path d="M988 164 L988 197" class="line"/>
  <rect x="833" y="201" width="142" height="75" rx="12" class="accent"/>
  <text x="869" y="225" class="head">JVP</text><text x="848" y="252" class="math">Ẏ=A Ẋ B</text>
  <rect x="1000" y="201" width="142" height="75" rx="12" class="accent"/>
  <text x="1033" y="225" class="head">VJP</text><text x="1015" y="252" class="math">X̄=Aᵀ Ȳ Bᵀ</text>
  <rect x="838" y="303" width="300" height="51" rx="11" class="warn"/>
  <text x="856" y="326" class="txt">默认：输出行 / 输入列 Jacobian</text><text x="856" y="346" class="txt">vec 按列堆叠；布局必须声明</text>
  <text x="832" y="380" class="small">优先计算作用，不物化四阶 Jacobian</text>
</svg>
