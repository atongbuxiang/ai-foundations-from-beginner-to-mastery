<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">矩阵微分、迹技巧与布局</title>
<desc id="desc">从矩阵方向上的线性泛函，经 Frobenius 配对得到梯度；迹循环只用于隔离 dX；矩阵输出优先保留为 JVP/VJP 算子。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#B7791F"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">微分先于梯度</text>
<rect x="55" y="105" width="290" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="200.0" y="142.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">Df(X): E -&gt; scalar</text>
<line x1="200" y1="170" x2="200" y2="205" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<rect x="55" y="215" width="290" height="78" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="200.0" y="260.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">df = &lt;G,dX&gt;_F = tr(G^T dX)</text>
<line x1="200" y1="297" x2="200" y2="330" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<rect x="55" y="342" width="290" height="62" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="200.0" y="379.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">gradient_X f = G</text>
<text x="55" y="455" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">形状：G 与 X 相同；内积固定坐标表示。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">迹循环只为隔离 dX</text>
<rect x="445" y="112" width="310" height="64" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="600.0" y="150.0" font-size="17" font-weight="650" text-anchor="middle" fill="#B7791F">df = tr(A dX B)</text>
<rect x="445" y="225" width="310" height="64" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="263.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">= tr(B A dX)</text>
<rect x="445" y="338" width="310" height="64" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="376.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">gradient_X f = (BA)^T</text>
<line x1="600" y1="180" x2="600" y2="218" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<line x1="600" y1="293" x2="600" y2="331" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<text x="440" y="447" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">允许 tr(ABC)=tr(BCA)；禁止任意交换 B、C。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#B7791F">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">矩阵输出保留为算子</text>
<rect x="850" y="105" width="280" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="990.0" y="139.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">F(X)=A X B</text>
<line x1="990" y1="165" x2="990" y2="200" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="830" y="215" width="145" height="76" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="902.5" y="259.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">JVP: A dX B</text>
<rect x="1000" y="215" width="145" height="76" rx="8" fill="#FFFEFB" stroke="#B7791F" stroke-width="2"/>
<text x="1072.5" y="259.0" font-size="15" font-weight="650" text-anchor="middle" fill="#B7791F">VJP: A^T Ybar B^T</text>
<text x="830" y="345" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">完整 Jacobian 依赖 vec 布局，可能是四阶数组。</text>
<text x="830" y="385" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937">实际计算优先请求作用，而不是物化坐标表。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">矩阵求导的可靠顺序：先写线性微分，再用内积读梯度，最后选择 JVP 或 VJP。</text>
</svg>