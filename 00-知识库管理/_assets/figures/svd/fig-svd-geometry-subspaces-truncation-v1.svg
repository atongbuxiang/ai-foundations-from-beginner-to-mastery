<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">SVD 的几何、子空间和截断</title><desc id="d">三个面板展示单位圆到椭圆、输入输出四子空间配对以及截断奇异值。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker><style>.T{font:700 22px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.P{font:700 17px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.B{font:14px -apple-system,"PingFang SC",sans-serif;fill:#334155}.S{font:12px -apple-system,"PingFang SC",sans-serif;fill:#475569}.M{font:italic 15px Georgia,serif;fill:#0f172a}</style></defs><rect width="1200" height="430" rx="18" fill="#f8fafc"/><text x="42" y="38" class="T">SVD：输入正交方向 → 非负缩放 → 输出正交方向</text>
<g transform="translate(30 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">A  单位圆经 A 变成椭圆</text><circle cx="90" cy="175" r="62" fill="none" stroke="#60a5fa" stroke-width="3"/><line x1="90" y1="175" x2="140" y2="138" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><line x1="90" y1="175" x2="62" y2="137" stroke="#8b5cf6" stroke-width="3" marker-end="url(#a)"/><text x="125" y="126" class="S">v₁</text><text x="47" y="128" class="S">v₂</text><path d="M161 175H205" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><ellipse cx="270" cy="175" rx="72" ry="35" transform="rotate(-22 270 175)" fill="none" stroke="#f59e0b" stroke-width="4"/><line x1="270" y1="175" x2="331" y2="150" stroke="#ef4444" stroke-width="3"/><line x1="270" y1="175" x2="256" y2="143" stroke="#22c55e" stroke-width="3"/><text x="300" y="136" class="S">σ₁u₁</text><text x="225" y="135" class="S">σ₂u₂</text><text x="20" y="302" class="M">A = UΣV*</text><text x="20" y="325" class="S">V* 取输入坐标，Σ 缩放，U 放入输出空间</text></g>
<g transform="translate(420 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">B  四个基本子空间成对出现</text><rect x="22" y="70" width="126" height="64" rx="10" fill="#dbeafe"/><text x="37" y="96" class="B">R(A*)</text><text x="37" y="117" class="S">v₁…vᵣ，可见输入</text><rect x="212" y="70" width="126" height="64" rx="10" fill="#dcfce7"/><text x="227" y="96" class="B">R(A)</text><text x="227" y="117" class="S">u₁…uᵣ，可达输出</text><path d="M149 102H209" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><text x="166" y="90" class="S">σᵢ&gt;0</text><rect x="22" y="194" width="126" height="64" rx="10" fill="#f1f5f9"/><text x="37" y="220" class="B">N(A)</text><text x="37" y="241" class="S">零右奇异方向</text><rect x="212" y="194" width="126" height="64" rx="10" fill="#f1f5f9"/><text x="227" y="220" class="B">N(A*)</text><text x="227" y="241" class="S">不可达输出方向</text><path d="M149 226H209" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/><text x="20" y="305" class="S">正奇异值个数 = rank(A)</text><text x="20" y="326" class="S">AA† 与 A†A 分别投到上方两个有效子空间</text></g>
<g transform="translate(810 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">C  截断：保留主方向，尾部决定误差</text><g transform="translate(30 70)"><rect x="0" y="18" width="36" height="160" fill="#2563eb"/><rect x="52" y="54" width="36" height="124" fill="#3b82f6"/><rect x="104" y="88" width="36" height="90" fill="#60a5fa"/><rect x="156" y="123" width="36" height="55" fill="#cbd5e1"/><rect x="208" y="144" width="36" height="34" fill="#cbd5e1"/><rect x="260" y="160" width="36" height="18" fill="#cbd5e1"/><line x1="-8" y1="178" x2="310" y2="178" stroke="#94a3b8"/><line x1="148" y1="5" x2="148" y2="190" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/><text x="112" y="205" class="S">保留 k</text><text x="208" y="205" class="S">尾部</text></g><text x="20" y="302" class="M">‖A−Aₖ‖₂ = σₖ₊₁</text><text x="20" y="326" class="M">‖A−Aₖ‖F² = Σᵢ&gt;ₖ σᵢ²</text></g></svg>
