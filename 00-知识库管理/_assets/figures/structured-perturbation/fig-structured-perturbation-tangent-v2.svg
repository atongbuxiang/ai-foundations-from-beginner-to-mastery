<text x="1213.5" y="407.0" font-size="18" font-weight="600" text-anchor="middle" fill="#172033">Toeplitz</text>
<rect x="1261.0" y="278.4" width="39" height="106.6" fill="#64748b" opacity="0.9"/>
<text x="1280.5" y="269.4" font-size="18" font-weight="700" text-anchor="middle" fill="#172033">0.374</text>
<text x="1280.5" y="407.0" font-size="18" font-weight="600" text-anchor="middle" fill="#172033">对角</text>
<text x="939" y="242.5" font-size="18" font-weight="600" text-anchor="middle" fill="#172033" transform="rotate(-90 939 242.5)">一阶最坏增益</text>
<text x="979.0" y="441.0" font-size="18" font-weight="400" text-anchor="start" fill="#5d6978">结构最强不必最好；柱高只回答局部敏感性。</text>
<text x="1346.0" y="480.0" font-size="18" font-weight="400" text-anchor="end" fill="#5d6978">确定性解析数据；n=4</text>
