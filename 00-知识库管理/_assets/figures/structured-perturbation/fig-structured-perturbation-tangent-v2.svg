<text x="58.0" y="237.0" font-size="18" font-weight="400" text-anchor="start" fill="#5d6978">蓝：负值    白：零    红：正值</text>
<text x="58.0" y="270.0" font-size="18" font-weight="700" text-anchor="start" fill="#172033">同一个输出导数</text>
<text x="58.0" y="293.0" font-size="18" font-weight="400" text-anchor="start" fill="#5d6978">允许方向越少，最坏一阶增益不增。</text>
<text x="58.0" y="330.0" font-size="18" font-weight="600" text-anchor="start" fill="#0f766e">线性结构：Pₛ 是固定正交投影</text>
<text x="58.0" y="355.0" font-size="18" font-weight="600" text-anchor="start" fill="#b7791f">流形结构：投影随基点 A 改变</text>
<text x="475.0" y="38.0" font-size="19" font-weight="700" text-anchor="start" fill="#172033">B  切向合法 ≠ 有限步可行</text>
<text x="475.0" y="63.0" font-size="18" font-weight="400" text-anchor="start" fill="#5d6978">以曲面 M 上的基点 A 为例</text>
<path d="M 500 335 C 545 195, 715 170, 840 310" fill="none" stroke="#0f766e" stroke-width="4"/>
<circle cx="665" cy="215" r="6" fill="#172033"/>
<text x="661.0" y="200.0" font-size="18" font-weight="700" text-anchor="middle" fill="#172033">A</text>
<line x1="557" y1="269" x2="781" y2="156" stroke="#8290a3" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="773.0" y="145.0" font-size="18" font-weight="600" text-anchor="middle" fill="#5d6978">TₐM</text>
<line x1="665.0" y1="215.0" x2="757.0" y2="169.0" stroke="#b7791f" stroke-width="3.0" marker-end="url(#arrow-b7791f)"/>
<text x="765.0" y="166.0" font-size="18" font-weight="600" text-anchor="start" fill="#b7791f">hZ（切向）</text>
<circle cx="757" cy="169" r="5" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
<path d="M 757 169 Q 777 217, 747 240" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#arrow-059669)"/>
<circle cx="747" cy="240" r="5" fill="#0f766e" stroke="#ffffff" stroke-width="1.4"/>
<text x="756.0" y="258.0" font-size="18" font-weight="600" text-anchor="start" fill="#0f766e">Rₐ(hZ)</text>
<text x="503.0" y="374.0" font-size="18" font-weight="400" text-anchor="start" fill="#5d6978">直线点 A+hZ 通常离开 M；</text>
<text x="503.0" y="398.0" font-size="18" font-weight="400" text-anchor="start" fill="#5d6978">retraction 把有限步送回结构集合。</text>
<text x="925.0" y="38.0" font-size="19" font-weight="700" text-anchor="start" fill="#172033">C  受限条件数的精确比较</text>
<text x="925.0" y="63.0" font-size="18" font-weight="400" text-anchor="start" fill="#5d6978">condₛ=||PₛG||F；同一 Frobenius 尺度</text>
