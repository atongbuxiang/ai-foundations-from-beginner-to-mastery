<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Schur 分解的结构、算法路线与验收量</title>
  <desc id="desc">上半部分展示矩阵 A 经酉相似变换 Q 星 A Q 得到上三角 Schur 形式 T，T 的对角线保存特征值，严格上三角部分保存方向耦合。右侧展示前 k 个 Schur 向量张成不变子空间并满足 A Q1 等于 Q1 T11。下半部分展示从一般矩阵到 Hessenberg 形再到 Schur 形式的计算路线，以及重构、正交和不变子空间三项残差。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .body { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .math { font: 500 20px Georgia, "Times New Roman", serif; fill: #0f172a; }
      .mathBold { font: 700 22px Georgia, "Times New Roman", serif; fill: #0f172a; }
      .matrix { font: 500 21px Georgia, "Times New Roman", serif; fill: #0f172a; }
      .chip { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="52" y="52" class="title">Schur 分解：把一般方阵放进良态的正交坐标</text>
  <text x="52" y="80" class="subtitle">复情形：A = Q T Q*，Q*Q = I，T 上三角；实情形允许 1×1 与 2×2 对角块</text>

  <rect x="42" y="106" width="728" height="344" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="66" y="141" class="section">1　酉相似：谱不变，坐标变换不放大二范数</text>

  <rect x="78" y="191" width="154" height="118" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="237" text-anchor="middle" class="mathBold">A</text>
  <text x="155" y="270" text-anchor="middle" class="body">任意复方阵</text>
  <text x="155" y="293" text-anchor="middle" class="small">可缺陷、可非正规</text>

  <line x1="240" y1="250" x2="342" y2="250" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="291" y="226" text-anchor="middle" class="math">T = Q* A Q</text>
  <text x="291" y="279" text-anchor="middle" class="small">Q unitary</text>

  <rect x="356" y="164" width="370" height="238" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="195" class="section">Schur 形式 T</text>
  <text x="420" y="247" class="matrix">⎡ λ₁　t₁₂　t₁₃　⋯ ⎤</text>
  <text x="420" y="282" class="matrix">⎢  0　 λ₂　t₂₃　⋯ ⎥</text>
  <text x="420" y="317" class="matrix">⎢  0　  0　 λ₃　⋯ ⎥</text>
  <text x="420" y="352" class="matrix">⎣  ⋮　  ⋮　  ⋮　⋱ ⎦</text>

  <rect x="376" y="371" width="150" height="36" rx="18" fill="#dcfce7"/>
  <text x="451" y="394" text-anchor="middle" class="chip">对角：特征值</text>
  <rect x="538" y="371" width="168" height="36" rx="18" fill="#fee2e2"/>
  <text x="622" y="394" text-anchor="middle" class="chip">上三角：耦合</text>

  <text x="78" y="349" class="math">||Q*x||₂ = ||x||₂</text>
  <text x="78" y="380" class="body">换入、换出 Schur 坐标</text>
  <text x="78" y="405" class="body">都不额外放大误差。</text>

  <rect x="794" y="106" width="364" height="344" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="818" y="141" class="section">2　前缀不是“逐列特征向量”</text>
  <text x="818" y="176" class="math">Q = [ Q₁　Q₂ ]</text>

  <rect x="822" y="204" width="150" height="82" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="897" y="237" text-anchor="middle" class="mathBold">Q₁</text>
  <text x="897" y="264" text-anchor="middle" class="small">前 k 个 Schur 向量</text>
  <line x1="980" y1="245" x2="1052" y2="245" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1062" y="204" width="70" height="82" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1097" y="238" text-anchor="middle" class="mathBold">S</text>
  <text x="1097" y="264" text-anchor="middle" class="small">invariant</text>

  <rect x="822" y="309" width="310" height="76" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="977" y="342" text-anchor="middle" class="mathBold">A Q₁ = Q₁ T₁₁</text>
  <text x="977" y="369" text-anchor="middle" class="small">A span(Q₁) ⊆ span(Q₁)</text>
  <text x="818" y="416" class="body">q₁ 必是特征向量；后续列通常不是。</text>

  <rect x="42" y="477" width="1116" height="229" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="66" y="512" class="section">3　计算路线与验收：算法给出分解，残差判断结果</text>

  <rect x="74" y="548" width="150" height="70" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="149" y="578" text-anchor="middle" class="mathBold">A</text>
  <text x="149" y="602" text-anchor="middle" class="small">一般稠密方阵</text>
  <line x1="232" y1="583" x2="302" y2="583" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="267" y="563" text-anchor="middle" class="small">Householder</text>

  <rect x="312" y="548" width="170" height="70" rx="15" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="397" y="578" text-anchor="middle" class="mathBold">H</text>
  <text x="397" y="602" text-anchor="middle" class="small">上 Hessenberg 形</text>
  <line x1="490" y1="583" x2="560" y2="583" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="525" y="563" text-anchor="middle" class="small">shifted QR</text>

  <rect x="570" y="548" width="170" height="70" rx="15" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="655" y="578" text-anchor="middle" class="mathBold">T</text>
  <text x="655" y="602" text-anchor="middle" class="small">Schur 形式</text>
  <line x1="748" y1="583" x2="810" y2="583" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="820" y="532" width="310" height="104" rx="15" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="842" y="559" class="chip">三项核心验收</text>
  <text x="842" y="585" class="small">reconstruction: ||A − QTQ*|| / ||A||</text>
  <text x="842" y="607" class="small">orthogonality:  ||Q*Q − I||</text>
  <text x="842" y="629" class="small">subspace:       ||AQ₁ − Q₁T₁₁||</text>

  <text x="74" y="664" class="subtitle">重排 Schur 形式可把目标谱簇移到左上角；若谱簇分离很小，残差仍可很小而对应子空间对扰动很敏感。</text>
  <text x="52" y="736" class="subtitle">核心判断：Schur 改善的是坐标表示与计算可靠性；它不会自动治愈非正规矩阵固有的谱条件性。</text>
</svg>
