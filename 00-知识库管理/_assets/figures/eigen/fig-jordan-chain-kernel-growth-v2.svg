<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Jordan 链、广义特征空间的核增长与多项式瞬态</title>
  <desc id="desc">左侧展示幂零部分把高阶广义特征向量逐步送到普通特征向量和零，中间展示核空间逐级增长，右侧说明 Jordan 块等于标量加幂零耦合并在矩阵幂和指数中产生多项式因子。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .sans{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.math{font-family:"STIX Two Math","Times New Roman",serif}.ink{fill:#1f2937}.muted{fill:#64748b}.blue{fill:#2563eb}.green{fill:#0f766e}.amber{fill:#b7791f}.h{font-size:19px;font-weight:600}.body{font-size:16px}.small{font-size:15px}.formula{font-size:20px}.result{font-size:19px;font-weight:600}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <rect x="42" y="43" width="420" height="415" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="68" y="81" class="sans h blue">Jordan 链：经过有限步才归零</text>
  <rect x="75" y="143" width="76" height="58" rx="9" fill="#fffbeb" stroke="#fcd34d"/><text x="113" y="178" class="math formula amber" text-anchor="middle">v₃</text>
  <path d="M151 172H206" class="arrow"/><text x="179" y="151" class="math small muted" text-anchor="middle">N</text>
  <rect x="206" y="143" width="76" height="58" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="244" y="178" class="math formula blue" text-anchor="middle">v₂</text>
  <path d="M282 172H337" class="arrow"/><text x="310" y="151" class="math small muted" text-anchor="middle">N</text>
  <rect x="337" y="143" width="76" height="58" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/><text x="375" y="178" class="math formula green" text-anchor="middle">v₁</text>
  <path d="M375 201V258" class="arrow"/><text x="396" y="235" class="math small muted">N</text><circle cx="375" cy="282" r="24" fill="#ffffff" stroke="#cbd5e1"/><text x="375" y="289" class="math formula ink" text-anchor="middle">0</text>
  <text x="75" y="340" class="math body ink">N=A−λI</text><text x="75" y="376" class="sans body ink">v₁ 是普通特征向量；</text><text x="75" y="406" class="sans body ink">v₂、v₃ 是更高阶广义特征向量。</text><text x="75" y="437" class="sans small muted">箭头表示 N 的作用，不表示时间方向。</text>

  <rect x="500" y="43" width="300" height="415" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="526" y="81" class="sans h blue">核增长记录块结构</text>
  <rect x="542" y="326" width="216" height="84" rx="10" fill="#ffffff" stroke="#93c5fd"/><text x="650" y="359" class="math body blue" text-anchor="middle">K₃=ker N³</text><text x="650" y="389" class="sans small muted" text-anchor="middle">包含三阶链顶端</text>
  <rect x="566" y="236" width="168" height="70" rx="10" fill="#ffffff" stroke="#6ee7b7"/><text x="650" y="267" class="math body green" text-anchor="middle">K₂=ker N²</text><text x="650" y="292" class="sans small muted" text-anchor="middle">至少两步归零</text>
  <rect x="592" y="151" width="116" height="64" rx="10" fill="#ffffff" stroke="#fcd34d"/><text x="650" y="180" class="math body amber" text-anchor="middle">K₁=ker N</text><text x="650" y="204" class="sans small muted" text-anchor="middle">普通特征空间</text>
  <text x="650" y="111" class="math body ink" text-anchor="middle">K₁⊆K₂⊆K₃⊆…</text><text x="650" y="439" class="sans small muted" text-anchor="middle">维数增量可恢复各长度 Jordan 块数量。</text>

  <rect x="838" y="43" width="320" height="415" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="864" y="81" class="sans h green">标量伸缩 + 幂零耦合</text>
  <text x="864" y="132" class="math formula ink">J=λI+N，Nˢ=0</text><text x="864" y="177" class="math body blue">Jᵏ=Σⱼ binom(k,j) λᵏ⁻ʲNʲ</text><text x="864" y="222" class="math body green">eᵗᴶ=eᵗλ Σⱼ (tʲ/j!)Nʲ</text><line x1="864" y1="253" x2="1132" y2="253" stroke="#cbd5e1"/>
  <text x="864" y="293" class="sans body ink">块长度 s 决定：</text><text x="864" y="327" class="sans body amber">最小多项式中因子次数 s；</text><text x="864" y="358" class="sans body amber">动力学中最高 tˢ⁻¹ 多项式瞬态；</text><text x="864" y="389" class="sans body amber">函数公式需要到 s−1 阶导数。</text><text x="864" y="432" class="sans small muted">这些是精确结构，不是稳定数值坐标。</text>
  <rect x="92" y="495" width="1016" height="78" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="600" y="527" class="sans body amber" text-anchor="middle">Jordan 形对微小扰动极敏感：理论上用它解释缺陷与多项式瞬态，浮点计算通常转向 Schur 形式和不变子空间。</text><text x="600" y="557" class="sans small muted" text-anchor="middle">代数重数=总块大小；几何重数=块数量；最小多项式指数=最大块大小。</text>
  <text x="600" y="610" class="sans result ink" text-anchor="middle">普通特征向量没有消失：缺失方向被组织成单向耦合链，由幂零部分逐级送入特征方向。</text>
</svg>
