<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Schur 分解的酉三角化、不变子空间旗与 QR 数值路线</title>
  <desc id="desc">左侧展示方阵经酉相似变换成为上三角 Schur 形式，中间说明 Schur 向量前缀张成嵌套不变子空间，右侧给出 Hessenberg 化和 QR 迭代路线以及三项验收量。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .sans{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.math{font-family:"STIX Two Math","Times New Roman",serif}.ink{fill:#1f2937}.muted{fill:#64748b}.blue{fill:#2563eb}.green{fill:#0f766e}.amber{fill:#b7791f}.h{font-size:19px;font-weight:600}.body{font-size:16px}.small{font-size:15px}.formula{font-size:20px}.result{font-size:19px;font-weight:600}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.cell{fill:#ffffff;stroke:#cbd5e1}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <rect x="42" y="43" width="410" height="416" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="68" y="81" class="sans h blue">酉相似：不放大二范数</text><text x="74" y="133" class="math formula ink">A</text><path d="M107 126H190" class="arrow"/><text x="149" y="109" class="math body blue" text-anchor="middle">Q* A Q</text>
  <text x="210" y="133" class="math formula green">T =</text>
  <g class="math body ink" text-anchor="middle"><rect x="266" y="98" width="48" height="44" class="cell"/><rect x="314" y="98" width="48" height="44" class="cell"/><rect x="362" y="98" width="48" height="44" class="cell"/><rect x="266" y="142" width="48" height="44" class="cell"/><rect x="314" y="142" width="48" height="44" class="cell"/><rect x="362" y="142" width="48" height="44" class="cell"/><rect x="266" y="186" width="48" height="44" class="cell"/><rect x="314" y="186" width="48" height="44" class="cell"/><rect x="362" y="186" width="48" height="44" class="cell"/><text x="290" y="126" class="green">λ₁</text><text x="338" y="126">*</text><text x="386" y="126">*</text><text x="290" y="171" class="muted">0</text><text x="338" y="171" class="green">λ₂</text><text x="386" y="171">*</text><text x="290" y="215" class="muted">0</text><text x="338" y="215" class="muted">0</text><text x="386" y="215" class="green">λ₃</text></g>
  <text x="74" y="276" class="math body ink">A=QTQ*</text><text x="74" y="312" class="math body blue">Q*Q=I，κ₂(Q)=1</text><text x="74" y="352" class="sans body ink">对角线：全部特征值</text><text x="74" y="384" class="sans body amber">严格上三角：Schur 方向间耦合</text><text x="74" y="425" class="sans small muted">正规矩阵的上三角 Schur 形式必为对角阵。</text>

  <rect x="490" y="43" width="300" height="416" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="516" y="81" class="sans h blue">Schur 向量形成不变旗</text>
  <rect x="526" y="314" width="228" height="98" rx="10" fill="#ffffff" stroke="#93c5fd"/><text x="640" y="348" class="math body blue" text-anchor="middle">U₃=span(q₁,q₂,q₃)</text><text x="640" y="382" class="math small muted" text-anchor="middle">A U₃⊆U₃</text>
  <rect x="551" y="211" width="178" height="78" rx="10" fill="#ffffff" stroke="#6ee7b7"/><text x="640" y="244" class="math body green" text-anchor="middle">U₂=span(q₁,q₂)</text><text x="640" y="270" class="math small muted" text-anchor="middle">A U₂⊆U₂</text>
  <rect x="580" y="118" width="120" height="68" rx="10" fill="#ffffff" stroke="#fcd34d"/><text x="640" y="148" class="math body amber" text-anchor="middle">U₁=span(q₁)</text><text x="640" y="173" class="math small muted" text-anchor="middle">A U₁⊆U₁</text>
  <text x="640" y="440" class="sans small muted" text-anchor="middle">单个 qⱼ 未必是特征向量；前缀整体不变。</text>

  <rect x="828" y="43" width="330" height="416" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="854" y="81" class="sans h green">数值路线与验收</text>
  <rect x="860" y="112" width="266" height="52" rx="9" fill="#f8fafc" stroke="#cbd5e1"/><text x="993" y="145" class="sans body ink" text-anchor="middle">Hessenberg 化</text><path d="M993 164V201" class="arrow"/>
  <rect x="860" y="201" width="266" height="62" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="993" y="227" class="sans body blue" text-anchor="middle">带位移 QR 迭代</text><text x="993" y="250" class="sans small muted" text-anchor="middle">一连串酉相似变换</text><path d="M993 263V300" class="arrow"/>
  <rect x="860" y="300" width="266" height="52" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/><text x="993" y="333" class="sans body green" text-anchor="middle">T 近三角，提取谱簇</text>
  <text x="854" y="390" class="math small ink">重构：‖A−QTQ*‖</text><text x="854" y="418" class="math small ink">正交：‖Q*Q−I‖</text><text x="854" y="446" class="math small ink">泄漏：‖tril(T,−1)‖</text>
  <rect x="92" y="498" width="1016" height="74" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="600" y="529" class="sans body amber" text-anchor="middle">实 Schur 形式允许 2×2 对角块编码共轭复特征值；“酉表示稳定”不等于非正规矩阵的特征值问题本身良态。</text><text x="600" y="558" class="sans small muted" text-anchor="middle">Schur 重排按谱簇移动对角块，同时保留对应不变子空间；近邻谱簇的分离度决定敏感性。</text>
  <text x="600" y="610" class="sans result ink" text-anchor="middle">Schur 不要求特征基存在：它用良态酉基保留谱值、耦合和嵌套不变子空间。</text>
</svg>
