<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Jordan 链、Jordan 块与核空间增长的对应</title>
  <desc id="desc">上半部分展示三阶 Jordan 链 v3 经 A 减 lambda I 映到 v2，再映到特征向量 v1，最后映到零。中间展示对应的三阶 Jordan 块。下半部分展示核空间 K1、K2、K3 逐级增长，并说明每一步增加的维数等于长度至少达到该步的 Jordan 块数量。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .node { font: 700 24px Georgia, "Times New Roman", serif; fill: #0f172a; }
      .small { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .math { font: 500 19px Georgia, "Times New Roman", serif; fill: #0f172a; }
      .matrix { font: 500 21px Georgia, "Times New Roman", serif; fill: #0f172a; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <text x="52" y="52" class="title">同一件事的三种语言：链、矩阵、核空间增长</text>
  <text x="52" y="80" class="subtitle">固定特征值 λ，并记 N = A − λI；下图采用超对角线为 1 的 Jordan 块约定</text>

  <rect x="42" y="105" width="715" height="262" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="66" y="139" class="section">1　Jordan 链：N 每作用一次，就沿链向特征向量移动一步</text>

  <rect x="75" y="188" width="120" height="82" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="223" text-anchor="middle" class="node">v₃</text>
  <text x="135" y="251" text-anchor="middle" class="small">三阶广义向量</text>

  <line x1="200" y1="229" x2="293" y2="229" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="246" y="211" text-anchor="middle" class="math">N</text>

  <rect x="305" y="188" width="120" height="82" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="365" y="223" text-anchor="middle" class="node">v₂</text>
  <text x="365" y="251" text-anchor="middle" class="small">二阶广义向量</text>

  <line x1="430" y1="229" x2="523" y2="229" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="476" y="211" text-anchor="middle" class="math">N</text>

  <rect x="535" y="188" width="120" height="82" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="595" y="223" text-anchor="middle" class="node">v₁</text>
  <text x="595" y="251" text-anchor="middle" class="small">普通特征向量</text>

  <line x1="660" y1="229" x2="706" y2="229" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="683" y="211" text-anchor="middle" class="math">N</text>
  <text x="726" y="237" text-anchor="middle" class="node">0</text>

  <text x="75" y="309" class="math">Nv₁ = 0，　Nv₂ = v₁，　Nv₃ = v₂</text>
  <text x="75" y="340" class="small">在有序基 (v₁, v₂, v₃) 中，矩阵的列依次记录 Av₁、Av₂、Av₃。</text>

  <rect x="783" y="105" width="375" height="262" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2" filter="url(#shadow)"/>
  <text x="807" y="139" class="section">2　对应矩阵：J₃(λ) = λI + N</text>
  <text x="848" y="205" class="matrix">⎡ λ　1　0 ⎤</text>
  <text x="848" y="242" class="matrix">⎢ 0　λ　1 ⎥</text>
  <text x="848" y="279" class="matrix">⎣ 0　0　λ ⎦</text>
  <text x="807" y="322" class="small">对角线：共同的特征值 λ</text>
  <text x="807" y="347" class="small">超对角线：链中“上游喂给下游”的耦合</text>

  <rect x="42" y="393" width="1116" height="277" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="66" y="429" class="section">3　核空间阶梯：K_k = ker N^k 记录“最多经过 k 步会被消去”的方向</text>

  <rect x="78" y="478" width="265" height="132" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="210" y="514" text-anchor="middle" class="math">K₁ = span{v₁}</text>
  <text x="210" y="546" text-anchor="middle" class="small">dim K₁ = 1</text>
  <text x="210" y="577" text-anchor="middle" class="label">一步归零：普通特征空间</text>

  <line x1="350" y1="544" x2="420" y2="544" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="385" y="526" text-anchor="middle" class="label">加入 v₂</text>

  <rect x="432" y="462" width="300" height="164" rx="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="582" y="502" text-anchor="middle" class="math">K₂ = span{v₁, v₂}</text>
  <text x="582" y="536" text-anchor="middle" class="small">dim K₂ = 2</text>
  <text x="582" y="570" text-anchor="middle" class="label">两步内归零</text>
  <text x="582" y="599" text-anchor="middle" class="small">K₁ ⊂ K₂</text>

  <line x1="739" y1="544" x2="809" y2="544" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="774" y="526" text-anchor="middle" class="label">加入 v₃</text>

  <rect x="821" y="446" width="300" height="196" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="971" y="488" text-anchor="middle" class="math">K₃ = span{v₁, v₂, v₃}</text>
  <text x="971" y="523" text-anchor="middle" class="small">dim K₃ = 3，之后稳定</text>
  <text x="971" y="558" text-anchor="middle" class="label">三步内归零：整个广义特征空间</text>
  <text x="971" y="592" text-anchor="middle" class="small">dim K_k − dim K_(k−1)</text>
  <text x="971" y="617" text-anchor="middle" class="small">= 长度至少为 k 的块数量</text>

  <text x="66" y="698" class="subtitle">一个三阶块的增长序列是 0 → 1 → 2 → 3；一般情形把所有块对 dim ker N^k 的贡献 min(k, 块大小) 相加。</text>
</svg>
