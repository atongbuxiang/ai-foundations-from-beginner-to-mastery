<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">数据处理不等式、统计充分性与任务充分性</title>
  <desc id="desc">三面板展示Markov处理链的信息不增、样本压缩为充分统计量，以及表示保留任务信息而丢弃干扰信息。</desc>
  <defs><style>
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 20px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#0f172a}.sub{font:14px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#475569}.label{font:14px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#64748b}.formula{font:italic 16px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#0f172a}.box1{fill:#dbeafe;stroke:#2563eb;stroke-width:1.5}.box2{fill:#ede9fe;stroke:#7c3aed;stroke-width:1.5}.box3{fill:#dcfce7;stroke:#059669;stroke-width:1.5}.warn{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}.bar1{fill:#2563eb}.bar2{fill:#7c3aed}.bar3{fill:#059669}
  </style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
  <rect class="bg" width="1200" height="430"/>
  <rect class="panel" x="20" y="20" width="370" height="390" rx="14"/>
  <text class="title" x="40" y="52">A · 后处理不能增加源信息</text><text class="sub" x="40" y="76">Markov chain：X → Y → Z</text>
  <rect class="box1" x="48" y="112" width="80" height="54" rx="9"/><text class="label" x="80" y="145">X</text>
  <path class="arrow" d="M132 139 L171 139"/><rect class="box2" x="178" y="112" width="80" height="54" rx="9"/><text class="label" x="210" y="145">Y</text>
  <path class="arrow" d="M262 139 L301 139"/><rect class="box3" x="308" y="112" width="54" height="54" rx="9"/><text class="label" x="329" y="145">Z</text>
  <text class="small" x="62" y="195">I(X;Y)</text><rect x="115" y="182" width="235" height="18" rx="5" fill="#e2e8f0"/><rect class="bar2" x="115" y="182" width="220" height="18" rx="5"/>
  <text class="small" x="62" y="230">I(X;Z)</text><rect x="115" y="217" width="235" height="18" rx="5" fill="#e2e8f0"/><rect class="bar3" x="115" y="217" width="145" height="18" rx="5"/>
  <rect class="warn" x="45" y="264" width="320" height="76" rx="9"/>
  <text class="formula" x="61" y="290">I(X;Y) − I(X;Z)</text><text class="formula" x="61" y="316">= I(X;Y | Z) ≥ 0</text>
  <text class="small" x="43" y="373">等号只要求 Z 保留 Y 中关于 X 的部分，</text><text class="small" x="43" y="392">不要求 Z 能完整重建所有 Y。</text>

  <rect class="panel" x="415" y="20" width="370" height="390" rx="14"/>
  <text class="title" x="435" y="52">B · 充分统计量压掉 parameter-free 细节</text><text class="sub" x="435" y="76">Bernoulli 样本：顺序可丢，成功次数保留 p 信息</text>
  <rect class="box1" x="444" y="111" width="185" height="58" rx="9"/><text class="label" x="462" y="136">原始序列 X</text><text class="formula" x="462" y="157">1 0 1 1 0 0 1</text>
  <path class="arrow" d="M634 140 L675 140"/><rect class="box3" x="682" y="111" width="72" height="58" rx="9"/><text class="label" x="700" y="136">T(X)</text><text class="formula" x="708" y="158">4</text>
  <rect x="444" y="208" width="310" height="104" rx="10" fill="#f1f5f9"/>
  <text class="formula" x="461" y="235">pθ(x) = gθ(T(x)) h(x)</text>
  <text class="label" x="461" y="264">给定 T=4 后，所有排列的条件概率</text>
  <text class="label" x="461" y="287">不再依赖 Bernoulli 参数 p。</text>
  <text class="formula" x="452" y="348">I(Θ;T) = I(Θ;X)</text>
  <text class="small" x="438" y="387">sufficient ≠ minimal sufficient ≠ complete ≠ efficient。</text>

  <rect class="panel" x="810" y="20" width="370" height="390" rx="14"/>
  <text class="title" x="830" y="52">C · AI 表示要保任务，不是保全部输入</text><text class="sub" x="830" y="76">Ytask → X → Z，始终 I(Y;Z) ≤ I(Y;X)</text>
  <circle cx="925" cy="181" r="78" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text class="label" x="875" y="144">输入信息 X</text>
  <circle cx="955" cy="181" r="39" fill="#dcfce7" stroke="#059669" stroke-width="2"/><text class="small" x="928" y="185">任务 Y</text>
  <path class="arrow" d="M1010 181 L1070 181"/>
  <circle cx="1112" cy="181" r="50" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text class="label" x="1097" y="186">Z</text>
  <text class="small" x="846" y="280">nuisance / identity 可被压掉</text><text class="small" x="1014" y="280">task-relevant 应保留</text>
  <rect class="box3" x="839" y="310" width="311" height="58" rx="9"/>
  <text class="formula" x="855" y="335">task sufficient: Y ⟂ X | Z</text>
  <text class="formula" x="855" y="357">I(Y;Z) = I(Y;X)</text>
  <text class="small" x="831" y="397">最大化 I(X;Z) 可被 identity / memorization 满足，并非充分目标。</text>
</svg>
