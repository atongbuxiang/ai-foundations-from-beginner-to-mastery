<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">数据处理不等式、信息损失与充分性</title>
<desc id="desc">Markov 条件禁止后处理额外访问原变量；MI chain rule 给出精确损失与等号条件；统计充分性和任务充分性都要求给定表示后目标与原数据条件独立。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">后处理不能凭空增加信息</text>
<rect x="55" y="125" width="75" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="92.5" y="157.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">X</text>
<rect x="170" y="125" width="75" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="207.5" y="157.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">Y</text>
<rect x="285" y="125" width="75" height="52" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="322.5" y="157.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">Z</text>
<line x1="133" y1="151" x2="165" y2="151" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<line x1="248" y1="151" x2="280" y2="151" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<path d="M92 205C155 260 270 260 322 205" fill="none" stroke="#C24135" stroke-width="2.5" stroke-dasharray="7 5"/>
<line x1="196" y1="232" x2="216" y2="252" stroke="#C24135" stroke-width="3"/>
<line x1="216" y1="232" x2="196" y2="252" stroke="#C24135" stroke-width="3"/>
<text x="205" y="282" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">无 skip / shared side information</text>
<text x="45" y="345" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">X -&gt; Y -&gt; Z  iff  X independent Z | Y</text>
<text x="45" y="392" font-size="19" font-weight="700" text-anchor="start" fill="#1F2937" class="math">I(X;Z) &lt;= I(X;Y)</text>
<text x="45" y="440" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">deterministic 与 randomized channel 都适用。</text>
<text x="45" y="478" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">箭头是 factorization，不是自动因果声明。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Chain rule 给出精确损失</text>
<rect x="445" y="100" width="310" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="132.0" font-size="18" font-weight="650" text-anchor="middle" fill="#2563EB">I(X;Y,Z)</text>
<line x1="600" y1="155" x2="600" y2="190" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<rect x="445" y="202" width="310" height="64" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="240.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">I(X;Y) + I(X;Z|Y)</text>
<text x="600" y="294" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">Markov: second term = 0</text>
<line x1="600" y1="310" x2="600" y2="338" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<rect x="445" y="348" width="310" height="64" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="386.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">I(X;Z) + I(X;Y|Z)</text>
<text x="430" y="455" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937" class="math">I(X;Y)-I(X;Z) = I(X;Y|Z)</text>
<text x="430" y="492" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">等号 iff Z 丢失的条件信息为 0。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">充分性必须声明保留谁的信息</text>
<rect x="840" y="100" width="65" height="48" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="872.5" y="130.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">theta</text>
<rect x="955" y="100" width="65" height="48" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="987.5" y="130.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">X</text>
<rect x="1070" y="100" width="80" height="48" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="1110.0" y="130.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">T(X)</text>
<line x1="908" y1="124" x2="950" y2="124" stroke="#1F2937" stroke-width="2.3" marker-end="url(#a3)"/>
<line x1="1023" y1="124" x2="1065" y2="124" stroke="#1F2937" stroke-width="2.3" marker-end="url(#a3)"/>
<text x="830" y="195" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">parameter sufficiency</text>
<text x="830" y="230" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">theta independent X | T(X)</text>
<text x="830" y="272" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">p_theta(x)=g_theta(T(x)) h(x)</text>
<line x1="840" y1="305" x2="1135" y2="305" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="350" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">task sufficiency</text>
<text x="830" y="387" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">Y_task independent X | Z</text>
<text x="830" y="430" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">保留 task 信息 != 最大化 I(X;Z)。</text>
<text x="830" y="472" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">minimal / complete / efficient 是不同性质。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">DPI 的前提是条件独立；等号、参数充分性与任务充分性都必须相对明确目标陈述。</text>
</svg>