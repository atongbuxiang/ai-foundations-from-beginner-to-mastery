<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#f8fafc"/>
  <style>
    .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#475569}.body{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#334155}.math{font:italic 16px Georgia,"Times New Roman",serif;fill:#0f172a}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#64748b}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:1.5}.green{fill:#dcfce7;stroke:#059669;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.purple{fill:#ede9fe;stroke:#7c3aed;stroke-width:1.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:1.5}
  </style>
  <rect class="panel" x="20" y="20" width="370" height="390" rx="14"/><rect class="panel" x="415" y="20" width="370" height="390" rx="14"/><rect class="panel" x="810" y="20" width="370" height="390" rx="14"/>
  <text class="title" x="40" y="53">A · 三类对象问不同问题</text>
  <rect class="blue" x="50" y="91" width="310" height="74" rx="10"/>
  <text class="body" x="68" y="118">f-divergence：density ratio</text>
  <text class="math" x="68" y="145">E under Q [ f(dP/dQ) ]</text>
  <rect class="purple" x="50" y="182" width="310" height="74" rx="10"/>
  <text class="body" x="68" y="209">Bregman：convex tangent gap</text>
  <text class="math" x="68" y="236">F(u)−F(v)−∇F(v)ᵀ(u−v)</text>
  <rect class="green" x="50" y="273" width="310" height="74" rx="10"/>
  <text class="body" x="68" y="300">IPM：test-function expectations</text>
  <text class="math" x="68" y="327">sup over g |difference of means|</text>
  <text class="small" x="50" y="382">KL/TV 可跨家族；分类不是互斥标签。</text>
  <text class="title" x="435" y="53">B · 点质量平移揭示 topology</text>
  <text class="sub" x="435" y="78">P=δ₀，Qθ=δθ；θ→0</text>
  <line x1="465" y1="330" x2="748" y2="330" stroke="#64748b" stroke-width="1.5"/><line x1="465" y1="112" x2="465" y2="330" stroke="#64748b" stroke-width="1.5"/>
  <line x1="606" y1="108" x2="606" y2="338" stroke="#cbd5e1" stroke-dasharray="5 5"/>
  <path d="M478 132H596M616 132H738" stroke="#dc2626" stroke-width="4"/>
  <text class="small" x="664" y="122">JS=log 2 / TV=1</text>
  <path d="M606 330L738 170M606 330L478 170" stroke="#059669" stroke-width="4" fill="none"/>
  <text class="small" x="664" y="190">W₁=|θ|</text>
  <path d="M478 184C520 258 564 315 606 330C649 315 692 258 738 184" stroke="#2563eb" stroke-width="3" fill="none"/>
  <text class="small" x="474" y="205">RBF-MMD</text>
  <text class="small" x="598" y="355">0</text><text class="small" x="726" y="355">θ</text>
  <text class="small" x="445" y="385">KL 对 θ≠0 为 ∞；几何连续性与 density overlap 不同。</text>
  <text class="title" x="830" y="53">C · 选择还要看估计与训练</text>
  <rect class="amber" x="840" y="88" width="310" height="55" rx="10"/>
  <text class="body" x="857" y="112">Population quantity</text><text class="small" x="857" y="132">定义、support、ground cost、topology</text>
  <text class="body" x="985" y="168">↓</text>
  <rect class="blue" x="840" y="183" width="310" height="55" rx="10"/>
  <text class="body" x="857" y="207">Finite-sample estimator</text><text class="small" x="857" y="227">ratio / OT / U-statistic / critic</text>
  <text class="body" x="985" y="263">↓</text>
  <rect class="purple" x="840" y="278" width="310" height="55" rx="10"/>
  <text class="body" x="857" y="302">Training surrogate</text><text class="small" x="857" y="322">restricted class + optimizer + regularizer</text>
  <rect class="red" x="840" y="355" width="310" height="35" rx="8"/>
  <text class="small" x="855" y="377">三层数值不能因名字相似而视作同一个量。</text>
</svg>
