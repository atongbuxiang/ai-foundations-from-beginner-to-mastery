<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">最大熵约束、指数族与凸对偶</title>
<desc id="desc">MaxEnt 在指定 support、reference measure 与 moment constraints 的可行集上优化；Lagrange 条件产生指数族；log-partition 的梯度与 Hessian 给出 moment matching 和 covariance curvature。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">先在可行集里最大化 entropy</text>
<path d="M70 390L205 100L345 390Z" fill="none" stroke="#2563EB" stroke-width="3"/>
<line x1="105" y1="330" x2="300" y2="185" stroke="#C24135" stroke-width="3"/>
<text x="238" y="185" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">E_p[T]=tau</text>
<path d="M125 345C165 260 245 220 300 205" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M145 360C185 300 240 270 280 250" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="235" cy="234" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="245" y="224" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">p*</text>
<text x="45" y="430" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937" class="math">maximize H(p)</text>
<text x="45" y="465" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">s.t. p&gt;=0, sum p=1, E_p[T]=tau</text>
<text x="45" y="500" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">support / base measure 改变，可行集与答案也变。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Lagrange 条件产生指数族</text>
<rect x="445" y="102" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="137.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">entropy + normalization + moments</text>
<line x1="600" y1="164" x2="600" y2="202" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<rect x="445" y="214" width="310" height="68" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="254.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">log p(x) = log h(x) + eta^T T(x) - A(eta)</text>
<line x1="600" y1="286" x2="600" y2="324" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<rect x="445" y="336" width="310" height="58" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="600.0" y="371.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">p_eta(x)=h(x) exp[eta^T T(x)-A]</text>
<text x="430" y="438" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">A(eta)=log integral h exp(eta^T T)</text>
<text x="430" y="478" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">A 不是装饰常数：它负责归一化。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Dual 梯度 = moment mismatch</text>
<text x="830" y="118" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937" class="math">dual: A(eta) - eta^T tau</text>
<line x1="840" y1="150" x2="1135" y2="150" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="200" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">gradient A(eta) = E_eta[T]</text>
<text x="830" y="242" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">gradient dual = E_eta[T] - tau</text>
<text x="830" y="284" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">Hessian A(eta) = Cov_eta[T]</text>
<line x1="840" y1="320" x2="1135" y2="320" stroke="#D7DEE8" stroke-width="2"/>
<rect x="845" y="345" width="125" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="907.5" y="377.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">empirical tau</text>
<rect x="1030" y="345" width="110" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="1085.0" y="377.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">model moment</text>
<line x1="973" y1="371" x2="1025" y2="371" stroke="#1F2937" stroke-width="2.3" marker-end="url(#a3)"/>
<text x="830" y="435" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">moment matching 连接 MaxEnt dual 与 MLE。</text>
<text x="830" y="475" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">边界 tau 可能令 eta 发散或 optimizer 不存在。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">MaxEnt、指数族与 moment matching 是同一凸对偶结构，但前提是可行性、存在性与参数最小性。</text>
</svg>