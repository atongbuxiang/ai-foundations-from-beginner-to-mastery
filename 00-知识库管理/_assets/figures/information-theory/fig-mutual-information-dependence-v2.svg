<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">互信息、PMI 与独立基线</title>
<desc id="desc">互信息比较真实 joint 与保持 marginals 的 product baseline；PMI 是单个格子的有符号 log-ratio，MI 是 joint 加权平均；entropy reduction 给出同一量的预测解释。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Joint 与 product baseline 比较</text>
<rect x="60" y="105" width="66" height="66" rx="3" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="93" y="144" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">0.34</text>
<rect x="142" y="105" width="66" height="66" rx="3" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="175" y="144" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">0.06</text>
<rect x="224" y="105" width="66" height="66" rx="3" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="257" y="144" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">0.02</text>
<rect x="60" y="187" width="66" height="66" rx="3" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="93" y="226" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">0.05</text>
<rect x="142" y="187" width="66" height="66" rx="3" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="175" y="226" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">0.28</text>
<rect x="224" y="187" width="66" height="66" rx="3" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="257" y="226" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">0.05</text>
<rect x="60" y="269" width="66" height="66" rx="3" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="93" y="308" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">0.01</text>
<rect x="142" y="269" width="66" height="66" rx="3" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="175" y="308" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">0.07</text>
<rect x="224" y="269" width="66" height="66" rx="3" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="257" y="308" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">0.12</text>
<text x="45" y="390" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">baseline = P_X P_Y</text>
<text x="45" y="430" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">I(X;Y)=KL(P_XY || P_X P_Y)</text>
<text x="45" y="475" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">baseline 保留 marginals，只移除依赖。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">PMI 可正可负，MI 是平均</text>
<rect x="445" y="110" width="135" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="512.5" y="145.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">PMI &gt; 0</text>
<rect x="625" y="110" width="135" height="58" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="692.5" y="145.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">PMI &lt; 0</text>
<text x="512" y="205" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">joint 比独立更常见</text>
<text x="692" y="205" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">joint 比独立更少见</text>
<line x1="470" y1="285" x2="740" y2="285" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="500" cy="285" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="555" cy="285" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="610" cy="285" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="665" cy="285" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="720" cy="285" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="600" y="330" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">joint-weighted average</text>
<text x="430" y="385" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">PMI(x;y)=log p(x,y)/[p(x)p(y)]</text>
<text x="430" y="425" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">I(X;Y)=E_XY[PMI(X;Y)] &gt;= 0</text>
<text x="430" y="468" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">平均非负不表示每个局部证据非负。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">等价于观察后减少的 entropy</text>
<rect x="845" y="125" width="270" height="58" rx="4" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<rect x="845" y="230" width="165" height="58" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="980" y="161" font-size="18" font-weight="700" text-anchor="middle" fill="#2563EB">H(X)</text>
<text x="928" y="266" font-size="18" font-weight="700" text-anchor="middle" fill="#0F766E">H(X|Y)</text>
<line x1="1015" y1="210" x2="1115" y2="210" stroke="#C24135" stroke-width="3"/>
<text x="1065" y="201" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">I(X;Y)</text>
<text x="830" y="345" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">I = H(X)-H(X|Y) = H(Y)-H(Y|X)</text>
<text x="830" y="390" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">I=0 iff independent（离散/良好情形）。</text>
<text x="830" y="432" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">能检测非线性统计依赖；</text>
<text x="830" y="468" font-size="16" font-weight="650" text-anchor="start" fill="#C24135">不提供因果方向，也不保证易估计。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">互信息同时是 joint-to-product KL、平均 PMI 与 entropy reduction；三种表示共享同一 joint。</text>
</svg>