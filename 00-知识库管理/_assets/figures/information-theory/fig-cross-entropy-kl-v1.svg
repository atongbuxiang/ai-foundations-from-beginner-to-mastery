<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">交叉熵、KL 分解与方向性</title>
  <desc id="desc">三面板展示交叉熵由熵与 KL 构成、KL 的方向和支撑代价、以及 softmax logits 的稳定交叉熵计算链。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 20px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#0f172a}.sub{font:14px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#475569}.label{font:14px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#64748b}.formula{font:italic 16px Georgia,serif;fill:#0f172a}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.blue{fill:#2563eb}.violet{fill:#7c3aed}.red{fill:#dc2626}.green{fill:#059669}.barbg{fill:#e2e8f0}.box1{fill:#dbeafe;stroke:#2563eb;stroke-width:1.5}.box2{fill:#ede9fe;stroke:#7c3aed;stroke-width:1.5}.box3{fill:#dcfce7;stroke:#059669;stroke-width:1.5}.code{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#0f172a}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker>
  </defs>
  <rect class="bg" width="1200" height="430"/>

  <rect class="panel" x="20" y="20" width="370" height="390" rx="14"/>
  <text class="title" x="40" y="52">A · 错误模型的平均额外码长</text>
  <text class="sub" x="40" y="76">数据来自 P，编码概率来自 Q</text>
  <text class="label" x="52" y="121">H(P,Q)</text>
  <rect class="barbg" x="52" y="138" width="300" height="54" rx="8"/>
  <rect class="blue" x="52" y="138" width="205" height="54" rx="8"/>
  <path d="M257 138 H352 V192 H257 Z" class="violet"/>
  <text x="93" y="171" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Noto Sans SC,sans-serif" font-size="15" font-weight="700">H(P)：不可约平均码长</text>
  <text x="291" y="171" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Noto Sans SC,sans-serif" font-size="15" font-weight="700">KL</text>
  <text class="formula" x="55" y="236">H(P,Q) = H(P) + D(P||Q)</text>
  <rect x="52" y="267" width="300" height="72" rx="10" fill="#f1f5f9"/>
  <text class="label" x="68" y="292">Gibbs inequality</text>
  <text class="formula" x="68" y="318">log t ≤ t−1  ⇒  D(P||Q) ≥ 0</text>
  <text class="small" x="44" y="372">某个样本可在 Q 下更短；非负性只保证 P-平均。</text>
  <text class="small" x="44" y="393">P 固定时，最小 cross-entropy 等价于最小 forward KL。</text>

  <rect class="panel" x="415" y="20" width="370" height="390" rx="14"/>
  <text class="title" x="435" y="52">B · 方向与 support 都不能省略</text>
  <text class="sub" x="435" y="76">KL 是 divergence，不是 metric distance</text>
  <text class="label" x="444" y="101">Bernoulli success probability</text>
  <line x1="458" y1="157" x2="744" y2="157" stroke="#64748b" stroke-width="2"/>
  <circle class="blue" cx="487" cy="157" r="10"/><text class="small" x="469" y="185">P=0.1</text>
  <circle class="violet" cx="601" cy="157" r="10"/><text class="small" x="583" y="185">Q=0.5</text>
  <path class="arrow" d="M501 137 C530 104,562 104,590 137"/>
  <path class="arrow" d="M590 207 C560 239,529 239,501 207"/>
  <text class="small" x="626" y="126">D(P||Q)≈0.368</text>
  <text class="small" x="516" y="253">D(Q||P)≈0.511</text>
  <rect x="440" y="281" width="320" height="73" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text class="label" x="456" y="306">若 P(x)&gt;0 而 Q(x)=0：</text>
  <text class="formula" x="456" y="334">D(P||Q)=+∞</text>
  <text class="small" x="437" y="385">对称化仍不自动满足三角不等式；必须写清方向。</text>

  <rect class="panel" x="810" y="20" width="370" height="390" rx="14"/>
  <text class="title" x="830" y="52">C · 从 logits 稳定计算 CE</text>
  <text class="sub" x="830" y="76">避免“先 softmax，再 log”的上溢/下溢</text>
  <rect class="box1" x="836" y="112" width="105" height="58" rx="9"/>
  <text class="label" x="869" y="137">logits</text><text class="code" x="853" y="158">z ∈ Rᴷ</text>
  <path class="arrow" d="M946 141 L978 141"/>
  <rect class="box2" x="984" y="112" width="165" height="58" rx="9"/>
  <text class="label" x="1004" y="137">logsumexp − target</text>
  <text class="code" x="1004" y="158">LSE(z) − rᵀz</text>
  <path class="arrow" d="M1066 176 L1066 218"/>
  <rect class="box3" x="861" y="225" width="288" height="69" rx="9"/>
  <text class="formula" x="879" y="251">∇z ℓ = q − r</text>
  <text class="formula" x="879" y="278">∇²z ℓ = Diag(q) − qqᵀ ⪰ 0</text>
  <text class="label" x="837" y="331">对象审计</text>
  <text class="small" x="837" y="353">• categorical：一个归一化轴，类别互斥</text>
  <text class="small" x="837" y="374">• multi-label：多个 Bernoulli，不是整体 categorical</text>
  <text class="small" x="837" y="395">• clipping / weights / focal 会改变原目标含义</text>
</svg>
