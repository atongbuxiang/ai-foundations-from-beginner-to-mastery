<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#f8fafc"/>
  <style>
    .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#475569}.body{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#334155}.math{font:italic 16px Georgia,"Times New Roman",serif;fill:#0f172a}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#64748b}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:1.5}.green{fill:#dcfce7;stroke:#059669;stroke-width:1.5}.amber{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.purple{fill:#ede9fe;stroke:#7c3aed;stroke-width:1.5}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:1.5}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
  <rect class="panel" x="20" y="20" width="370" height="390" rx="14"/><rect class="panel" x="415" y="20" width="370" height="390" rx="14"/><rect class="panel" x="810" y="20" width="370" height="390" rx="14"/>

  <text class="title" x="40" y="53">A · rate–distortion 是一条 frontier</text>
  <text class="sub" x="40" y="78">先固定 source、distortion 与 rate 单位</text>
  <line x1="76" y1="335" x2="350" y2="335" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="76" y1="335" x2="76" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="small" x="341" y="357">D</text><text class="small" x="58" y="112">R</text>
  <path d="M82 122 C130 145,162 194,190 245 C220 300,270 330,338 335" fill="none" stroke="#2563eb" stroke-width="4"/>
  <circle cx="82" cy="122" r="6" fill="#7c3aed"/><circle cx="338" cy="335" r="6" fill="#059669"/>
  <text class="small" x="92" y="118">R(0)=H(X)</text><text class="small" x="270" y="322">R(D₀)=0</text>
  <line x1="145" y1="180" x2="270" y2="290" stroke="#d97706" stroke-width="2.5"/>
  <text class="small" x="160" y="170">supporting line：slope = −β</text>
  <rect class="blue" x="52" y="365" width="306" height="30" rx="8"/><text class="small" x="67" y="385">theorem curve ≠ 受限 neural codec 的若干实验点</text>

  <text class="title" x="435" y="53">B · IB 保任务、压 nuisance</text>
  <text class="sub" x="435" y="78">Y − X − Z；横轴 input rate，纵轴 relevance</text>
  <line x1="468" y1="326" x2="752" y2="326" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="468" y1="326" x2="468" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="small" x="681" y="350">I(X;Z)</text><text class="small" x="425" y="112">I(Z;Y)</text>
  <path d="M470 326 C505 260,550 205,608 160 C652 126,700 112,748 112" fill="none" stroke="#059669" stroke-width="4"/>
  <line x1="468" y1="112" x2="752" y2="112" stroke="#cbd5e1" stroke-dasharray="5 5"/>
  <text class="small" x="650" y="102">I(X;Y) ceiling</text>
  <circle cx="610" cy="159" r="7" fill="#2563eb"/><circle cx="735" cy="113" r="7" fill="#dc2626"/>
  <text class="small" x="527" y="150">compressed relevant code</text><text class="small" x="650" y="137">记住 nuisance</text>
  <rect class="green" x="447" y="365" width="306" height="30" rx="8"/><text class="small" x="461" y="385">同 relevance 下，较小 I(X;Z) 才是更强 bottleneck</text>

  <text class="title" x="830" y="53">C · MDL 必须计算完整可译码描述</text>
  <text class="sub" x="830" y="78">短 data NLL 只是其中一层</text>
  <rect class="purple" x="850" y="105" width="290" height="52" rx="9"/>
  <text class="body" x="870" y="128">model / architecture / tokenizer</text><text class="small" x="870" y="147">双方是否预先共享？</text>
  <text class="body" x="990" y="178">＋</text>
  <rect class="amber" x="850" y="191" width="290" height="52" rx="9"/>
  <text class="body" x="870" y="214">parameters / update / precision</text><text class="small" x="870" y="233">two-part、prior 或 sequential protocol</text>
  <text class="body" x="990" y="264">＋</text>
  <rect class="blue" x="850" y="277" width="290" height="52" rx="9"/>
  <text class="body" x="870" y="300">data residual / predictive log-loss</text><text class="small" x="870" y="319">held-out / prequential，统一 log base</text>
  <rect class="red" x="850" y="354" width="290" height="42" rx="9"/>
  <text class="small" x="866" y="371">total length 最短是 coding/model-selection 证据；</text><text class="small" x="866" y="387">不是 causal truth 或部署可靠性的充分条件。</text>
</svg>
