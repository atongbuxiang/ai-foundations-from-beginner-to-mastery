<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">结果越罕见，自信息越大</text>
<line x1="55" y1="390" x2="355" y2="390" stroke="#D7DEE8" stroke-width="2"/>
<line x1="70" y1="420" x2="70" y2="95" stroke="#D7DEE8" stroke-width="2"/>
