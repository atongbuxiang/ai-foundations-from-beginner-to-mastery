<text x="205" y="125" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937" class="math">i(x) = -log_2 p(x)</text>
<text x="335" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">p</text>
<text x="52" y="112" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">bits</text>
<circle cx="97" cy="245" r="6" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="318" cy="378" r="6" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="45" y="455" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">同一结果的 surprise 取决于所用模型。</text>
<text x="45" y="488" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">独立概率相乘 -&gt; 信息相加。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">熵是分布上的加权平均</text>
<rect x="455" y="140.0" width="42" height="210.0" rx="2" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="476" y="380" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">x1</text>
<circle cx="476" cy="167.0" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<rect x="527" y="245.0" width="42" height="105.0" rx="2" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="548" y="380" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">x2</text>
<circle cx="548" cy="209.0" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<rect x="599" y="297.5" width="42" height="52.5" rx="2" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="620" y="380" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">x3</text>
<circle cx="620" cy="251.0" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<rect x="671" y="297.5" width="42" height="52.5" rx="2" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="692" y="380" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">x4</text>
<circle cx="692" cy="251.0" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="430" y="105" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">点：-log p_i</text>
<text x="430" y="420" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">H(X) = sum_i p_i[-log p_i]</text>
<text x="430" y="460" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">realization 有不同 surprise；entropy 只有一个平均值。</text>
<text x="430" y="493" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">均匀分布在固定有限 support 上达到最大熵。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">前缀树把码长变成可译码约束</text>
<circle cx="900" cy="120" r="10" fill="#1F2937" stroke="#1F2937" stroke-width="2"/>
<line x1="895" y1="130" x2="850" y2="215" stroke="#2563EB" stroke-width="2.5"/>
<line x1="905" y1="130" x2="1020" y2="215" stroke="#2563EB" stroke-width="2.5"/>
<line x1="1015" y1="235" x2="970" y2="325" stroke="#0F766E" stroke-width="2.5"/>
<line x1="1025" y1="235" x2="1080" y2="325" stroke="#0F766E" stroke-width="2.5"/>
<circle cx="850" cy="225" r="9" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<circle cx="1020" cy="225" r="9" fill="#1F2937" stroke="#1F2937" stroke-width="2.5"/>
<circle cx="970" cy="335" r="9" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<circle cx="1080" cy="335" r="9" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="872" y="170" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">0</text>
<text x="960" y="170" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">1</text>
<text x="980" y="282" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">0</text>
<text x="1058" y="282" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">1</text>
<text x="850" y="255" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">x1: 0</text>
<text x="970" y="367" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">x2: 10</text>
<text x="1080" y="367" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">x3: 11</text>
<text x="830" y="400" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">Kraft: sum_i 2^(-l_i) &lt;= 1</text>
<text x="830" y="440" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">H_2(X) &lt;= L &lt; H_2(X)+1</text>
<text x="830" y="480" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">ideal length 可为实数；单符号码长必须为整数。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">负对数连接概率乘法与长度加法；entropy 是平均理想长度，前缀码再加入可译码约束。</text>
</svg>