<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">联合熵、条件熵与链式编码</title>
<desc id="desc">描述一对变量可以一次联合编码，也可以先编码 X 再按 X 选择 Y 的条件码；序列重复这一分解，得到 autoregressive likelihood 与 token NLL。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">一次描述联合结果</text>
<rect x="55" y="110" width="125" height="80" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="117" y="141" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">x1,y1</text>
<text x="117" y="170" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">p=0.42</text>
<rect x="200" y="110" width="125" height="80" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="262" y="141" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">x1,y2</text>
<text x="262" y="170" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">p=0.08</text>
<rect x="55" y="220" width="125" height="80" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="117" y="251" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">x2,y1</text>
<text x="117" y="280" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">p=0.12</text>
<rect x="200" y="220" width="125" height="80" rx="6" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="262" y="251" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">x2,y2</text>
<text x="262" y="280" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">p=0.38</text>
<text x="45" y="365" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">i(x,y) = -log p(x,y)</text>
<text x="45" y="407" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">H(X,Y) = E[i(X,Y)]</text>
<text x="45" y="458" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">两个变量不代表两份独立信息。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">分阶段描述完全等价</text>
<rect x="450" y="110" width="120" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="510.0" y="142.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">encode X</text>
<rect x="630" y="110" width="130" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="695.0" y="142.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">encode Y | X</text>
<line x1="573" y1="136" x2="625" y2="136" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<text x="430" y="220" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">p(x,y)=p(x)p(y|x)</text>
<text x="430" y="266" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">-log p(x,y)</text>
<text x="430" y="302" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">= -log p(x) - log p(y|x)</text>
<line x1="440" y1="340" x2="760" y2="340" stroke="#D7DEE8" stroke-width="2"/>
<text x="430" y="390" font-size="18" font-weight="700" text-anchor="start" fill="#1F2937" class="math">H(X,Y) = H(X) + H(Y|X)</text>
<text x="430" y="438" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">H(Y|X) 是对 X 的加权平均，不是固定 x 的单值。</text>
<text x="430" y="477" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">离散情形：H(Y|X) &lt;= H(Y)。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">序列链式法则就是逐 token 预测</text>
<rect x="840" y="115" width="48" height="46" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="864.0" y="144.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">X1</text>
<line x1="889" y1="138" x2="905" y2="138" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="910" y="115" width="48" height="46" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="934.0" y="144.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">X2</text>
<line x1="959" y1="138" x2="975" y2="138" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="980" y="115" width="48" height="46" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="1004.0" y="144.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">X3</text>
<line x1="1029" y1="138" x2="1045" y2="138" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="1050" y="115" width="48" height="46" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="1074.0" y="144.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">X4</text>
<line x1="1099" y1="138" x2="1115" y2="138" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="1120" y="115" width="48" height="46" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="1144.0" y="144.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">XT</text>
<text x="830" y="225" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">p(x_1:T)=product_t p(x_t|x_&lt;t)</text>
<text x="830" y="275" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">H(X_1:T)=sum_t H(X_t|X_&lt;t)</text>
<text x="830" y="330" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">token NLL 要声明 mask、EOS 与 reduction。</text>
<text x="830" y="380" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">条件箭头描述 factorization，</text>
<text x="830" y="415" font-size="16" font-weight="650" text-anchor="start" fill="#C24135">本身不是因果方向。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">概率链式分解经负对数与期望，精确变成联合、条件与序列 entropy 的加法。</text>
</svg>