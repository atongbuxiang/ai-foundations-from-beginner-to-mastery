<text x="70" y="225" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">R(D)</text>
<text x="330" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">D</text>
<text x="45" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">distortion function 是问题定义，不是自然常数。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">IB：任务相关压缩</text>
<rect x="445" y="105" width="70" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="480.0" y="136.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">X</text>
<rect x="590" y="105" width="70" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="625.0" y="136.0" font-size="17" font-weight="650" text-anchor="middle" fill="#0F766E">Z</text>
