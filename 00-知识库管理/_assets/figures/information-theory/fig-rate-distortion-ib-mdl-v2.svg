<text x="735.0" y="266.0" font-size="17" font-weight="650" text-anchor="middle" fill="#C24135">Y</text>
<line x1="518" y1="130" x2="585" y2="130" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<line x1="735" y1="230" x2="660" y2="157" stroke="#C24135" stroke-width="2.4" marker-end="url(#a2)"/>
<text x="550" y="100" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">compress</text>
<text x="690" y="180" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">relevance</text>
<text x="430" y="330" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937" class="math">min I(X;Z) - beta I(Z;Y)</text>
<text x="430" y="375" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">Markov structure: Y - X - Z</text>
<text x="430" y="420" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">保留 task 信息 != 保留全部输入。</text>
<text x="430" y="465" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">variational bounds 改变可优化 surrogate。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">MDL：完整可译码协议</text>
<rect x="850" y="110" width="270" height="62" rx="4" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<rect x="850" y="172" width="270" height="76" rx="4" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<rect x="850" y="248" width="270" height="92" rx="4" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="985" y="147" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">protocol / model class</text>
<text x="985" y="216" font-size="16" font-weight="700" text-anchor="middle" fill="#0F766E">model / parameter description</text>
<text x="985" y="298" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135">data given model</text>
<text x="830" y="390" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">L_total = L(protocol,model) + L(data|model)</text>
<text x="830" y="430" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">two-part / mixture / NML / prequential 不同。</text>
<text x="830" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">短描述不自动证明 causal truth 或泛化。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">三种目标都出现 rate/complexity 权衡，但随机对象、保真目标与可译码协议完全不同。</text>
</svg>