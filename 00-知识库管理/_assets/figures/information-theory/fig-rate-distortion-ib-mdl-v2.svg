<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">率失真、信息瓶颈与最小描述长度的对象分层</title>
<desc id="desc">Rate-distortion 优化重建率与 distortion；information bottleneck 压缩输入信息并保留任务信息；MDL 比较可译码协议下模型与数据的总描述长度。</desc>
