<line x1="620" y1="100" x2="620" y2="385" stroke="#1F2937" stroke-width="2" stroke-dasharray="7 5"/>
<text x="620" y="88" font-size="16" font-weight="700" text-anchor="middle" fill="#1F2937">H(X)</text>
<text x="705" y="190" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">n grows</text>
<text x="430" y="430" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">-(1/n) log p(X^n) -&gt; H(X)</text>
<text x="430" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">约 2^(nH) 个序列，各自概率约 2^(-nH)。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Rate H 是 fixed-length 一阶阈值</text>
<line x1="850" y1="300" x2="1140" y2="300" stroke="#D7DEE8" stroke-width="3"/>
<line x1="990" y1="240" x2="990" y2="350" stroke="#C24135" stroke-width="3"/>
<text x="990" y="222" font-size="18" font-weight="700" text-anchor="middle" fill="#C24135">H</text>
<text x="900" y="280" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">R &lt; H</text>
<text x="1070" y="280" font-size="17" font-weight="700" text-anchor="middle" fill="#0F766E">R &gt; H</text>
<text x="830" y="380" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">codewords: 2^(nR)</text>
<text x="830" y="417" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">typical sequences: about 2^(nH)</text>
<text x="830" y="455" font-size="15" font-weight="400" text-anchor="start" fill="#0F766E">R&gt;H：可覆盖典型集，error -&gt; 0</text>
<text x="830" y="490" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">R&lt;H：容量指数级不足（converse）。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">单符号前缀码解决可译性；AEP 与典型集才给出长 block almost-lossless 压缩的 entropy 阈值。</text>
</svg>