<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">前缀编码、典型集与无损压缩阈值</title>
<desc id="desc">前缀树保证即时可译；AEP 使每符号 surprise 集中在 entropy 附近；典型集大小约为 2^(nH)，从而形成 fixed-length almost-lossless coding 的 H 阈值。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Prefix-free：叶子即时可译</text>
<circle cx="190" cy="105" r="9" fill="#1F2937" stroke="#1F2937" stroke-width="2"/>
<line x1="185" y1="115" x2="120" y2="205" stroke="#2563EB" stroke-width="2.5"/>
<line x1="195" y1="115" x2="270" y2="205" stroke="#2563EB" stroke-width="2.5"/>
<circle cx="120" cy="215" r="9" fill="#FFFEFB" stroke="#C24135" stroke-width="2.5"/>
<circle cx="270" cy="215" r="9" fill="#1F2937" stroke="#1F2937" stroke-width="2.5"/>
<line x1="265" y1="225" x2="225" y2="315" stroke="#0F766E" stroke-width="2.5"/>
<line x1="275" y1="225" x2="325" y2="315" stroke="#0F766E" stroke-width="2.5"/>
<circle cx="225" cy="325" r="9" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<circle cx="325" cy="325" r="9" fill="#FFFEFB" stroke="#0F766E" stroke-width="2.5"/>
<text x="145" y="155" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">0</text>
<text x="235" y="155" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">1</text>
<text x="238" y="270" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">0</text>
<text x="305" y="270" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">1</text>
<text x="120" y="247" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">a: 0</text>
<text x="225" y="357" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">b: 10</text>
<text x="325" y="357" font-size="15" font-weight="700" text-anchor="middle" fill="#1F2937">c: 11</text>
<text x="45" y="420" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">prefix-free =&gt; uniquely decodable</text>
<text x="45" y="458" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">Kraft / McMillan 控制可用叶子容量。</text>
<text x="45" y="492" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">nonsingular 不自动保证 concatenation 唯一。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">AEP：每符号 surprise 集中</text>
<line x1="440" y1="385" x2="770" y2="385" stroke="#D7DEE8" stroke-width="2"/>
