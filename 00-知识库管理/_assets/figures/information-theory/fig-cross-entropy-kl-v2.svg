<text x="870" y="118" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">P: two modes</text>
<text x="1060" y="155" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">Q</text>
<text x="830" y="380" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">KL(P||Q): P-weighted; missing P support is severe</text>
<text x="830" y="420" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">KL(Q||P): Q-weighted; can prefer one mode</text>
<text x="830" y="465" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">图示是优化倾向，不是普遍有限样本定理。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">交叉熵的 expectation 方向、KL 的参数顺序与支持覆盖必须在每次应用中显式核对。</text>
</svg>