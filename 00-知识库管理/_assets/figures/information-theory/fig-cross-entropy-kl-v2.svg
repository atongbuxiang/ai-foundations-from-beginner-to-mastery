<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">交叉熵、KL 方向与支持失配</title>
<desc id="desc">数据由 P 加权而用 Q 的码长评分，得到 cross-entropy；它分解为不可约 entropy 与失配 KL；KL 的方向和支持关系决定惩罚形态与是否有限。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">P 产生数据，Q 提供码长</text>
<rect x="55" y="143.4" width="25" height="201.6" rx="1" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<rect x="84" y="252.6" width="25" height="92.4" rx="1" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="82" y="378" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">x1</text>
<rect x="127" y="219.0" width="25" height="126.0" rx="1" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<rect x="156" y="227.39999999999998" width="25" height="117.60000000000001" rx="1" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="154" y="378" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">x2</text>
<rect x="199" y="277.8" width="25" height="67.2" rx="1" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<rect x="228" y="214.8" width="25" height="130.2" rx="1" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="226" y="378" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">x3</text>
<rect x="271" y="319.8" width="25" height="25.2" rx="1" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<rect x="300" y="265.2" width="25" height="79.8" rx="1" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="298" y="378" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">x4</text>
<text x="45" y="105" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">P weight</text>
<text x="135" y="105" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">Q score</text>
<text x="45" y="420" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">H(P,Q)=E_P[-log q(X)]</text>
<text x="45" y="460" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">外层 expectation 在 P；log 内评价 Q。</text>
<text x="45" y="492" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">q(x)=0 且 p(x)&gt;0 -&gt; infinite cost</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">交叉熵 = 不可约项 + 失配项</text>
<rect x="450" y="155" width="165" height="70" rx="5" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<rect x="615" y="155" width="130" height="70" rx="5" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="532" y="195" font-size="20" font-weight="700" text-anchor="middle" fill="#2563EB">H(P)</text>
<text x="680" y="195" font-size="17" font-weight="700" text-anchor="middle" fill="#C24135">KL(P||Q)</text>
<text x="600" y="275" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937" class="math">H(P,Q) = H(P) + D_KL(P||Q)</text>
<text x="430" y="335" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">固定 P 时：min_Q cross-entropy</text>
<text x="430" y="372" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">等价于 min_Q KL(P||Q)。</text>
<text x="430" y="425" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">经验 NLL 是样本平均；总体结论还需泛化。</text>
<text x="430" y="468" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">KL&gt;=0，但不是距离 metric。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">方向改变“漏模态”与“追模态”</text>
<line x1="840" y1="320" x2="1140" y2="320" stroke="#D7DEE8" stroke-width="2"/>
<line x1="855" y1="345" x2="855" y2="95" stroke="#D7DEE8" stroke-width="2"/>
