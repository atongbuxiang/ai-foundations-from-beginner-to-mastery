<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">变分对象、ELBO 证据分解与误差来源</title>
<desc id="desc">生成模型定义 joint、evidence 与 model posterior；q 是人为选择的近似；log evidence 精确分解为 ELBO 加 reverse-KL gap，训练误差还需区分 family、amortization、optimization 与 Monte Carlo。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Posterior 与 q 是不同对象</text>
<rect x="55" y="100" width="110" height="52" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="110.0" y="132.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">prior p(z)</text>
<rect x="240" y="100" width="120" height="52" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="300.0" y="132.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">p(x|z)</text>
<line x1="168" y1="126" x2="235" y2="126" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<rect x="55" y="220" width="305" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="207.5" y="255.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">joint p(x,z) = p(z)p(x|z)</text>
<line x1="205" y1="156" x2="205" y2="214" stroke="#1F2937" stroke-width="2.3" marker-end="url(#a3)"/>
<rect x="55" y="340" width="138" height="56" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="124.0" y="374.0" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">posterior p(z|x)</text>
<rect x="222" y="340" width="138" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="291.0" y="374.0" font-size="15" font-weight="650" text-anchor="middle" fill="#2563EB">approx q_phi(z|x)</text>
<text x="45" y="440" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">evidence p(x)=integral p(x,z) dz</text>
<text x="45" y="480" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">q 由 inference design 定义，不是 posterior 别名。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Evidence = ELBO + KL gap</text>
<rect x="450" y="145" width="190" height="78" rx="5" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<rect x="640" y="145" width="115" height="78" rx="5" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="545" y="190" font-size="20" font-weight="700" text-anchor="middle" fill="#0F766E">ELBO(q)</text>
<text x="698" y="181" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">KL(q ||</text>
<text x="698" y="207" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">p(z|x))</text>
<text x="600" y="275" font-size="17" font-weight="700" text-anchor="middle" fill="#1F2937" class="math">log p_theta(x) = ELBO + KL gap</text>
<text x="430" y="330" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">ELBO = E_q[log p(x,z) - log q(z)]</text>
<text x="430" y="375" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">= E_q log p(x|z) - KL(q||p(z))</text>
<text x="430" y="425" font-size="15" font-weight="400" text-anchor="start" fill="#0F766E">gap=0 iff q = model posterior a.e.</text>
<text x="430" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#C24135">support failure 可让 ELBO/KL 失去有限值。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">“Gap”要按来源拆开</text>
<circle cx="842" cy="113" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="857" y="118" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">family gap</text>
<text x="857" y="148" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">近似族表示不了 posterior</text>
<circle cx="842" cy="197" r="5" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="857" y="202" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">amortization gap</text>
<text x="857" y="232" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">shared encoder 不达 per-x optimum</text>
<circle cx="842" cy="281" r="5" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="857" y="286" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">optimization gap</text>
<text x="857" y="316" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">参数化目标尚未优化到位</text>
<circle cx="842" cy="365" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="857" y="370" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">Monte Carlo error</text>
<text x="857" y="400" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">objective / gradient 随机估计</text>
<line x1="835" y1="445" x2="1135" y2="445" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="480" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">另有 model misspecification 与 evaluation gap。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">ELBO 是精确证据分解中的下界项；近似、摊销、优化与随机估计误差必须分别诊断。</text>
</svg>