<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#f8fafc"/>
  <style>
    .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#475569}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#64748b}.math{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}
  </style>
  <defs><marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#059669"/></marker><marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#dc2626"/></marker></defs>
  <rect class="panel" x="20" y="20" width="370" height="390" rx="14"/><rect class="panel" x="415" y="20" width="370" height="390" rx="14"/><rect class="panel" x="810" y="20" width="370" height="390" rx="14"/>

  <text class="title" x="40" y="53">A · stochastic oracle 是条件性声明</text><text class="sub" x="40" y="78">历史固定后：随机方向 = 真梯度 + 零均值误差</text>
  <circle cx="185" cy="232" r="7" fill="#0f172a"/><line x1="185" y1="232" x2="302" y2="163" stroke="#059669" stroke-width="4" marker-end="url(#arrg)"/>
  <line x1="185" y1="232" x2="281" y2="116" stroke="#dc2626" stroke-width="2" marker-end="url(#arrr)"/><line x1="185" y1="232" x2="326" y2="226" stroke="#dc2626" stroke-width="2" marker-end="url(#arrr)"/><line x1="185" y1="232" x2="250" y2="304" stroke="#dc2626" stroke-width="2" marker-end="url(#arrr)"/><line x1="185" y1="232" x2="297" y2="281" stroke="#dc2626" stroke-width="2" marker-end="url(#arrr)"/>
  <text class="body" x="242" y="184" fill="#059669">grad F(theta_k)</text><text class="small" x="273" y="104">g(theta_k, sample)</text><text class="small" x="55" y="334">E[g_k | history_k] = grad F(theta_k)</text>
  <rect x="50" y="351" width="310" height="39" rx="8" fill="#dcfce7"/><text class="small" x="205" y="375" text-anchor="middle">先写 estimand 与 sampling law，再谈无偏</text>

  <text class="title" x="435" y="53">B · batch 降低方差，但有前提</text><text class="sub" x="435" y="78">iid 是 1/B；相关性与有限总体改变曲线</text>
  <line x1="462" y1="325" x2="754" y2="325" stroke="#64748b"/><line x1="480" y1="105" x2="480" y2="342" stroke="#64748b"/>
  <path d="M488 118 C540 202 609 278 744 315" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M488 118 C541 190 603 245 744 264" fill="none" stroke="#d97706" stroke-width="4"/>
  <path d="M488 118 C548 217 641 311 744 324" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text class="small" x="652" y="297" fill="#2563eb">iid: variance / B</text><text class="small" x="627" y="249" fill="#d97706">correlation &gt; 0: saturation</text><text class="small" x="516" y="144" fill="#7c3aed">without replacement</text>
  <text class="small" x="466" y="362">variance</text><text class="small" x="724" y="343">batch B</text>
  <rect x="455" y="370" width="290" height="24" rx="7" fill="#fff7ed"/><text class="small" x="600" y="387" text-anchor="middle">std scales as 1/sqrt(B)，不是 1/B</text>

  <text class="title" x="830" y="53">C · 固定步长先快后到 noise floor</text><text class="sub" x="830" y="78">减小 η / 增大 B 可降平台，但改变 transient</text>
  <line x1="850" y1="327" x2="1152" y2="327" stroke="#64748b"/><line x1="870" y1="105" x2="870" y2="342" stroke="#64748b"/>
  <path d="M878 118 C921 171 951 242 1011 279 C1058 307 1096 300 1141 302" fill="none" stroke="#dc2626" stroke-width="4"/>
  <line x1="870" y1="302" x2="1148" y2="302" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M878 118 C926 189 967 271 1032 316 C1078 327 1110 326 1141 326" fill="none" stroke="#059669" stroke-width="3"/>
  <text class="small" x="1027" y="288" fill="#dc2626">large η / small B</text><text class="small" x="1018" y="344" fill="#059669">small η / large B</text>
  <rect x="845" y="357" width="319" height="38" rx="8" fill="#fee2e2"/><text class="small" x="1004" y="374" text-anchor="middle">constant step: transient + O(step · variance / B)</text><text class="small" x="1004" y="389" text-anchor="middle">optimization theorem is not a generalization theorem</text>
</svg>
