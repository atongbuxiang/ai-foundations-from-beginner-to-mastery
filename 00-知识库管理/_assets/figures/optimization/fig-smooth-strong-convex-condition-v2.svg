<ellipse cx="605" cy="260" rx="66" ry="39" fill="none" stroke="#2563EB" stroke-width="2"/>
<circle cx="605" cy="260" r="6" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<line x1="605" y1="260" x2="740" y2="260" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<line x1="605" y1="260" x2="605" y2="170" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="625" y="292" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">lambda=mu (slow)</text>
<text x="615" y="160" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">lambda=L (fast)</text>
<text x="435" y="446" font-size="17" font-weight="650" text-anchor="start" fill="#1F2937" class="math">mu I &lt;= Hessian &lt;= L I</text>
<text x="435" y="482" font-size="16" font-weight="400" text-anchor="start" fill="#64748B">kappa=L/mu；坐标或 metric 改变它。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">曲率结论的量词逐层增强</text>
<circle cx="980" cy="185" r="35" fill="#FFF7F5" stroke="#C24135" stroke-width="2.5"/>
<circle cx="980" cy="245" r="105" fill="none" stroke="#0F766E" stroke-width="2.5"/>
<circle cx="980" cy="300" r="170" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<text x="980" y="190" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">point</text>
<text x="1095" y="215" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">region</text>
<text x="1095" y="345" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">global</text>
<text x="825" y="400" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">H(x0) snapshot</text>
<text x="825" y="432" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">all x on trajectory / sublevel set</text>
<text x="825" y="464" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">all x in declared domain</text>
<text x="825" y="497" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">还必须固定 norm 与 parameterization。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">L 与 mu 是带 domain、norm 和量词的曲率证书；kappa 只在这些对象固定后才有算法含义。</text>
</svg>