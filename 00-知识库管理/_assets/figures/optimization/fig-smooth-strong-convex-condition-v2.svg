<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">光滑性、强凸性与条件数的曲率夹逼</title>
<desc id="desc">L 光滑性给切平面的二次上模型，mu 强凸性给二次下模型；在二次型上二者成为 Hessian 谱端点，条件数刻画各向异性的时间尺度；点、区域和全局曲率声明具有不同量词。</desc>
