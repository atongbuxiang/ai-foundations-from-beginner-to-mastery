<text x="292" y="128" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">L upper model</text>
<text x="274" y="330" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB">f</text>
<text x="280" y="382" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">mu lower model</text>
<text x="45" y="462" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">same value + same gradient at x</text>
<text x="45" y="496" font-size="16" font-weight="400" text-anchor="start" fill="#64748B" class="math">lower &lt;= f(y) &lt;= upper</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">谱端点决定各向异性</text>
<line x1="445" y1="405" x2="765" y2="405" stroke="#D7DEE8" stroke-width="2"/>
<line x1="605" y1="92" x2="605" y2="440" stroke="#D7DEE8" stroke-width="2"/>
