<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#f8fafc"/>
  <style>
    .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#475569}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#64748b}
  </style>
  <rect class="panel" x="20" y="20" width="370" height="390" rx="14"/><rect class="panel" x="415" y="20" width="370" height="390" rx="14"/><rect class="panel" x="810" y="20" width="370" height="390" rx="14"/>

  <text class="title" x="40" y="53">A · kink 处是一束支撑斜率</text><text class="sub" x="40" y="78">不可微 ≠ 没有一阶全局下界</text>
  <line x1="62" y1="314" x2="360" y2="314" stroke="#64748b" stroke-width="1.4"/><line x1="210" y1="104" x2="210" y2="342" stroke="#64748b" stroke-width="1.4"/>
  <path d="M82 116 L210 286 L338 116" fill="none" stroke="#2563eb" stroke-width="4"/>
  <line x1="85" y1="340" x2="335" y2="232" stroke="#059669" stroke-width="2.3"/><line x1="85" y1="286" x2="335" y2="286" stroke="#d97706" stroke-width="2.3"/><line x1="85" y1="232" x2="335" y2="340" stroke="#7c3aed" stroke-width="2.3"/>
  <circle cx="210" cy="286" r="6" fill="#dc2626"/>
  <text class="small" x="92" y="202">g ∈ [−1,1]</text><text class="small" x="222" y="305">∂|x|(0)</text>
  <rect x="53" y="356" width="304" height="31" rx="8" fill="#f1f5f9"/><text class="small" x="205" y="376" text-anchor="middle">f(y) ≥ f(x) + gᵀ(y−x)，对所有 y</text>

  <text class="title" x="435" y="53">B · 共轭记录最佳仿射下界</text><text class="sub" x="435" y="78">固定 slope y，再优化 intercept</text>
  <line x1="455" y1="320" x2="755" y2="320" stroke="#64748b" stroke-width="1.4"/><line x1="480" y1="102" x2="480" y2="342" stroke="#64748b" stroke-width="1.4"/>
  <path d="M490 120 Q615 350 742 120" fill="none" stroke="#2563eb" stroke-width="4"/>
  <line x1="490" y1="306" x2="742" y2="182" stroke="#d97706" stroke-width="2.6"/>
  <circle cx="650" cy="227" r="6" fill="#d97706"/><line x1="650" y1="227" x2="650" y2="320" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="small" x="659" y="247">touch: y ∈ ∂f(x)</text><text class="small" x="501" y="302">slope = y</text>
  <rect x="454" y="351" width="307" height="40" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text class="body" x="607" y="376" text-anchor="middle">f*(y) = supₓ { yᵀx − f(x) }</text>

  <text class="title" x="830" y="53">C · Fenchel–Young 是可检查的 gap</text><text class="sub" x="830" y="78">primal x、dual slope y 与等号证书</text>
  <rect x="846" y="106" width="318" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="body" x="1005" y="132" text-anchor="middle">G(x,y) = f(x) + f*(y) − yᵀx</text><text class="small" x="1005" y="153" text-anchor="middle">G ≥ 0 for every x,y</text>
  <rect x="846" y="195" width="145" height="72" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
  <text class="body" x="918" y="220" text-anchor="middle">G = 0</text><text class="small" x="918" y="244" text-anchor="middle">y ∈ ∂f(x)</text>
  <rect x="1019" y="195" width="145" height="72" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="body" x="1091" y="220" text-anchor="middle">inverse graph</text><text class="small" x="1091" y="244" text-anchor="middle">x ∈ ∂f*(y)</text>
  <line x1="991" y1="231" x2="1019" y2="231" stroke="#64748b" stroke-width="1.5"/>
  <rect x="846" y="295" width="318" height="72" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text class="body" x="1005" y="321" text-anchor="middle">norm ↔ dual-ball indicator</text><text class="small" x="1005" y="345" text-anchor="middle">negative entropy ↔ logsumexp / softmax</text>
  <text class="small" x="830" y="390">写出 dual ≠ 已证明 zero gap / attainment</text>
</svg>
