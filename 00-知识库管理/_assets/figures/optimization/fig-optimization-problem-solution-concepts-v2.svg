<path d="M555.0 205.0L556.6 213.3L558.3 221.1L560.0 228.4L561.6 235.2L563.2 241.5L564.9 247.5L566.5 253.1L568.2 258.3L569.9 263.2L571.5 267.8L573.1 272.1L574.8 276.1L576.5 279.9L578.1 283.4L579.8 286.7L581.4 289.8L583.0 292.7L584.7 295.4L586.4 297.9L588.0 300.3L589.6 302.5L591.3 304.6L593.0 306.5L594.6 308.3L596.2 310.0L597.9 311.6L599.5 313.1L601.2 314.5L602.9 315.8L604.5 317.1L606.1 318.2L607.8 319.3L609.5 320.3L611.1 321.2L612.8 322.1L614.4 322.9L616.0 323.7L617.7 324.4L619.4 325.1L621.0 325.7L622.6 326.3L624.3 326.9L626.0 327.4L627.6 327.9L629.2 328.3L630.9 328.8L632.5 329.2L634.2 329.5L635.9 329.9L637.5 330.2L639.1 330.5L640.8 330.8L642.5 331.1L644.1 331.3L645.8 331.6L647.4 331.8L649.0 332.0L650.7 332.2L652.4 332.4L654.0 332.5" fill="none" stroke="#0F766E" stroke-width="3"/>
<line x1="555" y1="335" x2="655" y2="335" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="675" y1="175" x2="755" y2="365" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<text x="495" y="435" font-size="15" font-weight="700" text-anchor="middle" fill="#2563EB">minimum attained</text>
<text x="610" y="470" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">infimum not attained</text>
<text x="720" y="435" font-size="15" font-weight="700" text-anchor="middle" fill="#C24135">unbounded</text>
<text x="430" y="115" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">existence = finite value + attainment</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">算法成功不等于模型成功</text>
<rect x="840" y="105" width="130" height="54" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="905.0" y="138.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">optimization</text>
<line x1="973" y1="132" x2="1008" y2="132" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<text x="1018" y="138" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">objective / residual</text>
<rect x="840" y="225" width="130" height="54" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="905.0" y="258.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">statistics</text>
<line x1="973" y1="252" x2="1008" y2="252" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<text x="1018" y="258" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">generalization gap</text>
<rect x="840" y="345" width="130" height="54" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="905.0" y="378.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">deployment</text>
<line x1="973" y1="372" x2="1008" y2="372" stroke="#1F2937" stroke-width="2.2" marker-end="url(#a3)"/>
<text x="1018" y="378" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">utility / shift</text>
<text x="830" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">objective gap != solution distance</text>
<text x="830" y="488" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">换算需要 convexity / error bound 等结构。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先定义问题和证书，再解释算法输出；下降曲线不能替代存在性、统计性与部署证据。</text>
</svg>