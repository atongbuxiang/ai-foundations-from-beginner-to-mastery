<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">先写完整 problem contract</text>
<rect x="55" y="95" width="285" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="197.5" y="126.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">decision x</text>
<line x1="198" y1="147" x2="198" y2="167" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="173" width="285" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="197.5" y="204.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">domain dom f</text>
<line x1="198" y1="225" x2="198" y2="245" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="251" width="285" height="50" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="197.5" y="282.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">objective f0</text>
<line x1="198" y1="303" x2="198" y2="323" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="329" width="285" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="197.5" y="360.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">constraints</text>
<line x1="198" y1="381" x2="198" y2="401" stroke="#1F2937" stroke-width="2" marker-end="url(#a3)"/>
<rect x="55" y="407" width="285" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="197.5" y="438.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">solution concept</text>
<text x="45" y="492" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">data / hyperparameters / randomness 也属于 instance。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">最优值状态不能只看曲线下降</text>
<line x1="440" y1="400" x2="770" y2="400" stroke="#D7DEE8" stroke-width="2"/>
