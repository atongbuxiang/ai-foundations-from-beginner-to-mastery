<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#f8fafc"/>
  <style>
    .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#475569}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#64748b}
  </style>
  <rect class="panel" x="20" y="20" width="370" height="390" rx="14"/><rect class="panel" x="415" y="20" width="370" height="390" rx="14"/><rect class="panel" x="810" y="20" width="370" height="390" rx="14"/>
  <text class="title" x="40" y="53">A · 线段测试是一切的起点</text><text class="sub" x="40" y="78">一个反例点足以否定 convexity</text>
  <path d="M67 130 C78 94 142 90 164 128 C182 163 151 204 100 197 C57 191 46 158 67 130Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="78" cy="165" r="6" fill="#2563eb"/><circle cx="148" cy="122" r="6" fill="#2563eb"/><line x1="78" y1="165" x2="148" y2="122" stroke="#059669" stroke-width="3"/>
  <text class="small" x="105" y="222" text-anchor="middle">整条 segment 留在集合</text>
  <path d="M246 113 C280 94 320 111 326 139 C333 172 297 189 268 174 C236 157 219 130 246 113Z M278 235 C315 217 349 240 343 274 C337 305 288 316 257 290 C226 264 242 247 278 235Z" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="268" cy="145" r="6" fill="#dc2626"/><circle cx="302" cy="267" r="6" fill="#dc2626"/><line x1="268" y1="145" x2="302" y2="267" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 5"/>
  <circle cx="286" cy="208" r="6" fill="#f59e0b"/><text class="small" x="286" y="336" text-anchor="middle">midpoint 离开 union</text>
  <rect x="48" y="357" width="314" height="31" rx="8" fill="#f1f5f9"/><text class="small" x="205" y="378" text-anchor="middle">intersection 保凸；union 一般不保凸</text>

  <text class="title" x="435" y="53">B · 最近点同时给投影与分离</text><text class="sub" x="435" y="78">closed 给存在，convex 给唯一</text>
  <path d="M462 265 C470 175 532 121 630 141 C676 151 702 199 679 250 C654 303 553 326 484 298Z" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <circle cx="660" cy="171" r="6" fill="#059669"/><text class="small" x="635" y="158">x* = ΠC(y)</text>
  <circle cx="737" cy="103" r="7" fill="#dc2626"/><text class="small" x="746" y="100">outside y</text>
  <line x1="660" y1="171" x2="737" y2="103" stroke="#dc2626" stroke-width="3"/>
  <line x1="633" y1="101" x2="730" y2="211" stroke="#7c3aed" stroke-width="3"/>
  <text class="small" x="612" y="93">aᵀz=b</text>
  <line x1="660" y1="171" x2="559" y2="233" stroke="#64748b" stroke-width="2"/>
  <path d="M650 179 A15 15 0 0 1 641 164" fill="none" stroke="#64748b"/>
  <text class="small" x="455" y="360">(y−x*)ᵀ(x−x*) ≤ 0  for every x∈C</text>
  <text class="small" x="455" y="383">normal a=y−x* 是 membership failure 证书</text>

  <text class="title" x="830" y="53">C · 三种 AI 高频 convex geometry</text><text class="sub" x="830" y="78">坐标数、锥结构和矩阵序不可混写</text>
  <polygon points="875,185 955,95 1035,185" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="915" cy="151" r="5" fill="#2563eb"/><text class="small" x="955" y="210" text-anchor="middle">simplex：概率 / attention</text>
  <path d="M860 322 L908 244 L956 322 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <ellipse cx="908" cy="322" rx="48" ry="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="small" x="908" y="352" text-anchor="middle">SOC：norm / robust</text>
  <rect x="1028" y="242" width="107" height="83" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="body" x="1081" y="274" text-anchor="middle">X ⪰ 0</text><text class="small" x="1081" y="296" text-anchor="middle">vᵀXv ≥ 0</text><text class="small" x="1081" y="350" text-anchor="middle">PSD：covariance / kernel</text>
  <text class="small" x="830" y="390">输出集合凸 ≠ 深网参数空间目标凸</text>
</svg>
