<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">自适应优化的 variable metric、状态流与正则边界</title>
<desc id="desc">对角自适应方法用历史梯度统计改变各坐标移动代价；AdaGrad、RMSProp 与 Adam 的状态递推不同；coupled L2、AdamW 和 AMSGrad 分别改变梯度、参数更新和二阶状态上界。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">metric 改变最陡方向</text>
<circle cx="205" cy="275" r="112" fill="none" stroke="#D7DEE8" stroke-width="2"/>
<ellipse cx="205" cy="275" rx="145" ry="62" fill="none" stroke="#0F766E" stroke-width="2.5"/>
<circle cx="205" cy="275" r="6" fill="#1F2937" stroke="#1F2937" stroke-width="2"/>
<line x1="205" y1="275" x2="305" y2="165" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<line x1="205" y1="275" x2="315" y2="275" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<line x1="205" y1="275" x2="270" y2="350" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="308" y="158" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">gradient g</text>
<text x="290" y="260" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">Euclidean -g</text>
<text x="250" y="376" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">-H_t^-1 g</text>
<text x="45" y="425" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">step = argmin_d {g^T d + d^T H_t d/(2 alpha)}</text>
<text x="45" y="463" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">diagonal H_t rescales axes；dense H_t also rotates。</text>
<text x="45" y="496" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">gradient squares do not reveal Hessian signs or eigenvectors。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三种状态递推不能混写</text>
<rect x="455" y="98" width="105" height="50" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="507.5" y="129.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">g_t</text>
<line x1="560" y1="123" x2="600" y2="123" stroke="#1F2937" stroke-width="2.4" marker-end="url(#a3)"/>
<rect x="605" y="98" width="135" height="50" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="672.5" y="129.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">g_t squared</text>
<text x="435" y="188" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB">AdaGrad</text>
<line x1="520" y1="182" x2="550" y2="182" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<text x="562" y="188" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">s_t=s_(t-1)+g_t^2</text>
<text x="435" y="282" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">RMSProp</text>
<line x1="520" y1="276" x2="550" y2="276" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<text x="562" y="282" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">v_t=beta v_(t-1)+(1-beta)g_t^2</text>
<text x="435" y="376" font-size="17" font-weight="700" text-anchor="start" fill="#C24135">Adam</text>
<line x1="520" y1="370" x2="550" y2="370" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="562" y="376" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">m_t / v_t EMA + bias correction</text>
<text x="430" y="440" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">update: -alpha * m_hat/(sqrt(v_hat)+epsilon)</text>
<text x="430" y="477" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">epsilon location、initialization、dtype 都属于算法定义。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三种机制各改一层</text>
<text x="830" y="112" font-size="17" font-weight="700" text-anchor="start" fill="#C24135">coupled L2</text>
<text x="830" y="145" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">P_t (g_t + lambda x_t)</text>
<text x="830" y="176" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">penalty gradient is adaptively rescaled</text>
<line x1="830" y1="202" x2="1145" y2="202" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="245" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB">AdamW</text>
<text x="830" y="278" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">P_t g_t  +  lambda x_t</text>
<text x="830" y="309" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">decay is outside adaptive preconditioner</text>
<line x1="830" y1="335" x2="1145" y2="335" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="378" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">AMSGrad</text>
<text x="830" y="411" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">vbar_t = max(vbar_(t-1), v_t)</text>
<text x="830" y="442" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">prevents denominator from decreasing</text>
<text x="830" y="485" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">safeguard != universal convergence</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">自适应优化首先是一种历史依赖的坐标几何；曲率解释、正则解释与收敛解释都需要额外证据。</text>
</svg>