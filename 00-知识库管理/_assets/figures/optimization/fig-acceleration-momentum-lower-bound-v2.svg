<text x="1020" y="245" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">GD  O(1/k)</text>
<text x="1010" y="350" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">NAG  O(1/k^2)</text>
<text x="925" y="400" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">lower bound: same order</text>
<text x="825" y="488" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">必须固定函数类、oracle、维度与误差准则。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">加速是受函数类与信息模型约束的复杂度结论；动量轨迹、谱半径和 wall-clock 是不同证据。</text>
</svg>