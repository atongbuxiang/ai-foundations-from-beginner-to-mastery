<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">动量、特征根与一阶 oracle 加速</title>
<desc id="desc">Heavy-ball 在当前位置求梯度，Nesterov 在外推点求梯度；二次型的每个特征模态服从二阶递推并由单位圆内的根控制；一般光滑凸函数上的加速率必须与同一 oracle 类的下界配对。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">HB 与 NAG 的梯度位置不同</text>
<ellipse cx="205" cy="270" rx="145" ry="92" fill="none" stroke="#D7DEE8" stroke-width="2"/>
<ellipse cx="205" cy="270" rx="100" ry="62" fill="none" stroke="#D7DEE8" stroke-width="2"/>
<ellipse cx="205" cy="270" rx="55" ry="32" fill="none" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="92" cy="168" r="6" fill="#1F2937" stroke="#1F2937" stroke-width="2"/>
<circle cx="145" cy="350" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="205" cy="270" r="6" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<line x1="92" y1="168" x2="145" y2="350" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a3)"/>
<line x1="145" y1="350" x2="205" y2="405" stroke="#C24135" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<line x1="145" y1="350" x2="220" y2="280" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<line x1="205" y1="405" x2="240" y2="270" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<text x="78" y="150" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">x_(k-1)</text>
<text x="120" y="375" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">x_k</text>
<text x="212" y="430" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">look-ahead y_k</text>
<text x="235" y="248" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">x*</text>
<text x="45" y="468" font-size="16" font-weight="650" text-anchor="start" fill="#2563EB">HB: grad f(x_k)</text>
<text x="220" y="468" font-size="16" font-weight="650" text-anchor="start" fill="#C24135">NAG: grad f(y_k)</text>
<text x="45" y="499" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">名称相近，不代表递推或定理相同。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">每个特征值对应两个根</text>
<text x="430" y="110" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">z_(k+1)=(1+beta-eta lambda)z_k-beta z_(k-1)</text>
<line x1="452" y1="300" x2="760" y2="300" stroke="#D7DEE8" stroke-width="2"/>
<line x1="600" y1="170" x2="600" y2="430" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="600" cy="300" r="112" fill="none" stroke="#0F766E" stroke-width="2.5"/>
<circle cx="642" cy="255" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="558" cy="345" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="735" cy="260" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<text x="665" y="225" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">|r|&lt;1</text>
<text x="710" y="242" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">unstable</text>
<text x="430" y="455" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">r^2-(1+beta-eta lambda)r+beta=0</text>
<text x="430" y="488" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">所有 lambda in [mu,L] 的根都须在单位圆内。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">函数类上的最坏情形阶</text>
<line x1="850" y1="420" x2="1150" y2="420" stroke="#D7DEE8" stroke-width="2"/>
<line x1="870" y1="438" x2="870" y2="100" stroke="#D7DEE8" stroke-width="2"/>
<text x="1145" y="448" font-size="15" font-weight="650" text-anchor="end" fill="#1F2937">iterations k</text>
<text x="835" y="110" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">gap</text>
