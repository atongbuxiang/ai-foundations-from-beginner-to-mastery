<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Newton、Gauss-Newton 与拟 Newton 的曲率对象和验收层</title>
<desc id="desc">Newton 用目标 Hessian 的局部二次模型；Gauss-Newton 保留最小二乘 Jacobian Gram 项；BFGS 通过 secant pairs 学习正定曲率近似；线性子问题残差与外层接受规则必须分别验收。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">Newton 最小化局部二次模型</text>
<line x1="50" y1="410" x2="365" y2="410" stroke="#D7DEE8" stroke-width="2"/>
<line x1="80" y1="435" x2="80" y2="95" stroke="#D7DEE8" stroke-width="2"/>
<path d="M80.0 52.6L82.3 62.5L84.6 72.1L86.9 81.6L89.2 90.8L91.5 99.9L93.8 108.8L96.1 117.5L98.4 126.1L100.7 134.4L103.0 142.6L105.3 150.6L107.6 158.4L109.9 166.1L112.2 173.5L114.5 180.8L116.8 188.0L119.1 194.9L121.4 201.7L123.7 208.3L126.0 214.8L128.3 221.1L130.6 227.2L132.9 233.1L135.2 238.9L137.5 244.6L139.8 250.0L142.1 255.3L144.4 260.5L146.7 265.5L149.0 270.3L151.3 275.0L153.6 279.5L155.9 283.9L158.2 288.1L160.5 292.2L162.8 296.1L165.1 299.9L167.4 303.5L169.7 307.0L172.0 310.4L174.3 313.5L176.6 316.6L178.9 319.5L181.2 322.3L183.5 324.9L185.8 327.4L188.1 329.7L190.4 332.0L192.7 334.0L195.0 336.0L197.3 337.8L199.6 339.5L201.9 341.1L204.2 342.5L206.5 343.8L208.8 345.0L211.1 346.0L213.4 346.9L215.7 347.7L218.0 348.4L220.3 349.0L222.6 349.4L224.9 349.7L227.2 349.9L229.5 350.0L231.8 350.0L234.1 349.8L236.4 349.6L238.7 349.2L241.0 348.7L243.3 348.1L245.6 347.4L247.9 346.6L250.2 345.7L252.5 344.7L254.8 343.5L257.1 342.3L259.4 341.0L261.7 339.6L264.0 338.0L266.3 336.4L268.6 334.7L270.9 332.9L273.2 330.9L275.5 328.9L277.8 326.8L280.1 324.6L282.4 322.4L284.7 320.0L287.0 317.5L289.3 315.0L291.6 312.3L293.9 309.6L296.2 306.8L298.5 303.9L300.8 301.0L303.1 297.9L305.4 294.8L307.7 291.6L310.0 288.3L312.3 284.9L314.6 281.5L316.9 278.0L319.2 274.4L321.5 270.8L323.8 267.1L326.1 263.3L328.4 259.4L330.7 255.5L333.0 251.5L335.3 247.5L337.6 243.4L339.9 239.2L342.2 234.9L344.5 230.6L346.8 226.3L349.1 221.9L351.4 217.4L353.7 212.9L356.0 208.3" fill="none" stroke="#2563EB" stroke-width="3.5"/>
<path d="M80.0 147.8L82.3 154.1L84.6 160.3L86.9 166.4L89.2 172.4L91.5 178.3L93.8 184.1L96.1 189.8L98.4 195.4L100.7 200.9L103.0 206.2L105.3 211.5L107.6 216.7L109.9 221.8L112.2 226.8L114.5 231.7L116.8 236.5L119.1 241.2L121.4 245.8L123.7 250.3L126.0 254.7L128.3 258.9L130.6 263.1L132.9 267.2L135.2 271.2L137.5 275.1L139.8 278.9L142.1 282.5L144.4 286.1L146.7 289.6L149.0 293.0L151.3 296.3L153.6 299.4L155.9 302.5L158.2 305.5L160.5 308.4L162.8 311.2L165.1 313.8L167.4 316.4L169.7 318.9L172.0 321.2L174.3 323.5L176.6 325.7L178.9 327.8L181.2 329.7L183.5 331.6L185.8 333.4L188.1 335.0L190.4 336.6L192.7 338.1L195.0 339.4L197.3 340.7L199.6 341.9L201.9 342.9L204.2 343.9L206.5 344.7L208.8 345.5L211.1 346.2L213.4 346.7L215.7 347.2L218.0 347.5L220.3 347.8L222.6 347.9L224.9 348.0L227.2 348.0L229.5 347.8L231.8 347.6L234.1 347.2L236.4 346.8L238.7 346.2L241.0 345.6L243.3 344.8L245.6 344.0L247.9 343.0L250.2 342.0L252.5 340.8L254.8 339.5L257.1 338.2L259.4 336.7L261.7 335.2L264.0 333.5L266.3 331.8L268.6 329.9L270.9 327.9L273.2 325.9L275.5 323.7L277.8 321.4L280.1 319.1L282.4 316.6L284.7 314.1L287.0 311.4L289.3 308.6L291.6 305.8L293.9 302.8L296.2 299.7L298.5 296.6L300.8 293.3L303.1 289.9L305.4 286.4L307.7 282.9L310.0 279.2L312.3 275.4L314.6 271.5L316.9 267.6L319.2 263.5L321.5 259.3L323.8 255.0L326.1 250.7L328.4 246.2L330.7 241.6L333.0 236.9L335.3 232.1L337.6 227.2L339.9 222.3L342.2 217.2L344.5 212.0L346.8 206.7L349.1 201.3L351.4 195.8L353.7 190.3L356.0 184.6" fill="none" stroke="#C24135" stroke-width="2.5" stroke-dasharray="7 5"/>
<circle cx="145" cy="245" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="225" cy="348" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<line x1="145" y1="425" x2="225" y2="425" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="145" y="225" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">x_k</text>
<text x="225" y="375" font-size="15" font-weight="700" text-anchor="middle" fill="#0F766E">x_k+p_N</text>
<text x="265" y="145" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">m_k(p)</text>
<text x="45" y="465" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">solve H_k p = -g_k；do not form H_k^-1</text>
<text x="45" y="498" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">indefinite / singular H requires modification or trust region。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">三类方法使用不同曲率对象</text>
<text x="430" y="102" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB">exact Newton</text>
<text x="430" y="138" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">H = J^T J + sum_i r_i Hessian(r_i)</text>
<text x="430" y="169" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">retains residual-weighted second derivatives</text>
<text x="430" y="235" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">Gauss-Newton</text>
<text x="430" y="271" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">G = J^T J  &gt;= 0</text>
<text x="430" y="302" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">exact for affine residual；good near small residual</text>
<text x="430" y="368" font-size="17" font-weight="700" text-anchor="start" fill="#C24135">BFGS / L-BFGS</text>
<text x="430" y="404" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">B_(k+1) s_k = y_k</text>
<text x="430" y="435" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">s^T y &gt; 0 protects positive definiteness</text>
<text x="430" y="485" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">GGN、Fisher、empirical Fisher 也不是同一矩阵。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">模型、求解、全局化三层验收</text>
<rect x="840" y="105" width="130" height="58" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="905.0" y="140.0" font-size="16" font-weight="650" text-anchor="middle" fill="#2563EB">1  model</text>
<line x1="975" y1="134" x2="1005" y2="134" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<text x="1015" y="128" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">choose H / GN / BFGS</text>
<line x1="905" y1="167" x2="905" y2="221" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="840" y="230" width="130" height="58" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="905.0" y="265.0" font-size="16" font-weight="650" text-anchor="middle" fill="#0F766E">2  inner solve</text>
<line x1="975" y1="259" x2="1005" y2="259" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<text x="1015" y="253" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">||B p + g|| &lt;= tolerance</text>
<line x1="905" y1="292" x2="905" y2="346" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="840" y="355" width="130" height="58" rx="8" fill="#FFFEFB" stroke="#C24135" stroke-width="2"/>
<text x="905.0" y="390.0" font-size="16" font-weight="650" text-anchor="middle" fill="#C24135">3  accept step</text>
<line x1="975" y1="384" x2="1005" y2="384" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="1015" y="378" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">line search or trust ratio</text>
<text x="830" y="465" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">inner residual small != outer step accepted</text>
<text x="830" y="497" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">local fast rate needs an attraction region。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">二阶法的名称不够：必须同时声明曲率矩阵、线性求解精度和接受规则。</text>
</svg>