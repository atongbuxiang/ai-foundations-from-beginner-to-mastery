<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#f8fafc"/>
  <style>
    .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#475569}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#64748b}.math{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}
  </style>
  <defs><marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#2563eb"/></marker></defs>
  <rect class="panel" x="20" y="20" width="370" height="390" rx="14"/><rect class="panel" x="415" y="20" width="370" height="390" rx="14"/><rect class="panel" x="810" y="20" width="370" height="390" rx="14"/>

  <text class="title" x="40" y="53">A · adaptive step 改变坐标 metric</text><text class="sub" x="40" y="78">Euclidean circle → diagonal ellipse；仍依赖坐标轴</text>
  <circle cx="122" cy="222" r="76" fill="#dbeafe" opacity=".55" stroke="#2563eb" stroke-width="2"/><ellipse cx="286" cy="222" rx="45" ry="106" fill="#ede9fe" opacity=".6" stroke="#7c3aed" stroke-width="2"/>
  <line x1="122" y1="222" x2="180" y2="171" stroke="#2563eb" stroke-width="3" marker-end="url(#arrb)"/><line x1="286" y1="222" x2="316" y2="132" stroke="#7c3aed" stroke-width="3"/>
  <text class="small" x="74" y="322">H = I</text><text class="small" x="241" y="347">H = diag(h1,h2)</text><text class="math" x="205" y="382" text-anchor="middle">x_next = x - step * H^(-1) g</text>

  <text class="title" x="435" y="53">B · 三条历史统计路径</text><text class="sub" x="435" y="78">全部累积、有限记忆、再加一阶动量</text>
  <rect x="455" y="110" width="82" height="50" rx="9" fill="#dbeafe" stroke="#2563eb"/><text class="body" x="496" y="140" text-anchor="middle">g_t</text>
  <line x1="537" y1="135" x2="574" y2="135" stroke="#2563eb" stroke-width="2" marker-end="url(#arrb)"/>
  <rect x="580" y="101" width="164" height="68" rx="10" fill="#dcfce7" stroke="#059669"/><text class="body" x="662" y="127" text-anchor="middle">AdaGrad</text><text class="small" x="662" y="151" text-anchor="middle">s_t = sum of g^2</text>
  <line x1="496" y1="160" x2="496" y2="208" stroke="#2563eb" stroke-width="2" marker-end="url(#arrb)"/>
  <rect x="455" y="215" width="289" height="68" rx="10" fill="#fff7ed" stroke="#d97706"/><text class="body" x="599" y="241" text-anchor="middle">RMSProp</text><text class="small" x="599" y="265" text-anchor="middle">v_t = beta2 v_(t-1) + (1-beta2) g_t^2</text>
  <line x1="599" y1="283" x2="599" y2="318" stroke="#2563eb" stroke-width="2" marker-end="url(#arrb)"/>
  <rect x="455" y="325" width="289" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text class="body" x="599" y="350" text-anchor="middle">Adam</text><text class="small" x="599" y="373" text-anchor="middle">m_t + v_t + bias correction</text>

  <text class="title" x="830" y="53">C · 三个易混对象必须拆开</text><text class="sub" x="830" y="78">regularization、decay 与 convergence safeguard</text>
  <rect x="845" y="107" width="319" height="73" rx="10" fill="#fee2e2" stroke="#dc2626"/><text class="body" x="1004" y="133" text-anchor="middle">coupled L2</text><text class="small" x="1004" y="157" text-anchor="middle">g + lambda x 一起进入 m、v 与 preconditioner</text>
  <rect x="845" y="203" width="319" height="73" rx="10" fill="#dcfce7" stroke="#059669"/><text class="body" x="1004" y="229" text-anchor="middle">AdamW</text><text class="small" x="1004" y="253" text-anchor="middle">data moments + decoupled (1-step*lambda)x</text>
  <rect x="845" y="299" width="319" height="73" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text class="body" x="1004" y="325" text-anchor="middle">AMSGrad</text><text class="small" x="1004" y="349" text-anchor="middle">vmax_t = max(vmax_(t-1), v_t)，阻止分母下降</text>
  <text class="small" x="830" y="395">它们解决不同问题；都不是“Adam = Newton”的证明。</text>
</svg>
