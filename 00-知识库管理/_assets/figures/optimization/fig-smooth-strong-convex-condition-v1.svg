<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#f8fafc"/>
  <style>
    .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#475569}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#64748b}
  </style>
  <rect class="panel" x="20" y="20" width="370" height="390" rx="14"/><rect class="panel" x="415" y="20" width="370" height="390" rx="14"/><rect class="panel" x="810" y="20" width="370" height="390" rx="14"/>

  <text class="title" x="40" y="53">A · 二次上下模型夹住函数</text><text class="sub" x="40" y="78">μ 控制不能太平，L 控制不能太陡</text>
  <line x1="62" y1="326" x2="359" y2="326" stroke="#64748b" stroke-width="1.4"/><line x1="90" y1="105" x2="90" y2="348" stroke="#64748b" stroke-width="1.4"/>
  <path d="M96 115 Q220 465 344 115" fill="none" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 5"/>
  <path d="M96 195 Q220 385 344 195" fill="none" stroke="#059669" stroke-width="2.4" stroke-dasharray="6 5"/>
  <path d="M96 155 Q220 425 344 155" fill="none" stroke="#2563eb" stroke-width="4"/>
  <circle cx="220" cy="290" r="6" fill="#2563eb"/>
  <text class="small" x="274" y="126">L upper model</text><text class="small" x="273" y="207">μ lower model</text><text class="small" x="105" y="308">same value + gradient at x</text>
  <rect x="53" y="355" width="304" height="34" rx="8" fill="#f1f5f9"/><text class="small" x="205" y="377" text-anchor="middle">μI ⪯ ∇²f ⪯ LI  ⇒  κ = L/μ</text>

  <text class="title" x="435" y="53">B · 条件数是方向时间尺度之比</text><text class="sub" x="435" y="78">同一个 scalar step 要兼顾快轴与慢轴</text>
  <ellipse cx="606" cy="226" rx="139" ry="91" fill="#dbeafe" opacity="0.48" stroke="#2563eb" stroke-width="2"/>
  <ellipse cx="606" cy="226" rx="101" ry="62" fill="none" stroke="#2563eb" stroke-width="2"/>
  <ellipse cx="606" cy="226" rx="58" ry="34" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="606" cy="226" r="6" fill="#059669"/>
  <polyline points="473,168 716,277 510,188 676,258 548,207 644,241 576,217 625,233 596,223 613,228 606,226" fill="none" stroke="#dc2626" stroke-width="2.8"/>
  <text class="small" x="620" y="220">x*</text><text class="small" x="466" y="323">axis ratio = √κ；GD timescale ≈ κ</text>
  <rect x="454" y="351" width="307" height="40" rx="9" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
  <text class="body" x="607" y="376" text-anchor="middle">feature scaling / metric 改变 Euclidean κ</text>

  <text class="title" x="830" y="53">C · 曲率声明有三层量词</text><text class="sub" x="830" y="78">一次 HVP 扫描不能替代区域或全局定理</text>
  <rect x="847" y="108" width="316" height="67" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="body" x="1005" y="134" text-anchor="middle">point / batch Hessian snapshot</text><text class="small" x="1005" y="156" text-anchor="middle">当前点、探测子空间、数值阈值</text>
  <path d="M1005 175 L1005 198" stroke="#64748b" stroke-width="1.5"/>
  <rect x="847" y="198" width="316" height="67" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="body" x="1005" y="224" text-anchor="middle">trajectory / sublevel regional constants</text><text class="small" x="1005" y="246" text-anchor="middle">还要证明 iterates 留在该区域</text>
  <path d="M1005 265 L1005 288" stroke="#64748b" stroke-width="1.5"/>
  <rect x="847" y="288" width="316" height="67" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
  <text class="body" x="1005" y="314" text-anchor="middle">global theorem: all x and directions</text><text class="small" x="1005" y="336" text-anchor="middle">function + domain + norm + parameterization</text>
  <text class="small" x="830" y="390">logit-space convexity ≠ deep parameter-space strong convexity</text>
</svg>
