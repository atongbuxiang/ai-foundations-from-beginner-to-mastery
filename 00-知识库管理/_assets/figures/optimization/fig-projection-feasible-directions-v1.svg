<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#f8fafc"/>
  <style>
    .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#475569}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#64748b}.math{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}
  </style>
  <defs><marker id="ap" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#2563eb"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#dc2626"/></marker></defs>
  <rect class="panel" x="20" y="20" width="370" height="390" rx="14"/><rect class="panel" x="415" y="20" width="370" height="390" rx="14"/><rect class="panel" x="810" y="20" width="370" height="390" rx="14"/>

  <text class="title" x="40" y="53">A · 边界上的 tangent / normal</text><text class="sub" x="40" y="78">可行下降为空 ⇔ -∇f 落入法锥</text>
  <path d="M54 332 Q198 79 355 330 L355 372 L54 372 Z" fill="#dbeafe" opacity=".75" stroke="#2563eb" stroke-width="2"/>
  <circle cx="198" cy="170" r="7" fill="#0f172a"/>
  <line x1="198" y1="170" x2="112" y2="244" stroke="#059669" stroke-width="3" marker-end="url(#ap)"/><line x1="198" y1="170" x2="286" y2="240" stroke="#059669" stroke-width="3" marker-end="url(#ap)"/>
  <line x1="198" y1="170" x2="198" y2="88" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/>
  <text class="body" x="98" y="267">T_C(x)</text><text class="body" x="208" y="102">N_C(x)</text>
  <text class="math" x="205" y="397" text-anchor="middle">∇f(x)ᵀd ≥ 0 for all d ∈ T_C(x)</text>

  <text class="title" x="435" y="53">B · raw step → projection → certificate</text><text class="sub" x="435" y="78">越界不是失败；但要测 gradient mapping</text>
  <rect x="458" y="250" width="285" height="102" rx="51" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <circle cx="520" cy="286" r="7" fill="#0f172a"/><circle cx="694" cy="250" r="7" fill="#2563eb"/><circle cx="694" cy="147" r="7" fill="#dc2626"/>
  <line x1="520" y1="286" x2="694" y2="147" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/><line x1="694" y1="147" x2="694" y2="244" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ap)"/>
  <line x1="520" y1="286" x2="688" y2="251" stroke="#059669" stroke-width="3" marker-end="url(#ap)"/>
  <text class="small" x="473" y="279">x</text><text class="small" x="701" y="143">x - η∇f</text><text class="small" x="701" y="256">x⁺ = Π_C(·)</text>
  <text class="math" x="600" y="386" text-anchor="middle">G_η(x) = (x - x⁺) / η</text>
  <text class="small" x="600" y="406" text-anchor="middle">G_η = 0 ⇔ constrained stationarity</text>

  <text class="title" x="830" y="53">C · projection 由集合结构决定</text><text class="sub" x="830" y="78">不是所有“归一化/截断”都属于同一 metric</text>
  <rect x="840" y="105" width="146" height="82" rx="10" fill="#dbeafe" stroke="#2563eb"/><text class="body" x="913" y="133" text-anchor="middle">box / ℓ₂ ball</text><text class="small" x="913" y="157" text-anchor="middle">clip / radial scale</text><text class="math" x="913" y="176" text-anchor="middle">O(d)</text>
  <rect x="1010" y="105" width="146" height="82" rx="10" fill="#dcfce7" stroke="#059669"/><text class="body" x="1083" y="133" text-anchor="middle">affine set</text><text class="small" x="1083" y="157" text-anchor="middle">linear solve / QR</text><text class="math" x="1083" y="176" text-anchor="middle">Ax = b</text>
  <rect x="840" y="218" width="146" height="82" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text class="body" x="913" y="246" text-anchor="middle">simplex</text><text class="small" x="913" y="270" text-anchor="middle">sort + threshold</text><text class="math" x="913" y="289" text-anchor="middle">(z - τ)_+</text>
  <rect x="1010" y="218" width="146" height="82" rx="10" fill="#fff7ed" stroke="#d97706"/><text class="body" x="1083" y="246" text-anchor="middle">PSD cone</text><text class="small" x="1083" y="270" text-anchor="middle">eigenvalue clipping</text><text class="math" x="1083" y="289" text-anchor="middle">Q max(Λ,0) Qᵀ</text>
  <rect x="840" y="331" width="316" height="55" rx="10" fill="#fee2e2" stroke="#dc2626"/><text class="body" x="998" y="355" text-anchor="middle">nonconvex C：projection 可多值、不连续</text><text class="small" x="998" y="376" text-anchor="middle">retraction / selection rule 需另写 contract</text>
</svg>
