<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#f8fafc"/>
  <style>
    .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#475569}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#64748b}.math{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}
  </style>
  <defs><marker id="akb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#2563eb"/></marker><marker id="akr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#dc2626"/></marker></defs>
  <rect class="panel" x="20" y="20" width="370" height="390" rx="14"/><rect class="panel" x="415" y="20" width="370" height="390" rx="14"/><rect class="panel" x="810" y="20" width="370" height="390" rx="14"/>

  <text class="title" x="40" y="53">A · active normals 平衡 objective</text><text class="sub" x="40" y="78">乘子是法向量的系数，不是神秘惩罚权重</text>
  <path d="M54 334 Q198 86 354 333 L354 372 L54 372 Z" fill="#dbeafe" opacity=".75" stroke="#2563eb" stroke-width="2"/>
  <circle cx="200" cy="172" r="7" fill="#0f172a"/>
  <line x1="200" y1="172" x2="200" y2="92" stroke="#dc2626" stroke-width="3" marker-end="url(#akr)"/>
  <line x1="200" y1="172" x2="258" y2="229" stroke="#2563eb" stroke-width="3" marker-end="url(#akb)"/>
  <line x1="200" y1="172" x2="139" y2="225" stroke="#7c3aed" stroke-width="3"/>
  <text class="small" x="210" y="97">-∇f</text><text class="small" x="264" y="239">λ₁∇g₁</text><text class="small" x="77" y="237">λ₂∇g₂</text>
  <text class="math" x="205" y="392" text-anchor="middle">∇f + Σ λ_i∇g_i + Σ ν_j∇h_j = 0</text>

  <text class="title" x="435" y="53">B · 四组 KKT 缺一不可</text><text class="sub" x="435" y="78">necessity 还需 CQ；convex 时才有 global sufficiency</text>
  <rect x="445" y="104" width="145" height="92" rx="12" fill="#dbeafe" stroke="#2563eb"/><text class="body" x="517" y="134" text-anchor="middle">primal feasible</text><text class="math" x="517" y="160" text-anchor="middle">g ≤ 0 · h = 0</text><text class="small" x="517" y="181" text-anchor="middle">原问题是否可行</text>
  <rect x="610" y="104" width="145" height="92" rx="12" fill="#dcfce7" stroke="#059669"/><text class="body" x="682" y="134" text-anchor="middle">dual feasible</text><text class="math" x="682" y="160" text-anchor="middle">λ ≥ 0</text><text class="small" x="682" y="181" text-anchor="middle">equality ν free</text>
  <rect x="445" y="221" width="145" height="92" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text class="body" x="517" y="251" text-anchor="middle">stationarity</text><text class="math" x="517" y="277" text-anchor="middle">∇_x L = 0</text><text class="small" x="517" y="298" text-anchor="middle">gradient / normal balance</text>
  <rect x="610" y="221" width="145" height="92" rx="12" fill="#fff7ed" stroke="#d97706"/><text class="body" x="682" y="251" text-anchor="middle">complementarity</text><text class="math" x="682" y="277" text-anchor="middle">λ_i g_i = 0</text><text class="small" x="682" y="298" text-anchor="middle">active 可有 λ = 0</text>
  <rect x="445" y="340" width="310" height="48" rx="10" fill="#fee2e2" stroke="#dc2626"/><text class="body" x="600" y="361" text-anchor="middle">无 CQ：最优点也可能没有 multiplier</text><text class="small" x="600" y="380" text-anchor="middle">nonconvex：KKT point 也可能是 maximum / saddle</text>

  <text class="title" x="830" y="53">C · 证书、线性系统与 AI 结构</text><text class="sub" x="830" y="78">数值 residual 与模型含义必须同时检查</text>
  <rect x="840" y="104" width="316" height="68" rx="10" fill="#dbeafe" stroke="#2563eb"/><text class="body" x="998" y="130" text-anchor="middle">KKT residual</text><text class="small" x="998" y="153" text-anchor="middle">primal · dual · stationarity · complementarity</text>
  <line x1="998" y1="172" x2="998" y2="207" stroke="#2563eb" stroke-width="2" marker-end="url(#akb)"/>
  <rect x="840" y="214" width="316" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text class="body" x="998" y="240" text-anchor="middle">KKT linear system</text><text class="math" x="998" y="264" text-anchor="middle">[ H  Aᵀ ; A  0 ] [p;ν] = -[g;c]</text>
  <line x1="998" y1="284" x2="998" y2="319" stroke="#2563eb" stroke-width="2" marker-end="url(#akb)"/>
  <rect x="840" y="326" width="148" height="60" rx="10" fill="#dcfce7" stroke="#059669"/><text class="body" x="914" y="351" text-anchor="middle">SVM</text><text class="small" x="914" y="373" text-anchor="middle">α &gt; 0 → support</text>
  <rect x="1008" y="326" width="148" height="60" rx="10" fill="#fff7ed" stroke="#d97706"/><text class="body" x="1082" y="351" text-anchor="middle">maximum entropy</text><text class="small" x="1082" y="373" text-anchor="middle">moment → exponential form</text>
</svg>
