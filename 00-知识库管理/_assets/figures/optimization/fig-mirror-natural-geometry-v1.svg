<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#f8fafc"/>
  <style>
    .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#475569}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#64748b}.math{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}
  </style>
  <defs>
    <marker id="mb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#2563eb"/></marker>
    <marker id="mg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#059669"/></marker>
    <marker id="mr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#dc2626"/></marker>
  </defs>
  <rect class="panel" x="20" y="20" width="370" height="390" rx="14"/>
  <rect class="panel" x="415" y="20" width="370" height="390" rx="14"/>
  <rect class="panel" x="810" y="20" width="370" height="390" rx="14"/>

  <text class="title" x="40" y="53">A · mirror：在 dual coordinate 走</text>
  <text class="sub" x="40" y="78">potential ψ 同时决定 mirror map 与 Bregman movement</text>
  <ellipse cx="105" cy="175" rx="58" ry="42" fill="#dbeafe" stroke="#2563eb"/>
  <text class="body" x="105" y="171" text-anchor="middle">primal</text>
  <text class="math" x="105" y="193" text-anchor="middle">x_t</text>
  <ellipse cx="305" cy="175" rx="58" ry="42" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="body" x="305" y="171" text-anchor="middle">dual</text>
  <text class="math" x="305" y="193" text-anchor="middle">θ_t=∇ψ(x_t)</text>
  <path d="M163 158 C199 127 226 127 247 151" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
  <text class="small" x="205" y="121" text-anchor="middle">∇ψ</text>
  <path d="M247 201 C220 225 190 224 164 199" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#mb)"/>
  <text class="small" x="205" y="244" text-anchor="middle">(∇ψ)⁻¹</text>
  <line x1="305" y1="217" x2="305" y2="288" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/>
  <text class="small" x="316" y="258">−ηg_t</text>
  <ellipse cx="305" cy="324" rx="58" ry="36" fill="#dcfce7" stroke="#059669"/>
  <text class="math" x="305" y="329" text-anchor="middle">θ_(t+1)</text>
  <text class="math" x="45" y="384">Dψ(x,y)=ψ(x)−ψ(y)−⟨∇ψ(y),x−y⟩</text>

  <text class="title" x="435" y="53">B · entropy geometry 保持 simplex</text>
  <text class="sub" x="435" y="78">multiplicative update 自动保持 positive + normalized</text>
  <path d="M600 105 L458 330 L742 330 Z" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <circle cx="573" cy="253" r="7" fill="#2563eb"/>
  <circle cx="608" cy="218" r="7" fill="#7c3aed"/>
  <circle cx="640" cy="174" r="8" fill="#059669"/>
  <path d="M580 247 Q597 231 603 223" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mb)"/>
  <path d="M615 211 Q628 193 636 181" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#mb)"/>
  <text class="small" x="600" y="349" text-anchor="middle">probability simplex Δd</text>
  <rect x="447" y="367" width="326" height="28" rx="8" fill="#dcfce7" stroke="#059669"/>
  <text class="math" x="610" y="386" text-anchor="middle">x_i+ = x_i exp(−ηg_i) / Σ_j x_j exp(−ηg_j)</text>
  <text class="small" x="473" y="316">x_1</text>
  <text class="small" x="718" y="316">x_2</text>
  <text class="small" x="603" y="121">x_3</text>

  <text class="title" x="830" y="53">C · natural：KL trust region → Fisher</text>
  <text class="sub" x="830" y="78">exact local geometry 与工程近似要分层命名</text>
  <ellipse cx="985" cy="169" rx="126" ry="67" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <ellipse cx="985" cy="169" rx="78" ry="42" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="985" cy="169" r="6" fill="#0f172a"/>
  <line x1="985" y1="169" x2="891" y2="205" stroke="#dc2626" stroke-width="3" marker-end="url(#mr)"/>
  <text class="small" x="855" y="224">−F⁻¹g</text>
  <text class="math" x="985" y="267" text-anchor="middle">KL ≈ ½ δᵀFδ</text>
  <rect x="840" y="299" width="96" height="70" rx="9" fill="#dcfce7" stroke="#059669"/>
  <text class="body" x="888" y="325" text-anchor="middle">exact</text>
  <text class="small" x="888" y="348" text-anchor="middle">model Fisher</text>
  <rect x="951" y="299" width="96" height="70" rx="9" fill="#fff7ed" stroke="#d97706"/>
  <text class="body" x="999" y="325" text-anchor="middle">approx.</text>
  <text class="small" x="999" y="348" text-anchor="middle">K-FAC / block</text>
  <rect x="1062" y="299" width="96" height="70" rx="9" fill="#fee2e2" stroke="#dc2626"/>
  <text class="body" x="1110" y="325" text-anchor="middle">changed</text>
  <text class="small" x="1110" y="348" text-anchor="middle">+ λI / emp.</text>
  <text class="small" x="999" y="394" text-anchor="middle">finite step · damping · sampling 会改变 invariance</text>
</svg>
