<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#f8fafc"/>
  <style>
    .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#475569}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#64748b}.math{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}
  </style>
  <defs>
    <marker id="db" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#2563eb"/></marker>
    <marker id="dg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#059669"/></marker>
  </defs>
  <rect class="panel" x="20" y="20" width="370" height="390" rx="14"/>
  <rect class="panel" x="415" y="20" width="370" height="390" rx="14"/>
  <rect class="panel" x="810" y="20" width="370" height="390" rx="14"/>

  <text class="title" x="40" y="53">A · dual function 是下界族</text>
  <text class="sub" x="40" y="78">先对 x 取 infimum；每个 dual-feasible 点都在 p* 下方</text>
  <line x1="65" y1="337" x2="354" y2="337" stroke="#94a3b8"/>
  <line x1="65" y1="337" x2="65" y2="105" stroke="#94a3b8"/>
  <line x1="65" y1="157" x2="354" y2="157" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="math" x="345" y="148" text-anchor="end" fill="#dc2626">primal optimum p*</text>
  <path d="M78 314 Q122 247 164 275 Q210 307 252 225 Q293 154 342 198" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="295" cy="169" r="6" fill="#2563eb"/>
  <line x1="295" y1="169" x2="295" y2="157" stroke="#2563eb" stroke-width="2" marker-end="url(#db)"/>
  <text class="small" x="214" y="357">multipliers (λ, ν)</text>
  <text class="math" x="85" y="383">g(λ,ν) = infₓ L(x,λ,ν) ≤ p*</text>

  <text class="title" x="435" y="53">B · value、attainment 与 Slater</text>
  <text class="sub" x="435" y="78">相等的是数值；存在 optimizer 是另一个命题</text>
  <rect x="447" y="102" width="140" height="73" rx="11" fill="#dbeafe" stroke="#2563eb"/>
  <text class="body" x="517" y="128" text-anchor="middle">weak duality</text>
  <text class="math" x="517" y="154" text-anchor="middle">d* ≤ p*</text>
  <line x1="587" y1="139" x2="624" y2="139" stroke="#2563eb" stroke-width="2" marker-end="url(#db)"/>
  <rect x="631" y="102" width="140" height="73" rx="11" fill="#dcfce7" stroke="#059669"/>
  <text class="body" x="701" y="128" text-anchor="middle">strong duality</text>
  <text class="math" x="701" y="154" text-anchor="middle">d* = p*</text>
  <rect x="447" y="207" width="324" height="70" rx="11" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="body" x="609" y="232" text-anchor="middle">convex + relative-interior Slater</text>
  <text class="small" x="609" y="255" text-anchor="middle">通常给 zero gap + finite optimal multipliers</text>
  <line x1="609" y1="277" x2="609" y2="309" stroke="#059669" stroke-width="2" marker-end="url(#dg)"/>
  <rect x="447" y="316" width="150" height="65" rx="10" fill="#fff7ed" stroke="#d97706"/>
  <text class="body" x="522" y="342" text-anchor="middle">primal attained?</text>
  <text class="small" x="522" y="365" text-anchor="middle">需要另查 existence</text>
  <rect x="621" y="316" width="150" height="65" rx="10" fill="#fff7ed" stroke="#d97706"/>
  <text class="body" x="696" y="342" text-anchor="middle">dual attained?</text>
  <text class="small" x="696" y="365" text-anchor="middle">value equality不保证</text>

  <text class="title" x="830" y="53">C · primal–dual certificate</text>
  <text class="sub" x="830" y="78">上界、下界与 feasibility residual 必须成套出现</text>
  <rect x="844" y="107" width="306" height="60" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text class="body" x="997" y="132" text-anchor="middle">primal-feasible objective</text>
  <text class="math" x="997" y="154" text-anchor="middle">f₀(x̃)  ≥  p*</text>
  <line x1="997" y1="167" x2="997" y2="251" stroke="#7c3aed" stroke-width="3"/>
  <line x1="987" y1="169" x2="1007" y2="169" stroke="#7c3aed" stroke-width="3"/>
  <line x1="987" y1="251" x2="1007" y2="251" stroke="#7c3aed" stroke-width="3"/>
  <rect x="1020" y="184" width="118" height="51" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="body" x="1079" y="206" text-anchor="middle">gap</text>
  <text class="math" x="1079" y="226" text-anchor="middle">f₀ − g</text>
  <rect x="844" y="253" width="306" height="60" rx="10" fill="#dcfce7" stroke="#059669"/>
  <text class="body" x="997" y="278" text-anchor="middle">dual-feasible lower bound</text>
  <text class="math" x="997" y="300" text-anchor="middle">g(λ̃,ν̃) ≤ p*</text>
  <rect x="844" y="339" width="306" height="46" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text class="small" x="997" y="359" text-anchor="middle">先验收：constraint residual · λ ≥ 0 · inner infimum</text>
  <text class="small" x="997" y="377" text-anchor="middle">否则“小 gap”不是合法最优性证书</text>
</svg>

