<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#f8fafc"/>
  <style>
    .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#475569}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#64748b}.math{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}
  </style>
  <defs>
    <marker id="pb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#2563eb"/></marker>
    <marker id="pg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#059669"/></marker>
  </defs>
  <rect class="panel" x="20" y="20" width="370" height="390" rx="14"/>
  <rect class="panel" x="415" y="20" width="370" height="390" rx="14"/>
  <rect class="panel" x="810" y="20" width="370" height="390" rx="14"/>

  <text class="title" x="40" y="53">A · smooth step + structure step</text>
  <text class="sub" x="40" y="78">proximal gradient 精确最小化复合 local model</text>
  <circle cx="76" cy="179" r="25" fill="#dbeafe" stroke="#2563eb"/>
  <text class="math" x="76" y="184" text-anchor="middle">x_k</text>
  <line x1="102" y1="179" x2="177" y2="179" stroke="#2563eb" stroke-width="3" marker-end="url(#pb)"/>
  <text class="small" x="141" y="153" text-anchor="middle">−η∇f(x_k)</text>
  <circle cx="207" cy="179" r="28" fill="#fff7ed" stroke="#d97706"/>
  <text class="math" x="207" y="184" text-anchor="middle">v_k</text>
  <line x1="236" y1="179" x2="305" y2="179" stroke="#059669" stroke-width="3" marker-end="url(#pg)"/>
  <text class="small" x="270" y="153" text-anchor="middle">prox ηg</text>
  <circle cx="335" cy="179" r="29" fill="#dcfce7" stroke="#059669"/>
  <text class="math" x="335" y="184" text-anchor="middle">x_(k+1)</text>
  <rect x="48" y="246" width="314" height="74" rx="11" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="math" x="205" y="273" text-anchor="middle">x_(k+1) = prox ηg (x_k − η∇f(x_k))</text>
  <text class="small" x="205" y="299" text-anchor="middle">Gη(x)=0 ⇔ 0 ∈ ∇f(x)+∂g(x)</text>
  <text class="small" x="205" y="366" text-anchor="middle">f：smooth data fit · g：nonsmooth structure</text>

  <text class="title" x="435" y="53">B · ℓ₁ prox 产生 exact zero</text>
  <text class="sub" x="435" y="78">soft threshold 的 dead zone 来自 ∂|0|=[−1,1]</text>
  <line x1="455" y1="245" x2="755" y2="245" stroke="#94a3b8"/>
  <line x1="605" y1="103" x2="605" y2="353" stroke="#94a3b8"/>
  <line x1="465" y1="335" x2="565" y2="245" stroke="#2563eb" stroke-width="3"/>
  <line x1="565" y1="245" x2="645" y2="245" stroke="#dc2626" stroke-width="5"/>
  <line x1="645" y1="245" x2="745" y2="155" stroke="#2563eb" stroke-width="3"/>
  <line x1="565" y1="236" x2="565" y2="254" stroke="#dc2626" stroke-width="2"/>
  <line x1="645" y1="236" x2="645" y2="254" stroke="#dc2626" stroke-width="2"/>
  <text class="small" x="565" y="274" text-anchor="middle">−ηλ</text>
  <text class="small" x="645" y="274" text-anchor="middle">ηλ</text>
  <text class="math" x="605" y="383" text-anchor="middle">Sηλ(v)=sign(v)(|v|−ηλ)₊</text>
  <text class="small" x="744" y="232" text-anchor="end">input v</text>
  <text class="small" x="613" y="116">output</text>

  <text class="title" x="830" y="53">C · implicit operator 与 splitting</text>
  <text class="sub" x="830" y="78">“各自 prox 易算”不代表“和的 prox 可顺序算”</text>
  <rect x="842" y="106" width="138" height="65" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text class="body" x="911" y="132" text-anchor="middle">explicit</text>
  <text class="math" x="911" y="153" text-anchor="middle">I − η∇f</text>
  <rect x="1018" y="106" width="138" height="65" rx="10" fill="#dcfce7" stroke="#059669"/>
  <text class="body" x="1087" y="132" text-anchor="middle">implicit</text>
  <text class="math" x="1087" y="153" text-anchor="middle">(I+η∂g)⁻¹</text>
  <line x1="980" y1="139" x2="1010" y2="139" stroke="#2563eb" stroke-width="2" marker-end="url(#pb)"/>
  <rect x="842" y="211" width="314" height="70" rx="11" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="body" x="999" y="237" text-anchor="middle">forward–backward splitting</text>
  <text class="small" x="999" y="261" text-anchor="middle">一个 gradient oracle + 一个 prox oracle</text>
  <rect x="842" y="320" width="314" height="62" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text class="math" x="999" y="345" text-anchor="middle">prox(g+h) ≠ prox g ∘ prox h</text>
  <text class="small" x="999" y="367" text-anchor="middle">需要 separability 或 Douglas–Rachford / ADMM</text>
</svg>
