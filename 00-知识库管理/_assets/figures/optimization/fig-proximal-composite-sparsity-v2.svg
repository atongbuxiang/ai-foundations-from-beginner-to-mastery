<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">近端梯度、软阈值与显式隐式算子</title>
<desc id="desc">复合目标先对光滑项做显式梯度步，再对结构项做隐式近端步；L1 近端产生精确 dead zone；projection、proximal point 与 forward-backward splitting 是同一 resolvent 语言的不同实例。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">forward 后用 prox 恢复结构</text>
<path d="M55 390C110 290 190 250 270 260C330 268 355 330 365 390Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
<circle cx="90" cy="330" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="305" cy="160" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="265" cy="285" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<line x1="90" y1="330" x2="305" y2="160" stroke="#C24135" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<line x1="305" y1="160" x2="265" y2="285" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="65" y="355" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">x_k</text>
<text x="300" y="145" font-size="15" font-weight="650" text-anchor="middle" fill="#C24135">v=x_k-eta grad f</text>
<text x="275" y="310" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">prox_(eta g)(v)</text>
<text x="45" y="435" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">x_(k+1)=prox_(eta g)(x_k-eta grad f(x_k))</text>
<text x="45" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">gradient treats smooth f；prox solves structured g exactly。</text>
<text x="45" y="499" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">indicator prox = projection。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">L1 prox 的 soft-threshold</text>
<line x1="445" y1="300" x2="765" y2="300" stroke="#D7DEE8" stroke-width="2"/>
<line x1="605" y1="105" x2="605" y2="440" stroke="#D7DEE8" stroke-width="2"/>
<line x1="465" y1="120" x2="555" y2="210" stroke="#2563EB" stroke-width="3"/>
<line x1="555" y1="300" x2="655" y2="300" stroke="#C24135" stroke-width="4"/>
<line x1="655" y1="390" x2="745" y2="480" stroke="#2563EB" stroke-width="3"/>
<line x1="555" y1="285" x2="555" y2="315" stroke="#C24135" stroke-width="2"/>
<line x1="655" y1="285" x2="655" y2="315" stroke="#C24135" stroke-width="2"/>
<text x="555" y="338" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">-eta lambda</text>
<text x="655" y="338" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">+eta lambda</text>
<text x="470" y="155" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">v + eta lambda</text>
<text x="665" y="425" font-size="15" font-weight="650" text-anchor="start" fill="#2563EB">v - eta lambda</text>
<text x="605" y="260" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">0</text>
<text x="430" y="486" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">exact zeros arise from the nonsmooth kink。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">显式、隐式与 splitting</text>
<text x="830" y="105" font-size="17" font-weight="700" text-anchor="start" fill="#2563EB">gradient</text>
<line x1="830" y1="123" x2="880" y2="123" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<text x="895" y="129" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">x+ = x - eta grad f(x)</text>
<text x="830" y="230" font-size="17" font-weight="700" text-anchor="start" fill="#0F766E">proximal point</text>
<line x1="830" y1="248" x2="880" y2="248" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<text x="895" y="254" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">x+ = (I + eta partial g)^-1 x</text>
<text x="830" y="355" font-size="17" font-weight="700" text-anchor="start" fill="#C24135">forward-backward</text>
<line x1="830" y1="373" x2="880" y2="373" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="895" y="379" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">explicit grad f + implicit prox g</text>
<text x="830" y="450" font-size="15" font-weight="650" text-anchor="start" fill="#C24135" class="math">prox_(f+g) generally != prox_f o prox_g</text>
<text x="830" y="486" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">inexact / nonconvex prox: new error budget。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">近端法把不可微结构放进可解子问题；精确零、可行性与收敛证书都来自这个算子，而非事后剪枝。</text>
</svg>