<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">随机梯度、批量方差与固定步长噪声平台</title>
<desc id="desc">随机梯度在给定历史后应围绕目标梯度取条件均值；独立小批量的方差按一除以 B 缩减，相关与无放回抽样改变规律；固定步长在强凸局部通常先快速收敛再停在噪声平台。</desc>
