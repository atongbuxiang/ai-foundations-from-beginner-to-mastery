<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">KKT 的法向平衡、四组证书与逻辑层级</title>
<desc id="desc">活跃约束的法向量以非负乘子平衡目标梯度；KKT 包含 primal feasibility、dual feasibility、stationarity 与 complementary slackness；CQ 给必要性，凸性给充分性，二阶条件负责非凸分类。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">活跃法向量平衡目标梯度</text>
<path d="M55 400L55 210C130 195 205 160 275 105L355 105L355 400Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
<circle cx="205" cy="160" r="7" fill="#1F2937" stroke="#1F2937" stroke-width="2"/>
<line x1="205" y1="160" x2="120" y2="260" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<line x1="205" y1="160" x2="280" y2="88" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<line x1="205" y1="160" x2="315" y2="145" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<text x="88" y="280" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">grad f</text>
<text x="280" y="80" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">lambda_1 grad g_1</text>
<text x="275" y="172" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">lambda_2 grad g_2</text>
<text x="45" y="435" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">grad f + sum_i lambda_i grad g_i + J_h^T nu = 0</text>
<text x="45" y="470" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">inactive constraint -&gt; lambda_i=0</text>
<text x="45" y="498" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">multiplier signs follow the declared inequality convention。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">四组条件共同组成证书</text>
<circle cx="455" cy="105" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="465" y1="105" x2="500" y2="105" stroke="#2563EB" stroke-width="2.5"/>
<text x="510" y="98" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">primal feasible</text>
<text x="510" y="129" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">g(x)&lt;=0, h(x)=0</text>
<circle cx="455" cy="197" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<line x1="465" y1="197" x2="500" y2="197" stroke="#0F766E" stroke-width="2.5"/>
<text x="510" y="190" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">dual feasible</text>
<text x="510" y="221" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">lambda&gt;=0</text>
<circle cx="455" cy="289" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<line x1="465" y1="289" x2="500" y2="289" stroke="#C24135" stroke-width="2.5"/>
<text x="510" y="282" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">stationarity</text>
<text x="510" y="313" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">grad_x L=0</text>
<circle cx="455" cy="381" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="465" y1="381" x2="500" y2="381" stroke="#2563EB" stroke-width="2.5"/>
<text x="510" y="374" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">complementarity</text>
<text x="510" y="405" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">lambda_i g_i(x)=0</text>
<line x1="455" y1="115" x2="455" y2="375" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="5 5"/>
<text x="430" y="470" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">scale and report all four residuals separately。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">必要、充分与分类不可混写</text>
<text x="835" y="105" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">local optimum + CQ</text>
<line x1="835" y1="123" x2="960" y2="123" stroke="#C24135" stroke-width="2.5" marker-end="url(#a2)"/>
<text x="978" y="129" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">KKT is necessary</text>
<text x="835" y="230" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">convex problem + KKT</text>
<line x1="835" y1="248" x2="960" y2="248" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<text x="978" y="254" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">global optimum</text>
<text x="835" y="355" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">nonconvex KKT point</text>
<line x1="835" y1="373" x2="960" y2="373" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<text x="978" y="379" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">check critical-cone Hessian</text>
<text x="830" y="465" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">CQ failure: optimum may have no multiplier</text>
<text x="830" y="497" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">KKT alone gives neither strong duality nor SOSC。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">KKT 是带假设方向的证书系统：先检查符号与可行性，再检查 CQ、凸性和二阶曲率。</text>
</svg>