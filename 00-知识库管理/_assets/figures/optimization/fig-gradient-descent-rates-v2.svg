<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">L 把下降方向升级为有限步</text>
<line x1="50" y1="405" x2="370" y2="405" stroke="#D7DEE8" stroke-width="2"/>
<line x1="78" y1="430" x2="78" y2="95" stroke="#D7DEE8" stroke-width="2"/>
