<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">梯度下降的有限步证书、病态轨迹与收敛终点</title>
<desc id="desc">负梯度只给无穷小方向，descent lemma 给有限步下降；病态二次型中统一步长产生之字轨迹；非凸、凸和强凸假设导向不同的误差对象与速率。</desc>
