<circle cx="142" cy="205" r="6" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="232" cy="349.4429085648148" r="6" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<line x1="142" y1="420" x2="232" y2="420" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<text x="142" y="187" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">x_k</text>
<text x="232" y="377.4429085648148" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">x_k - eta grad f</text>
<text x="275" y="145" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">quadratic upper model</text>
<text x="45" y="468" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">Delta f &lt;= -eta(1-L eta/2)||grad f||^2</text>
<text x="45" y="499" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">0 &lt; eta &lt; 2/L gives descent；eta=1/L 便于证明。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">病态二次型产生 zig-zag</text>
<ellipse cx="605" cy="270" rx="145" ry="92" fill="none" stroke="#2563EB" stroke-width="2"/>
<ellipse cx="605" cy="270" rx="107" ry="66" fill="none" stroke="#2563EB" stroke-width="2"/>
<ellipse cx="605" cy="270" rx="70" ry="41" fill="none" stroke="#2563EB" stroke-width="2"/>
<ellipse cx="605" cy="270" rx="36" ry="20" fill="none" stroke="#2563EB" stroke-width="2"/>
<path d="M470.0 172.0L500.0 366.0L528.0 190.0L552.0 342.0L570.0 212.0L586.0 318.0L596.0 239.0L605.0 286.0L605.0 270.0" fill="none" stroke="#C24135" stroke-width="3"/>
<circle cx="470" cy="172" r="6" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="605" cy="270" r="6" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="460" y="152" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">x_0</text>
<text x="615" y="265" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">x*</text>
<text x="430" y="405" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">stable step controlled by L</text>
<text x="430" y="438" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">progress along slow axis controlled by mu</text>
<text x="430" y="477" font-size="15" font-weight="400" text-anchor="start" fill="#64748B" class="math">eta*=2/(L+mu), rho*=(kappa-1)/(kappa+1)</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">假设改变，终点也改变</text>
<circle cx="850" cy="122" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<line x1="860" y1="122" x2="895" y2="122" stroke="#C24135" stroke-width="2.5"/>
<text x="905" y="114" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">smooth + lower bounded</text>
<text x="905" y="147" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">min ||grad f||^2 = O(1/T)</text>
<line x1="850" y1="136" x2="850" y2="231" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="850" cy="245" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<line x1="860" y1="245" x2="895" y2="245" stroke="#2563EB" stroke-width="2.5"/>
<text x="905" y="237" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">+ convex</text>
<text x="905" y="270" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">function gap = O(1/T)</text>
<line x1="850" y1="259" x2="850" y2="354" stroke="#D7DEE8" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="850" cy="368" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<line x1="860" y1="368" x2="895" y2="368" stroke="#0F766E" stroke-width="2.5"/>
<text x="905" y="360" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">+ mu-strongly convex</text>
<text x="905" y="393" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">gap shrinks geometrically</text>
<text x="825" y="468" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">stationarity != global optimum != generalization</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">先用 L 证明有限步安全，再按函数类读取相应误差对象；收敛率不能跨假设改写。</text>
</svg>