<text x="430" y="430" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">almost-sure avoidance != finite-time escape</text>
<text x="430" y="468" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">finite-time proof needs Hessian-Lipschitz bounds。</text>
