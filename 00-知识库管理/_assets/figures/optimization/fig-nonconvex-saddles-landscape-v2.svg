<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">非凸驻点、strict-saddle 动力学与尺度对称性</title>
<desc id="desc">零梯度点可为极小、strict saddle 或 Hessian 看不出的退化鞍点；strict saddle 有稳定与不稳定方向并可借扰动有限时间逃逸；深网尺度对称性可保持预测函数不变却改变参数 Hessian sharpness。</desc>
