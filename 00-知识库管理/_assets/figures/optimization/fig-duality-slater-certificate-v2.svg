<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">弱对偶、Slater 强对偶与 primal-dual 证书</title>
<desc id="desc">每个 dual feasible multiplier 给 primal optimum 的下界；Slater 在凸问题中把下界推到最优值并通常带来 dual attainment；primal feasibility、dual feasibility、residual 与 gap 共同形成可计算证书。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">dual function 是一族全局下界</text>
<line x1="65" y1="415" x2="360" y2="415" stroke="#D7DEE8" stroke-width="2"/>
<line x1="85" y1="440" x2="85" y2="95" stroke="#D7DEE8" stroke-width="2"/>
<path d="M88.0 138.1L90.2 145.2L92.4 152.1L94.6 158.9L96.8 165.6L99.0 172.2L101.2 178.6L103.4 184.9L105.6 191.0L107.8 197.1L110.0 203.0L112.2 208.8L114.4 214.5L116.6 220.0L118.8 225.4L121.0 230.7L123.2 235.9L125.4 240.9L127.6 245.9L129.8 250.7L132.0 255.4L134.2 259.9L136.4 264.4L138.6 268.7L140.8 272.9L143.0 277.0L145.2 281.0L147.4 284.8L149.6 288.6L151.8 292.2L154.0 295.7L156.2 299.1L158.4 302.4L160.6 305.6L162.8 308.6L165.0 311.5L167.2 314.4L169.4 317.1L171.6 319.7L173.8 322.2L176.0 324.6L178.2 326.8L180.4 329.0L182.6 331.0L184.8 333.0L187.0 334.8L189.2 336.6L191.4 338.2L193.6 339.7L195.8 341.1L198.0 342.4L200.2 343.6L202.4 344.7L204.6 345.7L206.8 346.6L209.0 347.4L211.2 348.0L213.4 348.6L215.6 349.1L217.8 349.5L220.0 349.7L222.2 349.9L224.4 350.0L226.6 350.0L228.8 349.9L231.0 349.6L233.2 349.3L235.4 348.9L237.6 348.4L239.8 347.8L242.0 347.1L244.2 346.3L246.4 345.4L248.6 344.4L250.8 343.3L253.0 342.2L255.2 340.9L257.4 339.6L259.6 338.1L261.8 336.6L264.0 334.9L266.2 333.2L268.4 331.4L270.6 329.5L272.8 327.5L275.0 325.5L277.2 323.3L279.4 321.1L281.6 318.7L283.8 316.3L286.0 313.8L288.2 311.2L290.4 308.5L292.6 305.8L294.8 302.9L297.0 300.0L299.2 297.0L301.4 293.9L303.6 290.8L305.8 287.5L308.0 284.2L310.2 280.8L312.4 277.3L314.6 273.7L316.8 270.1L319.0 266.4L321.2 262.6L323.4 258.7L325.6 254.7L327.8 250.7L330.0 246.6L332.2 242.4L334.4 238.2L336.6 233.8L338.8 229.4L341.0 225.0L343.2 220.4L345.4 215.8L347.6 211.1L349.8 206.3L352.0 201.5" fill="none" stroke="#2563EB" stroke-width="3.5"/>
<line x1="95" y1="355" x2="345" y2="260" stroke="#0F766E" stroke-width="2.5" stroke-dasharray="7 5"/>
<line x1="95" y1="385" x2="345" y2="325" stroke="#C24135" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="275" y="160" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">primal objective</text>
<text x="265" y="245" font-size="15" font-weight="650" text-anchor="start" fill="#0F766E">L(x,lambda_1)</text>
<text x="265" y="322" font-size="15" font-weight="650" text-anchor="start" fill="#C24135">L(x,lambda_2)</text>
<text x="45" y="455" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">g(lambda,nu)=inf_x L(x,lambda,nu)</text>
<text x="45" y="486" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">dual feasible =&gt; g(lambda,nu) &lt;= p*</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">值相等与解被取得是两件事</text>
<text x="430" y="108" font-size="16" font-weight="700" text-anchor="start" fill="#C24135">weak only</text>
<line x1="565" y1="140" x2="750" y2="140" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="590" cy="140" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="710" cy="140" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<line x1="600" y1="140" x2="700" y2="140" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<text x="575" y="170" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">d*</text>
<text x="695" y="170" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">p*</text>
<text x="430" y="243" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">strong + dual attained</text>
<line x1="565" y1="275" x2="750" y2="275" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="650" cy="275" r="8" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<text x="668" y="281" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">d*=p*</text>
<text x="430" y="373" font-size="16" font-weight="700" text-anchor="start" fill="#2563EB">strong, dual not attained</text>
<line x1="565" y1="405" x2="750" y2="405" stroke="#D7DEE8" stroke-width="2"/>
<circle cx="650" cy="405" r="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2.5"/>
<text x="668" y="411" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">sup g = p*</text>
<text x="430" y="458" font-size="15" font-weight="650" text-anchor="start" fill="#64748B">open point = supremum not attained</text>
<text x="430" y="490" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">zero gap does not imply attainment。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">可计算 certificate 要同时可行</text>
<rect x="840" y="105" width="138" height="56" rx="8" fill="#FFFEFB" stroke="#2563EB" stroke-width="2"/>
<text x="909.0" y="139.0" font-size="17" font-weight="650" text-anchor="middle" fill="#2563EB">primal x</text>
<rect x="1000" y="105" width="145" height="56" rx="8" fill="#FFFEFB" stroke="#0F766E" stroke-width="2"/>
<text x="1072.5" y="139.0" font-size="15" font-weight="650" text-anchor="middle" fill="#0F766E">dual (lambda,nu)</text>
<line x1="910" y1="164" x2="910" y2="205" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a0)"/>
<line x1="1072" y1="164" x2="1072" y2="205" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a1)"/>
<text x="830" y="242" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937">check constraints + multiplier signs</text>
<line x1="830" y1="268" x2="1145" y2="268" stroke="#D7DEE8" stroke-width="2"/>
<text x="830" y="318" font-size="16" font-weight="700" text-anchor="start" fill="#1F2937" class="math">gap = f0(x) - g(lambda,nu) &gt;= 0</text>
<text x="830" y="358" font-size="17" font-weight="700" text-anchor="start" fill="#C24135" class="math">f0(x)-p* &lt;= gap</text>
<text x="830" y="410" font-size="16" font-weight="650" text-anchor="start" fill="#0F766E">convex + relative-interior Slater</text>
<text x="830" y="442" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937">=&gt; strong duality + typical multiplier attainment</text>
<text x="830" y="486" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">numerical residuals and scaling still matter。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">对偶的核心用途是下界与证书；tightness、attainment 和数值可验证性必须分开陈述。</text>
</svg>