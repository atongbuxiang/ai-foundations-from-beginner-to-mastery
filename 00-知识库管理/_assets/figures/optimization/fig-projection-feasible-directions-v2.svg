<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">切锥、法锥、投影梯度与常见投影算子</title>
<desc id="desc">边界最优性由切锥中没有下降方向或负梯度属于法锥表达；投影将不可行 raw step 拉回闭凸集；gradient mapping 连接原点与投影点；不同约束集具有不同投影算法。</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0F766E"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C24135"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1F2937"/></marker><style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif}.math{font-family:STIX Two Text,"Times New Roman",serif}</style></defs>
<rect width="1200" height="600" fill="#FFFEFB"/>
<line x1="400" y1="36" x2="400" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<line x1="800" y1="36" x2="800" y2="520" stroke="#D7DEE8" stroke-width="2"/>
<text x="42" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#2563EB">A</text>
<text x="80" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">边界最优性是 polar 几何</text>
<path d="M55 390C120 330 170 250 205 125C260 185 315 300 360 390Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
<circle cx="205" cy="125" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<path d="M205 125L80 365L345 365Z" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-dasharray="7 5"/>
<line x1="205" y1="125" x2="205" y2="55" stroke="#C24135" stroke-width="3" marker-end="url(#a2)"/>
<text x="95" y="330" font-size="16" font-weight="700" text-anchor="start" fill="#0F766E">tangent cone T_C(x)</text>
<text x="218" y="72" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">normal cone N_C(x)</text>
<text x="45" y="430" font-size="16" font-weight="650" text-anchor="start" fill="#1F2937" class="math">&lt;n,d&gt; &lt;= 0 for all d in T_C(x)</text>
<text x="45" y="467" font-size="17" font-weight="700" text-anchor="start" fill="#1F2937" class="math">-grad f(x*) in N_C(x*)</text>
<text x="45" y="498" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">gradient need not vanish at a constrained optimum。</text>
<text x="430" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#0F766E">B</text>
<text x="468" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">raw step 越界，projection 拉回</text>
<path d="M450 165C500 105 620 105 690 155C770 215 735 370 620 405C510 440 420 340 450 165Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
<circle cx="535" cy="250" r="7" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<circle cx="725" cy="95" r="7" fill="#C24135" stroke="#C24135" stroke-width="2"/>
<circle cx="680" cy="170" r="7" fill="#0F766E" stroke="#0F766E" stroke-width="2"/>
<line x1="535" y1="250" x2="725" y2="95" stroke="#C24135" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<line x1="725" y1="95" x2="680" y2="170" stroke="#0F766E" stroke-width="3" marker-end="url(#a1)"/>
<line x1="535" y1="250" x2="680" y2="170" stroke="#2563EB" stroke-width="3" marker-end="url(#a0)"/>
<text x="515" y="278" font-size="15" font-weight="700" text-anchor="start" fill="#2563EB">x_k</text>
<text x="700" y="82" font-size="15" font-weight="700" text-anchor="start" fill="#C24135">raw</text>
<text x="685" y="190" font-size="15" font-weight="700" text-anchor="start" fill="#0F766E">Pi_C(raw)</text>
<text x="430" y="450" font-size="15" font-weight="650" text-anchor="start" fill="#1F2937" class="math">G_eta(x) = (x-Pi_C(x-eta grad f))/eta</text>
<text x="430" y="486" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">G_eta=0 is the projected stationarity certificate。</text>
<text x="830" y="58" font-size="24" font-weight="700" text-anchor="start" fill="#C24135">C</text>
<text x="868" y="58" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">集合不同，projection 算法不同</text>
<path d="M850 190L900 105L950 190Z" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<circle cx="900" cy="145" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
<text x="900" y="220" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">simplex: sort + threshold</text>
<circle cx="1070" cy="150" r="48" fill="none" stroke="#0F766E" stroke-width="2.5"/>
<line x1="1070" y1="150" x2="1132" y2="110" stroke="#C24135" stroke-width="2.5" stroke-dasharray="6 4"/>
<line x1="1070" y1="150" x2="1110" y2="124" stroke="#0F766E" stroke-width="3"/>
<text x="1070" y="220" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">ball: radial clipping</text>
<line x1="850" y1="330" x2="955" y2="275" stroke="#2563EB" stroke-width="3"/>
<line x1="885" y1="395" x2="990" y2="340" stroke="#2563EB" stroke-width="3"/>
<line x1="930" y1="290" x2="930" y2="365" stroke="#0F766E" stroke-width="3" stroke-dasharray="6 4"/>
<text x="900" y="425" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">affine: linear solve</text>
<path d="M1030 285L1135 285L1110 395L1055 395Z" fill="none" stroke="#C24135" stroke-width="2.5"/>
<text x="1082" y="345" font-size="16" font-weight="700" text-anchor="middle" fill="#C24135">X &gt;= 0</text>
<text x="1090" y="425" font-size="15" font-weight="650" text-anchor="middle" fill="#1F2937">PSD: eigenvalue clipping</text>
<text x="825" y="486" font-size="15" font-weight="400" text-anchor="start" fill="#64748B">nonconvex set may have multiple projections。</text>
<line x1="60" y1="535" x2="1140" y2="535" stroke="#D7DEE8" stroke-width="2"/>
<text x="600" y="570" font-size="18" font-weight="650" text-anchor="middle" fill="#1F2937">投影不是一个抽象按钮：最优性依赖锥几何，算法与误差预算依赖具体集合结构。</text>
</svg>