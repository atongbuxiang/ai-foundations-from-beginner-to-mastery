<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#f8fafc"/>
  <style>
    .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#475569}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#64748b}
  </style>
  <rect class="panel" x="20" y="20" width="370" height="390" rx="14"/><rect class="panel" x="415" y="20" width="370" height="390" rx="14"/><rect class="panel" x="810" y="20" width="370" height="390" rx="14"/>
  <text class="title" x="40" y="53">A · chord、切线与 epigraph</text><text class="sub" x="40" y="78">同一个 convexity 的三种语言</text>
  <line x1="63" y1="330" x2="358" y2="330" stroke="#64748b" stroke-width="1.4"/><line x1="86" y1="102" x2="86" y2="350" stroke="#64748b" stroke-width="1.4"/>
  <path d="M90 180 Q220 390 350 180 L350 103 L90 103 Z" fill="#dbeafe" opacity="0.55"/>
  <path d="M90 180 Q220 390 350 180" fill="none" stroke="#2563eb" stroke-width="4"/>
  <circle cx="120" cy="220" r="6" fill="#7c3aed"/><circle cx="319" cy="220" r="6" fill="#7c3aed"/>
  <line x1="120" y1="220" x2="319" y2="220" stroke="#d97706" stroke-width="3"/>
  <circle cx="220" cy="285" r="6" fill="#2563eb"/><line x1="133" y1="285" x2="310" y2="285" stroke="#059669" stroke-width="2.5"/>
  <text class="small" x="232" y="307">tangent global lower bound</text><text class="small" x="198" y="205">chord 在 graph 上方</text><text class="small" x="105" y="117">epigraph</text>
  <text class="small" x="40" y="385">epi f convex ⇔ f convex</text>

  <text class="title" x="435" y="53">B · Jensen gap 是曲率 × 离散程度</text><text class="sub" x="435" y="78">先平均输入，再过 convex function 更低</text>
  <line x1="452" y1="330" x2="760" y2="330" stroke="#64748b" stroke-width="1.4"/><line x1="477" y1="103" x2="477" y2="348" stroke="#64748b" stroke-width="1.4"/>
  <path d="M487 175 Q615 400 744 175" fill="none" stroke="#2563eb" stroke-width="4"/>
  <circle cx="527" cy="230" r="6" fill="#7c3aed"/><circle cx="704" cy="230" r="6" fill="#7c3aed"/>
  <line x1="527" y1="230" x2="704" y2="230" stroke="#d97706" stroke-width="3"/>
  <circle cx="615" cy="300" r="6" fill="#2563eb"/><circle cx="615" cy="230" r="6" fill="#d97706"/>
  <line x1="615" y1="230" x2="615" y2="300" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text class="small" x="626" y="267">E f(X) − f(E X)</text><text class="small" x="592" y="321">E[X]</text>
  <rect x="456" y="356" width="306" height="32" rx="8" fill="#f1f5f9"/><text class="small" x="609" y="377" text-anchor="middle">strict equality 还要检查 support / affine region</text>

  <text class="title" x="830" y="53">C · logsumexp 的 AI 几何</text><text class="sub" x="830" y="78">smooth max、softmax gradient、covariance Hessian</text>
  <rect x="845" y="106" width="320" height="65" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="body" x="1005" y="132" text-anchor="middle">LSE(x) = log Σ exp(xᵢ)</text><text class="small" x="1005" y="153" text-anchor="middle">max xᵢ ≤ LSE ≤ max xᵢ + log n</text>
  <rect x="845" y="199" width="145" height="74" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
  <text class="body" x="917" y="226" text-anchor="middle">gradient LSE = p</text><text class="small" x="917" y="248" text-anchor="middle">p = softmax(x)</text>
  <rect x="1020" y="199" width="145" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="body" x="1092" y="226" text-anchor="middle">Hessian LSE</text><text class="small" x="1092" y="248" text-anchor="middle">diag(p) − ppᵀ is PSD</text>
  <line x1="990" y1="236" x2="1020" y2="236" stroke="#64748b" stroke-width="1.5"/>
  <rect x="845" y="304" width="320" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="body" x="1005" y="329" text-anchor="middle">null direction: 1</text><text class="small" x="1005" y="350" text-anchor="middle">对 logits 凸 ≠ 对全部深网权重凸</text>
  <text class="small" x="830" y="390">稳定实现：m + log Σ exp(xᵢ−m)</text>
</svg>
