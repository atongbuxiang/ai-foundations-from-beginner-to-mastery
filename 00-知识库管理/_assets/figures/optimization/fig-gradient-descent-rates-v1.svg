<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#f8fafc"/>
  <style>
    .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#475569}.body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#64748b}
  </style>
  <rect class="panel" x="20" y="20" width="370" height="390" rx="14"/><rect class="panel" x="415" y="20" width="370" height="390" rx="14"/><rect class="panel" x="810" y="20" width="370" height="390" rx="14"/>

  <text class="title" x="40" y="53">A · 有限步要落在二次上模型内</text><text class="sub" x="40" y="78">负梯度给方向，L 给步长尺度</text>
  <line x1="60" y1="321" x2="360" y2="321" stroke="#64748b" stroke-width="1.4"/><line x1="84" y1="104" x2="84" y2="345" stroke="#64748b" stroke-width="1.4"/>
  <path d="M96 95 Q220 390 344 95" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="7 5"/>
  <path d="M96 125 Q220 425 344 125" fill="none" stroke="#2563eb" stroke-width="4"/>
  <circle cx="130" cy="196" r="6" fill="#7c3aed"/><circle cx="220" cy="275" r="6" fill="#059669"/><circle cx="337" cy="141" r="6" fill="#dc2626"/>
  <line x1="130" y1="196" x2="220" y2="275" stroke="#059669" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="130" y1="196" x2="337" y2="141" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text class="small" x="218" y="294">η ≈ 1/L：下降</text><text class="small" x="260" y="126">η ≥ 2/L：可能振荡</text>
  <rect x="54" y="353" width="302" height="38" rx="8" fill="#dbeafe"/><text class="small" x="205" y="377" text-anchor="middle">Δf ≤ −η(1−Lη/2) ‖∇f‖²</text>

  <text class="title" x="435" y="53">B · ill-conditioning 造成 zig-zag</text><text class="sub" x="435" y="78">快方向限制稳定，慢方向决定进度</text>
  <ellipse cx="608" cy="222" rx="141" ry="90" fill="#dbeafe" opacity="0.40" stroke="#2563eb" stroke-width="2"/>
  <ellipse cx="608" cy="222" rx="101" ry="61" fill="none" stroke="#2563eb" stroke-width="2"/><ellipse cx="608" cy="222" rx="57" ry="32" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polyline points="480,150 500,300 525,165 548,280 568,185 584,260 595,205 606,225" fill="none" stroke="#d97706" stroke-width="3"/>
  <circle cx="480" cy="150" r="6" fill="#dc2626"/><circle cx="606" cy="225" r="6" fill="#059669"/>
  <text class="small" x="470" y="135">x₀</text><text class="small" x="615" y="219">x*</text>
  <rect x="454" y="351" width="307" height="40" rx="9" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
  <text class="body" x="607" y="376" text-anchor="middle">η* = 2/(L+μ)，ρ* = (κ−1)/(κ+1)</text>

  <text class="title" x="830" y="53">C · 假设不同，收敛终点不同</text><text class="sub" x="830" y="78">不要把 stationarity 改写成 global optimum</text>
  <rect x="845" y="106" width="319" height="68" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="body" x="1004" y="132" text-anchor="middle">smooth + lower bounded</text><text class="small" x="1004" y="155" text-anchor="middle">minimum squared gradient in first T steps = O(1/T)</text>
  <rect x="845" y="198" width="319" height="68" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="body" x="1004" y="224" text-anchor="middle">+ convex</text><text class="small" x="1004" y="247" text-anchor="middle">f(xT) − f* = O(1/T)</text>
  <rect x="845" y="290" width="319" height="68" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
  <text class="body" x="1004" y="316" text-anchor="middle">+ μ-strongly convex</text><text class="small" x="1004" y="339" text-anchor="middle">gap ≤ (1−1/κ)ᵀ × initial gap</text>
  <text class="small" x="830" y="390">以上仍不自动推出 held-out / deployment generalization</text>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#059669"/></marker></defs>
</svg>
