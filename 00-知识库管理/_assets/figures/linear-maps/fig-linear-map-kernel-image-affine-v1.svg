<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">线性映射的核、值域、仿射平移与非线性边界</title>
  <desc id="desc">左侧显示输入空间沿核方向的点被映到同一输出，中间显示线性映射由基向量的像确定，右侧比较线性、仿射和非线性映射。</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><style>.panel{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.label{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1e293b}.small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.map{stroke:#2563eb;stroke-width:3;marker-end:url(#arr);fill:none}.kernel{stroke:#7c3aed;stroke-width:5}.range{fill:#dbeafe;stroke:#3b82f6;stroke-width:2}.dot{fill:#ea580c}</style></defs><rect width="1200" height="430" fill="#fff"/>
  <g transform="translate(20,20)"><rect class="panel" width="370" height="390" rx="14"/><text class="title" x="20" y="34">1. 核合并不可辨识输入</text><ellipse cx="105" cy="215" rx="65" ry="125" fill="#ede9fe" stroke="#7c3aed"/><line class="kernel" x1="58" y1="288" x2="152" y2="142"/><circle class="dot" cx="82" cy="252" r="6"/><circle class="dot" cx="128" cy="181" r="6"/><ellipse class="range" cx="286" cy="215" rx="42" ry="112"/><circle class="dot" cx="286" cy="218" r="7"/><path class="map" d="M87 248 C170 210 205 214 278 218"/><path class="map" d="M133 181 C185 195 225 205 278 218"/><text class="label" x="50" y="102">V</text><text class="label" x="278" y="92">R(T)</text><text class="small" x="20" y="365">x−x'∈N(T) ⇒ Tx=Tx'</text></g>
  <g transform="translate(415,20)"><rect class="panel" width="370" height="390" rx="14"/><text class="title" x="20" y="34">2. 基的像决定整个映射</text><circle cx="88" cy="285" r="5" fill="#0f172a"/><line x1="88" y1="285" x2="225" y2="285" stroke="#2563eb" stroke-width="4" marker-end="url(#arr)"/><line x1="88" y1="285" x2="150" y2="155" stroke="#ea580c" stroke-width="4" marker-end="url(#arr)"/><text class="label" x="205" y="310">b₁</text><text class="label" x="135" y="145">b₂</text><circle cx="278" cy="285" r="5" fill="#0f172a"/><line x1="278" y1="285" x2="332" y2="205" stroke="#2563eb" stroke-width="4" marker-end="url(#arr)"/><line x1="278" y1="285" x2="220" y2="190" stroke="#ea580c" stroke-width="4" marker-end="url(#arr)"/><text class="label" x="310" y="195">Tb₁</text><text class="label" x="185" y="180">Tb₂</text><path class="map" d="M170 95 C210 70 250 70 290 95"/><text class="label" x="206" y="66">T</text><text class="small" x="20" y="365">T(Σxᵢbᵢ)=ΣxᵢTbᵢ</text></g>
  <g transform="translate(810,20)"><rect class="panel" width="370" height="390" rx="14"/><text class="title" x="20" y="34">3. 三种“近似相似”的对象</text><rect x="40" y="72" width="290" height="72" rx="10" fill="#dbeafe"/><text class="label" x="58" y="101">线性：Wx</text><text class="small" x="58" y="126">0→0，保持所有线性组合</text><rect x="40" y="166" width="290" height="72" rx="10" fill="#ffedd5"/><text class="label" x="58" y="195">仿射：Wx+b</text><text class="small" x="58" y="220">平移后保持仿射组合</text><rect x="40" y="260" width="290" height="72" rx="10" fill="#fee2e2"/><text class="label" x="58" y="289">局部线性化：f(x₀)+JΔ</text><text class="small" x="58" y="314">只是一阶局部近似</text><text class="small" x="20" y="365">先声明对象与范围，再调用线性结论</text></g>
</svg>
