<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">矩阵范数的算子几何、奇异值几何与对偶</title><desc id="d">三个面板依次展示单位圆被映成椭圆，奇异值向量的无穷、二、一范数，以及范数约束与对偶最速方向。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker><style>.T{font:700 22px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.P{font:700 17px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.B{font:14px -apple-system,"PingFang SC",sans-serif;fill:#334155}.S{font:12px -apple-system,"PingFang SC",sans-serif;fill:#475569}.M{font:italic 15px Georgia,serif;fill:#0f172a}</style></defs><rect width="1200" height="430" rx="18" fill="#f8fafc"/><text x="42" y="38" class="T">矩阵范数：选择“大小”，就是选择误差和优化的几何</text>
<g transform="translate(30 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">A  算子范数：最坏输入放大</text><circle cx="88" cy="160" r="62" fill="#dbeafe" fill-opacity=".45" stroke="#2563eb" stroke-width="3"/><line x1="88" y1="160" x2="142" y2="132" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="103" y="119" class="S">单位输入 x</text><path d="M156 160H205" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="171" y="147" class="M">A</text><ellipse cx="272" cy="160" rx="78" ry="35" transform="rotate(-20 272 160)" fill="#ffedd5" fill-opacity=".65" stroke="#f97316" stroke-width="4"/><line x1="272" y1="160" x2="340" y2="135" stroke="#ef4444" stroke-width="3"/><line x1="272" y1="160" x2="260" y2="128" stroke="#22c55e" stroke-width="3"/><text x="274" y="121" class="S">σ₁：最长半轴</text><text x="20" y="279" class="M">‖A‖₂ = max ‖Ax‖₂ = σ₁</text><text x="20" y="305" class="S">输入球 → 输出椭球；只看最坏方向</text><text x="20" y="326" class="S">形状：A ∈ Fᵐˣⁿ，x ∈ Fⁿ，Ax ∈ Fᵐ</text></g>
<g transform="translate(420 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">B  酉不变范数：对奇异值取范数</text><line x1="35" y1="248" x2="326" y2="248" stroke="#94a3b8"/><rect x="54" y="72" width="43" height="176" rx="5" fill="#2563eb"/><rect x="119" y="119" width="43" height="129" rx="5" fill="#3b82f6"/><rect x="184" y="169" width="43" height="79" rx="5" fill="#60a5fa"/><rect x="249" y="210" width="43" height="38" rx="5" fill="#93c5fd"/><text x="66" y="267" class="S">σ₁</text><text x="131" y="267" class="S">σ₂</text><text x="196" y="267" class="S">σ₃</text><text x="261" y="267" class="S">σ₄</text><text x="20" y="296" class="M">ℓ∞ → ‖A‖₂　 ℓ₂ → ‖A‖F　 ℓ₁ → ‖A‖*</text><text x="20" y="321" class="S">峰值 / 总平方能量 / 总谱质量回答不同问题</text></g>
<g transform="translate(810 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">C  对偶范数：约束球决定最速方向</text><path d="M84 74L144 134L84 194L24 134Z" transform="translate(18 10)" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><ellipse cx="252" cy="144" rx="70" ry="48" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><line x1="102" y1="144" x2="154" y2="101" stroke="#ef4444" stroke-width="3" marker-end="url(#a)"/><line x1="252" y1="144" x2="322" y2="144" stroke="#ef4444" stroke-width="3" marker-end="url(#a)"/><text x="40" y="226" class="S">不同更新约束球</text><text x="210" y="226" class="S">不同接触/最速方向</text><path d="M50 255H310" stroke="#cbd5e1"/><text x="20" y="281" class="M">min 〈G, Δ〉,  ‖Δ‖ ≤ η</text><text x="20" y="306" class="M">最大一阶下降 = η ‖G‖°</text><text x="20" y="329" class="S">F 自对偶；谱 ↔ 核。负梯度不是无条件结论</text></g></svg>
