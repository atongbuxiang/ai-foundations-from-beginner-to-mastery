<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">基、坐标、主动变换与病态基</title>
  <desc id="desc">左面板展示同一抽象向量在两组基下有不同坐标，中面板对比被动换坐标和主动改变向量，右面板展示近共线基导致大坐标和误差放大。</desc>
  <defs><marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker><style>.panel{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.label{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1e293b}.small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.axis{stroke:#94a3b8;stroke-width:1.5}.b{stroke:#2563eb;stroke-width:4;marker-end:url(#ab)}.o{stroke:#ea580c;stroke-width:4;marker-end:url(#ao)}.dash{stroke:#7c3aed;stroke-width:3;stroke-dasharray:7 5;marker-end:url(#ab)}</style></defs>
  <rect width="1200" height="430" fill="#fff"/>
  <g transform="translate(20,20)"><rect class="panel" width="370" height="390" rx="14"/><text class="title" x="20" y="34">1. 对象不变，坐标改变</text><line class="axis" x1="55" y1="320" x2="330" y2="320"/><line class="axis" x1="90" y1="355" x2="90" y2="70"/><line class="b" x1="90" y1="320" x2="270" y2="150"/><line class="o" x1="90" y1="320" x2="245" y2="320"/><line class="o" x1="90" y1="320" x2="200" y2="220"/><text class="label" x="272" y="148">x</text><text class="label" x="200" y="344">b₁</text><text class="label" x="205" y="212">b₂</text><rect x="55" y="70" width="255" height="68" rx="8" fill="#dbeafe"/><text class="label" x="72" y="97">[x]E = (3,2)ᵀ</text><text class="label" x="72" y="124">[x]B = (1,2)ᵀ</text><text class="small" x="20" y="370">坐标映射依赖基；抽象向量 x 不变</text></g>
  <g transform="translate(415,20)"><rect class="panel" width="370" height="390" rx="14"/><text class="title" x="20" y="34">2. 被动换基 vs 主动变换</text><rect x="45" y="78" width="115" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6"/><rect x="210" y="78" width="115" height="72" rx="10" fill="#dcfce7" stroke="#16a34a"/><text class="label" x="68" y="108">[x]B</text><text class="small" x="58" y="132">同一对象</text><text class="label" x="232" y="108">[x]C</text><text class="small" x="223" y="132">新坐标</text><line class="b" x1="160" y1="114" x2="208" y2="114"/><text class="small" x="162" y="93">P</text><rect x="45" y="225" width="115" height="72" rx="10" fill="#ffedd5" stroke="#f97316"/><rect x="210" y="225" width="115" height="72" rx="10" fill="#fee2e2" stroke="#ef4444"/><text class="label" x="80" y="255">x</text><text class="small" x="61" y="280">原向量</text><text class="label" x="241" y="255">Tx</text><text class="small" x="224" y="280">新向量</text><line class="o" x1="160" y1="261" x2="208" y2="261"/><text class="small" x="164" y="240">T</text><text class="small" x="20" y="365">前者改描述；后者真的改变对象</text></g>
  <g transform="translate(810,20)"><rect class="panel" width="370" height="390" rx="14"/><text class="title" x="20" y="34">3. 近共线基放大坐标误差</text><line class="axis" x1="48" y1="315" x2="330" y2="315"/><line class="axis" x1="90" y1="350" x2="90" y2="72"/><line class="b" x1="90" y1="315" x2="300" y2="170"/><line class="o" x1="90" y1="315" x2="303" y2="184"/><line class="dash" x1="90" y1="315" x2="90" y2="105"/><text class="label" x="280" y="160">b₁</text><text class="label" x="285" y="207">b₂</text><text class="label" x="103" y="120">x</text><rect x="115" y="238" width="190" height="52" rx="8" fill="#ede9fe"/><text class="label" x="132" y="269">c₁≈−1/ε, c₂≈1/ε</text><text class="small" x="20" y="366">基存在 ≠ 坐标可靠；检查 σmin 与 κ(B)</text></g>
</svg>
