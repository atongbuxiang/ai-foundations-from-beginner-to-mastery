<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">正交投影的几何分解、算子刻画和计算路径</title>
  <desc id="desc">三面板教学图：向量分解为子空间分量与正交残差；正交投影同时幂等和自伴；实际计算优先通过正交基、QR 或 SVD 做 action。</desc>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker>
    <style>.t{font:700 22px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#0f172a}.pt{font:700 17px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#0f172a}.b{font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#334155}.s{font:12px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#475569}.m{font:italic 15px Georgia,serif;fill:#0f172a}</style>
  </defs>
  <rect width="1200" height="430" rx="18" fill="#f8fafc"/>
  <text x="42" y="38" class="t">正交投影：最近点、算子恒等式与稳定实现是同一结构</text>
  <g transform="translate(30 58)">
    <rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/>
    <text x="20" y="31" class="pt">A  唯一正交分解</text>
    <line x1="35" y1="270" x2="330" y2="150" stroke="#60a5fa" stroke-width="5"/>
    <text x="286" y="135" class="s">子空间 U</text>
    <circle cx="245" cy="95" r="6" fill="#ef4444"/><text x="255" y="93" class="m">x</text>
    <circle cx="192" cy="206" r="6" fill="#2563eb"/><text x="201" y="222" class="m">Pᵤx</text>
    <line x1="245" y1="95" x2="192" y2="206" stroke="#ef4444" stroke-width="3" marker-end="url(#arr)"/>
    <line x1="47" y1="260" x2="192" y2="206" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/>
    <polyline points="184,188 200,182 207,198" fill="none" stroke="#334155" stroke-width="2"/>
    <text x="218" y="153" class="m">r = x − Pᵤx</text>
    <rect x="20" y="292" width="320" height="30" rx="8" fill="#eff6ff"/>
    <text x="31" y="312" class="s">x = Pᵤx + r，且 r ⟂ U；由勾股定理得到最近点</text>
  </g>
  <g transform="translate(420 58)">
    <rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/>
    <text x="20" y="31" class="pt">B  两条条件缺一不可</text>
    <circle cx="105" cy="126" r="58" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="255" cy="126" r="58" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="69" y="119" class="m">P² = P</text><text x="70" y="143" class="s">投影一次即稳定</text>
    <text x="218" y="119" class="m">P* = P</text><text x="209" y="143" class="s">残差方向为正交补</text>
    <rect x="65" y="211" width="230" height="55" rx="12" fill="#dcfce7" stroke="#22c55e"/>
    <text x="101" y="235" class="b">正交投影到 R(P)</text>
    <text x="85" y="255" class="s">N(P) = R(P)⊥，且 ‖P‖₂ = 1</text>
    <line x1="105" y1="185" x2="140" y2="208" stroke="#334155" marker-end="url(#arr)"/>
    <line x1="255" y1="185" x2="220" y2="208" stroke="#334155" marker-end="url(#arr)"/>
    <rect x="42" y="290" width="276" height="29" rx="8" fill="#fff7ed"/>
    <text x="55" y="310" class="s">只有 P²=P：可能是范数大于 1 的斜投影</text>
  </g>
  <g transform="translate(810 58)">
    <rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/>
    <text x="20" y="31" class="pt">C  计算时应用 action，不造大矩阵</text>
    <rect x="20" y="64" width="92" height="52" rx="10" fill="#dbeafe" stroke="#60a5fa"/><text x="35" y="86" class="b">正交基 Q</text><text x="35" y="105" class="s">m × k</text>
    <line x1="113" y1="90" x2="140" y2="90" stroke="#334155" marker-end="url(#arr)"/>
    <rect x="144" y="64" width="194" height="52" rx="10" fill="#dcfce7" stroke="#22c55e"/><text x="161" y="88" class="m">x ↦ Q(Q*x)</text><text x="161" y="106" class="s">O(mk)，不形成 m × m 的 P</text>
    <text x="20" y="155" class="b">只有生成矩阵 A 时</text>
    <rect x="20" y="174" width="82" height="46" rx="9" fill="#f1f5f9"/><text x="42" y="203" class="b">QR</text>
    <rect x="139" y="174" width="82" height="46" rx="9" fill="#f1f5f9"/><text x="160" y="203" class="b">QRCP</text>
    <rect x="258" y="174" width="80" height="46" rx="9" fill="#f1f5f9"/><text x="282" y="203" class="b">SVD</text>
    <line x1="103" y1="197" x2="136" y2="197" stroke="#94a3b8" marker-end="url(#arr)"/>
    <line x1="222" y1="197" x2="255" y2="197" stroke="#94a3b8" marker-end="url(#arr)"/>
    <text x="20" y="252" class="s">条件良好</text><text x="135" y="252" class="s">可能秩亏</text><text x="258" y="252" class="s">近秩亏/阈值</text>
    <rect x="20" y="278" width="318" height="43" rx="9" fill="#fee2e2"/>
    <text x="33" y="298" class="s">避免：形成 A*A、求逆、再显式形成 P</text>
    <text x="33" y="315" class="s">条件数平方；存储可能从 O(mk) 增到 O(m²)</text>
  </g>
</svg>
