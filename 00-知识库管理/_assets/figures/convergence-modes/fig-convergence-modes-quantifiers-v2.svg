<text x="418.0" y="378.0" font-size="18" font-weight="600" text-anchor="end" fill="#1F2937">n</text>
<text x="54.0" y="228.0" font-size="18" font-weight="600" text-anchor="middle" fill="#1F2937" transform="rotate(-90 54.0 228.0)">|a_n−0|</text>
