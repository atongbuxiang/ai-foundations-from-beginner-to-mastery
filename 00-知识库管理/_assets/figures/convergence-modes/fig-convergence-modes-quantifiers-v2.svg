<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="435" viewBox="0 0 1200 435" role="img" aria-labelledby="title desc">
<title id="title">极限量词、逐点与一致收敛、尖峰反例</title>
<desc id="desc">三个面板分别展示 epsilon-N 尾部、x 的 n 次方逐点但非一致收敛，以及面积不消失的连续尖峰。</desc>
<style>text{font-family:Inter,"PingFang SC","Noto Sans CJK SC",sans-serif;}</style>
<rect width="1200" height="435" fill="#FFFEFB"/>
<g transform="scale(0.86956522)">
<text x="48.0" y="38.0" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">A  ε–N：控制整个无限尾部</text>
<text x="48.0" y="63.0" font-size="18" font-weight="400" text-anchor="start" fill="#64748B">a_n=1/n；取 ε=0.15，可选 N=7</text>
<rect x="88.0" y="103.0" width="330.0" height="250.0" fill="#ffffff" stroke="#cad2dc" stroke-width="1"/>
