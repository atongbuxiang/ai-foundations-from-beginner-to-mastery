<text x="58.0" y="392.0" font-size="18" font-weight="600" text-anchor="start" fill="#1F2937">不是“命中一次”，而是 n≥N 后永远合格。</text>
<text x="58.0" y="417.0" font-size="18" font-weight="400" text-anchor="start" fill="#64748B">有限前缀可以很坏；定义只约束尾部。</text>
<text x="495.0" y="38.0" font-size="22" font-weight="700" text-anchor="start" fill="#1F2937">B  逐点收敛 ≠ 一致收敛</text>
<text x="495.0" y="63.0" font-size="18" font-weight="400" text-anchor="start" fill="#64748B">f_n(x)=x^n on [0,1]；坏区向 x=1 逃逸</text>
