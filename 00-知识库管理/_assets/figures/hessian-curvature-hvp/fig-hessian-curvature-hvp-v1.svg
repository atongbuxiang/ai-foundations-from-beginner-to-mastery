<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="590" viewBox="0 0 1380 590" role="img" aria-labelledby="title desc">
<title id="title">Hessian、二阶微分、方向曲率与矩阵自由 HVP</title>
<desc id="desc">三个面板展示二阶导数的双线性类型、Hessian 的特征方向曲率，以及无需形成完整 Hessian 的 HVP 和 GGN 作用链。</desc>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker><marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ea580c"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#059669"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker></defs>
<rect width="1380" height="590" fill="#f8fafc"/>
<text x="34.0" y="38.0" font-size="19" font-weight="700" text-anchor="start" fill="#172033">A  二阶导数的本体是双线性型</text>
<text x="34.0" y="64.0" font-size="12" font-weight="400" text-anchor="start" fill="#5d6978">先接收两个方向，再得到一个标量</text>
<rect x="42.0" y="104.0" width="114.0" height="72.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="99.0" y="134.0" font-size="13" font-weight="700" text-anchor="middle" fill="#2563eb">方向 u</text>
<text x="99.0" y="157.0" font-size="13" font-weight="650" text-anchor="middle" fill="#172033">u ∈ Rⁿ</text>
<rect x="42.0" y="203.0" width="114.0" height="72.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="99.0" y="233.0" font-size="13" font-weight="700" text-anchor="middle" fill="#7c3aed">方向 v</text>
<text x="99.0" y="256.0" font-size="13" font-weight="650" text-anchor="middle" fill="#172033">v ∈ Rⁿ</text>
<line x1="162.0" y1="140.0" x2="239.0" y2="169.0" stroke="#2563eb" stroke-width="2.7" opacity="1.0" marker-end="url(#arrow-blue)"/>
<line x1="162.0" y1="239.0" x2="239.0" y2="199.0" stroke="#7c3aed" stroke-width="2.7" opacity="1.0" marker-end="url(#arrow-purple)"/>
<rect x="244.0" y="137.0" width="153.0" height="102.0" rx="14" fill="#ffffff" stroke="#172033" stroke-width="2"/>
<text x="321.0" y="172.0" font-size="17" font-weight="700" text-anchor="middle" fill="#172033">D²f(x)[u,v]</text>
<text x="321.0" y="202.0" font-size="14" font-weight="700" text-anchor="middle" fill="#ea580c">= uᵀHv ∈ R</text>
<text x="321.0" y="224.0" font-size="11" font-weight="500" text-anchor="middle" fill="#5d6978">对 u、v 分别线性</text>
<text x="48.0" y="322.0" font-size="12" font-weight="700" text-anchor="start" fill="#172033">选定欧氏坐标后：</text>
<rect x="136.0" y="344.0" width="58.0" height="48.0" rx="0" fill="#dbeafe" stroke="#d9e0e8" stroke-width="1.0"/>
<text x="165.0" y="375.0" font-size="15" font-weight="700" text-anchor="middle" fill="#172033">4</text>
<rect x="194.0" y="344.0" width="58.0" height="48.0" rx="0" fill="#f3e8ff" stroke="#d9e0e8" stroke-width="1.0"/>
<text x="223.0" y="375.0" font-size="15" font-weight="700" text-anchor="middle" fill="#172033">1</text>
<rect x="136.0" y="392.0" width="58.0" height="48.0" rx="0" fill="#f3e8ff" stroke="#d9e0e8" stroke-width="1.0"/>
<text x="165.0" y="423.0" font-size="15" font-weight="700" text-anchor="middle" fill="#172033">1</text>
<rect x="194.0" y="392.0" width="58.0" height="48.0" rx="0" fill="#dcfce7" stroke="#d9e0e8" stroke-width="1.0"/>
<text x="223.0" y="423.0" font-size="15" font-weight="700" text-anchor="middle" fill="#172033">2</text>
<text x="107.0" y="402.0" font-size="17" font-weight="700" text-anchor="middle" fill="#172033">H =</text>
<text x="194.0" y="463.0" font-size="14" font-weight="700" text-anchor="middle" fill="#059669">H = Hᵀ</text>
<text x="194.0" y="487.0" font-size="12" font-weight="600" text-anchor="middle" fill="#5d6978">Hᵢⱼ = ∂ᵢ∂ⱼ f</text>
<text x="445.0" y="38.0" font-size="19" font-weight="700" text-anchor="start" fill="#172033">B  二次局部模型把曲率分到特征方向</text>
<text x="445.0" y="64.0" font-size="12" font-weight="400" text-anchor="start" fill="#5d6978">mₓ(h)=f(x)+gᵀh+½hᵀHh</text>
<ellipse cx="652.0" cy="237.0" rx="150.0" ry="72.0" fill="none" stroke="#2563eb" stroke-width="1.7" opacity="0.45"/>
<ellipse cx="652.0" cy="237.0" rx="115.0" ry="55.0" fill="none" stroke="#2563eb" stroke-width="1.7" opacity="0.55"/>
<ellipse cx="652.0" cy="237.0" rx="78.0" ry="37.0" fill="none" stroke="#2563eb" stroke-width="1.7" opacity="0.7"/>
<ellipse cx="652.0" cy="237.0" rx="42.0" ry="20.0" fill="none" stroke="#2563eb" stroke-width="1.7" opacity="0.9"/>
<line x1="484.0" y1="237.0" x2="822.0" y2="237.0" stroke="#d9e0e8" stroke-width="1.2" opacity="1.0"/>
<line x1="652.0" y1="333.0" x2="652.0" y2="139.0" stroke="#d9e0e8" stroke-width="1.2" opacity="1.0"/>
<circle cx="652.0" cy="237.0" r="5.0" fill="#172033" stroke="#ffffff" stroke-width="1.2"/>
<line x1="652.0" y1="237.0" x2="796.0" y2="237.0" stroke="#2563eb" stroke-width="3" opacity="1.0" marker-end="url(#arrow-blue)"/>
<text x="797.0" y="225.0" font-size="13" font-weight="700" text-anchor="middle" fill="#2563eb">q₁</text>
<text x="755.0" y="261.0" font-size="11" font-weight="650" text-anchor="middle" fill="#2563eb">λ₁ 小：平缓</text>
<line x1="652.0" y1="237.0" x2="652.0" y2="150.0" stroke="#dc2626" stroke-width="3" opacity="1.0" marker-end="url(#arrow-red)"/>
<text x="668.0" y="151.0" font-size="13" font-weight="700" text-anchor="start" fill="#dc2626">q₂</text>
<text x="727.0" y="179.0" font-size="11" font-weight="650" text-anchor="middle" fill="#dc2626">λ₂ 大：陡峭</text>
<text x="652.0" y="363.0" font-size="15" font-weight="700" text-anchor="middle" fill="#172033">hᵀHh = Σᵢ λᵢ zᵢ²</text>
<rect x="461.0" y="396.0" width="391.0" height="102.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="480.0" y="425.0" font-size="12" font-weight="700" text-anchor="start" fill="#059669">λmin &gt; 0：局部碗形 / 驻点严格极小</text>
<text x="480.0" y="451.0" font-size="12" font-weight="700" text-anchor="start" fill="#dc2626">λmin &lt; 0 &lt; λmax：存在负曲率 / 鞍形</text>
<text x="480.0" y="477.0" font-size="12" font-weight="700" text-anchor="start" fill="#ea580c">有 λ = 0：二阶判别可能不充分</text>
<text x="902.0" y="38.0" font-size="19" font-weight="700" text-anchor="start" fill="#172033">C  大模型只调用曲率算子，不形成整张表</text>
<text x="902.0" y="64.0" font-size="12" font-weight="400" text-anchor="start" fill="#5d6978">H 有 n² 个坐标；HVP 只返回 n 个坐标</text>
<circle cx="940.0" cy="141.0" r="26.0" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/>
<text x="940.0" y="147.0" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">v</text>
<line x1="971.0" y1="141.0" x2="1059.0" y2="141.0" stroke="#2563eb" stroke-width="3" opacity="1.0" marker-end="url(#arrow-blue)"/>
<rect x="1064.0" y="104.0" width="142.0" height="74.0" rx="12" fill="#ffffff" stroke="#172033" stroke-width="2"/>
<text x="1135.0" y="132.0" font-size="14" font-weight="700" text-anchor="middle" fill="#172033">JVP of grad</text>
<text x="1135.0" y="157.0" font-size="12" font-weight="600" text-anchor="middle" fill="#5d6978">D(∇f)(x)[v]</text>
<line x1="1211.0" y1="141.0" x2="1295.0" y2="141.0" stroke="#059669" stroke-width="3" opacity="1.0" marker-end="url(#arrow-green)"/>
<circle cx="1326.0" cy="141.0" r="31.0" fill="#059669" stroke="#ffffff" stroke-width="1.2"/>
<text x="1326.0" y="147.0" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">Hv</text>
<rect x="914.0" y="214.0" width="438.0" height="78.0" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="1133.0" y="241.0" font-size="13" font-weight="700" text-anchor="middle" fill="#dc2626">精确 Hessian 作用：可能含负曲率</text>
<text x="1133.0" y="267.0" font-size="14" font-weight="700" text-anchor="middle" fill="#172033">Hv = JᵀHℓJv + Σᵢ gᵢ Hᵢv</text>
<text x="914.0" y="329.0" font-size="13" font-weight="700" text-anchor="start" fill="#172033">GGN 的矩阵自由三段作用</text>
<rect x="896.0" y="352.0" width="112.0" height="70.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
<text x="952.0" y="379.0" font-size="13" font-weight="700" text-anchor="middle" fill="#2563eb">JVP</text>
<text x="952.0" y="402.0" font-size="12" font-weight="650" text-anchor="middle" fill="#172033">a = Jv</text>
<rect x="1068.0" y="352.0" width="112.0" height="70.0" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
<text x="1124.0" y="379.0" font-size="13" font-weight="700" text-anchor="middle" fill="#ea580c">输出曲率</text>
<text x="1124.0" y="402.0" font-size="12" font-weight="650" text-anchor="middle" fill="#172033">b = Hℓa</text>
<rect x="1243.0" y="352.0" width="112.0" height="70.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="1299.0" y="379.0" font-size="13" font-weight="700" text-anchor="middle" fill="#7c3aed">VJP</text>
<text x="1299.0" y="402.0" font-size="12" font-weight="650" text-anchor="middle" fill="#172033">Jᵀb</text>
<line x1="1011.0" y1="387.0" x2="1063.0" y2="387.0" stroke="#2563eb" stroke-width="2.5" opacity="1.0" marker-end="url(#arrow-blue)"/>
<line x1="1183.0" y1="387.0" x2="1238.0" y2="387.0" stroke="#7c3aed" stroke-width="2.5" opacity="1.0" marker-end="url(#arrow-purple)"/>
<rect x="914.0" y="452.0" width="438.0" height="48.0" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="1133.0" y="482.0" font-size="13" font-weight="700" text-anchor="middle" fill="#059669">若 Hℓ ⪰ 0，则 GGN = JᵀHℓJ ⪰ 0</text>
<text x="690.0" y="550.0" font-size="14" font-weight="700" text-anchor="middle" fill="#172033">二阶本体：D²f[u,v]  ·  方向曲率：vᵀHv  ·  矩阵自由作用：Hv = D(∇f)[v]</text>
<text x="690.0" y="576.0" font-size="11" font-weight="550" text-anchor="middle" fill="#5d6978">精确 Hessian 保留模型二阶项与负曲率；GN / GGN / Fisher 是有条件、有结构、目标不同的替代曲率</text>
</svg>