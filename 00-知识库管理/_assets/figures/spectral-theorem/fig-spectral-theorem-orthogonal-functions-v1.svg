<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">有限维谱定理</title><desc id="d">正规结构导出酉特征基，谱投影分解并允许逐特征值定义矩阵函数。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker><style>.T{font:700 22px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.P{font:700 17px -apple-system,"PingFang SC",sans-serif;fill:#0f172a}.B{font:14px -apple-system,"PingFang SC",sans-serif;fill:#334155}.S{font:12px -apple-system,"PingFang SC",sans-serif;fill:#475569}.M{font:italic 15px Georgia,serif;fill:#0f172a}</style></defs><rect width="1200" height="430" rx="18" fill="#f8fafc"/><text x="42" y="38" class="T">谱定理：结构条件把相似对角化升级为正交 / 酉对角化</text>
<g transform="translate(30 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">A  条件与结论</text><rect x="42" y="66" width="276" height="58" rx="12" fill="#ede9fe" stroke="#8b5cf6"/><text x="78" y="91" class="M">A*A = AA*  （复正规）</text><text x="83" y="112" class="S">实对称 / Hermitian 是重要特例</text><path d="M180 125V161" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="42" y="166" width="276" height="66" rx="12" fill="#dcfce7" stroke="#22c55e"/><text x="75" y="193" class="M">A = UΛU*</text><text x="66" y="217" class="B">U*U=I：标准正交特征基</text><text x="35" y="270" class="S">自伴：λᵢ∈ℝ　　半正定：λᵢ≥0</text><text x="35" y="296" class="S">实正规不一定实对角化：旋转给出 2×2 块</text><text x="35" y="322" class="S">结构定理不自动等于数值算法</text></g>
<g transform="translate(420 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">B  谱投影：重复特征值也不怕</text><circle cx="180" cy="170" r="112" fill="#f8fafc" stroke="#cbd5e1"/><path d="M180 170L180 58A112 112 0 0 1 277 226Z" fill="#dbeafe"/><path d="M180 170L277 226A112 112 0 0 1 83 226Z" fill="#dcfce7"/><path d="M180 170L83 226A112 112 0 0 1 180 58Z" fill="#fef3c7"/><text x="204" y="105" class="M">E₁</text><text x="206" y="235" class="M">E₂</text><text x="111" y="158" class="M">E₃</text><text x="35" y="304" class="M">A = Σⱼ λⱼPⱼ</text><text x="35" y="326" class="S">PᵢPⱼ=0，ΣPⱼ=I；子空间内换基不改变 Pⱼ</text></g>
<g transform="translate(810 58)"><rect width="360" height="340" rx="16" fill="white" stroke="#cbd5e1"/><text x="20" y="31" class="P">C  谱函数：同一特征方向逐点变换</text><rect x="20" y="65" width="318" height="54" rx="10" fill="#dbeafe"/><text x="42" y="98" class="M">f(A) = U f(Λ) U* = Σ f(λⱼ)Pⱼ</text><g transform="translate(35 155)"><line x1="0" y1="110" x2="275" y2="110" stroke="#94a3b8"/><line x1="35" y1="135" x2="35" y2="0" stroke="#94a3b8"/><circle cx="75" cy="84" r="6" fill="#2563eb"/><circle cx="135" cy="58" r="6" fill="#2563eb"/><circle cx="215" cy="24" r="6" fill="#2563eb"/><line x1="75" y1="110" x2="75" y2="84" stroke="#60a5fa"/><line x1="135" y1="110" x2="135" y2="58" stroke="#60a5fa"/><line x1="215" y1="110" x2="215" y2="24" stroke="#60a5fa"/><text x="63" y="130" class="S">λ₁</text><text x="123" y="130" class="S">λ₂</text><text x="203" y="130" class="S">λ₃</text></g><text x="20" y="317" class="S">平方根、逆平方根、指数与谱滤波都由此统一</text></g></svg>
